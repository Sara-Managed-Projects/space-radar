<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D model viewer | Space Radar</title>
<meta name="description" content="One of Space Radar's own 3D models of a spacecraft, to turn and zoom. Made to be embedded: see models.spaceradar.ai for the catalog.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0E14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12.5' fill='%230B0E14'/><circle cx='32' cy='32' r='14.38' fill='%232E6FB8'/></svg>">
<link rel="modulepreload" href="../vendor/three.module.min.js">
<link rel="modulepreload" href="../vendor/GLTFLoader.js">
<link rel="modulepreload" href="../vendor/meshopt_decoder.module.js">
<link rel="stylesheet" href="../css/tokens.css">
<!-- THE ONE-MODEL VIEWER (docs/EMBEDDING.md, "One 3D model"). A tiny page: no app boot, no service worker, no storage,
     nothing but the site's own three.js, its glTF loader and the meshopt decoder, the index scripts/models_catalog.py
     writes (models.json) and the one .glb. models.spaceradar.ai frames it on every model page; anyone may. -->
<style>
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none}
body.clear{background:transparent}
canvas{display:block;width:100%;height:100%;outline:none;cursor:grab}
canvas:active{cursor:grabbing}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:10px 12px;pointer-events:none;
  background:linear-gradient(to top,#0B0E14cc,transparent)}
body.clear .bar{background:none}
.bar>*{pointer-events:auto}
.name{flex:1;min-width:0;font:600 .95rem/1.2 var(--head);letter-spacing:.01em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name a{color:inherit;text-decoration:none}.name a:hover{color:var(--atm)}
.name small{display:block;font:400 .72rem/1.3 var(--mono);color:var(--dim)}
.btn{appearance:none;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);
  background:#111723d9;color:var(--tx);cursor:pointer;padding:0}
.btn:hover{border-color:var(--atm);color:var(--atm)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:400 .9rem/1.5 var(--sans);color:var(--dim);pointer-events:none}
.msg b{display:block;font:600 1.1rem/1.2 var(--head);color:var(--tx);margin-bottom:4px}
.msg a{pointer-events:auto}
.hint{position:fixed;top:10px;left:12px;font:400 .72rem/1.3 var(--mono);color:var(--dim);opacity:.85;pointer-events:none;transition:opacity .6s}
.hint.gone{opacity:0}
@media(max-width:360px){.name small{display:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D model: drag to turn, scroll or pinch to zoom, arrow keys to turn, plus and minus to zoom"></canvas>
<p class="hint" id="hint" aria-hidden="true">Drag to turn · scroll to zoom</p>
<div class="msg" id="msg" role="status" aria-live="polite"><span>Loading the model…</span></div>
<div class="bar">
  <div class="name" id="name"></div>
  <button class="btn" id="turn" type="button" aria-pressed="true" aria-label="Stop turning" hidden><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <button class="btn" id="reset" type="button" aria-label="Reset the view"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
