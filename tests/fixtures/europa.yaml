# The growth fixture (spec 0002 § 6, requirement 3). Adding a world, a layer of things around
# it, and a site on its surface must be THIS FILE and nothing under app/.
#
# Europa is chosen because nothing in stage 1 anticipates it: it orbits Jupiter rather than the
# Sun, it needs a frame that composes two levels up, and it has no textures in the tree yet.
worlds:
  - id: europa
    display: Europa
    parent: jupiter
    radius_km: 1560.8
    unit_km: 100
    ephemeris: {propagator: body, body: Jupiter}   # placeholder until a moon ephemeris exists
    rotation: {kind: sidereal, period_h: 85.228}
    frames: [inertial, fixed]
    look: {textures: europa}

textures:
  - {id: europa, source: "https://www.solarsystemscope.com/textures/", licence: "CC BY 4.0", credit: "Planet textures (c) Solar System Scope, CC BY 4.0", tiers: [2048]}

sources:
  - id: horizons-europa-orbiters
    url: https://ssd.jpl.nasa.gov/api/horizons.api
    auth: none
    cadence: 24h
    freshness_max: 168h
    parser: horizons
    list: harvest/lists/horizons-ids.yaml
    outputs: [europa-orbiters.json]
    attribution: "Ephemerides: JPL Horizons"

layers:
  - id: europa-orbiters
    display: Spacecraft at Europa
    moments: {wonder: on, now: off, next: off}
    source: horizons-europa-orbiters
    propagator: sampled
    frame: europa-inertial
    style: {kind: model, model: probe-generic, glyph: probe, colour: probe, near_km: 50000}
    card: probe
    select: {all: true}
    budget: {max_items: 10}

sites:
  - {id: conamara, display: "Conamara Chaos", class: surface, world: europa, lat: 9.5, lon: 274.0, doing: "A jumble of broken ice rafts, evidence of an ocean under the crust."}

# A rocket must be a row too (registry/rockets.yaml). Two rows, because there are two ways a row
# earns its keys: `pslv-xl` refines an existing family stand-in with a full_name the live feed
# really returns, and `ariane-5` is a vehicle the feed CANNOT return, which is legal only because
# it says `not_in_feed:` and why. If either needed a change to scene/models.js, the parser or the
# card, the architecture regressed -- the drawing composes from these fields and nothing else.
# (A row keyed on a string the feed has not yet returned adds an `observed:` row alongside it;
# that section is a growth target too.)
rockets:
  - id: pslv-xl
    display: "PSLV-XL"
    match: {full_name: ["PSLV XL"]}
    stands_for: variant
    height_m: 44.0
    core_dia_m: 2.8
    taper: tube
    top: {kind: fairing, dia_m: 3.2}
    boosters: {shape: solid_slim, count: 6, dia_m: 1.0, len_m: 12.0}
    engines: {count: 1, pattern: single}
    livery: unknown
    class: measured
    source: "Wikipedia PSLV: 44 m, 2.8 m core, 3.2 m fairing; the XL carries six extended-length PSOM strap-ons of 1 m x 12 m"

  - id: ariane-5
    display: "Ariane 5"
    match: {full_name: ["Ariane 5"]}
    not_in_feed: "retired; the final flight was 2023-07-05. Here so the registry is complete, not so it draws."
    stands_for: family
    height_m: 52.0
    core_dia_m: 5.4
    taper: tube
    top: {kind: fairing, dia_m: 5.4}
    boosters: {shape: solid_fat, count: 2, dia_m: 3.06, len_m: 31.6}
    engines: {count: 1, pattern: single}
    livery: unknown
    class: measured
    source: "Wikipedia Ariane 5: 46-52 m depending on configuration, 5.4 m core stage and fairing, two EAP boosters of 3.06 m x 31.6 m, one Vulcain 2"
