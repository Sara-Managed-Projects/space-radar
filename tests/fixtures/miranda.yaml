# The growth fixture (spec 0002 § 6, requirement 3). Adding a world, a layer of things around
# it, and a site on its surface must be THIS FILE and nothing under app/.
#
# Miranda is chosen because nothing in the app anticipates it: it orbits Uranus rather than the
# Sun, it needs a frame that composes two levels up, it has no ephemeris of its own in
# astronomy-engine or in propagate/moons.js, and it has no textures in the tree. (This fixture was
# Europa until 2026-09-22, when Europa became a real row in registry/worlds.yaml, and then
# Enceladus until the same day's second batch of moons made that one real too. A duplicate id is
# not growth.) Radius: JPL's satellite physical parameters, 235.8 km. Rotation: synchronous with
# its 1.413479-day orbit (Wikipedia, Miranda), 33.923 h.
worlds:
  - id: miranda
    display: Miranda
    parent: uranus
    radius_km: 235.8
    unit_km: 100
    ephemeris: {propagator: body, body: Uranus}   # placeholder until a moon ephemeris exists
    rotation: {kind: sidereal, period_h: 33.923}
    frames: [inertial, fixed]
    look: {textures: miranda}

textures:
  - {id: miranda, source: "https://www.solarsystemscope.com/textures/", licence: "CC BY 4.0", credit: "Planet textures (c) Solar System Scope, CC BY 4.0", tiers: [2048]}

sources:
  - id: horizons-miranda-orbiters
    url: https://ssd.jpl.nasa.gov/api/horizons.api
    auth: none
    browser: false
    cadence: 24h
    freshness_max: 168h
    parser: horizons
    list: harvest/lists/horizons-ids.yaml
    outputs: [miranda-orbiters.json]
    attribution: "Ephemerides: JPL Horizons"

layers:
  - id: miranda-orbiters
    display: Spacecraft at Miranda
    moments: {wonder: on, now: off, next: off}
    source: horizons-miranda-orbiters
    propagator: sampled
    frame: miranda-inertial
    style: {kind: model, model: probe-generic, glyph: probe, colour: probe, near_km: 50000}
    card: probe
    select: {all: true}
    budget: {max_items: 10}

sites:
  # USGS Gazetteer of Planetary Nomenclature (feature 6359, through Wikipedia's Verona Rupes
  # article): 18.30 S, 347.80 E.
  - {id: verona-rupes, display: "Verona Rupes", class: surface, world: miranda, lat: -18.30, lon: 347.80, doing: "A cliff Voyager 2 photographed in 1986, perhaps the tallest in the solar system."}

# A rocket must be a row too (registry/rockets.yaml). Two rows, because there are two ways a row
# earns its keys: `pslv-xl` refines an existing family stand-in with a full_name the live feed
# really returns, and `ariane-5` is a vehicle the feed CANNOT return, which is legal only because
# it says `not_in_feed:` and why. If either needed a change to scene/models.js, the parser or the
# card, the architecture regressed -- the drawing composes from these fields and nothing else.
# (A row keyed on a string the feed has not yet returned adds an `observed:` row alongside it;
# that section is a growth target too.)
rockets:
  - id: pslv-xl
    display: "PSLV-XL"
    match: {full_name: ["PSLV XL"]}
    stands_for: variant
    height_m: 44.0
    core_dia_m: 2.8
    taper: tube
    top: {kind: fairing, dia_m: 3.2}
    boosters: {shape: solid_slim, count: 6, dia_m: 1.0, len_m: 12.0}
    engines: {count: 1, pattern: single}
    livery: unknown
    class: measured
    source: "Wikipedia PSLV: 44 m, 2.8 m core, 3.2 m fairing; the XL carries six extended-length PSOM strap-ons of 1 m x 12 m"

  - id: ariane-5
    display: "Ariane 5"
    match: {full_name: ["Ariane 5"]}
    not_in_feed: "retired; the final flight was 2023-07-05. Here so the registry is complete, not so it draws."
    stands_for: family
    height_m: 52.0
    core_dia_m: 5.4
    taper: tube
    top: {kind: fairing, dia_m: 5.4}
    boosters: {shape: solid_fat, count: 2, dia_m: 3.06, len_m: 31.6}
    engines: {count: 1, pattern: single}
    livery: unknown
    class: measured
    source: "Wikipedia Ariane 5: 46-52 m depending on configuration, 5.4 m core stage and fairing, two EAP boosters of 3.06 m x 31.6 m, one Vulcain 2"

# And an oddity must be a row (registry/oddities.yaml). The eleventh odd thing is one row plus
# `python3 scripts/gen_oddities_js.py`; it ships that afternoon drawing a labelled placeholder
# and saying so on its own card. This one is `on_surface` on the world the fixture just added,
# which is the case with the most moving parts: it anchors on the site row two sections up, so it
# proves that a surveyed coordinate still lives in exactly one place after the registry grows.
oddities:
  - id: verona-drill-bit
    display: "A drill bit at Verona Rupes"
    klass: oddity
    where:
      kind: on_surface
      world: miranda
      anchor:
        id: verona-rupes
        lat: -18.30
        lon: 347.80
        uncertainty_m: 25
        of: "the Verona Rupes landing ellipse"
        source: "the growth fixture; there is no lander at Miranda and this row is a test"
      object:
        precision_m: unknown
        how: unsurveyed
        source: "the growth fixture"
    position_class: inferred
    shape: {build: generic, budget_tris: 200, stands_for: generic, drawn_name: "a drill bit"}
    fact: "A fixture row, not a fact about the world: it exists so the growth test can add an odd
           thing without touching a line of JavaScript."
    cite: "tests/fixtures/miranda.yaml"
    source: "This row is part of tests/fixtures/miranda.yaml and describes nothing that exists."

  # And the other half of the growth claim: a thing bolted to a spacecraft the app already draws
  # is also just a row. It gets no dot and no id anything resolves -- scene/models.js hangs it on
  # New Horizons' model from `mount:` and ui/cards.js reaches it from New Horizons' card -- so
  # adding one touches registry/oddities.yaml and the generated mirror, and nothing else.
  - id: new-horizons-fixture-plaque
    display: "A fixture plaque on New Horizons"
    klass: oddity
    where:
      kind: attached
      to: deep-new-horizons
      mount: {x: 0.0, y: 0.04, z: 0.0, scale: 0.06, face: deck}
      mount_class: illustrative
    position_class: inherit
    shape: {build: generic, budget_tris: 200, stands_for: generic, drawn_name: "a plaque"}
    fact: "A fixture row, not a fact about the spacecraft: it exists so the growth test can bolt
           something to a probe without touching a line of JavaScript."
    cite: "tests/fixtures/miranda.yaml"
    source: "This row is part of tests/fixtures/miranda.yaml and describes nothing that exists."

# AND A TRIP MUST BE A ROW (registry/tours.yaml). The third trip is this section plus
# `python3 scripts/gen_tours_js.py`, and nothing under site/js/ -- the state machine in
# ui/trip.js reads the mirror and has never heard of any particular trip.
#
# It visits the world, the layer, the site and the oddity the sections above just added, which is
# the point: a trip is written against the OTHER registries, so if growing them left a target
# form that no longer resolves, this is where it shows up.
tours:
  - id: miranda-tour
    title: "The innermost round moon"
    blurb: "A fixture trip that visits everything this fixture added."
    requires: [miranda-orbiters]
    stops:
      - id: the-world
        target: {world: miranda}
        # A moon of Uranus is drawn around a Uranus that is itself drawn nearer and larger than it
        # is (scene/worlds.js), so from Earth's stage this stop would fly to a place on the screen
        # where nothing is drawn. Naming the stage is what a stop about a new world costs, and the
        # validator refuses the pairing rather than letting it be found in a browser.
        stage: miranda
        frame_radii: 5.0
        card:
          title: "Miranda"
          body: >-
            Of Uranus's five round moons, the one that orbits closest. A fixture row, and not a fact
            about the world.

      - id: the-cliff
        target: {site: verona-rupes}
        distance_km: 400
        card:
          title: "Verona Rupes"
          body: >-
            A cliff photographed by Voyager 2. A fixture row, and not a fact about the world,
            written so that the growth test has a surface site to fly to.

      - id: the-drill-bit
        target: {record: verona-drill-bit}
        distance_km: 400
        card:
          title: "A drill bit on the cliff"
          body: >-
            There is no lander at Miranda and there is no drill bit. This stop exists so the growth
            test can add a trip without touching a line of JavaScript.
