<!doctype html>
<!-- Built by scripts/build_seo.py from templates/404.html. What CloudFront answers for a path with
     nothing behind it, once its error response names /404.html. It can be served at any depth, so
     every link is root-absolute. noindex: nobody should find it by searching. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing at this address | Space Radar</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="{{icon}}">
{{styles}}
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
{{header}}
<main id="main">
<header class="ph"><div class="wrap ph__in">
<p class="eyebrow">Error 404</p>
<h1>Nothing at this address</h1>
<p class="lead">There is no page here. It may have moved, or the link may have a typing mistake in it.</p>
<div class="cta"><a class="btn btn--map" href="/">Open the live map</a><p>The map and everything on it are still where they were.</p></div>
</div></header>
</main>
{{footer}}
{{script}}</body>
</html>
