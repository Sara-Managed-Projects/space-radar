<!doctype html>
<meta charset="utf-8">
<title>moon sheet</title>
<!--
  A CONTACT SHEET FOR THE SMALL-BODY SHAPE FILES (release 1.9.0, internal #1066). Not part of the site: it lives here, outside site/.
  One row a moon: a spacecraft photograph, then the file site/models/moon-<name>.glb seen from four sides, each lit from the camera's
  upper left. It loads the file with the app's own loader and meshopt decoder and draws it with a plain lit grey, NOT the app's toon
  material or frame: it shows the SHAPE the file holds, which is what a person who knows the moon compares with the photograph.
  The app's own frames are the look probe `r190-moons`.

    python3 tools/serve.py . 8190 &
    node tools/cdp.mjs 'http://127.0.0.1:8190/tools/moon-sheet.html?m=janus,pan' probe.js --width=800 --height=400 > out.json

  where probe.js sets `window.__refs = { janus: <a data: URI of its photograph>, ... }`, waits for `window.__loaded`, awaits
  `window.go()` and returns `window.__sheets` (a PNG data URI a moon, five panels of 360 px). `m` is a comma-separated list of names
  (site/models/moon-<name>.glb).
-->
<style>body { margin: 0; background: #000; }</style>
<script type="module">
import * as THREE from '../site/vendor/three.module.min.js';
import { GLTFLoader } from '../site/vendor/GLTFLoader.js';
import { MeshoptDecoder } from '../site/vendor/meshopt_decoder.module.js';

const CELL = 360;
window.__refs = window.__refs || {};
window.__sheets = {};
window.__err = null;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(CELL, CELL);
renderer.setClearColor(0x000000, 1);

function image(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image ' + String(src).slice(0, 60))); i.src = src; });
}

async function sheet(name) {
  const gltf = await new Promise((res, rej) => {
    const l = new GLTFLoader();
    l.setMeshoptDecoder(MeshoptDecoder);
    l.load(`../site/models/moon-${name}.glb`, res, undefined, rej);
  });
  const root = gltf.scene;
  root.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshLambertMaterial({ color: 0xd8d8d8 }); });
  const scene = new THREE.Scene();
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const sun = new THREE.DirectionalLight(0xffffff, 2.4);
  scene.add(sun);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 1e5);
  const dist = sphere.radius / Math.sin((cam.fov / 2) * Math.PI / 180) * 1.08;
  const out = document.createElement('canvas');
  out.width = CELL * 5; out.height = CELL;
  const g = out.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, out.width, out.height);
  // the photograph, contained
  const ref = window.__refs[name];
  if (ref) {
    const im = await image(ref);
    const k = Math.min(CELL / im.width, CELL / im.height);
    g.drawImage(im, (CELL - im.width * k) / 2, (CELL - im.height * k) / 2, im.width * k, im.height * k);
  }
  // four sides round the model's +z (the pole of the file's grid), the camera 20 degrees above its equator
  for (let k = 0; k < 4; k++) {
    const az = (k * 90 + 30) * Math.PI / 180, el = 20 * Math.PI / 180;
    cam.position.set(sphere.center.x + dist * Math.cos(el) * Math.cos(az), sphere.center.y + dist * Math.cos(el) * Math.sin(az), sphere.center.z + dist * Math.sin(el));
    cam.up.set(0, 0, 1);
    cam.lookAt(sphere.center);
    cam.updateMatrixWorld();
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    sun.position.copy(cam.position).addScaledVector(right, -dist * 0.8).addScaledVector(up, dist * 0.7);
    sun.target.position.copy(sphere.center);
    scene.add(sun.target);
    renderer.render(scene, cam);
    g.drawImage(renderer.domElement, (k + 1) * CELL, 0);
  }
  g.fillStyle = '#9aa'; g.font = '16px sans-serif';
  g.fillText(name + ' (photograph)', 8, CELL - 10);
  for (let k = 0; k < 4; k++) g.fillText(`model, side ${k + 1}`, (k + 1) * CELL + 8, CELL - 10);
  window.__sheets[name] = out.toDataURL('image/png');
}

window.go = async () => {
  try {
    const names = (new URLSearchParams(location.search).get('m') || '').split(',').filter(Boolean);
    for (const n of names) await sheet(n);
    window.__ready = true;
  } catch (e) { window.__err = String(e && e.stack || e); }
};
window.__loaded = true;
</script>
