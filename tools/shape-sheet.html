<!doctype html>
<meta charset="utf-8">
<title>shape sheet</title>
<!--
  A CONTACT SHEET FOR THE PROCEDURAL SHAPES. Not part of the site: it lives here, outside site/,
  because site/ is served byte-for-byte and scripts/deploy.sh refuses anything it does not know.

    python3 -m http.server 8195           # from the repository root, not from site/
    open http://127.0.0.1:8195/tools/shape-sheet.html?m=telescope:gaia,probe:new-horizons

  `m` is a comma-separated list of klass:variant, and defaults to the five shapes that were being
  reviewed when this was written. `shade=N` draws every cell from the Nth on (0-based) INSIDE the
  Earth's shadow, 400 km up on the midnight side, through the same uniforms the app sets -- so the
  same model can be listed twice and read lit and eclipsed side by side (internal #388). `aim=1`
  turns every wing on a pivot to the Sun, as the app does each frame. It renders one model per cell and leaves the PNG on
  `window.__sheet.dataUrl`, so a headless browser can pull the image out without a screenshot.

  IT ADDS THE SAME TWO LIGHTS scene/worlds.js adds. A MeshToonMaterial in an unlit scene renders
  nearly black: the first version of this sheet had no lights, and the silhouettes were honest
  while every colour on it was a lie.
-->
<style>body{margin:0;background:#0b0e14}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
addEventListener('unhandledrejection', (e) => { window.__err = String(e.reason && e.reason.message || e.reason); });
addEventListener('error', (e) => { window.__err = String(e.message); });
import * as THREE from '../site/vendor/three.module.min.js';
import { modelFor, setSunDirection, setPlanetShine } from '../site/js/scene/models.js';
import { sampleAsteroids } from '../site/js/data/sample.js';
import { loadRealModel } from '../site/js/scene/realmodels.js';

// `asteroid#Eros` builds from the real bundled RECORD rather than a variant name, because an
// asteroid's shape is drawn from its own measured diameter and there is no other way to ask for it.
const byName = new Map(sampleAsteroids().map((r) => [r.name.toLowerCase(), r]));

const WHICH = (new URLSearchParams(location.search).get('m') || 'telescope:gaia,probe:solar-orbiter,probe:new-horizons,probe:default,telescope:default').split(',');
// `cols=4` and `cell=300` size the sheet; the defaults are the ones the first sheets were read at.
const QS = new URLSearchParams(location.search);
const CELL = Number(QS.get('cell')) || 340, COLS = Math.min(Number(QS.get('cols')) || 3, WHICH.length);
const ROWS = Math.ceil(WHICH.length / COLS);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(CELL * COLS, CELL * ROWS, false);
renderer.setScissorTest(true);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0e14');
setSunDirection(new THREE.Vector3(0.6, 0.5, 0.62));
// The SAME two lights scene/worlds.js puts in the real scene. A MeshToonMaterial with no light in
// the scene renders nearly black, which is what the first sheet showed and it said nothing about
// the models: the shapes read, the colours were a lie.
const sun = new THREE.DirectionalLight(0xfff4e6, 3.0);
sun.position.set(0.6, 0.5, 0.62).multiplyScalar(100);
scene.add(sun, new THREE.AmbientLight(0x2a3550, 0.35));

const labels = [];
for (let i = 0; i < WHICH.length; i++) {
  const [klass, variant] = WHICH[i].split(':');
  // `file:asteroid-eros.glb` loads a shipped model through the app's OWN loader, so the sheet shows
  // what the app shows: normalise() and the toon retexture included, not a bare GLTFLoader result.
  if (klass === 'file') {
    // `file:hubble.glb@telescope` names the class colour a file WOULD be painted if it carried no
    // colours of its own, which is the half of the before/after a recolour is judged by.
    const [file, colour = 'asteroid'] = variant.split('@');
    const obj = await loadRealModel({ file, colour });
    if (!obj) throw new Error(`could not load ${variant}`);
    obj.userData.cell = i;
    scene.add(obj);
    labels.push(WHICH[i]);
    continue;
  }
  const rec = variant && variant.startsWith('#') ? byName.get(variant.slice(1).toLowerCase()) : null;
  const obj = rec ? modelFor(klass, undefined, { record: rec }) : modelFor(klass, variant);
  obj.userData.cell = i;
  scene.add(obj);
  labels.push(WHICH[i]);
}
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
// Three-quarter view: the angle a shape sheet has to be read at, or a flat disc and a flat plate
// look the same.
cam.position.set(1.5, 1.05, 1.9);
cam.lookAt(0, 0, 0);

const SHADE_FROM = QS.has('shade') ? Number(QS.get('shade')) : Infinity;
const SUN = new THREE.Vector3(0.6, 0.5, 0.62).normalize();
const EARTH_R = 100; // model units; the model sits 6.3 % of a radius up, as the ISS does
for (const o of scene.children) {
  if (o.userData.cell === undefined) continue;
  const i = o.userData.cell;
  // The same sum as updateModelAttitude's last step, for a model the sheet has not turned.
  if (QS.get('aim') === '1' && o.userData.panelPivots) for (const p of o.userData.panelPivots) p.rotation.x = Math.atan2(SUN.z, SUN.y);
  if (i >= SHADE_FROM) {
    setPlanetShine('earth', SUN.clone().multiplyScalar(EARTH_R * 1.063), EARTH_R);
    sun.intensity = 3.0; // the lamp stays on: taking the sunlight away is the shader's job, and this shows it does
  } else {
    setPlanetShine(null);
  }
  const cx = (i % COLS) * CELL, cy = (ROWS - 1 - Math.floor(i / COLS)) * CELL;
  renderer.setViewport(cx, cy, CELL, CELL);
  renderer.setScissor(cx, cy, CELL, CELL);
  for (const p of scene.children) if (p.userData.cell !== undefined) p.visible = (p === o);
  renderer.render(scene, cam);
}
window.__sheet = { dataUrl: canvas.toDataURL('image/png'), labels, cols: COLS, rows: ROWS, cell: CELL };
window.__ready = true;
</script>
