# The spacecraft the deep-space layer draws, and the Horizons request that fetches each one.
# registry/sources.yaml[horizons-deep-space] points here. The list is the data; the URL is the
# endpoint; the harvester makes one request per id, in order, with `pause_s` between them, and
# writes ONE snapshot whose body maps id -> the Horizons response text.
#
# Every id below is one site/js/data/sample.js sampleDeepSpace() or scene/realmodels.js `horizons:`
# names today. -170 and -31 were VERIFIED by fetch on 2026-09-06 (docs/data-sources.md §4); the
# rest were confirmed against Horizons' own object header on 2026-09-08 when this list was written.
# tests/test_deep_space.mjs holds the two sides together: every id here has a record, and every
# record with an id is here.
#
# THE TEN FROM -255 DOWN were added on 2026-09-22. Each was checked two ways that day: the object
# header (COMMAND='<id>', OBJ_DATA=YES, MAKE_EPHEM=NO) names the craft, and a VECTORS request with
# exactly the params below returned 125 rows for 2026-09-21..2026-10-22. What the header said:
#   id    header revised  navigation data through           trajectory file ends
#   -255  2026-09-01      2026-08-11, then JPL's prediction  2029-Feb-11
#   -49   2025-10-25      2025-09-08 (Lucy updates only its reference trajectory, per its header)
#                                                            2033-Apr-02
#   -159  2026-08-18      2026-08-12                         2034-Sep-03
#   -28   2026-09-21      2026-09-16 (ESA)                   2031-Jul-21
#   -121  2026-09-21      2026-09-14 (ESA)                   2027-Apr-10
#   -91   2026-09-01      2026-08-30 (ESA)                   2026-Nov-04
#   -64   2025-09-18      (a 2025 cruise solution to Apophis) 2030-Mar-22
#   -37   2026-09-01      2026-08-25 (JAXA)                  2026-Nov-27
#   -62   2026-06-03      2026-05-28                         2026-Nov-26
#   -234  2026-09-01      2026-08-20                         2026-Dec-18
# A file that ends inside the 30-day window is clamped by the harvester (harvest/run.py), and one
# that has ended leaves its record on the bundled stand-in; neither drops the craft.
#
# LEFT OUT, the same day, and why, so nobody spends the afternoon again:
#   MAVEN (-202)     no contact since 2025-12-06, and its file ends 2026-Mar-01 ("No ephemeris
#                    after"), so there is nothing current to fetch.
#   Tianwen-1        Horizons has only an unofficial 2020 cruise track (-9901491) that stops an
#                    hour after Mars arrival in 2021. Tianwen-2 is not in Horizons at all.
#   LRO (-85)        current, but it laps the Moon in about two hours, and Hermite between these
#                    6-hourly samples put it up to 5 868 km from its real place (measured against
#                    1-hour samples, 2026-09-22..25) -- more than three Moon radii. Mars Express
#                    (-41, 15 006 km) fails the same way. So does MRO, already listed: 17 923 km.
#                    Hope's 55-hour orbit is fine at 251 km.
#                    BOTH CAME BACK the same day, with `center:` below.
#
# `center:` ON A ROW (added 2026-09-22) replaces CENTER for that id alone: the five craft that
# circle another world are fetched RELATIVE TO IT, and data/parsers.js draws them from it
# (propagate/orbiter.js). Heliocentric vectors cannot place them, for three reasons measured that
# day against Horizons at 10-minute steps, 2026-09-23..25, and at perijove for Juno:
#   * six hours is three of MRO's laps. Hermite through the 6-hourly samples was 17 914 km from
#     MRO, 15 061 from Mars Express, 6 287 from LRO, 104 975 from Juno at its 2026-10-11 perijove
#     (251 for Hope; 0.01 to 9 km for every craft on its own path round the Sun). Drawn, MRO went
#     483 to 17 470 km from Mars's centre -- in and out of a planet 3 389.5 km in radius.
#   * the planet on the screen is Astronomy Engine's, and it differs from JPL's by up to 3 103 km
#     for Mars, 17 904 for Jupiter and 1 251 for the Moon (daily, 2026-09-01..12-31). A perfect
#     heliocentric vector still lands that far off the drawn planet. MRO's orbit is 236 km up.
#   * Horizons' JD is TDB, 69.184 s ahead of UTC. Read as UTC it slides the craft 1 644 km along
#     Mars's path relative to Mars.
# Relative to the world, six-hourly states joined by two-body arcs stay within 160 km of MRO (58
# at 3-hourly, 17 at hourly), 88 of Mars Express, 902 of Juno at perijove, 6 of LRO, 0.3 of Hope,
# over 2026-09-22..10-22, and never inside the world. Six hours is kept: one step for the list,
# and the card states each of those numbers (data/sample.js PLANET_ORBITERS).
#
# GAIA (-139479) joined the same day: it left L2 on 2025-03-28 for its own orbit round the Sun,
# 83.7 million km from Earth on 2026-09-22, so it is heliocentric like the others.
#
# `params` is the query string, with three placeholders the harvester fills: {id}, {start}, {stop}.
# Horizons wants its string values single-quoted, hence the quotes inside the quotes.
# `window` is the sample span around the run time: propagate/sampled.js interpolates inside a
# record's range and stops answering 7 days outside it, so a daily fetch with a day behind and
# thirty ahead is never on the edge.

params:
  format: json
  EPHEM_TYPE: VECTORS
  CENTER: "'500@10'"        # heliocentric, the frame the deep-space layer draws in
  STEP_SIZE: "'6 h'"
  VEC_TABLE: "'2'"          # position and velocity, which cubic Hermite needs
  OUT_UNITS: "'KM-S'"
  CSV_FORMAT: "'YES'"
  COMMAND: "'{id}'"
  START_TIME: "'{start}'"
  STOP_TIME: "'{stop}'"

window: {before: 1d, after: 30d}
pause_s: 0.5

ids:
  - {id: "-170", name: "James Webb Space Telescope", app_id: deep-jwst}
  - {id: "-21",  name: "SOHO",                       app_id: deep-soho}
  - {id: "-74",  name: "Mars Reconnaissance Orbiter", app_id: deep-mro, center: "'500@499'"}
  - {id: "-61",  name: "Juno",                       app_id: deep-juno, center: "'500@599'"}
  - {id: "-31",  name: "Voyager 1",                  app_id: deep-voyager-1}
  - {id: "-32",  name: "Voyager 2",                  app_id: deep-voyager-2}
  - {id: "-98",  name: "New Horizons",               app_id: deep-new-horizons}
  - {id: "-96",  name: "Parker Solar Probe",         app_id: deep-parker}
  - {id: "-255", name: "Psyche",                     app_id: deep-psyche}
  - {id: "-49",  name: "Lucy",                       app_id: deep-lucy}
  - {id: "-159", name: "Europa Clipper",             app_id: deep-europa-clipper}
  - {id: "-28",  name: "JUICE",                      app_id: deep-juice}
  - {id: "-121", name: "BepiColombo",                app_id: deep-bepicolombo}
  - {id: "-91",  name: "Hera",                       app_id: deep-hera}
  - {id: "-64",  name: "OSIRIS-APEX",                app_id: deep-osiris-apex}
  - {id: "-37",  name: "Hayabusa2",                  app_id: deep-hayabusa2}
  - {id: "-62",  name: "Hope (Emirates Mars Mission)", app_id: deep-hope, center: "'500@499'"}
  - {id: "-234", name: "STEREO-A",                   app_id: deep-stereo-a}
  - {id: "-41",  name: "Mars Express",               app_id: deep-mars-express, center: "'500@499'"}
  - {id: "-85",  name: "Lunar Reconnaissance Orbiter", app_id: deep-lro, center: "'500@301'"}
  - {id: "-139479", name: "Gaia",                    app_id: deep-gaia}
