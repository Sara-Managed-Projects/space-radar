  # people.smp.uq.edu.au/HolgerBaumgardt/globular/, column R_sun (kpc, with its error): Gaia EDR3 parallaxes, HST- and Gaia-based kinematic distances,
  # subdwarf main-sequence fitting and star counts, combined. Open clusters: Hunt & Reffert 2023, A&A 673, A114, VizieR J/A+A/673/A114/clusters,
  # median distance (dist50) from Gaia DR3 parallaxes; the catalogue's 16th to 84th percentile spread is tiny (statistical only) and Gaia
  # parallaxes carry a zero-point bias of a few tens of microarcseconds (Lindegren et al. 2021, arXiv:2012.01742, abstract), so no range is shown.
  # The Messier table (Wikipedia) lagged the literature: Gaia-era globular-cluster and open-cluster distances, and tip-of-the-red-giant-branch
