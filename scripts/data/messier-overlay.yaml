# What a Messier row knows beyond the table (internal spec 0075 task 2): the object model's fields
# for rows that come from OpenNGC and scripts/data/messier-distances.txt. Keyed by the record id
# without `dso-`. The fields are registry/dso-hand.yaml's (its head says what each means);
# scripts/build-dso.py applies them, scripts/check_registry.py checks them.
version: 1
objects:
  # Andromeda's two bright companions (public #385) are drawn beside her and step back while her
  # photograph holds them. Companions, not parts: the card says "a companion of", not "inside".
  # Andromeda's viewing angles (spec 0076 W4-a, spec 0075 task 62): the record said 35 (OpenNGC's catalogue ellipse, which
  # still draws the photograph's frame, `posAngDeg`) while the hero turned the disc by 38. One orientation for the disc,
  # the hero's own (registry/deepsky-heroes/m31.yaml): de Vaucouleurs 1958, ApJ 128, 465, 38 and 77 degrees from face on,
  # read through the later papers that adopt them; the NW side near. The 3-degree difference is the catalogue ellipse's
  # (isophotes of the whole galaxy) against the disc's line of nodes (the disc alone).
  m31:
    orientation: {pa_deg: 38, incl_deg: 77, near_side: NW,
                  source: "de Vaucouleurs 1958, ApJ 128, 465 (as the hero profile cites it; the paper itself is not yet read); near side from the dust lanes against the bulge"}
  m32:
    parent: m31
  m110:
    parent: m31
  # De Mairan's Nebula is the northern part of the Orion Nebula, split from it by a dark lane. The
  # table's 1 300 ly is a rounded number that drew it 44 ly in front of a nebula 35 ly across.
  m43:
    parent: m42
    distance: {method: assumed-member-of-parent, source: parent}
  # The Ring Nebula (internal spec 0076 W3-b, #872): the Messier table's 2 300 to 2 700 ly is replaced by Gaia DR3's
  # parallax of the central star, source_id 2090486618786534784: 1.2696 +/- 0.0438 mas (VizieR I/355/gaiadr3, read
  # 2026-10-17; no zero-point correction): 1 / parallax = 787.6 pc = 2 569 ly, one sigma 2 483 to 2 661 ly.
  # Gaia data: ESA/Gaia/DPAC, CC BY-NC 3.0 IGO.
  m57:
    distance: {method: parallax, value_ly: 2569, low: 2483, high: 2661,
               source: "Gaia DR3 parallax of the central star, source_id 2090486618786534784: 1.2696 +/- 0.0438 mas (ESA/Gaia/DPAC, CC BY-NC 3.0 IGO; VizieR I/355/gaiadr3)", read: 2026-10-17}
