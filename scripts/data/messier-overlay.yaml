# What a Messier row knows beyond the table (internal spec 0075 task 2): the object model's fields
# for rows that come from OpenNGC and scripts/data/messier-distances.txt. Keyed by the record id
# without `dso-`. The fields are registry/dso-hand.yaml's (its head says what each means);
# scripts/build-dso.py applies them, scripts/check_registry.py checks them.
version: 1
objects:
  # NICKNAMES (internal #294). OpenNGC's first common name was kept for every Messier row, and some are French (M11's "Amas de l'Ecu de
  # Sobieski"), abbreviated (M24, M13's "Hercules Globular Cluster") or nobody's (M4's
  # "Spider", M5's "Rose", M35's "Shoe-Buckle", M67's "King Cobra"). `common: null` leaves the row its M number alone, as M2 and M3 have.
  # The plain names (M11, M13, M17, M24, M43, M44, M76, M87) are the first names Wikipedia's List of Messier objects gives, opened 2026-11-15.
  # Each id's `common:` line sits in its block below (or in the short blocks before the refreshed distances).
  # Andromeda's two bright companions (public #385) are drawn beside her and step back while her
  # photograph holds them. Companions, not parts: the card says "a companion of", not "inside".
  # Andromeda's viewing angles (spec 0076 W4-a, spec 0075 task 62): the record said 35 (OpenNGC's catalogue ellipse, which
  # still draws the photograph's frame, `posAngDeg`) while the hero turned the disc by 38. One orientation for the disc,
  # the hero's own (registry/deepsky-heroes/m31.yaml): de Vaucouleurs 1958, ApJ 128, 465, 38 and 77 degrees from face on,
  # read through the later papers that adopt them; the NW side near. The 3-degree difference is the catalogue ellipse's
  # (isophotes of the whole galaxy) against the disc's line of nodes (the disc alone).
  # THE LEO TRIPLET IS THREE GALAXIES, NOT A NAME FOR ONE (review 2026-11-16). OpenNGC gives the group's name to both rows,
  # so M65 and M66 were both "Leo Triplet", shared one page address, and M66 had no page. NASA's Messier 66 page: M66 and
  # "its neighbor M65, both of which belong to the Leo Triplet of galaxies. (The third member, NGC 3628 ... is not included
  # in the Messier catalog)" (https://science.nasa.gov/mission/hubble/science/explore-the-night-sky/hubble-messier-catalog/messier-66/,
  # read 2026-11-16). Each keeps its M number alone; the `why` line says what the triplet is.
  m65:
    common: null
    why: "One of the Leo Triplet, three galaxies close together in the sky: M65, M66 and NGC 3628."
  m66:
    common: null
    why: "One of the Leo Triplet, three galaxies close together in the sky: M65, M66 and NGC 3628."
  # M40 IS TWO UNRELATED STARS ON ONE LINE OF SIGHT, so it has no one distance (review 2026-11-16). Gaia DR3 parallaxes, read on
  # SIMBAD 2026-11-16 (https://simbad.harvard.edu/simbad/sim-id?Ident=HD+238107 and ...HD+238108): HD 238107 3.2191 +/- 0.0118 mas
  # (1 013 light-years), HD 238108 6.9328 +/- 0.0155 mas (470 light-years). The table's 510 was neither. The mark is placed at
  # the nearer star; the range is the two stars, and the `why` line says so.
  m40:
    distance: {method: parallax, value_ly: 470, low: 470, high: 1013,
               source: "Gaia DR3 parallaxes of its two stars, read on SIMBAD: HD 238108 6.9328 mas (470 light-years, where the mark is placed) and HD 238107 3.2191 mas (1 013 light-years)", read: 2026-11-16}
    why: "Not a pair: two unrelated stars that happen to line up. One is about 470 light-years away and the other about 1 010, so there is no one distance to give."
  # M73 IS FOUR STARS THAT HAPPEN TO LINE UP (an asterism; SIMBAD files NGC 6994 as "not an object", read 2026-11-16), so its one
  # distance, the Messier table's rough 2 500 light-years, is only where the mark is put. No star's own distance was read for it.
  m73:
    why: "Four stars that happen to line up, not a cluster. The one distance here is only where the mark is placed: the stars are not together in space."
  m31:
    orientation: {pa_deg: 38, incl_deg: 77, near_side: NW,
                  source: "de Vaucouleurs 1958, ApJ 128, 465 (as the hero profile cites it; the paper itself is not yet read); near side from the dust lanes against the bulge"}
  m32:
    parent: m31
  m110:
    parent: m31
  # De Mairan's Nebula is the northern part of the Orion Nebula, split from it by a dark lane. The
  # table's 1 300 ly is a rounded number that drew it 44 ly in front of a nebula 35 ly across.
  m43:
    common: "De Mairan's Nebula"
    parent: m42
    distance: {method: assumed-member-of-parent, source: parent}
  # The Ring Nebula (internal spec 0076 W3-b, #872): the Messier table's 2 300 to 2 700 ly is replaced by Gaia DR3's
  # parallax of the central star, source_id 2090486618786534784: 1.2696 +/- 0.0438 mas (VizieR I/355/gaiadr3, read
  # 2026-10-17; no zero-point correction): 1 / parallax = 787.6 pc = 2 569 ly, one sigma 2 483 to 2 661 ly.
  # Gaia data: ESA/Gaia/DPAC, CC BY-NC 3.0 IGO.
  m57:
    distance: {method: parallax, value_ly: 2569, low: 2483, high: 2661,
               source: "Gaia DR3 parallax of the central star, source_id 2090486618786534784: 1.2696 +/- 0.0438 mas (ESA/Gaia/DPAC, CC BY-NC 3.0 IGO; VizieR I/355/gaiadr3)", read: 2026-10-17}

  m17:
    common: "Omega Nebula"
  m24:
    common: "Small Sagittarius Star Cloud"
  m76:
    common: "Little Dumbbell Nebula"

