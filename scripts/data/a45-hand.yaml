# dwarfs (a section sign) or sub-brown dwarfs (an ampersand) inside 20 ly, with RECONS parallaxes (Henry and others, recons.org;
# Gaia where the table says so). ra/dec J2000 of the system (a companion with its own entry has its own). `jmag` is the J-band
# magnitude the table prints: most are far too faint to see in visible light, so no visual magnitude is carried.
# columns: name, dist_ly, ra, dec, spect, mass_msun (the table's range, low end first), jmag, sub (1 = sub-brown dwarf / rogue-planet mass)
