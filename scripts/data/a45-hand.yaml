    name: El Gordo
    ra: "01 02 52.50"
    dec: "-49 14 58.0"
    z: 0.870
    aliases: [ACT-CL J0102-4915, SPT-CL J0102-4915]
    why: "'The Fat One': two clusters merging, about 2.1 quadrillion Suns in all. When it was found in 2011 it was the largest cluster known at its distance."
    source: "https://en.wikipedia.org/wiki/El_Gordo_(galaxy_cluster) (infobox: position, redshift 0.87; text: the largest distant cluster, mass reduced to about 2.1e15 solar masses; read 2026-10-28); Menanteau and others 2012, ApJ 748, 7, arXiv:1109.0953"
  - id: phoenix-cluster
    name: Phoenix Cluster
    ra: "23 44 40.9"
    dec: "-42 41 54"
    z: 0.597
    aliases: [SPT-CL J2344-4243]
    why: "Found by the South Pole Telescope: about two quadrillion Suns, and the most luminous X-ray cluster discovered."
    source: "https://en.wikipedia.org/wiki/Phoenix_Cluster (infobox: position, host galaxy redshift 0.597; text: detected by the South Pole Telescope, mass of the order of 2e15 solar masses, the most luminous X-ray cluster discovered; read 2026-10-28); McDonald and others 2012, Nature 488, 349, arXiv:1208.2962"
