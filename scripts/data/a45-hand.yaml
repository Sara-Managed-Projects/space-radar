# Hand-checked rows for scripts/gen_a45_data.py (release 1.5.0 stages A4 and A5). Every row names the page it was read from and
# the day (2026-10-28). Nothing here is a number from memory: a row whose source did not print a value does not carry one.
#
# NOT HERE, ON PURPOSE: WD J1011+2845. It is the end-to-end test of the data pipeline and arrives through registry/exotics.yaml.
version: 1
read_on: 2026-10-28

# --- the brown and sub-brown dwarfs within 20 light-years --------------------------------------------------------------------
