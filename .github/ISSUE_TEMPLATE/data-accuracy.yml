name: A number, name or position is wrong
description: Space Radar says something that is not true, or draws something in the wrong place.
labels: [bug, "area:space-accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Getting it right matters more to this project than anything else.

        **Would you like to fix it yourself?** Most facts are one row in a file under `registry/` (landing sites are in `registry/sites.yaml`, trip cards in `registry/tours.yaml`). Correct the row, put your source beside it, run `scripts/check.sh`, and open a pull request: [Four ways in, part A](https://github.com/Sara-Managed-Projects/space-radar/blob/main/docs/CONTRIBUTE_WITHOUT_CODE.md#a-fix-a-fact-or-add-a-source) shows the file, a real example and the check that runs. A report alone is just as welcome.
  - type: input
    id: object
    attributes:
      label: Which object or card?
      placeholder: Hubble Space Telescope / the Apollo 12 stop of the Moon trip
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What does Space Radar say or show?
      description: Copy the words or attach a screenshot. Include the "Sources for this record" lines from the card if there are any.
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: What is correct, and who says so?
      description: A link to the publisher (NASA, ESA, JPL Horizons, a paper, an agency page) and the date you read it.
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did you see it?
      description: Positions depend on the time. The date and time, or the address from the address bar.
