name: ci

# Spec 0018. What this refuses is the contract; a check that never fails is a check that is
# not doing anything, so every refusal here has a test that breaks it on purpose.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Two commits deep, so check_budgets() can read the budgets this change is based on (HEAD^1
        # is the base branch in a pull request's merge commit) and refuse a raise with no new date.
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyYAML is the only dependency. Every other one is a thing between a contributor and a
      # green check on a documentation change.
      - run: pip install --disable-pip-version-check pyyaml
      - name: Registries validate
        run: python3 scripts/check_registry.py
        env:
          BUDGETS_BASE: HEAD^1
      # The browser never parses YAML, so registry/rockets.yaml is mirrored into JS. Fifty rows
      # is past where a hand-kept mirror holds -- registry/models.yaml and the BUILDERS table
      # have already drifted apart with nothing checking them -- so the mirror is generated and
      # this is the check that it is current.
      - name: The rocket mirror matches the registry
        run: python3 scripts/gen_rockets_js.py --check
      # Same rule, second registry. registry/oddities.yaml holds the evidence a reviewer reads --
      # Horizons headers, element dumps, why a secondary source was used -- and ships a whitelisted
      # subset. A stale mirror means the browser is drawing the previous set of claims.
      - name: The oddities mirror matches the registry
        run: python3 scripts/gen_oddities_js.py --check
      # Same rule, third registry -- which is why the machinery behind all three of these is now
      # scripts/_genmirror.py. registry/tours.yaml also carries the COMPUTED numbers: every dwell
      # is derived from its own card's word count and the stated length is the sum of them, so a
      # stale mirror is a trip promising a visitor a length it does not spend.
      - name: The tours mirror matches the registry
        run: python3 scripts/gen_tours_js.py --check
      # Same registry, a second mirror, in HTML (spec 0032): one static page per trip carries the
      # trip's title and blurb for a chat unfurler and sends the browser on to `/#trip=<id>`,
      # because a fragment never reaches CloudFront. A stale page is a share that says the wrong
      # thing about the trip it opens.
      - name: The trip pages match the registry (spec 0032)
        run: python3 scripts/gen_trip_pages.py --check
      # Same rule, fourth registry, other direction: the harvester (spec 0003) runs on the standard
      # library alone, so registry/sources.yaml is mirrored into harvest/sources.json -- with its
      # `list:` and `query:` files inlined -- and a stale mirror is a Lambda fetching last month's
      # list of spacecraft.
      - name: The colour-keys mirror matches the registry (spec 0026 req 11)
        run: python3 scripts/gen_colorkeys_js.py --check
      - name: The layers mirror matches the registry (spec 0026 req 8)
        run: python3 scripts/gen_layers_js.py --check
      - name: The aliases mirror matches the registry (spec 0021 req 6)
        run: python3 scripts/gen_aliases_js.py --check
      - name: The showers mirror matches the registry
        run: python3 scripts/gen_showers_js.py --check
      # Spec 0031: registry/events.yaml had twelve types and no reader until 2026-09-23; the browser
      # now builds its event stream from this mirror, so a stale one is a type switched off in the
      # YAML and still built, or the other way round.
      - name: The events mirror matches the registry (spec 0031)
        run: python3 scripts/gen_events_js.py --check
      - name: The ladder mirror matches the registry (spec 0028 step 8)
        run: python3 scripts/gen_ladder_js.py --check
      - name: The exotics mirror matches the registry (spec 0028 step 7)
        run: python3 scripts/gen_exotics_js.py --check
      - name: The star systems mirror matches the registry (spec 0040)
        run: python3 scripts/gen_systems_js.py --check
      - name: The famous-stars mirror matches the registry
        run: python3 scripts/gen_stars_notable_js.py --check
      - name: The level-of-detail mirror matches the registry (spec 0028)
        run: python3 scripts/gen_lod_js.py --check
      # Spec 0035: the browser reads which file is which bed, and the credit it prints, from this.
      - name: The audio mirror matches the registry (spec 0035)
        run: python3 scripts/gen_audio_js.py --check
      # Spec 0044: the gates themselves. A stale mirror is a test holding the previous number.
      - name: The budgets mirror matches the registry (spec 0044)
        run: python3 scripts/gen_budgets_js.py --check
      # Spec 0045: the ten font subsets are the ones build-fonts.py recorded, fonts.css is what it
      # writes, and the OFL text and a CREDITS.md row travel with each family. Stdlib only.
      - name: The self-hosted faces are the recorded subsets, with their licences (spec 0045)
        run: python3 scripts/build-fonts.py --check
      # The dishes and landing sites were ported to data/sample.js by hand until 2026-09-22, with
      # nothing checking the port; twenty-one more rows made that a copy that would drift.
      - name: The sites mirror matches the registry
        run: python3 scripts/gen_sites_js.py --check
      - name: The harvester's source mirror matches the registry
        run: python3 scripts/gen_sources_json.py --check
      # 2026-09-28, the device tiers: the browser picks each map's file for its tier from this mirror,
      # so a stale one is a laptop fetching a 4k map that is not there, or never fetching one that is.
      - name: The texture-tier mirror matches the registry
        run: python3 scripts/gen_textures_js.py --check
      # Every parser against what its source really sends (captured fixtures), the never-worse
      # guard at 0 / 49 % / 50 %, CelesTrak's "has not updated since" as not-modified, a missing
      # secret as a skip, and one whole run into a directory. No network: CelesTrak allows one
      # download per file per two hours, and a suite that spent it could not be run twice.
      - name: The harvester counts, guards and writes what the contract says
        run: python3 tests/test_harvest.py
      # Every user-visible string lives in site/js/copy/en.js. Three files cited this check by name
      # before it existed; on the first run it was ever given it found three real leaks in
      # ui/mobile.js, which is the argument for it in one line.
      - name: No user-visible string outside copy/en.js
        run: python3 scripts/check_copy.py
      - name: A new world is a registry row
        run: python3 tests/test_growth.py
      # Node for the SEO cases, which start from a fresh build of the object pages (card words are JS).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The validator actually refuses
        run: python3 tests/test_refusals.py
      # The harvester's zip is built on every pull request with no AWS in sight (specs/0003
      # amendment 1): a parser change is proven to package before it is ever deployed, and the
      # placeholder path is exercised until harvest/ lands. Deterministic, so the hash is a fact.
      - name: The harvester packages without AWS
        run: scripts/package-harvester.sh --out /tmp/h.zip
      # The three harvester scripts under --dry-run against a fake `aws` that records every call:
      # each may read, none may write, and the plan they print names the right resources with the
      # right permissions. Also proves deploy.sh no longer deletes data/v1/*.
      - name: The harvester scripts only read in --dry-run
        run: python3 tests/test_harvester_scripts.py
      - name: A refresh that fails publishes the last good saved copy, never an empty one
        run: python3 tests/test_refresh_keep_good.py


  # Spec 0061 task 9: what a search engine reads. The object pages, the sitemap and the 404 page are
  # built at deploy time and never kept in git, so CI builds them into a temporary directory and
  # holds that build to check_seo.py. Node, because the pages carry the card's own words.
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install --disable-pip-version-check pyyaml
      - name: The home page's search tags and JSON-LD match registry/sources.yaml
        run: python3 scripts/gen_home_seo.py --check
      - name: The object pages build, and titles, descriptions, canonicals, pictures, JSON-LD, robots.txt and the sitemap hold
        run: python3 scripts/build_seo.py --out "$RUNNER_TEMP/seo" && python3 scripts/check_seo.py --out "$RUNNER_TEMP/seo"
      - name: The SEO build carries the card's words and no live number, and deploy.sh ships it
        run: python3 tests/test_seo.py

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Modules agree about names, every relative import resolves, and every rocket shape the
      # registry offers builds inside the triangle budget its models.yaml row claims. That
      # budget was a comment until this job ran: nothing had ever measured it.
      - name: Modules agree, and every drawn shape fits its budget
        run: node tests/test_contract.mjs
      # The harvested JPL snapshots become records: Horizons vectors -> measured sampled probes,
      # close approaches joined to the SBDB -> inferred kepler asteroids. Fixtures are cut
      # from the real snapshots of 2026-09-08, so the frame and the join are checked, not assumed.
      - name: Snapshots become records, and a missing one keeps its stand-in
        run: node tests/test_snapshot_parsers.mjs
      # The Horizons list and the deep-space records agree both ways, and the ten craft added on
      # 2026-09-22 sit on JPL's own positions at their element dates and drift as their cards say.
      - name: Every Horizons id has a craft, every craft is fetched, and each stand-in is where JPL says
        run: node tests/test_deep_space.mjs
      # CelesTrak allows one download per file per IP per two hours and no harvester is provisioned,
      # so a reload lives on the cache. Two feeds are bigger than localStorage can hold; writing them
      # used to evict the OTHER sources, and a reload came back with the bright-enough-to-see layer
      # and "Satellites worth knowing" empty.
      - name: A reload inside CelesTrak's two hours keeps what the first visit loaded
        run: node tests/test_sources_cache.mjs
      - name: Cards say what they are drawn as, and how old their elements are
        run: node tests/test_cards_copy.mjs
      # Eight dwarf planets and the two interstellar visitors: two-body positions against JPL
      # Horizons' vectors for 2026-09-22, the hyperbolic branch on 'Oumuamua and Borisov, the
      # card's first sentence, search, and the whole-orbit line through the dot.
      - name: Dwarf planets and interstellar visitors are where Horizons puts them, and say what they are
        run: node tests/test_far_bodies.mjs
      - name: The Now moment guesses a place and says so
        run: node tests/test_guessplace.mjs
      - name: Visiting-vehicle shapes build inside budget and match the right names
        run: node tests/test_station_shapes.mjs
      # A fast device earns more models, one at a time while the camera is still, and gives them
      # back when frames slow down. Pure, because headless renders in software and would never grow.
      - name: More 3D when the device can take it, and not a model more
        run: node tests/test_quality_pool.mjs
      - name: A selected station arrives close enough to be drawn at full size
        run: node tests/test_arrival.mjs
      - name: The comets drawn are the ones brightest in the sky now
        run: node tests/test_comets_rank.mjs
      - name: The Sources panel says catalogue, not live, for what ships with the app
        run: node tests/test_status_kinds.mjs
      - name: A phone's sheets move the view up by half of what they cover, the desktop sidebar right by half its edge
        run: node tests/test_viewshift.mjs
      # Spec 0061 task 1: one sidebar with one view at a time, the tabs as places, the clock as a pill.
      - name: "The shell: views push and pop, collapse remembered, tabs are places, Right now only from live data (spec 0061)"
        run: node tests/test_shell.mjs
      - name: One control hides every panel, and H and Escape work it
        run: node tests/test_cleanview.mjs
      - name: The screen as a printable postcard, JPEG or a well-formed PDF
        run: node tests/test_printcard.mjs
      # Spec 0047: brackets on the tracked object, a tag in the card's own words, a chevron off screen.
      - name: "The tracked object's HUD: the box rule, the tag's flip, the tick's floor, the chevron's edge"
        run: node tests/test_hud.mjs
      - name: "No scene label inside the tracked object's brackets while its tag shows"
        run: node tests/test_hudlabels.mjs
      # Spec 0048 task 1: shadow edges and the lap's end to 1 s against a scan a second at a time.
      - name: "Time facts on the card: the next 90 minutes of light, the lap countdown, the orbit number"
        run: node tests/test_timefacts.mjs
      # Spec 0048 task 4: the ticks at the chart's sub-satellite points; the ride's pose and its way out.
      - name: "The ground track on the globe and ride along: 5-minute ticks, rebuilds, 60 km behind"
        run: node tests/test_groundtrack.mjs
      - name: "The tag on the postcard: tagLines()'s own words, placed where the selection is in the print"
        run: node tests/test_printtag.mjs
      # Spec 0048 task 3: the country or sea below, from the committed Natural Earth raster, offline.
      - name: "Below it now: Kazakhstan, the South Pacific, near the France-Spain border, land for disputed ground"
        run: node tests/test_overplace.mjs
      # Spec 0051 task 1: the next pass, the 40 degree rule under a guessed place, darkness, the worker.
      - name: "Tonight's rules: the next pass from a guessed place, 40 degrees up, Up now, 72 h, darkness"
        run: node tests/test_tonight.mjs
      - name: "The Tonight view: a 96 x 48 arc, one ticker, a worker, and destroy() takes it all down"
        run: node tests/test_tonightview.mjs
      # Spec 0045: the instrument's look as numbers. The contrast table is recomputed from the
      # tokens, so the study's 0.62 glass (2.16:1 for dim text over a white cloud) cannot come back.
      - name: "The instrument's tokens: glass that passes AA over a cloud, 6 px corners, a lit edge, ember brackets (spec 0045)"
        run: node tests/test_tokens.mjs
      - name: "Regular and Compact: Compact below 800 px of height unless chosen, the choice remembered (spec 0045)"
        run: node tests/test_density.mjs
      - name: The layers that are off by default still exist, and the active catalogue alone loads on demand
        run: node tests/test_layer_boot.mjs
      - name: The Trips panel leads with the trips that can run
        run: node tests/test_trips_panel.mjs
      # The trip out past Jupiter runs the real trip machine at four dates: every stop resolves to
      # a bundled record, the map is centred where that stop is drawn true, the camera is outside
      # its subject and frames it, and the numbers the cards state are the records' own.
      - name: "Out past Jupiter: ten stops, each seen from where it is drawn true"
        run: node tests/test_outer_trip.mjs
      # Spec 0034: a stage change inside a trip goes through black. The veil's own arithmetic on a
      # fake clock (350 ms to black, the switch in it, 350 ms back; a second request joins; reduced
      # motion is the rig's one 220 ms fade), then the real trip machine out past Jupiter: the map
      # moves only inside the black, a Next pressed in it wins, and no star-stretch on a world stage.
      - name: "A stage change in a trip goes through black, and reduced motion is one short fade (spec 0034)"
        run: node tests/test_veil.mjs
      # Spec 0030: a stop may set the clock's instant and rate, and leaving puts it back. The real
      # clock.js with its wall clock moved by hand: arrival at the instant, the clock held through
      # the flight, 1x after an untimed stop, pause holding it only while the trip owns it, an
      # event stop at spec 0031's computed eclipse, or dropped or held when none is found, 0 ms of
      # drift on leave.
      - name: A trip stop sets the clock, and leaving puts it back to the millisecond (spec 0030)
        run: node tests/test_stop_time.mjs
      - name: "Trip playback: pause holds advance, back/next step, stop N of M stays visible while paused (spec 0003)"
        run: node tests/test_trip_playback.mjs
      - name: "A year in a minute: four worlds on the Sun's stage, drawn true, at 525 600"
        run: node tests/test_year_trip.mjs
      # Spec 0040: TRAPPIST-1 at its own scale. Kepler's third law on the seven rows, the planets the
      # exoplanet table's own records on a 100 000 km stage, each at its transit toward us, and the
      # eleven-stop "Travel to exoplanets" run end to end by the real trip machine.
      - name: "Star systems: TRAPPIST-1 at its own scale, and the trip Travel to exoplanets"
        run: node tests/test_systems.mjs
      - name: Satellite positions move and reject stale orbital elements
        run: node tests/test_sgp4.mjs
      - name: The scene says so when no satellite could be read
        run: node tests/test_scenenote.mjs
      - name: A shower's radiant is where the sky view marks it
        run: node tests/test_radiants.mjs
      - name: One mark per object -- a dot yields to its 3D model
        run: node tests/test_onemark.mjs
      - name: A loaded model keeps its colours, and ships no image it cannot use
        run: node tests/test_model_colour.mjs
      - name: A routed vehicle is drawn as itself whatever class the catalogue files it under
        run: node tests/test_route_builders.mjs
      # Spec 0022 left this open and measured the number first: the attitude code aimed the vehicle
      # along the local vertical, which is 87.5 degrees off the direction of travel at 90 % of the
      # arc. The propagator now returns the tangent of the curve it already draws.
      - name: A launching rocket points where it is going (spec 0022)
        run: node tests/test_ascent_attitude.mjs
      # Sections 7 to 10 hold Pluto and Jupiter's four big moons to NASA's numbers: the moons'
      # distances from Jupiter against the fact sheet's semi-major axes, the light time applied
      # to both Jupiter and its moons, the moons drawn around the drawn Jupiter, and the card.
      # Sections 11 to 14 hold Phobos, Deimos, Enceladus, Titan, Triton and Charon to JPL Horizons
      # vectors written into the test (no network here), and Neptune's card to what it can say.
      - name: worlds are objects (spec 0028 step 0), and eleven moons and Pluto sit where NASA and JPL put them
        run: node tests/test_worlds_layer.mjs
      - name: the smaller thing under the finger wins (spec 0028 step 1)
        run: node tests/test_pickrank.mjs
      - name: the scale ladder's rungs and the sky-from-here fade (spec 0028 step 2)
        run: node tests/test_ladder.mjs
      - name: the stars are places (spec 0028 step 3)
        run: node tests/test_stars3d.mjs
      # registry/stars-notable.yaml: before it, no star record carried a `why`, so on the ladder a
      # star was named only once somebody selected it. Every row must reach its star, and the card
      # must print the line with the page it was read from.
      - name: famous stars are named on the ladder and their cards say why
        run: node tests/test_starsnotable.mjs
      - name: planets around other stars sit on their stars (spec 0028 step 4)
        run: node tests/test_exoplanets.mjs
      - name: deep-sky objects sit at sourced distances (spec 0028 step 5)
        run: node tests/test_dso.mjs
      - name: the Milky Way model is a model, in the right place (spec 0028 step 6)
        run: node tests/test_galaxy.mjs
      - name: every extreme object has a source and sits where its source says (spec 0028 step 7)
        run: node tests/test_exotics.mjs
      - name: every rung of the breadcrumb and every stop of the edge trip names something that exists (spec 0028 step 8)
        run: node tests/test_ladder_ui.mjs
      - name: labels name the selection, its train and the nearest notable things, never the catalogue (spec 0026 req 5)
        run: node tests/test_labels.mjs
      - name: the Next list is built from records already held, nearest in time first (spec 0026 req 6)
        run: node tests/test_next.mjs
      # Eclipses are worked out here with the vendored astronomy-engine and pinned to the dates the
      # library gives, which a reviewer checked against NASA GSFC's tables (2026-09-23).
      - name: eclipses are computed in the browser, and one event stream feeds the Next list (spec 0031)
        run: node tests/test_events.mjs
      - name: search ranks whole words first, falls back to buried letters only when it must and says so (spec 0021)
        run: node tests/test_search.mjs
      - name: every landing site is a record on its own world, drawn as what landed, and findable
        run: node tests/test_landing_sites.mjs
      # The trip's camera runs through the real trip machine at four instants: a key light chosen
      # without the ground's horizon looked at Surveyor 1 through 500 km of Moon (2026-09-22).
      - name: the Moon trip visits real landing sites in order, and sees each from above its horizon
        run: node tests/test_moon_trip.mjs
      # Spec 0038: a trip from the visitor's own ground to the station and its next pass, through
      # the real trip machine with the harvest fixture's ISS and a fixture place. The flights are
      # flown, not collapsed: collapsed, the station stop put the camera behind the Earth.
      - name: "From your ground to the station: your place, from above its horizon, and a real pass ahead (spec 0038)"
        run: node tests/test_station_trip.mjs
      # Each stop's subject stayed selected through the flight to the next: `follow` held the camera
      # on it and heroes.js drew it at 260 px, a lander filling the screen under the next stop's
      # title (Ivan, 2026-10-01). Flown frame by frame through the Moon and station trips.
      - name: a trip's flight lets go of the stop it leaves and lands on its own subject
        run: node tests/test_trip_scale.mjs
      # The URL is the state (spec 0017's rule, spec 0032's keys): one module owns every key of
      # the hash, drops what it does not know, and never writes it back. Two writers in two
      # dialects once bounced the app between moments; this is the check that there is one.
      - name: one module owns every key of the URL, and a stop is found by number or by id (spec 0032)
        run: node tests/test_urlstate.mjs
      # Share (spec 0033): the link is built from the known keys only, so the visitor's place can
      # never ride along, and the postcard's caption is the card's own lines, string for string.
      # Spec 0035: a stub AudioContext. No context and no fetch before a gesture, one context after
      # it, the choice remembered, a 2 s cross-fade per stage, a 0.4 duck under a sting, a quiet
      # failure when a file is missing.
      - name: sound is off until chosen, cross-fades per stage, ducks under a sting, fails quietly (spec 0035)
        run: node tests/test_audio.mjs
      - name: a shared link is the view and nothing else; with no share sheet the clipboard and a toast (spec 0033)
        run: node tests/test_share.mjs
      # Spec 0044: the byte gate's rules on fixtures. The real boot is in screens.yml, which has a
      # browser; this proves the sum, the lazy files and the zero-request rules without one.
      - name: a first visit is summed against its budget, and sound, previews and the lazy stars stay unfetched (spec 0044)
        run: node tests/test_first_visit_bytes.mjs
      - name: the postcard is 1080 x 1350 with its caption band at 1080..1350, five lines in order (spec 0033)
        run: node tests/test_postcard.mjs
      - name: every layer exists on both sides of the registry mirror and `enabled:` is honoured (spec 0026 req 8)
        run: node tests/test_layers_registry.mjs
      - name: a fresh launch is one train with a lead, still climbing or spread out (spec 0026 req 17)
        run: node tests/test_trains.mjs
      - name: the frame-rate latch trips once after three slow seconds; data-saver reads the connection (spec 0026 req 18)
        run: node tests/test_quality.mjs
      # The device tiers (2026-09-28): the tier from capability fixtures, one promotion by frames and
      # none past the latch, 4k fetched one at a time after the first frame and never on a phone,
      # and a boot set that is byte for byte what a first visit loaded before tiers existed.
      - name: a phone keeps the 2k maps, a laptop gets 4k after the first frame, and the latch is the only way down
        run: node tests/test_tiers.mjs
      - name: colour keys bucket records by fields they hold and count the unknown (spec 0026 req 11)
        run: node tests/test_colorkeys.mjs
      - name: a satellite behind the Earth is in its shadow, one in front is lit (spec 0026 req 12)
        run: node tests/test_shadow.mjs
      - name: the Moon's shadow lands on the library's greatest-eclipse point, and the GLSL is the JS formula (spec 0037)
        run: node tests/test_eclipse.mjs
      # Spec 0054 task 1: the worlds are physically lit. No cel bands left in the shader, the JS twins
      # of Oren-Nayar and Minnaert hold their physics, every world is exposed for its own sunlight,
      # and the Moon's earthshine is NASA's geometric albedo worked through the Lambert phase law.
      - name: the worlds are physically lit, and the Moon wears earthshine (spec 0054)
        run: node tests/test_world_light.mjs
      # Spec 0054 task 3: Mars, Venus and Titan wear single-scattering shells. The JS twin's colours
      # against the photographs, its Chapman light path against brute force, the GLSL against the
      # twin, and when a shell is drawn (never from the default view, never under the latch).
      - name: the air on Mars, Venus and Titan (spec 0054 task 3)
        run: node tests/test_air.mjs
      # Spec 0054 task 5: Saturn's rings lit both ways. The slab formula on both faces, forward
      # scattering from behind, and the ring map's Cassini Division read from the PNG and warped onto
      # Cassini's radii, for the ring and for its shadow on the globe alike.
      - name: Saturn's rings, lit both ways, with the Cassini Division where Cassini measured it (spec 0054 task 5)
        run: node tests/test_rings.mjs
      - name: the eclipse trip's five stops land on the library's eclipses, counted from the visitor's clock (spec 0037)
        run: node tests/test_eclipse_trip.mjs
      - name: the trajectory chart samples the record's own path and breaks at the date line (spec 0026 req 14)
        run: node tests/test_trajectory.mjs
      - name: the orbit line is one closed lap from the same elements, and only for things that lap (spec 0026 req 13)
        run: node tests/test_orbitline.mjs
      - name: a not-yet-catalogued object is inferred, dimmer, and says so (spec 0026 req 15)
        run: node tests/test_provisional.mjs
      - name: the space-weather line says the number, the word, the age and the source (spec 0026 req 16)
        run: node tests/test_spaceweather.mjs
      # 2026-09-28: today's clouds from NASA GIBS and the storms from GDACS, against the answers both
      # really gave that evening (no network here): the URLs and slots, GIBS's own colour palette,
      # the seam with the static map, the 12-hour rule, and what each storm number means.
      - name: live clouds are GIBS's pictures read back to temperature, seamed onto the static map, live only near the clock
        run: node tests/test_liveclouds.mjs
