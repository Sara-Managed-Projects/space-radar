name: ci

# Spec 0018. What this refuses is the contract; a check that never fails is a check that is
# not doing anything, so every refusal here has a test that breaks it on purpose.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Two commits deep, so check_budgets() can read the budgets this change is based on (HEAD^1
        # is the base branch in a pull request's merge commit) and refuse a raise with no new date.
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyYAML is the only dependency. Every other one is a thing between a contributor and a
      # green check on a documentation change.
      - run: pip install --disable-pip-version-check pyyaml
      - name: Registries validate
        run: python3 scripts/check_registry.py
        env:
          BUDGETS_BASE: HEAD^1
      # The browser never parses YAML, so registry/rockets.yaml is mirrored into JS. Fifty rows
      # is past where a hand-kept mirror holds -- registry/models.yaml and the BUILDERS table
      # have already drifted apart with nothing checking them -- so the mirror is generated and
      # this is the check that it is current.
      - name: The rocket mirror matches the registry
        run: python3 scripts/gen_rockets_js.py --check
      # Same rule, second registry. registry/oddities.yaml holds the evidence a reviewer reads --
      # Horizons headers, element dumps, why a secondary source was used -- and ships a whitelisted
      # subset. A stale mirror means the browser is drawing the previous set of claims.
      - name: The oddities mirror matches the registry
        run: python3 scripts/gen_oddities_js.py --check
      # Same rule, third registry -- which is why the machinery behind all three of these is now
      # scripts/_genmirror.py. registry/tours.yaml also carries the COMPUTED numbers: every dwell
      # is derived from its own card's word count and the stated length is the sum of them, so a
      # stale mirror is a trip promising a visitor a length it does not spend.
      - name: The tours mirror matches the registry
        run: python3 scripts/gen_tours_js.py --check
      # Same registry, a second mirror, in HTML (spec 0032): one static page per trip carries the
      # trip's title and blurb for a chat unfurler and sends the browser on to `/#trip=<id>`,
      # because a fragment never reaches CloudFront. A stale page is a share that says the wrong
      # thing about the trip it opens.
      - name: The trip pages match the registry (spec 0032)
        run: python3 scripts/gen_trip_pages.py --check
      # Same rule, fourth registry, other direction: the harvester (spec 0003) runs on the standard
      # library alone, so registry/sources.yaml is mirrored into harvest/sources.json -- with its
      # `list:` and `query:` files inlined -- and a stale mirror is a Lambda fetching last month's
      # list of spacecraft.
      - name: The colour-keys mirror matches the registry (spec 0026 req 11)
        run: python3 scripts/gen_colorkeys_js.py --check
      - name: The layers mirror matches the registry (spec 0026 req 8)
        run: python3 scripts/gen_layers_js.py --check
      - name: The aliases mirror matches the registry (spec 0021 req 6)
        run: python3 scripts/gen_aliases_js.py --check
      - name: The showers mirror matches the registry
        run: python3 scripts/gen_showers_js.py --check
      - name: The links-out mirror matches the registry (spec 0050 req 8)
        run: python3 scripts/gen_links_js.py --check
      - name: The oldest-things notes mirror matches the registry (spec 0050 req 7)
        run: python3 scripts/gen_oldest_notes_js.py --check
      - name: "The showers' activity mirror matches the registry (internal #416)"
        run: python3 scripts/gen_showers_activity_js.py --check
      - name: The reels mirror matches the registry (spec 0036)
        run: python3 scripts/gen_autopilot_js.py --check
      - name: "The World Magnetic Model's coefficients match NOAA's file (internal #450)"
        run: python3 scripts/gen_wmm_js.py --check
      - name: The missions mirror matches the registry (public #452)
        run: python3 scripts/gen_missions_js.py --check
      # The path files (site/data/eph): the registry, the manifest, each .bin, the browser's mirror
      # and the held-out Horizons positions agree, with no network (internal #277).
      - name: The mission path files are the ones their manifest describes
        run: python3 scripts/build_ephemerides.py --check
      - name: The path-file guard refuses what it should (tests/test_ephemerides.py)
        run: python3 tests/test_ephemerides.py
      # Spec 0031: registry/events.yaml had twelve types and no reader until 2026-09-23; the browser
      # now builds its event stream from this mirror, so a stale one is a type switched off in the
      # YAML and still built, or the other way round.
      - name: The events mirror matches the registry (spec 0031)
        run: python3 scripts/gen_events_js.py --check
      - name: The ladder mirror matches the registry (spec 0028 step 8)
        run: python3 scripts/gen_ladder_js.py --check
      - name: The exotics mirror matches the registry (spec 0028 step 7)
        run: python3 scripts/gen_exotics_js.py --check
      - name: The star systems mirror matches the registry (spec 0040)
        run: python3 scripts/gen_systems_js.py --check && python3 scripts/gen_systems_more_js.py --check
      - name: The famous-stars mirror matches the registry
        run: python3 scripts/gen_stars_notable_js.py --check
      - name: The level-of-detail mirror matches the registry (spec 0028)
        run: python3 scripts/gen_lod_js.py --check
      # Spec 0035: the browser reads which file is which bed, and the credit it prints, from this.
      - name: The audio mirror matches the registry (spec 0035)
        run: python3 scripts/gen_audio_js.py --check
      # Spec 0069: the trips' narration. No TTS here: the clips are rendered by hand and committed;
      # this refuses a stop whose words changed since its clip was made, a missing file or twin,
      # captions that are not the card's sentences, and a trip or a total over its budget.
      - name: Every trip stop has its narration, made from the words it has now (spec 0069)
        run: python3 scripts/narrate.py --check
      - name: The narration mirror matches the registry (spec 0069)
        run: python3 scripts/gen_narration_js.py --check
      # Internal #326: every clip went through a speech recogniser and came back as its script.
      # No model here: narrate.py --check above already refuses a clip with no listening record;
      # this holds the parts that decide what counts as the same words.
      - name: "The listening check: numbers and spellings compared as words, the word error rate, the guard"
        run: python3 tests/test_listen_check.py
      # Internal #441: a title said alone gained a vowel at each end, so it is said in one pass
      # with the sentence after it. No TTS here: which sentences go together, where the pass is
      # cut, and the caption times that come out of the sample counts.
      - name: "A short sentence is never said alone: the passes, the cut and the cue times"
        run: python3 tests/test_narrate_join.py
      # Spec 0044: the gates themselves. A stale mirror is a test holding the previous number.
      - name: The budgets mirror matches the registry (spec 0044)
        run: python3 scripts/gen_budgets_js.py --check
      # Spec 0068 task 1: one WebP per trip card, the right size and inside trip_picture_bytes. Stdlib
      # only (the WebP header is read by hand), so the job's one dependency stays PyYAML.
      - name: Every trip has its card picture, 640 x 360 and inside its budget (spec 0068)
        run: python3 scripts/build_trip_thumbs.py --check
      # 2026-10-07: one share picture per trip (site/og/<id>.png, 1200 x 630), inside its byte budget
      # and printing the title and blurb the registry has today (a text chunk in the PNG says what
      # was printed). Stdlib only, like the card pictures above.
      - name: Every trip has its share picture, printing today's blurb
        run: python3 scripts/build_trip_og.py --check
      # Spec 0067: the photographs of the nebulae. The mirror the browser reads, then the files:
      # one WebP per registry row, its longer side the row's `px`, each inside nebula_picture_bytes
      # and all of them inside nebulae_total_bytes. Stdlib only, like the trip pictures above.
      - name: The nebulae mirror matches the registry (spec 0067)
        run: python3 scripts/gen_nebulae_js.py --check
      - name: Every nebula has its picture, the right size and inside its budget (spec 0067)
        run: python3 scripts/build_nebulae.py --check
      # Spec 0045: the eleven font subsets are the ones build-fonts.py recorded, fonts.css is what it
      # writes, and the OFL text and a CREDITS.md row travel with each family. Stdlib only.
      - name: The self-hosted faces are the recorded subsets, with their licences (spec 0045)
        run: python3 scripts/build-fonts.py --check
      # The dishes and landing sites were ported to data/sample.js by hand until 2026-09-22, with
      # nothing checking the port; twenty-one more rows made that a copy that would drift.
      - name: The sites mirror matches the registry
        run: python3 scripts/gen_sites_js.py --check
      - name: The harvester's source mirror matches the registry
        run: python3 scripts/gen_sources_json.py --check
      # 2026-09-28, the device tiers: the browser picks each map's file for its tier from this mirror,
      # so a stale one is a laptop fetching a 4k map that is not there, or never fetching one that is.
      - name: The texture-tier mirror matches the registry
        run: python3 scripts/gen_textures_js.py --check
      # 2026-10-03, spec 0065: the browser builds every tile URL from this mirror, so a stale one is a
      # close-up of the Moon asking a host for a level it does not serve.
      - name: The tile-set mirror matches the registry
        run: python3 scripts/gen_tilesets_js.py --check
      # 2026-10-03, spec 0066: the wind profiles, Mars's seasonal tables and each effect's class reach
      # the shader from this mirror, so a stale one is a planet whose weather is not what the registry says.
      - name: The weather mirror matches the registry
        run: python3 scripts/gen_weather_js.py --check
      # Every parser against what its source really sends (captured fixtures), the never-worse
      # guard at 0 / 49 % / 50 %, CelesTrak's "has not updated since" as not-modified, a missing
      # secret as a skip, and one whole run into a directory. No network: CelesTrak allows one
      # download per file per two hours, and a suite that spent it could not be run twice.
      - name: The harvester counts, guards and writes what the contract says
        run: python3 tests/test_harvest.py
      # Every user-visible string lives in site/js/copy/en.js. Three files cited this check by name
      # before it existed; on the first run it was ever given it found three real leaks in
      # ui/mobile.js (the phone's old bar), which is the argument for it in one line.
      - name: No user-visible string outside copy/en.js
        run: python3 scripts/check_copy.py
      - name: A new world is a registry row
        run: python3 tests/test_growth.py
      # 2026-10-05: nine of the fourteen credit lines in registry/sources.yaml were not in CREDITS.md,
      # because nothing compared the two. The models, textures and sounds were already held to it.
      - name: Every data source and model the registries name is credited in CREDITS.md
        run: python3 tests/test_credits.py
      # Node for the SEO cases, which start from a fresh build of the object pages (card words are JS).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The validator actually refuses
        run: python3 tests/test_refusals.py
      # The harvester's zip is built on every pull request with no AWS in sight (specs/0003
      # amendment 1): a parser change is proven to package before it is ever deployed, and the
      # placeholder path is exercised until harvest/ lands. Deterministic, so the hash is a fact.
      - name: The harvester packages without AWS
        run: scripts/package-harvester.sh --out /tmp/h.zip
      # The three harvester scripts under --dry-run against a fake `aws` that records every call:
      # each may read, none may write, and the plan they print names the right resources with the
      # right permissions. Also proves deploy.sh no longer deletes data/v1/*.
      - name: The harvester scripts only read in --dry-run
        run: python3 tests/test_harvester_scripts.py
      - name: A refresh that fails publishes the last good saved copy, never an empty one
        run: python3 tests/test_refresh_keep_good.py


  # Spec 0061 task 9: what a search engine reads. The object pages, the sitemap and the 404 page are
  # built at deploy time and never kept in git, so CI builds them into a temporary directory and
  # holds that build to check_seo.py. Node, because the pages carry the card's own words.
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install --disable-pip-version-check pyyaml
      - name: The home page's search tags and JSON-LD match registry/sources.yaml
        run: python3 scripts/gen_home_seo.py --check
      - name: The object pages build, and titles, descriptions, canonicals, pictures, JSON-LD, robots.txt and the sitemap hold
        run: python3 scripts/build_seo.py --out "$RUNNER_TEMP/seo" && python3 scripts/check_seo.py --out "$RUNNER_TEMP/seo"
      - name: The SEO build carries the card's words and no live number, and deploy.sh ships it
        run: python3 tests/test_seo.py
      # Spec 0061 task 8: the share sheet links an object to the page built above, by the map
      # build_seo.py writes (object-pages.json); its post fits each network with the link last.
      - name: "The share sheet: the post per network (X 280, link 23), the excerpt with its attribution, the object page's link, nothing fetched before it opens"
        run: node tests/test_sharesheet.mjs
      # Public #439 and #288: the embed's address, its snippet and its manual; nothing of it at
      # boot and no service worker in a frame; photo mode's frame.
      - name: "The embed and photo mode: ?embed=1 through a whitelist, the snippet, nothing at boot, the frame centred"
        run: node tests/test_embed.mjs
      # Public #293: the press page builds from the registry's own counts, with no personal data.
      - name: "The press page: five counted facts, the README's pictures, every link resolving"
        run: python3 tests/test_press.py

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Modules agree about names, every relative import resolves, and every rocket shape the
      # registry offers builds inside the triangle budget its models.yaml row claims. That
      # budget was a comment until this job ran: nothing had ever measured it.
      - name: Modules agree, and every drawn shape fits its budget
        run: node tests/test_contract.mjs
      # The harvested JPL snapshots become records: Horizons vectors -> measured sampled probes,
      # close approaches joined to the SBDB -> inferred kepler asteroids. Fixtures are cut
      # from the real snapshots of 2026-09-08, so the frame and the join are checked, not assumed.
      - name: Snapshots become records, and a missing one keeps its stand-in
        run: node tests/test_snapshot_parsers.mjs
      # The Horizons list and the deep-space records agree both ways, and the ten craft added on
      # 2026-09-22 sit on JPL's own positions at their element dates and drift as their cards say.
      - name: Every Horizons id has a craft, every craft is fetched, and each stand-in is where JPL says
        run: node tests/test_deep_space.mjs
      # CelesTrak allows one download per file per IP per two hours and no harvester is provisioned,
      # so a reload lives on the cache. Two feeds are bigger than localStorage can hold; writing them
      # used to evict the OTHER sources, and a reload came back with the bright-enough-to-see layer
      # and "Satellites worth knowing" empty.
      - name: A reload inside CelesTrak's two hours keeps what the first visit loaded
        run: node tests/test_sources_cache.mjs
      - name: Cards say what they are drawn as, and how old their elements are
        run: node tests/test_cards_copy.mjs
      # Eight dwarf planets and the two interstellar visitors: two-body positions against JPL
      # Horizons' vectors for 2026-09-22, the hyperbolic branch on 'Oumuamua and Borisov, the
      # card's first sentence, search, and the whole-orbit line through the dot.
      - name: Dwarf planets and interstellar visitors are where Horizons puts them, and say what they are
        run: node tests/test_far_bodies.mjs
      - name: The Now moment guesses a place and says so
        run: node tests/test_guessplace.mjs
      - name: Visiting-vehicle shapes build inside budget and match the right names
        run: node tests/test_station_shapes.mjs
      # A fast device earns more models, one at a time while the camera is still, and gives them
      # back when frames slow down. Pure, because headless renders in software and would never grow.
      - name: More 3D when the device can take it, and not a model more
        run: node tests/test_quality_pool.mjs
      - name: A selected station arrives close enough to be drawn at full size
        run: node tests/test_arrival.mjs
      - name: The comets drawn are the ones brightest in the sky now
        run: node tests/test_comets_rank.mjs
      - name: The Sources panel says catalogue, not live, for what ships with the app
        run: node tests/test_status_kinds.mjs
      - name: A phone's sheet and top bar move the view into the band between them, the desktop sidebar right by half its edge
        run: node tests/test_viewshift.mjs
      # Spec 0061 task 1: one sidebar with one view at a time, the tabs as places, the clock as a pill.
      - name: "The shell: views push and pop, collapse remembered, tabs are places, Right now only from live data (spec 0061)"
        run: node tests/test_shell.mjs
      # Spec 0061 task 3: the phone's one sheet (peek, half, full), its drag and the band it leaves.
      - name: "The phone's sheet: three heights, flicks carry, a card opens at half, the subject sits between the top bar and the sheet"
        run: node tests/test_sheet.mjs
      - name: One control hides every panel, and H and Escape work it
        run: node tests/test_cleanview.mjs
      - name: The screen as a printable postcard, JPEG or a well-formed PDF
        run: node tests/test_printcard.mjs
      # Spec 0047: brackets on the tracked object, a tag in the card's own words, a chevron off screen.
      - name: "The tracked object's HUD: the box rule, the tag's flip, the tick's floor, the chevron's edge"
        run: node tests/test_hud.mjs
      - name: "No scene label inside the tracked object's brackets while its tag shows"
        run: node tests/test_hudlabels.mjs
      # Spec 0048 task 1: shadow edges and the lap's end to 1 s against a scan a second at a time.
      - name: "Time facts on the card: the next 90 minutes of light, the lap countdown, the orbit number"
        run: node tests/test_timefacts.mjs
      # Cards and live facts (2026-10-08): the pure pieces behind the card's newer blocks.
      - name: "The ticking distance, the six-year curve, Up for N years, the crew joined to docked vehicles"
        run: node tests/test_cardlive.mjs
      - name: "Rises, highest and sets for a comet or an asteroid agree with the astronomy library"
        run: node tests/test_riseany.mjs
      # Spec 0048 task 4: the ticks at the chart's sub-satellite points; the ride's pose and its way out.
      - name: "The ground track on the globe and ride along: 5-minute ticks, rebuilds, 60 km behind"
        run: node tests/test_groundtrack.mjs
      - name: "The tag on the postcard: tagLines()'s own words, placed where the selection is in the print"
        run: node tests/test_printtag.mjs
      # Spec 0048 task 3: the country or sea below, from the committed Natural Earth raster, offline.
      - name: "Below it now: Kazakhstan, the South Pacific, near the France-Spain border, land for disputed ground"
        run: node tests/test_overplace.mjs
      # Spec 0051 task 1: the next pass, the 40 degree rule under a guessed place, darkness, the worker.
      - name: "Tonight's rules: the next pass from a guessed place, 40 degrees up, Up now, 72 h, darkness"
        run: node tests/test_tonight.mjs
      - name: "The Tonight view: a 96 x 48 arc, one ticker, a worker, and destroy() takes it all down"
        run: node tests/test_tonightview.mjs
      # Spec 0045: the instrument's look as numbers. The contrast table is recomputed from the
      # tokens, so the study's 0.62 glass (2.16:1 for dim text over a white cloud) cannot come back.
      - name: "The instrument's tokens: AA over a cloud, 6 px corners, ember brackets, three faces, no serif, motion from the tokens (spec 0045, 0061)"
        run: node tests/test_tokens.mjs
      - name: "Regular and Compact: Compact below 800 px of height unless chosen, the choice remembered (spec 0045)"
        run: node tests/test_density.mjs
      - name: The layers that are off by default still exist, and the active catalogue alone loads on demand
        run: node tests/test_layer_boot.mjs
      - name: The Trips panel leads with the trips that can run
        run: node tests/test_trips_panel.mjs
      # The trip out past Jupiter runs the real trip machine at four dates: every stop resolves to
      # a bundled record, the map is centred where that stop is drawn true, the camera is outside
      # its subject and frames it, and the numbers the cards state are the records' own.
      - name: "Out past Jupiter: ten stops, each seen from where it is drawn true"
        run: node tests/test_outer_trip.mjs
      # Spec 0034: a stage change inside a trip goes through black. The veil's own arithmetic on a
      # fake clock (350 ms to black, the switch in it, 350 ms back; a second request joins; reduced
      # motion is the rig's one 220 ms fade), then the real trip machine out past Jupiter: the map
      # moves only inside the black, a Next pressed in it wins, and no star-stretch on a world stage.
      - name: "A stage change in a trip goes through black, and reduced motion is one short fade (spec 0034)"
        run: node tests/test_veil.mjs
      # Spec 0030: a stop may set the clock's instant and rate, and leaving puts it back. The real
      # clock.js with its wall clock moved by hand: arrival at the instant, the clock held through
      # the flight, 1x after an untimed stop, pause holding it only while the trip owns it, an
      # event stop at spec 0031's computed eclipse, or dropped or held when none is found, 0 ms of
      # drift on leave.
      - name: A trip stop sets the clock, and leaving puts it back to the millisecond (spec 0030)
        run: node tests/test_stop_time.mjs
      - name: "Trip playback: pause holds advance, back/next step, stop N of M stays visible while paused (spec 0003)"
        run: node tests/test_trip_playback.mjs
      # Spec 0061 task 7: the trip in the new language. One toolbar of named icon buttons whose
      # tooltips name their keys, the progress inside it, the keyboard, the intro with one ember
      # Start and sound as a toggle, the end with one next trip, the top bar of title and Leave.
      - name: "Trips in the new language: the toolbar, the keyboard, the intro and the end (spec 0061 task 7)"
        run: node tests/test_tripframe.mjs
      # Spec 0036: the reel's order, the dwell with and without the voice, the watchdog's decisions,
      # the hands-on and hands-off machine, the reload rule, and the controller on a stub trip.
      - name: "A screen that plays on its own: the reel, the watchdog, the take-over (spec 0036)"
        run: node tests/test_autopilot.mjs
      - name: "The reel on the real trip machine: two laps, a refusal, the take-over, a lost arrival (spec 0036)"
        run: node tests/test_autopilot_trip.mjs
      - name: "The reel when the picture is not there: a lost context holds the trip, a failed map is passed over (internal #448)"
        run: node tests/test_autopilot_holds.mjs
      - name: "Every flight of a trip ends in its own time: slow frames, a taken camera, a lost arrival, the way home (internal #322, #304)"
        run: node tests/test_trip_flight_ends.mjs
      # Spec 0068 task 1: the trip's picture under its card and over its intro, lazy and after the
      # first visit; task 2: the controls hint, once, with keycaps the camera and the chrome answer.
      - name: "Trip cards with pictures: the files, the fade into glass, nothing before the first visit settles (spec 0068)"
        run: node tests/test_trip_pictures.mjs
      - name: "Trip share pictures: one per trip, today's title and blurb printed, each page naming its own"
        run: node tests/test_trip_og.mjs
      - name: "The controls hint: once, never on a link or a trip, every keycap a key the app answers (spec 0068)"
        run: node tests/test_keyhint.mjs
      - name: What to show, grouped, and its Keys row (spec 0068 task 3, issue 321)
        run: node tests/test_whattoshow.mjs
      # Spec 0061 task 5, req 11: every line of chrome fits one line with its longest values, in
      # the sidebar's 320 px and the popover's 280 px; no browser, the widths are worked out.
      - name: "A line of chrome is one line, and every chrome string is swept: 60 characters drawn, 90 as a tooltip (spec 0061)"
        run: node tests/test_chrome_copy.mjs
      # Spec 0061 task 6, docs/ui-guide.md section 7: the guard rails a machine can hold without a
      # browser. Every control a builder makes has a name, an icon-only one an aria-label and a
      # tooltip, every icon is the one family's; and every control class resolves to 44 px on the
      # phone profile, so a new button cannot arrive at 36.
      - name: "Every control has a name, icon-only buttons an aria-label and a tooltip, one icon family, no focus ring removed (spec 0061 task 6)"
        run: node tests/test_a11y_static.mjs
      - name: "A finger's target is 44 px: every control class on the phone profile (spec 0061 task 6)"
        run: node tests/test_touch_targets.mjs
      - name: "A year in a minute: four worlds on the Sun's stage, drawn true, at 525 600"
        run: node tests/test_year_trip.mjs
      # Spec 0040: TRAPPIST-1 at its own scale. Kepler's third law on the seven rows, the planets the
      # exoplanet table's own records on a 100 000 km stage, each at its transit toward us, and the
      # eleven-stop "Travel to exoplanets" run end to end by the real trip machine.
      - name: "Star systems: TRAPPIST-1 at its own scale, and the trip Travel to exoplanets"
        run: node tests/test_systems.mjs
      # Internal #466 phase A: thirty-nine systems generated from the Archive's table. Kepler's
      # third law on every row, the habitable zone against a second implementation of Kopparapu
      # et al. 2014, search, the `#go=` link, and the card's lines about what is measured.
      - name: "Star systems: the generated forty obey Kepler, their zones are the paper's, the cards say what is measured"
        run: node tests/test_systems_table.mjs
      # Internal #466 phase B: a drawn face for a planet nobody has seen. The classifier on the
      # table's own rows, the label made from the row, imagined worlds named as imagined, three
      # tiers with one draw call on a phone, no texture, no post-processing, nothing at boot.
      - name: "Planet faces: classed from the row, labelled as an artist's impression"
        run: node tests/test_exoface.mjs
      - name: Satellite positions move and reject stale orbital elements
        run: node tests/test_sgp4.mjs
      - name: The scene says so when no satellite could be read
        run: node tests/test_scenenote.mjs
      - name: "The passing chrome stands clear: the toast above the pill, the hint off the card, a pressed trip card says so"
        run: node tests/test_chrome_places.mjs
      - name: A shower's radiant is where the sky view marks it
        run: node tests/test_radiants.mjs
      - name: "The sky from here: a light-pollution glow at night, a risen Moon lifting the dome, neither a flat black slab"
        run: node tests/test_skyview.mjs
      - name: The air and the eye as numbers; the planets against Astronomy Engine (pub 454)
        run: node tests/test_skymath.mjs
      - name: Tonight's best and a pass as a row (pub 448)
        run: node tests/test_tonightbest.mjs
      - name: One mark per object -- a dot yields to its 3D model
        run: node tests/test_onemark.mjs
      - name: A loaded model keeps its colours, and ships no image it cannot use
        run: node tests/test_model_colour.mjs
      - name: A routed vehicle is drawn as itself whatever class the catalogue files it under
        run: node tests/test_route_builders.mjs
      # Spec 0022 left this open and measured the number first: the attitude code aimed the vehicle
      # along the local vertical, which is 87.5 degrees off the direction of travel at 90 % of the
      # arc. The propagator now returns the tangent of the curve it already draws.
      - name: A launching rocket points where it is going (spec 0022)
        run: node tests/test_ascent_attitude.mjs
      # Sections 7 to 10 hold Pluto and Jupiter's four big moons to NASA's numbers: the moons'
      # distances from Jupiter against the fact sheet's semi-major axes, the light time applied
      # to both Jupiter and its moons, the moons drawn around the drawn Jupiter, and the card.
      # Sections 11 to 14 hold Phobos, Deimos, Enceladus, Titan, Triton and Charon to JPL Horizons
      # vectors written into the test (no network here), and Neptune's card to what it can say.
      - name: worlds are objects (spec 0028 step 0), and eleven moons and Pluto sit where NASA and JPL put them
        run: node tests/test_worlds_layer.mjs
      - name: the smaller thing under the finger wins (spec 0028 step 1)
        run: node tests/test_pickrank.mjs
      - name: the scale ladder's rungs and the sky-from-here fade (spec 0028 step 2)
        run: node tests/test_ladder.mjs
      - name: The stage hand-off keeps the pose (internal #410)
        run: node tests/test_handoff.mjs
      - name: The continuous flight, flown frame by frame
        run: node tests/test_climb.mjs
      - name: the stars are places (spec 0028 step 3)
        run: node tests/test_stars3d.mjs
      # registry/stars-notable.yaml: before it, no star record carried a `why`, so on the ladder a
      # star was named only once somebody selected it. Every row must reach its star, and the card
      # must print the line with the page it was read from.
      - name: famous stars are named on the ladder and their cards say why
        run: node tests/test_starsnotable.mjs
      - name: planets around other stars sit on their stars (spec 0028 step 4)
        run: node tests/test_exoplanets.mjs
      - name: deep-sky objects sit at sourced distances (spec 0028 step 5)
        run: node tests/test_dso.mjs
      - name: the Milky Way model is a model, in the right place (spec 0028 step 6)
        run: node tests/test_galaxy.mjs
      - name: the nebulae's photographs sit where their objects are, and nothing of them loads at boot (spec 0067)
        run: node tests/test_nebulae.mjs
      - name: every extreme object has a source and sits where its source says (spec 0028 step 7)
        run: node tests/test_exotics.mjs
      - name: every rung of the breadcrumb and every stop of the edge trip names something that exists (spec 0028 step 8)
        run: node tests/test_ladder_ui.mjs
      - name: labels name the selection, its train and the nearest notable things, never the catalogue (spec 0026 req 5)
        run: node tests/test_labels.mjs
      - name: at most eight names on the first screen, ranked, never a rocket body or debris by default, held against flicker (spec 0061 req 10)
        run: node tests/test_labels_rank.mjs
      - name: an Earth orbiter arrives with the limb in view, small bodies from a floor, the reticle at every distance, the Planets tab fitted (spec 0061 req 9)
        run: node tests/test_framing.mjs
      - name: the Next list is built from records already held, nearest in time first (spec 0026 req 6)
        run: node tests/test_next.mjs
      # Package 9 (2026-10-06): the time pill's timeline, a mission's dated events, the home's
      # dated cards with the undo toast, and debris counted from the whole catalogue.
      - name: The timeline in the time pill (public #455)
        run: node tests/test_scrubber.mjs
      - name: A mission as a place in time (public #452)
        run: node tests/test_missions.mjs
      - name: A craft's own path holds the bound its card states, and loads nothing at boot (internal #277)
        run: node tests/test_ephemerides.mjs
      - name: The home's dated cards and the way back from an automatic move (internal #270, #274)
        run: node tests/test_today.mjs
      - name: Debris as a problem, from the whole catalogue (public #449)
        run: node tests/test_debris.mjs
      # Round three, package 5 (2026-10-07): the passport and the home's first line.
      - name: The passport, kept in this browser only (spec 0041, public #240)
        run: node tests/test_passport.mjs
      - name: One true sentence on the home (public #395, #450)
        run: node tests/test_sentence.mjs
      # Eclipses are worked out here with the vendored astronomy-engine and pinned to the dates the
      # library gives, which a reviewer checked against NASA GSFC's tables (2026-09-23).
      - name: eclipses are computed in the browser, and one event stream feeds the Next list (spec 0031)
        run: node tests/test_events.mjs
      - name: search ranks whole words first, falls back to buried letters only when it must and says so (spec 0021)
        run: node tests/test_search.mjs
      - name: every landing site is a record on its own world, drawn as what landed, and findable
        run: node tests/test_landing_sites.mjs
      - name: A rocket on a hand-kept pad is drawn only around its listed liftoffs
        run: node tests/test_pad_vehicles.mjs
      # The trip's camera runs through the real trip machine at four instants: a key light chosen
      # without the ground's horizon looked at Surveyor 1 through 500 km of Moon (2026-09-22).
      - name: the Moon trip visits real landing sites in order, and sees each from above its horizon
        run: node tests/test_moon_trip.mjs
      # Spec 0038: a trip from the visitor's own ground to the station and its next pass, through
      # the real trip machine with the harvest fixture's ISS and a fixture place. The flights are
      # flown, not collapsed: collapsed, the station stop put the camera behind the Earth.
      - name: "From your ground to the station: your place, from above its horizon, and a real pass ahead (spec 0038)"
        run: node tests/test_station_trip.mjs
      # Each stop's subject stayed selected through the flight to the next: `follow` held the camera
      # on it and heroes.js drew it at 260 px, a lander filling the screen under the next stop's
      # title (Ivan, 2026-10-01). Flown frame by frame through the Moon and station trips.
      - name: a trip's flight lets go of the stop it leaves and lands on its own subject
        run: node tests/test_trip_scale.mjs
      # The URL is the state (spec 0017's rule, spec 0032's keys): one module owns every key of
      # the hash, drops what it does not know, and never writes it back. Two writers in two
      # dialects once bounced the app between moments; this is the check that there is one.
      - name: one module owns every key of the URL, and a stop is found by number or by id (spec 0032)
        run: node tests/test_urlstate.mjs
      # Share (spec 0033): the link is built from the known keys only, so the visitor's place can
      # never ride along, and the postcard's caption is the card's own lines, string for string.
      # Spec 0035: a stub AudioContext. No context and no fetch before a gesture, one context after
      # it, the choice remembered, a 2 s cross-fade per stage, a 0.4 duck under a sting, a quiet
      # failure when a file is missing.
      - name: sound is off until chosen, cross-fades per stage, ducks under a sting, fails quietly (spec 0035)
        run: node tests/test_audio.mjs
      # Spec 0069: the voice with a stub AudioContext. Nothing fetched with sound off or the voice
      # off, the bed 10 dB down under a clip and back after, the stop held for the clip and a
      # second, pause and resume at the same word, a missing clip that stops nothing.
      - name: a stop is read aloud only when asked, ducks the music, holds the stop, fails quietly (spec 0069)
        run: node tests/test_narration.mjs
      # Spec 0070: trips as videos, with no Chrome and no ffmpeg. The film's clock moves only when
      # stepped and is the same twice; the camera module is not in the boot graph; clips are laid
      # where the camera arrives; the bed is 10 dB down under each; chapters, captions and the
      # description are what YouTube reads.
      - name: a trip's video has a clock of its own, a cue sheet, a ducked bed and YouTube's sidecars (spec 0070)
        run: node tests/test_render_trip.mjs
      - name: a shared link is the view and nothing else, and every Share opens the one sheet (spec 0033, 0061 task 8)
        run: node tests/test_share.mjs
      # Spec 0044: the byte gate's rules on fixtures. The real boot is in screens.yml, which has a
      # browser; this proves the sum, the lazy files and the zero-request rules without one.
      - name: a first visit is summed against its budget, and sound, previews and the lazy stars stay unfetched (spec 0044)
        run: node tests/test_first_visit_bytes.mjs
      - name: a trip's preview is 1200 x 630 with its caption band in the lower fifth (spec 0033)
        run: node tests/test_postcard.mjs
      - name: every layer exists on both sides of the registry mirror and `enabled:` is honoured (spec 0026 req 8)
        run: node tests/test_layers_registry.mjs
      - name: a fresh launch is one train with a lead, still climbing or spread out (spec 0026 req 17)
        run: node tests/test_trains.mjs
      - name: the frame-rate latch trips once after three slow seconds; data-saver reads the connection (spec 0026 req 18)
        run: node tests/test_quality.mjs
      # The device tiers (2026-09-28): the tier from capability fixtures, one promotion by frames and
      # none past the latch, 4k fetched one at a time after the first frame and never on a phone,
      # and a boot set that is byte for byte what a first visit loaded before tiers existed.
      - name: a phone keeps the 2k maps, a laptop gets 4k after the first frame, and the latch is the only way down
        run: node tests/test_tiers.mjs
      # Spec 0065 (2026-10-03): a close world drawn from NASA Treks map tiles. The addressing against
      # the pyramid the host really serves, the level a pixel's footprint asks for, a cover with no
      # hole and no overlap, what is drawn while tiles arrive, the LRU, and the module on a fake clock:
      # six fetches at once, none on tier 0, on data-saver or after the latch, a failing host left alone.
      - name: a close Moon or Mars is drawn from map tiles, fetched only when the camera is near and never on a first visit
        run: node tests/test_tiles.mjs
      # Spec 0066 (2026-10-03): weather on every world. A wind profile to an angular rate against the
      # papers' jets, the two-phase clock that lets a still map flow, Mars's season against NASA's
      # dates, NOAA's lightning map (a saved picture) decoded and scheduled, the one-line shader patch,
      # each world's card line and its class, and none of it at tier 0, on data-saver or on a first visit.
      - name: weather on every world is measured, modelled or illustrative and says which, and is never on a first visit
        run: node tests/test_weather.mjs
      - name: colour keys bucket records by fields they hold and count the unknown (spec 0026 req 11)
        run: node tests/test_colorkeys.mjs
      - name: a satellite behind the Earth is in its shadow, one in front is lit (spec 0026 req 12)
        run: node tests/test_shadow.mjs
      - name: the Moon's shadow lands on the library's greatest-eclipse point, and the GLSL is the JS formula (spec 0037)
        run: node tests/test_eclipse.mjs

      # Public #273: where the shadow's axis meets the ground, held to Astronomy Engine's own point at
      # greatest eclipse, the shadow's two radii, and the ribbon drawn across the globe.
      - name: The eclipse's path lands where the library says, and the ribbon is as wide as the core
        run: node tests/test_eclipse_path.mjs

      # Public #404, #411, #417: Mercury's relief, Saturn's contrast and Venus's soft terminator are each
      # behind a uniform that is off on every other world, and each card says what is adjusted.
      - name: Three worlds' own looks are off everywhere else, and said on the card
        run: node tests/test_world_looks.mjs

      # Public #271: the Pleiades' catalogue stars are gathered at the cluster's distance, in their
      # measured directions, and nothing else moves.
      - name: The Pleiades are gathered from their catalogue stars
        run: node tests/test_clusters.mjs

      # Public #271: a star's light is a peak and a glow, the same in all three star draws, never a flat disc.
      - name: A star is a peak with a glow, not a disc
        run: node tests/test_star_light.mjs

      # Public #426: a pulsar blinks at its period times the least power of ten an eye can follow, and
      # the card says by how much; the photographed black holes are drawn while their cards are open.
      - name: A pulsar's pulse is slowed by a power of ten and says so
        run: node tests/test_pulse.mjs
      # Spec 0054 task 1: the worlds are physically lit. No cel bands left in the shader, the JS twins
      # of Oren-Nayar and Minnaert hold their physics, every world is exposed for its own sunlight,
      # and the Moon's earthshine is NASA's geometric albedo worked through the Lambert phase law.
      - name: the worlds are physically lit, and the Moon wears earthshine (spec 0054)
        run: node tests/test_world_light.mjs
      # Spec 0054 task 3: Mars, Venus and Titan wear single-scattering shells. The JS twin's colours
      # against the photographs, its Chapman light path against brute force, the GLSL against the
      # twin, and when a shell is drawn (never from the default view, never under the latch).
      - name: the air on Mars, Venus and Titan (spec 0054 task 3)
        run: node tests/test_air.mjs
      # Spec 0053 tasks 1, 2 and 5 and spec 0066 task 2: the Earth's air in scene/atmosphere.js (the table
      # of the light's path against a 20 000-step integration, the shell the same from 8 steps to
      # 400), aerial perspective, relief from ETOPO 2022 and the storm tops, each against its JS twin.
      - name: "the Earth's air, relief and storm tops (spec 0053 tasks 1, 2, 5; spec 0066 task 2)"
        run: node tests/test_atmo_lut.mjs
      # Spec 0054 task 5: Saturn's rings lit both ways. The slab formula on both faces, forward
      # scattering from behind, and the ring map's Cassini Division read from the PNG and warped onto
      # Cassini's radii, for the ring and for its shadow on the globe alike.
      - name: Saturn's rings, lit both ways, with the Cassini Division where Cassini measured it (spec 0054 task 5)
        run: node tests/test_rings.mjs
      - name: the eclipse trip's five stops land on the library's eclipses, counted from the visitor's clock (spec 0037)
        run: node tests/test_eclipse_trip.mjs
      - name: the trajectory chart samples the record's own path and breaks at the date line (spec 0026 req 14)
        run: node tests/test_trajectory.mjs
      - name: the orbit line is one closed lap from the same elements, and only for things that lap (spec 0026 req 13)
        run: node tests/test_orbitline.mjs
      - name: a not-yet-catalogued object is inferred, dimmer, and says so (spec 0026 req 15)
        run: node tests/test_provisional.mjs
      - name: the space-weather line says the number, the word, the age and the source (spec 0026 req 16)
        run: node tests/test_spaceweather.mjs
      # 2026-09-28: today's clouds from NASA GIBS and the storms from GDACS, against the answers both
      # really gave that evening (no network here): the URLs and slots, GIBS's own colour palette,
      # the seam with the static map, the 12-hour rule, and what each storm number means.
      - name: live clouds are GIBS's pictures read back to temperature, seamed onto the static map, live only near the clock
        run: node tests/test_liveclouds.mjs
      - name: storms are the ones advised in the last 12 h, drawn only near their advisory, carded with what GDACS's numbers mean
        run: node tests/test_storms.mjs
      # Internal #281: fires, volcanoes and icebergs from NASA's EONET, against nine events of what it
      # answered on 2026-10-07 (no network here): the records, the card, the two requests, nothing at boot.
      - name: fires, volcanoes and icebergs are EONET's points with their dates, fetched only when asked
        run: node tests/test_eonet.mjs
      # Internal #362: the wind, NOAA's GFS through PacIOOS ERDDAP, as moving streaks (no network here):
      # the one request, a grid refused unless whole, the step along the wind, the drawing, nothing at boot.
      - name: the wind is one request for a whole grid, drawn as streaks that move with it, or stand still when asked
        run: node tests/test_wind.mjs
      # Spec 0053 task 3: the aurora, NOAA's OVATION forecast on the night side, against the answer NOAA
      # really gave on 2026-09-30 (saved): the decode, the night mask and colour ramp twins, the
      # schedule, and the card's "not a photograph".
      - name: the aurora is NOAA's forecast of the next hour, night side only, coloured by height, carded as a forecast (spec 0053 task 3)
        run: node tests/test_aurora.mjs
      # 2026-10-05, offline (issues #290, #453; internal 369): the service worker's routing table at the
      # root and in a subfolder, with the stamp scripts/stamp_sw.py writes at deploy and release time;
      # no path in the app starting at the root of the host; and the manifest with icons of the sizes
      # they claim. The committed sw.js stays unstamped.
      - name: the service worker routes shell, assets and saved data as documented, and the stamp names the app and only the app
        run: node tests/test_sw_routes.mjs
      - name: nothing under site/ asks for a path from the root of the host, so a copy in a subfolder works
        run: node tests/test_relative_urls.mjs
      - name: the manifest is installable, its icons are the sizes they claim, and the deploy carries it and the worker no-cache
        run: node tests/test_manifest.mjs
      - name: the committed sw.js is unstamped
        run: python3 scripts/stamp_sw.py --check

  # THE TESTS NO JOB RAN (2026-10-07, round three package 8). Fourteen test files, tests/test_minify.py
  # and tests/test_notify.py were in the repository and in the local gate and in no workflow: they
  # were green on a laptop and unknown here. This job runs them, with the guard rails that landed the
  # same day, and its last step refuses a test file that no step of this workflow names -- so the
  # list cannot fall behind again. Node and Python both: two of these call a script of the other.
  rails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml
      - name: "what must stay out of the first visit stays out, and its stand-ins hold the door (internal #405)"
        run: node tests/test_boot_diet.mjs
      # Spec 0056 req 4 and 9 (internal #157): what the maps can hold on the GPU per tier against
      # registry/budgets.yaml, watched to fail three ways; the rule that makes it true (a world that
      # has been a dot the longest gives its map back) in a real createWorlds; the repository row.
      - name: "The maps a device can hold stay inside its GPU budget, and a world that is a dot again gives its map back"
        run: node tests/test_texture_budget.mjs
      # Internal #374 and #123: the UI gate and the trips walk run in screens.yml (a browser); this is
      # what node can hold of them: a known finding needs an issue and cannot go stale, the probe
      # measures a control cut by the fold by its box, the walk reads both budget rows at every stop.
      - name: "The UI gate's known findings, the probe's three fixes, and the trips walk's wiring"
        run: node tests/test_ui_gate.mjs
      # Spec 0049 task 1 (public #285): 1 000 element sets through propagate/worker.js in a real worker
      # thread, every number compared with the in-thread path by Object.is; the pool's one question
      # in flight; the fallback when there is no Worker.
      - name: "SGP4 in a worker gives the page's own numbers to the last bit, and the page falls back without one"
        run: node tests/test_propagate_worker.mjs
      - name: "the constellation figures as strokes, with the stars at their corners"
        run: node tests/test_figures.mjs
      - name: "the nebulae's photographs in the sky from the ground"
        run: node tests/test_groundpictures.mjs
      - name: "the HEALPix tile addressing a HiPS sky is read with"
        run: node tests/test_hips.mjs
      - name: "Phobos and Deimos in their measured shapes, and every moon's map"
        run: node tests/test_moon_shapes.mjs
      - name: "the sky in other light: the registry, the baked skies, the chooser, none of it on a first visit"
        run: node tests/test_otherlight.mjs
      - name: "Earth data overlays: which day's picture, the address, the sentence under it"
        run: node tests/test_overlays.mjs
      - name: "the five trips of 2026-10-06, flown by the real machine"
        run: node tests/test_planetarium_trips.mjs
      - name: "the eight shows of 2026-10-06 and the stop grammar they brought"
        run: node tests/test_remaining_trips.mjs
      - name: "The constellations and The living Earth, flown by the real machine"
        run: node tests/test_sky_trips.mjs
      - name: "the sky from the ground, round two: other peoples' figures, the borders, the pictures"
        run: node tests/test_skyculture.mjs
      - name: "the compact star files of the sky from the ground"
        run: node tests/test_skystars.mjs
      - name: "The sky's colour from the air, and the land under it: the model's limits (sky round three)"
        run: node tests/test_skyair.mjs
      - name: "Star tiles, which constellation, star trails (internal #353, #417)"
        run: node tests/test_startiles.mjs
      - name: "A shower over its whole activity period, each with its own r (internal #416)"
        run: node tests/test_meteors.mjs
      - name: "The deep sky tonight, the night's moments, my view, one apparent place, no label twice (internal #358, #300, #418, #372)"
        run: node tests/test_sky_round3.mjs
      - name: "The sky from the ground built and run for a night without a browser"
        run: node tests/test_groundsky_smoke.mjs
      - name: "Point your phone: attitudes in portrait and both landscapes, declination against NOAA's test values, the filter's lag, the offset, a refused sensor (internal #450)"
        run: node tests/test_pointing.mjs
      - name: "Rises, highest and sets from a place, and the planet's card saying so (internal #299)"
        run: node tests/test_riseset.mjs
      - name: "a star as a disc of its own size"
        run: node tests/test_stardisc.mjs
      - name: "the Sun close up: limb darkening, today's sunspot groups"
        run: node tests/test_sun.mjs
      - name: "Use my location is rounded to 0.1 degree before anything keeps, shows or uses it (spec 0051 req 3, internal #137)"
        run: node tests/test_place_privacy.mjs
      - name: "?render=1 becomes ready on the sources and on the stripped tree, in the same frames; a link with no trip is refused at once (internal #423)"
        run: node tests/test_render_ready.mjs
      - name: "the UI guide: spacing grid, loaded weights, numbers in the copy, one primary, no dim grey inside a wash, no stale counts (internal #375, #198)"
        run: node tests/test_guide_rails.mjs
      - name: "the trips walk, the node half: every stop resolves, has its narration and a picture (spec 0044 task 3, internal #123)"
        run: node tests/test_trips_walk.mjs
      - name: "Back and Forward over shared views, a tracked object that loses its position, old comet links, the launch card's mission (public #331, #348, #367, #378)"
        run: node tests/test_regressions.mjs
      - name: "no spacecraft falls back to a placeholder: every model is on disc, worn, and reached by its own route (public #472)"
        run: node tests/test_real_models.mjs
      - name: "the release zip builds, unpacks and holds what it promises (public #471)"
        run: python3 tests/test_release_zip.py
      - name: "the stripped tree: the scanner on its hard cases, every module through it"
        run: python3 tests/test_minify.py
      - name: "the notifier: digests, showers, subscriptions and tokens"
        run: python3 tests/test_notify.py
      # Merged the same day (public #487) and, again, in no workflow: the step below is what found them.
      - name: "a launch within a day counts down, in Launch Library's own words for its state (public #289)"
        run: node tests/test_countdown.mjs
      - name: "one row of Coming up as an RFC 5545 calendar file (public #235)"
        run: node tests/test_ics.mjs
      - name: "what a search row says: one row for a station's modules, a planet's moons after it (public #312)"
        run: node tests/test_searchrows.mjs
      - name: "a trip does not wait 8 s for a layer that landed before its machine was imported (internal #454)"
        run: node tests/test_trip_layer_wait.mjs
      - name: "the polish sweep: the place inside the Tonight view, a model in its band, the overlay key, photo mode's share (internal #455, #421, #386, #397)"
        run: node tests/test_polish_sweep.mjs
      # The public finishers (2026-10-08): each is the missing part of an open issue.
      - name: "the scale badge: the factor computed from the dot and the camera, True size, the dots obey (public #296)"
        run: node tests/test_scalebadge.mjs
      - name: "the launch chip: which launch, what it says, the Starlink train's pass, no chase camera (public #289)"
        run: node tests/test_launchchip.mjs
      - name: "a first visit: once, three lines that fit, two buttons, one ember (public #241, #287)"
        run: node tests/test_welcome.mjs
      - name: "the opening shot: six to ten seconds, never twice, any input lands it, the words are the home's (public #287)"
        run: node tests/test_opening.mjs
      - name: "a calm deep sky: exoplanet marks off until asked for, a star's colour reads (public #271)"
        run: node tests/test_calm_sky.mjs
      - name: "model light: the world's phase as the craft sees it, the Sun's rim, the panels' glint, by tier (public #266)"
        run: node tests/test_model_light.mjs
      - name: "a reason to come back: Remind me as a calendar file, a Seen it tick in the passport (public #395)"
        run: node tests/test_comeback.mjs
      - name: "this week's story out of the catalogue: four rules, their numbers, nothing typed (public #450)"
