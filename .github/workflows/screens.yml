name: screens

# Doc 20's rule, unchanged: HQ may know about a browser. It may not run one. This job is the
# browser, on a GitHub-hosted runner.
#
# WHY THIS SERVES OVER HTTP AND ASSERTS A SELECTOR
# ------------------------------------------------
# The first version screenshotted `file:///work/site/index.html`. It went green and captured a
# picture of the app's own failure panel reading "Failed to fetch dynamically imported module",
# because a browser refuses ES module imports over file://. The artifact was a photograph of a
# broken page and the check said nothing was wrong.
#
# That is the exact shape this project keeps writing specs about: a guard that REPORTS wrongly is
# indistinguishable from one that BEHAVES wrongly and is harder to notice. So:
#
#   1. the page is served over http, which is how it is actually deployed; and
#   2. the shot waits for an element that exists only if the app booted, built its UI and got as
#      far as drawing. If it never appears the command fails and so does the job.
#
# The selector is deliberately NOT something data-dependent. CI would then depend on CelesTrak
# being up, and a red build for somebody else's outage is how a team learns to ignore red builds.
#
# EACH SHOT ASSERTS ITS OWN REGIME, AND THAT IS NOT A LOOSENING.
# Both shots used to wait for `#sr-controls`. That was only ever true of the desktop layout: below
# 600 px ui/mobile.js turns that panel into a drawer that starts CLOSED, so the mobile shot was
# asserting a desktop-shaped fact and passing on a technicality -- the closed drawer was still
# "visible" to Playwright because it was merely translated off screen. The moment a closed drawer
# became `visibility: hidden` (so a keyboard user cannot tab into 34 controls sitting below the
# fold) the technicality ran out and the job timed out for 60 s against a perfectly healthy page.
#
# So the phone shot waits for something only the phone layout draws. Since spec 0061 task 3 that is
# the sheet's handle (`#sr-side .sr-sheet__handle`, display: none at 900 px and wider), which
# ui/shell.js adds only when it has made the sidebar the phone's sheet: the app booted AND the phone
# UI is the one on screen. Desktop waits for `#sr-side`, the sidebar, which is always open there.
# (The phone's old bar, `.sr-mobilebar`, was this selector until the sheet replaced it.)

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "site/**"
      # A CHANGE TO THIS JOB MUST RUN THIS JOB. The fix below was written against a `screens`
      # failure and could not be proved by its own pull request, because the filter listed only
      # the thing being photographed and not the camera. A guard you cannot exercise on the PR
      # that changes it is a guard you find out about on somebody else's branch.
      - ".github/workflows/screens.yml"
      - "scripts/shots.mjs"
      - "scripts/check-drawn.mjs"
      # The byte gate (spec 0044) reads its number from the registry and its rules from the test.
      - "registry/budgets.yaml"
      - "tests/test_first_visit_bytes.mjs"
      # ...and gates on the tree a deploy uploads, which this script builds (internal #405).
      - "scripts/minify_site.py"
      # The UI gate and the trips walk (internal #374 and #123): each runs when what it reads changes.
      - "scripts/check-ui.mjs"
      - "tests/probes/ui_probe.js"
      - "tests/probes/ui_probe.known.json"
      - "scripts/check-trips.mjs"
      - "tools/trips-cost.probe.js"
      - "registry/tours.yaml"

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Is there a page to shoot?
        id: page
        run: |
          set -euo pipefail
          if [ -f site/index.html ]; then
            echo "found=1" >>"$GITHUB_OUTPUT"
          else
            echo "found=0" >>"$GITHUB_OUTPUT"
            echo "no site/index.html; nothing to screenshot"
          fi

      # Serve it the way the bucket does. `site/` is served as-is with no build step, so a plain
      # static server is an accurate stand-in for S3.
      - name: Serve site/
        if: steps.page.outputs.found == '1'
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8177 --directory site --bind 127.0.0.1 >/tmp/serve.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8177/index.html; then
              echo "serving"; exit 0
            fi
            sleep 0.25
          done
          echo "::error::the static server never came up"; cat /tmp/serve.log; exit 1

      # WHAT A VISITOR IS SENT (internal #405). scripts/deploy.sh uploads js/ and css/ without their
      # comments and indentation (scripts/minify_site.py); the byte gate below is on that tree, so
      # it is built here exactly as the deploy builds it -- `node --check` on every module -- and
      # served beside the source. Everything but js/ and css/ is a link to site/.
      - name: Build and serve what a deploy uploads
        if: steps.page.outputs.found == '1'
        run: |
          set -euo pipefail
          python3 scripts/minify_site.py --out "$RUNNER_TEMP/served" --tree --node node
          nohup python3 -m http.server 8178 --directory "$RUNNER_TEMP/served" --bind 127.0.0.1 >/tmp/serve-built.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8178/js/main.js; then
              echo "serving the stripped tree"; exit 0
            fi
            sleep 0.25
          done
          echo "::error::the server for the stripped tree never came up"; cat /tmp/serve-built.log; exit 1

      # `--network host` so the container can reach the runner's server on 127.0.0.1.
      # HOME is set because `-u 1001` is a uid with no passwd entry, so $HOME resolves to `/`,
      # so $HOME is `/` and the first thing npx does is fail to create `/.npm`.
      - name: Screenshot
        if: steps.page.outputs.found == '1'
        run: |
          set -euo pipefail
          mkdir -p .ci-screens
          # $3 is the "the app is up" selector for THAT viewport -- see the note at the top.
          shoot() {
            local size="$1" out="$2" selector="$3"
            docker run --rm --network host \
              -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:/work" -w /work \
              mcr.microsoft.com/playwright:v1.49.1-jammy \
              npx --yes playwright@1.49.1 screenshot \
                --viewport-size="$size" \
                --wait-for-selector="$selector" \
                --timeout=60000 \
                "http://127.0.0.1:8177/index.html" ".ci-screens/${out}.png"
          }
          shoot "1280,800" desktop "#sr-side"
          shoot "390,844"  mobile  "#sr-side .sr-sheet__handle"

      # A PICTURE NOBODY LOOKS AT IS NOT A CHECK, and this job proved it: on 2026-09-08 one flag
      # put the Milky Way in three's transparent render list, where it painted over the Earth, the
      # Moon, the Sun and every model. This job booted the app, waited for `#sr-controls`,
      # photographed a black rectangle and went green -- the same failure the header above
      # describes, one level deeper. The shots are still taken and still uploaded; this step is the
      # one that fails. It boots the app and asks the pixels whether the world is on screen.
      - name: The world is actually drawn
        if: steps.page.outputs.found == '1'
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.49.1-jammy \
            bash -c 'set -euo pipefail
              npm install --no-save --no-audit --no-fund playwright@1.49.1
              node scripts/check-drawn.mjs --base=http://127.0.0.1:8177
              # And the phone, which no review could measure until tools/cdp.mjs could boot one.
              # The same pixels, plus: no label may run off the edge of a 375 px window.
              node scripts/check-drawn.mjs --base=http://127.0.0.1:8177 --width=375 --height=812 --mobile'

      # SPEC 0044: WHAT A FIRST VISIT COSTS IS A NUMBER, not a hope. A phone boots the app with
      # CelesTrak and Launch Library blocked, waits for the layers and two seconds more, and every
      # byte that crossed the wire is summed against `first_visit_bytes` in registry/budgets.yaml.
      # Nothing under /audio/ or /og/, and neither galaxy.bin nor stars3d.bin, may be asked for at
      # all. The total and the deferrable line are in this step's log and in first-visit.json.
      # THE GATE IS THE STRIPPED TREE (8178), what a visitor is sent. The source (8177) is booted
      # after it with --info: its total is information, the rules about what may not be asked for
      # at boot hold for it too, and it is kept as first-visit-source.json.
      - name: A first visit stays inside its byte budget
        if: steps.page.outputs.found == '1'
        run: |
          set -euo pipefail
          mkdir -p .ci-screens
          docker run --rm --network host \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.49.1-jammy \
            bash -c 'set -euo pipefail
              npm install --no-save --no-audit --no-fund playwright@1.49.1
              node tests/test_first_visit_bytes.mjs --base=http://127.0.0.1:8178 --out=.ci-screens/first-visit.json
              node tests/test_first_visit_bytes.mjs --base=http://127.0.0.1:8178 --embed=moon --out=.ci-screens/first-visit-embed-moon.json
              node tests/test_first_visit_bytes.mjs --base=http://127.0.0.1:8178 --embed=25544 --out=.ci-screens/first-visit-embed-25544.json
              node tests/test_first_visit_bytes.mjs --base=http://127.0.0.1:8177 --info --out=.ci-screens/first-visit-source.json'

      # A shot that exists but is a picture of a failure panel is the thing this job used to
      # produce. The selector wait above is the real guard; this only catches an empty file.
      - name: The shots are not empty
        if: steps.page.outputs.found == '1'
        run: |
          set -euo pipefail
          for f in .ci-screens/desktop.png .ci-screens/mobile.png; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
            echo "$f $(stat -c%s "$f") bytes"
          done

      # `include-hidden-files`: `.ci-screens` starts with a dot and v4 skips hidden paths by
      # default, so without it the upload reports "No files were found" while the runner holds the
      # screenshots -- indistinguishable from the page looking like nothing.
      - uses: actions/upload-artifact@v4
        if: steps.page.outputs.found == '1'
        with:
          name: sara-screenshots
          include-hidden-files: true
          path: |
            .ci-screens/*.png
            .ci-screens/first-visit.json
            .ci-screens/first-visit-source.json
          if-no-files-found: error

  # THE UI GATE (internal #374, spec 0061 task 6; docs/ui-guide.md section 7). tests/probes/ui_probe.js
  # walks the app (home, two tabs, search, What to show, a card, the share sheet, the sources, the
  # time pill, the keys, a trip, the clear screen) as a phone and as a desktop and measures every
  # control on screen: a name, a target of 44 px under a finger and 24 px anywhere, no text under
  # 13 px, nothing scrolling sideways, one ember fill at most. A control cut by the fold or by its
  # scroller is measured by its box, which is what made the probe unusable as a gate before
  # 2026-10-08 (21 false findings in one run). Findings that are real and wait on an issue are
  # listed, with the issue, in tests/probes/ui_probe.known.json; an entry that matches nothing fails.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Serve site/
        run: |
          set -euo pipefail
          nohup python3 tools/serve.py site 8177 >/tmp/serve.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8177/index.html; then echo "serving"; exit 0; fi
            sleep 0.25
          done
          echo "::error::the static server never came up"; cat /tmp/serve.log; exit 1
      - name: Every control has a name and a target of its size, at a phone's size and a desktop's
        run: |
          set -euo pipefail
          mkdir -p .ci-screens
          docker run --rm --network host \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.49.1-jammy \
            bash -c 'set -euo pipefail
              npm install --no-save --no-audit --no-fund playwright@1.49.1
              node scripts/check-ui.mjs --base=http://127.0.0.1:8177 --out=.ci-screens/ui.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-gate
          include-hidden-files: true
          path: .ci-screens/ui.json
          if-no-files-found: warn

  # THE TRIPS WALK (internal #123, spec 0044 task 3). Every stop of every trip, as a desktop and as a
  # phone: draw calls and triangles a frame against `draw_calls_per_stop` and `triangles_per_stop`
  # in registry/budgets.yaml, and no frame empty. It is the slow job of this file (software GL, some
  # two hundred stops twice: 36 minutes on 2026-10-08), so it runs on a dispatch and when a pull
  # request changes the trips, the budgets, the probe or this file -- not on every change to site/.
  # The artefact `trip-stops` holds trips.json: one row per stop per viewport.
  trips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did anything the walk reads change?
        id: want
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=1" >>"$GITHUB_OUTPUT"; echo "dispatched"; exit 0; fi
          if [ "$EVENT" != "pull_request" ]; then echo "run=0" >>"$GITHUB_OUTPUT"; echo "not a dispatch and not a pull request"; exit 0; fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if echo "$changed" | grep -Eq '^(registry/tours\.yaml|registry/budgets\.yaml|site/js/data/tours\.js|site/js/ui/trip\.js|scripts/check-trips\.mjs|tools/trips-cost\.probe\.js|\.github/workflows/screens\.yml)$'; then
            echo "run=1" >>"$GITHUB_OUTPUT"; echo "the trips, the budgets, the probe or this file changed"
          else
            echo "run=0" >>"$GITHUB_OUTPUT"; echo "nothing the walk reads changed: skipped"
          fi
      - name: Serve site/
        if: steps.want.outputs.run == '1'
        run: |
          set -euo pipefail
          nohup python3 tools/serve.py site 8177 >/tmp/serve.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8177/index.html; then echo "serving"; exit 0; fi
            sleep 0.25
          done
          echo "::error::the static server never came up"; cat /tmp/serve.log; exit 1
      - name: Every stop of every trip inside its draw-call and triangle budgets, and none an empty frame
        if: steps.want.outputs.run == '1'
        run: |
          set -euo pipefail
          mkdir -p .ci-screens
          docker run --rm --network host \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.49.1-jammy \
            bash -c 'set -euo pipefail
              npm install --no-save --no-audit --no-fund playwright@1.49.1
              node scripts/check-trips.mjs --base=http://127.0.0.1:8177 --out=.ci-screens/trips.json'
      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.run == '1'
        with:
          name: trip-stops
          include-hidden-files: true
          path: .ci-screens/trips.json
          if-no-files-found: warn
