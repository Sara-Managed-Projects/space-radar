name: rover-positions
# Curiosity and Perseverance are drawn where NASA last placed them (registry/sites.yaml, the rows `gale` and `jezero`),
# and a rover moves. On the first of each month scripts/refresh_rover_positions.py reads the current waypoint of each
# mission map and rewrites the two rows' lat, lon, sol, day and distance; a month in which neither drove changes nothing
# and opens nothing. The pattern, the pinned actions and the permissions are star-systems.yml's.
on:
  schedule:
    - cron: "23 7 1 * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rover-positions
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Sara-Managed-Projects/space-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - name: Read NASA's two waypoint files and rewrite the two rows
        id: pull
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # A file that could not be read, a sol that went backwards or a jump of more than 50 km: the script writes
          # nothing and this step fails, so the run is red and nobody merges a guess.
          python3 scripts/refresh_rover_positions.py | tee /tmp/rover-positions.log
          python3 scripts/refresh_rover_positions.py --check
          python3 scripts/gen_sites_js.py --check
          cat /tmp/rover-positions.log >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the refresh pull request
        env:
          DATE: ${{ steps.pull.outputs.date }}
          BRANCH: auto/rover-positions
        run: |
          set -euo pipefail
          FILES=(registry/sites.yaml site/js/data/sites.js tests/fixtures/rover-waypoints.json)
          if git diff --quiet -- "${FILES[@]}"; then
            echo "Neither rover has a newer waypoint than the tree's." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "${FILES[@]}"
          git commit -m "Rover positions: NASA's waypoints, read on $DATE"
          git push --force origin "$BRANCH"
          {
            echo "Curiosity and Perseverance at NASA's current waypoints, read on $DATE (scripts/refresh_rover_positions.py)."
            echo "Only the two rows' lat, lon, as_of_sol, as_of and dist_total_m changed, the day their references were read, the fixture the test holds them to, and the mirror."
            echo
            cat /tmp/rover-positions.log
          } > /tmp/rover-positions-pr.md
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUMBER" ]; then
            if ! gh pr create --head "$BRANCH" --base main --title "Rover positions: NASA's waypoints, read on $DATE" --body-file /tmp/rover-positions-pr.md; then
              echo "::warning::Branch pushed, but the token could not open a PR. Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests, or open it manually."
              exit 1
            fi
          else
            gh pr edit "$NUMBER" --title "Rover positions: NASA's waypoints, read on $DATE" --body-file /tmp/rover-positions-pr.md
          fi
          gh workflow run ci.yml --ref "$BRANCH"
