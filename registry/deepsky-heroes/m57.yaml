# A deep-sky hero (internal spec 0075; README.md beside this file says what each field holds).
# The Ring Nebula (M57, NGC 6720): a planetary nebula seen nearly along its axis (internal spec 0076 stage W3-b, #872):
# the main ring (a thick disc nearly in the plane of the sky), the lobes through its cavity pointed almost at us,
# the inner halo round both, the knots and the white dwarf (O'Dell, Ferland, Henney & Peimbert 2013).
# Filled by stage W3-b. site/js/scene/deep/ring.js draws it; every number it draws is here.
#
# Angles are the paper's. Lengths are the paper's ARCSECONDS, turned into light-years at the record's distance
# (2 700 ly; the paper used 740 pc, Gaia's parallax of the star gives about 790 pc), so the size on the sky is the
# measured one whatever the distance. `near_pa_deg` is the position angle (east of north) of the disc's NEAR side,
# where the FAR end of its axis points (scene/deep/shellneb.js ringAxis, as the Helix's).
id: m57
record: dso-m57
stage: W3-b
# The lead's policy (2026-10-15, spec 0075 §14.4): a hero may ship signed by the maintainers, with the card saying
# that no astronomer has reviewed it yet; the independent review stays open (internal #785).
shipped: true
children: []
levels:
  2: "structure: the main ring as a crisp disc, the lobes as a spheroid through its cavity and the inner halo as a shell, all lit by the photograph (8 samples a layer; 4 on T0), the knots and the white dwarf"
  3: "close-up: the same layers marched with half the coordinator's steps a layer (12 to 24 by tier); the camera may go inside"
frame: {pa_deg: 60, incl_deg: 13.5, units_ly: 1, distance_ly: 2700, ra_deg: 283.39587, dec_deg: 33.02858, axes: "x west, y north, z toward the Sun; the white dwarf at the origin"}
# THE LIGHT. Each sky point's light (Hubble heic1310a without its stars: scripts/build_deep_ring.py,
# site/images/deep/ring/) is spread along our line through the layers it crosses, in proportion to each layer's
# `weight` times its density there, divided by that line's own column: from our side the model IS the
# photograph; turned, it is that structure foreshortened. The shape is the paper's; the light is the picture's.
light: {file: site/images/deep/ring/ring-light.webp, from: "site/images/nebulae/m57.webp (ESA/Hubble heic1310a, NASA, ESA, and C. Robert O'Dell (Vanderbilt University), CC BY 4.0)", made_by: scripts/build_deep_ring.py, note: "stars removed (they are not in the nebula; the white dwarf is drawn by the hero); nothing else changed"}
layers:
  - part: star
    kind: star
    what: "the central star, a hot white dwarf on its cooling track"
    temp_k: 135000
    temp_note: "135 000 K, the value Sahai et al. 2025 adopt from published fits of 101 000 to 162 000 K (Guerrero & De Marco 2013; Kaler & Jacoby 1989); 310 times the Sun's luminosity. It lies about 2″ from the centre of the cavity (Wesson et al. 2024); drawn at the record's centre. Its colour is a blackbody's; its halo is in the material, not a bloom"
    source: "Sahai et al. 2025, ApJ 985 (arXiv:2504.01188), section on the central star's temperature"
  - part: disc
    kind: disc
    what: "the main ring: an irregular, ionisation-bounded disc with a central cavity, lying almost in the plane of the sky"
    semi_major_arcsec: 44
    semi_minor_arcsec: 30
    major_pa_deg: 60
    tilt_deg: 13.5
    near_pa_deg: 60
    inner_q: 0.5
    thickness_arcsec: 28
    weight: 1
    lines: [HeII, OIII, Ha, NII]
    light: "the photograph's, shared with the lobes and the halo by density along our line"
    check: "Measured here on the photograph the app shows (heic1310a, north turned 11.2° as its archive says): its light's second moments give a major axis at PA 62° and an axis ratio 0.78, beside the paper's 60° and 30/44 = 0.68 (the moments include the halo); the light falls to a tenth of the ring's at about 44″"
    thickness_note: "the paper gives the disc's extent in the sky and its tilt, not its thickness: it is drawn 28″ thick (about the ring's own width) with crisp faces, as an illustration. The cavity's edge at half the ring's radii is read from the photograph (the blue inner zone ends at about 16″ to 22″). The minor axis's slight tilt toward the SE (5 ± 2 km/s) is not drawn: the paper does not say which end is near"
    source: "O'Dell, Ferland, Henney & Peimbert 2013, AJ 145, 92 (arXiv:1301.6636), abstract and sections II.1, III.3: \"a highly irregular ionization-bounded disk lying almost in the plane of the sky\", \"ionization bounded at about 42″ along the semi-major axis\" (about 30″ along the minor), semi-major and semi-minor axes at PA 60° and 330°, \"our value of the tilt is 13.5°\", the SW tip of the major axis redshifted"
  - part: lobes
    kind: lobes
    what: "the lobes: \"a pair of extended Lobes pointed almost at the observer\" through the ring's cavity, the bluest light (He II and [O III])"
    equator_q: 0.52
    polar_semi_axis_arcsec: 59
    weight: 1
    drawn: "one prolate spheroid along the disc's axis, as wide as the cavity and 59″ long each way, even inside: an ILLUSTRATION of their form. The paper has \"no evidence about the form of the Lobes\"; the length is the polar semi-axis of O'Dell, Sabbadin & Henney 2007; the press release of the same data calls it \"a rugby ball slotted into the doughnut's central gap\""
    source: "O'Dell, Ferland, Henney & Peimbert 2013, AJ 145, 92, section IV item 4 and section III.4; O'Dell, Sabbadin & Henney 2007, AJ 134, 1679 (the semi-polar axis, 59″); ESA/Hubble heic1310 (2013-05-23)"
  - part: halo
    kind: shell
    what: "the inner halo: loops round the ring, the light of an earlier, fuller ionisation"
    inner_arcsec: 44
    outer_arcsec: 62
    weight: 0.05
    drawn: "a thick spherical shell from the ring's edge to 62″, even inside, lit by the photograph's faint fringe: an illustration. The paper puts \"almost all\" of the loops \"within 65″\" of the star; 62″ is where the photograph's light ends. Its weight (0.05 against the ring's 1) keeps the ring's own light on the ring"
    source: "O'Dell, Ferland, Henney & Peimbert 2013, AJ 145, 92, section III.4"
  - part: outer
    kind: shell
    what: "the outer halo, a thin, nearly circular shell"
    diameter_arcsec: 230
    drawn: none
    note: "115″ in radius, outside the 2.1′ photograph the hero is lit by: not drawn. The ten arcs Webb found in the halo (Wesson et al. 2024) are not drawn either"
    source: "O'Dell, Ferland, Henney & Peimbert 2013, AJ 145, 92, section I and III.4: \"outer halo of about 115″ radius\""
  - part: knots
    kind: knots
    what: "the dense globules: dark knots with ionised rims, near the ionisation boundary"
    count_estimated: 20000
    count_drawn: [400, 800, 1200]
    q_from: 0.72
    q_to: 1.0
    head_au: 150
    tail_au: 300
    min_px: 2.2
    drawn: "a seeded sample (model): the count and the size are measured, each knot's place is not, and the 300 au tail is an illustration. Under 2.2 px a knot is drawn 2.2 px wide and its darkness EXAGGERATED (it falls as one over the square root of the enlargement, not as one over its area), so that they can be seen at mid distance"
    source: "O'Dell, Ferland, Henney & Peimbert 2013, AJ 145, 92, sections II.2 and the summary (about 0.2″, 150 au, near the current ionisation boundaries); Wesson et al. 2024, MNRAS (arXiv:2308.09027, CC BY 4.0): \"some 20 000 dense globules\" of about 0.2″"
colours:
  mode: enhanced
  lines: {Ha: "#f08a50", star: "#c9d8ff"}
  note: "NARROWBAND under every look: the photograph's own colours, its helium, oxygen, hydrogen, nitrogen and sulphur filters given colours by ESA/Hubble (registry/nebulae.yaml `colours: narrowband`), shown with each exposure's stretch as the photograph is (scene/exposure.js). Not what an eye sees. The knots' cusps take the rim's Hα + [N II] colour; the star a 135 000 K blackbody's"
  enhanced:
    mode: enhanced
    under: deep
    lines: {Ha: "#ff3b2f", star: "#c9d8ff"}
    note: "Deep: further ENHANCED, the photograph's own Deep stretch (as scene/nebulae.js gives every photograph), and the cusps in the Hα red of Hubble's line images"
drawn: [reconstruction]
sources:
  - "O'Dell, C. R., Ferland, G. J., Henney, W. J. & Peimbert, M. 2013, Studies of NGC 6720 with Calibrated HST WFC3 Emission-Line Filter Images. I. Structure and Evolution, AJ 145, 92 (https://arxiv.org/abs/1301.6636): the disc, its size, axes and tilt, the cavity, the lobes, the halos, the knots"
  - "O'Dell, C. R., Sabbadin, F. & Henney, W. J. 2007, AJ 134, 1679: the polar semi-axis (59″), used for the lobes' length"
  - "ESA/Hubble heic1310, New view of the Ring Nebula (https://esahubble.org/news/heic1310/, read 2026-10-16): \"shaped like a distorted doughnut\", \"a rugby ball slotted into the doughnut's central gap\". Read for the interpretation; nothing of it is shipped but the photograph"
  - "Wesson, R. et al. 2024, JWST observations of the Ring Nebula (NGC 6720): I. Imaging of the rings, globules, and arcs, MNRAS (https://arxiv.org/abs/2308.09027): the globules' count and size"
  - "Sahai, R. et al. 2025, JWST observations of the Ring Nebula (NGC 6720). III. A dusty disk around its central star, ApJ 985 (https://arxiv.org/abs/2504.01188): the star's temperature"
  - "ESA/Hubble heic1310a (NASA, ESA, and C. Robert O'Dell (Vanderbilt University), CC BY 4.0), the photograph the app already shows: the hero's LIGHT (its stars removed, site/images/deep/ring/ring-light.webp), and the ring's projected axis, measured from it"
review:
  data_vs_model: "Measured: the sizes on the sky, the major axis's position angle and tilt (and which end is near), the knots' count and size, the star's temperature, and the light (the photograph). Model: which layer each sky point's light belongs to (by density along our line), the disc's thickness and crisp faces, the cavity's edge, the lobes' form, the halo as a shell, each layer's self-absorption, each knot's place (seeded) and its exaggerated darkness"
  geometry: "O'Dell, Ferland, Henney & Peimbert 2013 (a disc nearly in the plane of the sky, 44″ by 30″ at PA 60°, tilted 13.5° with the NE end near; lobes nearly along our line; the inner halo within 65″). The projected axis checked against the photograph (62° measured, 60° published). The lobes' form and the disc's thickness are not measured; said on the card"
  colours: "The photograph's own narrowband colours under every look, with each exposure's stretch as the photograph has it; declared enhanced"
  distance: "2 700 ly, the record's (registry/dso-hand.yaml and OpenNGC); the paper used 740 pc (2 400 ly) and Gaia's parallax of the star gives about 790 pc (2 600 ly). The paper's arcseconds are scaled to the record's distance, so its size on the sky is kept"
  credits: "CREDITS.md section 3l, The Ring (0076 W3-b); the card's source line names the paper"
  by: "Space Radar maintainers"
  date: 2026-10-16
  astronomer: "not yet: the independent review is internal #785; the card says so"
credits:
  - "The Ring's 3D shape: O'Dell, Ferland, Henney & Peimbert 2013, AJ 145, 92 (the disc, its axes and tilt, the lobes, the halos); the lobes' length after O'Dell, Sabbadin & Henney 2007, AJ 134, 1679"
  - "The globules: O'Dell et al. 2013; Wesson et al. 2024, MNRAS (CC BY 4.0)"
  - "The white dwarf's temperature: Sahai et al. 2025, ApJ 985"
  - "Its light: the photograph heic1310a, NASA, ESA, and C. Robert O'Dell (Vanderbilt University) (CC BY 4.0), its stars removed by Space Radar"
