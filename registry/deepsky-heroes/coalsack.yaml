# A deep-sky hero (internal spec 0075; README.md beside this file says what each field holds).
# The Coalsack as a DARK CLOUD in front of the Milky Way: dust about 590 ly away beside the Southern Cross that dims
# and reddens the stars behind it (internal spec 0076 stage W3-c, internal #784, #806). Drawn by
# site/js/scene/deep/dustsheet.js, the one module every dark and reflection nebula shares; its map is baked by
# scripts/build_deep_sheets.py from the Milky Way map the app already shows.
#
# WHAT IS MEASURED AND WHAT IS RECONSTRUCTED.
#   Measured: the distance (the record's, 587 ly: the near cloud, 150 to 200 pc in the surveys Beuther et al. 2011
#   list), the place and size, and the DARKNESS: the Milky Way map the app draws (NASA's Deep Star Maps 2020, from
#   Gaia DR2 star counts and colours).
#   Reconstructed: the dust's optical depth, from how much darker the map is than the Milky Way round it (the rule
#   under `dust:`), and the cloud's thickness. The map's darkness includes the light of the stars in front of the cloud,
#   so this optical depth is LOWER than the near-infrared maps' (above 6 and up to 10 magnitudes in a few places,
#   Kainulainen et al. 2009 as Beuther et al. 2011 show it), and part of the darkness in the north-east is a second
#   cloud 3 kpc away (Beuther et al. 2011), drawn here at the near distance.
#   The dust only ABSORBS: it dims and reddens what is behind it (a multiply blend in its own material) and adds no
#   light of its own. The catalogue's stars IN FRONT of it are not dimmed (scripts/build_deep_sheets.py lists them).
id: coalsack
record: dso-coalsack
stage: W3-c
# HELD by the lead (2026-10-17, #1215): faint against the rung's dim backdrop, and 7.7x the frame on a phone from the per-pixel
# kept-star loop. The code stays; `shipped: true` again once the kept stars are tested per vertex or on the CPU.
shipped: false
children: []
levels:
  2: "structure: each layer one sheet over its picture (64 x 64 vertices; 32 on T0 and under the latch, 96 on T2), drawn far to near: the dust multiplies what is behind it, the glow adds"
  3: "close-up: the same sheets; the camera may go between them"
frame: {units_ly: 1, distance_ly: 587, ra_deg: 192.5, dec_deg: -62.5, axes: "x west, y north, z toward the Sun; the record's place at the origin"}
layers:
  - part: dust
    kind: dust
    what: "the near cloud of the Coalsack: dust that absorbs and reddens, never glows"
    file: site/images/deep/sheets/coalsack-dust.webp
    from: "site/textures/4k/milky_way.webp (NASA/Goddard Space Flight Center Scientific Visualization Studio, Gaia DR2: ESA/Gaia/DPAC), resampled north up on the sky round the record"
    # The resampled map's place: a tangent plane at the record, north up, east left.
    picture: {ra_deg: 192.5, dec_deg: -62.5, width_arcmin: 840, height_arcmin: 840, north_deg: 0}
    px: 256
    # THE RULE (horsehead.yaml says it in full), with the glow it is seen against taken as the Milky Way AT THE SAME
    # GALACTIC LATITUDE: per row of the map, the median over `window_deg` of longitude either side (the cloud is a few
    # degrees across and does not move the median), both smoothed over `smooth_arcmin`. Darker than `dark_below` of
    # that is optical depth ln(dark_below x background / map).
    rule: {background: galactic-latitude, window_deg: 15, smooth_arcmin: 12, envelope_arcmin: 150, blur_arcmin: 60, dark_below: 0.85, cloud_below: 0, cloud_tau: 0}
    tau_max: 3.0
    # the picture's edge feathered from 0.5 to 0.95 of its half-size (scene/deep/remnant.js coverAt): the cloud runs on past it
    feather: [0.5, 0.95]
    # The cloud at the record's depth, lifted toward us by up to `half_ly` where it is thickest (by the square root of
    # its optical depth), so turned it is a lumpy cloud (illustrative: the cloud is about 70 ly across).
    front: {z_ly: 0, half_ly: 9.0}
    reddening: {law: "Cardelli, Clayton & Mathis 1989", rv: 3.1, lambda_um: [0.61, 0.55, 0.45]}
    source: "The Milky Way map's darkness against the Milky Way round it (reconstructed by Space Radar, scripts/build_deep_sheets.py); NASA SVS Deep Star Maps 2020 (https://svs.gsfc.nasa.gov/4851/); the extinction law: Cardelli, Clayton & Mathis 1989, ApJ 345, 245, R_V = 3.1"
colours:
  mode: true
  lines: {}
  note: "Nothing of its own is drawn: the dust dims and reddens what is behind it by the Cardelli, Clayton and Mathis law"
drawn: [reconstruction]
sources:
  - "Beuther, H. et al. 2011, The Coalsack near and far, A&A (https://arxiv.org/abs/1107.2298): the near cloud at 100 to 200 pc, a second cloud at about 3.1 kpc in the north-east, extinction above 6 and up to 10 magnitudes in a few places"
  - "NASA/Goddard Space Flight Center Scientific Visualization Studio, Deep Star Maps 2020 (Gaia DR2: ESA/Gaia/DPAC), the Milky Way map the app already shows: the cloud's darkness"
  - "Cardelli, J. A., Clayton, G. C. & Mathis, J. S. 1989, ApJ 345, 245: the extinction law (R_V = 3.1)"
review:
  data_vs_model: "Measured: the distance, place and size, and the darkness (the Milky Way map). Reconstructed: the optical depth from the darkness (the rule; lower than the near-infrared maps'), the cloud's thickness; the far cloud drawn at the near distance, said on the card"
  geometry: "One cloud at the near distance (Beuther et al. 2011 find several clouds, one at 3 kpc); its thickness is illustrative"
  colours: "None of its own; the reddening of what is behind is Cardelli, Clayton and Mathis's law"
  distance: "587 ly, the record's (180 pc), inside the 100 to 200 pc the surveys give"
  credits: "CREDITS.md section 3l, Remnants and dust (0076 W3-c); the card's rows name the reconstruction and that no astronomer has reviewed it"
  by: "Space Radar maintainers"
  date: 2026-10-17
  astronomer: "not yet: the independent review is internal #785; the card says so"
credits:
  - "The Coalsack as a dark cloud: Beuther et al. 2011, A&A; reconstructed by Space Radar from the darkness of NASA's Deep Star Maps 2020 (NASA/Goddard Space Flight Center Scientific Visualization Studio, Gaia DR2: ESA/Gaia/DPAC)"
  - "The extinction law: Cardelli, Clayton & Mathis 1989, ApJ 345, 245"
