# A deep-sky hero (internal spec 0075; README.md beside this file says what each field holds).
# The Sombrero Galaxy (M104, NGC 4594), drawn by the morphology generator (site/js/scene/deep/spiral.js) from its own published
# numbers (internal #873; release 1.3.0 stage W3-f). Numbers are published (their `source`), `assumed` or `illustrative`, as
# m31.yaml's head explains. Lengths in kpc at the record's distance (29.8 Mly, 9.14 Mpc: 1 arcsec is 44.3 pc).
id: m104
record: dso-m104
stage: W3-f
shipped: true
children: []
levels:
  2: "the structure: a huge round bulge drawn as round from every side, a thin disc almost edge on with its ring of stars, and the dust ring in front; statistical points as sparkle"
  3: "the same, larger on screen"
  points: [12000, 45000, 70000]
  dust_share: 0.45
  seed: 104
frame:
  pa_deg: 89.25       # Bendo et al. 2006 (arXiv:astro-ph/0603160, table 3): 89.25 +/- 0.06 degrees for the dust ring
  incl_deg: 84        # Emsellem et al. 1996 as Gadotti 2012 cites it; Sutter et al. 2022 fit the CO ring at 84.3 +/- 0.2
  near_side: null     # NOT FOUND in any source read: the tilt's sign is assumed (the dust lane is drawn across the bulge's middle either way)
  approaching: null
  winding: 1
  bulge: always       # the bulge is round from every side: drawn by its billboard edge on too, its points only sparkle (0077 W3-f)
  units_ly: 100
  source: "position angle: Bendo et al. 2006; inclination: Emsellem et al. 1996 via Gadotti 2012, and Sutter et al. 2022"
