  - {kind: disc, what: "the stellar disc", scale_kpc: 2.7, height_kpc: 0.8, r_max_kpc: 12, light: 0.2, arm_contrast: 0, colour: "#e6e0d8", colour_outer: "#d8d6d4",
     source: "Gadotti 2012 (table 1): the disc's scale length 61 arcsec (2.7 kpc here) and height 18 arcsec (0.8 kpc); cut at 12 kpc"}
  - {kind: ring, what: "the ring of stars and gas under the dust", radius_kpc: 6.41, width_kpc: 0.7, height_kpc: 0.12, light: 0.06, colour: "#efe4dc",
     source: "at the dust ring's radius (Bendo et al. 2006); its light share and width illustrative"}
  - {kind: dust-ring, what: "the dust ring", radius_kpc: [6.41], width_kpc: 1.01, height_kpc: 0.12, weight: 0.85,
