version: 1
# THE VISUAL CLASSES: which renderer draws every record, how honest the drawing is, and where its words come
# from (internal spec 0076 stage W2-e; internal #859 for SR-PLAN-102, -104, -174 and the 38 class source notes,
# #921 for SR-PLAN-183).
#
# The package of 2026-10-15 (internal specs/0076-release-1-2/package-2026-10-15/04_OBJECT_TYPE_SPECS/) names 38
# classes of thing, from SUN to SPECTRAL_SKY. This file maps each onto the modules of this repository that draw
# it today; it does not invent a renderer, and a class nothing draws says where one is planned. Four classes of
# the house (`house: true`) hold what the package has no class for: the Earth's live data, ground stations,
# oddities and the layers that draw several classes at once.
#
# scripts/coverage.py reads every registry, gives each record ONE class by the selectors under `records:`, and
# writes docs/COVERAGE.md (one section per class, from `note:`) and, through scripts/gen_visual_classes_js.py,
# site/js/data/visualclasses.js (for search by kind, spec 0076 W3-e). tests/test_coverage.py fails on a record
# no class takes (or two take), a class with records and no renderer, a renderer that is not a file, a record
# with no source or no credit CREDITS.md carries, and an illustrative record whose words claim a measurement.
#
# A class:
#   id         the package's renderer id (or the house's)
#   title      what a person calls it
#   house      true for a class the package does not have
#   renderer   the modules that draw its records, paths from the repository root; [] only with `planned:`
#   planned    where a renderer is planned, when there is none
#   honesty    measured | modelled | illustrative: what a record of the class is, unless the record says
#              otherwise (dso.json `drawn`, a real model's `honesty`, a weather effect's `class`, an oddity's
#              `position_class`), or a selector's own `honesty:` does
#   fallback   what a weak device draws: tier 0 (scene/quality.js), or any device after the frame latch
#   heroes     record id -> the file that overrides the class for it (registry/deepsky-heroes/*.yaml and the like)
#   issue      where what is missing is tracked
#   note       the source note (the package's SR-PLAN-002 to -076, one per class), written by a person:
#              source   what the drawing is made from
#              dates    the dates, the filters or bands, the epoch
#              drawn    what is measured, what is modelled or reconstructed, what is illustrative
#              rights   the licences, as CREDITS.md quotes them
#   records    selectors: {domain, ids | prefix | where, honesty}. `where:` compares a record's field to a value
#              or a list of values; a value that starts with ^ is a regular expression.
#
# A domain is a set of records and the file it is read from (scripts/coverage.py LOADERS reads each). `source:`
# and `credit:` are what a record of the domain is attributed to when it names nothing itself; a credit is a
# line CREDITS.md carries word for word.

domains:
  - id: worlds
    from: "registry/worlds.yaml (credit and source from the world's map row in registry/models.yaml `textures`)"
    credits:
      deimos: {credit: "Deimos: Thomas, P.C. et al. (2021), *Small Body Optical Shape Models V1.0*, NASA Planetary Data System", source: "https://doi.org/10.26033/g5e0-kh52"}
  - id: rings
    from: "registry/worlds.yaml rows with `look.ring` (credit from the ring's map row)"
  - id: dso
    from: "site/data/dso.json (built by scripts/build-dso.py from OpenNGC and registry/dso-hand.yaml)"
    credit: "Object data from OpenNGC, © Mattia Verga"
  - id: photographs
    from: "registry/nebulae.yaml `pictures`"
  - id: heroes
    from: "registry/deepsky-heroes/*.yaml (credit: its section of CREDITS.md 3l, which its `review.credits` names)"
    credits:
      helix: {credit: "### The Helix (stage b)"}
      lmc: {credit: "### The Large Magellanic Cloud and the Tarantula (stage c)"}
      m31: {credit: "### Andromeda and the Triangulum Galaxy (stage d)"}
      m33: {credit: "### Andromeda and the Triangulum Galaxy (stage d)"}
      orion: {credit: "### Orion (0076 W1-a)"}
      m57: {credit: "### The Ring (0076 W3-b)"}
      crab: {credit: "### Remnants and dust (0076 W3-c)"}
      veil: {credit: "### Remnants and dust (0076 W3-c)"}
      horsehead: {credit: "### Remnants and dust (0076 W3-c)"}
      coalsack: {credit: "### Remnants and dust (0076 W3-c)"}
      m78: {credit: "### Remnants and dust (0076 W3-c)"}
      iris: {credit: "### Remnants and dust (0076 W3-c)"}
      carina: {credit: "### Carina (0077 W2-e)"}  # 0077 W2-e
      smc: {credit: "### The SMC and the Magellanic Stream (0077 W2-e)"}  # 0077 W2-e
      # 0077 W3-f: begin
      m51: {credit: "### Galaxies from their structure (0077 W3-f)"}
      m81: {credit: "### Galaxies from their structure (0077 W3-f)"}
      m101: {credit: "### Galaxies from their structure (0077 W3-f)"}
      m104: {credit: "### Galaxies from their structure (0077 W3-f)"}
      antennae: {credit: "### Galaxies from their structure (0077 W3-f)"}
      # 0077 W3-f: end
      # 0078 r14-neb-a: begin
      m8: {credit: "### Emission nebulae (0078 r14-neb-a)"}
      m20: {credit: "### Emission nebulae (0078 r14-neb-a)"}
      m16: {credit: "### Emission nebulae (0078 r14-neb-a)"}
      m17: {credit: "### Emission nebulae (0078 r14-neb-a)"}
      rosette: {credit: "### Emission nebulae (0078 r14-neb-a)"}
      california: {credit: "### Emission nebulae (0078 r14-neb-a)"}
      north-america: {credit: "### Emission nebulae (0078 r14-neb-a)"}
      cats-paw: {credit: "### Emission nebulae (0078 r14-neb-a)"}
      # 0078 r14-neb-a: end
      # 0078 r14-neb-b: begin
      m27: {credit: "### No photographs in the scene: six more objects in 3D (0078 r14-neb-b)"}
      southern-ring: {credit: "### No photographs in the scene: six more objects in 3D (0078 r14-neb-b)"}
      m45: {credit: "### No photographs in the scene: six more objects in 3D (0078 r14-neb-b)"}
      m83: {credit: "### No photographs in the scene: six more objects in 3D (0078 r14-neb-b)"}
      ngc1300: {credit: "### No photographs in the scene: six more objects in 3D (0078 r14-neb-b)"}
      cena: {credit: "### No photographs in the scene: six more objects in 3D (0078 r14-neb-b)"}
      # 0078 r14-neb-b: end
  - id: exotics
    from: "registry/exotics.yaml"
    credit: "each read from the Wikipedia article's infobox"
  - id: systems
    from: "registry/systems.yaml and registry/systems-generated.yaml"
    credit: "Exoplanets: NASA Exoplanet Archive (Caltech/IPAC), DOI 10.26133/NEA13"
  - id: planets
    from: "the `planets:` of every system above"
    credit: "Exoplanets: NASA Exoplanet Archive (Caltech/IPAC), DOI 10.26133/NEA13"
  - id: stars_notable
    from: "registry/stars-notable.yaml"
    credit: "Notable stars: the line on each card is this project's, from the Wikipedia article the row of `registry/stars-notable.yaml` names"
  - id: catalogues
    from: "site/data/stars3d.bin, site/data/deep/localvolume.json, site/images/deep/cmb/wmap-ilc-9yr.json, registry/ladder.yaml rungs that name a place"
    credits:
      stars3d: {credit: "Star data from the HYG Stellar Database v4.4, © David Nash"}
      edge: {credit: "**The cosmology** (`site/js/data/cosmology.js`): Planck Collaboration"}
  - id: other_light
    from: "registry/otherlight.yaml `bands`"
  - id: sites
    from: "registry/sites.yaml (source: the row's `references:` entry)"
    credit: "Landing sites, dishes and pads: each row of `registry/sites.yaml` names its reference"
  - id: real_models
    from: "registry/models.yaml `real_models`"
  - id: model_kinds
    from: "registry/models.yaml `models` (the procedural and illustrative builders)"
    credit: "Space Radar's own code is MIT"
  - id: small_bodies
    loader: small_bodies
    from: "site/js/data/sample.js ASTEROIDS, FAR_BODIES, NAMED_COMETS (source and credit from the registry/sources.yaml row each builder names)"
    arrays: {ASTEROIDS: jpl-sbdb-neo, FAR_BODIES: jpl-sbdb-neo, NAMED_COMETS: horizons-deep-space}
  - id: probes
    from: "site/js/data/sample.js, the deep-space craft (sampleDeepSpace())"
    arrays: {ANCHORED_CRAFT: horizons-deep-space, PLANET_ORBITERS: horizons-deep-space, CRUISING_CRAFT: horizons-deep-space, LOST_ORBITERS: horizons-deep-space, PAST_CRAFT: horizons-deep-space, ELLIPTIC_CRAFT: horizons-deep-space, OSCULATING_CRAFT: horizons-deep-space}
  - id: reentries
    from: "site/js/data/sample.js REENTRIES (sampleReentries())"
    arrays: {REENTRIES: space-track-tip}
  - id: rockets
    from: "registry/rockets.yaml"
    credit: "Rockets: the heights, widths and shapes in `registry/rockets.yaml`"
  - id: oddities
    from: "registry/oddities.yaml"
    credit: "Oddities: each row of `registry/oddities.yaml` cites where it was read"
  - id: weather
    from: "registry/weather.yaml `effects`"
    credit: "papers, each named with its DOI in `registry/weather.yaml`"
  - id: layers
    from: "registry/layers.yaml, enabled rows (source and credit from its registry/sources.yaml row, else below)"
    credits:
      worlds: {credit: "Planet textures: Solar System Scope (solarsystemscope.com), CC BY 4.0", source: registry/worlds.yaml}
      stars: {credit: "Star data from the HYG Stellar Database v4.4, © David Nash", source: "https://codeberg.org/astronexus/hyg"}
      systems: {credit: "Exoplanets: NASA Exoplanet Archive (Caltech/IPAC), DOI 10.26133/NEA13", source: registry/systems-generated.yaml}
      deep-sky: {credit: "Object data from OpenNGC, © Mattia Verga", source: "https://github.com/mattiaverga/OpenNGC"}
      galaxy: {credit: "Reid, M. J. et al. 2019", source: "scripts/build-galaxy.py (Reid et al. 2019, ApJ 885, 131)"}
      exotics: {credit: "each read from the Wikipedia article's infobox", source: registry/exotics.yaml}
      far-bodies: {credit: "Orbits: NASA/JPL Small-Body Database", source: "https://ssd-api.jpl.nasa.gov/sbdb.api"}
      hand-kept-sites: {credit: "Landing sites, dishes and pads: each row of `registry/sites.yaml` names its reference", source: registry/sites.yaml}
      lightning: {credit: "NOAA nowCOAST", source: "registry/weather.yaml earth-lightning"}
      earth-events: {credit: "Fires, volcanoes and sea ice: NASA EONET", source: "registry/weather.yaml earth-events"}
      oddities: {credit: "Oddities: each row of `registry/oddities.yaml` cites where it was read", source: registry/oddities.yaml}

classes:
  # --- the Sun and the planets -------------------------------------------------------------------------
  - id: SUN
    title: The Sun
    renderer: [site/js/scene/sun.js, site/js/scene/sunimage.js]
    honesty: modelled
    fallback: The 2k photosphere map with modelled limb darkening; no granulation grain on tier 0 or after the latch.
    note:
      source: "Solar System Scope's 2k map for the disc; NOAA SWPC's sunspot regions, flares and CMEs from NASA DONKI, read live with saved copies; SDO/AIA 171 Å, the newest picture of the day (0076 W1-d)."
      dates: "The regions and the flares are the day's; the SDO picture is dated on the card; the 2k map has no date (a composite)."
      drawn: "Measured: where the regions are, the SDO picture under Measured. Modelled: limb darkening, granulation, faculae, the corona's shape. Illustrative: the loops over the regions (Film only, labelled)."
      rights: "Solar System Scope CC BY 4.0; NOAA and NASA data not subject to copyright in the United States; SDO courtesy of NASA/SDO and the AIA, EVE and HMI science teams."
    records:
      - {domain: worlds, ids: [sun]}

  - id: ROCKY_PLANET
    title: Rocky planets
    renderer: [site/js/scene/worlds.js, site/js/scene/earth.js, site/js/scene/atmosphere.js, site/js/scene/tiles.js]
    honesty: measured
    fallback: The 2k map on a sphere; no relief, no 4k map, no tiles and no shadow march on tier 0 or after the latch.
    issue: "public #404 (Mercury tiles), spec 0073 tasks 11 and 12"
    note:
      source: "MESSENGER MDIS mosaic and DEM for Mercury (USGS); Magellan radar mosaic and altimetry for Venus (USGS, NASA/JPL-Caltech); Blue Marble Next Generation, Black Marble 2016 and ETOPO 2022 for the Earth; MGS MOLA heights for Mars; NASA Solar System Treks tiles close up."
      dates: "Composites over each mission's life (MESSENGER 2011-2015, Magellan 1990-1994, MOLA 1997-2001); the Earth's day map by month (2004)."
      drawn: "Measured: the maps and the heights. Modelled: the atmosphere's scattering, Mars's shadows marched over MOLA. Illustrative: Mars's seasonal dust (weather.yaml, labelled)."
      rights: "USGS, NASA and NOAA works are public domain or CC0; Solar System Scope's 2k maps CC BY 4.0."
    records:
      - {domain: worlds, ids: [mercury, venus, earth, mars]}
      - {domain: weather, where: {world: [mars, venus]}}

  - id: GAS_GIANT
    title: Gas giants
    renderer: [site/js/scene/worlds.js, site/js/scene/weather/worldweather.js, site/js/scene/weather/flow.js]
    honesty: measured
    fallback: The 2k map, its bands carried by the measured winds; no eddies, detail or lightning on tier 0.
    issue: "#860 (the Great Red Spot's dated longitude and drift, W2-b)"
    note:
      source: "Hubble OPAL global maps (A.A. Simon, M.H. Wong) for the 4k faces; zonal wind profiles from Tollefson et al. 2017 (Jupiter) and García-Melendo et al. 2011 (Saturn); Juno's polar cyclones (Adriani et al. 2018); Cassini's hexagon and polar vortex."
      dates: "OPAL maps of one epoch each, named in CREDITS.md section 2; the wind profiles at their papers' epochs."
      drawn: "Measured: the maps and the band speeds. Modelled: bands and ovals moved by the wind profiles. Illustrative and labelled: eddies, detail below the map's resolution, the hexagon's and the vortex's faces, lightning."
      rights: "Hubble OPAL CC BY 4.0 (NASA, ESA, A.A. Simon, M.H. Wong), adapted; Solar System Scope CC BY 4.0; papers cited, nothing of theirs copied."
    records:
      - {domain: worlds, ids: [jupiter, saturn]}
      - {domain: weather, where: {world: [jupiter, saturn]}}

  - id: ICE_GIANT
    title: Uranus and Neptune
    renderer: [site/js/scene/worlds.js, site/js/scene/weather/worldweather.js]
    honesty: measured
    fallback: The 2k map at the real tilt; no drift or cirrus detail on tier 0.
    issue: "#860 (Uranus's dark rings, W2-b)"
    note:
      source: "Hubble OPAL faces of Uranus and Neptune; Sromovsky et al. 1993 and 2015 for the cloud drift; Voyager 2's Neptune cirrus pictures (NASA/JPL)."
      dates: "OPAL 2025 faces; Voyager 2 1986 (Uranus) and 1989 (Neptune)."
      drawn: "Measured: the faces and the tilt. Modelled: the drift by latitude. Illustrative and labelled: Neptune's bright cirrus and the detail below the map."
      rights: "Hubble OPAL CC BY 4.0, adapted; Voyager pictures public domain."
    records:
      - {domain: worlds, ids: [uranus, neptune]}
      - {domain: weather, where: {world: [uranus, neptune]}}

  - id: RINGS
    title: Planetary rings
    renderer: [site/js/scene/worlds.js, site/js/scene/ringgrains.js] # 0077 W1-f
    honesty: modelled
    fallback: The ring's alpha map as a lit slab; the fine ringlets, grain and particles only on tier 1 and up, never after the latch. # 0077 W1-f
    note:
      source: "Cassini UVIS stellar occultation of Beta Centauri (Colwell et al. 2010, PDS Ring-Moon Systems Node) for Saturn's 8k ringlets; Solar System Scope's ring alpha map; the Cassini Division at its measured radii."
      dates: "The occultation of 2008 (Cassini orbit 77)."
      drawn: "Measured: the radii and the optical depth profile. Modelled: the slab lit from both sides, its shadows and grain; within 25 km of Saturn's ring plane the particles of 2 to 5 m as balls, as many and as big as the measured size spread and optical depth say (French and Nicholson 2000). Illustrative and labelled: where each particle is, the A ring's wake clumps, and that they hold still." # 0077 W1-f
      rights: "PDS data public domain; Solar System Scope CC BY 4.0."
    records:
      - {domain: rings}

  # --- moons and small worlds --------------------------------------------------------------------------
  - id: VOLCANIC_MOON
    title: Io
    renderer: [site/js/scene/worlds.js]
    honesty: measured
    fallback: The 2k map on a sphere.
    issue: "#861 (plumes and hot spots, W2-c)"
    note:
      source: "USGS Astrogeology's Io mosaic from Galileo SSI and Voyager."
      dates: "Galileo 1996-2001 and Voyager 1979 images, one global mosaic."
      drawn: "Measured: the map. No plume or hot spot is drawn yet."
      rights: "USGS public domain."
    records:
      - {domain: worlds, ids: [io]}

  - id: ICY_MOON
    title: Icy moons
    renderer: [site/js/scene/worlds.js]
    honesty: measured
    fallback: The 2k (or 1k) map on a sphere, tinted with the world's flat colour.
    issue: "#862 (Enceladus and Triton plumes, W2-c)"
    note:
      source: "USGS mosaics of Europa, Ganymede, Callisto (Voyager, Galileo SSI); P. Schenk's Cassini colour maps of Saturn's moons (LPI); Voyager 2 maps of Uranus's five and Triton; New Horizons MVIC for Charon."
      dates: "Voyager 1979-1989, Galileo 1996-2003, Cassini 2004-2017, New Horizons 2015."
      drawn: "Measured: the maps. Black-and-white mosaics tinted with the flat colour (said in CREDITS.md section 2); nothing drawn where nobody has looked."
      rights: "USGS, NASA/JPL-Caltech, LPI and JHUAPL/SwRI works, public domain."
    records:
      - {domain: worlds, ids: [europa, ganymede, callisto, enceladus, triton, charon, mimas, tethys, dione, rhea, iapetus, miranda, ariel, umbriel, titania, oberon]}

  - id: TITAN
    title: Titan
    renderer: [site/js/scene/worlds.js, site/js/scene/atmosphere.js]
    honesty: measured
    fallback: The 938 nm map under its haze shell.
    issue: "#863 (done in 1.3.0, 0077 W1-f; left: the Huygens site, W2-a)" # 0077 W1-f
    note:
      source: "Cassini ISS's 938 nm global map (NASA/JPL-Caltech/Univ. Arizona, PIA22770); Cassini RADAR's SAR and HiSAR mosaic through T104 (USGS Astrogeology), which gives the radar face and the seas' outlines; the detached haze layer's height from Porco et al. 2005 and West et al. 2011; clouds after Webb and Keck (NASA, 2023)." # 0077 W1-f
      dates: "Cassini 2004-2017, released 2018; the radar mosaic of January 2015; the detached layer as seen 2005-2007; the cloud reference of 2023." # 0077 W1-f
      drawn: "Measured: the surface map through the haze, at half its contrast; the radar face (its grey ours), only where a swath looked; the seas' outlines. Modelled: the haze shell and the detached layer at its 2005-2007 height. Illustrative and labelled: the methane clouds, and the glint's size and brightness." # 0077 W1-f
      rights: "NASA public domain."
    records:
      - {domain: worlds, ids: [titan]}
      - {domain: weather, where: {world: titan}}

  - id: AIRLESS_MOON
    title: The Moon, Phobos and Deimos
    renderer: [site/js/scene/worlds.js, site/js/scene/tiles.js, site/js/scene/moonshape.js]
    honesty: measured
    fallback: The 2k map with earthshine; no LRO tiles, no relief and no earthshine after the latch.
    issue: "#864 (shadows from LOLA at a low Sun, W2-a); internal #379 (Deimos's map)"
    note:
      source: "Solar System Scope's 2k Moon; LRO WAC and LOLA through NASA Solar System Treks close up; Viking Orbiter mosaic for Phobos (USGS, P. Stooke); the shape models of Phobos and Deimos."
      dates: "LRO 2009 onward; Viking 1976-1980."
      drawn: "Measured: the maps, the heights and the shapes. Modelled: shading along the light. Deimos has a shape and no map: drawn grey, said on its card."
      rights: "NASA and USGS public domain; Solar System Scope CC BY 4.0."
    records:
      - {domain: worlds, ids: [moon, phobos, deimos]}
      - {domain: sites, where: {class: feature}}  # 0077 W3-d: the Moon's named places (Copernicus, Tycho, Shackleton, the south pole), on its tiles

  - id: DWARF_PLANET
    title: Dwarf planets
    renderer: [site/js/scene/worlds.js, site/js/scene/glyphs.js, site/js/scene/models.js, site/js/scene/dwarfs.js] # 0077 W1-f
    honesty: measured
    fallback: Pluto and Ceres as mapped spheres; the far dwarfs as glyphs on their orbits, and close up as smooth bodies in their measured colours. # 0077 W1-f
    issue: "#865 (done in 1.3.0, 0077 W1-f; left: spins)" # 0077 W1-f
    note:
      source: "New Horizons' global colour map of Pluto (PIA11707); Dawn's Ceres mosaic (DLR, via USGS); JPL Small-Body Database orbits for the far dwarfs; their sizes and moons from the Wikipedia article each row names."
      dates: "New Horizons 2015; Dawn 2015-2018; SBDB solutions dated per row (sample.js `solution`)."
      drawn: "Measured: Pluto's and Ceres's maps, every orbit and its phase; the far dwarfs' colours (B-V, V-R), albedos, Haumea's, Makemake's and Quaoar's shapes and Haumea's ring (scene/dwarfs.js names whose). Modelled and labelled: their brightness on a squeezed scale, and the three never measured drawn round; no surface is drawn on any of them." # 0077 W1-f
      rights: "NASA works public domain; SBDB data courtesy NASA/JPL-Caltech; facts from Wikipedia, cited, none of its text reproduced."
    records:
      - {domain: worlds, ids: [pluto]}
      - {domain: small_bodies, where: {array: FAR_BODIES, farKind: dwarf}, honesty: modelled}

  - id: ASTEROID
    title: Asteroids
    renderer: [site/js/scene/models.js, site/js/scene/realmodels.js, site/js/scene/glyphs.js, site/js/propagate/kepler.js, site/js/scene/moonshape.js] # 0077 W3-d
    honesty: modelled
    fallback: A glyph on its orbit; the seeded rock or the real shape only when selected and near.
    issue: "#866 (done in 1.3.0, 0077 W3-d: Ryugu, Itokawa, Didymos and Dimorphos in their shapes, turning about their measured poles; the phase of a turn and Dimorphos's place on its orbit illustrative)" # 0077 W3-d
    note:
      source: "JPL Small-Body Database and CNEOS for orbits and close approaches; real shapes of Bennu, Eros, Vesta and Ceres from the PDS Small Bodies Node and Dawn."
      dates: "Elements at each record's epoch; the sample asteroids at 2026-01-01, at their own perihelion (a placeholder phase, said on the card)."
      drawn: "Measured: orbits, sizes, the real shapes. Modelled: positions propagated from elements. Illustrative: the seeded rock for any asteroid without a shape (labelled generic)."
      rights: "NASA/JPL data and PDS products public domain."
    records:
      - {domain: small_bodies, where: {array: ASTEROIDS}, honesty: illustrative}
      - {domain: small_bodies, where: {array: FAR_BODIES, farKind: "^(?!dwarf).*"}}
      - {domain: model_kinds, ids: [asteroid-generic]}
      - {domain: real_models, where: {class: asteroid}}
      - {domain: layers, ids: [asteroids]}

  - id: COMET
    title: Comets
    renderer: [site/js/scene/models.js, site/js/scene/glyphs.js, site/js/propagate/kepler.js]
    honesty: modelled
    fallback: A glyph on its orbit; the seeded nucleus and its tails only when selected.
    issue: "public #550, #421 (coma; tails that scale with distance from the Sun)"
    note:
      source: "JPL Small-Body Database comet elements (60, read live with a saved copy); JPL Horizons for Halley."
      dates: "Elements at each comet's own epoch."
      drawn: "Measured: the orbits. Modelled: positions from the elements; tails pointed away from the Sun. Illustrative: the nucleus's shape (seeded) and the tails' look."
      rights: "NASA/JPL data courtesy NASA/JPL-Caltech."
    records:
      - {domain: small_bodies, where: {array: NAMED_COMETS}}
      - {domain: model_kinds, ids: [comet-generic]}
      - {domain: layers, ids: [comets]}

  # --- what people built -------------------------------------------------------------------------------
  - id: ARTIFICIAL_SATELLITE
    title: Satellites, stations and debris
    renderer: [site/js/propagate/sgp4.js, site/js/scene/glyphs.js, site/js/scene/realmodels.js, site/js/scene/models.js]
    honesty: measured
    fallback: One instanced glyph per satellite (one draw a layer); models only for the selected or the near, at the plain look after the latch.
    issue: "public #267 (the art pass)"
    note:
      source: "CelesTrak's element sets, propagated with SGP4 in a worker pool; 3D models from NASA 3D Resources, agencies' own pages, or built here from published dimensions (models.yaml `real_models`, each with its pictures)."
      dates: "Element sets read every few hours with saved copies; each model's page read on the day its row says."
      drawn: "Measured: orbits and positions. Models: NASA's own meshes are the craft; built-from-dimensions shapes are simplified and say so; a procedural stand-in says it is the kind of thing, not this one."
