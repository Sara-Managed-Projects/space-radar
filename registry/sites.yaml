# THE TRAVERSES (release 1.2.0 stage W2-a, internal #868): where the rovers drove, as lines traced
# from what the Lunar Reconnaissance Orbiter's cameras see of their tracks. Keyed by the site row
# they belong to. scripts/build_traverses.py fetches each line and writes registry/traverses/<id>.json
# (its provenance, length and points); scripts/gen_sites_js.py writes site/js/data/traverses.js,
# which scene/traverse.js reads only when the camera is close to the Moon. Only documented paths:
# a site with no traced line has none drawn (spec 0076 W2-a; the package's LANDING_SITE guardrail,
# "Do not show exact rover path unless documented"). check_registry.py check_site_traverses()
# holds each to a site row, its file and its source.
#   file      the line, under registry/traverses/
#   source    the service it was read from; finder: the page that says who traced it
#   read      the day
#   traced    who traced it, and from what (the finder page's words)
#   licence   what was found about its use, quoted
#   credit    the Sources panel's line while it is drawn; CREDITS.md carries it word for word
traverses:
  apollo-15:
    file: registry/traverses/apollo-15.json
