    shape: lander
    source: nssdc-lunar
    aliases: ["Moon Sniper"]
    doing: "Japan's first Moon landing, January 2024. It came down about 55 m from its target, then tipped over onto its nose."
  - id: im-1
    display: "Odysseus (IM-1), near Malapert A"
    class: surface
    world: moon
    lat: -80.13
    lon: 1.44
    landed: 2024-02-22
    shape: lander
    source: nssdc-lunar
    aliases: ["Intuitive Machines"]
    doing: "The first private spacecraft to land on the Moon and the first American one since 1972, in February 2024. It tipped over as it landed."
  # 206.0148 E is 153.9852 W: the far side, which tests/test_landing_sites.mjs checks from the
  # geometry rather than trusting this comment.
  - id: change-6
    display: "Chang'e 6, Apollo basin"
    class: surface
    world: moon
    lat: -41.6385
    lon: 206.0148
    landed: 2024-06-01
    shape: lander
    source: nssdc-lunar
    aliases: ["Change 6"]
    doing: "Scooped and drilled 1,935 grams of soil and rock in June 2024: the first samples ever brought back from the far side of the Moon."
  - id: blue-ghost-1
    display: "Blue Ghost 1, Mare Crisium"
    class: surface
    world: moon
    lat: 18.562
    lon: 61.810
    landed: 2025-03-02
    shape: lander
    source: nssdc-lunar
    aliases: ["Firefly"]
    doing: "Firefly's lander, March 2025: the first fully successful commercial Moon landing. It worked for a whole lunar day and into the night."

  # --- On Mars ------------------------------------------------------------------------
  # Uncited: NASA's landing announcement numbers, not matched to a reference in this change.
  - {id: jezero, display: "Perseverance, Jezero crater", class: surface, world: mars, lat: 18.4447, lon: 77.4508, landed: 2021-02-18, shape: rover, source: uncited, aliases: ["Octavia E. Butler Landing"], doing: "A rover the size of a car, collecting rock samples in a crater that was once a river delta."}
