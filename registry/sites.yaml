  # 0077 W3-d: begin
  # --- Named places on the Moon (release 1.3.0 stage W3-d, internal #864) -------------------------------
  # PLACES, NOT MACHINES: `class: feature` is a named place on a world's ground that a visitor can search
  # for and arrive at, with nothing standing on it. No `landed:`, no `shape:`: scene/heroes.js draws no
  # model for one, main.js meets it from where its width fills the screen (a crater's `diameter_m`; the
  # pole, which has none, from 60 km), ui/cards.js says nothing is drawn there but its name, and the
  # ground under it is the map's (scene/tiles.js, with the shadows cast from LOLA's heights at a low Sun).
  # The four the release 1.2.0 package named for the Moon at sunrise: Copernicus, Tycho, Shackleton and
  # the south pole. Coordinates are the IAU gazetteer's centres (`iau-gazetteer-moon`); the pole is the pole.
