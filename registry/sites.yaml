  - {id: dss-14, display: "Goldstone DSS-14", class: dish, world: earth, lat: 35.4259, lon: -116.8895, alt_m: 1001, diameter_m: 70, source: dsn-810-005-301, doing: "The 70-metre dish at Goldstone, California."}
  - {id: dss-25, display: "Goldstone DSS-25", class: dish, world: earth, lat: 35.3376, lon: -116.8754, alt_m: 960, diameter_m: 34, source: dsn-810-005-301, doing: "A 34-metre dish at Goldstone."}
  - {id: dss-43, display: "Canberra DSS-43", class: dish, world: earth, lat: -35.4024, lon: 148.9813, alt_m: 689, diameter_m: 70, source: dsn-810-005-301, aliases: ["Tidbinbilla"], doing: "The only dish that can still send commands to Voyager 2."}
  - {id: dss-63, display: "Madrid DSS-63", class: dish, world: earth, lat: 40.4312, lon: -4.2480, alt_m: 865, diameter_m: 70, source: dsn-810-005-301, doing: "The 70-metre dish outside Madrid."}

  # --- Two pads, and the vehicles that left from them (public #427, 2026-10-08) ------------------
  # `class: pad` is a hand-kept pad: Launch Library's pads are the ones something is about to
  # leave from, and these two rows are here for what left long ago. scene/realmodels.js `bySite`
  # stands NASA's Saturn V and Space Shuttle models on them, and registry/missions.yaml moves the
  # clock to their launch mornings. Coordinates read 2026-10-08 on Wikipedia's articles for the
  # two pads: 28 36 30 N, 80 36 16 W and 28 37 38 N, 80 37 15 W. Only Apollo 10's Saturn V left
  # from 39B (Wikipedia, Saturn V, read the same day), so twelve of the thirteen left from 39A.
  # An agency reading, 2026-11-05 (public #644 and #646): the National Park Service's National Register
  # registration forms "Launch Complex 39: Pad A" (NRIS 99001638, npgallery.nps.gov/GetAsset/ec079e7b-41c4-4f6d-91ea-a1bc2882e7cf)
  # and "Launch Complex 39: Pad B" (NRIS 99001639, npgallery.nps.gov/GetAsset/704579a4-68fe-4401-8e66-8eef29d834a4) give each
  # pad's boundary as ten UTM corners (the perimeter service road plus 100 ft). Pad A: easting 538240 to 539120, northing
  # 3164030 to 3164860; Pad B: easting 536580 to 537500, northing 3166120 to 3166940. The zone is 17, the zone of this
  # longitude (the scan's text does not carry the zone column), and the datum is not stated in either form. Converted, each
  # row's point lies inside its pad's boundary, which is about 900 m across, and about 195 m north of that boundary's
  # centre. That is no disagreement, because a boundary is a fence and not a point, but it is no agreement to 50 m either:
  # the agency pages confirm the ground, and the point's digits stay Wikipedia's. No number was changed. NASA's pages
  # "Launch Complex 39A" and "39B" (nasa.gov/reference/) and its image article on the two pads give no position, and no
  # Space Force page was found that does.
  # `liftoffs:` IS THE GATE (scene/realmodels.js padVehicleShown): the vehicle is drawn from 24 hours
  # before a liftoff given to the minute until the end of that minute, or for the UTC day of one
  # given as a date, and at no other time. tests/test_pad_vehicles.mjs holds the list equal to the
  # mission's events.
  - {id: saturn-v-lc-39a, display: "Saturn V, Launch Complex 39A", class: pad, world: earth, lat: 28.6083, lon: -80.6044, alt_m: 0, source: wikipedia-lc-39a, aliases: ["Saturn 5", "LC-39A", "Apollo launch pad"], liftoffs: ["1968-12-21T12:51:00Z", "1969-07-16T13:32:00Z", "1972-12-07T05:33:00Z"], doing: "The pad twelve Saturn V rockets left from, 1967 to 1973. The rocket is drawn only in the day before each launch listed here: choose one to go there."}
  - {id: shuttle-lc-39b, display: "Space Shuttle, Launch Complex 39B", class: pad, world: earth, lat: 28.6272, lon: -80.6208, alt_m: 0, source: wikipedia-lc-39b, aliases: ["Space Shuttle", "LC-39B", "STS"], liftoffs: ["1988-09-29", "1990-04-24", "2006-12-10"], doing: "A pad 53 Space Shuttle flights left from, the last in 2006. The stack is drawn only on the day of each launch listed here: choose one to go there."}

  # Gagarin's Start (internal #1054, release 1.6.2). A hand-kept pad like the two above, with no `liftoffs:`: nothing is
  # drawn standing on it, the Moment `vostok-1` (site/js/moments/) flies the R-7 from here, and its card offers the replay.
  - {id: baikonur-site-1, display: "Baikonur Site 1, Gagarin's Start", class: pad, world: earth, lat: 45.92028, lon: 63.34222, alt_m: 0, source: wikipedia-vostok-1, aliases: ["Gagarin's Start", "Site 1", "Site 1/5", "Baikonur Site 1", "Vostok 1 pad"], doing: "Gagarin's Start, Site 1 at Baikonur: Sputnik 1 left from here in 1957, Vostok 1 in 1961, Voskhod 2 in 1965 (the first spacewalk)."}

  # --- On the Moon --------------------------------------------------------------------
  - {id: apollo-11, display: "Apollo 11 landing site", class: surface, world: moon, lat: 0.67416, lon: 23.47314, uncertainty_m: 0.3, landed: 1969-07-20, shape: lunar-module, source: lroc-2016, aliases: ["Tranquility Base"], doing: "Where people first stood on another world, in July 1969. The descent stage is still there."}
  # Apollo 14 and 16 are here because registry/oddities.yaml anchors on them BY ID: a surveyed
  # coordinate lives in exactly one place, and an oddity that copied the numbers into its own row
  # would be a second place for them to drift. Both are LROC spacecraft coordinates and both
  # carry a published uncertainty the oddity rows quote -- 0.4 m and 3.0 m.
  - {id: apollo-14, display: "Apollo 14 landing site", class: surface, world: moon, lat: -3.64589, lon: 342.52806, uncertainty_m: 0.4, landed: 1971-02-05, shape: lunar-module, source: lroc-2016, doing: "Fra Mauro, February 1971. Alan Shepard hit two golf balls here and they are still lying where they stopped."}
  - {id: apollo-16, display: "Apollo 16 landing site", class: surface, world: moon, lat: -8.9734, lon: 15.5011, uncertainty_m: 3.0, landed: 1972-04-21, shape: lunar-module, source: lroc-2016, doing: "Descartes, April 1972. Charlie Duke left a photograph of his family face-up in the dust beside the lander."}
  - {id: apollo-17, display: "Apollo 17 landing site", class: surface, world: moon, lat: 20.1911, lon: 30.7723, uncertainty_m: 3.5, landed: 1972-12-11, shape: lunar-module, source: lroc-2016, doing: "The last place people have stood on another world, in December 1972."}
  # Uncited: these are the numbers LROC announced in February 2019. NSSDCA's table now gives
  # 45.4561 S, 177.5885 E, about 0.4 km away; which is the later measurement is unchecked.
  - {id: change-4, display: "Chang'e 4", class: surface, world: moon, lat: -45.4561, lon: 177.5885, landed: 2019-01-03, shape: lander, source: nssdc-lunar, aliases: ["Change 4", "Yutu-2"], doing: "The first landing on the far side of the Moon, in 2019."}
  # The crash smudge, not the lander and not the library inside it: LROC published the darkest
  # pixel with a 20 m by 8 m 95% confidence interval, and registry/oddities.yaml anchors the
  # lunar library on it BY ID, so the coordinate lives in exactly one place. This row is the
  # coordinate and NOT a record (`record: false`): nothing lies here to draw a shape of, and a
  # lander standing upright at a crash site would be a stand-in that says something false.
  - {id: beresheet, display: "Beresheet impact site", class: surface, world: moon, lat: 32.5956, lon: 19.3496, landed: 2019-04-11, record: false, source: nssdc-lunar, doing: "Where an Israeli lander hit Mare Serenitatis in April 2019, carrying a stack of nickel discs."}
  # Three more places a machine hit the Moon (2026-11-04; public #778, #780, #782), the same kind
  # of row as Beresheet: a coordinate and not a record. Position and UTC date are NSSDCA's table
  # (`nssdc-lunar`, which says all its dates are UTC); no uncertainty is given because the table
  # gives none. The sentences are from pages read the same day: LROC's "Impact Site of the
  # HAKUTO-R Mission 1 Lunar Lander" (lroc.im-ldi.com/images/1302), NASA's "NASA's LRO Observes
  # Crater Likely from Luna 25 Impact" (31 August 2023, nasa.gov) and LROC's "HAKUTO-R Venture
