version: 1
# THE FIRST LOAD, MEASURED, AND WHAT THE OTHERS PUBLISH OR WERE SEEN TO DO (forge #170). docs/FIRST_LOAD.md is the
# method in words; tests/test_first_load.mjs holds this file to registry/budgets.yaml and to that page.
#
# measurements   one row per boot: what was booted, how, and the numbers scripts/first-load.mjs printed.
#   bytes        every request's bytes as they crossed the wire, before the app's end-of-first-visit mark
#   ours         the bytes from the page's own host (the rest are NOAA's, GDACS's and the other live feeds the boot reads)
#   requests     how many requests
#   first_frame_ms   navigation start to the scene's first drawn frame (tests/probes/first-load.js)
#   compressed   whether the server compressed (the live site does; tools/serve.py does not)
#
# others         what the competitor review of 2026-11-07 (spec 0081, in the private repository, and forge #170's body) found. Only
#                what it states is here, in its words; nothing was measured again by us, and a figure that is not like
#                ours (one file, not a first load) says so in `comparable`. Bytes are written as the review wrote them,
#                in MB, and as bytes (10^6) for the test.
