    why: "The nearest known black hole, found in 2022 by the wobble of the Sun-like star that orbits it. It is quiet: nothing falls in."
    source: "https://en.wikipedia.org/wiki/Gaia_BH1 (infobox, read 2026-09-08)"

  - id: gaia-bh3
