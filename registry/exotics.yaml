# Black holes and other extremes (spec 0028 step 7). A hand-kept list: every row is a FACT SHEET
# with the page it was read from, and scripts/check_registry.py refuses a row without a source, a
# distance, a kind it knows, or a position on the sky. scripts/gen_exotics_js.py mirrors this file
# into site/js/data/exotics.js; CI refuses drift.
#
# kind        blackhole | pulsar | magnetar | star
# ra / dec    J2000, as the source prints them (h m s / deg arcmin arcsec); the mirror converts to degrees.
# dist_ly     light-years. A range is [low, high]. For TON 618 the LIGHT-TRAVEL distance is used and
#             the row says so: at redshift 2.2 "distance" needs a word beside it.
# mass_msun   solar masses, where the object has one worth saying. period_s for a pulsar.
# why         one sentence a visitor reads first. What is remarkable, in plain words.
# source      where every number above was read, and when.
version: 1

exotics:
  - id: sgr-a-star
    name: Sagittarius A*
    kind: blackhole
    ra: 17h 45m 40.0409s
    dec: -29° 00′ 28.118″
    dist_ly: 26996
    mass_msun: 4297000
    why: "The black hole at the centre of our galaxy, four million Suns in one point. Every star on this map goes round it."
    aliases: [Sgr A*, galactic centre black hole]
    source: "https://en.wikipedia.org/wiki/Sagittarius_A* (infobox, read 2026-09-08)"

  - id: m87-star
    name: M87*
    kind: blackhole
    ra: 12h 30m 49.42338s
    dec: +12° 23′ 28.0439″
    dist_ly: 53500000
    mass_msun: 6500000000
    why: "The first black hole anyone photographed: the orange ring of 2019. Six and a half billion Suns, at the heart of the galaxy M87."
    aliases: [Powehi, Virgo A black hole]
    source: "https://en.wikipedia.org/wiki/Messier_87 (infobox and the M87* section; EHT 2019 mass, read 2026-09-08)"

  - id: cygnus-x-1
