version: 1
# The Lab's simulators by age and by curriculum (forge #159, 2026-11-07): one row per site/lab/<slug>/,
# so a teacher can ask for "ages 11-14, gravity" or "GCSE 4.8.1.3" on /lab/ and on /teachers/.
#
# WHY A REGISTRY ROW AND NOT A <meta> IN EACH SIMULATOR. A contributor adds a simulator as one file and
# is not asked to know four curricula (docs/ADD_A_SIMULATOR.md). The tags are a teacher's reading of the
# page, reviewed in one place, and a simulator without a row is still listed: it is simply not in a
# filtered view until somebody tags it. tests/test_lab_levels.py refuses a row for a folder that does
# not exist, a code that is not in the lists below, and an `app` link that names nothing on the map;
# scripts/gen_lab_index.py writes the tags into /lab/'s cards and each simulator's "See it in the 3D map"
# link from here.
#
# THESE ARE MAPPINGS, NOT CLAIMS OF COVERAGE. A tag says the simulator shows an idea a statement asks
# for, not that it teaches the whole statement or meets an assessment. Read on 2026-11-07:
#   band  the ages it is pitched at (a row may have several): 7-11 (US grades 2-5, England KS2),
#         11-14 (grades 6-8, KS3, Years 7-9), 14-16 (grades 9-10, KS4/GCSE, Years 10-11),
#         16-18 (grades 11-12, A level, IB Diploma), 18+ (university).
#   ngss  NGSS Lead States (2013), Next Generation Science Standards, performance expectations by code:
#         https://www.nextgenscience.org/search-standards
#   ks3   England's national curriculum, Science programmes of study: key stage 3 (DfE, DFE-00185-2013),
#         "Physics" and "Chemistry: Earth and atmosphere". The document has no codes, so the ids below
#         are ours and each names the statement it stands for:
#         https://www.gov.uk/government/publications/national-curriculum-in-england-science-programmes-of-study
#   gcse  KS4: the DfE's GCSE physics subject content (DFE-00194-2015), as numbered in the most taken
#         specification, AQA GCSE Physics 8463 (version 1.1); "4.8" is the physics-only Space physics:
#         https://www.gov.uk/government/publications/gcse-single-science
#         https://www.aqa.org.uk/subjects/physics/gcse/physics-8463/specification
#   ib    IB Diploma Programme Physics guide, first assessment 2025, by topic (A.1 ... E.5):
#         https://www.ibo.org/programmes/diploma-programme/curriculum/sciences/physics/
#   app   where the idea is visible in the 3D map, as a link the app's own reader knows
#         (site/js/ui/urlstate.js KEYS: `at`, `trip`, `stage`).
codes:
  ks3:
    space-gravity: "gravity force, weight = mass x gravitational field strength (g); g differs on other planets and stars; gravity between Earth and Moon, and Earth and Sun"
    space-stars: "our Sun as a star, other stars in our galaxy, other galaxies"
    space-seasons: "the seasons and the Earth's tilt, day length at different times of year, in different hemispheres"
    space-light-year: "the light year as a unit of astronomical distance"
    light-waves: "light waves travelling through a vacuum; the speed of light; light transferring energy from source to absorber"
    sound-waves: "frequencies of sound waves, measured in hertz; waves on water as undulations which travel through water"
    motion-speed: "speed and the quantitative relationship between average speed, distance and time"
    forces-balance: "forces as pushes or pulls; forces being needed to cause objects to stop or start moving, or to change their speed or direction"
    energy-changes: "energy changes on deformation; changes in systems; comparing energy values"
    earth-atmosphere: "the composition of the atmosphere; the production of carbon dioxide by human activity and the impact on climate"
  gcse:
    "4.1.1": "Energy changes in a system, and the ways energy is stored (kinetic energy = 0.5 m v^2)"
    "4.5.1.3": "Mass and weight (W = m g)"
    "4.5.6": "Forces and motion (speed, velocity, circular motion, Newton's laws)"
    "4.5.7": "Momentum (HT)"
    "4.6.1.2": "Properties of waves (wave speed = frequency x wavelength)"
    "4.6.2": "Electromagnetic waves"
    "4.6.3": "Black body radiation (physics only)"
    "4.8.1.1": "Our solar system"
    "4.8.1.2": "The life cycle of a star"
    "4.8.1.3": "Orbital motion, natural and artificial satellites"
    "4.8.2": "Red-shift"
  ib: {A.1: Kinematics, A.2: Forces and momentum, A.3: "Work, energy and power", A.5: Galilean and special relativity, B.1: Thermal energy transfers, B.2: Greenhouse effect, C.2: Wave model, C.3: Wave phenomena, C.5: Doppler effect, D.1: Gravitational fields, E.5: Fusion and stars}
  ngss:
    1-ESS1-1: "Use observations of the sun, moon, and stars to describe patterns that can be predicted"
    5-PS2-1: "The gravitational force exerted by Earth on objects is directed down"
    5-ESS1-1: "The apparent brightness of the sun compared to other stars is due to their relative distances from Earth"
    5-ESS1-2: "Patterns of daily changes in length and direction of shadows, day and night, and the seasonal appearance of some stars"
    MS-PS2-2: "The change in an object's motion depends on the sum of the forces on it and its mass"
    MS-PS2-4: "Gravitational interactions are attractive and depend on the masses of interacting objects"
    MS-PS3-1: "Relationships of kinetic energy to the mass of an object and to its speed"
    MS-PS4-1: "A simple model for waves that includes how the amplitude of a wave is related to its energy"
    MS-ESS1-1: "An Earth-sun-moon model of the cyclic patterns of lunar phases, eclipses of the sun and moon, and seasons"
    MS-ESS1-2: "The role of gravity in the motions within galaxies and the solar system"
    MS-ESS1-3: "Scale properties of objects in the solar system"
    HS-PS2-1: "Newton's second law: the mathematical relationship among force, mass and acceleration"
    HS-PS2-4: "Newton's Law of Gravitation to describe and predict the gravitational forces between objects"
    HS-PS3-1: "Calculate the change in the energy of one component in a system"
    HS-PS4-1: "Mathematical relationships among the frequency, wavelength, and speed of waves"
    HS-ESS1-1: "The life span of the sun and the role of nuclear fusion in its core"
    HS-ESS1-2: "The Big Bang theory, from light spectra, the motion of distant galaxies and the composition of matter"
    HS-ESS1-3: "The way stars, over their life cycle, produce elements"
    HS-ESS1-4: "Mathematical or computational representations to predict the motion of orbiting objects in the solar system"
    HS-ESS2-4: "Variations in the flow of energy into and out of Earth's systems result in changes in climate"
