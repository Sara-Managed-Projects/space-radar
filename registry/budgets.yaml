  - {id: deployed_boot_js_bytes, value: 2010000, unit: bytes, since: 2026-11-24, reason: "2026-11-24, the platform bridge (the platform contract: ui/platform-bridge.js, the srq queue and the host check; ui/favs.js, the heart on the trip cards, which ui/explore.js draws at boot). Measured with scripts/minify_site.py and scripts/check_built_tree.mjs on main 5cf60c8 plus this branch: 2 007 723 B in 126 modules, against 2 002 532 B in 124 for the sidebar fix just before it, +5 191 B: two new modules, ui/platform-bridge.js 1 643 B and ui/favs.js 2 544 B (minified), and about 1 000 B in modules already at boot (main.js loads the platform where allowed, rail.js the empty account slot, explore.js the heart beside each trip card, copy/en.js the heart's words). What tells the platform about the page (ui/platformtrack.js) is fetched only on spaceradar.ai, outside this graph. Raised to 2 008 300 (577 B above that measure). Before: 2 003 000, the sidebar fix: 2026-11-24, the sidebar fix (platform plan 1d: a visitor could not find the way back to the search once an object was clicked, and the hide arrow read as Back). Measured with scripts/minify_site.py and scripts/check_built_tree.mjs on the same machine: main fd5f85b 1 997 546 B in 124 modules, the branch 2 002 532 B in 124 modules, +4 986 B, all in modules that were already at boot: ui/shell.js +3 171 B (the pinned head box, the breadcrumb and its words, the open card's row, the hidden panel's strip, the [ key and the swipe back), ui/explore.js +1 523 B (the hide control, the strip's search and tabs, where a card was opened from), copy/en.js +155 B, the rest under 110 B each. The icons the strip draws come with ui/icons.js by import() on a desktop only, outside this graph. Raised to 2 003 000 (468 B above that measure). Before: 2 000 324 since 2026-11-16, the fix-forward after #1418 and #1433 (that row's reason is in git history).; then the research train (forge #547, Gaia DR4 in Coming up) adds 1 658 B measured on its branch