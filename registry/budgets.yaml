  # uploads in Playwright's Chromium (screens.yml), reads every long task from the start of the page and
  # sums the blocking time. It REPORTS by default; `--gate` holds these two rows. MEASURED once, on a Mac
  # with an integrated GPU and a real one-minute-old cache of nothing: no task over 50 ms at all in the
  # boot (tests/probes/bulk3-c.js, 2026-10-10; first paint 960 ms, layers ready at 3.2 s). A CI runner is
  # software-rendered and slower, so the rows are set far above any number seen and are to be LOWERED
  # when the first CI runs have shown theirs (a row may be lowered freely).
