  - {id: first_visit_bytes, value: 2855000, unit: bytes, since: 2026-10-09, reason: "2 719 025 B + 5 %, measured 2026-10-09 by CI on public #559 (screens.yml: a phone at 390x844, CelesTrak and Launch Library blocked, uncompressed, on the tree a deploy uploads: comments stripped and the ES modules through esbuild); 3 052 513 B before the minifier"}
  # THE JAVASCRIPT A DEPLOY SERVES FOR THE BOOT (internal #515, 2026-10-09). Not a browser's number: the
