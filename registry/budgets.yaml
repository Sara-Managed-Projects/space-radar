  - {id: deployed_boot_js_bytes, value: 1868000, unit: bytes, since: 2026-10-09, reason: "internal #515: the static graph from js/main.js in the minified tree, 1 778 733 B in 115 modules measured 2026-10-09 by scripts/check_built_tree.mjs (2 175 514 B after the comment stripper alone), plus 5 %"}
