# Spec 0044: every gate CI reads is a row here, so "cheap" is a number and not a hope.
#
# A row may be LOWERED freely. A row RAISED needs a newer `since` and a `reason` that says what was
# measured: scripts/check_registry.py check_budgets() compares each value with the copy the change
# is based on (`git show $BUDGETS_BASE:registry/budgets.yaml`, HEAD by default; ci.yml sets HEAD^1,
# the base of the pull request) and refuses a silent raise.
#
#   value    the gate
#   unit     what the value counts
#   since    the day the value was set, YYYY-MM-DD
#   reason   what was measured, or which spec set it
#   pending  only while nothing reads the row yet: the spec task that will. check_budgets() refuses
#            a row that no test, script or module names, unless it says `pending`, and refuses a
#            `pending` row that something does read, so the word cannot outlive its reason.
#
# The browser reads the same numbers from site/js/data/budgets.js (scripts/gen_budgets_js.py).
budgets:
  # The CI number, not the live one: the static server in screens.yml sends bodies uncompressed and
  # has no /data/v1 saved copy. On 2026-09-28, at 390x844 as a phone with CelesTrak blocked: 5 858 529 B
  # from a local server as CI runs it, and 3 068 642 B from the live site (compressed, with the saved
  # copy's 651 kB). The design's 2.5 MB was the live number of 2026-09-21 and the live site is over it
  # now; the gate is the number CI sees, with the 6 % margin the design asked for.
  # WHICH TREE, SINCE 2026-10-06 (internal #405): the one a deploy uploads. scripts/deploy.sh sends js/
  # and css/ without their comments (scripts/minify_site.py), screens.yml builds and serves that tree,
  # and this row is its number. site/ as written is booted beside it for information
  # (first-visit-source.json: 4 809 696 B that day) and is not held to this row: a comment is free.
  # THE SECOND DIET (2026-10-07, internal #415): 3 861 587 B on main that morning (seven feature pull
  # requests after the first diet, each a few kB of boot code, against 4 008 000). Two requests were
  # a seventh of it: vendor/astronomy.js shipped with its documentation (412 025 -> 177 403 B now
  # that a deploy strips vendor/ like js/, licence headers kept), and the cloud mask at WebP quality
  # 90 (575 032 -> 282 674 B at quality 50, same pixels). The number no longer depends on the
  # runner's clock either: what starts after the app's own end-of-first-visit mark is not counted.
  - {id: first_visit_bytes, value: 3517000, unit: bytes, since: 2026-10-07, reason: "3 349 349 B + 5 %: 3 339 538 B measured on #489's main, plus the 9 811 B of boot JavaScript and CSS that #491 to #493 added since (summed over the stripped boot graph, not booted again), by CI's method (a phone at 390x844, CelesTrak and Launch Library blocked, uncompressed) on the tree a deploy uploads. It was 4 008 000 (3 817 516 B measured on 2026-10-06, 3 861 587 B the morning of 2026-10-07) and 5 773 324 B before the first diet. The second diet (internal #415): vendor/ stripped at deploy (astronomy.js -234 622 B) and the cloud mask re-encoded (-292 358 B)"}
