and 1 857 735 B for at=25544 (70), measured 2026-10-09 by CI on public #559 with the ES modules minified, plus 5 %; 2 149 573 B and 2 045 065 B before (internal #429) 2026-11-14 internal batch C3, the cards' and Tonight's words: the star class in words, Place and Picture, Earth years and the new copy groups (ui/cardfacts.js, ui/cards.js, copy/en.js, en.later.js, en.facts.js, css/ui.css) are fetched by the embed too; measured in CI on the pull request, at=moon 2 088 589 B in 81 requests against the 2 088 000 B cap, so the cap is 2 090 000 B. Merge train 1 adds fix-f1a-links-search-cards (review of 16 Nov 2026), whose own caps rose by 300 B for its minified boot code: see that branch's rows. Merge train 1 also adds site-arrival-from-afar (internal #340), whose own caps rose by 200 B: see that branch's rows. Merge train 1 also carries fix-m1-model-titles-routes, whose own row moved by +1750 B: see that branch. Merge train 1 also carries fix-m2-model-attitude, whose own row moved by +1074 B: see that branch."}
