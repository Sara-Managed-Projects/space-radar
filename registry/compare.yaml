# What the Compare view and the comparison lab say about a world (internal i#885 and i#909, release 1.3.0).
#
# One row per body, read from NASA's Planetary Fact Sheets (NSSDCA, Dr David R. Williams), the page of the
# body itself and, for the Moon's mean temperature, the sheet that lists them all. Every number below is
# on one of those pages; nothing is worked out here but the units. The browser's copy is
# site/js/data/compare.js, generated by scripts/gen_compare_js.py (`--check` fails CI on drift).
#
# `world`      the id in registry/worlds.yaml; its radius_km must equal `radius_km` here (tests/test_compare.mjs).
# `radius_km`  volumetric mean radius, the same figure the map draws the world with.
# `mass_e`     mass in Earths (mass / 5.9722e24 kg), the sheet's own ratio column to its digits.
# `gravity`    m/s2: the mean at the surface; for a giant, at the 1 bar level (it has no surface).
# `temp_c`     one number, a mean in Celsius, or [low, high] where the sheet gives a range.
# `temp_at`    what the temperature is OF: surface | bar1 (the 1 bar level of a giant) | effective (the Sun's
#              photosphere as a black body). The card says it under the number.
# `spin_h`     sidereal rotation period, hours; `retro: true` where it turns the other way round.
# `year_d`     sidereal orbit period round the Sun, days; null where the body does not orbit the Sun itself.
# `sun_mkm`    distance from the Sun, 10^6 km, the semi-major axis; the Moon shares the Earth's.
# `air`        [[gas, share in per cent by volume]], the sheet's major constituents; [] where it has none.
# `air_bar`    surface pressure in bar; null for a body with no surface; `exosphere: true` where the sheet calls
#              the air an exosphere (Mercury, the Moon).
# `moons`, `rings`  counts and yes/no as the sheet gives them on `read`; they change as moons are confirmed.
# `ring_bands` [[inner km, outer km, weight]] from the planet's Rings Fact Sheet, from the centre of the
#              planet; weight 1 a thick bright ring, 0.4 a thin one, 0.1 a faint one (the picture's, not a
#              measurement: the sheets give optical depths over a wide range). A single-radius ring is [r, r, w].
#              Only rings of an optical depth of about 1e-4 or more are drawn, and the comments say which are not.
