  - {id: hubble, file: site/models/hubble.glb, kb: 408, budget_tris: 45000, flagship: true, look: pbr, class: telescope, kind: built-from-dimensions, origin: built, used_for: "NORAD 20580 (HST), by id. Rebuilt in release 1.3.0 (stage W3-a) to the model quality bar and for the physically based look; it was NASA's (A) file, kept in this row's history", source: "built by this project in code (release 1.3.0 stage W3-a's part library, lib.py, and one script a craft, kept with the stage's notes); no image-to-3D model was used, and no published mesh: NASA's 3D Resources (1 583 paths) and NASA Science's 3D models have none of this craft (read 2026-10-20)", licence: "The shape is this project's, under this repository's licence, built from published numbers (facts). Every photograph it was compared with is NASA's (public domain); NASA 3D Resources' Hubble Space Telescope (A) (public domain) was used for proportions only and none of its triangles is in the file.", credit: "3D model: built by Space Radar from NASA's and ESA's published dimensions; compared with NASA's Servicing Mission 4 photographs (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with: the telescope released after SM4, door and arrays", title: "HST-SM4", url: "https://commons.wikimedia.org/wiki/File:HST-SM4.jpeg", licence: "Public domain (NASA; Commons LicenseShortName, read 2026-10-20)", credit: "NASA (crew of STS-125)", read: 2026-10-20}, {use: "compared with: the side view, the step to the aft section, the masts", title: "View of Hubble after Being Released from the Shuttle Atlantis (28136528922)", url: "https://commons.wikimedia.org/wiki/File:View_of_Hubble_after_Being_Released_from_the_Shuttle_Atlantis_(28136528922).jpg", licence: "Public domain (NASA; Commons LicenseShortName, read 2026-10-20)", credit: "NASA", read: 2026-10-20}, {use: "compared with: the aft end and the soft-capture mechanism", title: "Hubble Released 2009", url: "https://commons.wikimedia.org/wiki/File:Hubble_Released_2009.jpg", licence: "Public domain (NASA; Commons LicenseShortName, read 2026-10-20)", credit: "NASA (STS-125)", read: 2026-10-20}, {use: "compared with: the -V3 side, the arrays' backs", title: "S125E011586, STS-125, view of HST during its release", url: "https://commons.wikimedia.org/wiki/File:S125E011586_-_STS-125_-_View_of_HST_during_its_release_from_the_Shuttle_Atlantis_-_DPLA_-_a064815976c605ee2a3e8a11ad1c7cf4.jpg", licence: "Public domain (NASA; Commons LicenseShortName, read 2026-10-20)", credit: "NASA JSC", read: 2026-10-20}, {use: "for proportions only: NASA's own low-detail model", title: "NASA 3D Resources, Hubble Space Telescope (A)", url: "https://github.com/nasa/NASA-3D-Resources", licence: "Public domain (NASA media usage guidelines)", credit: "NASA", read: 2026-10-20}], dimensions: {length_m: 13.2, diameter_m: 4.2, array_length_m: 7.56, array_width_m: 2.45, door_m: 3.0, source: "ESA/Hubble fact sheet (https://esahubble.org/about/general/fact_sheet/), OPENED 2026-10-20: 'Length: 13.2 m, diameter: 4.2 m', solar arrays 2.45 x 7.56 m (built; NASA gives 7.1 x 2.6 m). NASA HST Media Reference Guide, section 5 (https://lhea.gsfc.nasa.gov/archive/sm3b/art/pdf/media-guide/sec5.pdf): the aperture door 'approximately 10 feet (3 m) in diameter', 'opens a maximum of 105 degrees' (built open 105 degrees); the light shield and the forward shell each about 4 m long and 3 m across; the aft shroud '11.5 feet (3.5 m) long and 14 feet (4.3 m) in diameter'; the equipment section's '10 bays for equipment and two bays to support aft trunnion pins and scuff plates'; low-gain antennas 180 degrees apart. OURS: the masts, the 1.3 m high-gain dishes, the boxes, the handrails, the blankets' panel and fold pattern", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. Kept in NASA (A)'s frame (the long axis on +Y with the door at +Y, the array masts on X, the high-gain masts on Z, metres). T