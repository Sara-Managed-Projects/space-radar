, antenna_panels: 7, source: "eoPortal, https://www.eoportal.org/satellite-missions/strix, OPENED 2026-10-13, 'Table 1: StriX Spacecraft Specifications': 'Spacecraft class ~100 kg class'; 'Launch configuration dimensions 80 × 100 × 80 cm'; 'Deployed dimensions 500 × 100 × 80 cm'; 'Antenna type Deployable parallel-plate slot array antenna'; 'Antenna dimensions 500 × 80 cm'; 'Number of antenna panels 7 deployable panel'; its text: 'The satellite will deploy its five-meter-long antenna once in orbit, which contains solar panels on the two “wings” of the antenna.' DERIVED: seven panels of 0.714 x 0.8 m; the bus 0.72 x 0.8 m behind the middle one and 0.96 m deep. READ OFF THE CC0 PHOTOGRAPH of the maker's 1/6 model: three panels a side of the bus; four cells in orange frames on the space side of each; the bus's yellow-green foil; hinges at the joints. OURS: the Earth side of the antenna as a pale plate with two slot lines a panel (no free picture shows that side); the small boxes on the bus.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE ANTENNA: 5.0 m by 0.8 m (cited) of seven panels (cited) 0.71 m long: the middle one under the bus, three a side. Each side panel is 4 cm thick, pale on its Earth side with two thin slot lines, and on its space side carries four solar cells in orange frames ('solar panels on the two wings of the antenna', cited; the frames read off the photograph). Hinge bosses at the joints. THE BUS: 0.72 m by 0.8 m and 0.96 m deep in yellow-green foil behind the middle panel, so the craft is 1.0 m deep (cited), with two cells on its space face, two silver boxes and a small cone antenna. No mirror pass: the two sides are one definition written twice with the sign of x changed, so each side IS A MIRROR IMAGE of the other. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the antenna's radiating face to +Z (the Earth), its 5 m along X, the cells to -Z, the sky. NOT AS IT FLIES: the real c