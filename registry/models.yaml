he LARES Mission Support Request form, https://ilrs.gsfc.nasa.gov/docs/LARES_MSR_final_version_revCP.pdf, opened 2026-10-13, table 'CCRs rows position' (row, cubes, latitude, step in longitude, first cavity): 'I 1 90.00', 'II 5 70.00 72.00 0', 'III 10 50.00 36.00 23', 'IV 14 30.00 25.714 0', 'V 16 10.00 22.50 11.25', and the same five rows south: 2 x (1 + 5 + 10 + 14 + 16) = 92; 'Recess of the front faces from the spherical surface is 2.6 +0.1/-0.2 mm'. NOT CITED: the first cavity of each SOUTHERN row (drawn as the northern)", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. A ball of 796 even triangles 364 mm across and 92 flat discs 38.1 mm across, each row at its published latitude with its published count and first longitude: 1 at each pole, 5 at 70 degrees, 10 at 50, 14 at 30, 16 at 10, north and south. DRAWN DIFFERENTLY FROM THE CRAFT: each face stands 1.5 mm PROUD of the ball, where the real ones are recessed 2.6 mm; the first longitude of each southern row is drawn as its northern twin's, which the table read does not say; the mounting tabs and screws are not drawn. The poles are on the file's Y axis. No mirror pass. Colours are this project's own flat ones, illustrative. The grey #8B929E stands for the tungsten alloy. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 5 948 triangles, 2 colours"}
