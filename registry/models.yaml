t), PIA26613", url: "https://commons.wikimedia.org/wiki/File:NISAR_in_Orbit_(Artist%E2%80%99s_Concept)_(PIA26613).jpg", licence: "Public domain (NASA/JPL-Caltech, Photojournal PIA26613)", credit: "NASA/JPL-Caltech", read: 2026-10-13}], dimensions: {body_length_m: 5.5, array_length_m: 5.5, array_panel_m: [1.8, 2.2], reflector_diameter_m: 12.0, boom_length_m: 9.0, source: "JPL press kit, quick facts, https://www.jpl.nasa.gov/press-kits/nisar/quick-facts/, opened 2026-10-13: 'Length of spacecraft bus and radar instrument payload: about 18 feet (5.5 meters)'; 'Length of solar panels: two deployable arrays, each just over 18 feet (5.5 meters)'; 'Radar antenna reflector diameter: about 39 feet (12 meters)'; 'Boom length for radar antenna reflector: about 30 feet (9 meters)'. JPL press kit, spacecraft, https://www.jpl.nasa.gov/press-kits/nisar/mission-overview/spacecraft/, opened 2026-10-13: 'Nearly 40 feet (12 meters) in diameter and resembling a snare drum, the radar antenna reflector is mounted at the end of a 30-foot-long (9-meter-long) boom'; 'Measuring 6 feet (1.8 meters) wide and 7 feet (2.2 meters) long, each array consists of three panels' (three panels of 1.8 m are the 5.5 m of the quick facts; built so). eoPortal, https://www.eoportal.org/satellite-missions/nisar, opened 2026-10-13: 'the entire octagonal instrument structure'; 'optical prescription (F/D=0.75)', which for 12 m is a focal length of 9 m and a dish 1 m deep; 'a 0.7m HGA (High Gain Antenna)'. NOT CITED, read off JPL's drawing and side render: the bus (1.9 x 2.0 x 2.2 m) and the instrument structure (an octagon 1.3 m across, 3.5 m long) as the two parts of the 5.5 m, the drum's 1.6 m depth and its 24 bays, where the boom stands and its two bends, the feed's 0.9 x 2.6 m", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE REFLECTOR IS NOT A DISC, because the real one is a see-through knitted mesh: it is a rim truss (two hoops 12 m across and 1.6 m apart, a post each of 24 bays, a zigzag of diagonals) and inside it a NET of thin members on a paraboloid 1 m deep (24 ribs, 4 rings, a diagonal a cell), in a pale gold. DRAWN DIFFERENTLY FROM THE CRAFT, on purpose: the truss's members are 12 cm thick and the net's 8 cm where the real tubes are a few centimetres and the mesh is a knit too fine to see, because at the 300 px the app draws a craft the true drum is a haze and this one is a drum; the net stands for the mesh it carries. The boom is three straight stretches (3.1, 3.0 and 2.8 m) with a gold knuckle at each bend. The bus is a foil box and the instrument structure a foil octagon with white radiators, the feed a pale plate on the face under the reflector; the Ka-band dish and one lattice antenna are on the Earth face; harness, thrusters, star trackers and the GPS antenna on the boom's tip are left out. Two wings of three panels of 3 by 4 cells on yokes; THE RIGHT WING IS A MIRROR IMAGE of the left. Axes, so the route says `axes: 'app'`: +Z the Earth face, the bus and instrument structure along Y, the wings along X with their cells to +Y, the boom standing on the far side with the reflector opening back toward the feed. THE REAL CRAFT FLIES ROLLED, so that its beam leaves to one side of the track; the app knows one attitude and the roll is not drawn. Colours are this project's own flat ones (foil #C9A24A and #D4AE55, net #D9B25C, truss #D5DAE2, cells #2B3D6B, boom #8F97A3), illustrative. Then scripts/bake-own-colours.mjs: 10 208 triangles, none removed, 10 colours, normals with a 40 degree crease, meshopt"}
  - {id: ixpe, file: site/models/ixpe.glb, kb: 50, budget_tris: 8000, class: telescope, kind: built-from-dimensions, used_for: "NORAD 49954 (IXPE), in the whole active catalogue: NASA's Imaging X-ray Polarimetry Explorer, three mirror modules four metres from their detectors on a coilable boom. It had no route and was drawn as the generic satellite, a box with a dish; public #965. NuSTAR's mast (row `nustar`) is another telescope and is not worn by it", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the NASA pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources, science.nasa.gov/3d-resources and github.com/nasa/NASA-3D-Resources, searched 2026-10-13, has none of this craft)", licence: "Public domain (the NASA pictures it was drawn from); the shape is this project's, under this repository's licence", credit: "3D model: built by Space Radar from published dimensions and NASA illustrations of IXPE", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A RENDER, not a photograph: the hexagonal bus, the bare lattice boom, the three mirror modules, the array flat beside the boom", title: "IXPE spacecraft model", url: "https://commons.wikimedia.org/wiki/File:IXPE_spacecraft_model.png", origin: "https://science.nasa.gov/toolkits/spacecraft-icons", licence: "Public domain (NASA)", credit: "NASA", read: 2026-10-13}, {use: "drawn from; AN ILLUSTRATION, not a photograph: the array's six strips square on, the bus from below with its adapter ring, the shields round the mirrors", title: "IXPE artist rendition", url: "https://commons.wikimedia.org/wiki/File:IXPE-artist-rendition.jpg", origin: "https://ixpe.msfc.nasa.gov/multimedia/images/", licence: "Public domain (NASA)", credit: "NASA", read: 2026-10-13}], dimensions: {length_m: 5.2, bus_diameter_m: 1.1, array_span_m: 2.7, focal_length_m: 4.0, optics_diameter_m: 0.3, boom_canister_m: 0.3, source: "eoPortal, https://www.eoportal.org/satellite-missions/ixpe, opened 2026-10-13: 'When deployed, IXPE is 5.2 m from the bottom of the spacecraft structure to the top of the payload and is 1.1 m in diameter. The solar panels span 2.7 m when deployed.'; 'The spacecraft hexagonal structure is built up from machined aluminum plates'; 'comprises a 4-m-focal length Mirror Module Assembly'; '24 concentrically nested X-ray-mirror shells in each 300-mm-diameter optics module'; 'The three IXPE MMAs are mounted to a MMSS (Metallic Mirror Module Support Structure) deck'; the deck 'interfaces with the coilable, deployable boom through a TTR (Tip/Tilt/Rotation) mechanism'; the boom stows 'into a 12-inch (0.3-meter) canister'; 'The deployable boom is covered with a thermal sock'; 'The payload uses a deployable X-ray shield to prevent off-axis X-rays from striking the detectors'. NOT CITED, read off NASA's two pictures: the bus's 0.75 m height, the mirror modules' 0.7 m length and where the three stand, the array's 1.5 m height and its six strips, the detector units' size, the shields' 0.5 m, the boom's 0.24 m side and 12 bays", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. Built: a hexagonal bus 1.1 m across with its adapter ring, three detector units on its deck each under its mirror, the boom's canister, the boom as a three-sided lattice, the tip/tilt/rotate mechanism as a short drum under a hexagonal mirror deck, three mirror modules with dark mouths and a dark shield collar each, a star tracker between them, and the fixed array as one flat sheet of six strips of 1 by 4 cells beside the boom; 5.2 m from the ring to the mirrors' mouths, each mirror's middle 4.0 m from its detector. DRAWN DIFFERENTLY FROM THE CRAFT, on purpose and said: THE BOOM IS DRAWN BARE, as NASA's render draws it, where the craft in orbit wears a thermal sock over it (the cited sentence); it has 12 bays and members 28 mm thick where the real ones are a few millimetres, so that it is a lattice at the 300 px the app draws a craft; the three shields are flat collars, not the deployed shield's real outline; the array's strips are all one length where NASA's render shows them stepped. Axes, so the route says `axes: 'app'`: the mirrors at -Z looking away from the Earth, the bus at +Z, the array's cells to +Y. THE REAL CRAFT POINTS ITS MIRRORS AT A TARGET IN THE SKY, which the app does not know. No mirror pass. Colours are this project's own flat ones (bus #B9BFC7, mirror housings #AEB6C2, lattice #D5DAE2, cells #34489A, dark #2B2F38 and #3A3F4A), illustrative. Then scripts/bake-own-colours.mjs: 7 516 triangles, none removed, 10 colours, normals with a 40 degree crease, meshopt"}
  - {id: pace, file: site/models/pace.glb, kb: 42, budget_tris: 7500, class: satellite, kind: built-from-dimensions, used_for: "NORAD 58928 (PACE), in the whole active catalogue: NASA's Plankton, Aerosol, Cloud, ocean Ecosystem observatory. It had no route and was drawn as the generic satellite, a box with a dish; public #954", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the NASA pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources, science.nasa.gov/3d-resources and github.com/nasa/NASA-3D-Resources, searched 2026-10-13, has none of this craft)", licence: "Public domain (the NASA pictures it was drawn from); the shape is this project's, under this repository's licence", credit: "3D model: built by Space Radar from published dimensions and NASA renders and drawings of PACE", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A LABELLED RENDER, not a photograph: the Ocean Color Instrument on the bus, its telescope, its radiators and their Earth shield", title: "Ocean Color Instrument, annotated (December 2018)", url: "https://pace.oceansciences.org/mission.htm", licence: "Public domain (NASA; the PACE project's own site, which credits its pictures to NASA and carries no other credit on this one)", credit: "NASA", read: 2026-10-13}, {use: "drawn from; A RENDER, not a photograph: the tall bus over the Earth, the one wing off its far end, the shield toward the Earth", title: "Beauty Shot of the PACE Spacecraft", url: "https://pace.oceansciences.org/gallery_more.cgi?id=1739", licence: "Public domain (NASA; the page says 'Credit: NASA')", credit: "NASA", read: 2026-10-13}, {use: "compared with: NASA's drawing of the observatory with its wing folded, the page of the cited 1.5 x 1.5 x 3.2 m", title: "PACE Observatory Diagram (Stowed Solar Panel)", url: "https://pace.oceansciences.org/gallery_more.htm?id=1554", licence: "Public domain (NASA; the PACE project's own site)", credit: "NASA", read: 2026-10-13}], dimensions: {length_m: 3.2, width_m: 1.5, observatory_m: [1.5, 1.5, 3.2], array_m: [4.39, 2.54], array_panels: 3, source: "NASA's PACE site, https://pace.oceansciences.org/mission.htm, opened 2026-10-13: 'Dimensions 1.5 m x 1.5 m x 3.2 m (4.9 ft x 4.9 ft x 10.5 ft)'; the stowed drawing's page, https://pace.oceansciences.org/gallery_more.htm?id=1554, opened 2026-10-13: 'In this perspective, the Ka-band antenna, which will transmit science data, is located at top. Just below is the Ocean Color Instrument'; 'Overall observatory dimensions are 1.5 m by 1.5 m by 3.2 m (4.9 x 4.9 x 10.5 ft)'. NASA's PACE blog, https://science.nasa.gov/blogs/pace/2024/02/08/meet-nasas-pace-spacecraft-science-instruments/, opened 2026-10-13: 'The PACE spacecraft stands about 10 feet tall'; 'The spacecraft's solar array is made of three panels. The array measures 100 inches by 173 inches' (2.54 x 4.39 m). THE ISSUE'S eoPortal LINK IS ANOTHER PACE (a 2U CubeSat of 100 x 100 x 243 mm) and gave nothing. NOT CITED, read off NASA's renders: the split of the 3.2 m into a 2.3 m bus and the instrument end, the Ocean Color Instrument's 0.9 x 0.9 x 0.8 m and its place, the Earth shield's 1.4 m, the dish's 0.6 m, both polarimeters' sizes and places, the wing's beam", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. Built: a silver foil box 1.5 x 1.5 x 2.3 m with a white triangular shade on one side face (as NASA's horizon render shows it; its size read off that render) and its gold launch adapter ring on the far end; on the Earth end a deck with the Ka-band dish and two small boxes for the polarimeters HARP2 and SPEXone; on one side there the Ocean Color Instrument as a white housing on a cradle with a gold telescope box, the dark barrel of the rotating telescope, a dark plate where the spectrographs sit, a gold box for the solar calibration assembly and a white radiator; beyond it the Earth shield as a floor and two triangular walls with a dark brace each, a wedge 1.4 m long; one wing of three panels of 3 by 6 cells, 4.39 x 2.54 m, on a beam. WHAT IS APPROXIMATE: everything but the 1.5 x 1.5 x 3.2 m, the wing's size and its three panels; the instrument is a box where the real one is a tilting assembly of spectrographs, the two polarimeters are placed by eye, and the bus's blankets, thrusters, star trackers and sunshades are left out. Axes, so the route says `axes: 'app'`: +Z the Earth face (the dish, the polarimeters, the shield's floor), the 3.2 m along Z, the wing along -X with its cells to +Y; the real wing turns on a drive, so its width stands along Z here where NASA's render shows it lying flat. No mirror pass. Colours are this project's own flat ones (bus #C5CAD2, instrument #E6EAF0, gold #C9A24A and #B5964F, shield #6E7682 and #5E6672, cells #26386B on a grey back #8F97A3), illustrative. Then scripts/bake-own-colours.mjs: 7 116 triangles, none removed, 10 colours, normals with a 40 degree crease, meshopt"}
  # THE FIFTH BATCH (2026-10-13; public #983, #998, #1000): three commercial craft built in code from cited metres, routed by name. A fourth, the Starlink V2 Mini (public #999), was built, looked at in the app and NOT shipped: drawn flat it was a grey plank and no better than the procedural shape.
  - {id: starlink-v1, file: site/models/starlink-v1.glb, kb: 30, budget_tris: 5500, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite whose name has the word STARLINK and whose launch year is 2022 or earlier (2 180 records in the live saved data of 2026-10-12): the first generation, v1.0 and v1.5, the flat bus with ONE solar wing. It was, and while this file is on its way still is, the procedural shape (scene/models.js `starlink-v1`: the wing laid flat, 9 m of this project's own); public #1000", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; its operator is not known to publish one, and a model on a marketplace is somebody else's work)", licence: "CC BY 4.0 (the editor's render it was compared with, credited under `references`); the shape is this project's, under this repository's licence. NO LOGO AND NO LETTERING is on the mesh: the operator's marks are trademarks and are not drawn.", credit: "3D model: built by Space Radar from published dimensions; compared with a render by Wikideas1 (Wikimedia Commons, CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with, NOT traced and NOT generated from: the bus with its wing standing on it; AN EDITOR'S BLENDER RENDER of a Sketchfab model (https://sketchfab.com/3d-models/starlink-spacex-satellite-0a60f6720c5141c9a1c6d71aac108b31, CC BY 4.0), not a photograph and not SpaceX's", title: "Starlink 01", url: "https://commons.wikimedia.org/wiki/File:Starlink_01.webp", licence: "CC BY 4.0", credit: "Wikideas1 (Wikimedia Commons)", read: 2026-10-13}, {use: "read for the layout, NOT reproduced: SpaceX's own drawing of a first-generation satellite in a public filing (the chassis, the antennas on its Earth face, the array standing on its long edge) and its words on the second generation; A DRAWING IN A LETTER TO THE FCC", title: "SpaceX, letter to the FCC of 1 August 2022 with 'Brightness Mitigation Best Practices for Satellite Operators' attached", url: "https://www.planet4589.org/astro/starsim/docs/mitigation/spx2208a.pdf", licence: "a public filing with the FCC, read; the drawings in it are SpaceX's and nothing of them is reproduced", credit: "SpaceX", read: 2026-10-13}], dimensions: {bus_length_m: 2.8, bus_width_m: 1.3, array_width_m: 2.8, array_length_m: 8.1, source: "J. McDowell, https://planet4589.org/astro/starsim/index.html, opened 2026-10-13: 'In Oct 2022 SpaceX released an FCC filing which gave the dimensions of the proposed Generation 2 Starlinks, as well as an intermediate Gen2 to be launched on Falcon 9: Satellite Bus Dimensions (m) Solar array size (m) Mass (kg) V1.5 2.8 x 1.3m 2.8 x 8.1m 303 V2 Mini 4.1 x 2.7m 4.1 x 12.8m 800'. THE FCC FILING ITSELF WAS NOT OPENED (the FCC's server refused this machine); the numbers are McDowell's table of it. A PEER-REVIEWED PAPER AGREES TO THE SQUARE CENTIMETRE: Fankhauser, Tyson and Askari, 'Satellite Optical Brightness', The Astronomical Journal 166:59 (2023), arXiv:2305.11123, opened 2026-10-13, section 6.1: 'The two largest surfaces on Starlink v1.5 are the solar array and the chassis. The solar array has an area of 22.68 m2, and the chassis nadir has an area of 3.64 m2.' (2.8 x 8.1 = 22.68; 2.8 x 1.3 = 3.64); 'In nominal operations, the chassis points directly nadir and the solar array is perpendicular to the chassis and in the direction of the Sun.'; 'These satellites have a reflective sticker on the chassis nadir and dark pigmented backsheet on the solar arrays'. SpaceX's letter (under `references`), opened 2026-10-13: 'this inter-cell backing material was initially white, but it is now pigmented dark red'. Gunter's Space Page, https://space.skyrocket.de/doc_sdat/starlink-v1-0.htm, opened 2026-10-13: 'The Starlink satellites feature a flat panel design with a single solar panel and have a mass of about 260 kg.' NOT CITED: the chassis's thickness (0.2 m), how many panels the wing folds into (12, two cells across), the four antenna tiles and two small dishes on the Earth face (their count and places), the struts", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired (the meshes generated for this craft on 2026-10-12 were a sail and a plank, and are not used). A chassis 2.8 x 1.3 x 0.2 m; on its Earth face four flat antenna tiles and two small gateway dishes; on its far face a thruster's housing and the wing's root. THE ONE WING STANDS ON THE CHASSIS'S LONG EDGE, SQUARE TO IT, away from the Earth: 2.8 m wide and 8.1 m long in twelve folds of two cells, on two struts. That is the open L the paper describes; the procedural shape laid the wing flat. The wing's cells face +Y, where the app lays the Sun; the real wing turns to follow it. The dark red between the cells and the dark back are the later craft's (SpaceX's words); the first ones had white. No mirror pass. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: +Z the Earth face, the wing along -Z, its cells to +Y. Colours are this project's own flat ones (chassis #D5DAE2, antenna tiles #3A4350, cells #22335F, the lines between them #5E2F33, the wing's back #3F444E), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 5 180 triangles, 7 colours"}
  - {id: umbra, file: site/models/umbra.glb, kb: 62, budget_tris: 8500, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite whose name has the word UMBRA (UMBRA-07 to UMBRA-12 in the live saved data of 2026-10-12, five records): Umbra's radar microsatellite, a small flat bus behind a 3.8 m mesh umbrella. It was, and while this file is on its way still is, the shared umbrella (scene/models.js `radar-mesh`: Capella's plan, an offset feed on a boom and one wing); public #983", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; its operator is not known to publish one, and a model on a marketplace is somebody else's work)", licence: "The shape is this project's, under this repository's licence; the layout was read off a drawing in a public filing with the FCC, which is not reproduced. No free picture of the craft exists. NO LOGO AND NO LETTERING is on the mesh: the operator's marks are trademarks and are not drawn.", credit: "3D model: built by Space Radar from the dimensions and the drawing in Umbra's orbital debris report filed with the FCC", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "read for the layout, NOT reproduced: Figure 1, 'UMBRA SAR Space Vehicle External Views', stowed and deployed, from the side and from above: the bus under the dish's middle, the payload's column, a solar array on each side of the bus; A DRAWING IN A PUBLIC FILING", title: "Umbra Lab, Inc., Orbital Debris Assessment Report for Umbra SAR (1604D0048 revision 02)", url: "https://apps.fcc.gov/els/GetAtt.html?id=252268", licence: "a public filing with the FCC's experimental licensing system, read; the drawing is Umbra's and nothing of it is reproduced", credit: "Umbra Lab, Inc.", read: 2026-10-13}], dimensions: {bus_side_m: 0.58, bus_height_m: 0.19, deployed_across_m: 3.8, deployed_height_m: 2.0, source: "Umbra Lab, Inc., 'Orbital Debris Assessment Report for Umbra SAR', document 1604D0048 revision 02 (under `references`), opened 2026-10-13 through a reader (the FCC's server refuses curl), section 2.1: 'The bus structure consists of an aluminum frame with machined aluminum panels and has dimensions of approximately 58 cm x 58 cm x 19 cm, not including the solar arrays which reside in a stowed condition on either side of the bus. The payload is approximately 74 cm x 53 cm diameter in the stowed position. When deployed into the operational configuration, the maximum physical dimensions of the space vehicle are approximately 3.8 m x 3.8 m x 2.0 m.'; section 2.6: 'The nominal attitude mode places the satellite in a “Nadir Pointing” orientation'; section 2.8: 'solar cells mounted on the two (2) deployable solar array wings extending from the bus structure'; its list of parts names a 'Root Rib' and 'Rib Fitting'. eoPortal, https://www.eoportal.org/satellite-missions/umbra-sar, opened 2026-10-13: 'Each Umbra satellite houses a centre-fed parabolic mesh reflector SAR antenna'; 'Deployed antenna size (square metres) 10' (a circle of 10 m2 is 3.57 m across; the filing's 3.8 m is built, over the rib tips). NOT CITED, read off the filing's drawing: the dish's depth (0.67 m), the column's 1.65 m, the solar arrays' 0.9 x 0.31 m and that they lie flat beside the bus. OURS: 24 ribs (the filing names ribs and no count), the net's five rings, which way the dish opens (toward the Earth: 'Nadir Pointing' names no face). THE FILING IS OF THE EARLY CRAFT (about 70 kg); later ones may differ", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE REFLECTOR IS NOT A DISC, because the real one is a see-through mesh: it is 24 pale ribs on a paraboloid 0.67 m deep, one hoop through their tips and five rings of a gold net between them. DRAWN DIFFERENTLY FROM THE CRAFT, on purpose: the ribs are 4 cm thick and the net 2 cm where the real ribs are thin springs and the mesh a knit too fine to see, so that at the size the app draws a craft the umbrella is lines and not a haze. Behind its middle the bus, 58 x 58 x 19 cm, with its launch ring; up its axis the payload's column in foil, 0.4 m across and 1.65 m high, with the feed at its top (a centre-fed dish); a solar array of 0.9 x 0.31 m flat on each side of the bus, cells away from the dish. THE SECOND SOLAR ARRAY IS A MIRROR IMAGE of the first. Axes, so the route says `axes: 'app'`: the dish opens to +Z, the Earth face. THE REAL CRAFT TURNS to look to one side when it images, which the app's one attitude cannot say. Colours are this project's own flat ones (ribs #E6EAF0, net #D9B25C, column #C9A24A, bus #AEB5BF, cells #22335F), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 836 triangles, 8 colours"}
  - {id: iceye, file: site/models/iceye.glb, kb: 30, budget_tris: 6000, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite whose name has the word ICEYE (ICEYE-X2 upward in the live saved data of 2026-10-12, 56 records): ICEYE's radar microsatellite, a 3.2 m antenna with a row of solar panels on its back. It was, and while this file is on its way still is, the shared radar blade (scene/models.js `radar`: Sentinel-1's 12 m antenna on a bus with wings); public #998", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; its operator is not known to publish one, and a model on a marketplace is somebody else's work)", licence: "The shape is this project's, under this repository's licence. The two pictures looked at are CC BY-SA 4.0 and NOTHING OF THEM IS REPRODUCED OR TRACED: they were looked at for where the parts sit, and the sizes are the cited ones. NO LOGO AND NO LETTERING is on the mesh: the operator's marks are trademarks and are not drawn.", credit: "3D model: built by Space Radar from published dimensions of the ICEYE satellites", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT for the layout, NOT reproduced and NOT traced: the solar panels in a row on the antenna's back, the bus behind the middle one, the mast; A RENDER of a craft of 2025", title: "ICEYE SAR satellite Netherlands", url: "https://commons.wikimedia.org/wiki/File:ICEYE_SAR_satellite_Netherlands.png", licence: "CC BY-SA 4.0 (share-alike: looked at only)", credit: "Defensie Nederland, Wikimedia Commons", read: 2026-10-13}, {use: "LOOKED AT, NOT reproduced: the antenna's face from the Earth side; A RENDER", title: "ICEYE SAR satellite Netherlands 2", url: "https://commons.wikimedia.org/wiki/File:ICEYE_SAR_satellite_Netherlands_2.jpg", licence: "CC BY-SA 4.0 (share-alike: looked at only)", credit: "Defensie Nederland, Wikimedia Commons", read: 2026-10-13}], dimensions: {antenna_length_m: 3.2, antenna_width_m: 0.4, stowed_height_m: 0.7, stowed_width_m: 0.6, source: "eoPortal, https://www.eoportal.org/satellite-missions/iceye-constellation, opened 2026-10-13, table 2: 'Antenna size 3.2 m x 0.4 m'; 'Each ICEYE spacecraft has a mass of 85 kg'. eoPortal, https://www.eoportal.org/satellite-missions/iceye-x1, opened 2026-10-13: 'The size of the microsatellite in launch configuration is 70 cm in height and 60 cm in width. The SAR antenna has a length of 3.25 m.'; 'The SAR antenna consists of five elements, the central element being rigidly attached to the satellite body and two elements deploying to either side to create a 3.2 m wide antenna array.'; 'power is provided by 1 fixed solar array and batteries' (of the first craft, 2018). ESA, https://earth.esa.int/eogateway/missions/iceye/description, opened 2026-10-13 through a reader: 'Mass' '85 kg'; 'Dimensions' '70 cm x 60 cm'. NOT CITED, taken from the two renders looked at: five solar panels of about 0.6 x 0.6 m in a row on the antenna's back (built upright; the renders show them leaning), the bus as a box 0.6 x 0.34 x 0.58 m behind the middle one, a 0.7 m mast with a small antenna on the Earth side. THE FLEET IS SEVERAL GENERATIONS; one shape stands for all of them", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE ANTENNA: five elements side by side, 3.2 m by 0.4 m together and 4.5 cm thick, pale, on a spine. On its back, near one long edge, five solar panels of 3 by 2 cells standing square to it, and behind the middle one the bus as a box in gold foil. On the Earth side a thin mast with the downlink antenna at its end. No mirror pass: the antenna's elements and the solar panels are the same part repeated along the craft. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the antenna's face to +Z (the Earth), its length along X, the solar panels' cells to +Y. THE REAL CRAFT ROLLS to look to one side of its track, which the app's one attitude cannot say. Colours are this project's own flat ones (antenna #E3E7ED, foil #C9A24A, cells #1B2233), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 5 642 triangles, 7 colours"}
  - {id: gps-iir, file: site/models/gps-iir.glb, kb: 53, budget_tris: 9500, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite named NAVSTAR and launched 1998 to 2009, and NAVSTAR 43 of 1997 (18 records in the live saved data of 2026-10-12): the GPS Block IIR and IIR-M craft, Lockheed Martin's bus. They had no shape of their own and were, and while this file is on its way still are, the family navigation box (scene/models.js `navigation`, Galileo's proportions); public #985", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms)", licence: "Public domain (the US government picture it was drawn from); the shape is this project's, under this repository's licence. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and a US government painting of a GPS Block IIR satellite", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PAINTING, not a photograph: the cube in orange foil, two panels a wing, the eight fat helices round four slender ones, the two lattice antennas on booms", title: "GPS-IIR", url: "https://commons.wikimedia.org/wiki/File:GPS-IIR.jpg", licence: "Public domain (US Government; US National Executive Committee for Space-Based Positioning, Navigation and Timing, gps.gov)", credit: "US Government (gps.gov)", read: 2026-10-13}], dimensions: {bus_1_m: 2.1, bus_2_m: 2.0, bus_3_m: 2.1, span_m: 11.4, source: "eoPortal, https://www.eoportal.org/satellite-missions/gps, OPENED 2026-10-13, 'Table 1: GPS Block specifications', columns Block IIR and Block IIR-M (the same numbers in both): 'Dimensions (m)' '2.1 x 2.0 x 2.1'; 'Span including solar arrays (m)' '11.4'; 'Primary Contractors' 'Lockheed Martin'; its text: 'they were based on the commercial AS-4000 bus'; 'UHF channel is used for cross-links between spacecraft'. Air & Space Forces Magazine, https://www.airandspaceforces.com/weapons-platforms/gps/, OPENED 2026-10-13: '(IIR/IIR-M) 5 x 6.3 x 6.25 ft, span incl solar panels 38 ft' (38 ft is 11.6 m: the span agrees within 0.2 m; its body is 1.5 x 1.9 x 1.9 m, smaller than eoPortal's, and eoPortal's is built). Lockheed Martin, 'GPS Block IIR and IIR-M Antenna Panel Pattern' (W. Marquis, 2014; published by the US Coast Guard Navigation Center, https://www.navcen.uscg.gov/sites/default/files/pdf/gps/GPS_Block_IIR_IIR_M_Antenna_Panel_Pattern_Marquis_Aug2015_revised.pdf, OPENED 2026-10-13), slide 6, 'GPS Block IIR Legacy Antenna': 'Used on first 8 of 12 IIR SVs'; '8 helix elements in circle with 4 elements in the center'; '12-way power divider and beam forming network'; slide 7, 'GPS Block IIR Improved Antenna': 'Used on final 4 of 12 IIR SVs, and all 8 IIR-M SVs'; 'New element designs and configurations on the panel'. The Navigation Center's page, https://www.navcen.uscg.gov/node/599, OPENED 2026-10-13: 'This is the Earth-facing panel providing the GPS L-band broadcast signal. The improved antenna panel includes redesigned L-band elements mounted on the SV Earth-facing structure in the same manner as the original legacy antenna panel.' THE FILE DRAWS THE LEGACY PANEL (eight round a middle four) for all twenty; the improved panel's own layout is in Lockheed's photograph, which is theirs and was not copied. NOT CITED, read off the government's painting: two panels a wing, the wing's width (1.75 m) and its yoke, the orange foil and the grey radiator windows, that the eight outer helices are fat and the four inner ones slender, the dark horn at the deck's corner, and the two lattice antennas on booms across the wing axis (TAKEN TO BE the UHF crosslink antennas: no page opened names them), whose size is the painting's.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 2.0 x 2.1 x 2.1 m in copper-orange foil with grey radiator windows and an apogee nozzle on the far side. THE EARTH FACE: eight fat helices banded red and white in a circle round four slender ones (Lockheed Martin's words for the legacy panel; the improved panel of the later twelve craft has other elements in the same places and is NOT drawn apart). A dark horn at the deck's corner. Two lattice antennas on 2.2 m booms across the wing axis, their rods 4 cm thick so that they are lines and not a haze. Two wings of two panels, 11.4 m tip to tip. THE WEST WING IS A MIRROR IMAGE of the east one and the second lattice antenna of the first. SIMPLIFIED OR NOT CITED: see `dimensions`. ONE SHAPE FOR IIR AND IIR-M, whose bus and size are the same (eoPortal's table gives both the same numbers). Axes, so the route says `axes: 'app'`: the antenna face to +Z (the Earth), the wings along X, the cells to +Y. AS IT FLIES, in part: the real craft keeps its antenna on the Earth and its wing axis square to the Sun, which is the app's rule too; it also turns each wing on its axis to face the Sun, which the app does not, so the file's cells face the Sun's side of the sky. Colours are this project's own flat ones (foil #B5673A, helix bands #B8553F and #E6EAF0, cells #26324F), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 8 768 triangles, 11 colours"}
  - {id: gps-iif, file: site/models/gps-iif.glb, kb: 53, budget_tris: 11000, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite named NAVSTAR and launched 2010 to 2016 (12 records in the live saved data of 2026-10-12): the GPS Block IIF craft, Boeing's. They were, and while this file is on its way still are, the build `navigation-gps-iif`, a box with a ring of twelve horns and wings to an 18 m span that a catalogue site gave; public #985", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms)", licence: "Public domain (the US Air Force picture it was drawn from); the shape is this project's, under this repository's licence. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and a US Air Force painting of a GPS Block IIF satellite", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PAINTING, not a photograph: the gold box, the eight-sided antenna plate and its twelve helices, three panels a wing on a frame, the boom with a canister", title: "Navstar-2F", url: "https://commons.wikimedia.org/wiki/File:Navstar-2F.jpg", licence: "Public domain (USAF; a work of the US federal government)", credit: "US Air Force", read: 2026-10-13}], dimensions: {bus_1_m: 2.5, bus_2_m: 2.1, bus_3_m: 1.8, span_m: 13.11, source: "eoPortal, https://www.eoportal.org/satellite-missions/gps, OPENED 2026-10-13, 'Table 1: GPS Block specifications', column Block IIF: 'Dimensions (m)' '2.5 x 2.1 x 1.8'; 'Span including solar arrays (m)' '13.11'; 'Primary Contractors' 'Boeing North American'; and its text: 'The first GPS Block IIF satellite (SVN-62) launched on May 27, 2010. The launch vehicles provided direct insertion into the GPS orbit, meaning the apogee kick motor used in earlier generations was not needed.' Air & Space Forces Magazine, https://www.airandspaceforces.com/weapons-platforms/gps/, OPENED 2026-10-13: '(IIF) 9.6 x 6.5 x 12.9 ft, span incl solar panels 43.1 ft' (43.1 ft is 13.1 m: the span agrees; its body numbers do not agree with eoPortal's and are not used). ESA (F. Dilssner and others, 'Estimation of azimuthal satellite antenna PCVs', IGS Workshop 2012, https://files.igs.org/pub/resource/pubs/workshop/2012/Poland%202012%20-%20P09%20Dilssner%20PR4.pdf, OPENED 2026-10-13), 'GPS satellite antenna assembly': 'Beam-forming assembly consisting of 12 helical elements, 2 concentric circles, 4 inner elements, equally spaced. Azimuth of inner elements wrt +Y axis: IIA: 67.5, 157.5, 247.5, 337.5 deg; IIF: 22.5, 112.5, 202.5, 292.5 deg'; '12 element helix design common to all GPS and GLONASS antenna types'. THE US SPACE FORCE'S OWN FACT SHEET WAS NOT OPENED: losangeles.spaceforce.mil answers 403 to a plain request and to a reader (tried 2026-10-13); a search engine's extract of it gives '98 in wide, 80 in deep, 88 in high'. NOT CITED, read off the Air Force's painting: three panels a wing and the frame that holds them, the wing's width (1.8 m), the antenna deck as an eight-sided white plate, the size of the helices and of both rings, the long antenna at the deck's middle, the group of four at the deck's edge, the boom with a canister at its end. Which of the three body numbers lies along which axis is OURS: the 1.8 m along the Earth axis.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 2.1 x 2.5 x 1.8 m in gold foil with a pale radiator on two sides. THE EARTH FACE: an eight-sided white plate with twelve helices on cups in two circles, the inner four at 22.5 degrees from the wing axis and every 90 after (ESA's numbers), a long antenna at the middle, a group of four stubs at the plate's edge, and a boom to one side with a canister at its end. Two wings of three panels, 13.11 m tip to tip: THE SPAN IS 4.9 m LESS than the build's 18 m, which came from a catalogue site; eoPortal's table and Air & Space Forces Magazine agree on 13.1. THE SECOND WING IS A MIRROR IMAGE of the first. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the antenna face to +Z (the Earth), the wings along X, the cells to +Y. AS IT FLIES, in part: the real craft keeps its antenna on the Earth and its wing axis square to the Sun, which is the app's rule too; it also turns each wing on its axis to face the Sun, which the app does not, so the file's cells face the Sun's side of the sky. Colours are this project's own flat ones (foil #C9A24A, plate #E6EAF0, cells #26324F), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 10 088 triangles, 10 colours"}
  - {id: gps-iii, file: site/models/gps-iii.glb, kb: 64, budget_tris: 13500, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite named NAVSTAR and launched from 2018 (10 records in the live saved data of 2026-10-12): the GPS III craft, Lockheed Martin's. They were, and while this file is on its way still are, the build `navigation-gps-iii`, a tall box with a ring of twelve horns and wings of four panels to a 14 m span; public #985", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms)", licence: "Public domain (the US Air Force picture it was drawn from); the shape is this project's, under this repository's licence. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and a US Air Force render of a GPS III satellite", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; AN ARTIST'S RENDER, not a photograph: the tall dark body, the pale antenna deck wider than it, the helices and gold rods, the long mast, two broad panels a wing on a forked yoke, the thin boom", title: "GPS Block IIIA", url: "https://commons.wikimedia.org/wiki/File:GPS_Block_IIIA.jpg", licence: "Public domain (U.S. Air Force; a work of the US federal government, from losangeles.af.mil)", credit: "US Air Force", read: 2026-10-13}], dimensions: {bus_1_m: 1.8, bus_2_m: 2.5, bus_3_m: 3.4, span_m: 15, source: "eoPortal, https://www.eoportal.org/satellite-missions/gps, OPENED 2026-10-13, 'Table 1: GPS Block specifications', column GPS III/IIIF: 'Dimensions (m)' '1.8 x 2.5 x 3.4'; 'Span including solar arrays (m)' '15'; 'Primary Contractors' 'Lockheed Martin'; its text: 'December 23, 2018: The first GPS Block III satellite, SV01 nicknamed Vespucci, launched'; 'Unlike the GPS IIF satellite, the GPS III satellites feature an apogee propulsion system'; 'the UHF Crosslink and Tracking Telemetry & Command (TT&C) subs[ystems]'. THE US SPACE FORCE'S OWN FACT SHEET WAS NOT OPENED (losangeles.spaceforce.mil answers 403, tried 2026-10-13); a search engine's extract of it gives '97 inches wide, 70 inches deep, and 134 inches high', which is 2.46 x 1.78 x 3.40 m and agrees with eoPortal's table. ESA (Dilssner and others, IGS Workshop 2012, https://files.igs.org/pub/resource/pubs/workshop/2012/Poland%202012%20-%20P09%20Dilssner%20PR4.pdf, OPENED 2026-10-13): '12 element helix design common to all GPS and GLONASS antenna types' (said of the blocks before GPS III). NO PAGE OPENED GIVES GPS III'S ANTENNA LAYOUT IN WORDS OR NUMBERS: the deck is read off the Air Force's render: a pale deck wider than the body, a ring of banded helices round a middle group, thin gold rods among them, one long mast at the middle, a dark canister, and a thin boom from the deck's corner with a small antenna at its end. ALSO READ OFF THE RENDER: two panels a wing, each wing about 4.4 x 2.9 m on a forked yoke 2.2 m long (the span is cited, the split is not); the body's dark sides and the pale radiator on one narrow side. OURS: that the wings stand on the 2.5 m faces.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 1.8 x 2.5 x 3.4 m, dark, with a pale radiator on one narrow side and an apogee nozzle on the far end. THE EARTH FACE: a pale deck wider than the body carrying a ring of eight banded helices round a middle four, six thin gold rods, one long mast, a dark canister, and a thin boom from the deck's corner with a small crossed antenna (shortened to 2 m so the craft stays in the middle of its frame). Two wings of two broad panels on forked yokes, 15 m tip to tip (the build had four panels and 14 m). THE SECOND WING IS A MIRROR IMAGE of the first. NO PAGE OPENED DESCRIBES GPS III'S ANTENNA DECK: every part on it is read off the Air Force's render. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the antenna face to +Z (the Earth), the wings along X, the cells to +Y. AS IT FLIES, in part: the real craft keeps its antenna on the Earth and its wing axis square to the Sun, which is the app's rule too; it also turns each wing on its axis to face the Sun, which the app does not, so the file's cells face the Sun's side of the sky. Colours are this project's own flat ones (body #5A5148, deck #E6EAF0, cells #2B3D6B), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 12 606 triangles, 11 colours"}
  - {id: galileo-foc, file: site/models/galileo-foc.glb, kb: 42, budget_tris: 8000, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite whose name has the word GALILEO and a GSAT02nn number (29 records in the live saved data of 2026-10-12, GSAT0201 to GSAT0234): the Galileo Full Operational Capability craft, OHB's. They were, and while this file is on its way still are, the family navigation box (scene/models.js `navigation`), which stood the body on end with its small face to the Earth. The three In-Orbit Validation craft (GSAT0101 to GSAT0103) keep that box; public #986", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms)", licence: "The shape is this project's, under this repository's licence, built from published numbers (facts). ESA's pictures are not free to reproduce and NONE WAS USED OR COPIED. The one picture looked at is a visitor's photograph of a model, CC BY-SA 3.0, and NOTHING OF IT IS REPRODUCED OR TRACED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from the dimensions in EUSPA's Galileo satellite metadata", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT for where the antennas sit on the Earth face, NOT reproduced and NOT traced; a photograph of a display model, not of the craft", title: "GalileoSatModel", url: "https://commons.wikimedia.org/wiki/File:GalileoSatModel.jpg", licence: "CC BY-SA 3.0 (a visitor's photograph of a model; share-alike: looked at only)", credit: "Pouyana, Wikimedia Commons", read: 2026-10-13}], dimensions: {box_1_m: 2.53, box_2_m: 1.2, box_3_m: 1.1, solar_array_1_m: 5.0, solar_array_2_m: 1.082, span_m: 14.67, l_band_antenna_diameter_m: 1.4, source: "European GNSS Service Centre (EUSPA), 'Galileo Satellite Metadata', https://www.gsc-europa.eu/support-to-developers/galileo-satellite-metadata, OPENED 2026-10-13, section 6.2 'FOC Satellites', 'Dimensions of the Box with respect to the mechanical RF': 'ΔX = 2.530 m', 'ΔY = 1.200 m', 'ΔZ = 1.100 m', '±Z − panel = 3.036 m2'; section 6: 'The Galileo spacecraft is a typical box-wing type satellite, consisting of a central cube (the box) and two rectangular solar panels (the wings) attached to it'; 'The surface area of each solar array amounts to 5.41 m2 (= 5.000 m x 1.082 m)'; section 2.2: 'The +Zs-axis is normal to the separation plane and points towards the L-Band Navigation Antenna. The +Xs-axis is normal to the clock panel and points towards the clock panel'; section 3.1: 'the body is fixed in a way it keeps the Z axis towards the Earth Centre (in order to illuminate the Earth with its Navigation Antenna), the Y axis is perpendicular to the Sun and the X axis points towards deep space'; its table of surfaces: the -X face all 'A' (absorption 0.93: a black blanket), the +X and both Y faces mostly 'C' (specular 0.73: radiators). eoPortal, https://www.eoportal.org/satellite-missions/galileo-foc, OPENED 2026-10-13: 'Spacecraft body size, span' '2.5 m x 1.2 m x 1.1 m'; 'Spacecraft span' '14.67 m'; '2 wings, 2 panels each'; and under a picture of ESA's: 'the 2.5 m by 1.2 m by 1.1 m satellite's main 1.4-m diameter antenna transmits L-band navigation signals down to Earth. To its left is the hexagonal search and rescue antenna'; 'To the bottom right of the navigation antenna are a pair of infrared Earth sensors'; 'Above them is the laser retro-reflector'; 'Above that is the circular C-band antenna'. ESA, https://www.esa.int/Applications/Satellite_navigation/Galileo/Satellite_anatomy, OPENED 2026-10-13: 'Two S-band antennas'; 'The satellite rotates twice per orbit to allow the solar wings to face the Sun's rays'. DERIVED: each wing's yoke is 1.735 m, what is left of the 14.67 m span after a 1.2 m body and two 5.0 m arrays. NOT CITED: exactly where on the Earth face each antenna sits (placed from eoPortal's words and the model photograph looked at), the search-and-rescue antenna's size (0.75 m), the C-band antenna's (0.3 m), every small part's size.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 1.2 m along the wings, 2.53 m across them and 1.1 m along the Earth axis (EUSPA's numbers), black, with silver radiators on the two faces the wings stand on and on the clock end. THE EARTH FACE, the largest: the navigation antenna as a disc 1.4 m across (cited; it is wider than the body and overhangs it) with twelve round elements on it (the pattern is ours), the six-sided search-and-rescue antenna beside it with seven patches, the round C-band antenna, the laser reflector, two Earth sensors, an S-band antenna. Two wings, each array 5.000 x 1.082 m of two panels on a 1.735 m yoke, 14.67 m tip to tip. THE SECOND WING IS A MIRROR IMAGE of the first. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: Galileo's +Z (the antenna) is the app's +Z, its Y (the wings) the app's X, and its -X, the black face the Sun is kept on, the app's +Y. AS IT FLIES, in part: the real craft keeps its antenna on the Earth and its wing axis square to the Sun, which is the app's rule too; it also turns each wing on its axis to face the Sun, which the app does not, so the file's cells face the Sun's side of the sky. Colours are this project's own flat ones (body #2E3138, antenna #C7A24E, cells #1F2B4D), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 360 triangles, 10 colours"}
  - {id: michibiki, file: site/models/michibiki.glb, kb: 57, budget_tris: 12500, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite named QZS-2 or QZS-4 (2 records in the live saved data of 2026-10-12: QZS-2 (MICHIBIKI-2), QZS-4 (MICHIBIKI-4)): the two Michibiki craft with the cone-covered helical antenna. They were, and while this file is on its way still are, the family navigation box at Galileo's size, a third of theirs. QZS-1R, QZS-3, QZS-6 and QZS-7 keep that box: their antennas differ; public #989", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms)", licence: "The shape is this project's, under this repository's licence, built from published numbers (facts). The render compared with is CC BY 4.0 (Cabinet Office of Japan) and is not in the file. The Cabinet Office's dimension drawing was READ FOR ITS NUMBERS AND LAYOUT and is not reproduced. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from the dimensions in the Cabinet Office of Japan's QZS-2 satellite information; compared with a render from the Quasi-Zenith Satellite System website (CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with for the colours and the wings; A RENDER, and OF QZS-1R: the same bus and wings with a FLAT antenna where QZS-2 and QZS-4 have a cone", title: "QZS-1R CG05", url: "https://commons.wikimedia.org/wiki/File:QZS-1R_CG05.png", licence: "CC BY 4.0 (Cabinet Office of Japan, Quasi-Zenith Satellite System website, qzss.go.jp/overview/download/cg-image1r.html)", credit: "Quasi-Zenith Satellite System website, Cabinet Office of Japan", read: 2026-10-13}], dimensions: {body_1_m: 2.4, body_2_m: 2.4, height_m: 6.2, wing_m: 8.3, span_m: 19.0, solar_array_area_m2: 14.9, l_ant_cone_bottom_m: 1.8, l_ant_cone_top_m: 1.5, l_ant_cone_height_m: 0.8, source: "Cabinet Office, Government of Japan, 'QZS-2 Satellite Information', SPI-QZS2_C (revision C, June 28, 2019), https://qzss.go.jp/en/technical/qzssinfo/khp0mf0000000wuf-att/spi-qzs2_c.pdf, OPENED 2026-10-13 (the list it hangs from: https://qzss.go.jp/en/technical/qzssinfo/index.html), section 6 'Geometry', 'Figure 4 Satellite dimensions' '(Unit: mm)', whose dimension lines read 8300, 2400, 8300 (each wing, the body, the other wing: 19.0 m tip to tip), 6200 (height, nozzle to antenna top), 2400 and 2850 (the body and the antenna deck seen from the wing's side); Table 4 'Optical properties': 'SAP 14.9' m2 on each Y face, '+Y MLI 6.2, Radiator 3.9', '-Y MLI 5.7, Radiator 4.4', '+X MLI 10.1', '-Z MLI 5.6'; its note 1: 'L-ANT shape is approximately depicted as a truncated circular cone comprised of Ø1.5m and Ø1.8m circles 0.8m apart'; section 2: 'The +Z-axis is oriented to the bore sight direction of the L-ANT antenna. The +Y-axis is parallel to the rotation axis of the solar panels'; section 3 'Attitude Law': 'Yaw steering mode: The +z-axis is pointing to the Earth. The y-axis is oriented perpendicular to the plane made up by the Sun, Earth and satellite.' The same office's documents for the other craft (SPI-QZS1R_A, SPI-QZS3_F, SPI-QZS6, opened the same day) give the same 14.9 m2 arrays; the drawing of QZS-1R shows A FLAT ANTENNA DECK WITH NO CONE, and eoPortal, https://www.eoportal.org/satellite-missions/qzss, OPENED 2026-10-13, says: 'QZS-1, QZS-2, and QZS-4 have L-band antennas that are helical array antennas, but QZS-3 uses a flat patch antenna', so THIS FILE IS QZS-2 AND QZS-4 ONLY. JAXA, https://global.jaxa.jp/countdown/f18/overview/michibiki_e.html, OPENED 2026-10-13, of the FIRST Michibiki (retired): '2.9m in depth x 3.1m in width x 6.2m in height (Length between the tips of the paddles: 25.3 m)'. DERIVED: the body's box is 4.25 m long (a 10.1 m2 side face over 2.4 m); each wing is two panels of 3.2 x 2.33 m (14.9 m2) on a 1.9 m yoke. READ OFF THE DRAWING, which is not reproduced: where the wings stand on the body, the deck's two small helical antennas and the corner reflector, the nozzle. Colours are the render's: a black blanket, silver radiators, a white antenna cover.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 2.4 x 2.4 x 4.25 m, black, with silver radiators on the two faces the wings stand on, grey patches on the Sun's side, and an apogee nozzle. THE EARTH END: a deck 2.85 m across and on it the L-band antenna's cover, a drum under a truncated cone 1.8 m to 1.5 m across and 0.8 m tall (the Cabinet Office's own approximation of it), white, with sixteen ribs (ours), two small dark antennas and a reflector plate beside it. 6.2 m from the nozzle to the cone's top. Two wings of two panels, 8.3 m each from the body, 19.0 m tip to tip. THE SECOND WING IS A MIRROR IMAGE of the first. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: QZSS's +Z (the antenna) is the app's +Z, its Y (the wings) the app's X, its -X (the Sun's side) the app's +Y. AS IT FLIES, in part: the real craft keeps its antenna on the Earth and its wing axis square to the Sun, which is the app's rule too; it also turns each wing on its axis to face the Sun, which the app does not, so the file's cells face the Sun's side of the sky. Colours are this project's own flat ones (body #2A2D33, cover #F2F4F7, cells #2A3F7A), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 11 702 triangles, 10 colours"}
