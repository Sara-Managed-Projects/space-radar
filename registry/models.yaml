s, and seats of the Crew Dragon.'", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE CREW VEHICLE'S FILE (row `dragon-crew`) WITH WHAT THE CARGO VEHICLE LACKS TAKEN OFF: the same lathed capsule, open nose cone, docking port and trunk; NO engine pods (a smooth hull, the twelve Draco ports straight on the sidewall), NO windows, and TWO fins on the trunk where the crew vehicle has four. No mirror pass: the ports are the same part copied four times round the axis. SIMPLIFIED OR NOT CITED: as the crew vehicle's row, and where the Draco ports sit on the smooth hull. Axes: nose at +Z, the trunk at -Z, the cells toward +Y. Colours as the crew vehicle's; illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 6 788 triangles, 12 colours"}
