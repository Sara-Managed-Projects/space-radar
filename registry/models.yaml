ive rings of a gold net between them. DRAWN DIFFERENTLY FROM THE CRAFT, on purpose: the ribs are 4 cm thick and the net 2 cm where the real ribs are thin springs and the mesh a knit too fine to see, so that at the size the app draws a craft the umbrella is lines and not a haze. Behind its middle the bus, 58 x 58 x 19 cm, with its launch ring; up its axis the payload's column in foil, 0.4 m across and 1.65 m high, with the feed at its top (a centre-fed dish); a solar array of 0.9 x 0.31 m flat on each side of the bus, cells away from the dish. THE SECOND SOLAR ARRAY IS A MIRROR IMAGE of the first. Axes, so the route says `axes: 'app'`: the dish opens to +Z, the Earth face. THE REAL CRAFT TURNS to look to one side when it images, which the app's one attitude cannot say. Colours are this project's own flat ones (ribs #E6EAF0, net #D9B25C, column #C9A24A, bus #AEB5BF, cells #22335F), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 836 triangles, 8 colours"}
