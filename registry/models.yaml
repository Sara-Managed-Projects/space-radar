pace.oceansciences.org/gallery_more.htm?id=1554", licence: "Public domain (NASA; the PACE project's own site)", credit: "NASA", read: 2026-10-13}], dimensions: {length_m: 3.2, width_m: 1.5, observatory_m: [1.5, 1.5, 3.2], array_m: [4.39, 2.54], array_panels: 3, source: "NASA's PACE site, https://pace.oceansciences.org/mission.htm, opened 2026-10-13: 'Dimensions 1.5 m x 1.5 m x 3.2 m (4.9 ft x 4.9 ft x 10.5 ft)'; the stowed drawing's page, https://pace.oceansciences.org/gallery_more.htm?id=1554, opened 2026-10-13: 'In this perspective, the Ka-band antenna, which will transmit science data, is located at top. Just below is the Ocean Color Instrument'; 'Overall observatory dimensions are 1.5 m by 1.5 m by 3.2 m (4.9 x 4.9 x 10.5 ft)'. NASA's PACE blog, https://science.nasa.gov/blogs/pace/2024/02/08/meet-nasas-pace-spacecraft-science-instruments/, opened 2026-10-13: 'The PACE spacecraft stands about 10 feet tall'; 'The spacecraft's solar array is made of three panels. The array measures 100 inches by 173 inches' (2.54 x 4.39 m). THE ISSUE'S eoPortal LINK IS ANOTHER PACE (a 2U CubeSat of 100 x 100 x 243 mm) and gave nothing. NOT CITED, read off NASA's renders: the split of the 3.2 m into a 2.3 m bus and the instrument end, the Ocean Color Instrument's 0.9 x 0.9 x 0.8 m and its place, the Earth shield's 1.4 m, the dish's 0.6 m, both polarimeters' sizes and places, the wing's beam", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. Built: a silver foil box 1.5 x 1.5 x 2.3 m with a white triangular shade on one side face (as NASA's horizon render shows it; its size read off that render) and its gold launch adapter ring on the far end; on the Earth end a deck with the Ka-band dish and two small boxes for the polarimeters HARP2 and SPEXone; on one side there the Ocean Color Instrument as a white housing on a cradle with a gold telescope box, the dark barrel of the rotating telescope, a dark plate where the spectrographs sit, a gold box for the solar calibration assembly and a white radiator; beyond it the Earth shield as a floor and two triangular walls with a dark brace each, a wedge 1.4 m long; one wing of three panels of 3 by 6 cells, 4.39 x 2.54 m, on a beam. WHAT IS APPROXIMATE: everything but the 1.5 x 1.5 x 3.2 m, the wing's size and its three panels; the instrument is a box where the real one is a tilting assembly of spectrographs, the two polarimeters are placed by eye, and the bus's blankets, thrusters, star trackers and sunshades are left out. Axes, so the route says `axes: 'app'`: +Z the Earth face (the dish, the polarimeters, the shield's floor), the 3.2 m along Z, the wing along -X with its cells to +Y; the real wing turns on a drive, so its width stands along Z here where NASA's render shows it lying flat. No mirror pass. Colours are this project's own flat ones (bus #C5CAD2, instrument #E6EAF0, gold #C9A24A and #B5964F, shield #6E7682 and #5E6672, cells #26386B on a grey back #8F97A3), illustrative. Then scripts/bake-own-colours.mjs: 7 116 triangles, none removed, 10 colours, normals with a 40 degree crease, meshopt"}
