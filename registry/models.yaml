e description it links, https://ilrs.gsfc.nasa.gov/docs/Westpac_final.pdf, opened 2026-10-13: 'monolith spherical body made from brass'; 'RR are distributed regularly, 3 pieces on spherical surface of ball's segments limited by the sides of imaginary perfect shape with 20 sides (icosahedron).'; 'round diaphragms with entrance apertures of 20.5 mm installed in a distance of 31.5 mm from the frontal side of each RR'; 'In icosahedron's corners there are 10 deaf holes', and threads 'in two opposite corners'. NOT CITED: where the three sit on a face (drawn 17 degrees from its middle toward its corners), a tube's outer width (drawn 34 mm), the colour (drawn pale, as the page's photograph, which is 'Courtesy of EOS' and not free, shows it)", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. A ball of 432 even triangles 182 mm across; on it SIXTY BAFFLE TUBES 31.5 mm high (the cited height; with the ball, the cited 245 mm), eight-sided, 34 mm across, three on each face of an icosahedron 17 degrees from the face's middle, each with a dark mouth; and a small dark hole at each of the icosahedron's twelve corners (the page: ten blind holes and two threads). DRAWN DIFFERENTLY FROM THE CRAFT: a tube's mouth is one dark disc where the real one has a 20.5 mm aperture over a cube 31.5 mm down; the body is brass and is drawn pale, as the photograph shows it; where the three sit on a face and a tube's width are OURS. The poles are on the file's Y axis. No mirror pass. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 5 328 triangles, 4 colours"}
  # 2026-10-13, batch four (public #952, #953, #954, #965): four NASA craft. SWOT is JPL's OWN published model (the route best first: an agency's file where one exists);
  # NISAR, IXPE and PACE have none and were built in code from cited metres, NISAR with a mesh reflector that is a rim and a net and never a filled disc.
  - {id: swot, file: site/models/swot.glb, kb: 112, budget_tris: 15000, class: satellite, used_for: "NORAD 54754 (SWOT), in the whole active catalogue: the NASA and CNES wide-swath altimeter. JPL's OWN PUBLISHED MODEL of the spacecraft, so the card says 'drawn from a published model of SWOT'. It had no route and was drawn as the generic satellite, a box with a dish; public #952", source: "https://swot.jpl.nasa.gov/resources/86/swot-3d-model/ (page read 2026-10-13: 'SWOT 3D Model', 'Published: January 14, 2020', downloads 'glTF File (3D Model) 2.56 MB' and 'USDZ File (3D Model) 1.05 MB'; the glTF, SWOT.glb, 2 685 556 bytes, sha256 8fb25558...92fbef01, is the file used; the page names no author and no contractor). NASA's 3D Resources (github.com/nasa/NASA-3D-Resources and science.nasa.gov/3d-resources) has no SWOT", licence: "Public domain, on two pages read 2026-10-13. The model's page states no terms of its own; its footer's 'Image Policy' is JPL's, https://www.jpl.nasa.gov/jpl-image-use-policy/: 'Unless otherwise noted, images and video on JPL public web sites (public sites ending with a jpl.nasa.gov address) may be used for any purpose without prior permission, subject to the special cases noted below', with 'the credit line should be \"Courtesy NASA/JPL-Caltech.\"' and no endorsement implied; THAT PAGE NAMES IMAGES AND VIDEO AND DOES NOT NAME 3D MODELS, so the model rests on NASA's media usage guidelines, https://www.nasa.gov/nasa-brand-center/images-and-media/, read 2026-10-13: 'NASA content – images, audio, video, and media files used in the rendition of 3-dimensional models, such as texture maps and polygon data in any format – generally are not subject to copyright in the United States', and 'NASA should be acknowledged as the source of the material'. The page marks no third-party copyright on this model", credit: "3D model: NASA/JPL-Caltech", modified: "THE SHAPE IS JPL'S, WHOLE: no part was moved against another, added or stretched. Made ready by the private tool's official.mjs: the mesh of the node `_root` (a 1 m helper cube with a clear texture, 12 triangles) left out; every mesh called after its node (the export had named all five `Gold_Foil.0xx`, the solar cells among them, and the bake reads `foil` in a mesh name as a shading role); turned as one piece so that the file's x, z, -y are the app's +X, +Y, +Z (the nadir altimeter's dish toward the Earth, the wings along the panel axis, the KaRIn mast across them), which is why the route says `axes: 'app'`; scaled as one piece by 1.1244 so that the mast with its two antennas is 10.6 m across, eoPortal's figure for KaRIn deployed (https://www.eoportal.org/satellite-missions/swot, opened 2026-10-13: 'The overall size is: 3.0 m x 2.8 m x 2.8 m in stowed configuration, and 5.0 m x 10.6 m x 1.5 m in deployed configuration'; 'two SAR antennas, which are located at the opposite ends of a 10 m boom'); the antennas then come out 4.9 m long against the cited 5.0. WHAT THE FILE DOES NOT MATCH, and was left as JPL drew it in 2020, before launch: at that scale the wings span 19.2 m, where JPL's press kit (https://www.jpl.nasa.gov/press-kits/swot/mission-overview/spacecraft/, opened 2026-10-13) says 'two solar arrays, which are 48.8 feet (14.9 meters) in length' and eoPortal '5m total observatory height and 23 m span', and the body is 4.2 m high against that 5 m; the app draws every craft at its own framing size, so the scale changes no picture. Then scripts/bake-own-colours.mjs (--tris=15000 --colours=10): welded on position, 112 loose parts under 0.4 % of the model's size dropped, 19 798 triangles to 14 807 by the weld alone (nothing was decimated); each triangle given the flat colour JPL's own material and texture show at that place, 10 colours in all, brightness held between 12 % and 93 %; images and texture coordinates removed, normals recomputed with a 40 degree crease; drawn through this project's toon material in those colours. ONE COLOUR THAT IS OURS (--recolour): the cell face of the two wings (`shiny_panel`, 16 triangles), which the file's texture averages to #19191f, a near-black, is drawn #24346B, the blue of the cells in NASA's own render of this model (https://commons.wikimedia.org/wiki/File:SWOT_spacecraft_model.png, public domain, from science.nasa.gov/toolkits/spacecraft-icons)"}
  - {id: nisar, file: site/models/nisar.glb, kb: 76, budget_tris: 10500, class: satellite, kind: built-from-dimensions, used_for: "NORAD 65053 (NISAR), in the whole active catalogue: the NASA and ISRO radar satellite, a 12 m mesh reflector on a 9 m boom. It had no route and was drawn as the generic satellite, a box with a dish; public #953", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the NASA pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources, science.nasa.gov/3d-resources and github.com/nasa/NASA-3D-Resources, searched 2026-10-13, has none of this craft)", licence: "Public domain (the NASA pictures it was drawn from); the shape is this project's, under this repository's licence", credit: "3D model: built by Space Radar from published dimensions and NASA/JPL-Caltech drawings and artist's concepts of NISAR", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from: JPL's labelled drawing of the spacecraft: which part is where, the drum's truss, the net inside it", title: "NISAR Spacecraft diagram", url: "https://commons.wikimedia.org/wiki/File:NISAR_Spacecraft_diagram.png", origin: "https://nisar.jpl.nasa.gov/mission/observatory/overview/", licence: "Public domain (NASA/JPL-Caltech)", credit: "NASA/JPL-Caltech", read: 2026-10-13}, {use: "drawn from; A RENDER, not a photograph, square onto the side: where the boom stands, its bends, how far the drum overhangs", title: "NISAR Side NoTilt 2022", url: "https://commons.wikimedia.org/wiki/File:NISAR_Side_NoTilt_2022.png", origin: "https://nisar.jpl.nasa.gov/resources/174/artist-rendering-of-nisar/", licence: "Public domain (NASA/JPL-Caltech)", credit: "NASA/JPL-Caltech", read: 2026-10-13}, {use: "compared with; AN ARTIST'S CONCEPT, not a photograph: the colours in sunlight", title: "NISAR in Orbit (Artist's Concept), PIA26613", url: "https://commons.wikimedia.org/wiki/File:NISAR_in_Orbit_(Artist%E2%80%99s_Concept)_(PIA26613).jpg", licence: "Public domain (NASA/JPL-Caltech, Photojournal PIA26613)", credit: "NASA/JPL-Caltech", read: 2026-10-13}], dimensions: {body_length_m: 5.5, array_length_m: 5.5, array_panel_m: [1.8, 2.2], reflector_diameter_m: 12.0, boom_length_m: 9.0, source: "JPL press kit, quick facts, https://www.jpl.nasa.gov/press-kits/nisar/quick-facts/, opened 2026-10-13: 'Length of spacecraft bus and radar instrument payload: about 18 feet (5.5 meters)'; 'Length of solar panels: two deployable arrays, each just over 18 feet (5.5 meters)'; 'Radar antenna reflector diameter: about 39 feet (12 meters)'; 'Boom length for radar antenna reflector: about 30 feet (9 meters)'. JPL press kit, spacecraft, https://www.jpl.nasa.gov/press-kits/nisar/mission-overview/spacecraft/, opened 2026-10-13: 'Nearly 40 feet (12 meters) in diameter and resembling a snare drum, the radar antenna reflector is mounted at the end of a 30-foot-long (9-meter-long) boom'; 'Measuring 6 feet (1.8 meters) wide and 7 feet (2.2 meters) long, each array consists of three panels' (three panels of 1.8 m are the 5.5 m of the quick facts; built so). eoPortal, https://www.eoportal.org/satellite-missions/nisar, opened 2026-10-13: 'the entire octagonal instrument structure'; 'optical prescription (F/D=0.75)', which for 12 m is a focal length of 9 m and a dish 1 m deep; 'a 0.7m HGA (High Gain Antenna)'. NOT CITED, read off JPL's drawing and side render: the bus (1.9 x 2.0 x 2.2 m) and the instrument structure (an octagon 1.3 m across, 3.5 m long) as the two parts of the 5.5 m, the drum's 1.6 m depth and its 24 bays, where the boom stands and its two bends, the feed's 0.9 x 2.6 m", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE REFLECTOR IS NOT A DISC, because the real one is a see-through knitted mesh: it is a rim truss (two hoops 12 m across and 1.6 m apart, a post each of 24 bays, a zigzag of diagonals) and inside it a NET of thin members on a paraboloid 1 m deep (24 ribs, 4 rings, a diagonal a cell), in a pale gold. DRAWN DIFFERENTLY FROM THE CRAFT, on purpose: the truss's members are 12 cm thick and the net's 8 cm where the real tubes are a few centimetres and the mesh is a knit too fine to see, because at the 300 px the app draws a craft the true drum is a haze and this one is a drum; the net stands for the mesh it carries. The boom is three straight stretches (3.1, 3.0 and 2.8 m) with a gold knuckle at each bend. The bus is a foil box and the instrument structure a foil octagon with white radiators, the feed a pale plate on the face under the reflector; the Ka-band dish and one lattice antenna are on the Earth face; harness, thrusters, star trackers and the GPS antenna on the boom's tip are left out. Two wings of three panels of 3 by 4 cells on yokes; THE RIGHT WING IS A MIRROR IMAGE of the left. Axes, so the route says `axes: 'app'`: +Z the Earth face, the bus and instrument structure along Y, the wings along X with their cells to +Y, the boom standing on the far side with the reflector opening back toward the feed. THE REAL CRAFT FLIES ROLLED, so that its beam leaves to one side of the track; the app knows one attitude and the roll is not drawn. Colours are this project's own flat ones (foil #C9A24A and #D4AE55, net #D9B25C, truss #D5DAE2, cells #2B3D6B, boom #8F97A3), illustrative. Then scripts/bake-own-colours.mjs: 10 208 triangles, none removed, 10 colours, normals with a 40 degree crease, meshopt"}
