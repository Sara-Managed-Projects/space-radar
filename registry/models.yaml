  - {id: saocom, file: site/models/saocom.glb, kb: 58, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 43641 (SAOCOM 1A) and 46265 (SAOCOM 1B), in the whole active catalogue: Argentina's L-band radar satellites, a 10 m antenna of seven panels. They were, and while this file is on its way still are, the shared radar blade (scene/models.js `radar`: Sentinel-1's antenna under a bus with two wings); public #978", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms)", licence: "CC BY 4.0 (CONAE's render it was drawn from: looked at for the layout, with credit; nothing of the picture is in the file); the shape is this project's, under this repository's licence. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and CONAE's render of SAOCOM (CONAE, CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A RENDER, not a photograph: the bus lying across the antenna's back with the launch ring at one end, the solar wing of three panels standing beside it, the antenna's black back with its gold lines and hinges", title: "SAOCOM 3D", url: "https://commons.wikimedia.org/wiki/File:SAOCOM_3D.png", licence: "CC BY 4.0 (CONAE, Comisión Nacional de Actividades Espaciales, Argentina; argentina.gob.ar)", credit: "CONAE", read: 2026-10-13}], dimensions: {antenna_1_m: 10.0, antenna_2_m: 3.5, antenna_panels: 7, solar_wing_m2: 15, stowed_height_m: 4.468, stowed_diameter_m: 2.965, source: "eoPortal, https://www.eoportal.org/satellite-missions/saocom, OPENED 2026-10-13: 'Dimensions: - h = 4.468 m, Ø=2.965 m stowed envelope - 10 m x 3.5 m (35m2) SAR ActivePhase Array antenna - 15 m2 foldable solar array wing'; 'the communication of the platform with each of the seven panels of the radar antenna was verified'; 'the radar antenna of 35 m2 was fully deployed'; 'making the release of the radar antenna, whose wings were attached to the main body of the satellite to give rigidity to the whole'; 'Each SAOCOM-1 spacecraft (SAOCOM-1A and SAOCOM-1B) has an estimated wet mass of ~1600 kg'; 'The spacecraft platform is of SAC-C heritage'. DERIVED: seven panels of 1.43 x 3.5 m make the 10 m; a solar wing of three panels 4.4 x 3.4 m is the 15 m2. READ OFF CONAE'S RENDER: the bus as an eight-sided body 4.4 m long (the stowed envelope's height) and 1.3 m across, lying on the antenna's back ACROSS its length, with the launch ring at one end; the solar wing of three panels standing beside the bus, leaning; the antenna's back black with gold lines, its hinges; the bus's gold foil and pale radiators. OURS: the lean (40 degrees), the antenna's thickness (0.12 m), the pale Earth-side face (the render shows the back only).", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE ANTENNA: seven panels of 1.4 x 3.5 m side by side, 10 m x 3.5 m together (cited), 12 cm thick, a pale face to the Earth and a black back with gold lines and twelve hinge bosses. THE BUS: an eight-sided body 4.4 m long and 1.3 m across in gold foil, lying on the antenna's back across its length on four struts, pale radiators, the launch ring at one end, two rod antennas. THE SOLAR WING: three panels, 4.4 x 3.4 m together (the cited 15 m2), standing beside the bus and leaning 40 degrees. No mirror pass: the antenna's panels are one part repeated and the craft is not symmetric. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the antenna's face to +Z (the Earth), its 10 m along Y, the bus and the wing along X, the cells to +Y and away from the Earth. NOT AS IT FLIES: the real craft is rolled so that the antenna looks to one side of its track, and the app's one attitude puts its face straight down. Colours are this project's own flat ones (foil #C08A4A, antenna back #22252B, lines #B8863B, cells #27345C), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 9 186 triangles, 9 colours"}
