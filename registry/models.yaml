  - {id: zhurong, file: site/models/zhurong.glb, kb: 81, budget_tris: 8500, class: site, kind: built-from-dimensions, used_for: "the utopia landing site (registry/sites.yaml), Utopia Planitia on Mars: China's rover Zhurong, its four wings spread, its mast up. It was the generic rover (scene/models.js `rover`), which is still what is drawn while this file is on its way; public #1124", source: "built by this project in code (release 1.3.0 stage W3-c's scripts, one a craft, on W1-c's part library, kept with the stage's notes), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (CNSA publishes none under terms that allow a derivative, and NASA's 3D Resources and NASA Science's 3D models have none of these craft; read 2026-10-20)", licence: "CC BY 4.0 (the selfie of Zhurong and its lander, CNSA via China News Service; the payload layout figure of Li et al. 2021) and CC0 (Regnart's suspension drawing): looked at, with credit; nothing of them is in the file. The full-size mock-ups' photographs are CC BY-SA 4.0 and were looked at only. The shape is this project's, under this repository's licence, built from published numbers (facts).", credit: "3D model: built by Space Radar from published dimensions and pictures (CNSA via China News Service, CC BY 4.0; Li et al. 2021, CC BY 4.0; Regnart, CC0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; Zhurong beside the lander, from the remote camera it left on the ground, June 2021: the four wings in two layers, the gold body, the mast and its camera head, the copper climate-station cylinder, MarSCoDe, the flag, the two whips, the white wheel housings", title: "Zhurong-with-lander-selfie", url: "https://commons.wikimedia.org/wiki/File:Zhurong-with-lander-selfie.png", licence: "CC BY 4.0 (中国新闻网 / China News Service; Commons' LicenseShortName, read 2026-10-20)", credit: "CNSA / China News Service", read: 2026-10-20}, {use: "drawn from; the layout of the payloads: NaTeCam and MSCam on the mast, MarSCoDe, MCS, RoMAG, the radar's two channels, the dish, the two windows, the four wings' outline", title: "Zhurong payload", url: "https://commons.wikimedia.org/wiki/File:Zhurong_payload.jpg", licence: "CC BY 4.0 (Li, C., Zhang, R., Yu, D. et al. 2021, Space Science Reviews; Commons' LicenseShortName, read 2026-10-20)", credit: "Li et al. 2021, CC BY 4.0", read: 2026-10-20}, {use: "drawn from; the suspension: the main beam's long arm to the rear wheel and its short arm to the coupling, the secondary beam to the middle and front wheels", title: "ZhurongFahrwerk", url: "https://commons.wikimedia.org/wiki/File:ZhurongFahrwerk.jpeg", licence: "CC0 (Regnart; Commons' LicenseShortName, read 2026-10-20)", credit: "Regnart", read: 2026-10-20}, {use: "LOOKED AT ONLY (share-alike; nothing traced, nothing in the file); the full-size mock-up: the deck's octagon and windows, the wings' cut corners, the wheels", title: "Zhurong rover mockup at CSTM 02", url: "https://commons.wikimedia.org/wiki/File:Zhurong_rover_mockup_at_CSTM_02.jpg", licence: "CC BY-SA 4.0 (Shujianyang; Commons' LicenseShortName, read 2026-10-20)", credit: "Shujianyang", read: 2026-10-20}], dimensions: {length_m: 2.6, width_m: 3.0, height_m: 1.85, source: "Wikipedia, 'Zhurong (rover)', https://en.wikipedia.org/wiki/Zhurong_(rover), OPENED 2026-10-20: dimensions '2.6 x 3 x 1.85 m'; 'is 1.85 m tall'; 'powered by four solar panels along with n-undecane stored in 10 containers under two circular windows on the deck'. zh.wikipedia, '祝融号火星车', OPENED 2026-10-20: '完全展开：长2.6米，宽3米，高1.85米' (unfolded: 2.6 m long, 3 m wide, 1.85 m high), '未展开：长1.65米，宽2米，高0.8米' (folded). OURS: the body 0.9 x 1.05 x 0.48 m, the deck 1.44 m across, the wheels 0.3 m across, the wings 1.0 m long swept 36 to 38 degrees, the mast and every instrument's size", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BODY: a gold-blanketed box under an octagonal deck in the same gold foil, with the TWO ROUND WINDOWS (cited); white only where the selfie has it: the camera head, the dish, the wheels' housings and caps (REVISED after the lead's review of #1260, which had read a white-grey deck and dark blue wings against the selfie). FOUR WINGS (cited: four solar panels) swept out like an X from above, so the rover is the cited 3 m wide and about 2.6 m long, the front pair a little up and the rear pair a little down as the selfie shows two layers on each side; their outer corners cut, as the mock-ups show. THE MAST with its cable loop and the camera head (NaTeCam's two lenses, MSCam's); the copper MCS cylinder, MarSCoDe's head and the flag at the front; the high-gain dish on its own mast behind; two whips leaning out at the rear corners; the radar's two dark boxes on the front face. SIX WHEELS with cleats and white hub caps under white housings, on the main and secondary beams of the suspension drawing. The wings' cells are dust-tinted brown-grey on a gold frame, as the selfie shows them after landing (OURS: the tint). No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body): blankets as rumpled sheets with patches a shade lighter and darker and taped seams, so they are not flat slabs. Written by W1-c's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, normals creased at 40 degrees and the blankets' at 12 so their folds show, meshopt), with nothing resampled or decimated. 7937 triangles, 81 kB."}
  - {id: change-3, file: site/models/change-3.glb, kb: 122, budget_tris: 17000, class: site, kind: built-from-dimensions, used_for: "the change-3 landing site (registry/sites.yaml), Mare Imbrium: the Chang'e 3 lander as it stands, Yutu gone and both ramps down, with its ultraviolet telescope and EUV camera. It was the generic lander, which is still what is drawn while this file is on its way; public #1125", source: "built by this project in code (release 1.3.0 stage W3-c's scripts, one a craft, on W1-c's part library, kept with the stage's notes), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (CNSA publishes none under terms that allow a derivative, and NASA's 3D Resources and NASA Science's 3D models have none of these craft; read 2026-10-20)", licence: "CC BY 2.0 (Yutu-2's pictures of the Chang'e 4 lander, the same design, CSNA/Siyu Zhang/Kevin M. Gill) and CC BY 4.0 (CNSA): looked at, with credit; nothing of them is in the file. The mock-ups' photographs are CC BY-SA 4.0 and were looked at only. The shape is this project's, under this repository's licence, built from published numbers (facts).", credit: "3D model: built by Space Radar from published dimensions and pictures (CNSA/Siyu Zhang/Kevin M. Gill, CC BY 2.0; CNSA, CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; the Chang'e 4 lander on the far side photographed by Yutu-2's panoramic camera: the gold blankets with their patches, the flag and the dark panel on one face, a solar panel sloping down, the copper leg absorbers and grey lower tubes, the gold footpads, the white thruster pods, the dish, the camera mast and the tall whip", title: "ChangE-4 - PCAM", url: "https://commons.wikimedia.org/wiki/File:ChangE-4_-_PCAM.png", licence: "CC BY 2.0 (CSNA/Siyu Zhang/Kevin M. Gill; Commons' LicenseShortName, read 2026-10-20)", credit: "CNSA/Siyu Zhang/Kevin M. Gill", r