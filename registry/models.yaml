shes and frames read off the pictures named). Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 4 180 triangles, 7 colours"}
  - {id: lucy, file: site/models/lucy.glb, kb: 26, budget_tris: 10000, class: probe, kind: built-from-dimensions, used_for: "JPL Horizons -49, Lucy (data/sample.js `deep-lucy`), on its way to Jupiter's Trojan asteroids: NASA's probe with two round fan-folded arrays 7.3 m across and a 2 m dish. It was the generic probe; public #1081", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA Science's 3D models, 100 resources listed 2026-10-15, and NASA's 3D Resources, 1 583 paths, have none of this craft); NASA's and JPL's own pictures (public domain) were looked at for the layout and are not in the file; the instrument platform's description is Olkin et al. 2021 (CC BY 4.0)", licence: "Public domain (NASA's pictures, which the layout was read off: looked at, with credit; nothing of them is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts) and the description of the instrument platform in Olkin et al. 2021 (CC BY 4.0, credited). NO LOGO AND NO LETTERING is on the mesh (the plaque Lucy carries is not drawn).", credit: "3D model: built by Space Radar from published dimensions and NASA pictures (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; NASA's ILLUSTRATION OF THE DEPLOYED CRAFT from the front, with a person for scale (the Lucy press kit): two ten-gore round arrays whose cells face the same way as the dish, their hubs on a boom from the body's lower corners, the instrument platform on top, the orange substrate between the cells", title: "Illustration of the deployed Lucy spacecraft", url: "https://commons.wikimedia.org/wiki/File:Illustration_of_the_deployed_Lucy_spacecraft.jpg", licence: "Public domain (NASA, Lucy press kit; Commons' LicenseS