  # Release 1.3.0, stage W2-pbr (internal #967): SLIM (public #1134), built by W1-c and held back because the toon ramp drew it
  # as a yellow box, rebuilt on the physically based look (scene/pbr.js). `look: pbr` says so in as many words.
  - {id: slim, file: site/models/slim.glb, kb: 114, budget_tris: 14000, look: pbr, class: site, kind: built-from-dimensions, used_for: "the slim landing site (registry/sites.yaml), near Shioli crater: JAXA's SLIM as it came to rest, standing on its nose with its engines up and one nozzle lost. It was the generic lander, which is still what is drawn while this file is on its way; public #1134", source: "built by this project in code (release 1.3.0 stage W1-c's part library, lib.py, and one script a craft, kept with the stage's notes), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources, 1 583 paths, and NASA Science's 3D models have none of this craft; read 2026-10-20)", licence: "No JAXA picture or model is in the file, on a sheet or derived from: JAXA's figures and its rendering of the landed attitude were looked at only. The one picture the shape was compared with is a photograph of JAXA's quarter-scale model at Expo 2025 by Commons user Artem.G under CC BY 4.0. The shape is this project's, under this repository's licence, built from published numbers (facts). NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from JAXA's published dimensions; compared with a photograph of JAXA's model by Artem.G (CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with; JAXA's 1/4 model shown as SLIM landed, engines up: the silver engine face, two main nozzles and ten small thrusters on brackets, the gold body, the struts and the ball absorbers", title: "SLIM at Expo2025 02", url: "https://commons.wikimedia.org/wiki/File:SLIM_at_Expo2025_02.jpg", licence: "CC BY 4.0 (Artem.G, own work; Commons' LicenseShortName, read 2026-10-20)", credit: "Artem.G, CC BY 4.0", read: 2026-10-20}, {use: "LOOKED AT ONLY (JAXA's terms forbid altered derivatives): the SLIM media kit's configuration figures, which name every part, and its two-step landing figure", title: "SLIM media kit (October 2023), page 8", url: "https://global.jaxa.jp/countdown/slim/SLIM-mediakit-EN_2310.pdf", licence: "JAXA; looked at only, nothing fetched into the tool or the file", credit: "JAXA", read: 2026-10-20}, {use: "LOOKED AT ONLY: JAXA's picture of the estimated attitude after landing (CG by Mitsubishi Electric Engineering), and the press conference's words", title: "The results of the Moon landing by SLIM, press conference of 25 January 2024, page 17", url: "https://www.isas.jaxa.jp/en/outreach/announcements/files/SLIM-pressconf-20240125.pdf", licence: "JAXA; looked at only", credit: "JAXA / Mitsubishi Electric Engineering", read: 2026-10-20}], dimensions: {width_m: 2.4, depth_m: 1.7, height_m: 2.7, source: "JAXA, SLIM media kit, https://global.jaxa.jp/countdown/slim/SLIM-mediakit-EN_2310.pdf, OPENED 2026-10-20: 'Size: 2.4m x 1.7m x 2.7m', 'Mass: 200kg (Dry) / 700-730kg (Wet)', 'Main engine (2unit)', '22N-Thruster (12 unit)', 'Thin film solar cell', 'S-band antenna', 'Shock absorber (Contact points to Lunar surface)', 'SLIM has adopted a fuel and oxidizer integrated tank to reduce weight. This cylindrical tank is also used as the structure base.' JAXA, press conference of 25 January 2024, https://www.isas.jaxa.jp/en/outreach/announcements/files/SLIM-pressconf-20240125.pdf, OPENED 2026-10-20: 'the final attitude of the spacecraft is believed to be an almost vertical position with the main engine facing upwards and the solar panels facing west'; 'causing the nozzle to break and fall, resulting in the loss of most of the thrust generated by the main engine on the -X side'. OURS: which cited side is which (2.7 m along the engines, 2.4 m across, 1.7 m from the cells to the legs, read off the media kit's figures), the 12 degree lean, every part's size", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. Built in its flight frame and then STOOD ON ITS NOSE (cited: 'an almost vertical position with the main engine facing upwards'), leaning 12 degrees as JAXA's picture of the attitude shows (OURS: the angle). THE BODY: a gold core with two equipment bays whose belly corners are cut, the cylindrical tank that is the structure's base (cited) along the body with its dome out of the far end; the thin-film cells (cited) on one broad face, darker than the app's panel blue, with copper frames. FIVE LEGS (cited: 'its five touchdown legs'): ball-shaped crushable absorbers on pairs of struts. THE ENGINE FACE: silver blankets, ONE main nozzle and the broken mount of the other (cited: the -X nozzle broke and fell), twelve 22 N thrusters on brackets (cited), the landing radar, the navigation cameras, the S-band antenna, the multi-band camera on its bay. LEV-1 and LEV-2 are not drawn (they were released at 5 m); their empty mounts are. REBUILT the same day after the review of #1246 (the first file read as a plain gold box): every face a faceted, rumpled blanket (normals creased at 12 degrees so the folds show) with lighter and darker gold patches, silver and dark octagonal patches and taped seams; the five absorbers as bare-metal lattice balls (JAXA's photograph of a tested one) on thicker struts; a bigger S-band horn and an antenna on a boom; silver radiators with ribs on the belly; bigger thrusters and main nozzle. ONE main nozzle, not two: JAXA says the other broke off in the descent. Which way the cells face ('west') is not drawn: the app does not turn a site's model to the compass. No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body): blankets as rumpled sheets with patches a shade lighter and darker, so they are not flat slabs. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, normals creased at 40 degrees, meshopt), with nothing resampled or decimated: every triangle keeps the colour it was built with. 12536 triangles, 111 kB. REBUILT AGAIN for release 1.3.0 stage W2-pbr (internal #967), the day the app learned to draw a file's own materials: the same parts, now drawn as what they are (the gold and silver blankets crinkled metal foil, the cells under glass, the nozzles bare metal: scene/pbr.js), with the main nozzle as big as the Expo model's (0.6 m across its exit, OURS) on a ring mount and the broken one's mount to match; 13 080 triangles, 14 colours."}
