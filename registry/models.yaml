# Every visual asset, where it came from, and under what licence.
#
# A row without a licence line FAILS CI. That check is necessary and it is not sufficient: it
# proves a string is present, not that the string is TRUE. An audit before this repository went
# public found three claims here that were false of the shipped tree, and they are corrected below.
# CREDITS.md is the human-readable record and takes precedence over this file if they ever differ.
#
# THREE SCRIPTS NOW TURN THREE OF THESE STRINGS INTO FACTS, and none of them is in CI because each
# needs the network:
#   scripts/check-model-ids.sh      does a `norad:` id point at the object its row NAMES?
#   scripts/check-model-reach.py    does a mapping reach any object the app actually draws?
#   scripts/check-model-sources.py  does a `source:` name a model NASA actually has?
# The last one resolves every `real_models` row against NASA's own file index. Run it when you add a row: a
# credit nobody can follow is not a credit, and a folder name is easy to mistype and impossible to
# notice.
#
# WHAT CHANGED, AND WHY IT MATTERS
#   * The `models:` rows described nineteen .glb files. There is no `models/` directory and nothing
#     loads glTF: `site/js/scene/models.js` builds every shape from three.js primitives. Five of
#     those rows credited NASA 3D Resources for ISS, Hubble, JWST and Voyager geometry that this
#     project does not ship. Crediting someone for work you did not use is its own kind of wrong,
#     so the rows now describe the procedural geometry that does ship.
#   * `earth-night` was credited "Public domain (NASA)". The shipped 2k_earth_nightmap (.webp since 2026-09-21) is a
#     Solar System Scope file under CC BY 4.0. A public-domain claim does not discharge CC BY's
#     attribution requirement, so this one mattered.
#   * `starfield` carried a NASA SVS / Gaia DR2 credit line. The shipped 2k_stars_milky_way (.webp since 2026-09-21) is
#     also Solar System Scope, CC BY 4.0.
version: 1

# Procedural geometry. `file: ""` is the point: these are built in code, not loaded, which is why
# a satellite reads as its CLASS rather than as one particular spacecraft. Swapping in real glTF
# later changes site/js/scene/models.js and nothing else.
