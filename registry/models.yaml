c filing (the chassis, the antennas on its Earth face, the array standing on its long edge) and its words on the second generation; A DRAWING IN A LETTER TO THE FCC", title: "SpaceX, letter to the FCC of 1 August 2022 with 'Brightness Mitigation Best Practices for Satellite Operators' attached", url: "https://www.planet4589.org/astro/starsim/docs/mitigation/spx2208a.pdf", licence: "a public filing with the FCC, read; the drawings in it are SpaceX's and nothing of them is reproduced", credit: "SpaceX", read: 2026-10-13}], dimensions: {bus_length_m: 2.8, bus_width_m: 1.3, array_width_m: 2.8, array_length_m: 8.1, source: "J. McDowell, https://planet4589.org/astro/starsim/index.html, opened 2026-10-13: 'In Oct 2022 SpaceX released an FCC filing which gave the dimensions of the proposed Generation 2 Starlinks, as well as an intermediate Gen2 to be launched on Falcon 9: Satellite Bus Dimensions (m) Solar array size (m) Mass (kg) V1.5 2.8 x 1.3m 2.8 x 8.1m 303 V2 Mini 4.1 x 2.7m 4.1 x 12.8m 800'. THE FCC FILING ITSELF WAS NOT OPENED (the FCC's server refused this machine); the numbers are McDowell's table of it. A PEER-REVIEWED PAPER AGREES TO THE SQUARE CENTIMETRE: Fankhauser, Tyson and Askari, 'Satellite Optical Brightness', The Astronomical Journal 166:59 (2023), arXiv:2305.11123, opened 2026-10-13, section 6.1: 'The two largest surfaces on Starlink v1.5 are the solar array and the chassis. The solar array has an area of 22.68 m2, and the chassis nadir has an area of 3.64 m2.' (2.8 x 8.1 = 22.68; 2.8 x 1.3 = 3.64); 'In nominal operations, the chassis points directly nadir and the solar array is perpendicular to the chassis and in the direction of the Sun.'; 'These satellites have a reflective sticker on the chassis nadir and dark pigmented backsheet on the solar arrays'. SpaceX's letter (under `references`), opened 2026-10-13: 'this inter-cell backing material was initially white, but it is now pigmented dark red'. Gunter's Space Page, https://space.skyrocket.de/doc_sdat/starlink-v1-0.htm, opened 2026-10-13: 'The Starlink satellites feature a flat panel design with a single solar panel and have a mass of about 260 kg.' NOT CITED: the chassis's thickness (0.2 m), how many panels the wing folds into (12, two cells across), the four antenna tiles and two small dishes on the Earth face (their count and places), the struts", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired (the meshes generated for this craft on 2026-10-12 were a sail and a plank, and are not used). A chassis 2.8 x 1.3 x 0.2 m; on its Earth face four flat antenna tiles and two small gateway dishes; on its far face a thruster's housing and the wing's root. THE ONE WING STANDS ON THE CHASSIS'S LONG EDGE, SQUARE TO IT, away from the Earth: 2.8 m wide and 8.1 m long in twelve folds of two cells, on two struts. That is the open L the paper describes; the procedural shape laid the wing flat. The wing's cells face +Y, where the app lays the Sun; the real wing turns to follow it. The dark red between the cells and the dark back are the later craft's (SpaceX's words); the first ones had white. No mirror pass. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: +Z the Earth face, the wing along -Z, its cells to +Y. Colours are this project's own flat ones (chassis #D5DAE2, antenna tiles #3A4350, cells #22335F, the lines between them #5E2F33, the wing's back #3F444E), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 5 180 triangles, 7 colours"}
