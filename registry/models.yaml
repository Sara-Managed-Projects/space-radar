# `stars.bin` is a DERIVATIVE work: d3-celestial's stars.6.json repacked to 5 044 Float32
# quadruples (ra, dec, mag, bv). BSD-3-Clause governs it as a binary-form redistribution, which is
# why CREDITS.md reproduces the copyright notice -- that notice is the licence condition, not a
# courtesy.
data:
  - {id: stars,          file: site/data/stars.bin,                  source: "https://github.com/ofrohn/d3-celestial (data/stars.6.json, repacked)", licence: "BSD-3-Clause", credit: "Star catalogue: d3-celestial (Olaf Frohn)"}
  - {id: constellations, file: site/data/constellations.lines.json,  source: "https://github.com/ofrohn/d3-celestial", licence: "BSD-3-Clause", credit: "Constellation lines: d3-celestial (Olaf Frohn)"}
  - {id: constellation-names, file: site/data/constellation-names.json, source: "https://github.com/ofrohn/d3-celestial (constellations.json, fields extracted)", licence: "BSD-3-Clause", credit: "Constellation names: d3-celestial (Olaf Frohn)"}

# THIRD-PARTY MARKS DRAWN IN THE UI, as opposed to in the scene.
#
# One row today. A logo is the asset class with the sharpest teeth: it is a trademark as well as
# a drawing, and permission to use it is conditional on NOT CHANGING IT. So the row records what
# the file was and how it was verified, and CREDITS.md 4.6 carries the terms. `modified: ""` is
# the load-bearing field here -- if it ever stops being empty, the permission stops applying.
marks:
  - {id: github-invertocat, file: "site/js/ui/github.js (inline SVG path)", kind: inline-svg, source: "https://github.com/primer/octicons — icons/mark-github-24.svg, git blob 81949e7b460a7bbf1cb2431462f6bd947e32f0ce, fetched 2026-09-07", licence: "GitHub logo — trademark of GitHub, Inc. Used unmodified to link to GitHub, per GitHub's brand guidelines. Not licensed to this project.", credit: "GitHub logo © GitHub, Inc.", modified: ""}

# REAL GEOMETRY, from NASA's own public-domain glTF models.
#
# NASA publishes these under its media usage guidelines: created by NASA, not copyrighted, free
# to use. The NASA insignia and logos are the exception and none of these carry one. Full terms
# and the credit line are in CREDITS.md.
#
# WHAT WAS CHANGED, because a derivative has to say so: every file was re-encoded from
# KHR_draco_mesh_compression to EXT_meshopt_compression and simplified with gltf-transform. That
# was not cosmetic -- Draco needs a ~300 kB WebAssembly decoder in the browser and meshopt needs
# 29 kB, and the meshopt files came out SMALLER anyway (Hubble: 1 655 kB -> 163 kB). At runtime
# the shading is replaced with this project's toon material, so the GEOMETRY is NASA's and the
# look is ours.
#
# They are loaded ON DEMAND, one file per object, only when the camera is near it. Nobody
# downloads all of them.
real_models:
  - {id: poes, file: site/models/poes.glb, kb: 1323, class: satellite, used_for: "catalogue names NOAA 15, NOAA 18, NOAA 19 (klass satellite): the POES / Advanced TIROS-N bus they share", source: "https://github.com/nasa/NASA-3D-Resources — 3D Models/Polar Operational Environmental Satellite (POES)", licence: "Public domain (NASA media usage guidelines)", credit: "3D model: NASA", modified: "re-encoded Draco -> meshopt, simplified, retextured with this project's toon material"}
  - {id: sentinel6, file: site/models/sentinel6.glb, kb: 401, class: satellite, used_for: "NORAD 46984 (SENTINEL-6A): NASA's own model of the spacecraft it built with ESA", source: "https://github.com/nasa/NASA-3D-Resources — 3D Models/Jason Continuity of Service (Sentinel-6)", licence: "Public domain (NASA media usage guidelines)", credit: "3D model: NASA", modified: "re-encoded Draco -> meshopt, simplified, retextured with this project's toon material"}
  - {id: icesat2, file: site/models/icesat2.glb, kb: 290, class: satellite, used_for: "NORAD 43613 (ICESAT-2): NASA's own model of its laser altimeter", source: "https://github.com/nasa/NASA-3D-Resources — 3D Models/Ice, Clouds, and Land Elevation Satellite-2 (ICESat-2) (A)", licence: "Public domain (NASA media usage guidelines)", credit: "3D model: NASA", modified: "re-encoded Draco -> meshopt; texture coordinates and normals dropped, decimated from 149 000 to 18 400 triangles with scripts/decimate-model.mjs, normals recomputed; retextured with this project's toon material"}
