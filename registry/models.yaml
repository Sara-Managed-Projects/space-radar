  - {id: cygnus, file: site/models/cygnus.glb, kb: 141, budget_tris: 12000, class: station, kind: derived-from-images, used_for: "catalogue names with the word CYGNUS on a station or satellite record (CYGNUS NG-24 today, NORAD 68689): Northrop Grumman's cargo ship, as the kind of thing. The procedural shape (scene/models.js buildCygnus) is drawn while this file is on its way", source: "https://github.com/microsoft/TRELLIS — generated on 2026-10-12 by the TRELLIS image-to-3D model (image-large weights, through the Hugging Face Space trellis-community/TRELLIS, one picture, seed 0) from the NASA photograph named first under `references`", licence: "Public domain (the NASA photograph it was generated from); MIT (TRELLIS, code and weights, whose licence makes no claim on what the model outputs); the cleaning, proportions and colours are this project's, under this repository's licence", credit: "3D model: generated from a NASA photograph with TRELLIS (Microsoft Research, MIT), cleaned and coloured by Space Radar", honesty: "shape built from photographs; proportions approximate", references: [{use: "generated from", title: "ISS-61 Cygnus NG-12 approaching the ISS (4)", url: "https://commons.wikimedia.org/wiki/File:ISS-61_Cygnus_NG-12_approaching_the_ISS_(4).jpg", origin: "https://www.flickr.com/photos/nasa2explore/49019951167/", licence: "Public domain (NASA photograph, ISS Expedition 61)", credit: "NASA", read: 2026-10-12}, {use: "compared with, and the reason two of the generator's choices were overruled", title: "ISS-47 Cygnus OA-6 approaching the ISS (1)", url: "https://commons.wikimedia.org/wiki/File:ISS-47_Cygnus_OA-6_approaching_the_ISS_(1).jpg", origin: "https://www.flickr.com/photos/nasa2explore/26099981645/", licence: "Public domain (NASA photograph, ISS Expedition 47)", credit: "NASA", read: 2026-10-12}, {use: "compared with, and the colour of the arrays' backs was read from it", title: "ISS-55 Cygnus OA-9E approaching the ISS (6) (cropped)", url: "https://commons.wikimedia.org/wiki/File:ISS-55_Cygnus_OA-9E_approaching_the_ISS_(6)_(cropped).jpg", origin: "https://www.flickr.com/photos/nasa2explore/27476870317/", licence: "Public domain (NASA photograph, ISS Expedition 55)", credit: "NASA", read: 2026-10-12}], generator: {name: "TRELLIS (image-large)", url: "https://github.com/microsoft/TRELLIS", licence: "MIT", weights: "https://huggingface.co/microsoft/TRELLIS-image-large", weights_licence: "MIT", run_on: "https://huggingface.co/spaces/trellis-community/TRELLIS (a community copy of Microsoft's demo; its page states licence: mit)", read: 2026-10-12}, dimensions: {length_m: 6.39, diameter_m: 3.07, array_m: 3.7, source: "length and diameter: https://en.wikipedia.org/wiki/Cygnus_(spacecraft) infobox, Enhanced variant, read 2026-10-12 (the page cites Spaceflight101, which answered 404 that day, not a Northrop Grumman sheet). Two fixed arrays: Northrop Grumman's Cygnus fact sheet DS-57a, https://www.northropgrumman.com/wp-content/uploads/Cygnus-Fact-Sheet.pdf, read 2026-10-12: '2 fixed wing UltraFlex solar arrays'; it prints no dimensions. Array width: NOT READ ON A PRIMARY PAGE. 3.7 m is the figure scene/models.js has carried since spec 0027; a web search on 2026-10-12 reported a NASA blog post of 2015-12-06 as saying each circular array is more than 12 feet (3.66 m) across, and that post's address (blogs.nasa.gov/northrop-grumman/2015/12/06/cygnus-to-deploy-solar-arrays-later-today) now redirects to NASA's blog index, so nobody here has read it. It is the least-sourced number in this row", read: 2026-10-12}, modified: "by the private tool model-from-images (finish.py), then scripts/bake-own-colours.mjs. In order: 7 loose pieces (102 triangles) removed; the body found as a cylinder and the mesh turned to the procedural shape's axes (long axis Z, hatch at +Z, arrays along X); the triangles split by place into hull, service module, booms and arrays. THE ARRAYS ARE NOT AS GENERATED: TRELLIS drew two discs 74 degrees apart round the hull, one of them cut by the photograph's edge; the whole one was kept, the craft turned so it lies on +X, the other and its stubs (1 999 triangles) removed, and THE SECOND ARRAY IS A MIRROR IMAGE OF THE FIRST across the plane x = 0 (1 728 triangles copied), because every photograph shows two arrays on one axis. THE PROPORTIONS ARE NOT AS GENERATED: scaled along the axis to 6.39 m and across it to 3.07 m separately, which widens the generated hull 31 % against its length (it came out 2.72 diameters long; the cited figures make it 2.08); the kept array, an oval 4.98 by 3.62 m after that, was made round and 3.70 m across (scaled 0.74 along its long side, 1.02 along its short one, about its root). 15 open loops closed with fans (308 triangles added). Span across the arrays as built: 10.4 m (not a cited figure). THE COLOURS ARE OURS and illustrative, the generator's texture is not used: hull #E6EAF0, service module #B9BFC7, booms #B9C2CE and cells #1F3A5F are the procedural Cygnus's own; the arrays' backs #B2935E are the mean colour of an array's back in the third photograph, brightened. Then welded on position, decimated from 17 482 to 12 000 triangles, 5 colours, normals recomputed with a 40 degree crease, meshopt; drawn through this project's toon material in those colours. NOT FIXED: the service module's detail is the generator's invention where the photograph could not see it, and the hatch end was not in the photograph at all"}
  - {id: nustar, file: site/models/nustar.glb, kb: 43, budget_tris: 6000, class: telescope, kind: built-from-dimensions, used_for: "NORAD 38358 (NUSTAR): NASA's hard X-ray telescope, on the layer of satellites worth knowing. It had no route and was drawn as the generic satellite, a box with a dish; public #964", source: "built by this project in code (the private tool model-from-images, assemble.py, from a yaml of primitives), from the cited dimensions and the two NASA/JPL-Caltech renders under `references`; no image-to-3D model was used, and no published mesh", licence: "Public domain (the NASA/JPL-Caltech renders it was drawn from); the shape is this project's, under this repository's licence", credit: "3D model: built by Space Radar from published dimensions and NASA/JPL-Caltech artist's concepts of NuSTAR", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from: the layout of the optics bench, the bus and the wing; A RENDER, not a photograph", title: "NuSTAR spacecraft model (artist's concept of NuSTAR on orbit)", url: "https://commons.wikimedia.org/wiki/File:NuSTAR_spacecraft_model.png", licence: "Public domain (NASA/JPL-Caltech artist's concept)", credit: "NASA/JPL-Caltech", read: 2026-10-13}, {use: "compared with; the same view in silver (PIA15265)", title: "NuStar 2", url: "https://commons.wikimedia.org/wiki/File:NuStar_2.jpg", licence: "Public domain (NASA/JPL-Caltech artist's concept, PIA15265)", credit: "NASA/JPL-Caltech", read: 2026-10-13}], dimensions: {length_m: 10.9, width_m: 1.2, mast_m: 10.0, focal_length_m: 10.15, optic_outer_radius_m: 0.191, source: "Overall 1.2 x 10.9 m: https://en.wikipedia.org/wiki/NuSTAR infobox, read 2026-10-13. Mast 10 m, focal length 10.15 m, mirror shells 51 to 191 mm in radius: https://www.eoportal.org/satellite-missions/nustar, read 2026-10-13 ('a 10 m mast is deployed to achieve a focal length of 10.15 m'; 'Shell radii 51 - 191 mm'). NOT CITED, read off the render by eye: the other sides of the optics bench (1.2 x 0.72 x 0.5 m) and of the bus (an octagon 0.98 m across, 0.9 m long), the mast's 0.36 m side, the wing's 2.6 x 1.05 m in five panels", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired; what is DRAWN DIFFERENTLY FROM THE CRAFT, on purpose: the mast has 26 bays where the render shows about twice as many, and its members are 44 mm thick where the real ones are about a centimetre, because at the 260 px the app draws a craft the true lattice is a grey haze and this one is a lattice; the optics are two dark hexagonal housings with a silver disc at the cited 191 mm radius, not 133 nested shells; the bus and the bench are plain foil boxes with two dark radiators, and the star trackers, the metrology lasers and the harness are left out but for one white box. Axes: the optics at -Z looking away from the Earth, the bus and the detectors at +Z, the wing along +X. No mirror pass. Colours are this project's own flat ones (foil #C9B27A, cells #2E4E8C, structure #D5DAE2, dark #2B2F38), illustrative. Every triangle is cut small (under the area at which the bake samples a triangle at its own middle), so that each keeps its own colour: the bake gives a triangle the colour of the nearest sample of the original surface, and the first wing came out without its frame lines. Then scripts/bake-own-colours.mjs: 5 668 triangles (1 200 of them the wing's frame lines), none removed, 6 colours, normals with a 40 degree crease, meshopt"}
  - {id: xrism, file: site/models/xrism.glb, kb: 141, budget_tris: 14000, class: telescope, kind: derived-from-images, used_for: "NORAD 57800 (XRISM), on the layer of bright satellites: JAXA and NASA's X-ray spectroscopy telescope. It was the generic space telescope, a white drum (scene/models.js `space-telescope`), which is still what is drawn while this file is on its way; public #968. Hitomi (41337) does not wear it: it has a file of its own on this body, row `hitomi`: it has a file of its own on this body, row `hitomi`: it has a file of its own on this body, row `hitomi`: it has a file of its own on this body, row `hitomi`", source: "https://github.com/microsoft/TRELLIS — generated on 2026-10-13 by the TRELLIS image-to-3D model (image-large weights, through the Hugging Face Space trellis-community/TRELLIS, its multi-image mode, two pictures, stochastic, seed 0) from the two NASA renders named first under `references`; the two solar paddles are not the generator's: they were built in code", licence: "Public domain (the NASA Goddard renders it was generated from); MIT (TRELLIS, code and weights, whose licence makes no claim on what the model outputs); the repairs, the parts built in code, the proportions and the colours are this project's, under this repository's licence", credit: "3D model: generated from NASA Goddard renders of XRISM with TRELLIS (Microsoft Research, MIT), repaired and coloured by Space Radar", honesty: "shape built from an artist’s render; proportions approximate", references: [{use: "generated from; A RENDER, not a photograph: a frame of NASA's turntable, the mirrors toward the camera", title: "XRISM 001", url: "https://commons.wikimedia.org/wiki/File:XRISM_001.png", origin: "https://svs.gsfc.nasa.gov/20374/", licence: "Public domain (NASA's Goddard Space Flight Center Conceptual Image Lab)", credit: "NASA's Goddard Space Flight Center Conceptual Image Lab", read: 2026-10-13}, {use: "generated from; another frame of the same turntable, the base toward the camera and the paddles' cell side", title: "XRISM 004", url: "https://commons.wikimedia.org/wiki/File:XRISM_004.png", origin: "https://svs.gsfc.nasa.gov/20374/", licence: "Public domain (NASA's Goddard Space Flight Center Conceptual Image Lab)", credit: "NASA's Goddard Space Flight Center Conceptual Image Lab", read: 2026-10-13}, {use: "compared with: the paddles' three panels and grey backs, the four dark apertures", title: "XRISM 002", url: "https://commons.wikimedia.org/wiki/File:XRISM_002.png", origin: "https://svs.gsfc.nasa.gov/20374/", licence: "Public domain (NASA's Goddard Space Flight Center Conceptual Image Lab)", credit: "NASA's Goddard Space Flight Center Conceptual Image Lab", read: 2026-10-13}], generator: {name: "TRELLIS (image-large)", url: "https://github.com/microsoft/TRELLIS", licence: "MIT", weights: "https://huggingface.co/microsoft/TRELLIS-image-large", weights_licence: "MIT", run_on: "https://huggingface.co/spaces/trellis-community/TRELLIS (a community copy of Microsoft's demo; its page states licence: mit)", read: 2026-10-12}, dimensions: {height_m: 7.9, span_m: 9.2, width_m: 3.1, source: "'Ground test results of the electromagnetic interference for the x-ray microcalorimeter onboard XRISM', section 2.2, https://ar5iv.labs.arxiv.org/html/2303.00985, OPENED 2026-10-13 (the row first took these numbers from a search result; the paper says the same): 'It has a weight of 2.3x10^3 kg and an envelope size of 7.9, 9.2, and 3.1 m respectively for the height (z), length (x), and width (y). The main body is composed of eight side panels (SP1-8) of 990x3100 mm2 in size' and 'The solar array panels are stored in SP2 and SP4 at launch and are deployed in parallel with SP3, which are oriented toward the Sun.' The XRISM Quick Reference, https://arxiv.org/pdf/2202.05399, opened 2026-10-13, mission table: 'Dimension 7.9 m x 9.2 m x 3.1 m'. Neither says in words that the 9.2 m (x) is the span across the paddles; it is read so because an octagon of 0.99 m panels is 2.4 m across its flats, and the generated mesh, scaled to 7.9 m of height, measured 9.4 m across its own paddles. NOT CITED: a paddle's 3.04 x 2.65 m and its three panels, from the renders and the generated mesh", read: 2026-10-13}, modified: "by the private tool model-from-images (assemble.py), then scripts/bake-own-colours.mjs. In order: the mesh turned to the app's axes (the mirrors at -Z, away from the Earth; the paddles along X; cells toward +Y). THE PADDLES ARE NOT AS GENERATED: TRELLIS drew each as a dented slab 0.8 m thick; both were cut out (1 838 triangles, and 333 more in 2 loose pieces) and replaced by flat wings built in code, 3.04 x 2.65 m, three panels of 2 by 5 cells with light frame lines 70 mm wide between them, 40 mm thick, their tips 4.6 m from the axis (half the cited span), each on two short booms; the right wing IS A MIRROR IMAGE of the left across the plane x = 0. 5 open loops left by the cuts closed with fans (91 triangles). Scaled so the body is the cited 7.9 m long, in one piece and by one factor: the proportions of the body are the generator's (3.47 m across against the cited 3.1 m envelope width, which is 12 % wide). THE COLOURS: the body's are flat colours read off the generator's own texture by the bake (four golds for the foil, greys and a dark for the panels and apertures; 10 colours in all, no image ships); the cells #2E4E8C, the wings' backs #AEB5BF and the booms #D9DEE6 are ours. Every triangle built in code is cut small (under the area at which the bake samples a triangle at its own middle), because the bake gives a triangle the colour of the nearest sample of the original surface and a large flat triangle of ours took its neighbour's: the first wings came out solid blue with no lines. 13 731 triangles, 10 903 of them the generated body and 2 340 the wings' frame lines; nothing decimated, normals with a 40 degree crease, meshopt. NOT FIXED: a first run from ONE frame bent the body 20 degrees and is not this file; this one's surface is faceted where the foil is smooth, the four apertures are dark caps and not mirrors, the inner panel of each paddle is painted on the body's side where the generator put it, and what neither frame showed (the far side of the base) is the generator's guess"}
  - {id: noaa21, file: site/models/noaa21.glb, kb: 51, budget_tris: 9000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 54234 (NOAA 21 (JPSS-2)), on the layer of satellites worth knowing: NOAA's newest polar weather satellite. It had no route and was drawn as the generic satellite; public #994. NOAA 20 (43013) does not wear it. REBUILT on 2026-10-13: the first file of that day was a body generated from NOAA's render (kind derived-from-images), lumpy and with no instrument on it; this one is built from dimensions alone", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh", licence: "Public domain (NOAA's render and NOAA's two drawings it was drawn from, works of the United States government); the shape is this project's, under this repository's licence", credit: "3D model: built by Space Radar from published dimensions and NOAA's drawings and render of NOAA-21", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from: where each instrument sits on the nadir deck, the wing, the aft end; NOAA'S OWN LABELLED DRAWING, with no dimensions on it", title: "JPSS-2 Blueprints", url: "https://www.nesdis.noaa.gov/s3/2022-09/JPSS-2_Blueprints.png", licence: "Public domain (NOAA NESDIS, a work of the United States government)", credit: "NOAA", read: 2026-10-13}, {use: "drawn from: the four instruments named on NOAA's render, beside the same drawing", title: "NOAA-21 schematic diagram", url: "https://www.nesdis.noaa.gov/s3/2023-12/noaa-21-schematic-diagram.png", licence: "Public domain (NOAA NESDIS, a work of the United States government)", credit: "NOAA", read: 2026-10-13}, {use: "compared with: the colours, the radiators, the adapter ring; A RENDER, not a photograph", title: "Artist's rendering of NOAA-21", url: "https://commons.wikimedia.org/wiki/File:Artist%27s_rendering_of_NOAA-21.png", origin: "https://www.noaa.gov/news-release/noaas-newest-satellite-heads-toward-orbit", licence: "Public domain (NOAA)", credit: "NOAA", read: 2026-10-13}], dimensions: {body_length_m: 4.27, body_width_m: 2.13, length_with_array_m: 10.67, viirs_m: 1.41, cris_m: 0.94, atms_m: 0.70, omps_m: 0.56, source: "NOAA NESDIS, 'JPSS satellite and instruments', https://www.nesdis.noaa.gov/our-satellites/currently-flying/joint-polar-satellite-system/jpss-satellite-and-instruments, OPENED 2026-10-13 (the first file took the same sentence from a search result; the numbers are the same): 'NOAA-21 is about the size of a large pickup truck, at 14 feet by 7 feet, and it weighs 5,750 pounds. Its length stretches to 35 feet when its solar array is deployed.' The instruments, NOAA's paper model, https://www.nesdis.noaa.gov/s3/2022-09/JPSS%20Paper%20Model-071922.pdf, opened 2026-10-13: 'JPSS-2 carries four instruments that collect information: the Advanced Technology Microwave Sounder (ATMS), the Cross-track Infrared Sounder (CrIS), the Visible Infrared Imaging Radiometer Suite (VIIRS), and the Ozone Mapping and Profiler Suite (OMPS).' (no CERES: eoPortal's JPSS payload table lists it for JPSS-1 only). Their sizes, https://www.eoportal.org/satellite-missions/suomi-npp and https://www.eoportal.org/satellite-missions/jpss, opened 2026-10-13: VIIRS 'a size of 134 cm x 141 cm x 85 cm'; CrIS 'Instrument size 71 cm x 88 cm x 94 cm'; 'ATMS instrument dimensions 70 cm x 60 cm x 40 cm'; OMPS 'a size of 0.35 m x 0.54 m x 0.56 m'. Five panels: eoPortal, 'a deployable five-panel solar array capable of generating 4450 W'. NOT CITED, measured on NOAA's drawing scaled by the cited 4.27 m: the deck's 1.45 m width, the bus's 1.3 m height (with VIIRS's 0.85 m below the deck that is the cited 7 ft), the wing's 8.5 x 1.85 m, the radiators, where each instrument sits, and everything on the side away from the Earth", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired (the first file's generated body is gone). A box bus 1.45 x 2.9 x 1.3 m in copper foil with a narrower aft module, the aft frame, the adapter ring and the tank's dome behind it, and ON THE EARTH FACE the four instruments JPSS-2 carries as boxes of their cited sizes in the order NOAA's drawing shows from the aft end: OMPS (with its limb unit), ATMS (with a scan drum), CrIS (with its cooler shield), a row of four small cylinders, and VIIRS, the largest, overhanging the forward end with its radiator and Earth shield; the dish on its boom on the wing's side of the deck. Away from the Earth and on the cold side: three radiators leaning out along the side and one on top, a raised deck, two star trackers, two small antennas and a second dish, PLACED BY EYE from the render; the cooler shield of CrIS and the radiator of VIIRS lean out from the cold side as white plates. The wing: 8.5 x 1.85 m, five panels of 3 by 4 cells, on a two-rod yoke, turned 37 degrees from edge-on; with the bus and the plates on its far side the craft is 10.67 m across, the cited 35 ft. SIMPLIFIED: every instrument is a plain box with one dark aperture, the harness, the thrusters and the small antennas are left out. Axes: the long axis on Y with the aft end at -Y, the instruments on +Z (the app's Earth face), the wing along -X. No mirror pass: nothing on this craft is symmetric. Colours are this project's own flat ones (foil #9C6233, #7A4A26 and #C8A24A, white #E6EAF0, cells #2E4E8C), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 8 716 triangles, 8 colours. RE-BAKED 2026-10-13 (batch three): the first file of this rebuild had lost one of each pair of parts that shared a name (a side radiator, a wing section, a yoke rod, an antenna cone, a deck cylinder), because the tool kept one part a name; all are in this one"}
  - {id: seasat, file: site/models/seasat.glb, kb: 66, budget_tris: 9000, class: satellite, kind: derived-from-images, used_for: "NORAD 10967 (SEASAT 1), on the layer of bright satellites: the 1978 ocean satellite, dead since that October and still in orbit. It was drawn as the generic radar satellite, a bus with a blade (scene/models.js `radar`), which is still what is drawn while this file is on its way; public #946", source: "https://github.com/microsoft/TRELLIS — generated on 2026-10-13 by the TRELLIS image-to-3D model (image-large weights, through the Hugging Face Space trellis-community/TRELLIS, one picture, seed 0) from the NASA/JPL artist's concept named first under `references`; only the trunk is the generator's: the wings, the radar antenna, the stick antennas, the dishes and the booms were built in code", licence: "Public domain (the NASA/JPL artist's concept it was generated from); MIT (TRELLIS, code and weights, whose licence makes no claim on what the model outputs); the repairs, the parts built in code, the proportions and the colours are this project's, under this repository's licence", credit: "3D model: generated from a NASA/JPL artist's concept of Seasat with TRELLIS (Microsoft Research, MIT), repaired and coloured by Space Radar", honesty: "shape built from an artist’s render; proportions approximate", references: [{use: "generated from; AN ARTIST'S CONCEPT, not a photograph: nobody photographed Seasat in orbit", title: "Seasat (artist's concept, JPL craft2)", url: "https://commons.wikimedia.org/wiki/File:Seasat.jpg", licence: "Public domain (NASA/JPL artist's concept)", credit: "NASA/JPL", read: 2026-10-13}, {use: "compared with: where the wings, the radar antenna and the sticks sit, from the other side", title: "Seasat in orbit (artist's concept, JPL craft1)", url: "https://commons.wikimedia.org/wiki/File:Seasat_in_orbit.jpg", licence: "Public domain (NASA/JPL artist's concept)", credit: "NASA/JPL", read: 2026-10-13}], generator: {name: "TRELLIS (image-large)", url: "https://github.com/microsoft/TRELLIS", licence: "MIT", weights: "https://huggingface.co/microsoft/TRELLIS-image-large", weights_licence: "MIT", run_on: "https://huggingface.co/spaces/trellis-community/TRELLIS (a community copy of Microsoft's demo; its page states licence: mit)", read: 2026-10-12}, dimensions: {length_m: 21.0, diameter_m: 1.5, sar_length_m: 10.74, sar_width_m: 2.16, solar_cells_m2: 14.5, source: "https://www.eoportal.org/satellite-missions/seasat, read 2026-10-13: 'S/C size: 21 m length, 1.5 m diameter'; 'the SAR antenna, a 2.1 m x 10.7 m planar array deployed perpendicular to the satellite body' and '1024-element phased array antenna of size 10.74 m x 2.16 m'; the solar panels 'made up an area of 14.5 m2 of solar cells', 'two wings mounted on either side of the aft rack'. NOT CITED, placed by eye from the two artist's concepts: each wing's 4.85 x 1.5 m (the cited area split in two), where the radar antenna hangs and its 20 degree tilt, and the size and place of every stick antenna, dish and boom", read: 2026-10-13}, modified: "by the private tool model-from-images (assemble.py), then scripts/bake-own-colours.mjs. In order: the mesh turned to the app's axes (the sensor module at +Z, the Earth; the Agena's engine at -Z; the wings along X). MOST OF WHAT IS THIN IS NOT AS GENERATED. TRELLIS drew the two solar wings as crumpled stubs a third of their length: cut out (954 triangles). It drew the antennas as a bush of about twenty spikes and left the radar antenna out: cut out (2 420 triangles, and 29 in 4 loose pieces). What is left of the generator's is the trunk, 2 378 of its 5 550 triangles; 7 open loops closed with fans (231 triangles). Scaled by one factor so the trunk is the cited 21 m long; its tank then measures about 1.4 m across against the cited 1.5 m, and it leans a degree or two, as generated. BUILT IN CODE: two flat wings of 4.85 x 1.5 m with 8 by 3 cells and light frame lines 68 mm wide, on booms at the aft rack, the right one A MIRROR IMAGE of the left across the plane x = 0; the radar antenna as a plate of the cited 10.74 x 2.16 m with one rib, hung on three struts beside the sensor module and tilted 20 degrees from facing the Earth; four stick antennas 2.9 m long; two dishes of 1.0 and 0.8 m; a beacon on a 3.8 m boom. THE COLOURS: the Agena's tank #E6EAF0 and its aft rack #C9B27A are ours, given to those two stretches of the trunk whole, because the generator's texture carried the render's shadows and made a white tank three greys; the sensor module keeps flat colours read off the generator's texture, multiplied by 1.4; cells #2E4E8C, antenna #D5DAE2, the rest our greys. Every triangle built in code is cut small (under the area at which the bake samples a triangle at its own middle), because the bake gives a triangle the colour of the nearest sample of the original surface and a large flat triangle of ours took its neighbour's: the first wings came out solid blue with no lines. 8 468 triangles (2 378 of them the generator's trunk, 1 908 the wings' frame lines), nothing decimated, 8 colours, normals with a 40 degree crease, meshopt. NOT FIXED: the trunk is lumpy where the Agena is a clean ribbed drum; the sensor module is a dark mass with none of its instruments; the radar antenna is a plain plate and the real one is eight hinged panels on a truss; the edge between tank and aft rack is jagged, one triangle wide"}
  - {id: hitomi, file: site/models/hitomi.glb, kb: 138, budget_tris: 14000, class: telescope, kind: derived-from-images, used_for: "NORAD 41337 (ASTRO-H (HITOMI)), on the layer of bright satellites: JAXA's X-ray observatory, which broke apart on 26 March 2016. It was the generic space telescope, which is still what is drawn while this file is on its way; public #969. THE FILE IS THE CRAFT AS LAUNCHED; the catalogue object is its main body, and the card says so (scene/realmodels.js `was`)", source: "https://github.com/microsoft/TRELLIS — THE BODY IS XRISM'S: the mesh TRELLIS generated on 2026-10-13 from two frames of NASA Goddard's turntable render of XRISM (row `xrism`), which is Hitomi's recovery mission on the same bus; nothing was generated for this row. Hitomi's own parts, the extensible optical bench, the HXI plate and its two imagers, the two soft gamma-ray detectors, and both solar paddles were built in code", licence: "Public domain (the NASA Goddard renders of XRISM the body was generated from, and NASA's drawing and NASA/HEASARC's schematic of Hitomi the other parts were drawn from); MIT (TRELLIS, code and weights, whose licence makes no claim on what the model outputs); the repairs, the parts built in code, the proportions and the colours are this project's, under this repository's licence", credit: "3D model: body generated from NASA Goddard renders of XRISM with TRELLIS (Microsoft Research, MIT); Hitomi's optical bench and detectors built by Space Radar from published dimensions and NASA drawings", honesty: "shape built from an artist’s render; proportions approximate", references: [{use: "the body was generated from; A RENDER OF XRISM, not of Hitomi and not a photograph: a frame of NASA's turntable", title: "XRISM 001", url: "https://commons.wikimedia.org/wiki/File:XRISM_001.png", origin: "https://svs.gsfc.nasa.gov/20374/", licence: "Public domain (NASA's Goddard Space Flight Center Conceptual Image Lab)", credit: "NASA's Goddard Space Flight Center Conceptual Image Lab", read: 2026-10-13}, {use: "the body was generated from; another frame of the same turntable render of XRISM", title: "XRISM 004", url: "https://commons.wikimedia.org/wiki/File:XRISM_004.png", origin: "https://svs.gsfc.nasa.gov/20374/", licence: "Public domain (NASA's Goddard Space Flight Center Conceptual Image Lab)", credit: "NASA's Goddard Space Flight Center Conceptual Image Lab", read: 2026-10-13}, {use: "drawn from: Hitomi whole, the bench and the octagonal plate at its end; A DRAWING, not a photograph", title: "Hitomi", url: "https://commons.wikimedia.org/wiki/File:Hitomi.png", licence: "Public domain (NASA)", credit: "NASA", read: 2026-10-13}, {use: "drawn from: the extendable bench as a lattice, the HXI at its end, the two gamma-ray detectors on the side panels; A LABELLED ARTIST'S SCHEMATIC", title: "Astro-H schema (en)", url: "https://commons.wikimedia.org/wiki/File:Astro-H_schema_(en).png", licence: "Public domain (NASA/HEASARC)", credit: "NASA/HEASARC", read: 2026-10-13}], generator: {name: "TRELLIS (image-large)", url: "https://github.com/microsoft/TRELLIS", licence: "MIT", weights: "https://huggingface.co/microsoft/TRELLIS-image-large", weights_licence: "MIT", run_on: "https://huggingface.co/spaces/trellis-community/TRELLIS (a community copy of Microsoft's demo; its page states licence: mit)", read: 2026-10-12}, dimensions: {total_length_m: 14.0, bench_m: 6.4, body_height_m: 7.9, span_m: 9.2, source: "Takahashi et al., 'The ASTRO-H X-ray Astronomy Satellite', https://ar5iv.labs.arxiv.org/html/1412.1356, opened 2026-10-13: 'Total Length 14 m'; 'The focal length of the HXTs is 12 m. The Hard X-ray Imaging detectors (HXIs) are mounted on the HXI plate, at the end of a 6 m extendable optical bench (EOB) that is stowed to fit in the launch fairing and deployed once in orbit.' JAXA's press kit, https://global.jaxa.jp/projects/sat/astro_h/files/astroh_presskit.pdf, opened 2026-10-13, figure 3.1: 'Overall length ~14 m', 'Extensible Optical Bench (EOB) ~6.4 m'. THE TWO DISAGREE on the bench by 0.4 m; the 6.4 m is built, which with the body's 7.9 m is 14.3 m. The body's 7.9 m and the 9.2 m span are XRISM's (row `xrism`): no source opened gives Hitomi's body or its paddles alone. The breakup, JAXA, https://global.jaxa.jp/press/2016/04/20160428_hitomi.html, opened 2026-10-13: 'it is highly likely that both solar array paddles had broken off at their bases where they are vulnerable to rotation.' NOT CITED: the bench's 0.7 m side, the HXI plate's 1.9 m, the detectors' boxes and which side panels they sit on", read: 2026-10-13}, modified: "by the private tool model-from-images (assemble.py), then scripts/bake-own-colours.mjs. THE BODY IS NOT A MODEL OF HITOMI: it is the mesh generated for XRISM, by the same recipe as the row `xrism` (turned to the app's axes, both generated paddles cut out and their holes closed, scaled so the body is 7.9 m), thinned here to 9 000 triangles with its colours gathered into seven flat ones read off the generator's texture. What differs between the two craft on the body itself is NOT FIXED: Hitomi's top plate carried four telescopes where XRISM's carries two, and its fixed bench is a plainer tube. HITOMI'S OWN PARTS ARE BUILT IN CODE: the extensible optical bench as a square lattice 0.7 m a side from the base plate to 6.4 m beyond it (12 bays, members 60 mm thick, which is fewer and thicker than the real mast so that it is a lattice at the size the app draws it); the HXI plate at its end, an octagon 1.9 m across in foil, with the two Hard X-ray Imagers as boxes on its near face; the two Soft Gamma-ray Detectors as foil boxes with white radiators on two side panels near the base, placed by eye; the paddles, 3.04 x 2.65 m in three panels, as XRISM's. Everything on the right (paddle, imager, detector) IS A MIRROR IMAGE of the left across the plane x = 0. Axes: the mirrors at -Z, the bench along +Z (the app's Earth face), paddles along X, cells toward +Y. The colours of the parts built in code are ours (lattice #D5DAE2, foil #C9B27A, cells #2E4E8C), illustrative. 13 284 triangles, 10 colours, normals with a 40 degree crease, meshopt. THE CRAFT DRAWN NO LONGER EXISTS IN THIS FORM: see `used_for`"}
  - {id: lageos, file: site/models/lageos.glb, kb: 50, budget_tris: 7000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 8820 (LAGEOS 1) and 22195 (LAGEOS 2), the two laser geodynamics satellites. Both were the one plain ball every laser-ranging sphere wears (scene/models.js `sphere`), which is still what is drawn while this file is on its way; public #947", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh", licence: "Public domain (the two NASA photographs it was compared with); the shape is this project's, under this repository's licence", credit: "3D model: built by Space Radar from the published arrangement of LAGEOS's 426 retroreflectors and NASA photographs", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with: the ball, the rings of cube corners, the seam; A PHOTOGRAPH, on the ground", title: "LAGEOS-NASA", url: "https://commons.wikimedia.org/wiki/File:LAGEOS-NASA.jpg", origin: "https://images.nasa.gov/details/7667283", licence: "Public domain (NASA)", credit: "NASA", read: 2026-10-13}, {use: "compared with: LAGEOS 2 leaving Columbia's payload bay on STS-52; A PHOTOGRAPH", title: "Sts052-80-030 lrg", url: "https://commons.wikimedia.org/wiki/File:Sts052-80-030_lrg.jpg", licence: "Public domain (NASA)", credit: "NASA", read: 2026-10-13}], dimensions: {diameter_m: 0.60, cube_face_diameter_m: 0.0381, source: "D. Arnold, 'Transfer Function of the LAGEOS-2 Retroreflector Array', https://ilrs.dgfi.tum.de/docs/2022/Lageos-2.pdf, opened 2026-10-13: 'The LAGEOS-2 satellite is a sphere 60 cm in diameter with 426 uncoated circular cube corners 1.5 inches in diameter and 1.096 inches in length.' and 'There is one cube corner at each pole and 9 rings of cubes in each hemisphere.'; its Table 1.1 gives each ring's colatitude and count: 10.120 degrees 6, 19.850 12, 29.580 18, 39.310 23, 49.040 27, 58.770 31, 67.017 31, 76.747 32, 85.137 32, and one at the pole: 213 a hemisphere. The same counts in Wood, Otsubo and Sherwood, https://ilrs.cddis.eosdis.nasa.gov/lw13/docs/papers/target_wood_1m.pdf, opened 2026-10-13: 'successive rings have 32, 31, 31, 27, 23, 18, 12, 6, 1 (at the \"pole\") reflectors, giving a total of 213 in each hemisphere. 422 of the reflectors are made of fused silica and 4 of germanium.' eoPortal, https://www.eoportal.org/satellite-missions/lageos, opened 2026-10-13: 'LAGEOS-II is an identical S/C to LAGEOS-I.', which is why both wear this file. NOT CITED: the longitude each ring starts at", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. A ball of 796 even triangles and 426 flat discs of 14 sides, each ring at its published colatitude with its published count. DRAWN DIFFERENTLY FROM THE CRAFT, on purpose: each cube corner's face stands 1.5 mm PROUD of the ball, where the real ones are set about 2 mm INTO it at the bottom of a recess; a face is a flat dark disc, not a prism of fused silica; the four germanium cubes are drawn like the other 422; the bolted seam at the equator and the brass core inside are not drawn. The poles are on the file's Y axis. No mirror pass: the southern rings are built at their own latitudes, as the northern. Colours are this project's own flat ones (aluminium #C5CAD2, glass #27364A, which is named for the app's sharp glint), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 6 760 triangles, 2 colours"}
  - {id: ajisai, file: site/models/ajisai.glb, kb: 92, budget_tris: 13000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 16908 (AJISAI (EGS)), Japan's geodetic mirror ball, on the layer of bright satellites. It was the one plain ball every laser-ranging sphere wears, which is still what is drawn while this file is on its way; public #947", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh", licence: "No picture ships and none was traced: the only photographs found are JAXA's, which are not free and were looked at on the page named under `references`; the shape is this project's, under this repository's licence", credit: "3D model: built by Space Radar from the published counts of Ajisai's mirrors and retroreflectors", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT, NOT REPRODUCED: a photograph of the satellite before launch, for the look of the mirrors and the reflector panels. NOT FREE; nothing of it is in the file", title: "Ajisai (EGS), the ILRS mission page", url: "https://ilrs.gsfc.nasa.gov/missions/satellite_missions/current_missions/ajis_general.html", licence: "NOT FREE: the page credits its photographs 'Courtesy of JAXA'. The copy on Wikimedia Commons ('Ajisai Satellite.jpg') is tagged public domain as a NASA work, which this credit contradicts, so it is not relied on", credit: "JAXA, through the International Laser Ranging Service", read: 2026-10-13}], dimensions: {diameter_m: 2.15, mirror_max_side_m: 0.25, source: "eoPortal, https://www.eoportal.org/satellite-missions/egs, opened 2026-10-13: 'EGS is a passive spherical satellite of 2.15 m diameter and a mass of 685.2 kg, carrying 318 mirrors and 120 laser retroreflector assemblies (1436 corner cube reflectors)'. Kucharski et al., https://ilrs.gsfc.nasa.gov/lw15/docs/papers/Determination%20of%20AJISAI%20Spin%20Parameters%20using%20Graz%20kHz%20SLR%20Data.pdf, opened 2026-10-13: 'The LRR panels are almost uniformly distributed over the surface, arranged in 15 latitudinal rings [2]. There are 5 rings with 12 LRR's, 4 rings with 9 LRR's, 2 rings with 6 LRR's, and 4 rings with 3 LRR's each.' Kucharski et al. 2015 (Earth, Planets and Space, through https://web.archive.org/web/20230204033126/https://earth-planets-space.springeropen.com/articles/10.1186/s40623-015-0204-4), opened 2026-10-13: 'Each panel contains 12 CCRs except for the one mounted on the central ring - with 8 CCRs only.' Korobeynikova et al. 2012, https://oap.onu.edu.ua/article/download/83378/78950, opened 2026-10-13: '318 quasi-flat mirrors (spherical in fact - the radius of curvature of the mirrors is 8.4-8.7 m, and the size <= 0.25 m)' and 'In the literature we have not found information on the actual placement of the whole set of mirrors.' https://arxiv.org/html/2511.16780v1, opened 2026-10-13: 'a surface area of up to 393 cm2 each'. NOT CITED, AND OURS: which ring has how many panels, each ring's latitude, how many mirrors stand in each ring, each mirror's size, the cubes' 36 mm faces", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE COUNTS ARE THE PUBLISHED ONES AND THE PLACEMENT IS OURS, because nobody has published the placement: 318 mirrors, 120 reflector panels (119 of 12 cubes and one of 8: 1 436 cubes), the panels 12, 9, 6 or 3 to a ring in the published numbers of rings; but WHICH ring has which count, every ring's latitude (fifteen even bands of 12 degrees), how the panels are spaced round a ring (evenly), and the mirrors in each ring (36 on the equator, then 33, 30, 27, 21, 18, 12 and none toward each pole) are this project's arrangement. Each mirror is a flat tile 13 to 15 cm by 21.5 cm (280 to 310 cm2; the real ones are up to 393 cm2 and curved to a radius of 8.4 to 8.7 m, which over 20 cm is a tenth of a millimetre), its corners 7 mm proud of a ball of 796 even triangles; each cube is a flat hexagon 36 mm across. The poles are on the file's Y axis. No mirror pass: the southern rings are built at their own latitudes with the same counts as the northern. Colours are this project's own flat ones and illustrative: THE MIRRORS ARE THREE TONES OF SILVER (#E6EBF2, #C3CDDA, #A9B5C6) given tile by tile by a fixed scramble, because a mirror shows whatever it faces and one flat silver made the ball look painted; they are named for the app's sharp glint; panel #3B4250; cube #7FA6C4; the ball between the tiles #7C8594. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 12 358 triangles, 6 colours"}
  - {id: soyuz-ms, file: site/models/soyuz-ms.glb, kb: 59, budget_tris: 10500, class: station, kind: built-from-dimensions, used_for: "any record on the stations layer whose name has the word SOYUZ (today SOYUZ-MS 29): Russia's crewed ship. It was, and while this file is on its way still is, the procedural Soyuz (scene/models.js `soyuz`: a ball, a cone and a drum from the same metres); public #939", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh", licence: "Public domain (the NASA photograph and the two NASA drawings it was drawn from); the shape is this project's, under this repository's licence", credit: "3D model: built by Space Radar from published dimensions, a NASA photograph and NASA drawings of the Soyuz", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with: the whole ship side-on, its colours, the radiator's bands; A PHOTOGRAPH", title: "Soyuz MS-19 Spacecraft departs the ISS (iss067e000259)", url: "https://commons.wikimedia.org/wiki/File:Soyuz_MS-19_Spacecraft_departs_the_ISS_(iss067e000259).jpg", licence: "Public domain (NASA Johnson Space Center)", credit: "NASA", read: 2026-10-13}, {use: "drawn from: the profile of the three modules between the cited diameters; A DRAWING of the Soyuz TM, the same outer mould line, with no dimensions on it", title: "Soyuz-TM drawing", url: "https://commons.wikimedia.org/wiki/File:Soyuz-TM_drawing.svg", licence: "Public domain (NASA Reference Publication 1357, figure 1-30)", credit: "NASA", read: 2026-10-13}, {use: "drawn from: the same profile in a cutaway of the Soyuz TMA; A DRAWING, with no dimensions on it", title: "Drawing-Soyuz-TMA-exp12", url: "https://commons.wikimedia.org/wiki/File:Drawing-Soyuz-TMA-exp12.png", licence: "Public domain (NASA)", credit: "NASA", read: 2026-10-13}], dimensions: {length_m: 7.48, skirt_diameter_m: 2.72, span_m: 10.7, orbital_module_diameter_m: 2.26, descent_module_diameter_m: 2.17, source: "NASA, 'Reference Guide to the International Space Station' (NP-2015-05-022-JSC), page 66, https://www.nasa.gov/wp-content/uploads/2017/09/np-2015-05-022-jsc-iss-guide-2015-update-111015-508c.pdf, opened 2026-10-13: 'Length 7 m (22.9 ft)', 'Maximum diameter 2.7 m (8.9 ft)', 'Diameter of habitable modules 2.2 m (7.2 ft)', 'Solar array span 10.6 m (34.8 ft)'; NASA gives no length a module. The modules: https://en.wikipedia.org/wiki/Soyuz_(spacecraft), the specifications table's column 'Soyuz MS (2016-present)', opened 2026-10-13: 7.48 m long, 2.72 m across, span 10.7 m; orbital module 2.98 m by 2.26 m, reentry module 2.24 m by 2.17 m, service module 2.26 m by 2.72 m. THE TWO DISAGREE (7 m and 10.6 m against 7.48 m and 10.7 m): Wikipedia's are built, because its module lengths add up to its total and the procedural Soyuz already used them. NOT CITED: the curve of each module between those numbers (read off NASA's two drawings), the wings' 1.4 m width and four panels a side, every antenna, the windows", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE HULL IS ONE LATHE: 36 points of [distance from the probe's tip, radius] turned round the long axis in 36 sides and cut into ten coloured bands: probe, docking collar, orbital module (a ball 2.26 m across with a short straight band), joint, descent module (a bell from 1.2 m to the cited 2.17 m), heat shield, transition frame, radiator drum (2.2 m), skirt (flaring to the cited 2.72 m), engine bay. Built on it in code: two dark bands round the radiator, a window on the orbital module and one on the descent module, the periscope, the Kurs dish on its boom and two antennas on booms from the service module, four thruster clusters, an engine nozzle, and the wings: 4.1 x 1.4 m, four panels of 2 by 4 cells, tips 5.35 m from the axis (half the cited span); the right wing with its hinge and tip antenna IS A MIRROR IMAGE of the left across the plane x = 0. SIMPLIFIED: the antennas are a handful where the ship has a dozen, the thermal blanket is one flat colour, the wings are flat boards. Axes: nose at +Z (the app's Earth face, as the procedural Soyuz has it), wings along X, cells toward +Y. Colours are this project's own flat ones, read off the photograph: blanket #5E645B and #6F746C, radiator #E6EAF0, cells #26324F, wing backs #9A8F7C; illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 9 808 triangles, 9 colours. RE-BAKED 2026-10-13 (batch three): the first file had ONE of the two radiator bands and ONE of the two antenna heads, because the tool kept one part a name; both are in this one"}
  - {id: progress-ms, file: site/models/progress-ms.glb, kb: 64, budget_tris: 11500, class: station, kind: built-from-dimensions, used_for: "any record on the stations layer whose name has the word PROGRESS (today PROGRESS-MS 34 and PROGRESS-MS 35): Russia's cargo craft. It was, and while this file is on its way still is, the procedural Progress (scene/models.js `progress`: a stack of drums from the same metres); public #940", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh", licence: "Public domain (the two NASA photographs and the NASA drawing it was drawn from); the shape is this project's, under this repository's licence", credit: "3D model: built by Space Radar from published dimensions, NASA photographs and a NASA drawing of the Progress", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with: the whole craft sunlit, its colours (a silver-grey blanket, a white instrument section), the wings; A PHOTOGRAPH", title: "The Progress 94 cargo spacecraft from Roscosmos (iss074e0395778)", url: "https://commons.wikimedia.org/wiki/File:The_Progress_94_cargo_spacecraft_from_Roscosmos_(iss074e0395778).jpg", licence: "Public domain (NASA Johnson Space Center)", credit: "NASA Johnson Space Center", read: 2026-10-13}, {use: "compared with: the craft on approach, nose-on; A PHOTOGRAPH", title: "Progress MS-17 approaches the ISS (1)", url: "https://commons.wikimedia.org/wiki/File:Progress_MS-17_approaches_the_ISS_(1).jpg", licence: "Public domain (NASA)", credit: "NASA", read: 2026-10-13}, {use: "drawn from: which section is where and its outline; A DRAWING, with no dimensions on it", title: "Progress drawing", url: "https://commons.wikimedia.org/wiki/File:Progress_drawing.svg", licence: "Public domain (NASA)", credit: "NASA", read: 2026-10-13}], dimensions: {length_m: 7.4, skirt_diameter_m: 2.72, span_m: 10.7, cargo_module_diameter_m: 2.2, source: "NASA, 'Reference Guide to the International Space Station' (NP-2015-05-022-JSC), page 67, https://www.nasa.gov/wp-content/uploads/2017/09/np-2015-05-022-jsc-iss-guide-2015-update-111015-508c.pdf, opened 2026-10-13: 'Length 7.4 m (24.3 ft)', 'Maximum diameter 2.7 m (8.9 ft)', 'Span with solar arrays 10.7 m (35.1 ft)'; its drawing names the three sections 'Cargo Module', 'Refueling Module', 'Pressurized Instrumentation Section' and gives no size for any. Wikipedia, https://en.wikipedia.org/wiki/Progress_MS, opened 2026-10-13: length 7.4 m, span 10.7 m, diameter 2.7 m; 'Tanker section: Replacing the Soyuz reentry module, this unpressurized compartment houses tanks'; the instrumentation and propulsion section is 'slightly elongated'. https://en.wikipedia.org/wiki/Progress_(spacecraft), opened 2026-10-13, for the earlier Progress M: 'Length: 7.23 m', 'Diameter of cargo modules: 2.2 m', 'Maximum diameter: 2.72 m', 'Solar array span: 10.6 m'. THE TWO LENGTHS DISAGREE (7.4 m and 7.23 m); NASA's 7.4 m is built, with the probe. NOT CITED: how the 7.4 m is shared between the three sections, the refuelling module's shape and diameter (no source states them; read off NASA's drawing and photographs as a drum a little narrower than the cargo module with a waist at the joint), the wings' 1.4 m width and four panels a side, every antenna", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE SOYUZ'S SIBLING (row `soyuz-ms`): the same lathe, 31 points of [distance from the probe's tip, radius] turned in 36 sides and cut into nine bands: probe, docking collar, cargo module (a dome, a 2.2 m drum, a taper), a waist, the refuelling module (a 2.12 m drum, where the Soyuz has its bell), transition frame, radiator drum, skirt (flaring to the cited 2.72 m), engine bay. Built on it in code: two dark bands round the radiator and two pale frames round the refuelling module, the Kurs dish on its boom, two antennas on booms, four thruster clusters, an engine nozzle, and the wings: 4.1 x 1.4 m, four panels of 2 by 4 cells, tips 5.35 m from the axis (half the cited span); the right wing with its hinge and tip antenna IS A MIRROR IMAGE of the left across the plane x = 0. NO periscope and NO window: it carries no crew. SIMPLIFIED: the refuelling module's shape is read off a drawing with no dimensions; the antennas are a handful; the blanket is two flat greys; no lettering is drawn (the craft carries its name in red). Axes: nose at +Z (the app's Earth face, as the procedural shape has it), wings along X, cells toward +Y. Colours are this project's own flat ones, read off the photographs: blanket #A4A9AE and #8B9095, radiator #E6EAF0, cells #26324F, wing backs #9A8F7C; illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 10 720 triangles, 10 colours"}
  - {id: dragon-crew, file: site/models/dragon-crew.glb, kb: 53, budget_tris: 9000, class: station, kind: built-from-dimensions, used_for: "any record on the stations layer whose name has the words CREW DRAGON (today CREW DRAGON 13): SpaceX's crewed Dragon 2. It was, and while this file is on its way still is, the procedural Dragon (scene/models.js `dragon`: a cone on a drum with four boxes); public #937", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh", licence: "Public domain (the NASA photographs it was compared with); the shape is this project's, under this repository's licence. NO LOGO AND NO LETTERING is on the mesh: the craft's maker's marks, NASA's insignia and the flag the photographs show are not drawn", credit: "3D model: built by Space Radar from published dimensions and NASA photographs of the Crew Dragon", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with: the capsule and trunk three-quarter on, the open nose cone, the cells on half the trunk, the fins; A PHOTOGRAPH", title: "Iss058e027464 The uncrewed SpaceX Crew Dragon spacecraft on approach to the station's Harmony module", url: "https://commons.wikimedia.org/wiki/File:Iss058e027464_The_uncrewed_SpaceX_Crew_Dragon_spacecraft_on_approach_to_the_station%27s_Harmony_module.jpg", licence: "Public domain (NASA)", credit: "NASA", read: 2026-10-13}, {use: "compared with: the craft leaving the station; A PHOTOGRAPH", title: "The SpaceX Crew Dragon Endeavour departs the International Space Station 04", url: "https://commons.wikimedia.org/wiki/File:The_SpaceX_Crew_Dragon_Endeavour_departs_the_International_Space_Station_04.jpg", licence: "Public domain (NASA/Mark T. Vande Hei)", credit: "NASA/Mark T. Vande Hei", read: 2026-10-13}, {use: "compared with: the docking port, the red seal ring, the forward thrusters, the nose cone's inside; A PHOTOGRAPH", title: "The SpaceX Crew Dragon as it approached the International Space Station (iss063e021563)", url: "https://commons.wikimedia.org/wiki/File:The_SpaceX_Crew_Dragon_as_it_approached_the_International_Space_Station_(iss063e021563).jpg", licence: "Public domain (NASA/Chris Cassidy)", credit: "NASA/Chris Cassidy", read: 2026-10-13}], dimensions: {height_with_trunk_m: 8.1, diameter_m: 4.0, trunk_diameter_m: 3.7, source: "SpaceX, https://www.spacex.com/vehicles/dragon/ (the page is drawn by script; its data file https://www.spacex.com/3850.6a270eb20a4c2080.js was opened 2026-10-13): 'Height' '8.1m' '/ 26.7 ft', 'Diameter' '4 m' '/ 13 ft', 'The Dragon spacecraft is equipped with 16 Draco thrusters', 'One half of the trunk is covered in solar panels'. SPACEX DISAGREES WITH ITSELF: its Falcon 9 page's data file (https://www.spacex.com/2343.25ddd7bb77e7b318.js, opened the same day) gives Dragon 'Diameter' '3.7 m' '/ 12 ft'; read here as 4 m at the capsule's base and 3.7 m for the trunk, which neither sentence says. Wikipedia, https://en.wikipedia.org/wiki/SpaceX_Dragon_2, infobox, opened 2026-10-13: '4.5 m capsule only', '8.1 m capsule with trunk', diameter '4 m', width '3.7 m'; and 'The spacecraft's nose cone protects the docking port and four forward-facing thrusters during ascent and reentry. This component pivots open for in-space operations.'; 'eight SuperDraco engines arranged in four redundant pairs'. NO NASA PAGE WITH DIMENSIONS WAS FOUND. NOT CITED: the sidewall's 15 degrees (published for the first Dragon only; kept), the nose cone's 1.05 m, how the 8.1 m is shared (3.7 m of trunk is built, 4.4 m of capsule with its nose closed), the pods' size, the fins' size, the windows", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired (the mesh an image-to-3D model generated for this craft on 2026-10-12 was judged a lump and is not used). THE CAPSULE IS ONE LATHE: 11 points from the heat shield's rim (3.66 m, on the trunk) through the shoulder (the cited 4 m) up a 15 degree sidewall to the forward bulkhead, and the docking port on it, turned in 44 sides. Built on it in code: the NOSE CONE OPEN, as it is on orbit: a shell 2.39 m across and 1.05 m deep swung 100 degrees on a hinge at the bulkhead's rim, its inside a darker grey; a thin red ring round the docking face; four forward thruster ports; FOUR ENGINE PODS as tapered bulges on the sidewall, each with two dark SuperDraco exits and three Draco ports (16 Dracos are cited; 16 are drawn, four of them forward); two windows. THE TRUNK: 3.7 m long and 3.66 m across, HOLLOW, as the craft's is: an inner wall 1.4 m deep and a dark floor; on the half toward +Y a shell of 6 by 4 dark cell tiles, on the other half six radiator panels; four fins, the one in the middle of the cells dark like them. No mirror pass: the pods and ports are the same part copied four times round the axis. SIMPLIFIED OR NOT CITED: the sidewall's angle, the nose cone's depth, the pods' size and shape, how many windows and where, the fins' outline (plain trapezoids), the docking mechanism (three rings). Axes: nose at +Z (the app's Earth face, as the procedural Dragon has it), the trunk at -Z, the cells toward +Y. Colours are this project's own flat ones, read off the photographs: hull #EEF1F5, heat shield's rim #2B2E33, cells #1B2233, radiators #F4F6F9, the seal ring #B5483A; illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 8 268 triangles, 12 colours"}
