lectors made from Fused silica Corning 7980. Each cube measures: height=19.05 +/- 0.25 mm, diameter=25.4 mm.' THE PAGE DISAGREES WITH ITSELF: its text also says 'cavities machined on the sphere of diameter 0.212 meters'; the table's radius of 212 mm (424 mm across) is built. THE PLACEMENT IS NOT READ: the coordinates of each cube are published as a scanned table, https://ilrs.gsfc.nasa.gov/docs/2025/CoordinatesOfLARES_2_CCRs.pdf, which was downloaded and could not be read by machine; the 303 are drawn in fifteen even rings, which is OURS", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. A ball of 796 even triangles 424 mm across and 303 flat discs 25.4 mm across. THE COUNT AND THE SIZES ARE PUBLISHED AND THE PLACEMENT IS OURS: fifteen rings 12 degrees apart, 31 on the equator, then 31, 29, 26, 21, 16, 10 and 3 toward each pole. The real coordinates are published as a scanned table that was not read. DRAWN DIFFERENTLY FROM THE CRAFT: each face stands proud where the real ones are recessed. The poles are on the file's Y axis. No mirror pass. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 5 038 triangles, 2 colours"}
