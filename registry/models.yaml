generated, so nothing was repaired. THE STACK, 6.3 m tall (cited), split OURS as 2.0 m of MTM, 2.2 m of MPO and 2.1 m of sunshield. THE MTM: a white box 3.6 x 3.4 x 2.0 m inside the cited 3.9 x 3.6 m (OURS), in white high-temperature blanket (cited), its four ion thrusters (cited, 22 cm across) and the cone below; ITS TWO WINGS of five panels each (counted on Benkhoff et al.'s figure), 2.4 x 1.75 m a panel (DERIVED: the cited 42 m2 over ten) from a 1.3 m yoke, 30.1 m tip to tip (cited: '~30 m'), frame lines dark. THE MPO: a silver box 2.2 x 1.7 x 2.2 m (the cited 2.4 m drawn as 2.2 to keep the cited 6.3 m stack), its white radiator plate (cited: 3.7 m) on the -Y face rising beside the sunshield; the 1.1 m steerable dish (cited) on an arm, the medium-gain antenna and the 2.5 m magnetometer boom (cited), their pointing OURS; ITS OWN WING of three panels, single-sided (cited), 6.6 m of panels on a 0.9 m arm, 7.5 m in all (cited), frame lines white for its mirrors. THE SUNSHIELD (MOSIF): an open cone 2.1 m tall (OURS) opening at the cited 16 degrees, white outside and silver inside (a shell drawn on both faces). MIO in it: an octagon 1.8 m across its corners and 1.1 m high (cited), cells on its upper side and mirrors below (cited: 70 % cells above). AS DRAWN: the stack along Y (the sunshield up), the wings along X with their cells to +Z, the MPO's radiator to -Z and its dish to +Z; the MPO's wing on -X. The app points +Z at the centre of the stage (the Sun in the Solar System's view), so the cells face the Sun and the radiator faces away, with the Sun to the side of the stack: our reading of how it cruises. The real stack points its thrusters along each burn and turns its wings off the Sun to keep them cool (cited); neither is drawn. No mirror pass: the second MTM wing is a placed part. Colours are this project's own flat ones in the app's roles (cells the app's panel blue #2E4E8C; blankets, dishes and frames read off the pictures named). Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 332 triangles, 6 colours"}
