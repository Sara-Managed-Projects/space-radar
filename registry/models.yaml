  - {id: shenzhou-orbital, file: site/models/shenzhou-orbital.glb, kb: 36, budget_tris: 4000, class: station, kind: built-from-dimensions, origin: built, used_for: "NORAD 66515, 67481 and 69328 (SZ-21 MODULE, SZ-20 MODULE, SZ-22 MODULE in the live saved data of 2026-10-20), by id: the orbital module each Shenzhou crew leaves in orbit when it goes home. They were the generic satellite; public #1089", source: "built by this project in code (tools of release 1.3.0 stage W1-a), from the orbital module's part of the lathe profile of the row `shenzhou` (the cited metres) and the pictures under `references`; no image-to-3D model was used, and no published mesh", licence: "CC BY 4.0 (China News Service's stills of Shenzhou 21 arriving at the station, which the front's details were read off: looked at, with credit; nothing of them is in the file); the shape is this project's, under this repository's licence. NO LETTERING is on the mesh: the white plate where the flight's number is painted is plain", credit: "3D model: built by Space Radar from published dimensions and stills by China News Service (CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; Shenzhou 21's orbital module arriving at the station, seen from the station: its front dome in quilted grey cloth, the docking mechanism, the rendezvous cameras and antennas on the dome, the white plate with the flight's number", title: "Shenzhou 21 docking with CSS view from CSS 02", url: "https://commons.wikimedia.org/wiki/File:Shenzhou_21_docking_with_CSS_view_from_CSS_02.png", licence: "CC BY 4.0 (Commons' LicenseShortName, read 2026-10-20)", credit: "China News Service (中国新闻社)", read: 2026-10-20}, {use: "drawn from; the docking mechanism as the station's hatch camera sees it: the guide ring, three petals, the hatch", title: "Shenzhou 21 docking with CSS view from docking hatch 01", url: "https://commons.wikimedia.org/wiki/File:Shenzhou_21_docking_with_CSS_view_from_docking_hatch_01.png", licence: "CC BY 4.0 (Commons' LicenseShortName, read 2026-10-20)", credit: "China News Service (中国新闻社)", read: 2026-10-20}], dimensions: {length_m: 2.8, diameter_m: 2.25, source: "Wikipedia, https://en.wikipedia.org/wiki/Shenzhou_(spacecraft), as quoted in the row `shenzhou` (opened 2026-10-13): orbital module 'Length 2.8 m / Diameter 2.25 m'; since Shenzhou 8 'the orbital module in front carries no solar wings' (zh.wikipedia caption quoted there). The docking mechanism's 0.75 m and the curve of the dome are the row `shenzhou`'s, not cited", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. The orbital module's part of shenzhou.glb's lathe (the docking mechanism, the domed front, the 2.25 m drum, the aft taper, the joint) as bands of quilted tiles in four light greys (the cloth in the stills), with the station's docking mechanism in front, three rendezvous camera boxes and three antennas on the dome, the plate for the flight's number, the side hatch, a window and a few small boxes, and at its aft end the joint where it held the re-entry module, a grey separation face with its hatch. No wings (since Shenzhou 8). Nose at +Z; not turned to the app's axes (it flies uncontrolled). No mirror pass. 3 080 triangles, 11 colours of this project's own; welded, normals with a 40 degree crease, meshopt"}
