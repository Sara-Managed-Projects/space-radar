 both): 'Dimensions (m)' '2.1 x 2.0 x 2.1'; 'Span including solar arrays (m)' '11.4'; 'Primary Contractors' 'Lockheed Martin'; its text: 'they were based on the commercial AS-4000 bus'; 'UHF channel is used for cross-links between spacecraft'. Air & Space Forces Magazine, https://www.airandspaceforces.com/weapons-platforms/gps/, OPENED 2026-10-13: '(IIR/IIR-M) 5 x 6.3 x 6.25 ft, span incl solar panels 38 ft' (38 ft is 11.6 m: the span agrees within 0.2 m; its body is 1.5 x 1.9 x 1.9 m, smaller than eoPortal's, and eoPortal's is built). Lockheed Martin, 'GPS Block IIR and IIR-M Antenna Panel Pattern' (W. Marquis, 2014; published by the US Coast Guard Navigation Center, https://www.navcen.uscg.gov/sites/default/files/pdf/gps/GPS_Block_IIR_IIR_M_Antenna_Panel_Pattern_Marquis_Aug2015_revised.pdf, OPENED 2026-10-13), slide 6, 'GPS Block IIR Legacy Antenna': 'Used on first 8 of 12 IIR SVs'; '8 helix elements in circle with 4 elements in the center'; '12-way power divider and beam forming network'; slide 7, 'GPS Block IIR Improved Antenna': 'Used on final 4 of 12 IIR SVs, and all 8 IIR-M SVs'; 'New element designs and configurations on the panel'. The Navigation Center's page, https://www.navcen.uscg.gov/node/599, OPENED 2026-10-13: 'This is the Earth-facing panel providing the GPS L-band broadcast signal. The improved antenna panel includes redesigned L-band elements mounted on the SV Earth-facing structure in the same manner as the original legacy antenna panel.' THE FILE DRAWS THE LEGACY PANEL (eight round a middle four) for all twenty; the improved panel's own layout is in Lockheed's photograph, which is theirs and was not copied. NOT CITED, read off the government's painting: two panels a wing, the wing's width (1.75 m) and its yoke, the orange foil and the grey radiator windows, that the eight outer helices are fat and the four inner ones slender, the dark horn at the deck's corner, and the two lattice antennas on booms across the wing axis (TAKEN TO BE the UHF crosslink antennas: no page opened names them), whose size is the painting's.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 2.0 x 2.1 x 2.1 m in copper-orange foil with grey radiator windows and an apogee nozzle on the far side. THE EARTH FACE: eight fat helices banded red and white in a circle round four slender ones (Lockheed Martin's words for the legacy panel; the improved panel of the later twelve craft has other elements in the same places and is NOT drawn apart). A dark horn at the deck's corner. Two lattice antennas on 2.2 m booms across the wing axis, their rods 4 cm thick so that they are lines and not a haze. Two wings of two panels, 11.4 m tip to tip. THE WEST WING IS A MIRROR IMAGE of the east one and the second lattice antenna of the first. SIMPLIFIED OR NOT CITED: see `dimensions`. ONE SHAPE FOR IIR AND IIR-M, whose bus and size are the same (eoPortal's table gives both the same numbers). Axes, so the route says `axes: 'app'`: the antenna face to +Z (the Earth), the wings along X, the cells to +Y. AS IT FLIES, in part: the real craft keeps its antenna on the Earth and its wing axis square to the Sun, which is the app's rule too; it also turns each wing on its axis to face the Sun, which the app does not, so the file's cells face the Sun's side of the sky. Colours are this project's own flat ones (foil #B5673A, helix bands #B8553F and #E6EAF0, cells #26324F), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 8 768 triangles, 11 colours"}
