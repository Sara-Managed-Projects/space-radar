  - {id: change-5, file: site/models/change-5.glb, kb: 118, budget_tris: 16000, class: site, kind: built-from-dimensions, used_for: "the change-5 and change-6 landing sites (registry/sites.yaml), Oceanus Procellarum and the Apollo basin: the Chang'e 5 sample-return lander as it stands now, the ascender gone from its seat, the arm raised, the drill's column, the flag on its boom. Chang'e 6's lander is the same design (its small foreign payloads are not drawn). Each was the generic lander, which is still what is drawn while this file is on its way; public #1126", source: "built by this project in code (release 1.3.0 stage W3-c's scripts, one a craft, on W1-c's part library, kept with the stage's notes), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (CNSA publishes none under terms that allow a derivative, and NASA's 3D Resources and NASA Science's 3D models have none of these craft; read 2026-10-20)", licence: "CC BY 4.0 (China News Service's pictures of the flight lander in test and its rendering of the flag on the deck): looked at, with credit; nothing of them is in the file. The full-size mock-ups' photographs are CC BY-SA 4.0 and were looked at only. The shape is this project's, under this repository's licence, built from published numbers (facts).", credit: "3D model: built by Space Radar from published dimensions and pictures (China News Service, CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with; China's rendering of the lander on the Moon (not a photograph): the silver deck blanket, the flag on its boom, the thruster, the camera", title: "Chang-e-5-Lander-Flag", url: "https://commons.wikimedia.org/wiki/File:Chang-e-5-Lander-Flag.png", licence: "CC BY 4.0 (China News Service; Commons' LicenseShortName, read 2026-10-20)", credit: "China News Service", read: 2026-10-20}, {use: "drawn from; the flight lander and ascender stacked in the test hall: the gold legs, the gold blankets, the dark panes and the drill's column", title: "Chang-e 5 assembly factory test 1", url: "https://commons.wikimedia.org/wiki/File:Chang-e_5_assembly_factory_test_1.png", licence: "CC BY 4.0 (China News Service; Commons' LicenseShortName, read 2026-10-20)", credit: "China News Service", read: 2026-10-20}, {use: "drawn from; the lander and ascender from above in the test chamber: the deck, the copper drill column, the arm stowed", title: "Chang-e 5 lander ascender assembly test", url: "https://commons.wikimedia.org/wiki/File:Chang-e_5_lander_ascender_assembly_test.png", licence: "CC BY 4.0 (China News Service; Commons' LicenseShortName, read 2026-10-20)", credit: "China News Service", read: 2026-10-20}, {use: "LOOKED AT ONLY (share-alike; nothing traced, nothing in the file); the full-size mock-up: the arm raised in an A, the two arrays at the deck, the ascender's seat of struts", title: "Chang'e-5 mockup at CSTM 01", url: "https://commons.wikimedia.org/wiki/File:Chang%27e-5_mockup_at_CSTM_01.jpg", licence: "CC BY-SA 4.0 (Shujianyang; Commons' LicenseShortName, read 2026-10-20)", credit: "Shujianyang", read: 2026-10-20}], dimensions: {span_m: 4.76, body_above_ground_m: 0.83, drill_string_m: 2.5, source: "eoPortal, 'Chang'e-5', https://www.eoportal.org/satellite-missions/chang-e-5, OPENED 2026-10-20: 'The Chang'e-5 lander in its structure is identical to the Chang'e-3 lander' (except the ascender's fittings and the sampling gear), so the Chang'e 3 numbers hold: eoPortal, 'Chang'e-3': 'a vehicle span of 4.76 m', 'the lander body rests 0.83 m above the ground'. Chang'e-5: 'two solar arrays that can be opened and closed on command'; 'a four-degree of freedom robotic arm'; 'The end effector of the arm includes a scoop'; 'a coring drill'; 'The Ascent vehicle resides on the top deck of the lander using structural attachments'; 'the first free-standing Chinese national flag'. zh.wikipedia, '嫦娥五号', OPENED 2026-10-20: '着上组合体背后用于容纳2.5米长钻杆的圆柱体结构' (the cylinder on the back of the stack that holds the 2.5 m drill string). OURS: the arrays 2 x 1.25 x 1.05 m a side flat at the deck, the seat's ring 1.44 m across and 0.5 m tall, the arm's 2.1 and 2.7 m booms, the drill column 2.16 m, the flag's 0.6 x 0.4 m", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BODY, LEGS, ENGINE AND THRUSTER PODS are the Chang'e 3 lander's (cited: identical structure), the legs gold-wrapped as the test pictures show. THE ASCENDER IS GONE (it left in December 2020): its SEAT on the deck is drawn, a ring of V struts and its top ring, empty, the shroud where its engine fired and the transfer arm's base (cited: structural attachments, an arm). TWO ARRAYS flat at the deck (cited: two). THE DRILL'S COLUMN up the back face (cited: the 2.5 m drill string's cylinder). THE ARM (cited: four degrees of freedom, a scoop) raised as the mock-ups show it, its scoop held out past the -X face: where it was left is not published. THE FLAG on its boom (cited: free-standing). The panoramic camera, the dish, a whip, dark radiator panes and black brackets on the faces. No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body): blankets as rumpled sheets with patches a shade lighter and darker and taped seams, so they are not flat slabs. Written by W1-c's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, normals creased at 40 degrees and the blankets' at 12 so their folds show, meshopt), with nothing resampled or decimated. 15317 triangles, 118 kB."}
