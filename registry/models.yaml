  - {id: worldview-3, file: site/models/worldview-3.glb, kb: 109, budget_tris: 15000, look: pbr, class: satellite, kind: built-from-dimensions, used_for: "NORAD 40115, WorldView-3, the Maxar (DigitalGlobe) 30 cm imager launched in August 2014, on Ball's BCP 5000 bus: a hexagonal telescope barrel under the bus with the aperture to the Earth, the bus above it with two wings of three panels. It wore the class shape of a satellite, a box with two wings; public #976. NOT WorldView-1, -2, GeoEye-1 or Legion: WorldView-1 and -2 share the bus but not the height (3.6 and 4.3 m against 5.7 m) and no drawing gives where the barrel ends, so they are not routed; GeoEye-1 is on the SA-200HP bus (4.35 x 2.7 m stowed, 1 955 kg) and Legion on Maxar's 500 series (750 kg): other buses", source: "built by this project in code (release 1.3.0's part library, lib.py and parts.py, kept with the stage's notes in ~/space-radar-handoff/release-1.4/r14-m5/build, one script a craft), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh: NASA's 3D Resources (1 583 paths, read 2026-10-27) has none of this craft, and no operator of it was found to publish a model under a free licence (searched 2026-10-27)", licence: "No operator picture or model is in the file: the pictures named `LOOKED AT ONLY` were looked at for the layout and are on no sheet. The shape is this project's, under this repository's licence, built from published numbers (facts). NO LOGO, FLAG OR LETTERING is on the mesh.", credit: "3D model: built by Space Radar from eoPortal's published dimensions; compared with the operator's pictures, looked at only", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT ONLY (the operator's own picture on eoPortal; not free, nothing of it in the file): the layout: the hexagonal barrel, the bus on top, the wings of three panels, the two dishes on arms at the Earth end", title: "Artist's rendition of the deployed WorldView-3 (eoPortal figure 1)", url: "https://www.eoportal.org/satellite-missions/worldview-3", licence: "looked at only; not free", credit: "DigitalGlobe", read: 2026-10-27}, {use: "LOOKED AT ONLY (the operator's own picture on eoPortal; not free, nothing of it in the file): the barrel's panels and the aperture end cover, the bus equipment and the CAVIS baffles on the junction", title: "WorldView-3 during assembly, integration and test (eoPortal figure 3)", url: "https://www.eoportal.org/satellite-missions/worldview-3", licence: "looked at only; not free", credit: "BATC", read: 2026-10-27}, {use: "LOOKED AT ONLY (the operator's own picture on eoPortal; not free, nothing of it in the file): the wings stowed against the bus, cells with their red edging and hold-down pads, the silver-wrapped barrel", title: "WorldView-3 at BATC before shipment (eoPortal figure 4)", url: "https://www.eoportal.org/satellite-missions/worldview-3", licence: "looked at only; not free", credit: "BATC", read: 2026-10-27}, {use: "LOOKED AT ONLY (the operator's own picture on eoPortal; not free, nothing of it in the file): the control moment gyroscope box with its yellow-gold walls", title: "A control moment gyroscope into WorldView-3 (eoPortal figure 2)", url: "https://www.eoportal.org/satellite-missions/worldview-3", licence: "looked at only; not free", credit: "BATC", read: 2026-10-27}], dimensions: {height_m: 5.7, width_m: 2.5, span_m: 7.1, aperture_m: 1.1, mass_kg: 2812, source: "eoPortal, https://www.eoportal.org/satellite-missions/worldview-3, OPENED 2026-10-27: 'Spacecraft size: 5.7 m tall x 2.5 m across; 7.1 m across with the solar panels deployed', 'Spacecraft mass: 2812 kg', 'The telescope primary mirror features an aperture diameter of 110 cm', 'The BCP 5000 bus', actuators 'CMGs (Control Moment Gyros)', sensors 'Star trackers (Ball CT-602)'; the CAVIS imager 'has standalone optics'. WorldView-1 (3.6 m x 2.5 m) and WorldView-2 (4.3 m x 2.5 m, 'identical bus to WV-1') are on eoPortal's pages for them. OURS: the split of the 5.7 m between bus (2.4 m) and barrel, the hexagonal barrel and the eight-sided bus, the wings' panel sizes (three of about 2.2 x 0.68 m, laid out as the artist's picture shows), every instrument's size and place, the dish arms, the colours", read: 2026-10-27}, modified: "nothing was generated, so nothing was repaired. THE BARREL (Earth end, +Z): six faces of khaki blanket with taped seams and straps, corner posts, an open hexagonal aperture end with a black baffle tube with vanes, the secondary mirror on its spider and the primary below. THE JUNCTION: a plate with its rim, bolts and gussets under a gold foil skirt, the two white CAVIS baffled cameras with vanes, two gimballed dishes on two-link arms. THE BUS: eight sides of black blanket in silver frames with equipment boxes, ribbed radiators and a ladder; on the top deck two star trackers with vanes, an equipment tower with gold tops, the GPS patch and whip. THE WINGS: a drive and yoke each side, three panels of 128 cells each in alternating shades, hinges and hold-down pads, grey backs. The app's axes: the Earth face +Z, the wings along X, the cells toward +Y. Drawn physically based on tier 1 and up (`look: pbr`) and on the toon ramp on phones. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, 14 colours at most, meshopt), nothing resampled or decimated. 13 730 triangles, 109 kB. The picture's tan barrel and the assembly photograph's black one disagree: the khaki is a compromise. The wings' direction (panels long in X) is read from the one artist's picture."}
  - {id: blacksky-gen2, file: site/models/blacksky-gen2.glb, kb: 57, budget_tris: 7000, look: pbr, class: satellite, kind: built-from-dimensions, used_for: "the BlackSky Global imagers of the first and second generation, 55 to 60 kg, on a bus derived from SENTRY-4000 with the SV-24 telescope, 11 in the live saved data of 2026-10-12: NORAD 43812, 44499, 47971, 49469, 49772, 49773, 49949, 49950, 52196, 55982, 55983 (Global-2, -4, -9, -14, -12, -13, -17, -16, -18, -19, -5). It wore the class shape of a satellite; public #1148. NOT the Gen-3 craft (Global-31, -32, -33, -34, -36: NORAD 63027, 64231, 66554, 68098, 100682): eoPortal gives no size and no picture of them, and a different design must not wear this file", source: "built by this project in code (release 1.3.0's part library, lib.py and parts.py, kept with the stage's notes in ~/space-radar-handoff/release-1.4/r14-m5/build, one script a craft), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh: NASA's 3D Resources (1 583 paths, read 2026-10-27) has none of this craft, and no operator of it was found to publish a model under a free licence (searched 2026-10-27)", licence: "No operator picture or model is in the file: the pictures named `LOOKED AT ONLY` were looked at for the layout and are on no sheet. The shape is this project's, under this repository's licence, built from published numbers (facts). NO LOGO, FLAG OR LETTERING is on the mesh.", credit: "3D model: built by Space Radar from eoPortal's published dimensions; compared with the operator's pictures, looked at only", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT ONLY (the operator's own picture on eoPortal; not free, nothing of it in the file): the layout: a boxy body, the telescope aperture on one end, two flat wings on hinge arms, a small dish on a stalk", title: "Artist's rendition of the BlackSky constellation (eoPortal figure 1)", url: "https://www.eoportal.org/satellite-missions/blacksky-constellation", licence: "looked at only; not free", credit: "BlackSky Global", read: 2026-10-27}, {use: "LOOKED AT ONLY (the operator's own picture on eoPortal; not free, nothing of it in the file): the artist concepts of the satellites", title: "BlackSky satellites artist concept (eoPortal figure 18)", url: "https://www.eoportal.org/satellite-missions/blacksky-constellation", licence: "looked at only; not free", credit: "BlackSky", read: 2026-10-27}, {use: "LOOKED AT ONLY (the operator's own picture on eoPortal; not free, nothing of it in the file): the pathfinder's body and its parts", title: "Photo of the BlackSky-1 pathfinder microsatellite (eoPortal figure 2)", url: "https://www.eoportal.org/satellite-missions/blacksky-constellation", licence: "looked at only; not free", credit: "Spaceflight Industries", read: 2026-10-27}], dimensions: {length_m: 0.84, width_m: 0.46, depth_m: 0.4, aperture_m: 0.24, mass_kg: 56, source: "eoPortal, https://www.eoportal.org/satellite-missions/blacksky-constellation, OPENED 2026-10-27: 'The BlackSky microsatellite buses have been developed and constructed by Spaceflight Industries and are based on existing designs for the SENTRY-4000 bus, which has dimensions 0.4 x 0.46 x 0.84 m. Each microsatellite has a mass of 56 kg'; 'The SV-24 sensor ... with an aperture of 0.24 m'. Launch table: 55 to 60 kg for Global-2 to Global-19; the Gen-3 satellites (Global 31 and 32) are given no size. OURS: the wings (0.80 x 0.50 m, 12 x 6 cells), the barrel's diameter and depth, the dish and its stalk, the hinge arms and braces, the foil's patches, the star tracker", read: 2026-10-27}, modified: "nothing was generated. THE EARTH END (+Z): the aperture in a silver plate with a blue border, a barrel with five black vanes on a four-spoke spider with the secondary housing, a star tracker baffle and a patch antenna. THE BODY: gold crinkled foil with taped seams and bolted rails, a cell array on the sun face. THE WINGS: two panels of 12 x 6 cells on hinge arms with braces, flat (the artist's picture shows them splayed). THE ANTI-EARTH END: a dish on a gimbal and stalk over a separation ring. 5 706 triangles, 57 kB, 14 colours, written as the others."}
