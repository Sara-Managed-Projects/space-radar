mary Contractors' 'Lockheed Martin'; its text: 'December 23, 2018: The first GPS Block III satellite, SV01 nicknamed Vespucci, launched'; 'Unlike the GPS IIF satellite, the GPS III satellites feature an apogee propulsion system'; 'the UHF Crosslink and Tracking Telemetry & Command (TT&C) subs[ystems]'. THE US SPACE FORCE'S OWN FACT SHEET WAS NOT OPENED (losangeles.spaceforce.mil answers 403, tried 2026-10-13); a search engine's extract of it gives '97 inches wide, 70 inches deep, and 134 inches high', which is 2.46 x 1.78 x 3.40 m and agrees with eoPortal's table. ESA (Dilssner and others, IGS Workshop 2012, https://files.igs.org/pub/resource/pubs/workshop/2012/Poland%202012%20-%20P09%20Dilssner%20PR4.pdf, OPENED 2026-10-13): '12 element helix design common to all GPS and GLONASS antenna types' (said of the blocks before GPS III). NO PAGE OPENED GIVES GPS III'S ANTENNA LAYOUT IN WORDS OR NUMBERS: the deck is read off the Air Force's render: a pale deck wider than the body, a ring of banded helices round a middle group, thin gold rods among them, one long mast at the middle, a dark canister, and a thin boom from the deck's corner with a small antenna at its end. ALSO READ OFF THE RENDER: two panels a wing, each wing about 4.4 x 2.9 m on a forked yoke 2.2 m long (the span is cited, the split is not); the body's dark sides and the pale radiator on one narrow side. OURS: that the wings stand on the 2.5 m faces.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 1.8 x 2.5 x 3.4 m, dark, with a pale radiator on one narrow side and an apogee nozzle on the far end. THE EARTH FACE: a pale deck wider than the body carrying a ring of eight banded helices round a middle four, six thin gold rods, one long mast, a dark canister, and a thin boom from the deck's corner with a small crossed antenna (shortened to 2 m so the craft stays in the middle of its frame). Two wings of two broad panels on forked yokes, 15 m tip to tip (the build had four panels and 14 m). THE SECOND WING IS A MIRROR IMAGE of the first. NO PAGE OPENED DESCRIBES GPS III'S ANTENNA DECK: every part on it is read off the Air Force's render. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the antenna face to +Z (the Earth), the wings along X, the cells to +Y. AS IT FLIES, in part: the real craft keeps its antenna on the Earth and its wing axis square to the Sun, which is the app's rule too; it also turns each wing on its axis to face the Sun, which the app does not, so the file's cells face the Sun's side of the sky. Colours are this project's own flat ones (body #5A5148, deck #E6EAF0, cells #2B3D6B), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 12 606 triangles, 11 colours"}
