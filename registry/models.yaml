 focal_length_m: 4.0, optics_diameter_m: 0.3, boom_canister_m: 0.3, source: "eoPortal, https://www.eoportal.org/satellite-missions/ixpe, opened 2026-10-13: 'When deployed, IXPE is 5.2 m from the bottom of the spacecraft structure to the top of the payload and is 1.1 m in diameter. The solar panels span 2.7 m when deployed.'; 'The spacecraft hexagonal structure is built up from machined aluminum plates'; 'comprises a 4-m-focal length Mirror Module Assembly'; '24 concentrically nested X-ray-mirror shells in each 300-mm-diameter optics module'; 'The three IXPE MMAs are mounted to a MMSS (Metallic Mirror Module Support Structure) deck'; the deck 'interfaces with the coilable, deployable boom through a TTR (Tip/Tilt/Rotation) mechanism'; the boom stows 'into a 12-inch (0.3-meter) canister'; 'The deployable boom is covered with a thermal sock'; 'The payload uses a deployable X-ray shield to prevent off-axis X-rays from striking the detectors'. NOT CITED, read off NASA's two pictures: the bus's 0.75 m height, the mirror modules' 0.7 m length and where the three stand, the array's 1.5 m height and its six strips, the detector units' size, the shields' 0.5 m, the boom's 0.24 m side and 12 bays", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. Built: a hexagonal bus 1.1 m across with its adapter ring, three detector units on its deck each under its mirror, the boom's canister, the boom as a three-sided lattice, the tip/tilt/rotate mechanism as a short drum under a hexagonal mirror deck, three mirror modules with dark mouths and a dark shield collar each, a star tracker between them, and the fixed array as one flat sheet of six strips of 1 by 4 cells beside the boom; 5.2 m from the ring to the mirrors' mouths, each mirror's middle 4.0 m from its detector. DRAWN DIFFERENTLY FROM THE CRAFT, on purpose and said: THE BOOM IS DRAWN BARE, as NASA's render draws it, where the craft in orbit wears a thermal sock over it (the cited sentence); it has 12 bays and members 28 mm thick where the real ones are a few millimetres, so that it is a lattice at the 300 px the app draws a craft; the three shields are flat collars, not the deployed shield's real outline; the array's strips are all one length where NASA's render shows them stepped. Axes, so the route says `axes: 'app'`: the mirrors at -Z looking away from the Earth, the bus at +Z, the array's cells to +Y. THE REAL CRAFT POINTS ITS MIRRORS AT A TARGET IN THE SKY, which the app does not know. No mirror pass. Colours are this project's own flat ones (bus #B9BFC7, mirror housings #AEB6C2, lattice #D5DAE2, cells #34489A, dark #2B2F38 and #3A3F4A), illustrative. Then scripts/bake-own-colours.mjs: 7 516 triangles, none removed, 10 colours, normals with a 40 degree crease, meshopt"}
