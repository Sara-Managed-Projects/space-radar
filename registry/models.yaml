  - {id: vikram, file: site/models/vikram.glb, kb: 136, budget_tris: 15500, class: site, kind: built-from-dimensions, used_for: "the chandrayaan-3 landing site (registry/sites.yaml), Statio Shiv Shakti: Chandrayaan-3's Vikram lander as it stood there, its rover's two-part ramp down and Pragyan gone, ChaSTE's probe in the ground and ILSA set down. It was the generic lander (scene/models.js `lander`), which is still what is drawn while this file is on its way; public #1133", source: "built by this project in code (release 1.3.0 stage W1-c's part library, lib.py, and one script a craft, kept with the stage's notes), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources, 1 583 paths, and NASA Science's 3D models have none of this craft; read 2026-10-20)", licence: "The pictures it was drawn from are ISRO's, under GODL-India (Government Open Data License - India, Commons' LicenseShortName, read 2026-10-20): 'all users are provided a worldwide, royalty-free, non-exclusive license to use, adapt, publish (either in original, or in adapted and/or derivative forms) ... for all lawful commercial and non-commercial purposes'; attribution required; names, crests and logos excluded. The shape is this project's, under this repository's licence, built from published numbers (facts). Nothing of the pictures is in the file. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from ISRO's published dimensions and pictures (ISRO, GODL-India)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; the flight lander in ISRO's clean room: the panels leaning out on two faces, the gold blankets, the white top deck and the dome, the legs (a gold-wrapped strut and two white ones to each dark footpad), the engines round the white interface ring", title: "Chandrayaan-3 lander in clean-room 03", url: "https://commons.wikimedia.org/wiki/File:Chandrayaan-3_lander_in_clean-room_03.webp", licence: "GODL-India (ISRO; Commons' LicenseShortName, read 2026-10-20)", credit: "Indian Space Research Organisation", read: 2026-10-20}, {use: "drawn from; the ramp deployed in the clean room: two segments, the checker targets along its edge", title: "Chandrayaan-3 lander in clean-room 05", url: "https://commons.wikimedia.org/wiki/File:Chandrayaan-3_lander_in_clean-room_05.webp", licence: "GODL-India (ISRO; Commons' LicenseShortName, read 2026-10-20)", credit: "Indian Space Research Organisation", read: 2026-10-20}, {use: "drawn from; ISRO's labelled drawings: where the laser retroreflector, the star sensor, the laser Doppler velocimeter, RAMBHA's probe, ChaSTE, ILSA and the hazard camera are", title: "Chandrayaan-3 Lander Module -Views", url: "https://commons.wikimedia.org/wiki/File:Chandrayaan-3_Lander_Module_-Views.webp", licence: "GODL-India (ISRO; Commons' LicenseShortName, read 2026-10-20)", credit: "Indian Space Research Organisation", read: 2026-10-20}, {use: "compared with; Vikram on the Moon, taken by Pragyan's navigation camera from 15 m on 30 August 2023: the ramp down, ChaSTE in the ground", title: "Chandrayaan-3 - Image of Vikram lander on lunar surface taken by Pragyan rover navcam at 1104 IST, 30 August 2023 from 15 meters away (without text)", url: "https://commons.wikimedia.org/wiki/File:Chandrayaan-3_%E2%80%93_Image_of_Vikram_lander_on_lunar_surface_taken_by_Pragyan_rover_navcam_at_1104_IST,_30_August_2023_from_15_meters_away_(without_text).webp", licence: "GODL-India (ISRO; Commons' LicenseShortName, read 2026-10-20)", credit: "Indian Space Research Organisation", read: 2026-10-20}], dimensions: {width_m: 2.0, depth_m: 2.0, height_m: 1.166, source: "ISRO, LVM3-M4 / Chandrayaan-3 brochure, https://www.isro.gov.in/media_isro/pdf/Missions/LVM3/LVM3M4_Chandrayaan3_brochure.pdf, OPENED 2026-10-20: lander 'Dimensions (mm3) : 2000 x 2000 x 1166'; ISRO, https://www.isro.gov.in/Chandrayaan3_Details.html, OPENED 2026-10-20: '4 nos. of 800 N Throttleable engines & 8 nos. of 58 N', 'Lander leg Rover Ramp (Primary & Secondary) Rover ILSA, Rambha & Chaste Payloads', 'A passive Laser Retroreflector Array from NASA'. OURS: the body's 0.85 m above the ground, the footpads 2.15 m out on the diagonals, the dome (1.04 m across, 0.5 m high), the ramp (0.74 m wide, two segments of about 1.07 m), every instrument's size, all read off the pictures against the cited 2 m", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BODY: the cited 2 x 2 x 1.166 m box, its bottom 0.85 m above the ground (OURS, from the clean-room pictures), four faces in gold blankets with patches and kapton tape on the edges, a white top deck with a gold rim. TWO SOLAR PANELS of 1.96 x 1.06 m on opposite faces, leaning out 9 degrees at the top as the pictures show, the app's panel blue; an OSR radiator on the face between them; on the fourth face the rover's empty bay and its TWO-PART RAMP, deployed to the ground (cited: 'Rover Ramp (Primary & Secondary)'), with its checker targets. FOUR LEGS on the diagonals, each a gold-wrapped main strut with its absorber and two white struts to a dark footpad. UNDER: the white interface ring with its holes, the four cited 800 N engines (dark, a silver rim) and eight 58 N thrusters. ON TOP: the gold dome, the frame over it with NASA's retroreflector, two star sensors, the X-band dish on its mast, the laser Doppler velocimeter; RAMBHA's Langmuir probe on its boom; ChaSTE's arm with its probe in the ground and ILSA set down under the body (as Pragyan photographed them). Pragyan itself is NOT drawn: it drove off and stopped about 100 m away. No mirror pass: every part is placed. REBUILT the same day after the review of #1246 (the first file read as a box with a panel): the blankets faceted (their normals creased at 12 degrees, not 40, so each fold keeps its own step of the toon ramp), black blankets along the bottom of every face and beside the bay, taped seams, gold-wrapped lumps of equipment on the top corners, thicker legs and bigger footpads, bigger engines with their rims, a bigger Langmuir probe, ChaSTE head and ILSA, larger checker targets on the ramp. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body): blankets as rumpled sheets with patches a shade lighter and darker, so they are not flat slabs. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, normals creased at 40 degrees, meshopt), with nothing resampled or decimated: every triangle keeps the colour it was built with. 14642 triangles, 136 kB."}
