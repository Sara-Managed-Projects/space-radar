  - {id: mars-express, file: site/models/mars-express.glb, kb: 72, budget_tris: 12000, class: probe, kind: built-from-dimensions, used_for: "JPL Horizons -41, Mars Express (data/sample.js `deep-mars-express`), ESA's Mars orbiter since 2003, drawn from Mars: a black box with a 1.6 m dish on one face, two four-panel wings on D-shaped yokes and the MARSIS radar's wire dipole. It was the generic probe; public #1085", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh: NASA's 3D Resources (the whole tree, read 2026-10-20) and NASA Science's search have none of this craft, and ESA publishes none under terms that allow a derivative. NASA/JPL's illustrations (public domain) were looked at for the layout and are not in the file; NO ESA PICTURE OR MODEL IS IN THE FILE: ESA's published numbers were read as numbers. ESA's terms for the images on its site, read 2026-10-15 (https://www.esa.int/ESA_Multimedia/Terms_and_Conditions): 'The website of the European Space Agency (the ESA Website) provides to users an online access to space images and videos for education, editorial and/or information purposes only. All other uses (e.g. commercial ones) are excluded and require a specific licence.' ESA's renders on Wikimedia Commons are CC BY-SA 3.0 IGO (share-alike) and were looked at only", licence: "Public domain (NASA/JPL's illustrations by Corby Waste, which the layout was read off: looked at, with credit; nothing of them is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). ESA's render of today (ESA392355, CC BY-SA 3.0 IGO) was looked at only, for the black blankets and the top face. NO ESA PICTURE OR MODEL IS IN THE FILE. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and NASA/JPL pictures (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; NASA/JPL's illustration (Corby Waste) with the MARSIS antenna: the dish on one face, the four-panel wings on their yokes, the dipole square to the wings, the monopole", title: "Mars Express illustration highlighting MARSIS antenna", url: "https://commons.wikimedia.org/wiki/File:Mars_Express_illustration_highlighting_MARSIS_antenna.jpg", licence: "Public domain (NASA/JPL/Corby Waste; Commons' LicenseShortName, read 2026-10-20)", credit: "NASA/JPL/Corby Waste", read: 2026-10-20}, {use: "drawn from; NASA/JPL/ESA's illustration over the Tharsis volcanoes (Corby Waste): the D-shaped frames of the yokes, four panels a wing", title: "Mars Express over Tharsis volcanoes", url: "https://commons.wikimedia.org/wiki/File:Mars_Express_over_Tharsis_volcanoes.jpg", licence: "Public domain (NASA/JPL/ESA, Corby Waste; Commons' LicenseShortName, read 2026-10-20)", credit: "NASA/JPL/ESA, Corby Waste", read: 2026-10-20}, {use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): ESA's render of today, for the black blankets, the silver back of the dish, the two bronze relay antennas and Beagle 2's empty ring on the top face", title: "Mars Express ESA392355", url: "https://commons.wikimedia.org/wiki/File:Mars_Express_ESA392355.jpg", licence: "CC BY-SA 3.0 IGO (European Space Agency; Commons' LicenseShortName, read 2026-10-20): share-alike, LOOKED AT ONLY for today's colours and the top face, not fetched by the tool and not in any file", credit: "ESA", read: 2026-10-20}], dimensions: {body_x_m: 1.5, body_y_m: 1.4, body_z_m: 1.8, span_m: 12, hga_m: 1.6, marsis_dipole_m: 20, source: "Wikipedia, 'Mars Express', https://en.wikipedia.org/wiki/Mars_Express, OPENED 2026-10-20: 'The main body is 1.5 m × 1.8 m × 1.4 m in size.'; 'The solar panels measure about 12 m tip-to-tip.'; 'the solar panels which contain 11.42 square meters of silicon cells'; 'A 1.6 m diameter parabolic dish high-gain antenna and two omnidirectional antennas.'; 'Two Mars lander relay UHF antennas are mounted on the top face.'; 'Two 20 m long wire dipole antennas extend from opposite side faces perpendicular to the solar panels.'; 'a bipropellant 400 N main engine'; 'eight 10 N thrusters, one attached to each corner of the spacecraft bus'; 'The spacecraft is covered in gold-plated aluminium-tin alloy thermal blankets.' DERIVED: each panel 0.96 x 1.48 m (11.42 m2 over eight, four a wing as every picture draws them). OURS: the yoke's fin and frame, the dish's depth, the places and sizes of everything on the top face, the radiators, the thrusters' sizes. SHORTENED, AND SAID: the dipole 5.6 m a side of 20 m, the monopole 2 m of 7 m.", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BODY: 1.5 x 1.4 x 1.8 m (cited), the dish's face +Z and the 'top face' +Y; black blankets (ESA's render of today; Wikipedia says the blankets are gold-plated, and the 2003 NASA/JPL illustrations draw them gold: today's picture is followed) with silver radiators on the back face and low on the wing faces (sizes OURS). THE TOP FACE: the two relay antennas (cited) as bronze discs across a diagonal, Beagle 2's empty ring between them with four brackets, ASPERA's gold head (cited: on the top face), the apertures of the instruments that look through it and HRSC's hood (places OURS, after ESA's render). THE HIGH-GAIN ANTENNA: a 1.6 m dish (cited), white, its feed on three struts, its back in crinkled silver blanket in two silvers (ESA's render). THE THRUSTERS: the 400 N engine's bell under the bottom face and eight small bells at the corners (cited: 'one attached to each corner'). The two omnidirectional antennas (cited) and two star trackers (OURS). THE MARSIS RADAR: THE DIPOLE IS DRAWN 5.6 m A SIDE OF ITS 20 m, AND THE 7 m MONOPOLE 2 m, because the app draws a model at a fixed size on screen by its longest side and a 40 m wire would make the body a speck; each is drawn 5 cm across, many times the real wire, so it is a pixel at the app's framing. TWO WINGS of four panels (every picture), each panel 0.96 x 1.48 m (DERIVED: the cited 11.42 m2 of cells over eight), on a 0.3 m fin and a 0.95 m D-shaped frame with its round side toward the body (the pictures; sizes OURS): 11.9 m tip to tip (cited: about 12 m). Built to the app's axes: +Z the dish AND THE CELLS (the wings turn on their axis), the wings along X. In Mars orbit it turns its top face to Mars to observe and its dish to the Earth to talk; the app points +Z at the centre of the stage, so it is drawn talking. No mirror pass: the second wing is a placed part. Colours are this project's own flat ones in the app's roles (cells the app's panel blue #2E4E8C; blankets, dishes and frames read off the pictures named). THE BLANKETS (release 1.3.0, 'the quality of models should be very high'): every blanketed face is a seam colour under a patchwork of thin plates in two to four shades of its foil, cut in irregular widths 6 mm proud of the face, so the seams and the uneven sheen of multi-layer insulation read in flat colours. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 11 176 triangles, 13 colours"}
  - {id: gaia, file: site/models/gaia.glb, kb: 97, budget_tris: 11000, class: telescope, kind: built-from-dimensions, used_for: "JPL Horizons -139479, Gaia (data/sample.js `deep-gaia`), ESA's astrometry telescope, since March 2025 switched off on a disposal orbit round the Sun: a black drum on a hexagonal service module over a twelve-sided sunshield 10 m across, its Sun side carrying the cells and the phased-array antenna. It was the procedural shape (scene/models.js buildGaia), which stays as what is drawn while the file is in flight; public #1086", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh: ESA publishes no model of Gaia under terms that allow a derivative (its planetarium models, e.g. Webb's, may not be altered), and NASA's 3D Resources and NASA Science have none; a photograph of the full-size model's Sun side (CC BY 2.0) was looked at for the layout and is not in the file; NO ESA PICTURE OR MODEL IS IN THE FILE: ESA's published numbers were read as numbers. ESA's terms for the images on its site, read 2026-10-15 (https://www.esa.int/ESA_Multimedia/Terms_and_Conditions): 'The website of the European Space Agency (the ESA Website) provides to users an online access to space images and videos for education, editorial and/or information purposes only. All other uses (e.g. commercial ones) are excluded and require a specific licence.' ESA's renders on Wikimedia Commons are CC BY-SA 3.0 IGO (share-alike) and were looked at only", licence: "CC BY 2.0 (the photograph of the full-size model's Sun side, which the layout of the cells was read off: looked at, with credit; nothing of it is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). The photograph of the model at Le Bourget (CC BY-SA 3.0) and ESA's render (CC BY-SA 3.0 IGO) were looked at only. NO ESA PICTURE OR MODEL IS IN THE FILE. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and a photograph of the full-size model (CC BY 2.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; a photograph of the full-size model of Gaia's Sun side: the ring of six fixed cell panels round the antenna, the six rectangular panels on alternate panels of the shield, the crinkled pale blanket", title: "GAIA (14050944939)", url: "https://commons.wikimedia.org/wiki/File:GAIA_(14050944939).jpg", licence: "CC BY 2.0 (DLR German Aerospace Center; Commons' LicenseShortName, read 2026-10-20): a photograph of the full-size model of Gaia's Sun side, its six cell panels, the fixed ring and the antenna", credit: "DLR, CC BY 2.0", read: 2026-10-20}, {use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): the full-size model at Le Bourget 2013 from the cold side, for the silver foil and the gold patches at the rim", title: "Maquette de Gaia salon du Bourget 2013 DSC 0191", url: "https://commons.wikimedia.org/wiki/File:Maquette_de_Gaia_salon_du_Bourget_2013_DSC_0191.JPG", licence: "CC BY-SA 3.0 (Pline; Commons' LicenseShortName, read 2026-10-20): share-alike, LOOKED AT ONLY for the cold side's foil and gold patches", credit: "Pline", read: 2026-10-20}, {use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): ESA's render, for the black drum, its two openings, the gold rims and the service module", title: "Gaia spacecraft", url: "https://commons.wikimedia.org/wiki/File:Gaia_spacecraft.jpeg", licence: "CC BY-SA 3.0 IGO (European Space Agency; Commons' LicenseShortName, read 2026-10-20): share-alike, LOOKED AT ONLY for the drum, its openings and the service module", credit: "ESA", read: 2026-10-20}], dimensions: {shield_m: 10, height_m: 3.5, svm_tube_m: 1.17, primary_x_m: 1.45, primary_y_m: 0.5, source: "Wikipedia, 'Gaia (spacecraft)', https://en.wikipedia.org/wiki/Gaia_(spacecraft), OPENED 2026-10-20: 'After launch, a 10-metre-diameter sunshade was deployed.'; 'consisted of two telescopes providing two observing directions with a fixed, wide angle of 106.5° between them'; '1.45 × 0.5 m primary mirror for each telescope'. eoPortal, https://www.eoportal.org/satellite-missions/gaia, OPENED 2026-10-20: 'Spacecraft dimensions Height = 3.5 m, deployed diameter = 10 m'; 'The sunshield measured about 10 m across, too large for the launch vehicle fairing, so it comprises a dozen folding panels that will be deployed after launch.'; 'Some of the solar array panels that are needed to generate power are fixed on the sunshield, with the rest on the bottom of the spacecraft.'; 'Attached to the DSA were six rectangular solar panels (with triple-junction solar GaAs cells) that are constantly facing the sun once the shield was deployed.'; 'The module consisted of a central tube that was about 1.17 m long and hosts six radial panels to create a hexagonal spacecraft shape'; 'a bi-propellant Chemical Propulsion System (2 x 8 10 N thrusters used in cold redundancy)'; 'The Micro-propulsion System (2 x 6 proportional micro-thrusters)'. ESA, 'Gaia factsheet', OPENED 2026-10-20: '10 m across, with solar array deployed'. OURS: the drum's 3.3 m, the service module's 3.0 m across flats and 1.1 m, the openings' size and height, the six panels' 2.3 x 1.25 m and the fixed ring's 1.9 m, read off the photographs against the cited 10 m and 3.5 m.", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE SUNSHIELD: twelve-sided, 10 m corner to corner (cited), 'a dozen folding panels' (cited), its trapezoid panels kept. EACH FACE IS A CRINKLED SHEET OF FOIL (rebuilt 2026-10-20 after review: the first build's patchwork of four flat silvers and gold rim patches read as a checkerboard with orange tabs): each panel a sheet of 48 facets on a 7 x 5 grid whose inner points stand up to 4 cm off the face at random, in two close shades, so the light breaks over it as over crinkled blanket; the panels' edges flat and seamed. These sheets are given vertex by vertex (a `mesh` part, added to the tool's copy for this build) and left whole, since a sheet of one foil has no other colour for the bake to confuse. The Sun side blue-violet silver (DLR's photograph of the full-size model), with the six rectangular cell panels (cited: 'six rectangular solar panels') on alternate panels, 2.3 x 1.25 m (OURS, read off the photograph against the cited 10 m), the fixed ring of six blue trapezoids round the antenna's gold hexagon (cited: 'Some of the solar array panels ... are fixed on the sunshield'); the cold side darker grey-silver, with the frame's struts down each panel's edge and across its middle (the model at Le Bourget, looked at; drawn 6 to 7 cm across). The gold patches the cold side carries are LEFT OUT: at the app's size they read as orange tabs. THE SERVICE MODULE: a hexagonal prism (cited: 'six radial panels to create a hexagonal spacecraft shape') 3.0 m across flats and 1.1 m tall (OURS), black blanket with silver radiator bays on alternate faces, its chemical thrusters' small bells and the micro-thrusters' gold boxes (cited: '2 x 8 10 N thrusters', '2 x 6 proportional micro-thrusters'). THE PAYLOAD MODULE'S THERMAL TENT: a 24-sided black drum 3.3 m across (OURS) to 3.5 m above the shield (cited height), gold rims at its foot and top, a white top with a short mast; the two telescopes' openings 106.5 degrees apart (cited), each a dark window 1.6 x 0.7 m (OURS, round the cited 1.45 x 0.5 m mirrors) in a gold frame, a silver mirror inside; as flat windows on a round drum their ends stand up to 18 cm off it. Built to the app's axes: +Z the Sun side of the shield (cells and antenna); the drum on -Z. The app turns +Z to the centre of the stage; Gaia flew with the shield 45 degrees off the Sun, spinning every six hours, which is not drawn. No mirror pass: every panel is a placed part. Colours are this project's own flat ones in the app's roles (cells the app's panel blue #2E4E8C; blankets, dishes and frames read off the pictures named). THE BLANKETS (release 1.3.0, 'the quality of models should be very high'): every blanketed face is a seam colour under a patchwork of thin plates in two to four shades of its foil, cut in irregular widths 6 mm proud of the face, so the seams and the uneven sheen of multi-layer insulation read in flat colours. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 10 544 triangles, 17 colours"}
  - {id: hayabusa2, file: site/models/hayabusa2.glb, kb: 86, budget_tris: 14000, class: probe, kind: built-from-dimensions, used_for: "JPL Horizons -37, Hayabusa2 (data/sample.js `deep-hayabusa2`), JAXA's sample-return probe, back from Ryugu in 2020 and bound for 1998 KY26: a gold box with two flat antennas on top, two three-panel wings on ladders, the ion engines on one face and the sampler horn below. It was the generic probe; public #1087", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh: JAXA publishes no model of the probe under terms that allow an altered derivative, and NASA has none (searched 2026-10-20); DLR's renders (CC BY 2.0) and The Planetary Society's diagram (CC BY 3.0) were looked at for the layout and are not in the file; JAXA's 1:20 model (photograph CC BY-SA 4.0) and JAXA's labelled views were looked at only. NO JAXA PICTURE OR MODEL IS IN THE FILE", licence: "CC BY 2.0 (DLR's renders) and CC BY 3.0 (The Planetary Society's diagram), which the layout was read off: looked at, with credit; nothing of them is in the file. The shape is this project's, under this repository's licence, built from published numbers (facts). JAXA's 1:20 model (photograph CC BY-SA 4.0) was looked at only. NO JAXA PICTURE OR MODEL IS IN THE FILE. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions, DLR renders (CC BY 2.0) and a Planetary Society diagram (CC BY 3.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; DLR's render from the front: the gold body, the flat antennas seen edge-on, the wings of three panels on ladders, the sampler horn below", title: "Hayabusa2 front view", url: "https://commons.wikimedia.org/wiki/File:Hayabusa2_front_view.jpg", licence: "CC BY 2.0 (DLR German Aerospace Center; Commons' LicenseShortName, read 2026-10-20)", credit: "DLR, CC BY 2.0", read: 2026-10-20}, {use: "drawn from; DLR's render from the side: the ion engines' four heads on their plate, the wings edge-on", title: "Hayabusa2 side view", url: "https://commons.wikimedia.org/wiki/File:Hayabusa2_side_view.jpg", licence: "CC BY 2.0 (DLR German Aerospace Center; Commons' LicenseShortName, read 2026-10-20)", credit: "DLR, CC BY 2.0", read: 2026-10-20}, {use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): JAXA's 1:20 model from above, for the two flat antennas side by side along the wing axis, wider together than the body, and each wing three panels of two halves across the wing axis", title: "Model of Hayabusa2 at the Australian Space Discovery Centre (DSCF4736)", url: "https://commons.wikimedia.org/wiki/File:Model_of_Hayabusa2_at_the_Australian_Space_Discovery_Centre_(DSCF4736).jpg", licence: "CC BY-SA 4.0 (Pangalau; Commons' LicenseShortName, read 2026-10-20): share-alike, LOOKED AT ONLY for the wings' layout and the two flat antennas", credit: "Pangalau", read: 2026-10-20}, {use: "drawn from; The Planetary Society's labelled diagram: the re-entry capsule, the star trackers, the spectrometer, the altimeter and the sampler horn on their faces", title: "20190605 hayabusa-diagram-tpr-01", url: "https://commons.wikimedia.org/wiki/File:20190605_hayabusa-diagram-tpr-01.png", licence: "CC BY 3.0 (Emily Lakdawalla, Charles H. Braden, and Loren A. Roberts for The Planetary Society; Commons' LicenseShortName, read 2026-10-20)", credit: "The Planetary Society (E. Lakdawalla, C. H. Braden, L. A. Roberts), CC BY 3.0", read: 2026-10-20}], dimensions: {body_x_m: 1.0, body_y_m: 1.6, body_z_m: 1.25, span_m: 6, arrays_y_m: 4.23, capsule_m: 0.4, source: "eoPortal, 'Hayabusa-2', https://www.eoportal.org/satellite-missions/hayabusa-2, OPENED 2026-10-20: 'The Hayabusa-2 spacecraft has a stowed size of 1.6 m x 1 m x 1.25 m (height). With the solar panels deployed, the 600 kg satellite as a width of 6 m.'; 'Size: 1.6 m×1.0 m×1.4 m(height) box structure with two fixed SAPs'; 'Hayabusa-2 uses two planar HGAs'; 'IES (Ion Engine System): Xe microwave discharge ion engine system; Maximum thrust 28 mN, Isp=2800 s; 4 thruster heads on gimballed stage'; 'RCS (Reaction Control System): Bi-propellant hydrazine system, 20 N thruster x 12'. Wikipedia, 'Hayabusa2', OPENED 2026-10-20: '1 × 1.6 × 1.25 m'; solar arrays '6 m × 4.23 m'; 'The container is 40 cm (16 in) external diameter, 20 cm (7.9 in) in height'. The two pages give the height as 1.25 m and 1.4 m: 1.25 m is built. DERIVED: each wing 1.33 x 4.23 m. OURS: the antennas' 0.8 m, the sampler horn's 1 m, the ladder, every instrument's size and place.", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BODY: 1.0 x 1.6 x 1.25 m (cited; eoPortal also says 1.4 m tall: 1.25 m is built), in gold blanket of three golds over a dark-gold seam colour, with dark radiator panels on the wing faces (the pictures). THE TWO FLAT HIGH-GAIN ANTENNAS (cited: 'two planar HGAs') side by side along the wing axis on short posts, 0.8 m each (OURS, read off JAXA's model against the cited 6 m), grey with gold rims; the medium-gain horn, the low-gain antenna and DCAM3 beside them. THE +Y FACE: the re-entry capsule's domed back shell 0.4 m across (cited), two star trackers' hoods, the spectrometer and the altimeter. THE -Y FACE: the ion engines' four heads on a dark plate (cited: '4 thruster heads'); twelve thruster bells at the corners (cited: '20 N thruster x 12'; eight drawn, at the corners). THE UNDERSIDE: the sampler horn, about 1 m, dark with silver bands and a flared mouth; the navigation cameras, the thermal imager, the impactor's cylinder and the target markers (sizes OURS; MASCOT, the MINERVA-II rovers, the impactor and the capsule left between 2018 and 2020: the impactor's cylinder and the capsule are drawn as they were carried, the rovers' places empty). TWO WINGS: 6 m tip to tip and 4.23 m across (cited), each three panels in a row across the wing axis (the pictures), 1.33 x 4.23 m (DERIVED), on a ladder of two rails with two rungs, white marks on the cells (every picture), backs dark grey. Built to the app's axes: +Z the antennas AND THE CELLS (both fixed to the body, eoPortal: 'two fixed SAPs'), the wings along X, the horn on -Z. No mirror pass: the second wing is a placed part. Colours are this project's own flat ones in the app's roles (cells the app's panel blue #2E4E8C; blankets, dishes and frames read off the pictures named). THE BLANKETS (release 1.3.0, 'the quality of models should be very high'): every blanketed face is a seam colour under a patchwork of thin plates in two to four shades of its foil, cut in irregular widths 6 mm proud of the face, so the seams and the uneven sheen of multi-layer insulation read in flat colours. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 13 178 triangles, 14 colours"}
  - {id: hope, file: site/models/hope.glb, kb: 66, budget_tris: 9000, class: probe, kind: built-from-dimensions, used_for: "JPL Horizons -62, Hope (data/sample.js `deep-hope`), the Emirates Mars Mission, the UAE's Mars weather orbiter, drawn from Mars: a gold hexagonal prism under a 1.85 m dish, two wings of two panels, its three instruments on one face. It was the generic probe; public #1088", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh: MBRSC publishes no model of Hope, and NASA has none (searched 2026-10-20); the only free pictures are two photographs of the mock-up at IAC 2021 (CC BY-SA 4.0), looked at only, and MBRSC's own photographs and renders (in eoPortal) were looked at only. NO PICTURE IS IN THE FILE", licence: "This project's own shape, under this repository's licence, built from published numbers (facts). NO FREE PICTURE OF THE FLIGHT CRAFT WAS USED: the mock-up's photographs (CC BY-SA 4.0, share-alike) and MBRSC's photograph of the deployed craft (no free licence) were looked at only and nothing of them is in the file. NO LOGO, FLAG AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions (no free picture of the flight craft)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT ONLY (share-alike: not fetched by the tool, not in the file; shown with its credit beside the model on the pull request's contact sheet, which is CC BY-SA 4.0): the mock-up at IAC 2021, for the stowed panel on a wide face, the instruments on the face beside it, the star trackers' beige boxes and the dish's struts", title: "Emirates Mars Mission mockup at IAC 2021 01 (cropped)", url: "https://commons.wikimedia.org/wiki/File:Emirates_Mars_Mission_mockup_at_IAC_2021_01_(cropped).jpg", licence: "CC BY-SA 4.0 (BugWarp; Commons' LicenseShortName, read 2026-10-20): share-alike, LOOKED AT ONLY for the stowed panel, the instrument face and the dish; not fetched by the tool and not in any file. It is the one free photograph of the craft's shape, so the pull request's contact sheet shows it beside the model with its credit and licence (that sheet is CC BY-SA 4.0)", credit: "BugWarp", read: 2026-10-20}, {use: "LOOKED AT ONLY (no free licence: not fetched by the tool, on no sheet): MBRSC's photograph of the deployed craft before shipment, for TWO wings of two panels each, the dark dish with its four-strut subreflector and the gold blankets", title: "emm-hope", url: "https://www.eoportal.org/satellite-missions/emm-hope", licence: "MBRSC's photograph 'of the deployed EMM Hope spacecraft at MBRSC prior to shipment (image credit: AETOSWire)' (eoPortal Figure 4), no free licence: LOOKED AT ONLY for the two wings and the black dish, not fetched by the tool", credit: "MBRSC / AETOSWire", read: 2026-10-20}], dimensions: {body_m: 2.37, body_height_m: 2.9, hga_m: 1.85, source: "eoPortal, 'EMM Hope', https://www.eoportal.org/satellite-missions/emm-hope, OPENED 2026-10-20: 'It is a hexagonal prism, 2.37 m wide by 2.90 m tall, constructed of honeycomb aluminum panels with composite facesheets, with three solar panel wings affixed to the top platform.'; 'In space, Hope generates and stores power using two deployable solar arrays and batteries and communicates with Earth-based ground antennas using a 1.85 m diameter high gain antenna and coupled low gain antennas.'; 'through a 1.5 m diameter high-gain directional dish antenna mounted on the top deck of the spacecraft'; 'a redundant pair of star trackers'; 'Propulsion is provided by four to six 120 N thrusters mounted on the bottom of the spacecraft'; 'The EMM Hope probe carries three scientific instruments mounted on one side of the spacecraft.' The page says both 1.85 m and 1.5 m for the dish, and both two arrays and three wings: 1.85 m and two wings (MBRSC's photograph of the deployed craft) are built. OURS: the wings' panels 1.36 x 1.40 m and their place, the dish's depth and cone, the instruments' boxes.", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BODY: a hexagonal prism 2.37 m across flats and 2.9 m tall (cited), two flats square to the wings, in gold blanket of three golds over a dark-gold seam colour; the top and bottom decks black (the mock-up). THE HIGH-GAIN ANTENNA: a 1.85 m dish (cited; the page also says 1.5 m once: 1.85 m is built), dark as MBRSC's photographs show it, its subreflector on four struts, on a cone 0.35 m above the deck (OURS). Two low-gain antennas and the two star trackers (cited: 'a redundant pair of star trackers') with beige boxes and black hoods. THE INSTRUMENTS (cited: 'mounted on one side of the spacecraft'): EXI, EMIRS and EMUS as boxes with dark apertures on the flat at -60 degrees, low on the body (OURS). THE THRUSTERS: six 120 N bells under the bottom deck (cited: 'four to six 120 N thrusters mounted on the bottom') and reaction-control bells at the corners. TWO WINGS (eoPortal says both 'two deployable solar arrays' and 'three solar panel wings'; MBRSC's photograph of the deployed craft shows two wings of two panels, and two are built), each panel 1.36 x 1.40 m, from the two flats on X just under the top deck, 8.0 m tip to tip (OURS, read off that photograph against the cited 1.85 m dish). Built to the app's axes: +Z the dish AND THE CELLS (the photograph shows both on the one side), the wings along X. In Mars orbit it turns its instruments to Mars to observe and its dish to the Earth to talk; the app points +Z at the centre of the stage, so it is drawn talking. No mirror pass: the second wing is a placed part. Colours are this project's own flat ones in the app's roles (cells the app's panel blue #2E4E8C; blankets, dishes and frames read off the pictures named). THE BLANKETS (release 1.3.0, 'the quality of models should be very high'): every blanketed face is a seam colour under a patchwork of thin plates in two to four shades of its foil, cut in irregular widths 6 mm proud of the face, so the seams and the uneven sheen of multi-layer insulation read in flat colours. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 8 544 triangles, 15 colours"}
