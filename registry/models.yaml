1.294 m diameter sphere. The diameter of the sphere touching the corner cube reflector (CCR) faces is 1284 mm'; 'a total of 2140 fused-quartz CCR's (304 arrays 7 CCR's each and 2 arrays 6 CCR's each) plus 6 germanium CCR's.'; 'made of aluminum-titanium alloy with an integral coefficient of diffuse reflectivity 0.7'; the distribution is 'not absolutely uniform'. NOT CITED: where any array sits, the size of a cube's face (drawn 27 mm across, six-sided), the pitch inside an array (drawn 31 mm)", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. A ball of 796 even triangles 1.294 m across and 2 146 six-sided discs: 304 arrays of seven and 2 of six (the published 2 140 of fused quartz) and 6 single ones a darker grey (the germanium). THE COUNTS ARE PUBLISHED AND THE PLACEMENT IS OURS: fifteen rings of arrays 12 degrees apart (32 on the equator, then 31, 29, 26, 21, 16, 10 and 3 toward each pole), the two arrays of six at the poles, three germanium cubes a hemisphere. DRAWN DIFFERENTLY FROM THE CRAFT: the page says the distribution is 'not absolutely uniform' and its photograph shows the arrays in fields with bare bands between them, which this even spread does NOT draw; each face stands proud; a cube's 27 mm and an array's 31 mm pitch are not cited. The poles are on the file's Y axis. No mirror pass. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 13 672 triangles, 3 colours"}
