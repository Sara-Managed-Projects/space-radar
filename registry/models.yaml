rlands 2", url: "https://commons.wikimedia.org/wiki/File:ICEYE_SAR_satellite_Netherlands_2.jpg", licence: "CC BY-SA 4.0 (share-alike: looked at only)", credit: "Defensie Nederland, Wikimedia Commons", read: 2026-10-13}], dimensions: {antenna_length_m: 3.2, antenna_width_m: 0.4, stowed_height_m: 0.7, stowed_width_m: 0.6, source: "eoPortal, https://www.eoportal.org/satellite-missions/iceye-constellation, opened 2026-10-13, table 2: 'Antenna size 3.2 m x 0.4 m'; 'Each ICEYE spacecraft has a mass of 85 kg'. eoPortal, https://www.eoportal.org/satellite-missions/iceye-x1, opened 2026-10-13: 'The size of the microsatellite in launch configuration is 70 cm in height and 60 cm in width. The SAR antenna has a length of 3.25 m.'; 'The SAR antenna consists of five elements, the central element being rigidly attached to the satellite body and two elements deploying to either side to create a 3.2 m wide antenna array.'; 'power is provided by 1 fixed solar array and batteries' (of the first craft, 2018). ESA, https://earth.esa.int/eogateway/missions/iceye/description, opened 2026-10-13 through a reader: 'Mass' '85 kg'; 'Dimensions' '70 cm x 60 cm'. NOT CITED, taken from the two renders looked at: five solar panels of about 0.6 x 0.6 m in a row on the antenna's back (built upright; the renders show them leaning), the bus as a box 0.6 x 0.34 x 0.58 m behind the middle one, a 0.7 m mast with a small antenna on the Earth side. THE FLEET IS SEVERAL GENERATIONS; one shape stands for all of them", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE ANTENNA: five elements side by side, 3.2 m by 0.4 m together and 4.5 cm thick, pale, on a spine. On its back, near one long edge, five solar panels of 3 by 2 cells standing square to it, and behind the middle one the bus as a box in gold foil. On the Earth side a thin mast with the downlink antenna at its end. No mirror pass: the antenna's elements and the solar panels are the same part repeated along the craft. S