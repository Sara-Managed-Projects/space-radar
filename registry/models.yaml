5.4, wings: 3, tropomi_m: [1.4, 0.65, 0.75], radiator_m2: 1.5, source: "ESA, 'Facts and figures', https://www.esa.int/Applications/Observing_the_Earth/Copernicus/Sentinel-5P/Facts_and_figures, OPENED 2026-10-14 (words and numbers only): 'Satellite: 3.35 m high, 5.63 m diameter and a mass of 820 kg (including 82 kg fuel)'; 'Launch: 13 October 2017'; 'Revisit time: Daily global coverage (13:30 local solar time)'. eoPortal, https://www.eoportal.org/satellite-missions/copernicus-sentinel-5p, OPENED 2026-10-14: 'The satellite uses the AstroBus-L 250 M platform of Astrium'; 'The mechanical platform consists of a hexagonal structure supporting the platform electrical units and the TROPOMI ICU (Instrument Control Unit), and interfacing to a standard launch vehicle interface ring.'; 'The top floor accommodates the instrument and its radiator, as well as the star trackers and the X-band and S-band communication antennas. The instrument is mounted in a canted position, such that its radiator has an unobstructed field of view.'; 'The nominal operational scenario for the payload instrument will always be nadir-pointing in the instrument imaging mode.'; 'EPS (Electrical Power Subsystem): Three deployable solar arrays (5.4 m2) using GaAs triple-junction solar cells, supply 1500 W of average power.'; 'the 3 Star Tracker Optical Heads'; TROPOMI 'massPowerSize 206.6 kg, plus 17.4 kg for the instrument control unit 170 W (average) 1.4 m x 0.65 m x 0.75 m'; 'Payload thermal control Passive, use of a 1.5 m2 radiator'; 'Observation pointing Fixed nadir pointing'; 'LTAN (Local Time on Ascending Node) = 13.35 hours'; 'The spacecraft is 3-axis stabilized, the design provides an optional yaw steering.' DERIVED: three wings of 1.8 m2, each 1.8 x 1.0 m; their tips 2.8 m from the axis. READ OFF THE PHOTOGRAPH OF A MODEL: the gold hexagonal body; the three wings hinged at the end away from TROPOMI, one on every other face, each with a dark stay; silver patches and a patch of cells on the faces; TROPOMI and a silver trough under the radiator on the far floor, reaching past the body's edge; two white rods. OURS: the body's 1.75 m across and 2.4 m height (inside the cited 3.35 m with TROPOMI and the ring), the wings flat and square to the axis, the radiator's cant, every place on the Earth floor.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BODY: a gold six-sided prism (cited as 'a hexagonal structure') 2.4 m tall and 1.75 m across its faces (both OURS: a face of 1.01 m is what a stowed wing of 1.8 m2 wants, and with TROPOMI and the launch ring it makes the cited 3.35 m), the launch ring at the end away from the Earth. THREE WINGS (cited), one on every other face, hinged at that end and folded out flat with the cells to the sky, each 1.8 by 1.0 m (a third of the cited 5.4 m2; the split ours), their tips 2.8 m from the axis (the cited 5.63 m diameter), a dark stay to each; silver patches and a patch of cells on the faces (read off the photograph). ON THE EARTH FLOOR ('the top floor', cited): TROPOMI as a silver box of its cited 1.4 x 0.65 x 0.75 m, its 1.5 m2 radiator (cited) facing away from the Sun's side and canted 20 degrees toward the Earth in a silver trough that reaches past the body (the trough read off the photograph; the cant ours: the page says only 'canted ... such that its radiator has an unobstructed field of view'), three star trackers (cited as three), the X- and S-band antennas (cited as there) and two white rods (read off the photograph), places ours. No mirror pass: no part is a mirror image of another; the three wings are one wing turned about the axis. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the body's axis along Z with TROPOMI on +Z (the Earth). THIS IS HOW THE CRAFT FLIES in what the pages say: nadir-pointing (cited), the wings fixed; three-fold, so the app's turn about the vertical changes nothing a page gives. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle (a large face of a box as a grid of such quads: `even: true`, batch nine), so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 850 triangles, 9 colours"}
  - {id: cryosat-2, file: site/models/cryosat-2.glb, kb: 53, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 36508 (CRYOSAT 2), the one record in the live saved data of 2026-10-12: ESA's ice altimeter, launched in 2010. It had no route: it wore the shape of its class, a box with two wings and a dish, where the craft has no wings at all; public #957", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms); ESA's own pictures and models were NOT used: ESA's terms forbid derivative works", licence: "This project's own shape, under this repository's licence, built from published numbers and sentences (facts). NO FREE PICTURE OF THE CRAFT WAS FOUND: the layout is the pages' own words; a visitor's share-alike photograph of the flight craft was looked at only (named under references) and nothing of it is in the file. NO ESA PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions (no free picture of the craft)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): a visitor's photograph of the flight craft at IABG in Ottobrunn, for the copper of its blankets and the silver covers on the two dishes", title: "Cryosat2 test iabg ottobrunn", url: "https://commons.wikimedia.org/wiki/File:Cryosat2_test_iabg_ottobrunn.jpg", licence: "CC BY-SA 3.0 (AndreasSchepers, own work; read 2026-10-14): share-alike, LOOKED AT ONLY, never fetched by the tool and not on any sheet", credit: "AndreasSchepers (Wikimedia Commons)", read: 2026-10-14}], dimensions: {craft_m: [4.6, 2.34, 2.2], siral_reflector_m: [1.2, 1.1], siral_baseline_m: 1.2, nose_down_deg: 6, source: "eoPortal, https://www.eoportal.org/satellite-missions/cryosat-2, OPENED 2026-10-14: 'The spacecraft structure consists of a long rectangular main platform body, surmounted by fixed solar arrays in the form of a tent.'; 'The spacecraft has neither deployable appendages nor any other moving parts except for thruster valves.'; 'The lower surface of this structure is permanently earth facing.'; 'All electronics are mounted on the nadir plate acting as radiator.'; 'The antennas used for radio communication, and the Laser Retroreflector, are mounted on this surface; an emergency antenna for command and monitoring is also fitted on top of the satellite between the solar arrays.'; 'The two SIRAL instrument antenna dishes are mounted on a separate rigid bench in the forward section of the S/C.'; 'In addition, a dedicated SIRAL radiator is mounted at the nose tip.'; 'A slight nose-down attitude of the S/C (6º) is chosen'; 'The S/C has dimensions of 4.6 m x 2.34 m x 2.20 m.'; '2x GaAs body-mounted solar arrays, with 850 W each at normal solar incidence'; '3-axis stabilized local-normal pointing, with 6º nose-down attitude'; 'A set of three star tracker heads'; 'the star tracker accommodation on the antenna bench'; 'The SIRAL design features two receiving antennas forming an interferometer in the cross-track direction with a baseline of 1.2 m'; 'The antenna subsystem consists of two Cassegrain antennas, mounted side-by-side and forming the interferometric cross-track.'; 'The primary super-elliptic reflectors are about 1.1 m x 1.2 m in size.'; 'Figure 2: Illustration of the CryoSat-2 spacecraft with thermal covers on the SIRAL antennas'; 'LRR is accommodated in the nadir plate of the spacecraft'. ESA, 'Facts and figures', https://www.esa.int/Applications/Observing_the_Earth/FutureEO/CryoSat/Facts_and_figures, OPENED 2026-10-14 (words and numbers only): 'Launch: 8 April 2010'; 'Power: 2 × GaAs body-mounted solar arrays, each delivering 850 W'; 'Orbit: Mean altitude of 719 km and inclination of 92°; low Earth, polar, non-Sun-synchronous'. ESA, 'Satellite', https://www.esa.int/Applications/Observing_the_Earth/FutureEO/CryoSat/Satellite, OPENED 2026-10-14: 'The solar panels are rigidly fixed to the satellite body. Forming a 'roof' with a carefully optimised angle'; 'An S-band helix antenna fixed to the satellite's underside'; 'Next to it, an X-band antenna'. OURS: how the 4.6 m divides (3.5 m of body and roof, 1.05 m of nose), the roof's ridge 1.1 m above the body's top (no angle is given), the reflectors drawn round, every place on the Earth face, the star trackers' places on the bench.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BODY: 'a long rectangular main platform body' (cited), 3.5 m of it, 2.34 m wide (cited) and 1.1 m deep, in copper blankets, its Earth face a pale radiator (cited: 'the nadir plate acting as radiator'). THE ROOF: two fixed panels of cells 'in the form of a tent' (cited), 3.5 by 1.6 m, from the body's top edges to a ridge 1.1 m above them (the angle OURS: ESA says only 'a carefully optimised angle'), gable ends in copper; the emergency antenna on the ridge (cited as 'on top of the satellite between the solar arrays'). THE NOSE: a bench across the craft (cited as 'a separate rigid bench in the forward section'), the two SIRAL antennas under it side by side, 1.2 m apart (cited baseline), each a dish of 1.12 m (the reflectors are cited as 1.2 x 1.1 m super-elliptic; drawn round) under silver covers (cited in a figure's caption), looking at the Earth; three star trackers on the bench (cited); the SIRAL radiator at the nose tip (cited). 4.67 x 2.34 x 2.21 m as built (cited: 4.6 x 2.34 x 2.20 m). ON THE EARTH FACE: the S-band helix and the X-band antenna beside it, the laser reflector, the DORIS antenna (each cited as there; places and sizes ours). THE WHOLE CRAFT IS PITCHED 6 DEGREES NOSE DOWN (cited: 'with 6º nose-down attitude'). The -Y half of the roof and the second dish are each built as placed parts, not a mirror image: no mirror pass was run. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the length along X with the nose at +X, the dishes on +Z (the Earth), the roof to the sky. HOW IT FLIES, in part: the dishes to the Earth and the nose down, as the real one; NOT how it flies: its orbit is not Sun-synchronous (cited) and its nose leads along the track, while the app turns the whole craft about the vertical to keep X square to the Sun. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle (a large face of a box as a grid of such quads: `even: true`, batch nine), so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 902 triangles, 8 colours"}
  - {id: smos, file: site/models/smos.glb, kb: 53, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 36036 (SMOS), the one record in the live saved data of 2026-10-12: ESA's soil moisture and ocean salinity mission, the Y of MIRAS on a Proteus bus. It had no route: it wore the shape of its class, a box with two wings and a dish; public #958", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms); ESA's own pictures and models were NOT used: ESA's terms forbid derivative works", licence: "CC BY 2.0 (DLR's photographs of a scale model, which the layout was read off: looked at, with credit; nothing of the pictures is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). NO ESA PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and DLR's photographs of a model of SMOS (DLR German Aerospace Center, CC BY 2.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PHOTOGRAPH OF A SCALE MODEL at a show, not of the craft: the white arms with a row of gold discs and gold hinges, the silver structure with dark corners under the Y, the orange bus with a white radiator, one wing of four panels in orange frames on a boom from the bus's side", title: "SMOS scale model (7628219434) (2)", url: "https://commons.wikimedia.org/wiki/File:SMOS_scale_model_(7628219434)_(2).jpg", licence: "CC BY 2.0 (DLR German Aerospace Center, flickr; the Commons API's LicenseShortName, read 2026-10-14)", credit: "DLR German Aerospace Center", read: 2026-10-14}, {use: "drawn from; THE SAME MODEL from the end of one arm: that arm square to the two wings' booms, the launch ring at the bus's far end", title: "SMOS scale model (7628218776) (2)", url: "https://commons.wikimedia.org/wiki/File:SMOS_scale_model_(7628218776)_(2).jpg", licence: "CC BY 2.0 (DLR German Aerospace Center, flickr; the Commons API's LicenseShortName, read 2026-10-14)", credit: "DLR German Aerospace Center", read: 2026-10-14}], dimensions: {bus_m: [1.0, 1.0, 1.0], arm_m: 4, y_diameter_m: 8, tilt_deg: 32.5, licef: 69, licef_diameter_m: 0.165, wing_panels: 4, wing_panel_m: [1.5, 0.8], source: "eoPortal, https://www.eoportal.org/satellite-missions/smos, OPENED 2026-10-14: 'The S/C bus is a box, nearly 1 m per side, with all the equipment units accommodated on four lateral panels and the lower plate.'; 'Electrical power is generated by two symmetric wing arrays with single-axis step motors. Each wing is composed of four deployable panels (1.5 m x 0.8 m) covered with silicon cells'; 'The SMOS spacecraft features an attitude in which the boresight of the antenna is forward tilted by 32.5º with respect to nadir. This configuration enables measurements at line-of-sight angles between 0º - 50º. The satellite employs yaw steering about the local normal.'; 'local equator crossing time at 6:00 AM on ascending node'; 'three coplanar arms consisting of an elementary antenna regularly spaced (0.875 λ, maximum redundancy) in a Y-shaped configuration'; 'each deployable antenna arm has a length of 4 m'; 'MIRAS, operating at L-band (1.4-1.427 GHz, or 21 cm wavelength), employs a Y-shaped antenna arrangement, consisting of three arms, separated at 120º.'; 'Each arm consists of three deployable segments.'; 'There are 69 antenna elements - the so-called LICEF (Lightweight Cost-Effective Front-end) receivers -, which are equally distributed over the three arms and the central structure (hub).'; 'All six LICEF receivers in each segment and the eighteen LICEF receivers on the Hub'. ESA, 'Facts and figures', https://www.esa.int/Applications/Observing_the_Earth/FutureEO/SMOS/Facts_and_figures, OPENED 2026-10-14 (words and numbers only): 'Satellite: Proteus platform adapted to the needs of SMOS'; 'with 69 antenna receivers distributed on a Y-shaped deployable antenna array and central hub'; 'Launched: 2 November 2009'; 'Sun-synchronous, quasi-circular, dusk-dawn'. ESA, 'Instrument', https://www.esa.int/Applications/Observing_the_Earth/FutureEO/SMOS/Instrument, OPENED 2026-10-14: 'once SMOS was in orbit each of the arms unfolded to form an unusual three-pointed star shape. Hence, with a diameter of eight metres, MIRAS is often dubbed a 'star in the sky'.'; 'One LICEF antenna weighs 190 g, is 165 mm in diameter and 19 mm high.' ESA, 'Satellite', https://www.esa.int/Applications/Observing_the_Earth/FutureEO/SMOS/Satellite, OPENED 2026-10-14: 'The platform is small, occupying just one cubic metre'; 'In launch configuration, the overall dimensions, including the SMOS instrument, fitted into a cylinder 2.4 m high and 2.3 m in diameter.'; 'Each array is made up of four panels, each measuring 1.5×0.8 m. Since the orbit is Sun-synchronous, the solar arrays remain static.' READ: eoPortal's '4 m' arm and ESA's 'diameter of eight metres' are read as one number, the tips 4.0 m from the middle; it agrees with the spacing: six receivers a segment at 0.875 of 21.2 cm make a segment 1.11 m, three of them 3.34 m, and a hub of 0.66 m to the root. READ OFF DLR'S PHOTOGRAPHS of a model: the white arms with a row of gold discs, gold hinges between the segments; the silver central structure with dark corners under the Y; the orange bus with a white radiator; the launch ring at its far end; each wing on a boom from the bus's side, the panels' long side square to the boom, orange frames; one arm square to the booms. OURS: the hub's size and its 18 receivers' places (three in each arm's row, nine between), the arm's width and thickness, the boom's length, which arm points which way about the Sun.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE Y: three white arms 120 degrees apart (cited), each of three segments (cited) with gold hinges between them, their tips 4.0 m from the middle (ESA's 'diameter of eight metres' and eoPortal's '4 m' arm read as one number; it agrees with six receivers a segment at the cited 0.875 of the 21 cm wavelength). 69 gold receivers 165 mm across (cited): six on each segment and eighteen on the hub (both cited), in a row along each arm (the row and the hub's places ours). The arm's 0.5 m width and the hub's 0.66 m to an arm's root are OURS, read off the photographs. UNDER THE Y, away from the Earth: the instrument's central structure in silver with dark corners (read off the photographs; size ours), then the Proteus bus, 'a box, nearly 1 m per side' (cited), in orange with a white radiator, the launch ring at its far face. TWO WINGS, symmetric (cited), each four panels of 1.5 x 0.8 m (cited) in orange frames on a 1.1 m boom (ours) from the bus's side, along X, cells to +Y; one arm points to -Y, square to the booms (read off the photographs; which arm points to the Sun's side or away is ours). THE WHOLE CRAFT IS PITCHED 32.5 DEGREES about Y, the Y's face forward of the nadir (cited: 'the boresight of the antenna is forward tilted by 32.5º with respect to nadir'). The second wing is built as a placed part, not a mirror image: no mirror pass was run. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the wings along X with their cells to +Y, the Y's face on +Z before the pitch. THIS IS HOW THE CRAFT FLIES in what the pages say: a dawn-dusk orbit ('6:00 AM on ascending node', cited), so the Sun is square to the track; the wings along the track and static ('Since the orbit is Sun-synchronous, the solar arrays remain static', ESA), their cells to the Sun; the antenna tilted forward. +X is drawn as forward; which end of X leads on the map is the app's, not the craft's. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle (a large face of a box as a grid of such quads: `even: true`, batch nine), so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 6 672 triangles, 8 colours"}
  - {id: alos-2, file: site/models/alos-2.glb, kb: 74, budget_tris: 12000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 39766 (ALOS-2, Daichi-2), the one record in the live saved data of 2026-10-12: JAXA's L-band radar satellite, launched in 2014. It was, and while this file is on its way still is, the shared radar blade (scene/models.js `radar`: Sentinel-1's 12.3 m antenna under a bus with two wings), which is not this craft. ALOS (DAICHI) and ALOS-4 are other craft and keep the blade; public #977", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms); JAXA's own pictures and models were NOT used: the one picture the layout was read off is a visitor's own photograph of JAXA's 1/50 model, given to the public domain", licence: "Public domain (CC0: a visitor's own photograph of JAXA's 1/50 model in the Space Dome at Tsukuba, which the layout was read off; nothing of the picture is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). NO JAXA PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh (the model's stand carries JAXA's name and logo; the file does not).", credit: "3D model: built by Space Radar from published dimensions and a photograph of JAXA's model of ALOS-2 by Syced (CC0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PHOTOGRAPH OF JAXA'S 1/50 MODEL in a case, not of the craft: the gold body on the antenna's back a third of the way along it, a truss on the antenna's back, two paddles of three panels on gold yokes, a dish and white horns on the body's top", title: "Inside JAXA Space Dome 8", url: "https://commons.wikimedia.org/wiki/File:Inside_JAXA_Space_Dome_8.jpg", licence: "CC0 (Syced, own work; the Commons API's LicenseShortName, read 2026-10-14)", credit: "Syced (Wikimedia Commons)", read: 2026-10-14}, {use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): a visitor's photograph of PALSAR-2's face in the National Museum of Nature and Science, Tokyo, for the white face with square copper-edged patches", title: "ALOS-2-PALSAR-2", url: "https://commons.wikimedia.org/wiki/File:ALOS-2-PALSAR-2.jpg", licence: "CC BY-SA 4.0 (テレストレラッソ, own work; read 2026-10-14): share-alike, LOOKED AT ONLY, never fetched by the tool and not on any sheet", credit: "テレストレラッソ (Wikimedia Commons)", read: 2026-10-14}], dimensions: {span_m: 16.5, height_m: 3.7, antenna_long_m: 9.9, antenna_wide_m: 2.9, antenna_panels: 5, paddles: 2, source: "eoPortal, https://www.eoportal.org/satellite-missions/alos-2, OPENED 2026-10-14: 'Spacecraft mass 2120 kg'; 'Spacecraft size (deployed) 9.9 m (x) x 16.5 m (y) x 3.7 m (z)'; 'Spacecraft power generation 5.2 kW (EOL)'; 'It has a size of 9.9 m (azimuth) x 2.9 m (elevation) and is composed of 5 electrical panels. The antenna consists of 1,080 radiation elements which are driven by 180 TRMs'; 'Antenna width, length 2.9 m, 9.9 m'; 'Look direction Right or left'; 'Agile spacecraft: ALOS-2 has a body pointing function of ±30º in the roll axis.'; 'the requirement for attitude manoeuvring is up to 2 minutes from the Earth pointing attitude to right- or left-looking'; 'the required spacecraft maneuver for this observation change can be accomplished in about 2 minutes from the nominal nadir look direction'; 'Why does ALOS-2 have two solar array paddles, but ALOS only had one?'; 'ALOS-2's radar pointed towards the nadir direction (directly towards Earth), so a second paddle would not obstruct its view.'; 'Sun Acquisition Mode then began in which the solar array paddles extended and the satellite orientated itself such that the paddles faced the sun.'; 'LSDN (Local Sun time on Descending Node) = 12:00 hours ± 15 min'; 'The payload downlink is provided in Ka-band at 278 Mbit/s via the DRTS (Data Relay Technology Satellite) of JAXA'. READ: the antenna's 9.9 m is the craft's x (the same number twice), so x is along the track and the paddles' 16.5 m is across it. READ OFF A VISITOR'S PHOTOGRAPH OF JAXA'S 1/50 MODEL (CC0): the gold body on the antenna's back about a third of the way along it, a truss on the antenna's back, two paddles of three panels on gold yokes from the body's sides, a dish and white horns on the body's top. OURS: the bus's size, the paddles' split into panels and their width, the yoke's length, everything on the bus's top, the patches on the face (6 x 8 a panel for 216 elements). THE ROLL IS NOT DRAWN: the page gives ±30 degrees either way from a nominal Earth-pointing attitude, so there is no one angle to draw; the craft is level, the antenna's face to the Earth.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE RADAR ANTENNA: PALSAR-2, 9.9 m along the track by 2.9 m across, of five panels (all cited), under the body: its Earth face white with square copper-edged patches, 6 x 8 a panel (OURS: the real face has 1,080 elements, cited), its back gold with a cross of rods on each panel (read off the photograph). THE BODY: a gold box of 2.0 x 2.4 x 2.0 m (OURS) on four stand-offs over the antenna, about a third of the way along it (read off the photograph), dark radiator patches and a gold upper deck; on its top the data-relay antenna, a 0.9 m dish on a short mast (the Ka-band link to the DRTS cited; the size ours), two white X-band horns and two star trackers (read off the photograph; sizes ours). TWO SOLAR PADDLES (cited as two) across the track, each a gold triangular yoke of 1.25 m and three panels of 1.95 x 3.0 m (the split ours), 16.5 m tip to tip (cited as the craft's y), turned 45 degrees toward the Sun's side. 16.5 x 9.88 x 3.65 m as built (cited: 9.9 x 16.5 x 3.7 m). The second paddle is built as a placed part, not a mirror image: no mirror pass was run. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the antenna's face on +Z (the Earth), its length along Y, the paddles along X. HOW IT FLIES, in part: in its noon orbit ('LSDN ... = 12:00 hours', cited) the Sun is in the orbit's plane, so the paddles' axis across the track is square to the Sun, as the app keeps X; the real paddles turn to follow the Sun and the file holds them at 45 degrees. THE FILE IS LEVEL, the craft's nominal 'Earth pointing attitude' (cited); for each pass the real craft rolls up to 30 degrees to look left or right (cited: 'a body pointing function of ±30º in the roll axis'), so no one angle is how it flies. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle (a large face of a box as a grid of such quads: `even: true`, batch nine), so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 9 632 triangles, 8 colours"}
  - {id: glonass-m, file: site/models/glonass-m.glb, kb: 38, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "the GLONASS-M records (`COSMOS nnnn [GLONASS-M]`), 20 in the live saved data of 2026-10-12, by number as they were: Russia's navigation satellite on the pressurised bus. They wore the procedural drum (scene/models.js NAV_SHAPES `navigation-glonass-m`), which stays as what is drawn while the file loads; public #988", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms); no Roscosmos or ISS Reshetnev picture or model was used; the maker's dimensioned drawings, sent to the IGS by the GLONASS information centre, were READ for their numbers and are NOT reproduced", licence: "CC0 (two visitors' photographs of models of the craft, which the layout was read off: looked at, with credit; nothing of the pictures is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). NO ROSCOSMOS OR RESHETNEV PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and photographs of models of GLONASS-M by Krassotkin and the Museum of Cosmonautics (CC0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PHOTOGRAPH OF A MODEL in the museum of the Moscow Aviation Institute, from above: the light drum, the platform at the Earth end with a ring of helices and a bronze retroreflector panel, two wings of four panels in two rows each", title: "Wikitrip to MAI museum 2016-02-02 073", url: "https://commons.wikimedia.org/wiki/File:Wikitrip_to_MAI_museum_2016-02-02_073.JPG", licence: "CC0 (Krassotkin, own work; the Commons API's LicenseShortName, read 2026-10-14)", credit: "Krassotkin (Wikimedia Commons)", read: 2026-10-14}, {use: "drawn from; A PHOTOGRAPH OF A MODEL in the Museum of Cosmonautics: the drum's gold far end and dark band, the white platform, a wing on its boom between two rows of panels", title: "Glonass2 (14988917775)", url: "https://commons.wikimedia.org/wiki/File:Glonass2_(14988917775).jpg", licence: "CC0 (the Museum of Cosmonautics, Moscow, on Flickr; the Commons API's LicenseShortName, read 2026-10-14)", credit: "Музей Космонавтики (Wikimedia Commons)", read: 2026-10-14}], dimensions: {length_m: 3.05, width_m: 2.71, drum_diameter_m: 1.63, drum_length_m: 2.03, solar_area_m2: 30.85, span_m: 12.6, source: "V. Mitrikas (MCC), '[IGSMAIL-5104]: GLONASS-M dimensions and center-of-mass correction', 2005-02-16, https://lists.igs.org/pipermail/igsmail/2005/006475.html, OPENED 2026-10-14: 'please find hereafter the information issued by NPO PM (Krasnoyarsk) concerning modelling of GLONASS-M SV.'; 'SV GLONASS-M permanently supports 3-axis orientation.'; 'OX axis is pointed by SV radius vector from the Earth center. OY axis always lies in Sun-SV-Earth plane and pointed opposite to the Sun direction'; 'Solar panels keep up the Sun direction.'; 'L1 and L2 antenna phase centers coincide and have the following coordinates in the body-fixed RF. X = -2183 Y = +545 Z = 0'; 'Total square of the solar panels is 30.85 sqm'; 'The square of the SV body in XOZ plane is about 4.2 sqm.'; 'SV mass after the separation of the launcher id 1415 kg.' Duan, Hugentobler, Hofacker, Selmke, 'Improving solar radiation pressure modeling for GLONASS satellites', Journal of Geodesy 94:72 (2020), https://link.springer.com/article/10.1007/s00190-020-01400-9 (Open Access, CC BY 4.0), OPENED 2026-10-14: 'The GLONASS-M satellite body consists of two parts: a cylindrical container and boxlike antenna platform. As published by the GLONASS information center (www.glonass-iac.ru), GLONASS-M satellites have a width of 2.71 m and a length of 3.05 m.'; 'the antenna platform of GLONASS-M satellites is larger than the diameter of the cylindrical container'; 'By making use of all the dimension information, we assume that the diameter of the cylinder is 1.63 m, the additional part of the antenna panel above the cylindrical container is 0.5 m, and the length of the cylindrical container is 2.03 m.'; Table 5: '+x 4.530', 'sp 30.850'. eoPortal, https://www.eoportal.org/satellite-missions/glonass, OPENED 2026-10-14: 'It uses a three-axis-stabilised, nadir-pointing, pressurised bus with a mass of approximately 1,415 kg'; 'GLONASS-M/-K/-K2 also carry laser retroreflectors'. READ OFF THE CC0 PHOTOGRAPHS OF TWO MODELS: the light drum with a gold far end and a dark band, the white platform at the Earth end with a ring of helices and a bronze retroreflector panel, two wings of four panels in two rows each on a boom between the rows, the booms leaving the drum near its far end. DERIVED: each panel 2.32 x 1.66 m; 12.6 m tip to tip. OURS: the platform's depth, the helices' height and count, the drive housings, the booms' place and the panels' roots.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BODY: 'a cylindrical container and boxlike antenna platform' (Duan et al. 2020, CC BY 4.0): a silver drum 1.63 m across and 2.03 m long (their assumption 'from all the dimension information') with a dark band and a gold far end (read off the photographs), the craft 3.05 m long (cited, the GLONASS information centre's number as they give it). THE ANTENNA PLATFORM at the Earth end, white, 0.5 m beyond the drum on one side (cited), on the side AWAY from the Sun because the maker gives the antenna's phase centre at 'Y = +545' mm and its Y points away from the Sun (cited); its 0.6 m depth OURS. On it the navigation antenna, a ring of eight helices round one (read off the photographs; count and 0.42 m height OURS), and a bronze retroreflector panel (carried: eoPortal; size and place OURS). TWO WINGS, 30.85 m2 in all (cited, the maker's number via the MCC), each four panels in two rows on a boom between the rows (read off the photographs), each panel 2.32 x 1.66 m (DERIVED from the area in the photographs' proportion), the booms from the drum's middle (OURS), 0.54 m drive housings that make the cited 2.71 m width (OURS); 12.6 m tip to tip, DERIVED: NO PAGE OPENED GIVES THE SPAN (catalogue sites say 7.2 and 7.8 m, which the cited area does not fit in this layout). 12.6 x 2.19 x 3.75 m as built. The second wing is built as a placed part, not a mirror image: no mirror pass was run. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the maker's -X (the Earth) is +Z, its Z (the wing axis) is X, its -Y (the Sun) is +Y. THIS IS HOW THE CRAFT FLIES, as the maker's letter says: Earth-pointing, the Sun in the body's X-Y plane, 'Solar panels keep up the Sun direction'; the app does not turn the wings on their axis. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle (a large face of a box as a grid of such quads: `even: true`), so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 588 triangles, 7 colours"}
  - {id: glonass-k, file: site/models/glonass-k.glb, kb: 32, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "the GLONASS-K (K1) records (`COSMOS nnnn [GLONASS-K]` and `[GLONASS-K1]`), 7 in the live saved data of 2026-10-12: Russia's navigation satellite on the unpressurised Express-1000 bus, by number, and the two whose numbers are placeholders (100460, 100744) by the name's bracket. They wore the procedural box (`navigation-glonass-k`, 1 x 1 x 2 m from a catalogue site), which stays as what is drawn while the file loads. GLONASS-K2 is a larger craft and keeps the family box; public #988", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms); no Roscosmos or ISS Reshetnev picture or model was used; the maker's dimensioned drawings, sent to the IGS by the GLONASS information centre, were READ for their numbers and are NOT reproduced", licence: "This project's own shape, under this repository's licence, built from published numbers (facts): the maker's dimensioned drawings were read and are NOT reproduced. NO FREE PICTURE OF THE CRAFT WAS FOUND: two share-alike photographs of models were looked at only (named under references) and nothing of them is in the file. NO ROSCOSMOS OR RESHETNEV PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions (the maker's drawings, via the GLONASS information centre; no free picture of the craft)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): a photograph of a model at MAKS 2015, for the bronze of the blankets and the round retroreflector panel on the Earth face", title: "Glonass-K - MAKS2015part8-12", url: "https://commons.wikimedia.org/wiki/File:Glonass-K_-_MAKS2015part8-12.jpg", licence: "CC BY-SA 4.0 (Vitaly V. Kuzmin; read 2026-10-14): share-alike, LOOKED AT ONLY, never fetched by the tool and not on any sheet", credit: "Vitaly V. Kuzmin (Wikimedia Commons)", read: 2026-10-14}, {use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): a photograph of the full-size model at CeBIT 2011, for the horn on the Earth face", title: "Glonass K Navigation Spacecraft model at Cebit 2011 Satellite, general view from the right", url: "https://commons.wikimedia.org/wiki/File:Glonass_K_Navigation_Spacecraft_model_at_Cebit_2011_Satellite,_general_view_from_the_right.jpg", licence: "CC BY-SA 2.0 (MKonair; read 2026-10-14): share-alike, LOOKED AT ONLY, never fetched by the tool and not on any sheet", credit: "MKonair (Wikimedia Commons)", read: 2026-10-14}], dimensions: {length_m: 2.66, width_m: 1.6, depth_m: 0.795, earth_end_m: 2.18, panel_m: 1.6, panel_width_m: 2.65, yoke_m: 0.905, solar_area_m2: 16.96, span_m: 9.2, source: "V. Mitrikas (GLONASS information centre), 'G-K mass, dimension and orientation', a letter to the IGS analysis centres of 2011-08-24, http://acc.igs.org/glonass/GLONASS-K_mitrikas_24aug11.txt, OPENED 2026-10-14: 'please find hereafter the official information on G-K dimensions and orientation. The original letter was prepared by JSC Information satellite systems Reshetnev Company (formerly NPO PM).'; 'SV GLONASS-K permanently supports 3-axis orientation. The origin of the body-fixed RF coincides with the S/V center of mass. OX axis is pointed by SV radius vector from the Earth center. OY axis lies in Sun-SV-Earth plane and is pointed opposite to the Sun direction. OZ axis forms right-handed RF. Solar panels keep up the Sun direction.'; 'L1 : (-1561 mm, 6 mm, 0), L2 : (-1431 mm, 6 mm, 0), L3 : (-1798.5 mm, 626 mm, -570 mm).'; 'SLR : (-1471 mm, 0, 0)'; 'The S/V mass is 935 kg. Total dimension of solar panels is 16.96 m^2.'; 'Few simple figures of the S/V dimensions are attached to this message. Comments: Fig. 1 - 3 - S/V body, Fig.4 - Solar panels.' ITS FIGURES, http://acc.igs.org/glonass/Fig1.jpg to Fig4.jpg, OPENED AND READ 2026-10-14, NOT REPRODUCED: Fig. 1 (X-Z) the body '2660' long, the centre of mass '1346' from the far end, the panel of retroreflectors 'Ø633' and '158' deep on the Earth end, engine blocks; Fig. 2 (X-Y) '1600' across, '800' to the axis, the Earth end flaring wider; Fig. 3 (the Earth end) '2180' by '795', the retroreflector ring with a square in it; Fig. 4 (Y-Z) the wing's yoke '905', two panels '1600' each, '2650' wide, '4205' from the body. Duan et al., 'Improving solar radiation pressure modeling for GLONASS satellites', Journal of Geodesy 94:72 (2020), https://link.springer.com/article/10.1007/s00190-020-01400-9 (CC BY 4.0), OPENED 2026-10-14, Table 6: '+z 1.730', '+x 2.210', 'sp 16.960' (m2; the same panels). eoPortal, https://www.eoportal.org/satellite-missions/glonass, OPENED 2026-10-14: 'GLONASS-K was the first GLONASS generation to use an unpressurised bus, with a mass of approximately 935 kg'. OURS: the flare's length, the antenna square's and the horn's sizes, the thruster blocks' sizes, the wing's place along the Earth axis.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BODY, from the maker's own dimensioned drawings (ISS Reshetnev, sent by the GLONASS information centre to the IGS on 2011-08-24, read and not reproduced): a bronze box 2.66 m along the Earth axis, 1.6 m toward the Sun, 0.795 m along the wing axis, flaring to 2.18 m toward the Sun at the Earth end (all cited; the flare's 0.25 m read off the drawing). ON THE EARTH FACE: the panel of retroreflectors, a dark ring 633 mm across and 158 mm deep (cited); in it the L1 and L2 antenna as a white square (cited by its phase centres 247 and 117 mm off the face; size OURS); the L3 antenna 484 mm off the face, 626 mm away from the Sun and 570 mm along the wing axis (cited by its phase centre), drawn as a gold horn (shape read off a share-alike photograph, looked at only; size OURS). Engine blocks where the drawings put them (sizes OURS). TWO WINGS (cited, Fig. 4): a V of two struts 905 mm long, then two panels of 1600 x 2650 mm, 4205 mm from the body to the tip, 16.96 m2 in all (cited twice: the letter and the drawing agree); 9.1 m tip to tip as built (the drawing's 0.795 + 2 x 4.205 = 9.2 m). Their place along the Earth axis OURS. The second wing is built as a placed part, not a mirror image: no mirror pass was run. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the maker's -X (the Earth) is +Z, its Z (the wing axis) is X, its -Y (the Sun) is +Y. THIS IS HOW THE CRAFT FLIES, as the maker's letter says: Earth-pointing, 'OY axis lies in Sun-SV-Earth plane', 'Solar panels keep up the Sun direction'; the app does not turn the wings on their axis. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle (a large face of a box as a grid of such quads: `even: true`), so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 4 950 triangles, 7 colours"}
  - {id: fengyun-3, file: site/models/fengyun-3.glb, kb: 41, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "FENGYUN 3A (32958), 3B (37214), 3C (39260) and 3D (43010) in the live saved data of 2026-10-12: China's polar-orbiting weather satellites of the first batch, SAST's long box with one wing. They had no route and wore the shape of their class (a box with two wings and a dish). The second batch (3E, 3F, 3G with its rain radar, 3H) carries other instruments and keeps that shape; public #996 (Fengyun-4 is not built: no opened page gives its size)", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms); no CMA, NSMC or SAST picture or model was used", licence: "CC BY 2.0 (a visitor's photograph of the Fengyun-3 mockup in the Shanghai Science and Technology Museum, which the layout was read off: looked at, with credit; nothing of the picture is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). NO CMA, NSMC OR SAST PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh (the mockup's placard carries its maker's name; the file does not).", credit: "3D model: built by Space Radar from published dimensions and a photograph of the Fengyun-3 mockup by Hibiki Watabe (CC BY 2.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PHOTOGRAPH OF A MOCKUP in a museum, not of the craft: the silver blankets of the long body, the wing on a truss yoke from the body's upper edge with two panels across, the white reflector above the body at one end, silver housings with dark apertures and white rods on one face", title: "Fengyun 3 satellite mockup", url: "https://commons.wikimedia.org/wiki/File:Fengyun_3_satellite_mockup.jpg", licence: "CC BY 2.0 (Hibiki Watabe; the Commons API's LicenseShortName, read 2026-10-14)", credit: "Hibiki Watabe (Wikimedia Commons, CC BY 2.0)", read: 2026-10-14}], dimensions: {length_m: 4.4, width_m: 2.0, height_m: 2.0, span_m: 10.0, flight_height_m: 3.79, solar_array_m2: 22.464, mwri_reflector_m: 0.9774, source: "eoPortal, https://www.eoportal.org/satellite-missions/fy-3, OPENED 2026-10-14: 'The FY-3 series spacecraft, developed at Shanghai Academy of Spaceflight Technology (SAST), features a 2450 kg hexahedron bus with one solar panel mounted on one side of the satellite's main body.'; 'The spacecraft structure is a hexahedron of 4.4 m x 2.0 m x 2.0 m in a stowed configuration and 4.4 m x 10 m x 3.8 m in the deployed state.'; 'The FY-3 features one solar panel mounted on one side of the satellite's main body (making the span length of the satellite 10 m in flight configuration).'; 'Body size: 4400 mm x 2000 mm x 2000 mm (x, y, z)'; 'Flight size: 4460 mm x 10000 mm x 3790 mm (x, y, z)'; 'The solar array of 22.464 m2 with an output power of 2.48 kW (EOL), average = 1100 W'; 'The FY-3 bus contains three major modules: a service module, a payload module, and a propulsion module.'; MWRI: 'It is comprised of an offset parabolic reflector with the dimensions of 977.4 mm x 897.0 mm which are illuminated by 4 separate feed horns.'; 'The reflector and feed horn are mounted on a drum'; 'the project developed two quasi-optical reflectors with diameters of 860 mm and 1300 mm, respectively, which are mounted on the opposite direction of hot load and the top of satellite platform.' READ OFF THE PHOTOGRAPH OF THE MOCKUP: the silver blankets, the wing on a truss yoke from the body's upper edge with two panels across, the white reflector above the body at one end, silver instrument housings with dark apertures and white rods on one face. OURS: the wing's six-panel split and its flat lie (chosen to fit the cited flight size), every instrument's size and place, the MWRI's drum and tilt.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BODY: a silver box 4.4 x 2.0 x 2.0 m (cited, 'Body size: 4400 mm x 2000 mm x 2000 mm'), its 4.4 m along the track. ONE WING on one side (cited: 'one solar panel mounted on one side of the satellite's main body'), 22.464 m2 (cited) as six panels of 2.2 x 1.702 m, three along and two across (the split OURS; the photograph shows two across), on a 1.3 m truss yoke from the sky-side edge (read off the photograph), LYING FLAT WITH ITS CELLS TO THE SKY so that the craft is the cited flight size: 10.0 x 4.40 x 3.67 m as built (cited: 'Flight size: 4460 mm x 10000 mm x 3790 mm'). ON THE SKY FACE: the microwave imager MWRI on a white drum with its 0.94 m reflector (cited: '977.4 mm x 897.0 mm', 'mounted on a drum'), and its two calibration reflectors of 0.86 and 1.3 m (cited: 'mounted on ... the top of satellite platform'); the drum's size and the reflector's tilt OURS. ON THE EARTH FACE: silver housings with dark apertures for the imaging radiometers, two white drums for the microwave sounders and white rods (instruments cited as flown; every size and place OURS, read off the photograph). The two halves of the wing are placed parts, not a mirror image: no mirror pass was run. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the instruments on +Z (the Earth), the body's length along Y, the wing along +X with its cells to -Z (the sky). HOW IT FLIES, in part: Earth-pointing with one wing on one side, as the pages say; the wing flat, as the cited flight size allows. NOT how it flies: the real wing turns about its axis to follow the Sun, and the app turns the whole craft about the vertical to keep X square to the Sun, so its heading on the map is the app's. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle (a large face of a box as a grid of such quads: `even: true`), so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 608 triangles, 5 colours"}
  - {id: himawari, file: site/models/himawari.glb, kb: 33, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "HIMAWARI-8 (40267) and HIMAWARI-9 (41836), the two records in the live saved data of 2026-10-12: Japan's geostationary weather satellites, 'identical specifications' (eoPortal). They wore the geostationary bus every craft in that ring gets (two long wings and dishes); public #995", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms); no JMA, JAXA or Mitsubishi Electric picture or model is in the file: JMA's sketch of the craft was looked at only, for the layout", licence: "This project's own shape, under this repository's licence, built from published numbers (facts). NO FREE PICTURE OF THE CRAFT WAS FOUND: JMA's sketch was looked at only (named under references; JMA's site terms are said by JMA to be compatible with CC BY 4.0, but a third party may hold rights in it, and this batch treats agency pictures as looked at only) and nothing of it is in the file. NO JAXA OR MITSUBISHI ELECTRIC PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions (no free picture of the craft)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT ONLY (not fetched by the tool, on no sheet): JMA's labelled sketch, for the layout: the imager bench and AHI on the Earth face with the UHF and Ku-band antennas and a star tracker, one solar array of two panels on a yoke, the Ka-band antenna beside the body, the space-environment monitor on a side", title: "himawari89_outward", url: "https://www.data.jma.go.jp/mscweb/en/general/himawari.html", licence: "JMA's site terms (Government of Japan Standard Terms of Use, said by JMA to be compatible with CC BY 4.0; a third party may hold rights): LOOKED AT ONLY, never fetched by the tool and not on any sheet", credit: "Japan Meteorological Agency", read: 2026-10-14}], dimensions: {x_m: 5.2, y_m: 8.0, z_m: 5.3, power_kw: 2.6, source: "eoPortal, https://www.eoportal.org/satellite-missions/himawari-8-9, OPENED 2026-10-14: 'The Himawari-8 and 9 buses were manufactured by MELCO (Mitsubishi Electric Corporation), according to identical specifications. The spacecraft has dimensions 5.2 x 8.0 x 5.3 m, and a launch mass of approximately 3500 kg.'; 'The Himawari spacecraft is 3-axis stabilized with momentum bias. It features a MELCO DS-2000 bus. The overall size of the deployed spacecraft is 5.2 m (X-axis), 8.0 m (Y-axis), and 5.3 m (Z-axis).'; 'The launch mass is ~3500 kg, and the dry mass is 1300 kg.'; 'EPS (Electrical Power Subsystem): The power generated is 2.6 kW, the bus voltage is 100 V, use of a Li-ion battery.'; 'Ka-band for payload data transmission.'; 'Ku-band for TT&C services.'; 'Attitude sensors: Coarse Sun Sensor, Star Tracker, IRU (Inertial Reference Unit), Gyroscope'. JMA Meteorological Satellite Center, 'Himawari-8/9 Spacecraft Overview', https://www.data.jma.go.jp/mscweb/en/general/himawari.html, OPENED 2026-10-14: 'Each of Himawari-8/9 carries a new unit called the Advanced Himawari Imager (AHI).'; 'The Ka-band is used for downlinking meteorological data, and the Ku-band is used for telemetry and command operations.'; 'Attitude control 3-axis attitude-controlled geostationary satellite'; 'Prime Contractor Mitsubishi Electric Corporation'. LOOKED AT ONLY (JMA's sketch on that page): the labels 'AHI (Advanced Himawari Imager)', 'UHF-band Antenna', 'Ku-band Antenna', 'Star Tracker', 'Imager Bench', 'Ka-band Antenna', 'Solar Array Panel', 'Space Environment Data Acquisition Monitor (SEDA)', the axes Xs, Ys, Zs, one array of two panels on a yoke. OURS: EVERY SIZE INSIDE THE CITED ENVELOPE (the body 2.4 x 2.4 x 3.15 m, AHI's housing, the array's panels of 2.2 x 2.4 m, the yoke, the Ka-band dish of 2.4 m), the colours (the blankets dark, the radiators white, read off JMA's artist's view, looked at only).", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. ONLY THE ENVELOPE IS CITED: 'The overall size of the deployed spacecraft is 5.2 m (X-axis), 8.0 m (Y-axis), and 5.3 m (Z-axis)' on 'a MELCO DS-2000 bus'; 8.07 x 5.17 x 5.25 m as built. THE LAYOUT is JMA's sketch (looked at only): a box body, on its Earth face the imager bench with AHI (cited as carried), the UHF antenna as a tapered white stack, the Ku-band antenna and two star trackers (each cited as carried); the Ka-band antenna beside the body (cited as the data downlink); the space-environment monitor on a side (cited); ONE SOLAR ARRAY of two panels on a yoke (2.6 kW, cited). EVERY SIZE INSIDE THE ENVELOPE IS OURS: the body 2.4 x 2.4 x 3.15 m in black blankets with white radiators on the wing-root faces (colours read off JMA's artist's view, looked at only), AHI's silver housing 1.2 x 1.1 x 1.1 m with a sunshade, the dark Ka-band dish of 2.4 m, the array's panels of 2.2 x 2.4 m (10.6 m2: what 2.6 kW wants of triple-junction cells) on a 1.2 m yoke. No solar sail or boom is drawn: JMA's sketch shows none. No mirror pass was run: the craft has one wing. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the Earth face on +Z, the array along +X (JMA's Ys, north-south) with its cells to +Y, the Sun's side, the Ka-band dish on -Y. THIS IS HOW THE CRAFT FLIES: a geostationary craft keeps its Earth face down and its array axis north-south, square to the Sun within 23 degrees; the array turns on that axis once a day, and the app does not turn it. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle (a large face of a box as a grid of such quads: `even: true`), so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 5 016 triangles, 7 colours"}
  # 2026-10-15, batch eleven (public #1075 to #1079): five agencies' OWN published models, the first batch of the second hundred (tracking issue #1172).
  # No shape was made here. Each file was fetched with a User-Agent naming this project and its repository, made ready by the private tool's official.mjs
  # (helper meshes left out, turned and scaled as ONE piece; nothing moved against anything else), then baked by scripts/bake-own-colours.mjs.
  - {id: europa-clipper, file: site/models/europa-clipper.glb, kb: 212, budget_tris: 18000, class: probe, used_for: "JPL Horizons -159, Europa Clipper (data/sample.js `deep-europa-clipper`), on its way to Jupiter. NASA'S OWN PUBLISHED MODEL, so the card says 'drawn from a published model of Europa Clipper'. It was the generic probe; public #1075", source: "https://science.nasa.gov/resource/europa-clipper-3d-model/ (page read 2026-10-15: 'Europa Clipper 3D Model', 'January 15, 2022', 'Credit NASA Visualization Technology Applications and Development (VTAD)', 'A 3D model of NASA's Europa Clipper.', downloads 'glTF File (3D Model) Sep 9, 2023 (34.05 MB)'; the glTF, clipper_spacecraft.glb from assets.science.nasa.gov, 35 706 144 bytes, sha256 a3f5e453...efd4f7fe is the file used)", licence: "Public domain (NASA media usage guidelines), read 2026-10-15. The model's page states no terms of its own and credits NASA's own visualisation team; its menu links 'NASA Brand & Usage Guidelines', https://www.nasa.gov/nasa-brand-center/, whose Images and Media Usage Guidelines (https://www.nasa.gov/nasa-brand-center/images-and-media/) say: 'NASA content – images, audio, video, and media files used in the rendition of 3-dimensional models, such as texture maps and polygon data in any format – generally are not subject to copyright in the United States', and 'NASA should be acknowledged as the source of the material'. The page marks no third-party copyright on this model. The same reading as SWOT's (batch four)", credit: "3D model: NASA (Visualization Technology Applications and Development)", modified: "THE SHAPE IS NASA'S, WHOLE: no part was moved against another, added or stretched, and nothing was rescaled (the file is in metres: its wings span 30.5 m tip to tip, NASA's '100 feet (30.5 meters)' and eoPortal's 'Its solar panels will span about 30 m', https://www.eoportal.org/satellite-missions/europa-clipper, opened 2026-10-15; the high-gain dish is about 3 m across, eoPortal's 'a dish nearly 10 feet (3 meters) wide'). Made ready by the private tool's official.mjs: turned as one piece so that the file's x, z, -y are the app's +X, +Y, +Z (the high-gain dish toward +Z, the wings along X, the cells toward +Y), which is why the route says `axes: 'app'` and it flies as the procedural probe did, the dish toward the world the stage is centred on. Then scripts/bake-own-colours.mjs (--tris=18000 --colours=12): welded on position, 3 045 loose parts under 0.4 % of the model's size dropped (bolts and brackets), 203 662 triangles to 17 928; each triangle given the flat colour NASA's own material and texture show at that place, 12 colours in all, brightness held between 12 % and 93 %; images and texture coordinates removed, normals recomputed with a 40 degree crease. ONE COLOUR THAT IS OURS (--recolour): the cells (`clipper_solar_cells`, 1 600 triangles), whose texture averages to #12111f, a near-black that the toon ramp draws grey, are drawn #2E4E8C, the app's panel blue, as the cells are in NASA's own render of the craft (https://commons.wikimedia.org/wiki/File:Europa_Clipper_spacecraft_model.png, public domain). The nine REASON radar antennas are in the file and stay: 17.9 m rods a few centimetres thick, a hair at the size a visitor sees the craft"}
  - {id: smap, file: site/models/smap.glb, kb: 170, budget_tris: 15000, class: satellite, used_for: "NORAD 40376 (SMAP), in the whole active catalogue: NASA's Soil Moisture Active Passive. JPL'S OWN PUBLISHED MODEL, so the card says 'drawn from a published model of SMAP'. It had no route and was the shape of its class; public #1076", source: "https://smap.jpl.nasa.gov/resources/99/smap-3d-model/ (page read 2026-10-15: 'SMAP 3D Model', 'Credit NASA Visualization Technology Applications and Development (VTAD)', downloads 'glTF File (3D Model) 8.6 MB' and 'USDZ File (3D Model) 4.5 MB'; the glTF, SMAP.glb, 9 020 248 bytes, sha256 6fa722ee...3d1c0c91, is the file used)", licence: "Public domain, read 2026-10-15, as SWOT's file from the same team (batch four). The page states no terms of its own; JPL's image use policy (https://www.jpl.nasa.gov/jpl-image-use-policy/, read that day through a reader: the server answers 403 to curl): 'Unless otherwise noted, images and video on JPL public web sites (public sites ending with a jpl.nasa.gov address) may be used for any purpose without prior permission, subject to the special cases noted below', credit 'Courtesy NASA/JPL-Caltech'; THAT PAGE NAMES IMAGES AND VIDEO AND NOT 3D MODELS, so the model rests on NASA's media usage guidelines, https://www.nasa.gov/nasa-brand-center/images-and-media/: 'NASA content – images, audio, video, and media files used in the rendition of 3-dimensional models, such as texture maps and polygon data in any format – generally are not subject to copyright in the United States'. The page marks no third-party copyright on this model", credit: "3D model: NASA/JPL-Caltech (NASA Visualization Technology Applications and Development)", modified: "THE SHAPE IS JPL'S: no part was moved against another, added or stretched, and nothing was rescaled (the file is in metres: the reflector is 6.0 by 6.2 m across, eoPortal's 'The reflector diameter is approximately 6 m', https://www.eoportal.org/satellite-missions/smap, opened 2026-10-15). Made ready by the private tool's official.mjs: the mesh of node `_root` (a helper cube with a clear texture, 12 triangles) left out; THE MESHES OF THE TWO `antenna_03` NODES (601 triangles each) LEFT OUT: a disc behind the reflector whose texture is 96 % transparent (white rim lines on nothing), which the bake would have made a solid white plate; the rim truss itself is geometry in `arm_etc.001` and stays; every mesh called after its node; turned as one piece so that the file's -x, -z, -y are the app's +X, +Y, +Z (the bus toward the Earth, the boom and reflector away from it, the cells toward +Y), which is why the route says `axes: 'app'`. THE REFLECTOR IS DRAWN SOLID: the file draws a gold mesh through a texture 23 % opaque, and the toon material has no transparency, so the gold surface is opaque, as NASA's own icon of the craft draws it (https://commons.wikimedia.org/wiki/File:SMAP_spacecraft_model.png, public domain). It does not spin (the real one turns 14.6 times a minute). Then scripts/bake-own-colours.mjs (--tris=15000 --colours=10): welded on position, 220 loose parts under 0.4 % of the model's size dropped, 69 501 triangles to 14 755; each triangle given the flat colour JPL's own material and texture show at that place, 10 colours in all, brightness held between 12 % and 93 %; images and texture coordinates removed, normals recomputed with a 40 degree crease. ONE COLOUR THAT IS OURS (--recolour): the cell face of the wing (`shiny_panel_w_PBSDF`, 18 triangles), which the file's texture makes a near-black, is drawn #2E4E8C, the app's panel blue, as in the same NASA icon"}
  - {id: jason-3, file: site/models/jason-3.glb, kb: 109, budget_tris: 12000, class: satellite, used_for: "NORAD 41240 (JASON-3), in the whole active catalogue. JPL'S OWN PUBLISHED MODEL of Jason-3, so the card says 'drawn from a published model of Jason-3'. Until 2026-10-15 it wore NASA's OSTM/Jason-2 file as the sister ship and said so; public #1077. Sentinel-6 Michael Freilich keeps NASA's model of itself (sentinel6.glb)", source: "https://sealevel.jpl.nasa.gov/resources/94/jason-3-3d-model/ (page read 2026-10-15: 'Jason-3 3D Model', 'Published: February 3, 2020', downloads 'glTF File (3D Model) 3.36 MB' and 'USDZ File (3D Model) 1010 KB'; the glTF, Jason_3.glb, 3 518 712 bytes, sha256 18a2161f...5aa49c19, is the file used; the page names no author and no contractor)", licence: "Public domain, read 2026-10-15, as SWOT's and SMAP's. The page states no terms of its own; its footer's 'Image Policy' is JPL's, https://www.jpl.nasa.gov/jpl-image-use-policy/: 'Unless otherwise noted, images and video on JPL public web sites (public sites ending with a jpl.nasa.gov address) may be used for any purpose without prior permission, subject to the special cases noted below', credit 'Courtesy NASA/JPL-Caltech'; THAT PAGE NAMES IMAGES AND VIDEO AND NOT 3D MODELS, so the model rests on NASA's media usage guidelines, https://www.nasa.gov/nasa-brand-center/images-and-media/: 'NASA content – images, audio, video, and media files used in the rendition of 3-dimensional models, such as texture maps and polygon data in any format – generally are not subject to copyright in the United States'. The page marks no third-party copyright on this model", credit: "3D model: NASA/JPL-Caltech", modified: "THE SHAPE IS JPL'S, WHOLE, and was not rescaled: the file is in metres (the Poseidon-3B altimeter's dish is 1.19 m across, eoPortal's 'Antenna diameter 120 cm', https://www.eoportal.org/satellite-missions/jason-3, opened 2026-10-15; the wings span 7.95 m; no page opened that day gives the span). Made ready by the private tool's official.mjs: the mesh of node `_root` (a 1 m helper cube with a clear texture, 12 triangles) left out; every mesh called after its node; turned as one piece so that the file's -x, y, -z are the app's +X, +Y, +Z (the altimeter's dish toward the Earth, the wings along X, the cells toward +Y), which is why the route says `axes: 'app'`. Then scripts/bake-own-colours.mjs (--tris=12000 --colours=10): welded on position, 24 loose parts under 0.4 % of the model's size dropped, 12 596 triangles to 12 000; each triangle given the flat colour JPL's own material and texture show at that place, 10 colours in all, brightness held between 12 % and 93 %; images and texture coordinates removed, normals recomputed with a 40 degree crease. ONE COLOUR THAT IS OURS (--recolour): the cell face of the two wings (`shiny_panel`, 16 triangles), which the file's texture makes a near-black, is drawn #2E4E8C, the app's panel blue, as the cells are in NASA's own render of this model (https://commons.wikimedia.org/wiki/File:Jason-3_spacecraft_model_1.png, public domain, from science.nasa.gov/toolkits/spacecraft-icons)"}
  - {id: curiosity, file: site/models/curiosity.glb, kb: 241, budget_tris: 18000, class: site, used_for: "Gale crater on Mars (registry/sites.yaml `gale`), where Curiosity has driven since 2012. NASA'S OWN PUBLISHED MODEL of Curiosity, so the card says 'drawn from a published model of Curiosity'. Until 2026-10-15 Gale wore Perseverance's file as 'a rover of the design Curiosity and Perseverance share' and said so; public #1078", source: "https://science.nasa.gov/resource/curiosity-3d-model/ (page read 2026-10-15: 'Curiosity 3D Model', 'April 22, 2019', 'Credit NASA Visualization Technology Applications and Development (VTAD)', 'A 3D model of the Curiosity Mars rover.', downloads 'glTF File (3D Model) Sep 9, 2023 (11.31 MB)'; the glTF, Curiosity_static.glb from assets.science.nasa.gov, 11 860 016 bytes, sha256 69b31066...1bda2c94, is the file used). NASA 3D Resources' own Curiosity (github.com/nasa/NASA-3D-Resources, '3D Models/Curiosity Rover (MSL)', and science.nasa.gov/3d-resources/curiosity-rover-msl/) is two .blend files, 'Clean' and 'Dirty'; no Blender was at hand, and the glTF of the same rover on NASA Science made converting one unnecessary", licence: "Public domain (NASA media usage guidelines), read 2026-10-15: the page states no terms of its own and credits NASA's own visualisation team; https://www.nasa.gov/nasa-brand-center/images-and-media/: 'NASA content – images, audio, video, and media files used in the rendition of 3-dimensional models, such as texture maps and polygon data in any format – generally are not subject to copyright in the United States'. NASA 3D Resources says of its own Curiosity files 'These assets are free and without copyright.' The page marks no third-party copyright on this model", credit: "3D model: NASA (Visualization Technology Applications and Development)", modified: "THE SHAPE IS NASA'S, WHOLE, not turned and not rescaled: the file is in metres with +Y up, as glTF asks, so it stands on the ground as published (scene/heroes.js standOnGround), the arm forward. It checks against NASA's 'About the size of a small SUV — 10 feet long, 9 feet wide and 7 feet tall), not including the arm' (https://science.nasa.gov/mission/msl-curiosity/, opened 2026-10-15): 2.78 m wide and 2.22 m to the top of the mast in the file, against 2.7 and 2.1 m; 3.95 m long with the arm out in front. Then scripts/bake-own-colours.mjs (--tris=18000 --colours=10): welded on position, 7 loose parts under 0.4 % of the model's size dropped, 51 305 triangles to 17 984; each triangle given the flat colour NASA's own textures show at that place (the textures are photographs with their shading and dust in them, so the flat colours are a mottle of light and dark greys), 10 colours in all, brightness held between 12 % and 93 %; images and texture coordinates removed, normals recomputed with a 40 degree crease. No colour is ours"}
  - {id: sorce, file: site/models/sorce.glb, kb: 102, budget_tris: 12000, class: satellite, used_for: "NORAD 27651 (SORCE), in the whole active catalogue: NASA's Solar Radiation and Climate Experiment (2003 to 2020), still in orbit. NASA'S OWN PUBLISHED MODEL, so the card says 'drawn from a published model of SORCE'. It had no route and was the shape of its class; public #1079", source: "https://github.com/nasa/NASA-3D-Resources — 3D Models/Solar Radiation and Climate Experiment (SORCE) (the .glb, 366 492 bytes, sha256 8ec50508...aa2ce10d, Draco-compressed; read 2026-10-15)", licence: "Public domain (NASA media usage guidelines), read 2026-10-15: NASA 3D Resources' README, 'These assets are free and without copyright.'; https://www.nasa.gov/nasa-brand-center/images-and-media/: 'NASA content – images, audio, video, and media files used in the rendition of 3-dimensional models, such as texture maps and polygon data in any format – generally are not subject to copyright in the United States'", credit: "3D model: NASA", modified: "THE SHAPE IS NASA'S, WHOLE: no part was moved against another, added or stretched. Made ready by the private tool's official.mjs: read through its Draco decoder and written plain; the 14 triangles of material `Solar Panel 2` that face the file's -y given the material `Solar Panel 1_bottom` (the file gives that one wing a single material front and back, where the other five have a `_bottom`, so its back would have been drawn as cells); NOT TURNED (SORCE pointed its instruments and its six wings at the Sun, and the app has no Sun-pointing attitude for a satellite, so it keeps the seeded constant angle every unturned published mesh gets); scaled as one piece by 0.0135 so that the body (the meshes of layers 1, 6, 7 and 8, wings left out) is 1.48 m long, eoPortal's figure as quoted in public #1079 on 2026-10-14 ('The S/C dimensions are: 1.48 m in height and 1.12 m in diameter', https://www.eoportal.org/satellite-missions/sorce; on 2026-10-15 that address answered eoPortal's 52 607-byte page for a mission it does not have, so the sentence was not read again). The hexagonal body then measures 1.05 m across its corners against the cited 1.12 m diameter, 6 % less, left as NASA drew it; the six wings reach 3.3 m tip to tip. Then scripts/bake-own-colours.mjs (--tris=12000 --colours=10): welded on position, 24 loose parts under 0.4 % of the model's size dropped, 115 513 triangles to 11 995; each triangle given the flat colour NASA's own materials state at that place, 10 colours in all, brightness held between 12 % and 93 %; normals recomputed with a 40 degree crease. OUR COLOURS AND ROLES (--recolour): the six wings' sunward faces (`Solar Panel 1` to `6`, 78 triangles), which the file states plain white, are drawn #2E4E8C, the app's panel blue, as the cells are in NASA's own icon of the craft (https://commons.wikimedia.org/wiki/File:SORCE_spacecraft_model.png, public domain, from science.nasa.gov/toolkits/spacecraft-icons); the wings' backs (`Solar Panel n_bottom`, `Solar Panels_White`) and `Side Panels` keep the file's white and grey and are shaded as painted structure, and the gold blankets `Trapezoid Panels` and `Foil Panel 1` keep the file's gold and are shaded as foil: the bake reads `panel` in a material's name as solar cells, which these are not"}
  - {id: psyche, file: site/models/psyche.glb, kb: 44, budget_tris: 10000, class: probe, kind: built-from-dimensions, used_for: "JPL Horizons -255, Psyche (data/sample.js `deep-psyche`), on its way to the metal-rich asteroid 16 Psyche: NASA's orbiter on Hall thrusters, a black bus with a 2 m dish and two five-panel cross-shaped wings. It was the generic probe; public #1080", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA Science's 3D models, 100 resources listed 2026-10-15, and NASA's 3D Resources, 1 583 paths, have none of this craft); NASA's and JPL's own pictures (public domain) were looked at for the layout and are not in the file", licence: "Public domain (NASA/JPL's pictures, which the layout was read off: looked at, with credit; nothing of them is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and NASA/JPL pictures (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; NASA's ARTIST'S CONCEPT of the craft with its five-panel wings (PIA21499): the cross panels on either side of the MIDDLE panel of three, the dish on the top face, the yoke", title: "PIA21499 - Artist's Concept of Psyche Spacecraft with Five-Panel Array", url: "https://commons.wikimedia.org/wiki/File:PIA21499_-_Artist%27s_Concept_of_Psyche_Spacecraft_with_Five-Panel_Array.jpg", licence: "Public domain (NASA/JPL-Caltech/Arizona State Univ./Space Systems Loral/Peter Rubin; NASA photojournal PIA21499; Commons' LicenseShortName, read 2026-10-15)", credit: "NASA/JPL-Caltech/ASU/SSL/Peter Rubin", read: 2026-10-15}, {use: "drawn from; JPL's diagram of the craft with its instruments numbered and '24,7 m.' tip to tip: the dish on the top face, the tripod over it, the magnetometer's boom, the thrusters low on the body, the wings low on the sides", title: "Psyche-spacecraft-diagram", url: "https://commons.wikimedia.org/wiki/File:Psyche-spacecraft-diagram.png", licence: "Public domain (NASA/Caltech/JPL, from 'Navigation Models for Psyche Electric Propulsion Uncertainty', trs.jpl.nasa.gov; Commons' LicenseShortName, read 2026-10-15)", credit: "NASA/JPL-Caltech", read: 2026-10-15}, {use: "looked at, with credit; NASA's illustration: the black blankets with white radiator panels, the silver dish, the gold DSOC tube", title: "Psyche Spacecraft (Artist's Concept)", url: "https://commons.wikimedia.org/wiki/File:Psyche_Spacecraft_(Artist%27s_Concept).jpg", licence: "Public domain (NASA/JPL-Caltech; Commons' LicenseShortName, read 2026-10-15)", credit: "NASA/JPL-Caltech", read: 2026-10-15}], dimensions: {bus_m: 2.2, bus_depth_m: 2.4, height_m: 4.9, span_m: 24.7, width_m: 7.3, array_area_m2: 75, hga_m: 2.0, booms_m: 2.0, source: "NASA Science, 'Psyche Spacecraft', https://science.nasa.gov/mission/psyche/spacecraft/, OPENED 2026-10-15: 'With its solar panels deployed at 81 feet (25 meters) by 24 feet (7.3 meters), Psyche just about covers a tennis court. The spacecraft body, or bus, is 16.1 feet (4.9 meters) tall, including the 6.6-foot (2-meter) booms for two instruments, 7.1 feet (2.2 meters) wide, and 7.8 feet (2.4 meters) deep.' eoPortal, https://www.eoportal.org/satellite-missions/psyche, OPENED 2026-10-15: 'At 75 m 2 , the five-panel, cross-shaped solar arrays are the largest ever installed at JPL'; 'After the successful installation and deployment of the three center panels inside a clean room at JPL'; 'the two perpendicular cross panels'; 'the 6.5-foot-wide (2-meter-wide) high-gain antenna'; 'two identical high-sensitivity magnetic field sensors located at the middle and outer end of a 6-foot (2-meter) boom'; 'It is mounted on a 6-foot (2-meter) boom'. JPL's diagram (public domain, references): '24,7 m.' tip to tip. DERIVED: the bus 2.9 m along the dish's axis (4.9 m less the 2 m booms); each panel 3.06 x 2.43 m (75 m2 over ten panels, three across in 7.3 m); the yoke 1.95 m (24.7 m less the bus and six panels). OURS: the places of the DSOC tube, the imagers, the star trackers and the thrusters, and every size not cited.", read: 2026-10-15}, modified: "nothing was generated, so nothing was repaired. THE BUS: a black box 2.2 m (X) by 2.4 m (Y) by 2.9 m along the dish's axis (Z), the cited 4.9 m less the cited 2 m booms that stand above the dish (DERIVED), with white radiator panels on its two faces without wings (sizes OURS). THE HIGH-GAIN ANTENNA: a 2 m silver dish on the top face (cited). OVER IT, JPL's diagram's tripod holding the gamma-ray and neutron spectrometer's sensor 2 m up (cited: 'a 6-foot (2-meter) boom'), and the magnetometer's 2 m boom on a top corner with its two sensors at the middle and the end (cited). The DSOC telescope as a gold tube on a top corner, its aperture to the dish's side; the imagers, two star trackers and the two Hall thruster gimbals at the bottom (sizes and places OURS, from the diagram). TWO FIVE-PANEL CROSS-SHAPED WINGS (cited: 'the five-panel, cross-shaped solar arrays', 75 m2, 25 x 7.3 m deployed): each panel 3.06 x 2.43 m (DERIVED: 75 m2 over ten panels, three across in 7.3 m), three in a row from a 1.95 m V-shaped yoke (DERIVED: 24.7 m less the bus and six panels), the two cross panels on either side of the MIDDLE one (NASA's concept PIA21499 and JPL's diagram), low on the sides as the diagram draws them. Built to the app's axes: +Z the dish AND THE CELLS (the wings turned on their axis to face the way the dish faces), the wings along X. The app points +Z at the centre of the stage (the Sun in the Solar System's view, the Earth in the Earth's); from 2 to 3 au the Earth is within 20 to 30 degrees of the Sun in Psyche's sky, so dish and cells on the one is near how it flies. The first build had the cells square to the dish (+Y): in the app the wings showed their backs and stood edge-on to the Sun (look run 38760966244), and it was rebuilt. No mirror pass: the second wing is a placed part, not a mirror image. Colours are this project's own flat ones in the app's roles (cells the app's panel blue #2E4E8C; blankets, dishes and frames read off the pictures named). Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 930 triangles, 11 colours"}
  - {id: juice, file: site/models/juice.glb, kb: 45, budget_tris: 10000, class: probe, kind: built-from-dimensions, used_for: "JPL Horizons -28, JUICE (data/sample.js `deep-juice`), ESA's Jupiter Icy Moons Explorer on its way to Ganymede: a grey box with a 2.5 m dish, two cross-shaped wings of five panels, a 10.6 m magnetometer boom and a 16 m radar antenna. It was the generic probe; public #1082", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA Science's 3D models, 100 resources listed 2026-10-15, and NASA's 3D Resources, 1 583 paths, have none of this craft); NO ESA PICTURE OR MODEL IS IN THE FILE: ESA's published numbers were read as numbers. ESA's terms for the images on its site, read 2026-10-15 (https://www.esa.int/ESA_Multimedia/Terms_and_Conditions): 'The website of the European Space Agency (the ESA Website) provides to users an online access to space images and videos for education, editorial and/or information purposes only. All other uses (e.g. commercial ones) are excluded and require a specific licence.' The JUICE Science Operations Centre's CAD-derived model in the SPICE kernels states no licence (its documentation page, the kernels' readme and the FTP folder, read 2026-10-15): the MESH WAS NOT FETCHED; its documentation's table of component places (numbers) was used", licence: "This project's own shape, under this repository's licence, built from ESA's published numbers (facts) and the component places published by the JUICE Science Operations Centre (numbers). NO FREE PICTURE OF THE FLIGHT CRAFT WAS USED: ESA's renders (CC BY-SA 3.0 IGO, share-alike) were looked at only (named under references) and nothing of them is in the file. NASA's icon of JUICE (public domain) draws an older design and was not followed. NO ESA PICTURE OR MODEL IS IN THE FILE. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from ESA's published dimensions (no free picture of the craft)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): ESA's render at Callisto, for where the cross sits on each wing (on the MIDDLE panel of three) and the body's grey blankets", title: "Juice flyby of Callisto artists impression", url: "https://commons.wikimedia.org/wiki/File:Juice_flyby_of_Callisto_artists_impression.jpg", licence: "CC BY-SA 3.0 IGO (ESA; Commons' LicenseShortName, read 2026-10-15): share-alike, LOOKED AT ONLY for the cross's place on each wing and the body's grey, never fetched by the tool and not on any sheet", credit: "ESA (acknowledgement: ATG Europe)", read: 2026-10-15}, {use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): ESA's launch-kit render, for the dish on the face beside the wings", title: "Juice launch kit cover close-up", url: "https://commons.wikimedia.org/wiki/File:Juice_launch_kit_cover_close-up.png", licence: "CC BY-SA 3.0 IGO (ESA; read 2026-10-15): share-alike, LOOKED AT ONLY for the dish on the face beside the wings, never fetched by the tool and not on any sheet", credit: "ESA", read: 2026-10-15}], dimensions: {stowed_x_m: 4.09, stowed_y_m: 2.86, stowed_z_m: 4.35, deployed_x_m: 16.8, span_m: 27.1, deployed_z_m: 13.7, panel_m: 3.5, panel_width_m: 2.5, hga_m: 2.5, mag_boom_m: 10.6, rime_m: 16, source: "ESA, 'Juice spacecraft specs', https://www.esa.int/Science_Exploration/Space_Science/Juice/Juice_spacecraft_specs, OPENED 2026-10-15: 'The spacecraft is roughly cuboidal, with two large cross-shaped ‘wings’ of solar panels on either side, several extending booms and antennas, and a large dish-shaped antenna on one face'; 'Dimensions (stowed for launch) : 4.09 x 2.86 x 4.35 m'; 'Dimensions (deployed in orbit) : 16.8 x 27.1 x 13.7 m'; 'Juice will carry  a 10.6-metre-long deployable boom  for its Juice Magnetometer (J-MAG) and Radio and Plasma Wave Investigation (RPWI) instruments, and a 16-metre-long deployable antenna for its radar instrument (RIME). RPWI has three additional electric 2.5-'; 'Overall, these wings are made up of ten 2.5 x 3.5 m panels (five on each side) with a total area of 85 m 2 (and a total of 23 560 solar cells ) – the largest ever built for an interplanetary spacecraft, measuring 27 m from tip to tip.'; 'via the 2.5-metre  High Gain Antenna  (HGA'. ESA, 'Juice factsheet', OPENED 2026-10-15: 'Each solar panel measures about 2.5 m x 3.5 m; with five on each side of the spacecraft deployed  as two distinctive cross-shaped arrays , these total an area of about 85 square metres'. JUICE Science Operations Centre, 'Spacecraft Model', https://juicesoc.esac.esa.int/help/82_spacecraft_model.html, OPENED 2026-10-15: the table of component places (SPICE structure kernel juice_struct_v19), every row used quoted in a part's `cited`. ESA SPICE frames kernel juice_v46.tf, https://spiftp.esac.esa.int/data/SPICE/JUICE/kernels/fk/, OPENED 2026-10-15: '-X axis is perpendicular to the HGA mounting plane and points in the direction of the nominal HGA boresight'; 'The JUICE High Gain Antenna, HGA, is rigidly attached to the -X side of the spacecraft bus.'; 'The axis of rotation is parallel to the Y axis of the spacecraft and the solar array frames.' DERIVED: the bus 2.9 x 2.0 x 3.9 m from the SPICE places; the yoke 2.04 m from 27.1 m. OURS: the dish's place on its face, the instruments' boxes, the Langmuir booms' directions, the thickness of every rod.", read: 2026-10-15}, modified: "nothing was generated, so nothing was repaired. THE FRAME IS JUICE'S OWN (ESA's SPICE frames kernel: the HGA's boresight -X, the launch direction and the science deck +Z, the wings along Y), turned to the app's axes: app X = -Y, app Y = Z, app Z = -X. THE BUS: a grey-silver box 2.9 x 2.0 x 3.9 m (JUICE's X, Y, Z), DERIVED from the SOC's component places (the instruments at X = +1.4 m, the wings' yokes at Y = +-1.0 m, the deck's sensors at Z = 3.9 m) inside the cited stowed 4.09 x 2.86 x 4.35 m; the adapter cone and the main engine below it. THE HIGH-GAIN ANTENNA: a white 2.5 m dish (ESA; the frames kernel says 2.4 m) on the -X face (cited), its feed on three struts; its place on the face OURS. TWO CROSS-SHAPED WINGS: ten 2.5 x 3.5 m panels (cited), three in a row from a 2.04 m yoke (DERIVED: 27.1 m tip to tip less the bus and six panels) at the SOC's yoke places, the two cross panels on either side of the MIDDLE one (read off ESA's renders, looked at only), frame lines copper; the cells at the arrays' ZERO position, facing the way the HGA faces (cited: the frames kernel's zero frame, '+Z is aligned to the spacecraft bus -X, pointing on the nominal direction of the HGA'), the app's +Z, which the app points at the centre of the stage. THE BOOMS AND ANTENNAS at the SOC's places: the 10.6 m magnetometer boom (cited) from its root down and out through RPWI's search coil and RWI, with five sensor boxes; RIME's 16 m antenna (cited) as two rods along JUICE's X from its two roots on the deck, 16 m tip to tip; the medium-gain antenna's 0.6 m dish (size OURS) on its arm; four Langmuir probes on 2.5 m booms (cited: '2.5-' m) from their places, outward (directions OURS). Every rod is drawn 3 to 5 cm in radius, so that it is a pixel at the size the app draws the craft: THICKER THAN THE REAL TUBES. ON THE SCIENCE DECK, at their SOC places: JANUS, MAJIS, GALA and UVS as boxes (sizes OURS) and SWI's 30 cm antenna (cited). The magnetometer boom goes down and back from the body, so the file's box, which the app centres, is off the bus's middle. No mirror pass: the second wing is a placed part. Colours are this project's own flat ones in the app's roles (cells the app's panel blue #2E4E8C; blankets, dishes and frames read off the pictures named). Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 8 984 triangles, 8 colours"}
