ing port, the red seal ring, the forward thrusters, the nose cone's inside; A PHOTOGRAPH", title: "The SpaceX Crew Dragon as it approached the International Space Station (iss063e021563)", url: "https://commons.wikimedia.org/wiki/File:The_SpaceX_Crew_Dragon_as_it_approached_the_International_Space_Station_(iss063e021563).jpg", licence: "Public domain (NASA/Chris Cassidy)", credit: "NASA/Chris Cassidy", read: 2026-10-13}], dimensions: {height_with_trunk_m: 8.1, diameter_m: 4.0, trunk_diameter_m: 3.7, source: "SpaceX, https://www.spacex.com/vehicles/dragon/ (the page is drawn by script; its data file https://www.spacex.com/3850.6a270eb20a4c2080.js was opened 2026-10-13): 'Height' '8.1m' '/ 26.7 ft', 'Diameter' '4 m' '/ 13 ft', 'The Dragon spacecraft is equipped with 16 Draco thrusters', 'One half of the trunk is covered in solar panels'. SPACEX DISAGREES WITH ITSELF: its Falcon 9 page's data file (https://www.spacex.com/2343.25ddd7bb77e7b318.js, opened the same day) gives Dragon 'Diameter' '3.7 m' '/ 12 ft'; read here as 4 m at the capsule's base and 3.7 m for the trunk, which neither sentence says. Wikipedia, https://en.wikipedia.org/wiki/SpaceX_Dragon_2, infobox, opened 2026-10-13: '4.5 m capsule only', '8.1 m capsule with trunk', diameter '4 m', width '3.7 m'; and 'The spacecraft's nose cone protects the docking port and four forward-facing thrusters during ascent and reentry. This component pivots open for in-space operations.'; 'eight SuperDraco engines arranged in four redundant pairs'. NO NASA PAGE WITH DIMENSIONS WAS FOUND. NOT CITED: the sidewall's 15 degrees (published for the first Dragon only; kept), the nose cone's 1.05 m, how the 8.1 m is shared (3.7 m of trunk is built, 4.4 m of capsule with its nose closed), the pods' size, the fins' size, the windows", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired (the mesh an image-to-3D model generated for this craft on 2026-10-12 was judged a lump and is not used). THE CAPSULE IS ONE 