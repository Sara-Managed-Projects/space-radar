Center", read: 2026-10-20}, {use: "compared with: the dimensioned side drawing (Fig. 1A) and the spacecraft (Fig. 1B)", title: "Jones, Recovery of thrust magnitude from Minitrack data for the SERT-II spacecraft, GSFC X-552-70-448", url: "https://ntrs.nasa.gov/citations/19720019048", licence: "Public domain (NASA report)", credit: "NASA GSFC", read: 2026-10-20}, {use: "compared with: the array layout (Fig. 3) and the stowed array (Fig. 18)", title: "SERT II solar array report", url: "https://ntrs.nasa.gov/citations/19710013187", licence: "Public domain (NASA report)", credit: "NASA Lewis Research Center", read: 2026-10-20}], dimensions: {length_m: 7.92, diameter_m: 1.525, agena_length_m: 6.25, wing_length_m: 6.0, wing_width_m: 1.525, source: "Goldman, Gurski and Hawersaat, Description of SERT II spacecraft and mission, NASA TM (1970), https://ntrs.nasa.gov/citations/19710002423, OPENED 2026-10-20: 'The satellite is 1.525 meters in diameter and 7.92 meters long'; 'The SERT II Agena is 6.25 meters long by 1.525 meters in diameter, with a modified aft equipment rack'; the spacecraft 'a right circular cylinder 53.4 centimeters high and 149 centimeters in diameter'; 'Six meters of solar array extend outward on both sides of the Agena aft end equipment rack', 'a width of 1.525 meters'; 'nose down with the thrusters pointed toward Earth'; thrusters 'offset by 10 deg from the vertical'. Array report (NTRS 19710013187), Fig. 3: '45 panels per wing arranged in 15 by 3', one wing 5.8 m and the other reaching 6.5 m from the centre line (built so). Stations along the stack read off Jones's Fig. 1A at its own scale (6.223 m). OURS: truss tubes, the thrusters' bodies, the spiral disc, the plates, the whips' length and cant", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. The Agena D with its nozzle and stiffening grid, the aft rack with four copper spheres, the two wings of 15 x 3 panels on their mounting beds and actuators, the aft cone, the eight skin bays (three white Z-93 paint, five aluminium tape), the cable tunnel and the black squares, the turnstile whips; forward, the support unit and the spacecraft with its two mercury ion thrusters canted 10 degrees, the experiment plates and the probes. THE THRUSTER END follows the 1968 Tank 5 photograph of the test article where the flight drawing says nothing (the dark disc, read as a spiral antenna, and two angled rim plates). Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role named body, foil, solar-panel; one material per colour; its value clamp; normals creased at 40 degrees, 12 on blankets so their folds show; meshopt), nothing resampled or decimated. No mirror pass. No logo and no lettering is on the mesh. 16940 triangles, 12 colours."}
  - {id: isis-1, file: site/models/isis-1.glb, kb: 134, budget_tris: 13500, look: pbr, class: satellite, kind: built-from-dimensions, origin: built, used_for: "NORAD 3669 (ISIS 1), by id; public #1110. It spun: not turned (the seeded constant attitude); the spin axis is the file's +Y", source: "built by this project in code (release 1.3.0 stage W3-a's part library, lib.py, and one script a craft, kept with the stage's notes); no image-to-3D model was used, and no published mesh: NASA's 3D Resources (1 583 paths) and NASA Science's 3D models have none of this craft (read 2026-10-20)", licence: "The shape is this project's, under this repository's licence, built from published numbers (facts). The picture it was compared with and may show is NSSDCA's photograph of the flight craft (NASA, public domain); the Canadian Space Agency's and the National Research Council's pictures were looked at only and are in nothing.", credit: "3D model: built by Space Radar from NASA's and Canada's published dimensions; compared with NASA's photograph (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with: the flight craft on its adapter, the octagon, the cell panels, the belt", title: "ISIS 1 (NSSDCA spacecraft image)", url: "https://nssdc.gsfc.nasa.gov/planetary/image/isis_1.jpg", licence: "Public domain (NASA NSSDCA)", credit: "NASA", read: 2026-10-20}, {use: "compared with: the sister craft ISIS 2, its belt instruments and antenna housings (Figures 1 and 2)", title: "ISIS 2 experimenters report, NASA 19810015208", url: "https://ntrs.nasa.gov/citations/19810015208", licence: "Public domain (NASA report)", credit: "NASA", read: 2026-10-20}, {use: "LOOKED AT ONLY: the labelled schematic of ISIS A and the frame being assembled at RCA Montreal", title: "NRC Science Dimension, December 1969 (reprinted by IEEE Canada)", url: "https://ewh.ieee.org/reg/7/millennium/isis/isis_study.html", licence: "Crown copyright (NRC); looked at only", credit: "National Research Council Canada", read: 2026-10-20}, {use: "LOOKED AT ONLY: the scale model, the craft on its handling stand, the launch", title: "Canadian Space Agency, ISIS I and II", url: "https://www.asc-csa.gc.ca/eng/satellites/isis.asp", licence: "Government of Canada; looked at only", credit: "Canadian Space Agency / Communications Research Centre", read: 2026-10-20}], dimensions: {diameter_m: 1.27, height_m: 1.04, long_dipole_m: 73.0, short_dipole_m: 18.7, source: "NRC Science Dimension, Dec. 1969, reprinted at https://ewh.ieee.org/reg/7/millennium/isis/isis_study.html, OPENED 2026-10-20: 'It has a diameter of 50 inches, a height of 41 inches and weighs 525 pounds'; the schematic: 'SOUNDER ANTENNA 240 FT. TIP TO TIP', 'SOUNDER ANTENNA 61.5 FT. TIP TO TIP', 'SOLAR CELL PANELS (16)'. NSSDCA 1969-009A (web.archive.org copy, the live catalogue erred that day): 'The sounder used two dipole antennas (73 and 18.7 m long). The satellite was spin-stabilized at about 2.9 rpm'. THE DIPOLES ARE DRAWN SHORT, illustrative: 6.0 m and 3.0 m tip to tip, because the app scales a model's longest side to one unit and a 73 m dipole would leave the 1.27 m drum a dot. OURS: the belt height (0.17 m), every instrument's size and place, the probes' lengths and angles", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. The octagonal drum: eight trapezoid cell panels above and eight below a short belt, the cells in columns with stepped edges on the bare substrate, T-clips along every panel edge; the belt's faces alternate bare aluminium with instruments and black with a white quadraloop bar; the top deck with its 400 MHz ring, the separation ring below; the probes and the 136 MHz whips; THE TWO CROSSED SOUNDER DIPOLES in the plane square to the spin axis, DRAWN SHORT (6.0 m and 3.0 m tip to tip against the real 73 m and 18.7 m; the ratio squeezed from 3.9:1 to 2:1), each with a small cap where it is cut. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role named body, foil, solar-panel; one material per colour; its value clamp; normals creased at 40 degrees, 12 on blankets so their folds show; meshopt), nothing resampled or decimated. No mirror pass. No logo and no lettering is on the mesh. 12694 triangles, 10 colours."}
  - {id: tracers, file: site/models/tracers.glb, kb: 69, budget_tris: 8000, look: pbr, class: satellite, kind: built-from-dimensions, origin: built, used_for: "NORAD 64870 and 64873 (TRACERS 1 and 2), by id; public #1092. The twins are one design: one file serves both. Built with the spin axis on +Z, which in the cusp is aligned with the field and so points nearly straight down", source: "built by this project in code (release 1.3.0 stage W3-a's part library, lib.py, and one script a craft, kept with the stage's notes); no image-to-3D model was used, and no published mesh: NASA's 3D Resources (1 583 paths) and NASA Science's 3D models have none of this craft (read 2026-10-20)", licence: "The shape is this project's, under this repository's licence, built from published numbers (facts). The pictures it was compared with are NASA's (public domain) and SpaceX's encapsulation photograph (CC0); the University of Iowa's drawings were looked at only and are in nothing.", credit: "3D model: built by Space Radar from the TRACERS team's published dimensions; compared with NASA's turntable (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with: NASA's turntable of the spacecraft, stills at ten angles", title: "TRACERS spacecraft turntable (30fps 4k)", url: "https://commons.wikimedia.org/wiki/File:TRACERS_spacecraft_turntable_(30fps_4k).webm", licence: "Public domain (NASA; Commons LicenseShortName, read 2026-10-20)", credit: "NASA/Goddard Conceptual Image Lab", read: 2026-10-20}, {use: "compared with: the two flight craft being encapsulated", title: "SpaceX TRACERS Rideshare Encapsulation (KSC-20250717-PH-SPX01_0001)", url: "https://commons.wikimedia.org/wiki/File:SpaceX_TRACERS_Rideshare_Encapsulation_(KSC-20250717-PH-SPX01_0001).jpg", licence: "CC0 (Commons LicenseShortName, read 2026-10-20)", credit: "SpaceX", read: 2026-10-20}, {use: "compared with: where each instrument sits", title: "Satellite TRACERS de la NASA - Schema position et source des instruments scientifiques", url: "https://commons.wikimedia.org/wiki/File:Satellite_TRACERS_de_la_NASA_-_Sch%C3%A9ma_position_et_source_des_instruments_scientifiques-fr.png", licence: "Public domain (NASA; Commons LicenseShortName, read 2026-10-20)", credit: "NASA", read: 2026-10-20}], dimensions: {across_flats_m: 1.06, height_m: 0.92, efi_boom_m: 3.0, mag_bracket_m: 0.7, source: "Miles et al. 2025, The TRACERS Mission, Space Sci. Rev. 221:61 (https://pmc.ncbi.nlm.nih.gov/articles/PMC12204947/), OPENED 2026-10-20: 'Solar arrays are positioned on each of the 8 side panels and -Z decks'; 'The MSC, MAG, and MAGIC sensors are accommodated on 70 cm fixed brackets'; 'The EFI sensors are deployed on 3-m Stacer booms'; 'spin axis are aligned with the background magnetic field'. Bonnell et al. 2025, The EFI for the TRACERS Mission (https://pmc.ncbi.nlm.nih.gov/articles/PMC12420696/): 'an 8-cm diameter graphite-coated (DAG-213) Aluminum sphere'; 'an exposed length of three (3) meters'; 'opposite sensors separated by 7 meters'. THE FOUR EFI BOOMS ARE DRAWN SHORT, illustrative: 1.25 m of their 3 m, because the app scales a model's longest side to one unit and at 7 m the 1 m body would be a dot. OURS: the body 1.06 m across the flats and 0.92 m tall (University of Iowa drawings, looked at only, and the EFI geometry), the -Z deck, the antenna patches, the cell gaps", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. The black octagonal ALTAIR body with dark-navy cells on its eight sides and the -Z deck, the recessed +Z deck with its copper ring and the Lightband, the two 0.7 m carbon brackets on the diagonal faces with the search coil on one and the fluxgate and MAGIC on the other, ACI (the copper drum) and ACE (the white box) on opposite faces, the four EFI stacers in the spin plane with their 8 cm black spheres, DRAWN SHORT (1.25 m of the 3 m). Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role named body, foil, solar-panel; one material per colour; its value clamp; normals creased at 40 degrees, 12 on blankets so their folds show; meshopt), nothing resampled or decimated. No mirror pass. No logo and no lettering is on the mesh. 6976 triangles, 14 colours."}
