e description it links, https://ilrs.gsfc.nasa.gov/docs/Westpac_final.pdf, opened 2026-10-13: 'monolith spherical body made from brass'; 'RR are distributed regularly, 3 pieces on spherical surface of ball's segments limited by the sides of imaginary perfect shape with 20 sides (icosahedron).'; 'round diaphragms with entrance apertures of 20.5 mm installed in a distance of 31.5 mm from the frontal side of each RR'; 'In icosahedron's corners there are 10 deaf holes', and threads 'in two opposite corners'. NOT CITED: where the three sit on a face (drawn 17 degrees from its middle toward its corners), a tube's outer width (drawn 34 mm), the colour (drawn pale, as the page's photograph, which is 'Courtesy of EOS' and not free, shows it)", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. A ball of 432 even triangles 182 mm across; on it SIXTY BAFFLE TUBES 31.5 mm high (the cited height; with the ball, the cited 245 mm), eight-sided, 34 mm across, three on each face of an icosahedron 17 degrees from the face's middle, each with a dark mouth; and a small dark hole at each of the icosahedron's twelve corners (the page: ten blind holes and two threads). DRAWN DIFFERENTLY FROM THE CRAFT: a tube's mouth is one dark disc where the real one has a 20.5 mm aperture over a cube 31.5 mm down; the body is brass and is drawn pale, as the photograph shows it; where the three sit on a face and a tube's width are OURS. The poles are on the file's Y axis. No mirror pass. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 5 328 triangles, 4 colours"}
