ith six landing legs and is 3.938 m (12.92 ft) tall'; 'three solar panels, a top deck panel and two body panels'; 'the lander broke a leg off of the hexagonal body'; 'the lander is resting on a helium tank and/or a computer shelf that was strapped outside of the main fuselage'. Wikipedia, 'IM-1', https://en.wikipedia.org/wiki/IM-1, OPENED 2026-10-20: 'It was later determined to have landed at a 30 degree angle'; 'broke one of its six legs and tipped to its side'. DERIVED: a lander that rests on a tank strapped to its side is tipped about 60 degrees from upright (its long axis 30 degrees above the ground): at 30 degrees from upright the tank would be more than a metre up. OURS: the body 1.57 m across the flats (read off the photograph against the height), the legs' 2.15 m reach, every part's size", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. Built upright and then TIPPED: the long axis 30 degrees above the ground (DERIVED, see dimensions), the face with the copper-wrapped tank down, the body and the tank on the ground. The legs whose feet would be under the ground are drawn as the stubs of their struts (cited: one leg broke; which others bent is not published: OURS). THE BODY: a hexagonal prism (cited), black panels below with a gold-tan insulation panel, white above with silver blankets and boxes; TWO BODY-MOUNTED ARRAYS and the TOP-DECK ARRAY (cited: 'a top deck panel and two body panels'); the copper-wrapped tank, a dish near the top, antennas, NASA's retroreflector, EagleCam's dispenser (it stayed on through the landing); the methane-oxygen main engine and reaction thrusters underneath; six legs, each a long silver strut with a copper-sleeved absorber and two side struts to a footpad. No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body): blankets as rumpled sheets with patches a shade lighter and darker, so they are not flat slabs. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, normals creased at 40 degrees, meshopt), with nothing resampled or decimated: every triangle keeps the colour it was built with. 6126 triangles, 67 kB."}
  - {id: blue-ghost, file: site/models/blue-ghost.glb, kb: 63, budget_tris: 8000, class: site, kind: built-from-dimensions, used_for: "the blue-ghost-1 landing site (registry/sites.yaml), Mons Latreille in Mare Crisium: Firefly's Blue Ghost lander of Mission 1, upright as it landed. It was the generic lander, which is still what is drawn while this file is on its way; public #1136", source: "built by this project in code (release 1.3.0 stage W1-c's part library, lib.py, and one script a craft, kept with the stage's notes), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources, 1 583 paths, and NASA Science's 3D models have none of this craft; read 2026-10-20)", licence: "Public domain (NASA's rendering), CC0 (SpaceX's photograph of the flight lander in its fairing) and CC BY 4.0 (a photograph of Firefly's full-size mock-up by Commons user Blervis): looked at, with credit; nothing of them is in the file. The shape is this project's, under this repository's licence, built from published numbers (facts). NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from Firefly's published dimensions and pictures (NASA, public domain; SpaceX, CC0; Blervis, CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; Firefly's full-size mock-up: the black lower deck, the arrays on faces that lean in to the top deck, the legs (a strut from the top corner and one from the deck to a dish footpad), the twin-nozzle thruster pods and the main engine under the deck", title: "Firefly Blue Ghost lander mockup", url: "https://commons.wikimedia.org/wiki/File:Firefly_Blue_Ghost_lander_mockup.jpg", licence: "CC BY 4.0 (Blervis, own work; Commons' LicenseShortName, read 2026-10-20)", credit: "Blervis, CC BY 4.0", read: 2026-10-20}, {use: "drawn from; NASA's rendering of the lander on the Moon: the gold blankets, the array, the tilted panel on the top deck", title: "Blue Ghost Mission 1 rendering", url: "https://commons.wikimedia.org/wiki/File:Blue_Ghost_Mission_1_rendering.jpg", licence: "Public domain (NASA's Scientific Visualization Studio; Commons' LicenseShortName, read 2026-10-20)", credit: "NASA/GSFC", read: 2026-10-20}, {use: "compared with; the flight lander in its fairing, 12 January 2025: the gold-brown blankets, the black footpads, the white thruster pods", title: "Blue Ghost M1 in fairing", url: "https://commons.wikimedia.org/wiki/File:Blue_Ghost_M1_in_fairing.jpg", licence: "CC0 (SpaceX; Commons' LicenseShortName, read 2026-10-20)", credit: "SpaceX", read: 2026-10-20}], dimensions: {height_m: 2.0, width_m: 3.5, source: "Firefly Aerospace, 'Blue Ghost Mission 1', https://fireflyspace.com/missions/blue-ghost-mission-1/, OPENED 2026-10-20: 'Standing 2 m (6.6 ft) tall and 3.5 m (11.5 ft) wide, Blue Ghost is designed for stability with shock absorbing feet, a low center of mass, and a wide footprint.' NASA, 'Houston We Have a Podcast: Blue Ghost Mission 1', https://www.nasa.gov/podcasts/houston-we-have-a-podcast/blue-ghost-mission-1/, OPENED 2026-10-20: 'about two meters tall ... and about three and a half meters wide'. Wikipedia, 'Blue Ghost Mission 1', OPENED 2026-10-20: 'Three solar panels'. OURS: the deck 2.0 m square, the body 1.84 m at the deck and 1.4 m at the top deck, the 3.5 m taken across the footpads' outer edges side to side, every part's size", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BODY: a black composite lower deck 2.0 m square, 0.7 m up, and a body whose four faces lean in to the top deck, in gold blankets with patches; THREE ARRAYS on three faces (cited: 'Three solar panels'), the fourth a radiator (OURS: which face). FOUR LEGS on the diagonals, each a composite strut from the top corner and one from the deck to a dish footpad, the pads 3.5 m apart across the sides (cited width). UNDER THE DECK: the main engine, the tank's dome, four twin-nozzle thruster pods. ON TOP: the tilted flat panel NASA's rendering draws, LEXI's box and aperture, the retroreflector, LuGRE's antenna on its mast, the magnetometer's mast, payload boxes; SCALPSS's cameras under the deck; LISTER's drill down to the ground and PlanetVac on a footpad. No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body): blankets as rumpled sheets with patches a shade lighter and darker, so they are not flat slabs. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, normals creased at 40 degrees, meshopt), with nothing resampled or decimated: every triangle keeps the colour it was built with. 7422 triangles, 63 kB."}
  - {id: surveyor, file: site/models/surveyor.glb, kb: 60, budget_tris: 6500, class: site, kind: built-from-dimensions, used_for: "the surveyor-1 landing site (registry/sites.yaml), Oceanus Procellarum: Surveyor 1, without the soil sampler that Surveyor 3 carried. It was the procedural Surveyor (scene/models.js `surveyor`, from NSSDCA's paragraph), which is still what is drawn while this file is on its way; public #267", source: "built by this project in code (release 1.3.0 stage W1-c's part library, lib.py, and one script a craft, kept with the stage's notes), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources, 1 583 paths, and NASA Science's 3D models have none of this craft; read 2026-10-20)", licence: "Public domain (NASA's Apollo 12 photographs) and CC0 (the Smithsonian's photographs): looked at, with credit; nothing of them is in the file. The shape is this project's, under this repository's licence, built from published numbers (facts). NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from NSSDCA's dimensions and NASA's and the Smithsonian's photographs (public domain, CC0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; Surveyor 3 on the Moon with Charles Conrad, Apollo 12 (AS12-48-7134): the mast with the solar panel and the planar array, the camera, the compartments, the omni booms, the sampler", title: "Apollo12ConradSurveyor", url: "https://commons.wikimedia.org/wiki/File:Apollo12ConradSurveyor.jpg", licence: "Public domain (NASA, photo ID AS12-48-7134; Commons' LicenseShortName, read 2026-10-20)", credit: "NASA/Alan Bean", read: 2026-10-20}, {use: "drawn from; Surveyor 3 from Apollo 12 (AS12-48-7110): the legs and footpads, the triangle of the frame", title: "Apollo 12 Mission image - View of the Surveyor III craft, which landed April 19, 1967 (as12-48-7110)", url: "h