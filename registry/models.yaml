sion to the Trojan Asteroids: Instrumentation and Encounter Concept of Operations', PSJ 2:172, https://iopscience.iop.org/article/10.3847/PSJ/abf83f (CC BY 4.0), OPENED 2026-10-15: 'Lucy’s scientific instruments and the terminal tracking cameras are mounted on an IPP (Figure 3 ) which is connected to the spacecraft by a two-axis gimbal.' OURS: the bus (1.9 x 2.7 x 1.8 m, read off NASA's illustration against the 2 m dish), the IPP's size and place, the hubs' place, the ten gores (counted on NASA's illustration).", read: 2026-10-15}, modified: "nothing was generated, so nothing was repaired. THE BUS: no size is published; a silver box 1.9 x 2.7 x 1.8 m read off NASA's illustration against the cited 2 m dish (OURS). THE HIGH-GAIN ANTENNA: a 2 m silver dish on its +Z face (cited), its feed on a cone. THE INSTRUMENT POINTING PLATFORM on top, on its gimbal (cited: 'connected to the spacecraft by a two-axis gimbal'), with L'LORRI's dark tube, L'Ralph and L'TES (sizes OURS), drawn pointing along the dish (it turns to the asteroid in a flyby). TWO ROUND FAN-FOLDED ARRAYS, the part library's new `fan` (ten gores round a hub, cell tiles, the frame and ribs as rows of small dashes, a back): 7.3 m corner to corner (cited), their hubs 4.35 m either side of the middle so the craft is 16 m tip to tip (cited: NASA's 'more than 52 feet (16 meters)'; eoPortal's older 'over 13 m' is not built), on a boom from the body's lower corners; their CELLS FACE THE SAME WAY AS THE DISH, as NASA's illustrations draw them; the cells in the app's panel blue, the substrate between them and the back orange, the ribs white (NASA's illustration). BOTH ARRAYS ARE DRAWN FULLY OPEN: the +Y array stopped short of its latch after launch (eoPortal, cited in dimensions). Built to the app's axes (+Z the dish and the cells, the arrays along X). No mirror pass: the second array is a placed part, not a mirror image. Colours are this project's own flat ones in the app's roles (cells the app's panel blue #2E4E8C; blankets, dishes and frames read off the pictures named). Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 3 210 triangles, 8 colours"}
  # 0077 W1-a: begin
  # Release 1.3.0, stage W1-a (internal spec 0077 task 1): THEMIS from NASA; Tiangong, its laboratories and the Shenzhou orbital module built in code.
  # `origin:` says official (an agency's own model) or built (made here). `flagship: true` lets a row claim up to 60 000 triangles (tests/test_contract.mjs).
  - {id: themis, file: site/models/themis.glb, kb: 105, budget_tris: 12000, class: satellite, origin: official, used_for: "NORAD 30580, 30797 and 30798 (THEMIS A, D and E, in CelesTrak's active group in the live saved data of 2026-10-20), by id; public #549. The five THEMIS probes are one design; B and C became ARTEMIS at the Moon and are not in the group", source: "https://github.com/nasa/NASA-3D-Resources — 3D Models/Time History of Events and Macroscale Interactions During Substorms (THEMIS) (the .glb, 682 092 bytes, read 2026-10-20)", licence: "Public domain (NASA media usage guidelines). The repository's README, read 2026-10-20: 'These assets are free and without copyright.'", credit: "3D model: NASA", modified: "baked by scripts/bake-own-colours.mjs with NASA's own materials and textures (nothing decimated: 11 424 triangles; 12 flat colours read off NASA's file, brightness held between 12 % and 93 %; normals with a 40 degree crease; meshopt). THE BOOMS ARE DRAWN SHORTER: every vertex further than 0.8 m from the body's centre is pulled in along its radius to 0.8 m plus half of what lay beyond (NASA's file puts the radial booms' tips 3.0 m out and the axial ones 3.6 m; the real wire booms are tens of metres long, so the file already shortens them, and whole they leave the 1 m body an eighth of the picture). The tips keep their shape to within their own size. No mirror pass. Not turned: the probes spin, and the file's axes say nothing about which way the app should hold one"}
  - {id: tiangong, file: site/models/tiangong.glb, kb: 206, budget_tris: 27000, flagship: true, class: station, kind: built-from-dimensions, origin: built, used_for: "the catalogue name CSS (TIANHE) (NORAD 48274), which draws the whole T: Tianhe with Wentian to starboard and Mengtian to port. It was the procedural T of cylinders (scene/models.js buildTiangong), which is still drawn while this file is on its way; public #936, #267", source: "built by this project in code (tools of release 1.3.0 stage W1-a: a part library of tiled hulls, docking mechanisms, flexible wings, arms and dishes, kept in the maintainers' handoff), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (CMSA publishes none; NASA's and ESA's model collections have none of this station)", licence: "CC BY 4.0 and CC0 (the photographs the layout was read off: looked at, with credit; nothing of them is in the file); the shape is this project's, under this repository's licence. The CC BY-SA drawing under references was looked at only. NO FLAG, LOGO OR LETTERING is on the mesh: the red panels where the flag and the CMS logo are painted are plain red", credit: "3D model: built by Space Radar from published dimensions and photographs by the China Manned Space Engineering Office (CC BY 4.0) and Shujianyang (CC0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; the one free photograph of the station in orbit: CMSA's rear view along Tianhe, Mengtian to the left and Wentian to the right, the laboratories' wings standing up and down at their ends, Tianhe's own pair seen edge-on as an orange line along the laboratories, the gold rim of Tianhe's aft face", title: "Rear view of Tiangong Space Station", url: "https://commons.wikimedia.org/wiki/File:Rear_view_of_Tiangong_Space_Station.jpg", licence: "CC BY 4.0 (from Wang et al., Space: Science & Technology 2023, doi:10.34133/space.0035; Commons' LicenseShortName, read 2026-10-20)", credit: "China Manned Space Engineering Office", read: 2026-10-20}, {use: "drawn from; the full-size mock-up of the T at the Zhuhai airshow, six photographs: the node and its ports, Tianhe's small and large sections and the relay dish, the white panelled hulls, the laboratories' outer sections with their platforms, dishes and arms", title: "Tiangong mockup at ZHAL 01 to 06", url: "https://commons.wikimedia.org/wiki/File:Tiangong_mockup_at_ZHAL_01.jpg", licence: "CC0 (Commons' LicenseShortName of all six, read 2026-10-20)", credit: "Shujianyang", read: 2026-10-20}, {use: "drawn from; Tianhe's flexible wing from its own arm's camera: two blankets of copper-brown cells on an orange grid either side of a lattice mast", title: "Tianhe solar array", url: "https://commons.wikimedia.org/wiki/File:Tianhe_solar_array.jpg", licence: "CC BY 4.0 (Commons' LicenseShortName, read 2026-10-20)", credit: "China Manned Space Engineering Office", read: 2026-10-20}, {use: "drawn from; the station's plan in Wang et al.'s figure: Tianhe's pair parallel to the laboratories, the laboratories' pairs at their ends", title: "Tiangong expansion", url: "https://commons.wikimedia.org/wiki/File:Tiangong_expansion.jpg", licence: "CC BY 4.0 (Commons' LicenseShortName, read 2026-10-20)", credit: "Wang Xiang, Zhang Qiao, Wang Wei", read: 2026-10-20}, {use: "LOOKED AT, NOT REPRODUCED AND NOT TRACED: a labelled configuration drawing, for which module is where and where Tianhe's wings sit on the core", title: "Tiangong Space Station config 2022 EN", url: "https://commons.wikimedia.org/wiki/File:Tiangong_Space_Station_config_2022_EN.jpg", licence: "CC BY-SA 4.0 (read on the file's page); NOT REPRODUCED", credit: "Shujianyang", read: 2026-10-20}], dimensions: {length_m: 55.6, core_length_m: 16.6, lab_length_m: 17.9, diameter_m: 4.2, source: "Wikipedia, opened 2026-10-20: 'Tiangong space station' infobox, length '~55.6 m'; 'Tianhe core module': 'The module is 16.6 m long, with a maximum diameter of 4.2 m'; 'Wentian experiment module' and 'Mengtian experiment module' infoboxes: length 17.9 m, diameter 4.2 m; both: 'With a wingspan of over 55 m (180 ft), each array has an energy collection area of 110 m2'; Wentian: 'a small 5 m long robotic arm'; 'On 30 September 2022, the module was relocated to the starboard port'; Mengtian 'relocated to the larboard port'. READ OFF THE PICTURES (approximate, ours): the node 2.8 m across, Tianhe's small section 2.8 m across and 3.6 m long, its large section 6.6 m and its aft section 2.8 m long; each laboratory's work cabin 8 m long and its outer section 3.2 m across and 5.9 m long; each laboratory wing two blankets 2.0 m wide and 24 m long either side of a lattice mast, its root 3.2 m from the laboratory's axis (so 55.6 m tip to tip, the cited figure); Tianhe's pair two blankets 2.0 by 12 m each side; every box, dish, arm and platform.", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. App axes: +Z the nadir (the Earth face), +X the laboratories' axis (Wentian at +X, starboard), +Y the side the Sun lights; Tianhe runs along Y with its node forward at -Y and its aft port at +Y, so the view from the Sun's side is CMSA's rear view. TIANHE: the node a 2.8 m sphere of white cloth with docking mechanisms forward, at the nadir and at the zenith; the small section 2.8 m across with its relay dish on a mast and equipment boxes; the large section 4.2 m across in tiles of three white tones with ring seams, equipment boxes, the red flag panel and the 10 m arm stowed along its zenith side; the aft section in white cloth, its face with a gold rim, the aft docking mechanism and four dark thruster ports. EACH LABORATORY: its docking adapter and front cone, the indexing arm, an 8 m work cabin 4.2 m across in white tiles, the outer section 3.2 m across in white cloth and gold, the wing drive at its tip; Wentian with its rack of exposed payloads, a relay dish, the crew airlock's hatch and the 5 m arm in white with red bands; Mengtian with its large relay dish, the cargo airlock and a payload platform. THE WINGS: each laboratory's two along +-Z from its tip, cells to +Y, as the laboratories' wings turn about their axis; each two copper-brown blankets of 40 by 4 cells on an orange grid either side of a triangular lattice mast, with the blanket boxes at root and tip and two grey bars across. TIANHE'S PAIR lies flat in the plane of the T, cells to the zenith (-Z), seen edge-on from the Sun's side as the CC BY 4.0 rear view shows it (an orange line along the laboratories). WHAT THE APP DOES NOT DO: the wings do not turn with the Sun (a file has no pivots). Mengtian is built as its own laboratory and placed to port by its mirror image across the plane x = 0; its details are its own. Visiting Shenzhou and Tianzhou are catalogue objects of their own and are not drawn on the station. Seventeen colours of this project's own, each read off the pictures named (whites, cloth, gold, metal, the blankets' copper and orange, the masts' silver, the flag red). Written by kit.py with one mesh per colour; then welded on position, normals with a 40 degree crease, meshopt (the bake's colour lookup is not used: a built model has its colours already, and the lookup repaints a thin part from whatever lies nearest): 26 734 triangles, 17 colours. Over the 20 000 cap of one file as a flagship (release 1.3.0's quality bar allows about 60 000): the four 24 m wings' cells, grids and lattice masts are 11 000 of them"}
