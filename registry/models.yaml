2.35 m high (ESA, cited): a bus of 2.0 m in gold foil and, at one end, the instrument under copper blankets, 1.4 m long and deeper than the bus on the Earth side (the split and the bus's 1.9 m depth ours), a dark band where they meet. THE INSTRUMENT'S OPENING on the Earth face: a dark mouth of 1.15 by 0.62 m inside a raised frame (ours in size). Three star trackers on the instrument's sky side (cited as three, on the camera; places ours) and a pale radiator beside them (cited as the radiator the focal planes are linked to; its face and size ours). On the bus: a white X-band antenna, an S-band cone and two boxes on the Earth face, the laser terminal and two small navigation antennas on the sky face, radiators on the side away from the wing, a dark launch ring at the far end (read off the photographs; sizes ours). THE SOLAR ARRAY: one wing of three panels (cited) of 1.25 by 1.9 m (the cited 7.1 m2) on a white yoke from the bus's side, turned 45 degrees toward the Sun's side. No mirror pass: the craft is not symmetric, and no part is a mirror image of another. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the body's length along Y, the instrument's opening on +Z (the Earth), the wing along +X. The camera looks straight down, as the real one does. The real wing turns once an orbit to follow the Sun and the real body keeps one heading to its track; the app turns the whole craft so that X stays square to the Sun and does not turn the wing. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 13 916 triangles, 9 colours"}
