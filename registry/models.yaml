fset reflector of 60 cm in diameter and two separate feeds for the two channels.'; 'LTDN (Local Time on Descending Node) is at 10:00 hours'. ESA, 'Facts and figures', https://www.esa.int/Applications/Observing_the_Earth/Copernicus/Sentinel-3/Facts_and_figures, OPENED 2026-10-14 (words and numbers only): 'Satellite 2.2 m long, 2.2 m wide, 3.7 m high and a mass of 1150 kg (including 130 kg fuel)'; 'Launch date Sentinel-3A: 16 February 2016 Sentinel-3B: 25 April 2018 Sentinel-3C: 15 September 2026'. The two pages differ by 0.2 m in the long side; eoPortal's 3.9 m is built. DERIVED: 10.5 m2 as three panels of 1.5 x 2.33 m; the dish's depth of 0.21 m from its 430 mm focal length. READ OFF THE FREE DRAWING: the body in black blankets; on the Earth face, from one end to the other, the altimeter's dish, a flat spiral antenna and a white antenna, a housing with two curved openings, and a gold reflector on the far corner; the wing of three panels on a long white yoke from the middle of a side, its long side square to the body. OURS: the radiometer's housing and its openings as two arcs of pale tiles; where OLCI's box stands and its five lenses in a row (the real cameras look out through one opening in a fan); the radiators on the sky face; the star trackers; the launch ring's end. NOT FOUND in words: which way the body's length lies to the track.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BUS: 3.9 by 2.2 by 2.21 m (cited) in black blankets. ON THE EARTH FACE, from one end to the other: the altimeter's dish, 1.2 m across and 0.21 m deep, its feed 0.43 m in front on three struts (all cited); a flat spiral antenna, the DORIS antenna, an S-band cone and the laser reflector (read off the drawing; sizes ours); the radiometer's housing with its two openings as two arcs of pale tiles (cited as two baffles; the arcs ours); the colour camera's box, 1.24 by 0.83 m (cited), with five lenses in a row (cited as five cameras; the row ours: the real o