iki/File:Apollo_12_Mission_image_-_View_of_the_Surveyor_III_craft,which_landed_April_19,1967_(as12-48-7110).jpg", licence: "Public domain (NASA Johnson Space Center; Commons' LicenseShortName, read 2026-10-20)", credit: "NASA", read: 2026-10-20}, {use: "drawn from; the Smithsonian's Surveyor test vehicle from several sides: the lattice legs, the crushable footpads and blocks, the propellant tanks, the verniers", title: "Lunar Lander, Surveyor - DPLA - d6accc3d89e8efa6f2e88962941bf43a (page 1)", url: "https://commons.wikimedia.org/wiki/File:Lunar_Lander,_Surveyor_-_DPLA_-_d6accc3d89e8efa6f2e88962941bf43a_(page_1).jpg", licence: "CC0 (Smithsonian National Air and Space Museum, through DPLA; Commons' LicenseShortName, read 2026-10-20)", credit: "Smithsonian NASM", read: 2026-10-20}], dimensions: {height_m: 3.0, footpads_m: 4.3, panel_m2: 0.855, source: "NSSDCA, Surveyor 1 (https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1966-045A) and Surveyor 3 (id=1967-035A), as the procedural shape cites them (scene/models.js buildSurveyor: '3 m tall, 4.3 m across the footpads', the 0.855 m2 array). Wikipedia, 'Surveyor 3', https://en.wikipedia.org/wiki/Surveyor_3, OPENED 2026-10-20: 'The sampler was mounted below the television camera and consisted primarily of a scoop approximately 4.7 inches (120 mm) long and 2.0 inches (50 mm) wide'; 'The scoop was mounted on a pantograph arm that could be extended about 5 feet (1.5 m)'. OURS: the frame's corners 0.78 m out and 0.72 m up, the compartments' and tanks' sizes, the panel's and the planar array's angles, every tube's size", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE FRAME: the triangular aluminium spaceframe, its tripod and the mast to 2.95 m; THREE LEGS, each a lattice beam from its hinge to a crushable footpad with a shock absorber above it, crushable blocks under the frame's corners; ON THE MAST the 0.855 m2 solar panel (cited) and the planar array antenna, each on its own hinge; two thermal compartments, white with quilted faces; the television camera with its mirror hood; two omni antennas on booms; three verniers with their bronze propellant tanks; the retro-rocket's empty mount ring (cited: it was jettisoned); the altimeter antennas. WITH THE SURFACE SAMPLER (cited): its lazy-tongs arm reaching about 1.5 m out and down to the ground, the scoop at its end. No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body): blankets as rumpled sheets with patches a shade lighter and darker, so they are not flat slabs. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, normals creased at 40 degrees, meshopt), with nothing resampled or decimated: every triangle keeps the colour it was built with. 5902 triangles, 62 kB."}
