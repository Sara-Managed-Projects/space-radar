_m: 4.8, antenna_wide_m: 0.8, antenna_thick_m: 0.15, boom_m: 3.3, source: "eoPortal, https://www.eoportal.org/satellite-missions/terrasar-x, OPENED 2026-10-13: 'The TSX bus has a total height of about 5m with a diameter of roughly 2.4m'; 'The SAR antenna is mounted upon the hexagonal side of the spacecraft, which in flight points toward 33.8° off the nadir.'; 'The S/C bus design features a central hexagonal CFRP structure as the main load-carrying element.'; 'Three sides of the hexagon are populated with electronic equipment, while the sun-facing side is additionally carrying the solar array.'; 'The other nadir-looking side is reserved for the accommodation of an S-band TT&C antenna, a SAR data downlink antenna - carried by a deployable boom of 3.3 m length in order to avoid RF interferences during simultaneous radar imaging and data transmission to the ground - and a Laser Retro Reflector'; 'The deep-space-looking surface is used for the LCT (Laser Communication Terminal) and as a thermal radiator.'; 'Antenna aperture size 4.8 m x 0.8 m x 0.15 m'; 'Phase centers 12 (az.) x 32 (el.)'; 'The solar array is of size 5.25 m 2'; 'Sun-synchronous circular dawn-dusk orbit with a local time of ascending node at 18:00 hours'. eoPortal, https://www.eoportal.org/satellite-missions/tandem-x, OPENED 2026-10-13: 'TanDEM-X is identical to its twin, TerraSAR-X'. DERIVED: 2.4 m read as the hexagon across its corners, so 2.08 m across the flats and faces 1.2 m wide; 5.25 m2 as 4.9 x 1.07 m. READ OFF DLR'S RENDER: that the solar array is on the face opposite the antenna; the gold foil; the boom's lean toward one end; the dark forward end. OURS: a regular hexagon (the real section is not said to be regular); the pale patches on the two side faces; the laser terminal's box; the antenna's twelve panels drawn as tiles.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a regular six-sided prism 5.0 m long (cited), 2.4 m across its corners (cited as the diameter), in gold foil, one face 33.8 degrees off the nadir (cited). THE RADAR ANTENNA on that face: 4.8 m by 0.8 m by 0.15 m (cited), a grey back and twelve white tiles along it (twelve phase centres in azimuth, cited). THE SOLAR ARRAY: 4.9 m by 1.07 m (the cited 5.25 m2) of four sections fixed on the opposite face. THE RADIATOR: a pale skin on the face that looks at deep space (cited), with the laser terminal as a dark box on it. Two pale patches on each of the two side faces. On the other nadir-looking face: the 3.3 m boom (cited) leaning toward one end with a small white horn at its tip, an S-band cone, the laser reflector as a dark disc. A launch ring on one end, a dark six-sided plate on the other. No mirror pass: the craft is not symmetric, and no part is a mirror image of another. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the long axis along X, the antenna's face down and toward -Y, the array up and toward +Y. THIS IS HOW THE CRAFT FLIES: in its dawn-dusk orbit the Sun is square to the track, the long axis lies along the track, the array faces the Sun's side and the radar looks down to the other. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 8 768 triangles, 9 colours"}
  - {id: xmm-newton, file: site/models/xmm-newton.glb, kb: 44, budget_tris: 10000, class: telescope, kind: built-from-dimensions, used_for: "NORAD 25989 (XMM-NEWTON), in the whole active catalogue: ESA's X-ray observatory, in a 48-hour orbit that takes it 114 000 km out. It had no route and wore the shape of its class; public #966", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms; ESA's own model at scifleet.esa.int was NOT used: ESA's terms forbid derivative works)", licence: "Public domain (NASA's Scientific Visualization Studio's render, which the layout of the mirror end was read off; nothing of the picture is in the file); the shape is this project's, under this repository's licence. NEITHER ESA'S MODEL NOR ANY ESA PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and a NASA render of XMM-Newton (NASA's Scientific Visualization Studio, public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A RENDER, not a photograph: the craft from its mirror end, the eight-sided service module with a round aperture, three mirror modules and the smaller optical monitor in it, three open doors, the sun shield standing on one side, two wings of three panels, everything in black blankets", title: "XMM-Newton spacecraft animations (SVS20399 - XMM Beauty Still)", url: "https://commons.wikimedia.org/wiki/File:XMM-Newton_spacecraft_animations_(SVS20399_-_XMM_Beauty_Still).jpg", licence: "Public domain (NASA's Scientific Visualization Studio, svs.gsfc.nasa.gov/20399; the Commons API's LicenseShortName, read 2026-10-13)", credit: "NASA's Scientific Visualization Studio", read: 2026-10-13}], dimensions: {length_m: 10.0, span_m: 16.0, wing_panel_long_m: 1.94, wing_panel_wide_m: 1.81, tube_m: 6.8, mirror_outermost_m: 0.7, mirror_innermost_m: 0.306, source: "eoPortal, https://www.eoportal.org/satellite-missions/xmm-newton, OPENED 2026-10-13: 'a service module bearing the three X-ray mirror modules, propulsion and electrical systems, a long telescope tube and the focal plane assembly carrying the science instruments. The total length of XMM-Newton is 10 m, and its solar arrays give the satellite a 16 m span.'; 'The solar array has two wings, each with three rigid 1.94 m x 1.81 m panels, giving a total area of 21 m 2'; 'The two wings are body-fixed and have a Sun incidence angle variation around normal of up to 28º.'; 'Due to its length of 6.80 m, the Telescope Tube is physically composed of two halves: the upper and lower tubes.'; 'Mirror diameter and thickness Outermost:700 mm / 1.07 mm, Innermost: 306 mm / 0.47 mm'; 'Reflective surface Gold (250 nm layer)'; 'The SVM,carrying the spacecraft subsystems, the two solar-array wings, the TSS (Telescope Sun Shield) and the two S-band antennae.'; 'The SVM ... is also fully blanketed with the exception of panel radiators. On the Sun-side they are covered by mirror solar reflectors, while those on the anti-sun side of the satellite are painted white.'; 'The EPIC and RGS instruments are fitted with radiators, to passively cool the CCDs'; 'Together with the black lining of its internal surface'. DERIVED: 10 m as 1.5 m of service module and doors, 6.8 m of tube, 1.7 m of focal plane; the wings' roots 2.18 m from the axis, so that three 1.94 m panels a side reach 16 m. READ OFF NASA'S RENDER: the eight-sided service module, the round aperture with three mirrors and the smaller optical monitor, the three open doors, the sun shield standing on one side, the black blankets. OURS: the service module's 3.2 m and the tube's 2.1 m across (no page opened gives either), every shape at the focal-plane end (the render does not show it), the doors' places.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE SERVICE MODULE: an eight-sided body 3.2 m across and 1.4 m deep in black, a round aperture ring on its sky face, in it three mirror modules 0.70 m across (cited) in gold with a dark hub 0.306 m across (cited: the innermost shell), the optical monitor beside them, three open doors round the ring, a silver radiator on the Sun's side and a white one on the other (cited), the sun shield as a dark plate 2.5 m by 1.2 m standing on the Sun's side. THE TUBE: 6.8 m (cited) and 2.1 m across, black, a joint ring at its middle (it is two halves, cited), one vent door. THE FOCAL PLANE: a platform 2.9 m across, an eight-sided body, three white cone radiators toward the side away from the Sun, a camera head and two boxes on the end. THE WINGS: three panels of 1.94 m by 1.81 m a side (cited) on two rods each, 16.0 m tip to tip (cited). The wings are one definition written twice with the sign of x changed, so each side IS A MIRROR IMAGE of the other. THE SUN SHIELD STANDS 0.6 m PAST THE MIRROR END, so the file is 10.7 m long and not the cited 10 m. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the tube along Z with the mirrors at -Z (away from the Earth), the wings along X, the cells to +Y. TRUE OF THE REAL CRAFT: its wings are body-fixed with their cells to the Sun and its telescope looks square to the Sun. NOT TRUE: it holds a star for hours wherever that star is; the app stands it on end with the mirrors to the zenith. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 194 triangles, 10 colours"}
  - {id: metop, file: site/models/metop.glb, kb: 45, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 38771 (MetOp-B) and 43689 (MetOp-C), in the whole active catalogue: EUMETSAT and ESA's polar weather satellites. They had no route: each wore the shape of its class, a box with two wings and a dish; public #992. MetOp-A (retired 2021) is in no group the app loads; METOP-SGA1 is a different craft and has no row", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms; ESA's and EUMETSAT's own pictures were NOT used)", licence: "Public domain (NASA's picture of a model of the craft, which the layout was read off; nothing of the picture is in the file); the shape is this project's, under this repository's licence. NO ESA OR EUMETSAT PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and NASA's picture of a model of MetOp (NASA, public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PICTURE OF A MODEL, not a photograph of the craft: the gold body with silver instruments on its Earth face, a silver housing and a dark plate of apertures at one end, two white antenna masts, the long white ASCAT antennas, one wing beyond the other end on an arm with a gold yoke (the picture's frame cuts the wing)", title: "MetOp-A & -B spacecraft model", url: "https://commons.wikimedia.org/wiki/File:MetOp-A_%26_-B_spacecraft_model.png", licence: "Public domain (NASA, science.nasa.gov/toolkits/spacecraft-icons; the Commons API's LicenseShortName, read 2026-10-13)", credit: "NASA", read: 2026-10-13}], dimensions: {launch_height_m: 6.3, launch_section_m: 2.5, in_orbit_length_m: 17.6, in_orbit_width_m: 5.0, ascat_arm_m: 3.0, source: "eoPortal, https://www.eoportal.org/satellite-missions/metop, OPENED 2026-10-13: 'The overall architecture of the MetOp-A spacecraft comprises two largely independent modules, namely SVM (Service Module) and PLM (Payload Module).'; 'The SVM design is based on the SPOT MK3 bus'; 'SVM is a box-shaped structure interfacing with the launch vehicle and the PLM'; 'The instruments and antennas are mounted on the external panels'; 'The S/C overall size is: 6.2 m x 3.4 m x 3.40 m (launch configuration) and 17.6 m x 6.7 m x 5.4 m (on-orbit configuration).'; its Table 5: 'S/C size - 6.3 m (height) by 2.5 m x 2.5 m (transverse section) in launch configuration - 17.6 m x 6.6 m x 5.0 m, after solar array and antennas deployment'; 'Single sided solar arrays provide a power of 3.890 kW (EOL)'; 'All six antennas are slotted waveguide aluminum arrays. One antenna in each set is looking sideward at 90º (cross-track direction), one forward at 45º, and one aftward at 135º'; 'The mission is still in operation with MetOp-B and MetOp-C still in orbit.' ESA, 'About ASCAT', https://www.esa.int/Applications/Observing_the_Earth/Meteorological_missions/MetOp/About_ASCAT, OPENED 2026-10-13: 'ASCAT's two three-metre long antenna arms are gently deployed into a fixed V-shaped position at +135° and -135° with respect to the spacecraft flight direction. Each of the antenna arms provides the fore-beam of one swath and the aft-beam of the other.' ESA Bulletin 127 (August 2006), 'MetOp: The Space Segment for EUMETSAT's Polar System', https://www.esa.int/esapub/bulletin/bulletin127/bul127b_edwards.pdf, OPENED 2026-10-13: 'Size: 6.2m (high) by 3.4 x 3.4 m cross- section in launch configuration; 17.6 x 6.5 x 5.2 m with solar array and antennas. deployed'; 'The SVM is derived from the Envisat and Spot-5 service modules.' NOT FOUND on any page opened: the solar array's own length and number of panels, the size of ASCAT's middle antennas, which way the body lies to its track. READ OFF NASA'S PICTURE: one wing beyond the service module's end on a short arm with a gold yoke; the gold body with silver instruments on the Earth face; a silver housing and a dark plate of apertures at the far end with a gold shade under it; two white antenna masts; the long white ASCAT arms. OURS: the 17.6 m read as the body's 6.3 m, a 3.3 m arm and an 8 m wing of eight 1 m sections 5 m wide; which instrument box is which and each one's size; the middle ASCAT antennas as 2.2 m; the envelope's second number (6.5 to 6.7 m) is NOT reproduced: ours is 4.9 m.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: 6.3 m long and 2.5 m square (cited) in gold foil, the service module's 1.65 m in a darker gold with the launch ring on its end and a pale radiator on one side, two more on the payload module's sides, a silver box and a small cone antenna on its sky face; at the far end a silver housing 1.9 m square, a dark plate of apertures on the sky face beside it and a gold shade under it. THE EARTH FACE: six instrument boxes in silver and white, a scanner's drum, a 0.5 m dish. Two white antenna masts on one side, pointing at the Earth. ASCAT: two 3 m arms (cited) in a V from the middle of one long edge, each a white slab 0.34 m wide, and two middle antennas of 2.2 m lying across the body, each tilted 45 degrees to its side. THE WING: a 3.3 m arm with a gold yoke, then eight sections of 1 m by 5 m, 17.6 m from the body's far end to the tip (cited as the envelope); turned 45 degrees about its own axis toward the Sun's side. No mirror pass: the craft is not symmetric, and no part is a mirror image of another. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the instrument face to +Z (the Earth), the body and the wing along X, the wing's cells toward +Y and the sky. THE REAL WING TURNS once an orbit to follow the Sun, and the real body keeps one heading to its track; the app turns the whole craft about the vertical so that X is square to the Sun, and does not turn the wing. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 6 200 triangles, 10 colours"}
  - {id: envisat, file: site/models/envisat.glb, kb: 60, budget_tris: 14000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 27386 (ENVISAT), on the layers of bright satellites and of famous debris: ESA's eight-tonne Earth observatory, launched in 2002, dead since April 2012 and still in orbit. It was, and while this file is on its way still is, the shared radar blade (scene/models.js `radar`: Sentinel-1's antenna under a bus with two wings), which is not this craft; public #944", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms; ESA's own pictures and models were NOT used: ESA's terms forbid derivative works)", licence: "Public domain (a visitor's own photograph of the full-size model, released by its author, which the layout was read off; nothing of the picture is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). NO ESA PICTURE AND NO ESA MODEL WAS USED. NO LOGO AND NO LETTERING is on the mesh (the model in the photograph carries a logo; the file does not).", credit: "3D model: built by Space Radar from published dimensions and a photograph of the full-size model of Envisat by abrev (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PHOTOGRAPH OF THE FULL-SIZE MODEL on its stand, not of the craft: the body leaning, the ASAR antenna across it on the Earth side, standing off it and dark, the instruments as silver boxes on a gold-orange body, two white dishes, three cylinders on the far end, the wing beyond the service module", title: "Envisatmod", url: "https://commons.wikimedia.org/wiki/File:Envisatmod.jpg", licence: "Public domain (released by its author, the Commons user abrev: 'Model of Envisat in original size'; the Commons API's LicenseShortName, read 2026-10-14)", credit: "abrev (Wikimedia Commons)", read: 2026-10-14}], dimensions: {launch_length_m: 10.5, launch_envelope_diameter_m: 4.57, in_orbit_length_m: 26, in_orbit_width_m: 10, solar_panel_long_m: 14, solar_panel_wide_m: 5, asar_long_m: 10, asar_wide_m: 1.3, ka_mast_m: 2.0, ka_dish_m: 0.9, ra2_dish_m: 1.2, source: "eoPortal, https://www.eoportal.org/satellite-missions/envisat, OPENED 2026-10-14: 'S/C dimensions - Launch configuration: 10.5 m length; 4.57 m envelope diameter - In-orbit configuration: 26 m (total length with solar array) x 10 m x 5 m'; '6.5 kW (EOL) with single-sided solar arrays, size of solar panel: 5 m x 14 m'; 'EnviSat consisted of the Polar Platform ( PPF ) bus and the payload complement.'; 'The SM was derived from the SPOT Maverick-II (Mk-II) bus design, built around a Carbon Fibre Reinforced Plastic (CFRP) cone as the primary structure with a launcher interface at one end and the propulsion module at the other.'; 'The structure of the PLM consists of a 1.2 m diameter CFRP tube and a set of CFRP sandwich panels, forming the webs and external faces of the PLM box. The structure is conceived as a stack of four bays, each 1.6 m high.'; 'The PLM features externally mounted antennas (of ASAR and RA-2) and the following instruments (MERIS, MIPAS, GOMOS optical assembly, SCIAMACHY, MWR, and DORIS) on a payload carrier.'; 'Once deployed, the array is rotated to point continuously towards the sun using a solar-array drive mechanism, which is attached to the base of the central cone.'; 'The ASAR active antenna is a phased array of size 1.3 m x 10 m'; '10 m x 1.3 m (consisting of five 1.3 m x 2 m panels)'; 'The antenna array contains 20 tiles (each 1 m x 0.65 m in size)'; 'The assembly uses a 2 m deployable mast located on the opposite side of the satellite to the Earth. The mast is equipped with an azimuth and elevation pointing mechanism, which steers a 90 cm-diameter Cassegrain antenna pointed to the ARTEMIS satellite.'; MERIS: 'Instrument mass, power, size 200 kg, 175 W (average), 1.8 m x 0.9 m x 1.0 m'; RA-2: 'Antenna diameter, beamwidth 1.2 m'; 'LRR is mounted on the nadir panel close to the RA-2 antenna'; MWR: 'The antenna subsystem includes a 60 cm reflector'; 'The Local Time on Descending Node (LTDN) was at 1000 hours'; 'April 8, 2012: Contact with EnviSat was unexpectedly lost'; 'May 9, 2012: ESA declared the end of the EnviSat mission.' HOW THE THREE NUMBERS OF THE IN-ORBIT SIZE ARE READ (ours): 26 m is the body's 10.5 m, the 0.3 m that stands on its far end, a 1.2 m arm and the 14 m wing, end to end, as the page's own words 'total length with solar array' say; 10 m is the ASAR antenna, which lies ACROSS the body; 5 m is the wing's width. READ OFF THE PUBLIC-DOMAIN PHOTOGRAPH of the full-size model: the antenna across the body on its Earth face, standing off it, its Earth side dark; the wing beyond the service module's end; the instruments as silver boxes on a gold-orange body; three cylinders on the far end; two white dishes on the Earth face. OURS: the body's section (2.8 x 2.2 m); where each instrument stands and every box that is not MERIS; where along the body the antenna crosses it and where the Ka-band mast stands; fourteen 1 m sections of the wing; the wing's arm. NOT FOUND on the page: the body's width, the wing's panel count.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BODY: 10.5 m long (cited as the launch length) and 2.8 by 2.2 m across (ours): the payload module in gold foil, four bays of 1.6 m (cited) with a seam between each, and the service module in darker gold with a grey cone at its end (cited as a cone); pale radiators on three sides. THE ASAR ANTENNA: 10 m by 1.3 m (cited) of twenty dark tiles of 1 m by 0.65 m (cited) on a grey frame, ACROSS the body on its Earth face and standing off it on four struts. THE EARTH FACE: MERIS as a silver box of its cited size, the altimeter's 1.2 m dish on three struts (cited diameter), the laser reflector beside it (cited place), the microwave radiometer's 60 cm reflector (cited), an X-band dish, four more boxes (ours). THE FAR END: three silver cylinders and a silver housing. THE KA-BAND ANTENNA: a 2 m mast on the side away from the Earth with a 90 cm dish (both cited). THE SOLAR ARRAY: one wing 14 m by 5 m (cited) of fourteen sections on a 1.2 m arm with a copper yoke, 26 m from the body's far end to the tip (cited), turned 45 degrees about its axis toward the Sun's side. No mirror pass: the craft is not symmetric, and no part is a mirror image of another. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the body and the wing along X, the instruments on +Z (the Earth), the antenna along Y. AS IT FLEW WHILE IT WORKED the body lay across its track, the antenna along the track, and the wing turned once an orbit; the app keeps X square to the Sun and does not turn the wing. THE CRAFT IS DEAD (contact was lost in April 2012) and nobody steers it; the drawing is steady, and the card's own sentence (data/layers.js) says what is true of it now. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 10 720 triangles, 8 colours"}
  - {id: ers-1, file: site/models/ers-1.glb, kb: 44, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 21574 (ERS-1), on the layer of bright satellites: ESA's first Earth-observation satellite, launched in 1991; its mission ended in March 2000 and it is still in orbit. It was, and while this file is on its way still is, the shared radar blade (scene/models.js `radar`), which is not this craft. ERS-2 is in none of the saved data files of 2026-10-12 and has no row; public #945", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms; ESA's own pictures and models were NOT used: ESA's terms forbid derivative works)", licence: "Public domain (a visitor's own photograph of the full-size model, released by its author, which the layout was read off; nothing of the picture is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). NO ESA PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and a photograph of the full-size model of ERS by abrev (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PHOTOGRAPH OF THE FULL-SIZE MODEL on its stand, not of the craft: the radar antenna across the far end of the body, the scatterometer's two long antennas in a V beyond it, the dish on the Earth face, a gold payload module and a silver platform; the solar array stands on the ground in it", title: "Ers1mod", url: "https://commons.wikimedia.org/wiki/File:Ers1mod.jpg", licence: "Public domain (released by its author, the Commons user abrev: 'Model of European Remote Sensing Satellite (ERS) in original size'; the Commons API's LicenseShortName, read 2026-10-14)", credit: "abrev (Wikimedia Commons)", read: 2026-10-14}, {use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): a visitor's photograph of the model at La Villette from its Earth side, for the array across the end of its arm", title: "Maquette-ERS-1", url: "https://commons.wikimedia.org/wiki/File:Maquette-ERS-1.jpg", licence: "CC BY-SA 3.0 (Pline, own work; read 2026-10-14): share-alike, LOOKED AT ONLY, never fetched by the tool and not on any sheet", credit: "Pline (Wikimedia Commons)", read: 2026-10-14}, {use: "LOOKED AT ONLY (Commons calls it public domain and names no author, so it is NOT relied on as free: not fetched by the tool, on no sheet): a small picture of the craft in orbit, for the array beyond the platform's end on its arm", title: "Ers-1", url: "https://commons.wikimedia.org/wiki/File:Ers-1.gif", licence: "Commons says 'Public domain' and names NO AUTHOR AND NO SOURCE (read 2026-10-14): not relied on as free, LOOKED AT ONLY, never fetched by the tool and not on any sheet", credit: "unknown (Wikimedia Commons names none)", read: 2026-10-14}], dimensions: {overall_height_m: 11.8, payload_module_height_m: 3, payload_module_side_m: 2, solar_array_long_m: 11.7, solar_array_wide_m: 2.4, sar_antenna_long_m: 10, sar_antenna_wide_m: 1, scatterometer_fore_aft_m: 3.6, scatterometer_mid_m: 2.3, altimeter_dish_m: 1.2, source: "eoPortal, https://www.eoportal.org/satellite-missions/ers-1, OPENED 2026-10-14: 'The platform is a SPOT program bus (SPOT MK1 bus), modified to meet the needs of the ERS missions.'; 'The payload support module has dimensions of 2 m x 2 m x 3 m (height).'; 'The solar array (11.7 m x 2.4 m in size) consists of two 5.8 m x 2.4 m panels and supports a peak payload power of 2600 W. The antenna is a slotted-waveguide array made of metallized CFRP (Carbon Fiber Reinforced Plastic).'; '2384 kg (at launch), overall height of 11.8 m'; AMI in imaging mode: 'antenna size =10 m x 1 m; look angle = 23º'; AMI in wind scatterometer mode: 'Use of three separate sideways-looking antennas (fore, mid and aft beams'; 'swath width = 500 km (same side as SAR imaging)'; 'antenna length = 2.3 m (mid), 3.6 m(fore), 3.6 m (aft)'; 'RA-1 is operating in Ku-band, consisting of a reflector, waveguide feed, tripod plus supporting structure, horn feed and the waveguide'; 'antenna diameter = 1.2 m'; 'The MWR instrument uses a 60 cm Cassegrain offset-fed antenna to view the Earth in nadir direction'; LRR: 'diameter: ≤ 20 cm'; 'The ERS-1 mission ended on March 10, 2000, due to a failure of the onboard attitude control system.' THE PAGE DISAGREES WITH ITSELF on the array: 'a dual-wing solar array subassembly' and 'Solar array subassembly (2 wings)' in one place, 'two 5.8 m x 2.4 m panels' in another; the photographs show ONE array of two panels across the end of an arm, which is what is built. READ OFF THE PHOTOGRAPHS: the radar antenna across the far end of the body; the scatterometer's two long antennas in a V beyond it and the short one between them; the dish on the Earth face; the array on an arm beyond the platform, its long side square to the body; a gold payload module and a silver platform. HOW THE 11.8 m IS READ (ours): from the tips of the scatterometer's antennas to the array's far edge, along the body; the model is 11.8 m that way. OURS: the platform as 2 x 2 x 2 m; the arm's 1.3 m; the V's 45 degrees and the antennas' tilt; ten tiles on the radar antenna; the radiometer's box; every place on the Earth face.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BODY: the payload module, 2 by 2 by 3 m (cited) in gold foil with a pale skin on two sides, and the platform beyond it, 2 by 2 by 2 m (ours) in silver with white radiators and a ring at its end. THE SOLAR ARRAY: 11.7 m by 2.4 m of two panels (cited), across the end of a 1.3 m copper arm (ours), its long side square to the body, turned 45 degrees toward the Sun's side. THE RADAR ANTENNA: 10 m by 1 m (cited) of ten white tiles on a grey back at the far end, its length across the body, its face 23 degrees off the nadir (cited) and away from the body. THE WIND SCATTEROMETER: two white antennas of 3.6 m in a V of 45 degrees beyond the radar antenna and one of 2.3 m between them (lengths cited; the V and the tilts ours). THE EARTH FACE: the altimeter's 1.2 m dish on three struts (cited), a 60 cm microwave antenna (cited), the laser reflector (cited as 20 cm or less), a radiometer's box and two small antennas (ours). 11.8 m from the antennas' tips to the array's far edge (the cited overall height, read that way). No mirror pass; the scatterometer's two long antennas are each placed and are not a copy of one another. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the body along X with the array beyond its +X end, the dish on +Z (the Earth), the radar antenna along Y. AS IT FLEW the body lay across its track, the radar antenna along the track, and the array turned about its arm once an orbit; the app keeps X square to the Sun and does not turn the array. ITS MISSION ENDED IN 2000 and nobody steers it; the drawing is steady. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 6 812 triangles, 8 colours"}
  - {id: sentinel-1, file: site/models/sentinel-1.glb, kb: 43, budget_tris: 10000, class: satellite, kind: built-from-dimensions, used_for: "NORAD 39634 (SENTINEL-1A), 62261 (SENTINEL-1C) and 66315 (SENTINEL-1D), the three in the live saved data of 2026-10-12, and 41456 (SENTINEL-1B), whose mission ended in August 2022 and which is in no group the app loads (dormant): the Copernicus C-band radar satellites. They were, and while this file is on its way still are, the shared radar blade (scene/models.js `radar`), which was drawn after this very craft's antenna: a 12.3 m blade, a bus of 3.9 by 2.2 by 2.2 m and two wings of 4.6 m. The file has the craft's own bus (3.4 by 1.3 by 1.3 m) and its own wings (10 m each, 21 m tip to tip: longer than the antenna); public #948", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms; ESA's own pictures and models were NOT used: ESA's terms forbid derivative works)", licence: "CC BY 2.0 (DLR's photographs of a scale model, which the layout was read off: looked at, with credit; nothing of the pictures is in the file); the shape is this project's, under this repository's licence, built from published numbers (facts). NO ESA PICTURE WAS USED. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and DLR's photographs of a model of Sentinel-1 (DLR German Aerospace Center, CC BY 2.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; A PHOTOGRAPH OF A SCALE MODEL at a show, not of the craft: the gold bus with a white brace over silver skins on its flank, the antenna along it, pale on its