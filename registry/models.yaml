omprises two wings, stowed on the platform's lateral panels during launch, which are deployed once in orbit. Each antenna wing consists of two antenna panels.'; 'The SAS central panel comprises two antenna tiles, whereas the wing panels comprise three antenna tiles each.'; 'carefully unfolding the two 10 m-long solar wings and the 12 m-long radar antenna'; '+X S/C axis points towards the flight direction. S/C Y axis is aligned with the Sun direction.'; 'The first step in the sequence was the SAR +X wing release'; 'The +Y Solar Array deployment was telecommanded at the next contact'; 'Right side looking geometry'; 'Figure 75 illustrates that for the minimum orbital height (693 km) the mechanical SAR antenna off-nadir angle is more shallow (30.25º) than it is for the maximum orbital height (726 km). In the latter case, the mechanical SAR antenna off-nadir angle is 28.65º.'; 'The Sentinel-1 satellites fly in a near polar, sun-synchronized (dawn-dusk) orbit at 693 km altitude.'; 'LTAN (Local Time on Ascending Node) = 18:00 hours'; 'the spacecraft embarks the LCT (Laser Communication Terminal) unit'; 'August 3, 2022: The European Space Agency and the European Commission announce the end of the mission for the Copernicus Sentinel-1B satellite'; 'The satellite was replaced by Sentinel-1C, which launched in December 2024. Sentinel-1D, launched in November 2025'. ESA, 'Facts and figures', https://www.esa.int/Applications/Observing_the_Earth/Copernicus/Sentinel-1/Facts_and_figures, OPENED 2026-10-14 (words and numbers only): 'Satellite: 21 m long, 2.5 m wide, 4 m high with 2×10 m-long solar arrays and a 12 m-long radar antenna'; 'Launch: Sentinel-1A on 3 April 2014 (ended in June 2026) Sentinel-1B on 25 April 2016 (ended in August 2022) Sentinel-1C on 5 December 2024 Sentinel-1D on 4 November 2025'. DERIVED: tiles of 0.879 m; each wing a 1.4 m yoke and five panels of 1.72 m, 10 m from the bus's flank, 21.3 m tip to tip. READ OFF DLR'S PHOTOGRAPHS of a model: the gold bus; a white brace over silver skins on each flank; the antenna pale on its Earth side with a gold edge; a wing's white back and triangular yoke; a gold dome and four antenna cups at one end. THE ROLL IS DRAWN: the whole craft is turned 29.45 degrees about its length (the middle of the two cited angles), the antenna's face down and AWAY from the Sun, the cells up and toward it. That the look to the right is the look away from the Sun follows from the cited orbit (ascending at 18:00, so the Sun is on the left of a craft flying north); no page says it in a sentence. OURS: the wings' 2.5 m width (ESA's '2.5 m wide' read as theirs); the wings in one plane with the bus's sky face; the laser terminal, star trackers and rod antennas, in size and place.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BUS: 3.4 by 1.3 by 1.3 m (cited) in gold foil, a silver skin under a white brace of six members on each flank. THE RADAR ANTENNA: 12.3 m by 0.821 m (cited) on the Earth face, fourteen white tiles (cited) on a gold back. TWO SOLAR WINGS along Y, each 10 m from the bus's flank (cited): a white triangular yoke of 1.4 m and five panels (cited) of 1.72 m by 2.5 m (the width ours), cells to the sky, white backs; 21.3 m tip to tip (ESA: 21 m). At one end a gold dome and four antenna cups, at the other a launch ring; on the sky face the laser terminal and two star trackers; two rod antennas on the Earth side (all read off the photographs, sizes ours). THE WHOLE CRAFT IS ROLLED 29.45 degrees about its length (the antenna's mechanical off-nadir angle, cited as 30.25 to 28.65 degrees round the orbit): the antenna's face looks down and away from the Sun, the cells up and toward it. THE -Y WING IS BUILT AS THE +Y ONE TURNED ABOUT THE BODY, not as its mirror image: no mirror pass was run, and the craft is symmetric about the middle of its antenna, as the page says of the antenna. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the antenna along X; the roll is in the file. THIS IS HOW THE CRAFT FLIES: in its dawn-dusk orbit the Sun is square to the track, the antenna lies along the track and the wings along the craft's Y, toward and away from the Sun (cited), and the radar looks to the right of the track (cited), which in that orbit is away from the Sun (derived, not cited in a sentence). Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 5 804 triangles, 8 colours"}
