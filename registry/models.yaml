is on the mesh.", credit: "3D model: built by Space Radar from published dimensions and figures by Benkhoff et al. 2021 and Magnafico et al. 2024 (CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; Benkhoff et al. 2021, Fig. 10, 'BepiColombo cruise configuration' (CC BY 4.0): the MTM at the bottom with five-panel wings either side, the MPO's own wing above them, the sunshield on top", title: "BepiColombo cruise configuration", url: "https://commons.wikimedia.org/wiki/File:BepiColombo_cruise_configuration.webp", licence: "CC BY 4.0 (J. Benkhoff et al., 'BepiColombo - Mission Overview and Science Goals', Space Sci. Rev. 217:90 (2021), Fig. 10; Commons' LicenseShortName, read 2026-10-15)", credit: "J. Benkhoff et al. 2021, CC BY 4.0", read: 2026-10-15}, {use: "drawn from; Magnafico et al. 2024, 'The four components of the BepiColombo Mercury Composite Spacecraft (MCS)' (CC BY 4.0): the order of the stack, the MPO's radiator plate rising beside the conical sunshield, the dish on the MPO's side", title: "BepiColombo MCS composition", url: "https://commons.wikimedia.org/wiki/File:BepiColombo_MCS_composition.png", licence: "CC BY 4.0 (C. Magnafico et al., arXiv:2409.02015; Commons' LicenseShortName, read 2026-10-15)", credit: "C. Magnafico et al. 2024, CC BY 4.0", read: 2026-10-15}, {use: "looked at, with credit; SkywalkerPL's photograph of the MPO at ESTEC (CC BY 3.0): the white radiator and silver blankets", title: "BepiColombo MPO ESTEC", url: "https://commons.wikimedia.org/wiki/File:BepiColombo_MPO_ESTEC.jpg", licence: "CC BY 3.0 (SkywalkerPL, own work; Commons' LicenseShortName, read 2026-10-15)", credit: "SkywalkerPL (Wikimedia Commons)", read: 2026-10-15}, {use: "LOOKED AT ONLY (share-alike: not fetched by the tool, on no sheet): ESA's photograph of the stack, for the blankets", title: "BepiColombo stack cropped", url: "https://commons.wikimedia.org/wiki/File:BepiColombo_stack_cropped.jpg",