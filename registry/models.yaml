  # 2026-10-12 (public #938, internal spec 0064): THE FIRST MODEL OF ITS KIND. No free mesh of Cygnus exists (issue #423), so this one was
  # GENERATED from a NASA photograph by an image-to-3D model (TRELLIS) and then cleaned, re-proportioned to cited metres and coloured
