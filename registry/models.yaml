ssions/MetOp_Second_Generation/MetOp-SG_facts_and_figures, OPENED 2026-10-20: in orbit the solar array 'extends sideways more than 11 m', a '24 m sq' panel; B1's wing 'four-panel' (ESA's pictures of the A satellite show four too). OURS: the body 6.5 by 2.6 by 2.15 m with the dark payload module under the gold, every instrument's size and place as read off ESA's pictures, the panels 2.4 by 2.5 m, a yoke of 1.8 m, the wing's turn (55 degrees about its axis), 11.75 m from the wall to the tip", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BODY: gold blankets, quilted and seamed, over a dark grey payload module; white radiator stripes on the side walls; two large ribbed radiators on the zenith deck; star trackers, the RO's zenith antenna. IASI-NG at the -Y end on top, a big gold box with the sloping shield of its passive cooler; the RO's velocity antenna on that end, its anti-velocity antenna on the other. THE EARTH FACE (+Z): dark blankets and the instruments under them, METimage with its scan drum and port, Copernicus Sentinel-5 with its slit, sun baffle and radiator fins, the microwave sounder under its black shroud with its reflector and louvred side, 3MI's two camera heads at the +Y end; two data dishes on masts, S-band antennas, thruster pods. THE WING: a drive on the -X wall near the +Y end, a dark violet yoke with copper harness, four panels 2.4 by 2.5 m, dark cells with silver string lines, white backs with violet harness, hinges. The app's axes: the Earth face +Z, the wing along -X, its cells toward +Y. No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body), blankets as rumpled sheets with patches a shade lighter and darker and taped seams, so they are not flat slabs; drawn physically based on tier 1 and up (`look: pbr`, scene/pbr.js: gold and silver blankets as crinkled metal foil, white beta cloth matt, cells under glass, struts and dishes bare metal) and on the toon ramp on phones