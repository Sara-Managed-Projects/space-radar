are spherical and covered with 60 identical synthetic fused silica retroreflectors.'; 'The shell of each body is covered with 20 triangular Aluminum plates, each containing three laser retroreflectors.' NOT CITED: the size of a cube's face (drawn 33 mm), where the three sit on a plate (drawn 15 degrees from its middle toward its corners), that the twenty plates are the faces of an icosahedron (the page says 20 triangular plates; twenty equal triangles on a ball are one)", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. A ball of 796 even triangles 24 cm across; on it 60 flat discs, three on each of the twenty faces of an icosahedron, 15 degrees from the face's middle toward its corners, and a dark strip along each of the thirty seams between the plates. The page says twenty triangular plates of three; that they are an icosahedron's faces, where the three sit and the 33 mm of a cube's face are OURS. DRAWN DIFFERENTLY FROM THE CRAFT: each face stands proud of the ball where the real cubes are set into it; Starlette and Stella differ inside (the core's alloy) and wear one file. The poles are on the file's Y axis. No mirror pass. Colours are this project's own flat ones, illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 8 956 triangles, 3 colours"}
