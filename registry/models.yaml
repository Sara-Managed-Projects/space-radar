  # Release 1.3.0, stage W3-b (internal spec 0077 task 9; public #955, #956, #1101, #993): four ESA and EUMETSAT Earth explorers,
  # BUILT from cited numbers with the part library (no agency publishes a model of any of them under terms that allow a derivative).
  - {id: earthcare, file: site/models/earthcare.glb, kb: 75, budget_tris: 10000, look: pbr, class: satellite, kind: built-from-dimensions, used_for: "NORAD 59908, EarthCARE, the ESA and JAXA cloud, aerosol and radiation explorer launched in May 2024 (the White Dragon): a white box with the cloud radar's 2.5 m dish out in front looking at the Earth, the lidar's telescope and the radiometer's three on its Earth face, and five panels trailing behind on a yoke. It was the class shape of a satellite, a box with two wings and a dish; public #955", source: "built by this project in code (release 1.3.0 stage W3-b's part library, lib.py and parts.py, and one script a craft, kept with the stage's notes in ~/space-radar-handoff/release-1.3/W3-b/build), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh: NASA's 3D Resources and NASA Science have none of these craft; ESA publishes no model of them under terms that allow a derivative (its multimedia terms, the ESA Standard Licence, allow use for information and education, not an altered model); EUMETSAT publishes none (read 2026-10-20)", licence: "No ESA or JAXA picture or model is in the file. Looked at only: ESA's photographs and pictures under the ESA Standard Licence (named under `references`). Compared with, with credit: ESA's photograph 'Cleaning EarthCARE' (CC BY-SA 3.0 IGO) and Syced's photograph of JAXA's 1/50 model (CC0), both on Wikimedia Commons; nothing of them is in the file. The shape is this project's, under this repository's licence, built from published numbers (facts).", credit: "3D model: built by Space Radar from ESA's and eoPortal's published dimensions; compared with photographs by ESA (CC BY-SA 3.0 IGO) and Syced (CC0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with; EarthCARE before shipment: the white body, the lidar module's face, the radar's dish in silver blanket", title: "Cleaning EarthCARE ESA25462753", url: "https://commons.wikimedia.org/wiki/File:Cleaning_EarthCARE_ESA25462753.jpg", licence: "CC BY-SA 3.0 IGO (European Space Agency; Commons' LicenseShortName, read 2026-10-20)", credit: "ESA, CC BY-SA 3.0 IGO", read: 2026-10-20}, {use: "compared with; JAXA's 1/50 model in the JAXA Space Dome: the whole layout, the trailed wing of five panels on its yoke, the dish in front", title: "Inside JAXA Space Dome 5", url: "https://commons.wikimedia.org/wiki/File:Inside_JAXA_Space_Dome_5.jpg", licence: "CC0 (Syced, own work; Commons' LicenseShortName, read 2026-10-20)", credit: "Syced, CC0", read: 2026-10-20}, {use: "drawn from; the deployed wing in the cleanroom: five panels, the copper bus bars in steps, the hold-down points", title: "EarthCARE solar wing deployed ESA24376876", url: "https://commons.wikimedia.org/wiki/File:EarthCARE_solar_wing_deployed_ESA24376876.jpeg", licence: "CC BY-SA 3.0 IGO (European Space Agency; Commons' LicenseShortName, read 2026-10-20)", credit: "ESA, CC BY-SA 3.0 IGO", read: 2026-10-20}, {use: "LOOKED AT ONLY (ESA Standard Licence): ESA's renders 'EarthCARE in detail', 'EarthCARE unwrapped', 'EarthCARE over Europe', the picture 'EarthCARE facts and figures'", title: "EarthCARE over Europe", url: "https://www.esa.int/ESA_Multimedia/Images/2024/01/EarthCARE_over_Europe", licence: "ESA Standard Licence; looked at only", credit: "ESA", read: 2026-10-20}, {use: "LOOKED AT ONLY (ESA Standard Licence): the photographs 'EarthCARE standing proud in the anechoic chamber' and 'Last look at EarthCARE'", title: "EarthCARE standing proud in the anechoic chamber", url: "https://www.esa.int/ESA_Multimedia/Images/2023/10/EarthCARE_standing_proud_in_the_anechoic_chamber", licence: "ESA Standard Licence; looked at only", credit: "ESA", read: 2026-10-20}], dimensions: {length_m: 17.2, width_m: 2.5, depth_m: 3.5, array_m2: 21, dish_m: 2.5, source: "ESA, EarthCARE facts and figures, https://www.esa.int/Applications/Observing_the_Earth/FutureEO/EarthCARE/Facts_and_figures, OPENED 2026-10-20: 17.2 m long including an 11 m solar array, 2.5 m wide, 3.5 m deep; ESA's picture 'EarthCARE facts and figures': '17.2 x 2.5 x 3.5 m'; ESA, EarthCARE satellite: five sections, 21 m2, trailing behind the platform. eoPortal, https://www.eoportal.org/satellite-missions/earthcare, OPENED 2026-10-20: 'a deployable, trailed array made of five identical panels', '21.5 m2', the yoke '1.9 m long'; the CPR 'a 2.5 m diameter offset Cassegrain reflector' fixed at nadir, supported by the lidar's top panel; ATLID's telescope '620 mm' on the nadir side; the MSI on the anti-sun side, its camera tilted 5 degrees; the BBR's telescopes at nadir and +-55 degrees; star trackers on the zenith panel. The two give 21 and 21.5 m2: we built 21 (five panels 1.68 by 2.5 m). OURS: the body 4.1 by 2.3 by 2.0 m, the dish's place and its 29 degree lean, the radar tower, the wing's turn (60 degrees about its axis), every instrument's size", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BODY: white beta-cloth blankets, quilted, with taped seams, the service module (rear) and the lidar module (front) parted by a band; external struts in an N pattern on both sides; mirror radiators with their lines; the orange battery radiator box on top; star trackers on the zenith panel beside the radar; an S-band antenna on a mast. THE RADAR (CPR): its tower on the front of the zenith panel, the 2.5 m dish out in front with its hollow to the Earth, wrapped in silver blanket on both faces, on a truss, with its sub-reflector and feed. THE EARTH FACE: the lidar's 620 mm telescope in a white baffle and its emitter, the radiometer's three telescopes (nadir and 55 degrees fore and aft), the imager on the anti-sun corner with its baffle and calibration unit, X-band antennas, thrusters at the rear corners, the launch adapter ring. THE WING: the drive on the rear face, a 1.9 m yoke, five panels 1.68 by 2.5 m, cells dark with the copper bus bars in their stepped pattern and white hold-down points, white backs with violet harness lines, hinges. The app's axes: the flight direction +X (the dish in front), the Earth face +Z, the cells toward +Y. No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body), blankets as rumpled sheets with patches a shade lighter and darker and taped seams, so they are not flat slabs; drawn physically based on tier 1 and up (`look: pbr`, scene/pbr.js: gold and silver blankets as crinkled metal foil, white beta cloth matt, cells under glass, struts and dishes bare metal) and on the toon ramp on phones. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, 14 colours at most, blankets' normals creased at 12 degrees and the rest at 40, meshopt), with nothing resampled or decimated: every triangle keeps the colour it was built with. NO LOGO, FLAG OR LETTERING is on the mesh. 8866 triangles, 75 kB."}  # 0077 W3-b
  - {id: biomass, file: site/models/biomass.glb, kb: 94, budget_tris: 12000, look: pbr, class: satellite, kind: built-from-dimensions, used_for: "NORAD 63772, Biomass, ESA's P-band forest radar launched in April 2025: a tall gold bus with one wing of four panels, the radar's feed on its wall, and over it, on a 7.5 m boom, the 12 m mesh reflector that opens like an umbrella. It was the class shape of a satellite; public #956. Not NISAR's reflector, which is a ring of trusses", source: "built by this project in code (release 1.3.0 stage W3-b's part library, lib.py and parts.py, and one script a craft, kept with the stage's notes in ~/space-radar-handoff/release-1.3/W3-b/build), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh: NASA's 3D Resources and NASA Science have none of these craft; ESA publishes no model of them under terms that allow a derivative (its multimedia terms, the ESA Standard Licence, allow use for information and education, not an altered model); EUMETSAT publishes none (read 2026-10-20)", licence: "No ESA picture or model is in the file. Looked at only: ESA's photographs and pictures under the ESA Standard Licence (named under `references`). Compared with, with credit: ESA's picture 'Biomass in orbit' and photograph 'Rolling Biomass to the cleanroom' (CC BY-SA 3.0 IGO, the first on esa.int, the second on Wikimedia Commons); nothing of them is in the file. The shape is this project's, under this repository's licence, built from published numbers (facts).", credit: "3D model: built by Space Radar from ESA's and eoPortal's published dimensions; compared with ESA's pictures (CC BY-SA 3.0 IGO)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with; ESA's picture of Biomass in orbit: the gold bus, the wing, the boom, the reflector's ribs, mast and mesh", title: "Biomass in orbit", url: "https://www.esa.int/ESA_Multimedia/Images/2025/02/Biomass_in_orbit", licence: "CC BY-SA 3.0 IGO (ESA's page, read 2026-10-20)", credit: "ESA, CC BY-SA 3.0 IGO", read: 2026-10-20}, {use: "compared with; the flight model in its gold blankets with the stowed reflector, at Europe's Spaceport", title: "Rolling Biomass to the cleanroom ESA507406", url: "https://commons.wikimedia.org/wiki/File:Rolling_Biomass_to_the_cleanroom_ESA507406.jpg", licence: "CC BY-SA 3.0 IGO (European Space Agency; Commons' LicenseShortName, read 2026-10-20)", credit: "ESA, CC BY-SA 3.0 IGO", read: 2026-10-20}, {use: "LOOKED AT ONLY (ESA Standard Licence): 'Biomass standing proud', 'Biomass shows off', 'Biomass in the anechoic chamber' (the feed), 'Biomass from below'", title: "Biomass in the anechoic chamber", url: "https://www.esa.int/ESA_Multimedia/Images/2025/02/Biomass_in_the_anechoic_chamber", licence: "ESA Standard Licence; looked at only", credit: "ESA", read: 2026-10-20}, {use: "LOOKED AT ONLY (ESA Standard Licence): 'Biomass stowed and deployment configurations' and the satellite's own picture of the opened reflector", title: "Biomass antenna reflector deployed", url: "https://www.esa.int/ESA_Multimedia/Images/2025/05/Biomass_antenna_reflector_deployed", licence: "ESA Standard Licence; looked at only", credit: "ESA", read: 2026-10-20}], dimensions: {reflector_m: 12, boom_m: 7.5, focal_m: 7.8, array_m2: 6.8, source: "eoPortal, Biomass, https://www.eoportal.org/satellite-missions/biomass, OPENED 2026-10-20: '12 m circular projected aperture', the feed 'a 3 x 2 array of cavity-backed circular microstrip radiators, mounted on the -Y wall at the lower end of the satellite', 'Two pairs of radiators (upper and lower) are fed separately'. ESA, Biomass, The satellite, https://www.esa.int/Applications/Observing_the_Earth/FutureEO/Biomass/The_satellite, OPENED 2026-10-20: the reflector 'just over 12 m across', '7.5-metre-long' boom, 'a three-piece boom', '6.8 m2 triple junction GaAs cells', the focal length '7.8 m'. eoPortal says 3 x 2 radiators; ESA's photograph of the flight model in the anechoic chamber shows two by two on the wall: we built two by two (the two fed pairs). OURS: the bus 1.3 by 1.2 by 3.4 m (read off the photographs against the people beside it), nine ribs (counted off ESA's pictures; the satellite's own picture of the opened reflector shows eight clearly), the reflector's tilt, the wing's panels 0.98 by 2.05 m, the 7.54 m the boom is drawn", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. THE BUS: orange-gold blankets, quilted and seamed, a wider propulsion module at the Earth end, white radiator stripes and plates, the black face (+Y) where the folded reflector rode to orbit with its hold-down brackets; star trackers, S-band and X-band antennas, thrusters, the launch adapter ring. THE FEED: two by two tan cavity-backed radiators on a plate on the -Y wall at the Earth end, turned up toward the reflector. THE WING: a drive and a yoke of white struts on the +X wall, four tall panels along +X, cells to +Y, black backs with red harness and gold connectors. THE REFLECTOR: nine ribs from a hub, each with a joint half way and a spreader, the gold mesh between them drawn in to scallops at the rim, a mast out of the back with cords to every spreader and rib tip, cords round the rim; hollow toward the feed, a sag for a 7.8 m focal length; on a three-piece boom from a hinge at the bus's zenith end to the rim at the rib nearest the bus. The real radar looks to one side by rolling the craft; the app keeps +Z at the Earth. No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body), blankets as rumpled sheets with patches a shade lighter and darker and taped seams, so they are not flat slabs; drawn physically based on tier 1 and up (`look: pbr`, scene/pbr.js: gold and silver blankets as crinkled metal foil, white beta cloth matt, cells under glass, struts and dishes bare metal) and on the toon ramp on phones. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, 14 colours at most, blankets' normals creased at 12 degrees and the rest at 40, meshopt), with nothing resampled or decimated: every triangle keeps the colour it was built with. NO LOGO, FLAG OR LETTERING is on the mesh. 10210 triangles, 94 kB."}  # 0077 W3-b
