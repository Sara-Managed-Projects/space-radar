array_1_m: 5.0, solar_array_2_m: 1.082, span_m: 14.67, l_band_antenna_diameter_m: 1.4, source: "European GNSS Service Centre (EUSPA), 'Galileo Satellite Metadata', https://www.gsc-europa.eu/support-to-developers/galileo-satellite-metadata, OPENED 2026-10-13, section 6.2 'FOC Satellites', 'Dimensions of the Box with respect to the mechanical RF': 'ΔX = 2.530 m', 'ΔY = 1.200 m', 'ΔZ = 1.100 m', '±Z − panel = 3.036 m2'; section 6: 'The Galileo spacecraft is a typical box-wing type satellite, consisting of a central cube (the box) and two rectangular solar panels (the wings) attached to it'; 'The surface area of each solar array amounts to 5.41 m2 (= 5.000 m x 1.082 m)'; section 2.2: 'The +Zs-axis is normal to the separation plane and points towards the L-Band Navigation Antenna. The +Xs-axis is normal to the clock panel and points towards the clock panel'; section 3.1: 'the body is fixed in a way it keeps the Z axis towards the Earth Centre (in order to illuminate the Earth with its Navigation Antenna), the Y axis is perpendicular to the Sun and the X axis points towards deep space'; its table of surfaces: the -X face all 'A' (absorption 0.93: a black blanket), the +X and both Y faces mostly 'C' (specular 0.73: radiators). eoPortal, https://www.eoportal.org/satellite-missions/galileo-foc, OPENED 2026-10-13: 'Spacecraft body size, span' '2.5 m x 1.2 m x 1.1 m'; 'Spacecraft span' '14.67 m'; '2 wings, 2 panels each'; and under a picture of ESA's: 'the 2.5 m by 1.2 m by 1.1 m satellite's main 1.4-m diameter antenna transmits L-band navigation signals down to Earth. To its left is the hexagonal search and rescue antenna'; 'To the bottom right of the navigation antenna are a pair of infrared Earth sensors'; 'Above them is the laser retro-reflector'; 'Above that is the circular C-band antenna'. ESA, https://www.esa.int/Applications/Satellite_navigation/Galileo/Satellite_anatomy, OPENED 2026-10-13: 'Two S-band antennas'; 'The satellite rotates twice per orbit to allow the solar wings to face the Sun's rays'. DERIVED: each wing's yoke is 1.735 m, what is left of the 14.67 m span after a 1.2 m body and two 5.0 m arrays. NOT CITED: exactly where on the Earth face each antenna sits (placed from eoPortal's words and the model photograph looked at), the search-and-rescue antenna's size (0.75 m), the C-band antenna's (0.3 m), every small part's size.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 1.2 m along the wings, 2.53 m across them and 1.1 m along the Earth axis (EUSPA's numbers), black, with silver radiators on the two faces the wings stand on and on the clock end. THE EARTH FACE, the largest: the navigation antenna as a disc 1.4 m across (cited; it is wider than the body and overhangs it) with twelve round elements on it (the pattern is ours), the six-sided search-and-rescue antenna beside it with seven patches, the round C-band antenna, the laser reflector, two Earth sensors, an S-band antenna. Two wings, each array 5.000 x 1.082 m of two panels on a 1.735 m yoke, 14.67 m tip to tip. THE SECOND WING IS A MIRROR IMAGE of the first. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: Galileo's +Z (the antenna) is the app's +Z, its Y (the wings) the app's X, and its -X, the black face the Sun is kept on, the app's +Y. AS IT FLIES, in part: the real craft keeps its antenna on the Earth and its wing axis square to the Sun, which is the app's rule too; it also turns each wing on its axis to face the Sun, which the app does not, so the file's cells face the Sun's side of the sky. Colours are this project's own flat ones (body #2E3138, antenna #C7A24E, cells #1F2B4D), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 7 360 triangles, 10 colours"}
  - {id: michibiki, file: site/models/michibiki.glb, kb: 57, budget_tris: 12500, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite named QZS-2 or QZS-4 (2 records in the live saved data of 2026-10-12: QZS-2 (MICHIBIKI-2), QZS-4 (MICHIBIKI-4)): the two Michibiki craft with the cone-covered helical antenna. They were, and while this file is on its way still are, the family navigation box at Galileo's size, a third of theirs. QZS-1R, QZS-3, QZS-6 and QZS-7 keep that box: their antennas differ; public #989", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms)", licence: "The shape is this project's, under this repository's licence, built from published numbers (facts). The render compared with is CC BY 4.0 (Cabinet Office of Japan) and is not in the file. The Cabinet Office's dimension drawing was READ FOR ITS NUMBERS AND LAYOUT and is not reproduced. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from the dimensions in the Cabinet Office of Japan's QZS-2 satellite information; compared with a render from the Quasi-Zenith Satellite System website (CC BY 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with for the colours and the wings; A RENDER, and OF QZS-1R: the same bus and wings with a FLAT antenna where QZS-2 and QZS-4 have a cone", title: "QZS-1R CG05", url: "https://commons.wikimedia.org/wiki/File:QZS-1R_CG05.png", licence: "CC BY 4.0 (Cabinet Office of Japan, Quasi-Zenith Satellite System website, qzss.go.jp/overview/download/cg-image1r.html)", credit: "Quasi-Zenith Satellite System website, Cabinet Office of Japan", read: 2026-10-13}], dimensions: {body_1_m: 2.4, body_2_m: 2.4, height_m: 6.2, wing_m: 8.3, span_m: 19.0, solar_array_area_m2: 14.9, l_ant_cone_bottom_m: 1.8, l_ant_cone_top_m: 1.5, l_ant_cone_height_m: 0.8, source: "Cabinet Office, Government of Japan, 'QZS-2 Satellite Information', SPI-QZS2_C (revision C, June 28, 2019), https://qzss.go.jp/en/technical/qzssinfo/khp0mf0000000wuf-att/spi-qzs2_c.pdf, OPENED 2026-10-13 (the list it hangs from: https://qzss.go.jp/en/technical/qzssinfo/index.html), section 6 'Geometry', 'Figure 4 Satellite dimensions' '(Unit: mm)', whose dimension lines read 8300, 2400, 8300 (each wing, the body, the other wing: 19.0 m tip to tip), 6200 (height, nozzle to antenna top), 2400 and 2850 (the body and the antenna deck seen from the wing's side); Table 4 'Optical properties': 'SAP 14.9' m2 on each Y face, '+Y MLI 6.2, Radiator 3.9', '-Y MLI 5.7, Radiator 4.4', '+X MLI 10.1', '-Z MLI 5.6'; its note 1: 'L-ANT shape is approximately depicted as a truncated circular cone comprised of Ø1.5m and Ø1.8m circles 0.8m apart'; section 2: 'The +Z-axis is oriented to the bore sight direction of the L-ANT antenna. The +Y-axis is parallel to the rotation axis of the solar panels'; section 3 'Attitude Law': 'Yaw steering mode: The +z-axis is pointing to the Earth. The y-axis is oriented perpendicular to the plane made up by the Sun, Earth and satellite.' The same office's documents for the other craft (SPI-QZS1R_A, SPI-QZS3_F, SPI-QZS6, opened the same day) give the same 14.9 m2 arrays; the drawing of QZS-1R shows A FLAT ANTENNA DECK WITH NO CONE, and eoPortal, https://www.eoportal.org/satellite-missions/qzss, OPENED 2026-10-13, says: 'QZS-1, QZS-2, and QZS-4 have L-band antennas that are helical array antennas, but QZS-3 uses a flat patch antenna', so THIS FILE IS QZS-2 AND QZS-4 ONLY. JAXA, https://global.jaxa.jp/countdown/f18/overview/michibiki_e.html, OPENED 2026-10-13, of the FIRST Michibiki (retired): '2.9m in depth x 3.1m in width x 6.2m in height (Length between the tips of the paddles: 25.3 m)'. DERIVED: the body's box is 4.25 m long (a 10.1 m2 side face over 2.4 m); each wing is two panels of 3.2 x 2.33 m (14.9 m2) on a 1.9 m yoke. READ OFF THE DRAWING, which is not reproduced: where the wings stand on the body, the deck's two small helical antennas and the corner reflector, the nozzle. Colours are the render's: a black blanket, silver radiators, a white antenna cover.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 2.4 x 2.4 x 4.25 m, black, with silver radiators on the two faces the wings stand on, grey patches on the Sun's side, and an apogee nozzle. THE EARTH END: a deck 2.85 m across and on it the L-band antenna's cover, a drum under a truncated cone 1.8 m to 1.5 m across and 0.8 m tall (the Cabinet Office's own approximation of it), white, with sixteen ribs (ours), two small dark antennas and a reflector plate beside it. 6.2 m from the nozzle to the cone's top. Two wings of two panels, 8.3 m each from the body, 19.0 m tip to tip. THE SECOND WING IS A MIRROR IMAGE of the first. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: QZSS's +Z (the antenna) is the app's +Z, its Y (the wings) the app's X, its -X (the Sun's side) the app's +Y. AS IT FLIES, in part: the real craft keeps its antenna on the Earth and its wing axis square to the Sun, which is the app's rule too; it also turns each wing on its axis to face the Sun, which the app does not, so the file's cells face the Sun's side of the sky. Colours are this project's own flat ones (body #2A2D33, cover #F2F4F7, cells #2A3F7A), illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 11 702 triangles, 10 colours"}
  - {id: irnss, file: site/models/irnss.glb, kb: 41, budget_tris: 7000, class: satellite, kind: built-from-dimensions, used_for: "any record of klass satellite named IRNSS-1A to IRNSS-1I (7 records in the live saved data of 2026-10-12): the first generation of India's NavIC on the I-1K bus. They were, and while this file is on its way still are, the family navigation box at Galileo's size. NVS-01 (IRNSS-1J), the second generation on a larger bus, keeps that box; public #990", source: "built by this project in code (the private tool model-from-images: assemble.py, from a yaml of primitives), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh (NASA's 3D Resources on GitHub, 1 583 paths read 2026-10-13, has none of this craft; the survey of 2026-10-13 found no agency model of it under usable terms)", licence: "GODL-India (ISRO's drawing it was drawn from: Government Open Data License - India, free to use with attribution); the shape is this project's, under this repository's licence. NO LOGO AND NO LETTERING is on the mesh.", credit: "3D model: built by Space Radar from ISRO's published dimensions and drawing of the IRNSS-1 series (ISRO, GODL-India)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; ISRO'S DRAWING, not a photograph: the cube, the yellow Earth face with its round antenna plate and red horns, one panel a wing, the dome and the nozzle on opposite sides", title: "IRNSS Series 1", url: "https://commons.wikimedia.org/wiki/File:IRNSS_Series_1.jpg", licence: "GODL-India (Government Open Data License - India; Indian Space Research Organisation, isro.gov.in)", credit: "Indian Space Research Organisation (ISRO)", read: 2026-10-13}], dimensions: {bus_1_m: 1.58, bus_2_m: 1.5, bus_3_m: 1.5, power_w: 1660, source: "ISRO, 'IRNSS-1A', https://www.isro.gov.in/IRNSS_1A.html, OPENED 2026-10-13: 'Physical Dimensions' '1.58 metre x 1.50 metre x 1.50 metre'; 'Lift-off Mass' '1425 kg'; 'Power' 'Two solar panels generating 1660 W, one lithium-ion battery of 90 Ampere-Hour capacity'; 'Propulsion' '440 Newton Liquid Apogee Mo[tor]'; 'The ranging payload of IRNSS-1A consists of a C-band transponder'; 'IRNSS-1A also carries Corner Cube Retro Reflectors for laser ranging'. eoPortal, https://www.eoportal.org/satellite-missions/irnss, OPENED 2026-10-13: 'Spacecraft size (launch configuration)' '1.58 m x 1.5 m x 1.5 m'; 'The IRNSS satellites are configured around the spacecraft bus I-1K'; 'Attitude control of the satellite is provided with yaw steering, a capability to optimize the use of the solar panels'. NO PAGE OPENED GIVES THE SPAN OR THE SOLAR PANELS' SIZE. OURS: each wing is ONE panel (ISRO's drawing) of 1.9 x 1.75 m, sized so that two of them could give the cited 1660 W, on a 0.9 m yoke, which makes 7.1 m tip to tip: AN ESTIMATE. READ OFF ISRO'S DRAWING: the round antenna plate on the Earth face with its ring of elements round a middle cluster (the count, sixteen and seven, is ours), the two red horns beside it, the six-sided reflector plate at a corner, the dome on one side face and the nozzle on the opposite one, the yellow blanket.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 1.5 x 1.58 x 1.5 m (ISRO's numbers), grey. THE EARTH FACE in yellow foil: a round plate 1.04 m across with sixteen elements in a ring round seven (the counts are ours), two red horns, a six-sided reflector plate, a small sensor. A dome in a frame on one side and the apogee motor's nozzle on the opposite side. Two wings of ONE panel each. THE WINGS' SIZE IS AN ESTIMATE: 1.9 x 1.75 m each, 7.1 m tip to tip, sized from the cited 1660 W; no page opened gives the span. THE SECOND WING IS A MIRROR IMAGE of the first. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the antenna face to +Z (the Earth), the wings along X, the cells to +Y. AS IT FLIES, in part: 