  - {id: iris, file: site/models/iris.glb, kb: 114, budget_tris: 14500, look: pbr, class: telescope, kind: built-from-dimensions, origin: built, used_for: "NORAD 39197 (IRIS), by id; public #1090. Sun-pointing: built to the app's axes, the aperture and the cells on +Y, the wings along X", source: "built by this project in code (release 1.3.0 stage W3-a's part library, lib.py, and one script a craft, kept with the stage's notes); no image-to-3D model was used, and no published mesh: NASA's 3D Resources (1 583 paths) and NASA Science's 3D models have none of this craft (read 2026-10-20)", licence: "The shape is this project's, under this repository's licence, built from published numbers (facts). The pictures it was compared with are NASA's (public domain) and figures 7 and 8 of De Pontieu et al. 2014 (CC BY 4.0); none is in the file.", credit: "3D model: built by Space Radar from NASA's and De Pontieu et al. (2014)'s published dimensions; compared with NASA's photographs (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with: the flight observatory with its arrays deployed, before blanketing", title: "IRIS spacecraft model", url: "https://commons.wikimedia.org/wiki/File:IRIS_spacecraft_model.png", licence: "Public domain (NASA; Commons LicenseShortName, read 2026-10-20)", credit: "NASA", read: 2026-10-20}, {use: "compared with: the flight look (silver blankets), the door open", title: "IRIS satellite", url: "https://commons.wikimedia.org/wiki/File:IRIS_satellite.jpg", licence: "Public domain (NASA; Commons LicenseShortName, read 2026-10-20)", credit: "NASA's Goddard Space Flight Center", read: 2026-10-20}, {use: "compared with: flight-ready at Vandenberg, the front plate, the guide telescope hole, silver blankets", title: "KSC-2013-2109", url: "https://images.nasa.gov/details/2013-2109", licence: "Public domain (NASA)", credit: "NASA/Randy Beaudoin", read: 2026-10-20}, {use: "compared with: the layout of bus, electronics box, optics package, struts, guide telescope", title: "De Pontieu et al. 2014, The Interface Region Imaging Spectrograph (IRIS), Solar Physics 289:2733, figures 7 and 8", url: "https://arxiv.org/abs/1401.2491", licence: "CC BY 4.0 (Solar Physics open access)", credit: "De Pontieu et al. / LMSAL", read: 2026-10-20}], dimensions: {length_m: 2.18, span_m: 3.6, panel_length_m: 1.3, panel_width_m: 0.6, source: "De Pontieu et al. 2014, Solar Physics 289:2733 (arXiv:1401.2491), OPENED 2026-10-20: 'about 2.18 m from the back of the spacecraft bus to the front of the telescope', 'The solar arrays deployed are 3.6 m tip to tip', 'The two solar arrays measure 0.6 x 1.3 m each, with a total surface area of 1.7 m2', 'a 19-cm Cassegrain telescope'. eoPortal (https://www.eoportal.org/satellite-missions/iris): '~ 2.18 m in length, and ~ 3.7 m across'; built 3.6 m, the paper's. Panels built 1.30 x 0.65 m (the 1.7 m2 the paper gives needs 0.65). OURS: the bus 0.98 m across and 0.46 m long, the tube 0.30 m, the instrument box, every small part", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. Built as it flies: the ribbed telescope door swung open off the teardrop front plate (the guide telescope's hole in its lobe), the 2.2 m science telescope with the guide telescope along it, the white primary-mirror ring and four dark struts to the forward deck, the octagonal bus with eight bays in silver flight blankets with taped seams, the electronics box, star trackers, torque rods, magnetometer, sun sensor, the copper S-band cans, the separation ring with its white aft disc, and the two wings: 37 x 8 purple D-shaped cells a panel with the break after column 10 and the bare copper patch round the hold-down, black backs. The telescope tube is silver as in the flight photographs at Vandenberg (NASA's renders draw it black). Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role named body, foil, solar-panel; one material per colour; its value clamp; normals creased at 40 degrees, 12 on blankets so their folds show; meshopt), nothing resampled or decimated. No mirror pass. No logo and no lettering is on the mesh. 13298 triangles, 12 colours."}
  - {id: timed, file: site/models/timed.glb, kb: 148, budget_tris: 17000, look: pbr, class: satellite, kind: built-from-dimensions, origin: built, used_for: "NORAD 26998 (TIMED), by id; public #1091. Nadir-pointing: built to the app's axes, GUVI and the nadir antennas on +Z, the wings along X with their cells to +Y", source: "built by this project in code (release 1.3.0 stage W3-a's part library, lib.py, and one script a craft, kept with the stage's notes); no image-to-3D model was used, and no published mesh: NASA's 3D Resources (1 583 paths) and NASA Science's 3D models have none of this craft (read 2026-10-20)", licence: "The shape is this project's, under this repository's licence, built from NASA's and APL's published numbers (facts). The one picture that is free to show is NASA's render on Commons (public domain); APL's photographs and the CDR drawings were looked at only and are in nothing.", credit: "3D model: built by Space Radar from NASA's and APL's published dimensions; compared with NASA's render (public domain)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "compared with: the craft in orbit, the bus and the two four-panel wings", title: "TIMED", url: "https://commons.wikimedia.org/wiki/File:TIMED.jpg", licence: "Public domain (NASA; Commons LicenseShortName, read 2026-10-20)", credit: "NASA", read: 2026-10-20}, {use: "LOOKED AT ONLY: the flight craft on its adapter (Fig. 4), the instruments (GUVI in gold blanket, SABER, SEE, the black-wrapped TIDI telescopes)", title: "JHU/APL Technical Digest 24(2), the TIMED issue (Vernon; Yee; Kusnierkiewicz)", url: "https://spdf.gsfc.nasa.gov/pub/data/timed/documentation/mdc/", licence: "JHU/APL; looked at only", credit: "JHU/APL", read: 2026-10-20}, {use: "LOOKED AT ONLY: the ICD views, the optical bench, the deck layouts, the solar panel", title: "TIMED Critical Design Review, 13 Mechanical Systems (1997)", url: "https://spdf.gsfc.nasa.gov/pub/data/timed/documentation/mdc/Reviews/CDR/13-Mechanical_Systems.pdf", licence: "NASA/JHU-APL; looked at only", credit: "JHU/APL", read: 2026-10-20}], dimensions: {height_m: 2.72, depth_m: 1.2, span_m: 11.73, panel_length_m: 1.253, panel_width_m: 1.197, source: "TIMED QuickFacts (https://spdf.gsfc.nasa.gov/pub/data/timed/documentation/mdc/QuickFacts.pdf), OPENED 2026-10-20: '8.93 feet (2.72 meters) high', '38.5 feet (11.73 meters) wide (solar arrays deployed)', '3.93 feet (1.2 meters) deep'. Kusnierkiewicz, APL Tech. Digest 24(2): 'two rotating wings, each consisting of four solar panels'; 'a graphite-epoxy optical bench on the top of the spacecraft where the two star trackers and four TIDI telescopes are mounted'; GUVI 'on the underside of the spacecraft, inside an adapter ring'; SABER 'on the side panel of the spacecraft that is always kept facing away from the Sun'. CDR 13: solar panel '49.34 L x 47.12 W x 5/8 H', '20 Deg Panel Droop'; deck '57.50' x '46.00'; optical bench '45.000' x '24.000'. Built span 11.97 m: the cited panels and droop on a short yoke (2 % over the cited 11.73 m). OURS: the shapes of SEE, the profiler, SABER's housing, the yoke, the mast heights", read: 2026-10-20}, modified: "nothing was generated, so nothing was repaired. Built in TIMED's own frame (+Z nadir, +Y the cold SABER side) and turned 180 degrees about Z for the app, so the cells face +Y and SABER is on -Y. The octagonal bus in silver blankets; on top the optical bench with the four black-wrapped TIDI telescopes at 45 degrees to the ram, the two star cameras with white baffles, the GPS masts and ground planes, SEE, the TIDI profiler under its white hood, the zenith S-band masts; GUVI in gold blanket inside the white adapter ring underneath, the nadir S-band masts; SABER's white radiator on the cold side; battery radiators on the wing faces; two wings of four panels each, drooped 20 degrees, dark-blue cells, white backs. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role named body, foil, solar-panel; one material per colour; its value clamp; normals creased at 40 degrees, 12 on blankets so their folds show; meshopt), nothing resampled or decimated. No mirror pass. No logo and no lettering is on the mesh. 16058 triangles, 11 colours."}
