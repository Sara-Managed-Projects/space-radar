# All fourteen shipped textures are from the same Solar System Scope pack, CC BY 4.0. The credit
# line below is the one that must appear wherever they are shown; the app puts it on the world
# cards and CREDITS.md carries the full licence.
#
# NOT byte-verified: the source site refuses scripted downloads, so provenance rests on exact
# filename and dimension matches against their published 2k pack. `2k_uranus.jpg` and
# `2k_neptune.jpg` carried no embedded metadata at all and are the least certain of the fourteen.
# Nine of the fourteen are shipped as WebP re-encodes of those JPEGs since 2026-10-08 (same pixels,
# SSIM >= 0.98: registry/textures.yaml `make:`, CREDITS.md).
  # The Milky Way point cloud (spec 0028 step 6). `kind: illustrative`: built from published numbers by
  # scripts/build-galaxy.py, and a shape nobody has photographed. The card for the galaxy says so.
  - {id: galaxy-model, file: site/data/galaxy.bin, kind: illustrative, source: "scripts/build-galaxy.py from Reid et al. 2019 (ApJ 885:131) Table 2 and R0; Wikipedia 'Milky Way' disc size; Wikipedia 'Galactic Center' bar range", licence: "MIT (this project); the measurements are facts", budget_tris: 0, for: {layer: galaxy}}

