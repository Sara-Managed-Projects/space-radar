  - {id: asteroid-didymos, file: site/models/asteroid-didymos.glb, kb: 61, budget_tris: 5000, class: asteroid, pieces: 2, origin: official, used_for: "65803 Didymos and its moon Dimorphos (data/sample.js NAMED_ASTEROIDS), matched by name with the asteroid klass gate; Dimorphos is the node `dimorphos` under `dimorphos-orbit`, put round Didymos by scene/moonshape.js", source: "https://pds-smallbodies.astro.umd.edu/holdings/pds4-dart_shapemodel-v1.0/ — data_derived_didymos_model_v003/didymos_g_9309mm_spc_obj_0000n00000_v003.obj and data_derived_dimorphos_model_v004/dimorphos_g_1940mm_spc_obj_0000n00000_v004.obj, read 2026-10-20", licence: "CC0 by NASA policy (https://science.data.nasa.gov/about/license: data 'from a NASA-led mission ... are licensed as Creative Commons Zero'); DART was NASA's and the bundle states no restriction", credit: "Shape models: Daly, R.T. et al. (2023), DART Shapemodel Archive Bundle, NASA PDS, doi:10.26007/96fn-p578", modified: "each 49 152 plates simplified by quadric error by scripts/small-body-glb.py: Didymos to 4 000 triangles (0.2034 -> 0.2031 km3, 0.818 x 0.802 x 0.605 km), Dimorphos to 1 000 (0.001759 -> 0.001753 km3, 0.178 x 0.169 x 0.115 km); both at the origin in the file, so the app measures and centres Didymos alone; smooth normals; quantized. Turned by didymos_system_15.tpc (RA 69.3269, Dec -72.7246, W 0 + 3823.00885 d); Dimorphos at 1.152 km, 11.3674 h a lap (Richardson et al. 2024), its place on the orbit illustrative"}
