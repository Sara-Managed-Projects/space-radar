hite brace over silver skins on each flank; the antenna pale on its Earth side with a gold edge; a wing's white back and triangular yoke; a gold dome and four antenna cups at one end. THE ROLL IS DRAWN: the whole craft is turned 29.45 degrees about its length (the middle of the two cited angles), the antenna's face down and AWAY from the Sun, the cells up and toward it. That the look to the right is the look away from the Sun follows from the cited orbit (ascending at 18:00, so the Sun is on the left of a craft flying north); no page says it in a sentence. OURS: the wings' 2.5 m width (ESA's '2.5 m wide' read as theirs); the wings in one plane with the bus's sky face; the laser terminal, star trackers and rod antennas, in size and place.", read: 2026-10-14}, modified: "nothing was generated, so nothing was repaired. THE BUS: 3.4 by 1.3 by 1.3 m (cited) in gold foil, a silver skin under a white brace of six members on each flank. THE RADAR ANTENNA: 12.3 m by 0.821 m (cited) on the Earth face, fourteen white tiles (cited) on a gold back. TWO SOLAR WINGS along Y, each 10 m from the bus's flank (cited): a white triangular yoke of 1.4 m and five panels (cited) of 1.72 m by 2.5 m (the width ours), cells to the sky, white backs; 21.3 m tip to tip (ESA: 21 m). At one end a gold dome and four antenna cups, at the other a launch ring; on the sky face the laser terminal and two star trackers; two rod antennas on the Earth side (all read off the photographs, sizes ours). THE WHOLE CRAFT IS ROLLED 29.45 degrees about its length (the antenna's mechanical off-nadir angle, cited as 30.25 to 28.65 degrees round the orbit): the antenna's face looks down and away from the Sun, the cells up and toward it. THE -Y WING IS BUILT AS THE +Y ONE TURNED ABOUT THE BODY, not as its mirror image: no mirror pass was run, and the craft is symmetric about the middle of its antenna, as the page says of the antenna. SIMPLIFIED OR NOT CITED: see `dimensions`. Axes, so the route says `axes: 'app'`: the