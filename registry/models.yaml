 first GPS Block IIF satellite (SVN-62) launched on May 27, 2010. The launch vehicles provided direct insertion into the GPS orbit, meaning the apogee kick motor used in earlier generations was not needed.' Air & Space Forces Magazine, https://www.airandspaceforces.com/weapons-platforms/gps/, OPENED 2026-10-13: '(IIF) 9.6 x 6.5 x 12.9 ft, span incl solar panels 43.1 ft' (43.1 ft is 13.1 m: the span agrees; its body numbers do not agree with eoPortal's and are not used). ESA (F. Dilssner and others, 'Estimation of azimuthal satellite antenna PCVs', IGS Workshop 2012, https://files.igs.org/pub/resource/pubs/workshop/2012/Poland%202012%20-%20P09%20Dilssner%20PR4.pdf, OPENED 2026-10-13), 'GPS satellite antenna assembly': 'Beam-forming assembly consisting of 12 helical elements, 2 concentric circles, 4 inner elements, equally spaced. Azimuth of inner elements wrt +Y axis: IIA: 67.5, 157.5, 247.5, 337.5 deg; IIF: 22.5, 112.5, 202.5, 292.5 deg'; '12 element helix design common to all GPS and GLONASS antenna types'. THE US SPACE FORCE'S OWN FACT SHEET WAS NOT OPENED: losangeles.spaceforce.mil answers 403 to a plain request and to a reader (tried 2026-10-13); a search engine's extract of it gives '98 in wide, 80 in deep, 88 in high'. NOT CITED, read off the Air Force's painting: three panels a wing and the frame that holds them, the wing's width (1.8 m), the antenna deck as an eight-sided white plate, the size of the helices and of both rings, the long antenna at the deck's middle, the group of four at the deck's edge, the boom with a canister at its end. Which of the three body numbers lies along which axis is OURS: the 1.8 m along the Earth axis.", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE BODY: a box 2.1 x 2.5 x 1.8 m in gold foil with a pale radiator on two sides. THE EARTH FACE: an eight-sided white plate with twelve helices on cups in two circles, the inner four at 22.5 degrees from the wing axis and every 90 after (ESA's numbers