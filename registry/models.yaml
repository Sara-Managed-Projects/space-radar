wering toward the boom; a black ridge with three GPS antennas and the star tracker's port. THE RAM FACE (+X): bronze blanket in quilted patches, the electric field instrument's white plate with the two thermal ion imagers, white posts at the lower corners with the Langmuir probes. THE BOOM: a black-blanketed square tube 4.3 m from its white hinge, taped, the optical bench a little over half way (the vector magnetometer's white housing and three star tracker heads with silver baffle petals), the scalar magnetometer in its white wedge at the tip. No mirror pass. Every part is a flat colour of ours in the app's roles (foil, solar-panel, body), blankets as rumpled sheets with patches a shade lighter and darker and taped seams, so they are not flat slabs; drawn physically based on tier 1 and up (`look: pbr`, scene/pbr.js: gold and silver blankets as crinkled metal foil, white beta cloth matt, cells under glass, struts and dishes bare metal) and on the toon ramp on phones. Written by the stage's write-glb.mjs in the layout scripts/bake-own-colours.mjs writes (one mesh per role, one material per colour, its value clamp, 14 colours at most, blankets' normals creased at 12 degrees and the rest at 40, meshopt), with nothing resampled or decimated: every triangle keeps the colour it was built with. NO LOGO, FLAG OR LETTERING is on the mesh. 1770 triangles, 32 kB."}  # 0077 W3-b
  - {id: metop-sg-a, file: site/models/metop-sg-a.glb, kb: 105, budget_tris: 14000, look: pbr, class: satellite, kind: built-from-dimensions, used_for: "NORAD 65159, MetOp-SG A1, the first of EUMETSAT's and ESA's second-generation polar weather satellites (launched in August 2025), the sounding and imaging one: a gold box 6.5 m long, dark under it where METimage, Sentinel-5, the microwave sounder and 3MI look down, IASI-NG on top at one end, one wing of four panels out to the side. It was the class shape of a satellite. Not MetOp-B or -C (metop.glb); not the B satellites, which carry the scatterometer; public #993", source: "built by this project in code (release 1.3.0 stage W3-b's part library, lib.py and parts.py, and one script a craft, kept with the stage's notes in ~/space-radar-handoff/release-1.3/W3-b/build), from the cited dimensions and the pictures under `references`; no image-to-3D model was used, and no published mesh: NASA's 3D Resources and NASA Science have none of these craft; ESA publishes no model of them under terms that allow a derivative (its multimedia terms, the ESA Standard Licence, allow use for information and education, not an altered model); EUMETSAT publishes none (read 2026-10-20)", licence: "No ESA, EUMETSAT or Airbus picture or model is in the file. Compared with, with credit: ESA's pictures of the A satellite (CC BY-SA 3.0 IGO) and Don-vip's photographs of MetOp-SG A1 at Airbus in Toulouse (CC BY-SA 4.0), all on Wikimedia Commons; nothing of them is in the file. The shape is this project's, under this repository's licence, built from published numbers (facts).", credit: "3D model: built by Space Radar from eoPortal's and ESA's published dimensions; compared with pictures by ESA (CC BY-SA 3.0 IGO) and Don-vip (CC BY-SA 4.0)", honesty: "shape built from published dimensions and pictures; details simplified", references: [{use: "drawn from; ESA's picture of the A satellite: the gold body, IASI-NG, the radiators on top, the wing", title: