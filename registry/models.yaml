er 2.25 m'; re-entry module 'Length 2.5 m / Diameter 2.52 m'; service module 'Length 2.94 m / Basic diameter 2.5 m / Maximum diameter 2.8 m / Span 17 m'. THE THREE MODULES ADD UP TO 8.24 m, not 9.25 m: the 1.01 m left over is built as the docking mechanism in front (0.75 m) and the joints. ONE PAIR OF WINGS: https://zh.wikipedia.org/wiki/神舟载人飞船, opened 2026-10-13, a caption: '神舟飞船后期型号（八号及之后）结构，前方轨道舱不带太阳翼' (the later models, Shenzhou 8 onward: the orbital module in front carries no solar wings); https://en.wikipedia.org/wiki/Shenzhou_7, opened 2026-10-13: 'The Orbital module has been modified and its solar panels removed in order to allow for the EVA experiment.' THE ENGLISH PAGE CONTRADICTS ITSELF (it also says, in the present tense, 'Two pairs of solar panels'), and a popular Chinese article gives other numbers (https://www.ourchinastory.com/cn/11932: 9 m long, the modules 2.8, 2 and 3.05 m): the English table is built. NOT CITED: the wings' 2 m width and four panels a side, the curve of each module between its numbers, every antenna", read: 2026-10-13}, modified: "nothing was generated, so nothing was repaired. THE HULL IS ONE LATHE: 31 points turned in 36 sides and cut into nine bands: the docking mechanism (0.75 m, not cited), the orbital module (a 2.25 m drum 2.8 m long with a domed front), a joint, the re-entry module (a bell to the cited 2.52 m), the heat shield's rim, the service module (2.5 m across, 2.94 m long, flaring to the cited 2.8 m). THE GENERATION THAT FLIES NOW: ONE pair of wings, on the service module; the orbital module's own pair, which the craft carried until Shenzhou 6, is NOT drawn. Built on the hull in code: four ribs round the radiator, a window and a hatch on the orbital module, a window on the bell, two antennas, eight thruster covers, five engine nozzles, and the wings: 6.9 x 2.0 m, four panels of 3 by 5 cells, tips 8.5 m from the axis (half the cited span), each on a two-rod yoke; the right wing with its yoke IS A MIRROR IMAGE of the left across the plane x = 0. SIMPLIFIED OR NOT CITED: the curve of each module between its numbers, the wings' width and panels, every antenna, hatch and thruster; no flag and no lettering is drawn. Axes: nose at +Z (the app's Earth face, as the procedural shape has it), wings along X, cells toward +Y. Colours are this project's own flat ones: white modules #E3E7ED and #F0F2F6, a slate bell #5B6068, cells #1F3A6E; illustrative. Every triangle built in code is cut to one of the two sizes at which scripts/bake-own-colours.mjs samples a triangle at its own middle, so each keeps its own colour. Then that script: nothing decimated, normals with a 40 degree crease, meshopt: 11 700 triangles, 10 colours"}
