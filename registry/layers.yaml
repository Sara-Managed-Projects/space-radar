# A class of thing on the map. Adding one is a ROW naming a source, a propagator, a style, a
# card and a budget. A new PROPAGATOR is the only case that needs code, and the six in
# the six propagators cover everything this app draws.
#
# moments   which of the three moments (spec 0001) show this layer by default.
# select    the selection rule, as data. `all`, a list file, a name prefix, an age, or an
#           orbital band -- each is a small predicate in app/select/.
# style     `glyph` far, `model` near. near_km is where the model fades in.
# enabled   absent means on. Off removes the layer from the map, the Next view and the
#           subscription form at once, because all three read this row.
version: 1

layers:
  # The worlds as a LAYER (spec 0028 step 0). scene/worlds.js already draws them; this row is what
  # puts them in the layer list with a count, in search, and under a finger. `bundled` because the
  # rows are worlds.yaml itself; `body` because astronomy-engine is the ephemeris. The style glyph
  # is never drawn -- data/layers.js marks the row `draw: worlds` and the meshes stand in for glyphs.
  - id: worlds
    display: Planets and moons
    moments: {wonder: on, now: on, next: on}
    source: bundled
    propagator: body
    frame: sun-inertial
    style: {kind: glyph, glyph: planet, colour: world}
    card: world
    select: {all: true}
    budget: {max_items: 20}

  # Stars in three dimensions (spec 0028 step 3). `bundled`: site/data/stars3d.bin is repacked from
  # HYG v4.4 by scripts/build-stars3d.py (CC BY-SA 4.0, credited in CREDITS.md §3c). `static`: a
  # star does not move at any zoom this app draws. Drawn by scene/stars3d.js, not as glyphs, and
  # only once the camera is far enough out for the sky-from-here to have faded (registry/lod.yaml).
  - id: stars
    display: Stars
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: static
    frame: sun-inertial
    style: {kind: glyph, glyph: star, colour: star}
    card: star
    select: {all: true}
    budget: {max_items: 200000}

  # Planets around other stars (spec 0028 step 4): the NASA Exoplanet Archive through the harvester,
  # a dated bundled copy until the first snapshot lands. Drawn at their stars, as plain glyphs.
  - id: exoplanets
    display: Planets around other stars
    moments: {wonder: on, now: off, next: off}
    source: nasa-exoplanet-archive
    propagator: static
    frame: sun-inertial
    style: {kind: glyph, glyph: exoplanet, colour: exoplanet}
    card: exoplanet
    select: {all: true}
    budget: {max_items: 8000}

  # Deep-sky objects with a sourced distance (spec 0028 step 5): Messier + registry/dso-hand.yaml,
  # built into site/data/dso.json by scripts/build-dso.py. `bundled`: nothing to harvest.
  - id: deep-sky
    display: Nebulae, clusters and galaxies
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: static
    frame: sun-inertial
    style: {kind: glyph, glyph: dso, colour: dso}
    card: dso
    select: {all: true}
    budget: {max_items: 2000}

  - id: stations
    display: Crewed stations
    moments: {wonder: on, now: on, next: off}
    source: celestrak-stations
    propagator: sgp4
    frame: earth-inertial
    style: {kind: model, model: station-generic, glyph: station, colour: station, near_km: 20000}
    card: station
    select: {all: true}
    budget: {max_items: 20}

  - id: notable
    display: Satellites worth knowing
    moments: {wonder: on, now: on, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: model, model: satellite-generic, glyph: satellite, colour: satellite, near_km: 8000}
    card: satellite
    # A hand-kept list, every row carrying a reason a reviewer can argue with.
    select: {list: registry/lists/notable.yaml}
    budget: {max_items: 80}

  - id: starlink-trains
    display: Fresh Starlink trains
    moments: {wonder: on, now: on, next: on}
    source: celestrak-supplemental-starlink
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: train, colour: satellite}
    card: satellite
    # A train is one card with N members, not N cards: it is what a beginner sees in the sky.
    select: {name_prefix: STARLINK, launched_within_days: 10, group_by: intl_designator_launch}
    budget: {max_items: 400}

  - id: just-launched
    display: Launched in the last two weeks
    moments: {wonder: on, now: on, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: just-launched, colour: launch}
    card: satellite
    # "That dot launched three hours ago" is the sentence beginners repeat.
    select: {launched_within_days: 14}
    budget: {max_items: 200}

  - id: active
    display: Everything active
    # Off in Wonder by default and one tap away with its count on the control: the calm
    # default is the main lesson from the trackers that came before: correct and overwhelming.
    moments: {wonder: off, now: off, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: satellite, colour: satellite}
    card: satellite
    select: {all: true}
    budget: {max_items: 15000}

  - id: geo-ring
    display: The geostationary ring
    moments: {wonder: off, now: off, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: satellite, colour: satellite, opacity: 0.5}
    card: satellite
    select: {mean_motion_between: [0.99, 1.01], ecc_below: 0.02, incl_below: 15}
    budget: {max_items: 900}

  - id: debris-notable
    display: Famous debris
    moments: {wonder: off, now: off, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: debris, colour: debris, opacity: 0.5, draw_under: true}
    card: debris
    select: {list: registry/lists/debris.yaml}
    budget: {max_items: 40}

  - id: launches
    display: Rockets on their way up
    moments: {wonder: on, now: on, next: on}
    source: ll2-upcoming
    # ALWAYS illustrative. The real track is not published; the orbit field is a class, not
    # elements, so an ascent arc is a DRAWING and is always classed illustrative.
    propagator: ascent
    frame: earth-fixed
    style: {kind: model, model: rocket-upper-stage, glyph: rocket, colour: rocket, near_km: 2000, dashed: true}
    card: launch
    select: {all: true}
    budget: {max_items: 30}

  - id: asteroids
    display: Asteroids passing by
    moments: {wonder: on, now: off, next: on}
    source: jpl-sbdb-neo
    propagator: kepler
    frame: sun-inertial
    style: {kind: model, model: asteroid-generic, glyph: asteroid, colour: asteroid, near_km: 500000}
    card: asteroid
    select: {close_approach_within_days: 60, or_list: registry/lists/small-bodies.yaml}
    budget: {max_items: 300}
    enabled: false   # stage B

  - id: comets
    display: Comets
    moments: {wonder: on, now: off, next: on}
    source: mpc-comets
    propagator: kepler
    frame: sun-inertial
    style: {kind: model, model: comet-generic, glyph: comet, colour: comet, near_km: 2000000}
    card: comet
    select: {perihelion_within_days: 365, or_brighter_than_mag: 8}
    budget: {max_items: 60}
    enabled: false   # stage B

  - id: deep-space
    display: Probes and telescopes
    moments: {wonder: on, now: off, next: off}
    source: horizons-deep-space
    propagator: sampled
    frame: sun-inertial
    style: {kind: model, model: probe-generic, glyph: probe, colour: probe, near_km: 1000000}
    card: probe
    select: {all: true}
    budget: {max_items: 40}
    enabled: false   # stage B

  - id: ground-sites
    display: Pads, dishes and observatories
    moments: {wonder: on, now: on, next: on}
    source: ll2-upcoming
    propagator: fixed
    frame: earth-fixed
    style: {kind: model, model: pad-generic, glyph: site, colour: site, near_km: 800}
    card: site
    select: {all: true}
    budget: {max_items: 400}

  # Wonder, and only Wonder. This layer is what Wonder is FOR -- it is not news and it is not a
  # thing you plan around, so `now` and `next` are off and it is one tap away in both.
  #
  # THREE RESERVED LITERALS, and each replaces a sentence that would have been false.
  #   source: bundled      the records are checked into this repository. There is no upstream, and
  #                        a sources.yaml row demands url, parser, cadence, freshness_max, outputs
  #                        and attribution -- inventing those is a lie in the file whose whole job
  #                        is evidence.
  #   propagator/frame:    per-record. A heliocentric car is `kepler`, a lunar photograph is
  #                        `fixed` in moon-fixed, a museum case is `fixed` in earth-fixed, and one
  #                        row has no propagator at all because nobody knows where it is. A single
  #                        value here would be true of at most half the layer. (`deep-space` has
  #                        the same shape and states `sampled`, which its own records contradict.)
  #
  #   model: oddity-generic  ONE models.yaml row for eight shapes, exactly as rocket-upper-stage
  #                        is one row for fifty. WHICH shape a record gets is its own
  #                        registry/oddities.yaml `shape.build`, and every one of them is measured
  #                        against its budget in tests/test_contract.mjs.
  - id: oddities
    display: Odd things we sent
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: per-record
    frame: per-record
    # Geometry now, one builder per row: registry/oddities.yaml `shape.build` picks it and
    # site/js/scene/models.js ODDITY_BUILDERS draws it. `near_km` is ONE number across three
    # frames -- a lunar surface, a museum in Texas and a heliocentric orbit -- so it is set for
    # the surface case, which is the only one a visitor arrives at by flying. The Roadster is
    # drawn because it was SELECTED, which heroes.js honours at any distance.
    style: {kind: model, model: oddity-generic, glyph: oddity, colour: probe, near_km: 4000}
    card: oddity
    select: {all: true}      # the curation IS the record list; a second filter would be theatre
    budget: {max_items: 60}
