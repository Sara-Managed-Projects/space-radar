# A class of thing on the map. Adding one is a ROW naming a source, a propagator, a style, a
# card and a budget. A new PROPAGATOR is the only case that needs code, and the six in
# the six propagators cover everything this app draws.
#
# moments   which of the three moments (spec 0001) show this layer by default.
# select    the selection rule, as data. `all`, a list file, a name prefix, an age, or an
#           orbital band -- each is a small predicate in app/select/.
# style     `glyph` far, `model` near. near_km is where the model fades in.
# enabled   absent means on. Off removes the layer from the map, the Next view and the
#           subscription form at once, because all three read this row.
# group     which heading of What to show the row sits under (spec 0068 task 3): one of `groups`
#           below. The titles are copy (copy/en.js COPY.controls.groups); the order here is the
#           order on screen. scripts/check_registry.py refuses a row with none or an unknown one.
version: 1

# WHY GROUPS. Twenty-six rows of checkboxes were two screens of a phone, and a visitor looking for
# the aurora read past ten kinds of satellite to find it. Four headings a person already has in
# their head -- what circles the Earth, what happens on and above the ground, the planets and what
# we sent among them, everything further out -- fold the list to one screen.
groups: [around-earth, earth, solar-system, beyond]

layers:
  # The worlds as a LAYER (spec 0028 step 0). scene/worlds.js already draws them; this row is what
  # puts them in the layer list with a count, in search, and under a finger. `bundled` because the
  # rows are worlds.yaml itself; `body` because astronomy-engine is the ephemeris. The style glyph
  # is never drawn -- data/layers.js marks the row `draw: worlds` and the meshes stand in for glyphs.
  - id: worlds
    display: Planets and moons
    group: solar-system
    moments: {wonder: on, now: on, next: on}
    source: bundled
    propagator: body
    frame: sun-inertial
    style: {kind: glyph, glyph: planet, colour: world}
    card: world
    select: {all: true}
    # 31 worlds since 2026-09-22 (six more moons, then ten more); at 20 the budget silently
    # dropped Deimos, the last row, and 32 would have left room for one. 40 is nine spare, which
    # is more moons than are left worth adding: Hyperion, Proteus, Nereid, Phoebe and Charon's
    # four small sisters are the whole of what a visitor would recognise.
    budget: {max_items: 40}

  # Stars in three dimensions (spec 0028 step 3). `bundled`: site/data/stars3d.bin is repacked from
  # HYG v4.4 by scripts/build-stars3d.py (CC BY-SA 4.0, credited in CREDITS.md §3c). `static`: a
  # star does not move at any zoom this app draws. Drawn by scene/stars3d.js, not as glyphs, and
  # only once the camera is far enough out for the sky-from-here to have faded (registry/lod.yaml).
  - id: stars
    display: Stars
    group: beyond
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: static
    frame: sun-inertial
    style: {kind: glyph, glyph: star, colour: star}
    card: star
    select: {all: true}
    budget: {max_items: 200000}

  # Planets around other stars (spec 0028 step 4): the NASA Exoplanet Archive through the harvester,
  # a dated bundled copy until the first snapshot lands. Drawn at their stars, as plain glyphs.
  - id: exoplanets
    display: Planets around other stars
    group: beyond
    moments: {wonder: on, now: off, next: off}
    source: nasa-exoplanet-archive
    propagator: static
    frame: sun-inertial
    style: {kind: glyph, glyph: exoplanet, colour: exoplanet}
    card: exoplanet
    select: {all: true}
    budget: {max_items: 8000}

  # Star systems at their own scale (spec 0040): registry/systems.yaml. The records are the HOST STARS,
  # one per system (`star-<id>`), placed on the exoplanet table's own row for the host; the planets
  # stay in `exoplanets` and are drawn on the system's stage by scene/systems.js, never twice. No
  # glyph layer: data/layers.js marks the row `draw: systems`.
  - id: systems
    display: Star systems
    group: beyond
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: static
    frame: sun-inertial
    style: {kind: glyph, glyph: star, colour: star}
    card: star
    select: {all: true}
    budget: {max_items: 50}

  # Deep-sky objects with a sourced distance (spec 0028 step 5): Messier + registry/dso-hand.yaml,
  # built into site/data/dso.json by scripts/build-dso.py. `bundled`: nothing to harvest.
  - id: deep-sky
    display: Nebulae, clusters and galaxies
    group: beyond
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: static
    frame: sun-inertial
    style: {kind: glyph, glyph: dso, colour: dso}
    card: dso
    select: {all: true}
    budget: {max_items: 2000}

  # The Milky Way as a place (spec 0028 step 6): one record for the galaxy and an illustrative point
  # cloud (models.yaml galaxy-model), drawn only from the ladder's rungs.
  - id: galaxy
    display: The Milky Way
    group: beyond
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: static
    frame: sun-inertial
    style: {kind: model, model: galaxy-model, glyph: dso, colour: dso, near_km: 0}
    card: dso
    select: {all: true}
    budget: {max_items: 4}

  # Black holes and other extremes (spec 0028 step 7): registry/exotics.yaml, one fact sheet each.
  - id: exotics
    display: Black holes and other extremes
    group: beyond
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: static
    frame: sun-inertial
    style: {kind: glyph, glyph: exotic, colour: exotic}
    card: exotic
    select: {all: true}
    budget: {max_items: 200}

  - id: stations
    display: Crewed stations
    group: around-earth
    moments: {wonder: on, now: on, next: off}
    source: celestrak-stations
    propagator: sgp4
    frame: earth-inertial
    style: {kind: model, model: station-generic, glyph: station, colour: station, near_km: 20000}
    card: station
    select: {all: true}
    budget: {max_items: 20}

  - id: notable
    display: Satellites worth knowing
    group: around-earth
    moments: {wonder: on, now: on, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: model, model: satellite-generic, glyph: satellite, colour: satellite, near_km: 8000}
    card: satellite
    # A hand-kept list, every row carrying a reason a reviewer can argue with.
    select: {list: registry/lists/notable.yaml}
    budget: {max_items: 80}

  - id: starlink-trains
    display: Fresh Starlink trains
    group: around-earth
    moments: {wonder: on, now: on, next: on}
    source: celestrak-supplemental-starlink
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: train, colour: satellite}
    card: satellite
    # A train is one card with N members, not N cards: it is what a beginner sees in the sky.
    select: {name_prefix: STARLINK, launched_within_days: 10, group_by: intl_designator_launch}
    budget: {max_items: 400}
    # A launch is still a TRAIN while its members climb to their shell (spec 0026 req 17); below this
    # mean height they read as one thing in the sky, above it they have spread out.
    train: {still_raising_below_km: 500}

  - id: just-launched
    # Two words (spec 0061 req 11): the row is one line in a 320 px popover beside its count.
    display: Just launched
    group: around-earth
    moments: {wonder: on, now: on, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: just-launched, colour: launch}
    card: satellite
    # "That dot launched three hours ago" is the sentence beginners repeat.
    select: {launched_within_days: 14}
    budget: {max_items: 200}

  - id: active
    display: Everything active
    group: around-earth
    # Off in Wonder by default and one tap away with its count on the control: the calm
    # default is the main lesson from the trackers that came before: correct and overwhelming.
    moments: {wonder: off, now: off, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: satellite, colour: satellite}
    card: satellite
    select: {all: true}
    budget: {max_items: 15000}
    # 7 MB for 16 587 objects: fetched when the box is ticked, never at boot (2026-09-22).
    load: on-demand

  - id: geo-ring
    display: The geostationary ring
    group: around-earth
    moments: {wonder: off, now: off, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: satellite, colour: satellite, opacity: 0.5}
    card: satellite
    select: {mean_motion_between: [0.99, 1.01], ecc_below: 0.02, incl_below: 15}
    budget: {max_items: 900}

  - id: debris-notable
    display: Famous debris
    group: around-earth
    moments: {wonder: off, now: off, next: off}
    source: celestrak-active
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: debris, colour: debris, opacity: 0.5, draw_under: true}
    card: debris
    select: {list: registry/lists/debris.yaml}
    budget: {max_items: 40}

  # Every tracked piece of debris and spent rocket body (public #449), from the catalogue's own
  # orbit shapes: the count and the heights are measured, the place along each orbit is
  # illustrative (site/js/data/satcat.js). 6.8 MB, so it loads only when the debris view asks.
  - id: debris-field
    display: All tracked debris
    group: around-earth
    moments: {wonder: off, now: off, next: off}
    source: celestrak-satcat
    propagator: kepler
    frame: earth-inertial
    style: {kind: glyph, glyph: debris, colour: debris, opacity: 0.7, draw_under: true}
    card: debris
    select: {all: true}
    budget: {max_items: 20000}
    load: on-demand

  - id: launches
    display: Rockets on their way up
    group: around-earth
    moments: {wonder: on, now: on, next: on}
    source: ll2-upcoming
    # ALWAYS illustrative. The real track is not published; the orbit field is a class, not
    # elements, so an ascent arc is a DRAWING and is always classed illustrative.
    propagator: ascent
    frame: earth-fixed
    style: {kind: model, model: rocket-upper-stage, glyph: rocket, colour: rocket, near_km: 2000, dashed: true}
    card: launch
    select: {all: true}
    budget: {max_items: 30}

  - id: asteroids
    display: Asteroids passing by
    group: solar-system
    moments: {wonder: on, now: off, next: on}
    source: jpl-sbdb-neo
    propagator: kepler
    frame: sun-inertial
    style: {kind: model, model: asteroid-generic, glyph: asteroid, colour: asteroid, near_km: 500000}
    card: asteroid
    select: {close_approach_within_days: 60, or_list: registry/lists/small-bodies.yaml}
    budget: {max_items: 300}
    # enabled: absent means on. Stage B shipped 2026-09-06; the `enabled: false` these rows carried
    # until 2026-09-08 was never read by the browser, which is exactly what spec 0026 req 8 fixes.

  # Dwarf planets and the two interstellar visitors (2026-09-22): hand-kept rows in data/sample.js
  # farBodies(), each with its JPL SBDB query, epoch and solution date, and each drawn where it is
  # now. Not rows of `asteroids`, whose hand rows are stand-ins shown only without the NEO snapshot.
  # `bundled`: the elements are checked into this repository and nothing is fetched. `kepler` on
  # both conic branches -- 'Oumuamua and Borisov are hyperbolic, which propagate/kepler.js solves.
  - id: far-bodies
    display: Dwarf planets, far travellers
    group: solar-system
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: kepler
    frame: sun-inertial
    style: {kind: model, model: asteroid-generic, glyph: asteroid, colour: asteroid, near_km: 500000}
    card: asteroid
    select: {all: true}      # the curation IS the record list, as for the oddities
    budget: {max_items: 20}

  - id: comets
    display: Comets
    group: solar-system
    moments: {wonder: on, now: off, next: on}
    source: jpl-sbdb-comets
    propagator: kepler
    frame: sun-inertial
    style: {kind: model, model: comet-generic, glyph: comet, colour: comet, near_km: 2000000}
    card: comet
    select: {perihelion_within_days: 365, or_brighter_than_mag: 8}
    budget: {max_items: 60}

  - id: deep-space
    display: Probes and telescopes
    group: solar-system
    moments: {wonder: on, now: off, next: off}
    source: horizons-deep-space
    propagator: sampled
    frame: sun-inertial
    style: {kind: model, model: probe-generic, glyph: probe, colour: probe, near_km: 1000000}
    card: probe
    select: {all: true}
    budget: {max_items: 40}

  # Bright enough to see: CelesTrak's `visual` group, 65 kB for the ~160 objects a person can see with
  # their eyes. NOT in the first registry -- data/layers.js added it on 2026-09-06 and the reviewable
  # copy is written here on 2026-09-08 (spec 0026 req 8: the mirror is checked both ways now).
  - id: visual
    display: Bright enough to see
    group: around-earth
    moments: {wonder: on, now: on, next: off}
    source: celestrak-visual
    propagator: sgp4
    frame: earth-inertial
    style: {kind: glyph, glyph: satellite, colour: satellite}
    card: satellite
    select: {all: true}
    budget: {max_items: 200}

  - id: ground-sites
    display: Pads, dishes and observatories
    group: earth
    moments: {wonder: on, now: on, next: on}
    source: ll2-upcoming
    propagator: fixed
    frame: earth-fixed
    style: {kind: model, model: pad-generic, glyph: site, colour: site, near_km: 800}
    card: site
    select: {all: true}
    budget: {max_items: 400}

  # Wonder, and only Wonder. This layer is what Wonder is FOR -- it is not news and it is not a
  # thing you plan around, so `now` and `next` are off and it is one tap away in both.
  #
  # THREE RESERVED LITERALS, and each replaces a sentence that would have been false.
  #   source: bundled      the records are checked into this repository. There is no upstream, and
  #                        a sources.yaml row demands url, parser, cadence, freshness_max, outputs
  #                        and attribution -- inventing those is a lie in the file whose whole job
  #                        is evidence.
  #   propagator/frame:    per-record. A heliocentric car is `kepler`, a lunar photograph is
  #                        `fixed` in moon-fixed, a museum case is `fixed` in earth-fixed, and one
  #                        row has no propagator at all because nobody knows where it is. A single
  #                        value here would be true of at most half the layer. (`deep-space` has
  #                        the same shape and states `sampled`, which its own records contradict.)
  #
  #   model: oddity-generic  ONE models.yaml row for eight shapes, exactly as rocket-upper-stage
  #                        is one row for fifty. WHICH shape a record gets is its own
  #                        registry/oddities.yaml `shape.build`, and every one of them is measured
  #                        against its budget in tests/test_contract.mjs.
  # The DSN antennas and the landing sites on the Moon and Mars: published coordinates that do not
  # change, kept in registry/sites.yaml and mirrored into data/sites.js. `bundled`: nothing serves
  # them. 34 records on 2026-09-22, under the 40 below.
  - id: hand-kept-sites
    display: Dishes, landers and rovers
    group: earth
    moments: {wonder: on, now: on, next: off}
    source: bundled
    propagator: fixed
    frame: earth-fixed
    style: {kind: model, model: dish-generic, glyph: site, colour: site, near_km: 900}
    card: site
    select: {all: true}
    budget: {max_items: 40}

  # Tropical cyclones happening now (2026-09-28): GDACS's list, read by the browser (CORS `*`),
  # each drawn at its centre at its latest advisory. `fixed` in `earth-fixed` because that is what
  # an advisory is, a point on the ground at one moment; the record also carries the window of app
  # time it is true in, and outside it the storm is not drawn (propagate/fixed.js). The select rule
  # is the advisory's AGE, not GDACS's `iscurrent`, which stays true for storms days over.
  - id: storms
    display: Tropical storms now
    group: earth
    moments: {wonder: on, now: on, next: off}
    source: gdacs-tc
    propagator: fixed
    frame: earth-fixed
    style: {kind: glyph, glyph: storm, colour: storm}
    card: storm
    select: {advised_within_hours: 12}
    # The source is paged at 20, newest first; more than a dozen at once has never happened.
    budget: {max_items: 20}

  # The northern and southern lights (2026-09-30, spec 0053 task 3): NOAA SWPC's OVATION forecast of
  # the next hour, drawn as an emissive shell on the night side by scene/aurora.js. Not glyphs and not
  # records: data/layers.js marks the row `draw: aurora`, and the glyph below is never drawn (every
  # row must name one). `static` in `earth-fixed` because the grid is geographic and is replaced, not
  # propagated. Fetched by the browser straight from NOAA (CORS `*`), after the first frame, never on
  # a connection that saves data; the saved copy is not used, because a forecast of the next hour is
  # stale long before the harvester's next run (data/ovation.js says what was measured).
  - id: aurora
    display: Aurora
    group: earth
    moments: {wonder: on, now: on, next: off}
    source: swpc-ovation
    propagator: static
    frame: earth-fixed
    style: {kind: glyph, glyph: storm, colour: aurora}
    card: world
    select: {all: true}
    budget: {max_items: 1}

  # Lightning (2026-10-03, spec 0066 task 1): NOAA nowCOAST's strike-density map of the last quarter
  # hour, drawn as brief flashes on the night side by scene/weather/lightning.js. Like the aurora it
  # is not glyphs and not records (data/layers.js `draw: lightning`), and the page fetches it itself:
  # `source: weather` is the reserved literal for that, and the row that carries the host, the day
  # its CORS header was measured and the licence is registry/weather.yaml `earth-lightning` (the
  # effect whose `layer:` is this id). Never at tier 0, on a connection that saves data, or with
  # reduced motion asked for.
  - id: lightning
    display: Lightning
    group: earth
    moments: {wonder: on, now: on, next: off}
    source: weather
    propagator: static
    frame: earth-fixed
    style: {kind: glyph, glyph: storm, colour: lightning}
    card: world
    select: {all: true}
    budget: {max_items: 1}

  # Things that came down. Space-Track needs a login nobody has registered, so this is the bundled
  # stand-in always (cls sample, every card saying so) until that changes.
  - id: reentries
    display: Things that came down
    group: around-earth
    moments: {wonder: off, now: off, next: on}
    source: space-track-tip
    propagator: fixed
    frame: earth-fixed
    style: {kind: glyph, glyph: debris, colour: debris}
    card: debris
    select: {all: true}
    budget: {max_items: 10}

  - id: oddities
    display: Odd things we sent
    group: solar-system
    moments: {wonder: on, now: off, next: off}
    source: bundled
    propagator: per-record
    frame: per-record
    # Geometry now, one builder per row: registry/oddities.yaml `shape.build` picks it and
    # site/js/scene/models.js ODDITY_BUILDERS draws it. `near_km` is ONE number across three
    # frames -- a lunar surface, a museum in Texas and a heliocentric orbit -- so it is set for
    # the surface case, which is the only one a visitor arrives at by flying. The Roadster is
    # drawn because it was SELECTED, which heroes.js honours at any distance.
    style: {kind: model, model: oddity-generic, glyph: oddity, colour: probe, near_km: 4000}
    card: oddity
    select: {all: true}      # the curation IS the record list; a second filter would be theatre
    budget: {max_items: 60}
