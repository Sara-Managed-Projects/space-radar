# The photographs of the nebulae and galaxies (spec 0067 task 1): one licensed picture per deep-sky
# object, and where on the sky it sits. scene/nebulae.js lays each on the sky from these numbers;
# scripts/build_nebulae.py fetches and bakes the files; site/js/data/nebulae.js is the mirror the
# browser reads (scripts/gen_nebulae_js.py).
#
# WHY THESE ARCHIVES AND NO SURVEY. A picture here is shipped from our bucket, so it must be ours
# to redistribute. The three archives below release their images under CC BY 4.0 on a terms page
# anyone can read (`terms:`, read on `checked:`); the wording that matters is quoted beside each.
# The Digitized Sky Survey (plates copyright Caltech/ROE/AAO, terms on request) and Mellinger's
# panorama ("All rights reserved") are NOT allowed (docs/research/2026-10-wwt.md, finding 4), and
# check_registry.py refuses a credit that names either: several archive pictures are DSS composites
# with an observatory's name on the page, and the credit line is where that shows. The Finkbeiner
# H-alpha map's licence was not settled, so nothing here uses it.
#
# A ROW
#   id            the deep-sky object, as in site/data/dso.json (the record is `dso-<id>`).
#   archive       a key of `archives:`; `image` is the archive's own id for the picture.
#   credit        the archive's credit line, word for word: the terms ask for the wording unaltered.
#                 The card prints it with a link to the picture's page, and CREDITS.md section 3g
#                 lists every row.
#   ra_deg, dec_deg   the picture's CENTRE, J2000, MEASURED: scripts/build_nebulae.py --solve laid
#                 the picture over a 2MASS cut-out of the field and found where it fits.
#   published     the centre the archive's page gives, kept because it is the solver's starting
#                 point and because the difference is the finding: `solved.moved_arcmin` is how far
#                 the picture really is from there. 13 of these 27 are more than 1' off (the Cygnus
#                 Loop by 43', the Rosette by 21'); drawn from the published numbers the Rosette
#                 would have sat a third of its own width from its stars.
#   solved        the evidence: the correlation at the solution and of the MIRROR image at the same
#                 place. check_registry.py refuses a row whose mirror correlates within 1.5x of
#                 itself: that picture cannot be told from its reflection, so it is not placed
#                 (the Local Group Survey's M31 strip and Hubble's M82 were dropped for it).
#   width_arcmin, height_arcmin   the whole picture, on the tangent plane (the archive's numbers,
#                 confirmed by the solver to a third of a per cent).
#   north_deg     how far celestial north is turned to the LEFT of the picture's up (the archives'
#                 AVM Spatial.Rotation; scene/nebulae.js pictureBasis() says what that means).
#   colours       how the colours were made, which picks the card's sentence (copy/en.js
#                 exposure.colours): `broadband` (broad colour filters), `mixed` (those plus a narrow
#                 hydrogen filter), `narrowband` (single gases mapped to colours), `unstated` (the
#                 page names no filters, and we do not guess). `filters` fills the sentence, from
#                 the page's own "Colours & filters" table or caption; `colours_note` says where a
#                 class came from when the page alone does not say it.
#   px            the baked file's longer side (512 when absent).
#   file          the baked WebP. checked: the day the page was read.
version: 1

archives:
  esahubble:
    name: ESA/Hubble
    licence: CC BY 4.0
    terms: https://esahubble.org/copyright/
    says: "ESA/Hubble images, videos and web texts are released under the Creative Commons Attribution 4.0 International license and may on a non-exclusive basis be reproduced without fee provided they are clearly and visibly credited."
    page: "https://esahubble.org/images/{image}/"
    screen: "https://cdn.esahubble.org/archives/images/screen/{image}.jpg"
    checked: 2026-10-03
  eso:
    name: ESO
    licence: CC BY 4.0
    terms: https://www.eso.org/public/copyright/
    says: "Unless specifically noted, the images, videos, and music distributed on the public ESO website, along with the texts of press releases, announcements, pictures of the week, blog posts and captions, are licensed under a Creative Commons Attribution 4.0 International License, and may on a non-exclusive basis be reproduced without fee provided the credit is clear and visible."
    page: "https://www.eso.org/public/images/{image}/"
    screen: "https://cdn.eso.org/images/screen/{image}.jpg"
    checked: 2026-10-03
  noirlab:
    name: NOIRLab
    licence: CC BY 4.0
    terms: https://noirlab.edu/public/copyright/
    says: "Unless specifically noted, the images, and videos distributed on the public NOIRLab website, along with the texts of press releases, announcements, pictures of the week, blog posts and captions, are licensed under a Creative Commons Attribution 4.0 International License, and hence may on a non-exclusive basis be reproduced without fee provided the credit is clear and visible."
    page: "https://noirlab.edu/public/images/{image}/"
    screen: "https://noirlab.edu/public/media/archives/images/screen/{image}.jpg"
    checked: 2026-10-03

