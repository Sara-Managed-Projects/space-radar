# Links out to live pictures (spec 0050 requirement 8, internal #136).
#
# A LINK, NEVER AN EMBED. The card shows a plain <a target="_blank" rel="noopener"> to the
# publisher's own page, with the publisher named. No iframe, no thumbnail fetched from their
# server, no player script: the page makes no request to any host in this file.
#
# Every row was opened on its `checked` date, and `saw` is what was on the page that day.
# scripts/check_registry.py refuses a row without `checked`, without `publisher`, without `saw`,
# with a URL that is not https, or for a record nobody can open; and reports (does not refuse) a
# row whose `checked` is more than 180 days old.
#
# ONE EXCEPTION, ON A PRESS (forge #544, the awesome-space research of 2026-11-23): `embed:` on a row is a player of
# the publisher's own stream that the card offers as a button. NOTHING IS ASKED OF THE PLAYER'S HOST UNTIL THE VISITOR
# PRESSES IT (ui/isscam.js builds the frame on the press, never before: no thumbnail, no script, no preconnect), and the
# button's note says which host it connects to. Only YouTube's privacy-enhanced host, www.youtube-nocookie.com/embed/,
# is allowed (check_registry.py), with `watch` the same stream on the host's own page for a visitor who would rather
# open it there, and `checked`/`saw` as for a link.
version: 1
links:
  - id: iss-live
    for: sat-25544
    words: "Watch it live"
    publisher: NASA
    url: "https://www.nasa.gov/live/"
    checked: 2026-10-08
    saw: "NASA Live; under 'Space Station Views': 'Live video from the International Space Station'"
    # NASA Live's "Space Station Views" links a YouTube playlist (read 2026-11-24), "Live Video from the International Space
    # Station", owner NASA. The player plays ONE video of it, not the playlist: on 2026-11-24 the playlist's first entry was an
    # ended stream ("This live stream recording is not available", seen in the look run of this branch), and two entries
    # were live: M3HKLzjvKPc "Live Video from the International Space Station (Official NASA Stream)" (used) and
    # ROboUHfPUrU "Live High-Definition Views from the International Space Station (Official NASA Stream)", both NASA's
    # (YouTube oEmbed author "NASA", isLiveNow true). NASA restarts a stream under a new id now and then: when the player
    # says it is unavailable, the panel's "Open on YouTube" is the playlist, and this row is checked again. Terms, read 2026-11-24: NASA's media "generally
    # are not subject to copyright in the United States" and may not imply NASA endorses us
    # (https://www.nasa.gov/nasa-brand-center/images-and-media/); the player is YouTube's own embed, under YouTube's terms,
    # in its privacy-enhanced mode. NOT SETTLED, for the maintainer: whether the cookie notice should also hold this player
    # behind "marketing" consent; until it does, the press is the visitor's choice and the note under the button says so.
    embed:
      url: "https://www.youtube-nocookie.com/embed/M3HKLzjvKPc"
      watch: "https://www.youtube.com/playlist?list=PL2aBZuCeDwlQMf6xMgQAUAY_nbHAgW5jz"
      host: www.youtube-nocookie.com
      checked: 2026-11-24
      saw: "YouTube oEmbed for M3HKLzjvKPc: 'Live Video from the International Space Station (Official NASA Stream)', author NASA, live now; it is in the playlist 'Live Video from the International Space Station' (owner NASA) that https://www.nasa.gov/live links under 'Space Station Views'"
  - id: earth-today
    for: earth
    words: "See today's Earth"
    publisher: NASA EPIC
    url: "https://epic.gsfc.nasa.gov/"
    checked: 2026-10-08
    saw: "DSCOVR: EPIC, NASA Goddard; the newest picture of the whole Earth was dated 2026-10-05 22:26:56"
  - id: sun-today
    for: sun
    words: "See the Sun today"
    publisher: NASA SDO
    url: "https://sdo.gsfc.nasa.gov/data/"
    checked: 2026-10-08
    saw: "SDO, Solar Dynamics Observatory; the Data page links the newest pictures of the Sun by wavelength (AIA 193 and others)"
  # Not a second source for the aurora layer: the layer draws the OVATION grid NOAA SWPC publishes as JSON
  # (registry/sources.yaml `swpc-ovation`), and this is NOAA's own page of maps of the same model, for a
  # visitor who wants the forecast as its publisher draws it (public #1232).
  - id: aurora-forecast
    for: earth
    words: "Aurora forecast"
    publisher: NOAA SWPC
    url: "https://www.spaceweather.gov/products/aurora-30-minute-forecast"
    checked: 2026-11-04
    saw: "Aurora - 30 Minute Forecast, NOAA / NWS Space Weather Prediction Center (HTTP 200, no redirect); 'based on the OVATION model', a 30 to 90 minute forecast of the location and intensity of the aurora, maps for the Northern and Southern Hemisphere"
  - id: perseverance-raw
    for: jezero
    words: "Perseverance's photos"
    publisher: NASA Mars Exploration
    url: "https://mars.nasa.gov/mars2020/multimedia/raw-images/"
    checked: 2026-11-04
    saw: "Images from the Mars Perseverance Rover, NASA Mars; a Raw Image of the Week and a gallery of the newest raw pictures (231 new images that day, 1,070,369 in all)"
  - id: curiosity-raw
    for: gale
    words: "Curiosity's photos"
    publisher: NASA Mars Exploration
    url: "https://mars.nasa.gov/msl/multimedia/raw-images/"
    checked: 2026-11-04
    saw: "Raw Images, Multimedia, NASA Mars Exploration; Mars Science Laboratory: Curiosity Raw Images, newest sol first (Sol 5063 that day, 789,346 images in all)"
  - id: soho-latest
    for: deep-soho
    words: "SOHO's latest images"
    publisher: NASA/ESA SOHO
    url: "https://soho.nascom.nasa.gov/data/realtime-images.html"
    checked: 2026-11-04
    saw: "The Very Latest SOHO Images, dated 04 November 2026 (mission day 11296); the newest EIT 171, 195, 284 and 304, SDO/HMI and LASCO C2 and C3 pictures of the Sun"
  - id: voyager-1-now
    for: deep-voyager-1
    words: "Where is Voyager 1 now?"
    publisher: NASA Science
    url: "https://science.nasa.gov/mission/voyager/where-are-voyager-1-and-voyager-2-now/"
    checked: 2026-11-04
    saw: "Where Are Voyager 1 and 2 Now?, NASA Science; a Current Position of Voyager 1 section that points to Eyes on the Solar System, and a count-down to 18 November 2026, when Voyager 1 is one light-day from Earth"
  - id: voyager-2-now
    for: deep-voyager-2
    words: "Where is Voyager 2 now?"
    publisher: NASA Science
    url: "https://science.nasa.gov/mission/voyager/where-are-voyager-1-and-voyager-2-now/"
    checked: 2026-11-04
    saw: "Where Are Voyager 1 and 2 Now?, NASA Science; a Current Position of Voyager 2 section that points to Eyes on the Solar System to see where it is right now"
