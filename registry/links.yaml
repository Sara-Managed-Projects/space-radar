# Links out to live pictures (spec 0050 requirement 8, internal #136).
#
# A LINK, NEVER AN EMBED. The card shows a plain <a target="_blank" rel="noopener"> to the
# publisher's own page, with the publisher named. No iframe, no thumbnail fetched from their
# server, no player script: the page makes no request to any host in this file.
#
# Every row was opened on its `checked` date, and `saw` is what was on the page that day.
# scripts/check_registry.py refuses a row without `checked`, without `publisher`, without `saw`,
# with a URL that is not https, or for a record nobody can open; and reports (does not refuse) a
# row whose `checked` is more than 180 days old.
version: 1
links:
  - id: iss-live
    for: sat-25544
    words: "Watch it live"
    publisher: NASA
    url: "https://www.nasa.gov/live/"
    checked: 2026-10-08
    saw: "NASA Live; under 'Space Station Views': 'Live video from the International Space Station'"
  - id: earth-today
    for: earth
    words: "See today's Earth"
    publisher: NASA EPIC
    url: "https://epic.gsfc.nasa.gov/"
    checked: 2026-10-08
    saw: "DSCOVR: EPIC, NASA Goddard; the newest picture of the whole Earth was dated 2026-10-05 22:26:56"
  - id: sun-today
    for: sun
    words: "See the Sun today"
    publisher: NASA SDO
    url: "https://sdo.gsfc.nasa.gov/data/"
    checked: 2026-10-08
    saw: "SDO, Solar Dynamics Observatory; the Data page links the newest pictures of the Sun by wavelength (AIA 193 and others)"
  - id: aurora-forecast
    for: earth
    words: "Aurora forecast"
    publisher: NOAA SWPC
    url: "https://www.spaceweather.gov/products/aurora-30-minute-forecast"
    checked: 2026-10-17
    saw: "Aurora - 30 Minute Forecast, NOAA / NWS Space Weather Prediction Center; OVATION-model short-term forecast maps of the aurora for the Northern and Southern Hemisphere"
  - id: perseverance-raw
    for: jezero
    words: "Perseverance's photos"
    publisher: NASA Mars Exploration
    url: "https://mars.nasa.gov/mars2020/multimedia/raw-images/"
    checked: 2026-11-04
    saw: "Images from the Mars Perseverance Rover, NASA Mars; a Raw Image of the Week and a gallery of the newest raw pictures (231 new images that day, 1,070,369 in all)"
  - id: curiosity-raw
    for: gale
    words: "Curiosity's photos"
    publisher: NASA Mars Exploration
    url: "https://mars.nasa.gov/msl/multimedia/raw-images/"
    checked: 2026-11-04
    saw: "Raw Images, Multimedia, NASA Mars Exploration; Mars Science Laboratory: Curiosity Raw Images, newest sol first (Sol 5063 that day, 789,346 images in all)"
  - id: soho-latest
    for: deep-soho
    words: "SOHO's latest images"
    publisher: NASA/ESA SOHO
    url: "https://soho.nascom.nasa.gov/data/realtime-images.html"
    checked: 2026-11-04
    saw: "The Very Latest SOHO Images, dated 04 November 2026 (mission day 11296); the newest EIT 171, 195, 284 and 304, SDO/HMI and LASCO C2 and C3 pictures of the Sun"
  - id: voyager-1-now
    for: deep-voyager-1
    words: "Where is Voyager 1 now?"
    publisher: NASA Science
    url: "https://science.nasa.gov/mission/voyager/where-are-voyager-1-and-voyager-2-now/"
    checked: 2026-11-04
    saw: "Where Are Voyager 1 and 2 Now?, NASA Science; a Current Position of Voyager 1 section that points to Eyes on the Solar System, and a count-down to 18 November 2026, when Voyager 1 is one light-day from Earth"
  - id: voyager-2-now
    for: deep-voyager-2
    words: "Where is Voyager 2 now?"
    publisher: NASA Science
    url: "https://science.nasa.gov/mission/voyager/where-are-voyager-1-and-voyager-2-now/"
    checked: 2026-11-04
    saw: "Where Are Voyager 1 and 2 Now?, NASA Science; a Current Position of Voyager 2 section that points to Eyes on the Solar System to see where it is right now"
