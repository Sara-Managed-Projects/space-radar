# The S-stars: the stars that circle Sagittarius A*, on their measured orbits (the deep-space review of 2026-11-16, idea 1;
# internal issue #419). Drawn by site/js/scene/sstars.js when the black hole's picture is on (scene/portraits.js); mirrored to
# site/js/data/sstars.js by scripts/gen_sstars_js.py (never edit that file). tests/test_sstars.mjs.
#
# WHAT IS MEASURED. The orbit of every star below: the size of its ellipse on the sky (a, arcseconds), its shape (e), its
# tilt (i), the turn of its long axis in the sky plane (Omega, the position angle of the node) and in its own plane (omega),
# the date it passes closest (t_peri) and the time round (P). These are the published fits to the stars' positions and
# speeds, with their 1 sigma errors (`err`, in the same order and units as the value). The mass at the centre and our
# distance to it, from the orbit of S2.
# WHAT IS ILLUSTRATIVE. The stars' sizes and colours (a star is a soft point; the sources give none), the orbit lines'
# brightness, and the white mark at the centre, which stands for a hole 5 millionths of an arcsecond across.
# HOW IT IS DRAWN. In AU: an orbit's size is a (arcsec) times R0 (parsecs): one arcsecond is one AU at one parsec. Where a star
# is on it comes from the Kepler solver of propagate/kepler.js, in the clock's date, the star's period and pericentre date
# being the paper's. At a different R0 an orbit's size changes, its period does not: the paper's elements are angles and times.
#
# SOURCES (arXiv, the abstract and table read 2026-11-17 through arxiv.org's HTML render):
#   gillessen2017: Gillessen, S. et al. 2017, ApJ 837, 30, "An update on monitoring stellar orbits in the Galactic Center"
#     (arXiv:1611.09144), Table 3, "Orbital parameters of the 40 stars for which we were able to determine orbits"
#     (a, e, i, Omega, omega, t_P, T). The paper's own R0 is 8.32 kpc and its mass 4.28 million Suns (section III.6).
#   gravity2021: GRAVITY Collaboration 2021 (arXiv:2101.12098), Table 2, the S2 fit: R0 = 8274.9 +/- 9.3 pc,
#     M = 4.297 +/- 0.013 million Suns, and S2's elements (used for S2 in place of Gillessen's row).
#   The distance and mass are the ones registry/exotics.yaml already gives Sagittarius A* (the same paper).
# LICENCE. Published measurements: facts, cited. No file, figure or text is copied.
# NOT HERE: S62 and S4714 (Peissker et al. 2020), which are not among Table 3's 40; S111, whose fit is unbound (e > 1, no period).
version: 1
centre:
  name: Sagittarius A*
  record: exotic-sgr-a-star
  r0_pc: 8274.9
  r0_err_pc: 9.3
  mass_msun: 4297000
  source: gravity2021
# The labelled stars: S2 (the one whose pericentre passages of 2002 and 2018 proved the mass), S55 (the shortest period of
# the table, 12.8 years) and S175 (the most eccentric orbit of the table's ellipses, e = 0.987).
labelled: [S2, S55, S175]
# The pericentre of S2 of 2018: the date and the distance the paper's numbers give (tests/test_sstars.mjs recomputes both).
s2_2018: {t_peri: 2018.378990, peri_au_about: 120}
