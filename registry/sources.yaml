# Every upstream the harvester reads. A source is a ROW plus one parser function in
# harvest/parsers/<parser>.py. The harvester iterates this file and knows no source names.
# Every cadence and limit below was measured against the live API, not assumed. The two that
# decide the design: CelesTrak allows one fetch per file per two hours and firewalls clients that
# retry a 403, and Launch Library 2's free tier is fifteen requests an hour per IP.
#
# cadence         never fetched more often than this.
# freshness_max   after this the app shows a stale stamp. It still renders (spec 0001 rule 6).
# auth            `none`, or `secret:NAME` — a missing secret SKIPS the source and reports it,
#                 it never fails the run for the free sources.
# browser         true when the host answers a page with `Access-Control-Allow-Origin: *`, so
#                 the app may read it directly when our snapshot is missing; false when it
#                 cannot (no CORS header, or a login). MEASURED 2026-09-06 -- the CORS column
#                 of docs/data-sources.md -- never assumed. For a `false` row the snapshot is
#                 the only route and the app says "could not look" rather than inventing.
# licence         the publisher's terms in one honest line, as CREDITS.md section 4 records them
#                 ("no licence stated" is an answer; a licence nobody wrote down is not).
# terms_url       the page that states them (https), or the publisher's home where it has none.
# terms_recorded  the day those terms were first written into CREDITS.md. It is NOT the day the
#                 harvester last read the source. The /sources/ page (scripts/seo_pages.py) prints
#                 all three beside the row, equal to this file, and the browser adds the day the
#                 saved copy was last read (data/v1/index.json).
version: 1

sources:
  # --- Earth orbit -------------------------------------------------------------------
  # MEASURED: CelesTrak updates GP data every 2 h and allows ONE download per file per
  # 2-hour cycle; an early re-fetch returns 403 with "GP data has not updated since your
  # last successful download", and 50 errors in 2 h gets the client firewalled. 3 h is
  # that limit with a margin, and a 403 is recorded as `not yet updated`, never retried.
  # CelesTrak's `visual` group: the ~160 objects bright enough to see with the eyes. The browser has
  # read it since 2026-09-06 (data/sources.js); the registry row is written 2026-09-08 so the layers
  # mirror can name it (spec 0026 req 8). Same publisher terms as every CelesTrak row.
  - id: celestrak-visual
    url: https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=json
    auth: none
    browser: true
    cadence: 3h
    freshness_max: 48h
    parser: celestrak_gp
    outputs: [visual.json]
    attribution: "Orbital data: CelesTrak (T. S. Kelso)"
    licence: "Free to use under CelesTrak's usage policy (no licence text; the rate limits are enforced)"
    terms_url: https://celestrak.org/usage-policy.php
    terms_recorded: 2026-09-07

  - id: celestrak-stations
    url: https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json
    auth: none
    browser: true
    cadence: 3h
    freshness_max: 48h
    parser: celestrak_gp
    outputs: [stations.json]
    attribution: "Orbital data: CelesTrak (T. S. Kelso)"
    licence: "Free to use under CelesTrak's usage policy (no licence text; the rate limits are enforced)"
    terms_url: https://celestrak.org/usage-policy.php
    terms_recorded: 2026-09-07

  - id: celestrak-active
    url: https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json
    auth: none
    browser: true
    cadence: 6h
    freshness_max: 72h
    parser: celestrak_gp
    outputs: [active.json]
    attribution: "Orbital data: CelesTrak (T. S. Kelso)"
    licence: "Free to use under CelesTrak's usage policy (no licence text; the rate limits are enforced)"
    terms_url: https://celestrak.org/usage-policy.php
    terms_recorded: 2026-09-07

  # The "Launched in the last two weeks" layer read this file live on every visit, because it
