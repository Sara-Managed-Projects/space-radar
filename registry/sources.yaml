    terms_recorded: 2026-09-07

  # --- Who is aboard --------------------------------------------------------------------
  # MEASURED 2026-10-02: `Access-Control-Allow-Origin: *`, so CORS itself allows a page to read
  # this. But the API has no https endpoint at all (TLS connections are refused outright), and
  # this app is served over https, so a browser here cannot request it: not a CORS refusal, a
  # mixed-content one, with the same result for the status panel. The harvester fetches it over
  # plain HTTP (harvest/fetch.py's urllib has no such restriction) and the browser reads the
  # saved copy. No documented rate limit; the cadence here is a courtesy, not a measured ceiling.
  - id: open-notify-astros
    url: http://api.open-notify.org/astros.json
    auth: none
    browser: false
    cadence: 1h
    freshness_max: 24h
    parser: open_notify
    outputs: [astros.json]
    attribution: "Who is in space: Open Notify"
    licence: "No licence stated by the publisher (an open-source project); a handful of names and facts"
    terms_url: https://open-notify.org/
    terms_recorded: 2026-10-05

  # --- Launches and events -----------------------------------------------------------
  # MEASURED live from the API's own throttle endpoint: 15 requests per hour per IP. A
  # runner's IP is shared and rotating, so the budget is not even reliably ours. Three
  # calls every two hours is 36 a day against a limit of 360.
  - id: ll2-upcoming
    url: https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=50&mode=detailed
    auth: none
    browser: true
    cadence: 2h
    freshness_max: 12h
    parser: ll2
    outputs: [launches.json, sites-pads.json]
    attribution: "Launch data by The Space Devs"
    licence: "No published licence; free up to 15 requests an hour"
    terms_url: https://thespacedevs.com/llapi
    terms_recorded: 2026-09-07

  - id: ll2-events
    url: https://ll.thespacedevs.com/2.3.0/events/upcoming/?limit=30
    auth: none
    browser: true
    cadence: 2h
    freshness_max: 24h
    parser: ll2_events
    outputs: [events-ll2.json]
    attribution: "Launch data by The Space Devs"
    licence: "No published licence; free up to 15 requests an hour"
    terms_url: https://thespacedevs.com/llapi
    terms_recorded: 2026-09-07

  # WHO IS ABOARD, AND WHAT IS DOCKED (internal #133, spec 0050; read 2026-10-08).
  # TERMS, as the publisher states them today on https://thespacedevs.com/llapi : "all the API data
  # is available at no cost for up to 15 non-authenticated requests per hour", and "the entire
  # database is accessible to everyone, for free". That page states no licence and no attribution
  # wording; the credit below is the one this registry already gives Launch Library.
  # BUDGET: these three rows are one call each every 6 h; with the two rows above (one each every
  # 2 h) that is 1.5 calls an hour against 15. `browser: false`: a visitor's browser never calls
  # LL2 for these, so a busy day here cannot spend the publisher's limit; the page reads our saved
  # copy, says its age, and says so when it is more than 48 h old.
  # The stations answer has the docked set itself (each port's `currently_docked`), so no hand-kept
  # registry/docked.yaml is needed (spec 0050 requirement 2's first branch).
  - id: ll2-stations
    url: https://ll.thespacedevs.com/2.3.0/space_stations/?status=1&mode=detailed
    auth: none
    browser: false
    cadence: 6h
    freshness_max: 48h
    parser: ll2_stations
    outputs: [stations-docked.json]
    attribution: "Launch data by The Space Devs"
    licence: "No published licence; free up to 15 requests an hour"
    terms_url: https://thespacedevs.com/llapi
    terms_recorded: 2026-09-07

  - id: ll2-astronauts
    url: https://ll.thespacedevs.com/2.3.0/astronauts/?in_space=true&limit=30
    auth: none
    browser: false
    cadence: 6h
    freshness_max: 48h
    parser: ll2_crew
    outputs: [crew.json]
    attribution: "Launch data by The Space Devs"
    licence: "No published licence; free up to 15 requests an hour"
    terms_url: https://thespacedevs.com/llapi
    terms_recorded: 2026-09-07

  # The launches of the last days, for "Just happened" (internal #134). Same terms and budget.
  - id: ll2-previous
    url: https://ll.thespacedevs.com/2.3.0/launches/previous/?limit=30
    auth: none
    browser: false
    cadence: 6h
    freshness_max: 48h
    parser: ll2_previous
    outputs: [launches-previous.json]
    attribution: "Launch data by The Space Devs"
    licence: "No published licence; free up to 15 requests an hour"
    terms_url: https://thespacedevs.com/llapi
    terms_recorded: 2026-09-07

  # --- Small bodies --------------------------------------------------------------------
  # MEASURED: no Access-Control-Allow-Origin on any JPL endpoint, so these could not be
  # called from the page even if the rate limits allowed it.
  - id: jpl-sbdb-neo
    url: https://ssd-api.jpl.nasa.gov/sbdb_query.api?fields=full_name,spkid,e,a,q,i,om,w,ma,epoch,H,diameter,class&sb-kind=a&sb-group=neo
    auth: none
    browser: false
    cadence: 24h
    freshness_max: 168h
    parser: jpl_sbdb
    outputs: [neo-elements.json]
    attribution: "Orbits: NASA/JPL Small-Body Database"
    licence: "NASA/JPL content, generally not copyrighted in the United States; the API publishes no licence text"
    terms_url: https://ssd-api.jpl.nasa.gov/
    terms_recorded: 2026-10-05

  # Comets, same database and the same query shape as the asteroids above (sb-kind=c instead of
  # a, no sb-group: a comet is not a NEO filter). Replaces the Minor Planet Center's CometEls.txt
  # (measured 2026-09-06, 961 comets) with JPL's 4 077, M1/K1 in place of H/G for the brightness
  # law layers.js cometMagNow already uses, and `tp` (perihelion passage, Julian date) read
  # directly instead of derived. One parser, jpl_sbdb, reads both rows: it only checks for
  # full_name/e/a/q/i/om/w/epoch, which this query carries too.
  - id: jpl-sbdb-comets
    url: https://ssd-api.jpl.nasa.gov/sbdb_query.api?fields=full_name,e,a,q,i,om,w,ma,tp,epoch,M1,K1&sb-kind=c
    auth: none
    browser: false
    cadence: 24h
    freshness_max: 168h
    parser: jpl_sbdb
    outputs: [comets.json]
    attribution: "Orbits: NASA/JPL Small-Body Database"
    licence: "NASA/JPL content, generally not copyrighted in the United States; the API publishes no licence text"
    terms_url: https://ssd-api.jpl.nasa.gov/
    terms_recorded: 2026-10-05

  # Every confirmed planet around another star (spec 0028 step 4). TAP sync, CSV, the composite
  # parameters table so every planet has one best value per column. No CORS header (measured
  # 2026-09-08), so the browser reads our snapshot; it falls back to the dated copy in
  # site/data/exoplanets.csv when there is none. Weekly: the table grows by a few planets a week.
  - id: nasa-exoplanet-archive
    url: https://exoplanetarchive.ipac.caltech.edu/TAP/sync?query=select+pl_name,hostname,ra,dec,sy_dist,pl_rade,pl_bmasse,pl_orbper,disc_year,discoverymethod,st_teff,st_rad,st_spectype+from+pscomppars&format=csv
    auth: none
    browser: false
    cadence: 168h
    freshness_max: 720h
    parser: nasa_exoplanet_archive
    outputs: [exoplanets.json]
    attribution: "Exoplanets: NASA Exoplanet Archive (Caltech/IPAC), DOI 10.26133/NEA13"
    licence: "Publicly available; the archive asks to cite its table (DOI 10.26133/NEA13); no licence text"
    terms_url: https://exoplanetarchive.ipac.caltech.edu/
    terms_recorded: 2026-09-08

  - id: jpl-cad
    url: https://ssd-api.jpl.nasa.gov/cad.api?dist-max=10LD&date-min=now&date-max=%2B60&sort=date&diameter=true&fullname=true
    auth: none
    browser: false
    cadence: 24h
    freshness_max: 72h
    parser: jpl_cad
    outputs: [close-approaches.json]
    attribution: "Close approaches: NASA/JPL CNEOS"
    licence: "NASA/JPL content, generally not copyrighted in the United States; the API publishes no licence text"
    terms_url: https://ssd-api.jpl.nasa.gov/
    terms_recorded: 2026-10-05

  # SWITCHED OFF 2026-10-09, AND NOT OURS TO COPY. ESA's terms, read that day on
  # https://www.esa.int/Services/Terms_and_conditions (to which neo.ssa.esa.int/terms-conditions
  # defers): "ESA does not grant the right to resell or redistribute any information, documents,
  # images or material from its website or to compile or create derivative works from material on
  # its website." The harvester saved this list and the site served it as
  # /data/v1/esa-neocc-close.json from 2026-09 until that day (internal #370). No card ever read it:
  # the "second opinion" below was a plan, and the close approaches the app draws are JPL's CNEOS
  # (jpl-cad above), which NASA lets us keep a copy of and which the card credits by name.
  # `enabled: false` means, everywhere: not fetched (harvest/run.py), not published
  # (scripts/refresh-snapshots.sh drops a disabled source's file and publishes its manifest row
  # as `skipped`, with no stamps), not saved
  # for offline use (scripts/save_offline_data.py) and not in a release zip
  # (scripts/build_release.py refuses one). tests/test_not_ours_to_copy.py holds all four.
  # The row stays so that the reason stays; switch it back on only with ESA's written permission.
  - id: esa-neocc-close
    url: https://neo.ssa.esa.int/PSDB-portlet/download?file=esa_upcoming_close_app
    auth: none
    browser: false
    cadence: 24h
    freshness_max: 168h
    parser: esa_neocc
    outputs: [close-approaches-esa.json]
    enabled: false
    attribution: "Close approaches: ESA NEOCC"
    licence: "All rights reserved by ESA; no reuse licence found, so the saved copy is not cleared for redistribution"
    terms_url: https://neo.ssa.esa.int/
    terms_recorded: 2026-10-05

  # --- Deep space ----------------------------------------------------------------------
  - id: horizons-deep-space
    url: https://ssd.jpl.nasa.gov/api/horizons.api
    auth: none
    browser: false
    cadence: 24h
    freshness_max: 168h
    parser: horizons
