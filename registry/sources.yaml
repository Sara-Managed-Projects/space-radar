  # ~900 kB of JSON for what the app needs as one small texture; the parser downsamples.
  - id: swpc-ovation
    url: https://services.swpc.noaa.gov/json/ovation_aurora_latest.json
    auth: none
    browser: true
    cadence: 15m
    freshness_max: 3h
    parser: swpc_ovation
    outputs: [aurora.png, aurora-summary.json]
    attribution: "Aurora forecast: NOAA SWPC"
    licence: "US Government work, public domain"
    terms_url: https://www.weather.gov/disclaimer
    terms_recorded: 2026-10-05

  # Tropical cyclones, worldwide, from GDACS (the UN / European Commission disaster alert system,
  # run by the EC Joint Research Centre). MEASURED 2026-09-28: `Access-Control-Allow-Origin: *`,
  # 27 646 bytes for the newest 20 storms in about 1-4 s. `pageSize=20` because the list is newest
  # `todate` first and the unpaged answer is 100 storms and 140 kB; more than 20 at once has never
  # happened. GDACS republishes the agencies' advisories (NOAA NHC/CPHC, JTWC and others) every 3 to
  # 6 hours, so an hour is plenty. Terms: GDACS publishes no licence of its own beyond "purely
  # indicative"; it is EU-owned content, which the Commission's reuse decision of 12 December 2011
  # licenses as CC BY 4.0 "unless otherwise indicated" (commission.europa.eu/legal-notice, read
  # 2026-09-28). Credit below; CREDITS.md says the rest.
  - id: gdacs-tc
    url: https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?eventlist=TC&alertlevel=Green;Orange;Red&pageSize=20
    auth: none
    browser: true
    cadence: 1h
    freshness_max: 12h
    parser: gdacs_tc
    outputs: [storms.json]
    attribution: "Tropical cyclones: GDACS, European Commission Joint Research Centre (CC BY 4.0)"
    licence: "CC BY 4.0 by the European Commission's reuse decision; GDACS calls it purely indicative"
    terms_url: https://www.gdacs.org/
    terms_recorded: 2026-09-29

  # --- Ground ------------------------------------------------------------------------------
  # A descriptive User-Agent is REQUIRED here; anonymous scripts are refused. Everything
  # is CC0, so the attribution below is courtesy rather than law.
  - id: wikidata-observatories
    url: https://query.wikidata.org/sparql
    auth: none
    browser: true
    cadence: 168h
    freshness_max: 720h
    parser: wikidata
    query: harvest/queries/observatories.rq
    outputs: [sites-observatories.json]
    attribution: "Observatory locations: Wikidata (CC0)"
    licence: "CC0 1.0: Wikidata's structured data is dedicated to the public domain"
    terms_url: https://www.wikidata.org/wiki/Wikidata:Licensing
    terms_recorded: 2026-10-05

  # --- Registration-gated, and skipped until the secret exists -------------------------------
  # The ONLY public source of reentry windows. Absent the secret this source is `skipped`
  # with a reason and the reentry cards say the window is not available -- they do not guess.
  - id: space-track-tip
    url: https://www.space-track.org/basicspacedata/query/class/tip/format/json
    auth: secret:SPACE_TRACK_PASSWORD
    browser: false
    cadence: 6h
    freshness_max: 48h
    parser: space_track_tip
    outputs: [reentries.json]
    enabled: false
    attribution: "Reentry predictions: 18 SDS via Space-Track.org"
    licence: "Switched off: Space-Track needs an account and its user agreement restricts passing the data on; nothing is fetched"
    terms_url: https://www.space-track.org/
    terms_recorded: 2026-10-05
