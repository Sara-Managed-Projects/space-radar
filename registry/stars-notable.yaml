# Famous stars: the ones people have heard of, each with one line saying why (2026-09-22).
#
# WHY THIS FILE EXISTS. The stellar rung draws 109 389 stars and 3 390 of them have names, but no
# star record carried `meta.why`, which is what makes a record "notable" to ui/labels.js -- so on a
# rung of the ladder a star was named only once somebody had selected it, and Vega, Arcturus and
# Alpha Centauri were points like any other. This is the hand-kept list that gives them a reason,
# and the card prints the same line under its first sentence.
#
# scripts/gen_stars_notable_js.py mirrors this file into site/js/data/starsnotable.js;
# scene/stars3d.js merges each row into the star record it names; CI refuses drift.
#
# hip      the Hipparcos number, checked against the star's own Wikipedia page AND against
#          site/data/stars3d.names.json, where scene/stars3d.js makes the record `hip-<n>`.
# proper   ONLY for a star with no Hipparcos number. HYG has Wolf 359 (magnitude 13.5) with no HIP,
#          so scene/stars3d.js keys its record by row, and this row finds it by its exact proper name.
# name     the name a person uses. Where the names file says something else (Rigil Kentaurus,
#          Toliman, Ran, Helvetios, τ Cet) the record takes this name and keeps that one as an
#          alias, so search still finds it.
# why      one sentence, 160 characters at most (the card's cap), every claim in it read on the
#          page in `source`. No numbers the card already prints from HYG (distance, magnitude),
#          which would be a second, differently rounded copy of the same fact.
# source   the page, and the day it was read.
#
# NOT HERE, ON PURPOSE. Betelgeuse and Eta Carinae are registry/exotics.yaml rows with their own
# fact sheets; a second line for them here would be two cards' worth of claims for one star, and
# check_registry.py refuses a name both files use. Gliese 581, Tabby's Star (KIC 8462852) and
# HD 209458 are not rows in the names file (no proper, Bayer or Flamsteed name in HYG, or no HYG
# row at all), so there is no star record to attach a line to.
