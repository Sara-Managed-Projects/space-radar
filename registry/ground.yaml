version: 1
# THE GROUND AT THE LANDING SITES (release 2.0.0 batch f7-ground, forge #146). One row per site a visitor can stand
# on (`#ground=<id>`); scripts/build-ground.py reads each row's three sources by HTTP range requests and writes
# site/data/ground/<id>/ (scene/groundstage.js draws it). The lander's coordinates are its registry/sites.yaml row's
# (`site:`), which is where the stage puts the lander's model.
#
#   dtm      the stereo terrain model: the heights within a kilometre of the lander, and within 30 km where its
#            strip reaches. `post_m` is its post spacing.
#   ortho    the orthoimage made with it, on the same grid: the ground's brightness. One camera band, grey.
#   global   the world's global height model, for the far ground the strip does not reach. `edge: false`: the
#            USGS mosaics' PDS3 labels put the projection offset at a pixel's centre (build-ground.py says why).
#   tint     the colour a grey orthoimage is multiplied by (sRGB), or none. Mars's is MEASURED: the mean of the
#            ground in Spirit's approximately true-colour Lookout panorama (NASA/JPL/Cornell, PIA07882, read
#            2026-11-07 at images-assets.nasa.gov), (118, 72, 40); the Moon's orthoimages are drawn grey.
#   model    the model at the lander's coordinates (site/models/), and how it stands: `heading_deg` is ILLUSTRATIVE
#            (no image here gives it); `metres_per_unit` 1 for a file in metres (Curiosity's, NASA's own; Zhurong's
#            and Chang'e 4's, built from their published dimensions), or `size_m`, the file's longest side in metres
#            where it is not (the LM: 9.18 m between its footpads' ends, registry/models.yaml's own scale of 1.43 m a
#            unit; Perseverance: 3.0 m long, NASA's mission page); `hide` the parts no longer there (the LM's ascent
#            stage left the Moon).
#
# Licences: every DTM and orthoimage here is a NASA mission's data archived in the PDS ("Data sets archived in the
# PDS are in the public domain", PDS Geosciences Node FAQ; LROC's and HiRISE's RDRs are PDS archive products);
# SLDEM2015 and MOLA are USGS Astrogeology mosaics of PDS data whose pages say "Access Constraints public domain"
# (SLDEM2015) and CC0 (MOLA, in the HRSC-MOLA blend's page: "MOLA (CC0)"). registry/asset_sources.yaml has a row each.
