      page: "https://data.lroc.im-ldi.com/lroc/view_rdr_product/NAC_DTM_APOLLO15_M111571816_50CM"
      post_m: 0.5
      licence: "Public domain (NASA PDS archive product, LRO-L-LROC-5-RDR-V1.0)"
      credit: "NASA/GSFC/Arizona State University (LROC)"
    trek: &wac
      what: "LRO WAC global mosaic, 100 m a pixel (the far ground beyond the stereo strip)"
