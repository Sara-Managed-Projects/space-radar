      page: "https://data.lroc.im-ldi.com/lroc/view_rdr_product/NAC_DTM_APOLLO15_E261N0036"
      post_m: 2.0
      licence: "Public domain (NASA PDS archive product, LRO-L-LROC-5-RDR-V1.0)"
      credit: "NASA/GSFC/Arizona State University (LROC); Henriksen et al. 2017, Icarus 283, 122-137"
    ortho:
      what: "LROC NAC orthoimage M111571816, 0.5 m a pixel"
      product: NAC_DTM_APOLLO15_M111571816_50CM
