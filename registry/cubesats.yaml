# CUBESAT FORM FACTORS, SOURCED (release 2.0.0, batch m2-buses; forge #118).
#
# Which CubeSat each catalogued object is, by catalogue number, so scene/realmodels.js draws a 1U as a 1U, a 3U as a 3U and a 12U as a 12U at the standard's own size
# (the CubeSat Design Specification rev. 14.1: 1U 100 x 100 x 113.5 mm, 2U 227.0, 3U 340.5, 6U 100 x 226.3 x 366, 12U 226.3 x 226.3 x 366 mm) instead of every name that
# looks like a CubeSat wearing one 3U with wings. The source is ONE column pair of McDowell's General Catalog of Artificial Space Objects (GCAT, planet4589.org/space/gcat,
# satcat.tsv of 2026-11-06, CC BY 4.0), found by catalogue number: `Bus` ('Cubesat 3U') for the form, and `Shape` for whether two deployed panels are drawn ('Box + 2 pan' against
# 'Box'). Read on 2026-11-07 for the 17 001 objects of the CelesTrak copy of 2026-11-05 (active, visual, stations).
# A row is here only when `Bus` is exactly one of the five forms the standard defines and drawn here (1U, 2U, 3U, 6U, 12U; McDowell's own `?` is doubt and does not count), and `Shape` is
# exactly 'Box' (the body alone) or 'Box + 2 pan' on a 3U, 6U or 12U (the body with two deployed wings). NOT DRAWN, and kept as they were: the 16U family (58 objects, 65 with its variants; the form is
# not in the specification, and the sources disagree on its size: 226.3 x 226.3 x 488 mm in one package, 200 x 200 x 400 in another), 8U (46), 4U, 1.5U, 0.5U, 6UXL, 12UXL (none is in the
# specification), the uncertain forms (`3U?` 41, `6U?` 10, `12U?` 3, `1U?` 2) and the shapes with a sail, a boom, three or four panels or an antenna that are not drawn.
# The wings are ours (three hinged panels a side, 0.095 m out by the body's length, read off a public-domain NASA photograph of a Planet Dove with its wings open, ISS-49,
# looked at only): GCAT says the craft has two panels, not how big, and the registry row for the file says so.
version: 1
