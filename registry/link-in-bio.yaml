# THE LINK-IN-BIO PAGE (internal #106): /links/, the address on the Instagram profile. One door for each recent post, so a view can
# become a visit: the post's title (as posted), and the page of this site that shows the thing it was about.
#
# NEWEST FIRST. The page lists the first six rows (scripts/seo_pages.py links_page); add a row at the top when a post goes out and the
# oldest drops off. A row types only what the post is: its title and its door. The words under each title are the door's own
# description, read from the page, never written here.
#
#   id     a short word for the post; the door is tagged ?from=ig-<id> so the visit can be counted by what brought it
#   title  the post's title exactly as it was posted (English; it is not translated)
#   door   a page of this site, by path from the root, that exists in site/ (tests/test_link_in_bio.py): lab/<simulator>/index.html or
#          t/<trip>.html
#   posted the day the post went out (YYYY-MM-DD), from growth/log.md's daily reads
