# Terms a card may use. A term used on a card that is NOT here fails CI (spec 0013): the check
# is what stops jargon leaking back in one word at a time. Two lines each, written for a
# curious 14-year-old and read aloud to a 9-year-old.
version: 1

terms:
  - {term: orbit, say: "A path around something, held by gravity. Fast enough sideways and you keep falling past the Earth instead of into it."}
  # low Earth orbit: from about 200 to 2000 km up, Types of orbits - ESA, https://www.esa.int/Enabling_Support/Space_Transportation/Types_of_orbits, read 2026-10-12.
  - {term: low Earth orbit, say: "The busy shell from about 200 to 2000 km up. The station, most satellites and most of the debris are here."}
  - {term: geostationary, say: "An orbit 35 786 km up where one lap takes as long as the Earth takes to turn once, 23 hours 56 minutes. So the satellite seems to hang over one spot."}
  - {term: polar orbit, say: "An orbit over the poles. The Earth turns underneath, so the satellite eventually sees every part of it."}
  - {term: elements, say: "Six numbers plus a date that describe an orbit. Feed them to the right maths and you get a position."}
  - {term: epoch, say: "The moment a set of orbital elements was true. The further you are from it, the less exact the answer."}
  - {term: apogee, say: "The high point of an orbit around Earth."}
  - {term: perigee, say: "The low point of an orbit around Earth."}
  - {term: perihelion, say: "The point where something orbiting the Sun comes closest to it."}
  - {term: inclination, say: "How tilted an orbit is compared with the equator. Ninety degrees goes over the poles."}
  - {term: propagated, say: "Worked forward from an older measurement. Not a fresh observation, and it drifts."}
  # lunar distance: about 384 000 km, Moon Fact Sheet - NASA NSSDCA, https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html, read 2026-10-12.
  - {term: lunar distance, say: "The distance from Earth to the Moon, about 384 000 km. A handy ruler for asteroid passes."}
  # astronomical unit: about 150 million km, Earth Fact Sheet - NASA NSSDCA, https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html, read 2026-10-12.
  - {term: astronomical unit, say: "The distance from Earth to the Sun, about 150 million km."}
  - {term: light-time, say: "How long light takes to cross a distance. It is also how long a radio message takes."}
  - {term: light-year, say: "The distance light travels in one Julian year, about 9.46 trillion km. A ruler for the gap between stars."}
  - {term: magnitude, say: "How bright something looks. The scale runs backwards: smaller numbers are brighter."}
  - {term: azimuth, say: "A compass direction in degrees. Zero is north, 90 is east."}
  - {term: elevation, say: "How high something is above the horizon, in degrees. Ninety is straight up."}
  - {term: terminator, say: "The line between day and night on a world."}
  - {term: twilight, say: "The time after sunset when the sky is not yet fully dark. Satellites are easiest to see then."}
  - {term: sunlit, say: "Still catching sunlight even though the ground below is dark. That is what makes a satellite visible."}
  - {term: radiant, say: "The point in the sky a meteor shower seems to come from."}
  - {term: ZHR, say: "Roughly how many meteors an hour you would see under a perfect dark sky with the radiant overhead. Usually you see fewer."}
  - {term: close approach, say: "When an asteroid passes near Earth. Near in astronomy usually means further than the Moon."}
  - {term: near-Earth object, say: "An asteroid or comet whose orbit brings it close to Earth's."}
  - {term: reentry, say: "When something falls back into the atmosphere. Most of it burns up on the way down."}
  # debris: more than 25,000 objects larger than 10 cm are tracked by the U.S. Space Surveillance Network; NASA Orbital Debris Program Office FAQ, https://orbitaldebris.jsc.nasa.gov/faq/, read 2026-10-11.
  - {term: debris, say: "Dead satellites, spent rocket stages and fragments. Tens of thousands of pieces are tracked."}
  - {term: constellation, say: "A pattern of stars people named long ago. The stars in one are usually nowhere near each other."}
  # L1: 1.5 million km from Earth towards the Sun, Orbit - NASA Science, https://science.nasa.gov/mission/webb/orbit/, read 2026-10-12.
  - {term: L1, say: "A balance point between the Earth and the Sun, about 1.5 million km sunward. Good for watching the Sun."}
  # L2: 1.5 million km from Earth, Orbit - NASA Science, https://science.nasa.gov/mission/webb/orbit/, read 2026-10-11.
  - {term: L2, say: "A balance point 1.5 million km from Earth on the side away from the Sun, where a telescope can keep the Earth and Sun behind it and stay cold."}
  - {term: transit, say: "When one thing passes in front of another as seen from where you stand."}
  - {term: conjunction, say: "When two things appear close together in the sky. They are not close in space."}
  - {term: ephemeris, say: "A table of where something will be, worked out in advance."}
  # The eclipse words (spec 0031, 2026-09-23): the Next list names each eclipse's kind.
  - {term: umbra, say: "The dark middle of a shadow, where the light is blocked completely. Stand in the Moon's umbra and the Sun is gone."}
  - {term: penumbra, say: "The paler outer part of a shadow, where only some of the light is blocked. A Moon in the Earth's penumbra only dims a little."}
  - {term: totality, say: "The minutes of a total eclipse when the Sun is covered completely. The sky goes dark enough to see stars."}
  - {term: annular, say: "Ring-shaped. In an annular eclipse the Moon is too far away to cover the whole Sun, so a bright ring is left around it."}
  # The deep sky's words (internal spec 0076 W1-c, internal #884): the card's legend ("How we know",
  # ui/truthlegend.js) shows the ones a card uses, and copy/en.later.js r12Truth.terms repeats these five
  # word for word (tests/test_truthlegend.mjs holds the two together).
  # (One astronomical unit, the orbit's RADIUS, spans the arcsecond: the orbit itself is two wide. Review 2026-11-16.)
  # parsec: 648 000/pi astronomical units, about 3.26 light-years, IAU 2015 Resolution B2, https://www.iau.org/static/resolutions/IAU2015_English.pdf, read 2026-10-15.
  - {term: parsec, say: "About 3.26 light-years: the distance from which the gap between the Earth and the Sun would look one arcsecond wide. Papers write pc, and kpc for a thousand."}
  # Andromeda at about 2.5 million light-years: the M31 row of site/data/dso.json (2 540 000 ly).
  - {term: million light-years, say: "A million light-years, written Mly. Andromeda, the nearest big galaxy, is about 2.5 million away."}
  # The edge of the observable universe at about 46 billion light-years: data/cosmology.js horizonLy() (Planck 2018 parameters).
  - {term: billion light-years, say: "A thousand million light-years, written Gly. The edge of what we can see is about 46 billion light-years away now."}
  - {term: lookback time, say: "How long ago the light we see left something. From far galaxies it is billions of years: we see them as they were then."}
  - {term: comoving distance, say: "How far away something is now, counting how much space has stretched since its light left. Far out it is more than the light's travel time suggests."}
  # The star and deep-sky words the cards use (internal #300, 2026-11-15). Each says where it was read; the numbers in them are the page's.
  # black hole: Black Holes - NASA Science, https://science.nasa.gov/universe/black-holes/, read 2026-11-15.
  - {term: black hole, say: "A place where gravity is so strong that nothing, not even light, can get out. It is not a hole but a lot of matter packed into a small space."}
  # neutron star: Stars: types - NASA Science, https://science.nasa.gov/universe/stars/types/, read 2026-11-15 (more mass than the Sun in a sphere about as wide as Manhattan is long).
  - {term: neutron star, say: "What a massive star can leave behind when it dies: more than the Sun's mass squeezed into a ball about as wide as a city."}
  # pulsar: Pulsar - Wikipedia, https://en.wikipedia.org/wiki/Pulsar, read 2026-11-15; Stars: types - NASA Science, https://science.nasa.gov/universe/stars/types/, read 2026-11-15.
  - {term: pulsar, say: "A neutron star that spins fast and sends out beams like a lighthouse. We see a blink each time a beam sweeps across us."}
  # white dwarf: Stars: types - NASA Science, https://science.nasa.gov/universe/stars/types/, read 2026-11-15 (usually Earth-size, produces no new heat, cools over billions of years).
  - {term: white dwarf, say: "The hot core left when a star like the Sun has shed its outer layers. About as big as the Earth, it makes no new heat and slowly cools."}
  # brown dwarf: Stars: types - NASA Science, https://science.nasa.gov/universe/stars/types/, read 2026-11-15 (generally 13 to 80 times the mass of Jupiter).
  - {term: brown dwarf, say: "An object too big to be a planet and too small to shine like a star: about 13 to 80 times Jupiter's mass. It gives out almost no visible light."}
  # nebula: Nebula - Wikipedia, https://en.wikipedia.org/wiki/Nebula, read 2026-11-15.
  - {term: nebula, say: "A cloud of gas and dust in space. Some glow, some hide the stars behind them, and in some of them new stars are forming."}
  # galaxy: Galaxies - NASA Science, https://science.nasa.gov/universe/galaxies/, read 2026-11-15.
  - {term: galaxy, say: "A huge family of stars, gas and dust held together by gravity. Ours, the Milky Way, is a spiral about 100 000 light-years across."}
  # globular cluster: Globular cluster - Wikipedia, https://en.wikipedia.org/wiki/Globular_cluster, read 2026-11-15.
  - {term: globular cluster, say: "A ball of tens of thousands to millions of stars packed tightly together by gravity, thickest at the centre."}
  # habitable zone: Habitable Zone - NASA Science, https://science.nasa.gov/exoplanets/habitable-zone/, read 2026-11-15.
  - {term: habitable zone, say: "The range of distances from a star where a planet could have liquid water on its surface. It says life might be possible there, not that any lives there."}
  # exoplanet: What is an exoplanet? - NASA Science, https://science.nasa.gov/exoplanets/what-is-an-exoplanet/, read 2026-11-15.
  - {term: exoplanet, say: "A planet that goes round a star other than the Sun."}
  # redshift: Redshift - Wikipedia, https://en.wikipedia.org/wiki/Redshift, read 2026-11-15.
  - {term: redshift, say: "Light stretched to longer, redder waves, because its source moves away or space stretched on the way. For far galaxies, more redshift means farther away."}
  # supernova: Supernova - Wikipedia, https://en.wikipedia.org/wiki/Supernova, read 2026-11-15.
  - {term: supernova, say: "The explosion of a star at the end of its life, or of a white dwarf. For a few weeks it can shine as bright as a whole galaxy."}
  # light curve: Light curve - Wikipedia, https://en.wikipedia.org/wiki/Light_curve, read 2026-11-15.
  - {term: light curve, say: "A graph of how bright something is over time. A pulse or a dip in it can show a star that swells and shrinks, or something passing in front."}
