    # 2026-10-15 (public #1076, #1077): SMAP's and Jason-3's, from the same kind of page on two more mission sites; the
    # same policy was read again that day (through a reader: jpl.nasa.gov answers 403 to curl) and says the same.
    match: ["https://swot.jpl.nasa.gov/", "https://smap.jpl.nasa.gov/", "https://sealevel.jpl.nasa.gov/"]
    url: https://swot.jpl.nasa.gov/resources/86/swot-3d-model/
    licence: Public domain (JPL image use policy; NASA media usage guidelines)
    licence_read: "Unless otherwise noted, images and video on JPL public web sites (public sites ending with a jpl.nasa.gov address) may be used for any purpose without prior permission, subject to the special cases noted below."
    licence_url: https://www.jpl.nasa.gov/jpl-image-use-policy/
    licence_note: "The policy names images and video and does not name 3D models; a model rests on NASA's guidelines in `licence_also`, which do. The credit line the policy asks for is 'Courtesy NASA/JPL-Caltech'. A model whose page credits a contractor or another agency is not covered: read each page."
    account: none
    cost: none
    offline: shipped
    checked: 2026-10-15
    licence_also: {url: "https://www.nasa.gov/nasa-brand-center/images-and-media/", quote: "NASA content – images, audio, video, and media files used in the rendition of 3-dimensional models, such as texture maps and polygon data in any format – generally are not subject to copyright in the United States."}

