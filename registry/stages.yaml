# The scale ladder (spec 0028 requirement 1): stages that are a SCALE rather than a world.
#
# A stage decides one thing -- how many kilometres one scene unit is -- and where the floating
# origin sits (spec 0005). Every world in worlds.yaml is a stage already (unit_km on its row). The
# rows here are the rungs beyond the Solar System: centred on the Sun, one unit each, in the
# heliocentric ecliptic frame every asteroid and probe already uses. Nothing in site/js/ names
# these ids; scene/stage.js's STAGES table mirrors this file and check_registry.py refuses drift.
#
# unit_km   what one unit is. float32 holds ~7 digits, so a stage places anything from 1e-3 to
#           1e7 units to better than a pixel; each rung is chosen so its catalogue sits in that band.
# frame     the axes and origin positions are expressed in before the origin is subtracted.
# centre    the world at the origin. `sun` for all three, because the Sun is where we measure from.
# reaches   prose, for the card and the breadcrumb: what is drawable at this rung.
# kind      absent for a rung of the ladder; `system` for a star system's own stage (spec 0040).
#
# A SYSTEM STAGE (spec 0040, 2026-09-23) is one star and its planets at their own scale, one row per
# registry/systems.yaml row, written here by hand beside the rungs. Its `centre` is the host star's
# RECORD (`star-<system id>`, made by data/layers.js from the exoplanet table), not a world, and the
# origin is that star's measured place, which does not move. unit_km is 100 000 km on every system
# row and check_registry.py refuses any other: TRAPPIST-1 h at 0.0619 au is then 93 units out and the
# star 0.83 in radius, both deep inside float32's comfortable band. The ladder's unit constants were
# typed 1 000 times wrong twice in spec 0028 and caught by tests; tests/test_ladder.mjs pins this one
# in both files for the same reason.
version: 1

stages:
  - id: stellar
    display: The stellar neighbourhood
    unit_km: 9460730472580.8     # one light-year, exactly (IAU: 9 460 730 472 580 800 m)
    frame: sun-inertial
    centre: sun
    reaches: "Every star with a measured distance -- the Sun is a point, the planets are gone."

  - id: galaxy
    display: The Milky Way
    unit_km: 30856775814913670   # one kiloparsec (IAU: 3.085 677 581 491 367e19 m)
    frame: sun-inertial
    centre: sun
    reaches: "The galaxy's disc, bar and arms; the Sun is 8.2 of these from the centre."

  - id: local-group
    display: The Local Group
    unit_km: 9460730472580800000 # one million light-years
    frame: sun-inertial
    centre: sun
    reaches: "Andromeda at 2.5, Triangulum at 2.7, and the edge of what we show."

  - id: system-trappist-1
    kind: system
    display: The TRAPPIST-1 system
    unit_km: 100000              # one hundred thousand km; h at 0.0619 au is 93 units, the star 0.83
    frame: sun-inertial
    centre: star-trappist-1
    reaches: "Seven planets, all of them closer to their star than Mercury is to the Sun."
