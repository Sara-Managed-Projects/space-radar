# Every distinct value the live LL2 2.3.0 upcoming feed returned on 2026-09-07, with the number
# of launches carrying it. All 359 launches were read, in four pages of 100. This is the evidence
# for `match:`, because CI cannot phone LL2: a row whose match string is not here is refused
# unless it says `not_in_feed:` and why. Refreshing it is a scripted read of the feed and a diff.
#
# Note the two shapes of gap it makes visible. `families` is EMPTY on 71 of the 359 launches
# (19.8%), because LL2 only creates a family record for a manufacturer with more than one
# launcher -- so Electron, the second most frequent vehicle in the feed, has no family at all and
# must be matched by full_name. And the root family is too coarse in both directions: "Falcon"
# covers Falcon 9 and Falcon Heavy, "GSLV" covers two rockets that look nothing alike.
