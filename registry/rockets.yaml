# Every launch vehicle the app can draw, and the evidence that it draws it.
#
# A row here is a SILHOUETTE, never a photograph. Four fields carry recognition at 40 px:
# strap-on shape, what sits on top, nozzle pattern, and body taper. Height tracks the FAIRING,
# not the booster count -- Ariane 62 and 64 are both 63 m -- so height is stated per row and
# never derived.
#
# `class:` is the provenance of the NUMBERS: `measured` (a source was read) or `inferred` (a
# number derived from a sourced fact -- arithmetic, or a family figure standing in for a variant
# the sources do not size separately). There is no third value. A number nobody could source is
# NOT WRITTEN DOWN: the field is left out and the builder falls back to a class-typical
# proportion, or the whole row is omitted and the launch falls through to the generic rocket,
# which the card says out loud.
#
# WHAT IS REQUIRED AND WHAT IS OPTIONAL, and why
#   height_m, core_dia_m, taper, top.kind, boosters.shape, engines.count, engines.pattern,
#   stands_for, class and source are required on every row.
#   top.dia_m       optional -- absent means the fairing is flush with the body, which is the
#                   common case. Required only when `taper: hammerhead`, which is the claim that
#                   the fairing is WIDER than the body (Zhuque-2E, Gravity-1, Long March 12A).
#   top.len_m       optional -- absent draws a class-typical nose of 2.2 x its diameter. Fairing
#                   lengths are published for perhaps a third of the fleet.
#   boosters.dia_m  REQUIRED for every shape but `none`. It is the dominant discriminator:
#                   Ariane's 3.4 m against a 5.4 m core is the whole silhouette.
#   boosters.len_m  optional -- absent draws a booster 62% of the core's length.
#
# `engines.count` is every nozzle that lights on the pad, across all bodies (Falcon Heavy 27,
# Soyuz 20, Delta IV Heavy 3). `engines.pattern` is how the CORE's engines are arranged.
# `pattern: unknown` is the honest degradation where the count is sourced and the arrangement is
# not: an engine skirt is drawn with no individual bells.
#
# COLOUR. 14 of the families here have no documented livery -- colour is almost never in a spec
# document, it lives in photography. Those rows carry `livery: unknown`, draw in the neutral
# default, and the card says NOTHING about colour. The absence is the honest statement. Two
# colour claims that are widely repeated and that no source supports are called out in the rows
# that would carry them: Soyuz is not grey-green (that is a photographic artefact), and nobody
# can source orange-brown Ariane 6 boosters (that is Ariane 5's EAPs).
#
# MATCHING is exact string comparison, trimmed and case-folded. There is no normaliser: a regex
# in a builder is the opposite of "behaviour is data a human edits", and listing
# ["Ariane 64", "Ariane 64 Block 2"] is one more array element and completely legible.
# Resolution order, most specific first:
#   1. match.full_name  against rocket.configuration.full_name   (0% null, 72 distinct)
#   2. match.family     walking `families` from most specific to root
#   3. match.provider   against launch_service_provider.name     (0% null, 38 distinct)
#   4. no row -> the generic rocket, and the card says so.
#
# DELIBERATELY NOT MATCHED, because one drawing would be a lie:
#   * family "GSLV" -- Mk II and LVM-3 look nothing alike. Two full_name rows instead.
#   * family "Long March" and "Long March 2" -- 2D/YZ-3 is a bare tube, 2F/G is crewed, 5 has
#     four liquid strap-ons and 10 has two full-size cores. Named variants only.
#   * family "Falcon" -- its root covers Falcon 9 and Falcon Heavy. Falcon Heavy is matched by
#     full_name; an unlisted Falcon variant falls to generic rather than to a wrong core count.
#
# `observed:` at the foot of this file is the measured distinct-value list from the live LL2
# 2.3.0 upcoming feed, with counts. CI cannot phone LL2, so the evidence is checked in: a row
# whose match string is not in that list is refused unless it says `not_in_feed:` and why.
version: 1
observed_on: 2026-09-07     # all 359 upcoming launches read, in four pages of 100

rockets:
  # ---- keyed on the most specific family; the family IS the vehicle -------------------
  - id: falcon-9
    display: "Falcon 9 Block 5"
    match: {full_name: ["Falcon 9 Block 5"], family: ["Falcon 9"]}
    stands_for: variant
    height_m: 70.0
    core_dia_m: 3.66
    taper: tube
    top: {kind: fairing, dia_m: 5.2, len_m: 13.2}
    boosters: {shape: none, count: 0}
    engines: {count: 9, pattern: octaweb}
    livery: {body: "#EEF2F7", interstage: "#1B1D21", class: measured}
    class: measured
    source: "SpaceX Falcon User's Guide rev. 8, May 2025, Table 2-1: 70.0 m, 3.66 m, 5.2 x 13.2 m fairing, 'eight engines surrounding a center engine'"
    note: "the black interstage is carbon composite. Flown boosters are soot-streaked; that is a decal claim per flight and is not drawn."

  - id: falcon-heavy
    display: "Falcon Heavy"
    match: {full_name: ["Falcon Heavy"]}
    stands_for: variant
    height_m: 70.0
    core_dia_m: 3.66
    taper: tube
    top: {kind: fairing, dia_m: 5.2, len_m: 13.2}
    boosters: {shape: liquid_core_clone, count: 2, dia_m: 3.66}
    engines: {count: 27, pattern: octaweb}
    livery: {body: "#EEF2F7", interstage: "#1B1D21", class: measured}
    class: measured
    source: "SpaceX Falcon User's Guide rev. 8, May 2025; Wikipedia Falcon Heavy for the 12.2 m span across three cores"
    note: "the side boosters are externally identical to the centre core, which is what liquid_core_clone means. Booster length is not published separately and is not written down."

  # ---- keyed on full_name, because the family merges two different outlines ------------
  #      families[-1] is "Ariane 6" for BOTH 62 and 64. Two boosters or four is the whole
  #      point of the silhouette, so the variant rows win before the family row is reached.
  - id: ariane-62
    display: "Ariane 62"
    match: {full_name: ["Ariane 62", "Ariane 62 Block 2"]}
    stands_for: variant
    height_m: 63.0
    core_dia_m: 5.4
    taper: tube
    top: {kind: fairing, dia_m: 5.4}
    boosters: {shape: solid_fat, count: 2, dia_m: 3.4, len_m: 22.0}
    engines: {count: 1, pattern: single}
    livery: {body: "#F4F6F8", boosters: unknown, class: measured}
    class: measured
    source: "ESA Ariane 6 overview (63 m); ArianeGroup: white is functional -- it reflects sunlight and gives a background for visual anomaly detection. P120C 22 m x 3.4 m"
    note: "the fairing is 14 m or 20 m depending on the flight, so its length is not written down. Booster colour could not be sourced; the orange-brown often claimed is Ariane 5's EAPs."

  - id: ariane-64
    display: "Ariane 64"
    match: {full_name: ["Ariane 64", "Ariane 64 Block 2"]}
    stands_for: variant
    height_m: 63.0
    core_dia_m: 5.4
    taper: tube
    top: {kind: fairing, dia_m: 5.4}
    boosters: {shape: solid_fat, count: 4, dia_m: 3.4, len_m: 22.0}
    engines: {count: 1, pattern: single}
    livery: {body: "#F4F6F8", boosters: unknown, class: measured}
    class: measured
    source: "ESA Ariane 6 overview; ArianeGroup on the white and on P120C 22 m x 3.4 m. A62 and A64 are the same 63 m: height tracks the fairing, not the boosters"

  - id: ariane-6
    display: "an Ariane 6"
    match: {family: ["Ariane 6", "Ariane"]}
    stands_for: family
    height_m: 63.0
    core_dia_m: 5.4
    taper: tube
    top: {kind: fairing, dia_m: 5.4}
    boosters: {shape: solid_fat, count: 2, dia_m: 3.4, len_m: 22.0}
    engines: {count: 1, pattern: single}
    livery: {body: "#F4F6F8", boosters: unknown, class: measured}
    class: measured
    source: "ESA Ariane 6 overview; ArianeGroup"
    note: "the bare `Ariane 6` configuration does not say how many boosters, so it is drawn as the two-booster A62 and the card says the drawing is the family."

  # ---- keyed on full_name because LL2 gives Rocket Lab no family at all ----------------
  #      Electron is the #2 vehicle in the feed and 41 of the 71 family-less launches.
