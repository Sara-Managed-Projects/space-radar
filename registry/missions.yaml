  # Apophis has no spacecraft and one date everybody asks about (internal #424). Read 2026-10-07 on
  # NASA's page: "will safely pass close to Earth on April 13, 2029", "about 20,000 miles (32,000
  # kilometers) from our planet's surface -- closer than the distance of many satellites in
  # geosynchronous orbit". NASA gives the day; `path_at` is the closest minute in JPL's track
  # (registry/ephemerides.yaml asteroid-99942, solution JPL#220), as the asteroid trip's stop uses.
  - id: apophis
    record: asteroid-99942
    display: Apophis
    read: 2026-10-07
    source: {name: "NASA Science, Apophis", url: "https://science.nasa.gov/solar-system/asteroids/apophis/"}
    events:
      # "discovered on June 19, 2004, by astronomers Roy Tucker, David Tholen, and Fabrizio Bernardi
      # at the Kitt Peak National Observatory in Tucson, Arizona" (the same page, the same day).
      - {id: discovery, date: "2004-06-19", precision: day, title: "Discovered", text: "Roy Tucker, David Tholen and Fabrizio Bernardi find it from Kitt Peak National Observatory in Arizona.", place: none}
      - {id: earth-2029, date: "2029-04-13", precision: day, predicted: true, title: "Past Earth", text: "Apophis passes about 32 000 km above the ground, closer than many satellites in geosynchronous orbit. It will miss.", place: path, path_at: "2029-04-13T21:45:00Z", world: earth}
