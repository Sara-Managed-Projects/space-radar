# Missions as places in time (public #452, internal #269). A handful of flagship missions, each a
# short list of dated events: the launch, the flybys, the arrival, the moments people remember.
# The card of the record named by `record` lists them with Prev and Next (ui/missions.js), and
# `#event=<mission>.<event>` is a link to one.
#
# EVERY ROW HAS A SOURCE, AND NOTHING HERE IS FROM MEMORY. Each mission names the page its
# events were read on (`source`), and the day they were read (`read`). An event whose date, time
# or figure is on a different NASA page names that page itself (`source` on the event), and the
# card links to it. On 2026-10-06 every event was checked against its page: the date, the time
# where one is given, and every number in its sentence. What a page did not say was taken out:
# a clock time became `precision: day`, a figure left the sentence, and three events whose date
# no cited page gave were removed (Webb's mirror unfolding, Zarya's launch, the first commercial
# crew). Two things worth knowing: NASA's Voyager 2 page lists "Nov 25, 2018" for interstellar
# space in its key dates, and the agency's own release, cited on that row, says Nov. 5; and
# NASA's Apollo 11 overview puts Armstrong's first step at "about 109 hours, 42 minutes", while
# NSSDCA, cited on that row, gives 02:56:15 UT on 21 July. Times are UTC. `precision: day` means
# the page gives a date and no time; the clock is then set to noon UTC of that day.
#
# `place` SAYS WHETHER THE MAP CAN SHOW THE CRAFT THERE ON THAT DAY, which is the honest part:
#   site     the record is a place on a world (a landing site): it is where it is on any date,
#            and the Moon and Mars are worked out for any date. The clock moves, the camera frames it.
#   cruise   a craft coasting out of the Solar System in a straight line at a steady speed. When
#            the map holds no path for that date it draws the craft on the line back from its
#            measured position today, and the card says so. Good to about an astronomical unit
#            since 1990 for the Voyagers and since 2019 for New Horizons (checked against the
#            distances NASA gives for these very events: 40.4 au drawn for 40.5 on 1990-02-14).
#   path     the map holds a file of the craft's own path, from JPL Horizons, that spans the date
#            (registry/ephemerides.yaml, site/data/eph; internal #277, #406). The file is fetched,
#            the clock moves, and the map goes to the world the craft was at and frames the two.
#            scripts/build_ephemerides.py --check refuses a `path` event outside its file's span.
#            No row says `cruise` any more: every coasting craft here has a file. The straight
#            line stays in ui/missions.js for a craft that has none.
#   none     the map has no path for the craft on that date. The event is told on the card and
#            THE CLOCK DOES NOT MOVE.
# `world` names the world an event happened at. For a `none` event the card offers that world on
# that day, which is true, with the craft not drawn; for a `path` event it is checked against the
# file (tests/test_ephemerides.mjs: the craft is kept relative to that world on that date).
# `path_at` is where the clock goes instead of the event's own instant, in two cases, and the card
# says which:
#   a launch   JPL's track begins when the craft separates or later, some minutes after liftoff;
#              `path_at` is the first minute the file holds (registry/ephemerides.yaml `from`).
#   a day      where NASA's page gives a day and no time, `path_at` is the closest pass to the
#              world in JPL's track on that UTC day, read from the file to the minute. It is a
#              reading of the track, not a time NASA states, and the card says so.
#
# `path_record` on a mission names another record for its `path` events: Perseverance's record is
# the Jezero site, a place on Mars, and its launch is shown on Mars 2020's cruise, a spacecraft.
#
# ADDED 2026-10-06 with the path files: Cassini, Galileo, Pioneer 10 and Pioneer 11, each read
# that day on the page its row names. Three things worth knowing. NASA Science's Pioneer 10 page
# writes the launch as "March 2, 1972 / 01:49:04 UT": 01:49 UT is the evening of 2 March in
# Florida and 3 March in UTC, which is the date the NSSDCA catalogue and JPL give, and the one
# here. Cassini's quick facts give its first Venus flyby as "176 miles (234 km)", which do not
# agree with each other, so that row carries no distance. And "5:12 a.m. EST" for its Jupiter
# flyby is written here as 10:12 UTC.
#
# Not here: any future event whose date is a plan (those are the launches list's business, from
# Launch Library).
#
# `predicted: true` (2026-10-07, internal #424) IS THE ONE EXCEPTION, and it is not a plan: a pass
# that celestial mechanics has already fixed and NASA publishes as a date. The card writes
# "(predicted)" after the date, the event must be `place: path` (so the path file's own "this is a
# prediction" line is under it), and tests/test_missions.mjs refuses a future date on any other
# row. One row today: Apophis on 13 April 2029.
version: 1
reviewed_on: 2026-10-07

