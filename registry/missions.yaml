  # page each event names: "launched on December 21, 1968 at 12:51:00 UT"; "After launch on Saturn V
  # ... on 16 July 1969 at 13:32 UT (9:32 a.m. EDT) from pad 39A"; "Apollo 17 lifted off at
  # 05:33:00 UT ... Launch was on Saturn V SA-512 from Pad 39A ... the first nighttime launch of an
  # Apollo". That Apollo 8 left from 39A is Wikipedia's Saturn V table, read the same day.
