  # Three ended missions that got a path file and NASA's mesh on 2026-10-08 (public #431). Every
  # date is the day NSSDCA's page gives, read that day, with no time: `precision: day`. NEAR's
  # path file begins two days after its launch, so that event is `none`; the other two launches
  # go to the first minute their file holds. Rosetta has a record and no row here: NSSDCA's page
  # for it returned an error that day, and JPL's header alone gives two dates, not three.
  - id: near-shoemaker
    record: deep-near
    display: NEAR Shoemaker
    read: 2026-10-08
    source: {name: "NASA NSSDCA, NEAR Shoemaker", url: "https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1996-008A"}
