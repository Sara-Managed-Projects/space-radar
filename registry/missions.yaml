# Missions as places in time (public #452, internal #269). A handful of flagship missions, each a
# short list of dated events: the launch, the flybys, the arrival, the moments people remember.
# The card of the record named by `record` lists them with Prev and Next (ui/missions.js), and
# `#event=<mission>.<event>` is a link to one.
#
# EVERY ROW HAS A SOURCE, AND NOTHING HERE IS FROM MEMORY. Each mission names the page its
# events were read on (`source`), and the day they were read (`read`). An event whose date, time
# or figure is on a different NASA page names that page itself (`source` on the event), and the
# card links to it. On 2026-10-06 every event was checked against its page: the date, the time
# where one is given, and every number in its sentence. What a page did not say was taken out:
# a clock time became `precision: day`, a figure left the sentence, and three events whose date
# no cited page gave were removed (Webb's mirror unfolding, Zarya's launch, the first commercial
# crew). Two things worth knowing: NASA's Voyager 2 page lists "Nov 25, 2018" for interstellar
# space in its key dates, and the agency's own release, cited on that row, says Nov. 5; and
# NASA's Apollo 11 overview puts Armstrong's first step at "about 109 hours, 42 minutes", while
# NSSDCA, cited on that row, gives 02:56:15 UT on 21 July. Times are UTC. `precision: day` means
# the page gives a date and no time; the clock is then set to noon UTC of that day.
#
# `place` SAYS WHETHER THE MAP CAN SHOW THE CRAFT THERE ON THAT DAY, which is the honest part:
#   site     the record is a place on a world (a landing site): it is where it is on any date,
#            and the Moon and Mars are worked out for any date. The clock moves, the camera frames it.
#   cruise   a craft coasting out of the Solar System in a straight line at a steady speed. When
#            the map holds no path for that date it draws the craft on the line back from its
#            measured position today, and the card says so. Good to about an astronomical unit
#            since 1990 for the Voyagers and since 2019 for New Horizons (checked against the
#            distances NASA gives for these very events: 40.4 au drawn for 40.5 on 1990-02-14).
#   none     the map has no path for the craft on that date (no ephemeris of our own yet,
#            internal #277). The event is told on the card and THE CLOCK DOES NOT MOVE.
# `world` names where a `none` event happened, when that is a world the map draws for any date:
# the card then offers that world on that day, which is true, with the craft not drawn.
#
# Not here: Cassini (the map has no Cassini record; it ended in 2017), and any future event whose
# date is a plan (those are the launches list's business, from Launch Library).
version: 1
reviewed_on: 2026-10-06

