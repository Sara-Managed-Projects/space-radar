      - {id: eros-orbit, date: "2000-02-14", precision: day, title: "Into orbit round Eros", text: "NEAR goes into orbit round the asteroid Eros.", place: path}
      - {id: touchdown, date: "2001-02-12", precision: day, title: "Down on Eros", text: "At the end of its mission it is set down on the surface of Eros, and goes on sending for two weeks.", place: path}

