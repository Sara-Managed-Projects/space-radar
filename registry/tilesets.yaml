version: 1
# Map tiles a world is drawn from when the camera is close (spec 0065, 2026-10-03). The browser reads
# the mirror, site/js/data/tilesets.js, written by scripts/gen_tilesets_js.py (`--check` in CI);
# site/js/scene/tiles.js fetches the tiles and site/js/scene/tilemath.js chooses them.
#
# NOTHING HERE IS STORED BY US. Each tile is fetched by the visitor's browser from the host named in
# `url`, only when the camera is close enough to that world for the 4k map to run out of texels, and
# never on a phone, on a connection that asked to save data, or after the frame latch has tripped.
# A first visit asks for none (tests/test_tiles.mjs holds the rule; a headless boot measured 0).
#
# scripts/check_registry.py check_tilesets() refuses a row without licence, credit or source, a
# credit CREDITS.md section 4.16 does not carry word for word, a url that is not https or lacks
# {z}, {y} or {x}, a row whose `cors` does not say when the header was measured, levels out of
# order or past what the host serves, and a world registry/worlds.yaml does not have.
#
#   id           ours
#   world        a worlds.yaml id
#   title        what the mosaic is, for a card line later
#   url          the WMTS RESTful template: {z} TileMatrix, {y} TileRow (0 = north), {x} TileCol
#   capabilities the host's own description of the pyramid, read on the day in `source`
#   projection   equirectangular: plain longitude and latitude, west edge at 180 W. The only one
#                scene/tilemath.js addresses; a polar-stereographic set is refused until it does.
#   matrix       [columns, rows] at level 0; every level doubles both
#   tile_px      a tile's side in pixels
#   levels       [first, last] the host answers, MEASURED by asking for a tile at each end and one past
#   min_level    the coarsest level drawn: the whole visible ground is covered at this or finer, so
#                there is no edge where the tiles stop and the base map shows. Level 3 is 4096 pixels
#                round the equator, the 4k map's own sharpness.
#   start_level  tiles begin when the ground under the camera asks for this level, i.e. when a
#                level-(start-1) texel is wider than a screen pixel there
#   max_level    the finest level asked for; never past `levels`
#   resolution_m metres per pixel at max_level on the equator, computed: 2 pi R / (matrix x 2^max x tile_px)
#   grade        [r, g, b], multiplied into the tile in linear light so the mosaic sits at the tone
#                of the map under it and the ground does not change colour as the tiles fade in.
#                (For `mode: detail`, 1 / the mosaic's mean, three times.)
#                MEASURED 2026-10-03: the level-2 mosaic (2048 x 1024) against our 4k map, both
#                reduced to 256 x 128 and linearised, between 60 S and 60 N; each number is
#                mean(map) / mean(mosaic) for that channel. The Moon's fit is a plain gain (a power
#                law fitted the same day has exponent 0.98 to 1.01); Mars's is in its row.
#   mode         colour (the default): the tile is the ground's picture, times `grade`.
#                detail: the tile is grey and only multiplies the brightness of the world's own map,
#                luminance x grade[0]; the colour stays the map's. For a world whose only seamless
#                mosaic is not in colour.
#   cors         the header the host sent to `Origin: https://www.spaceradar.ai`, and the day it was measured
#   licence      quoted from the page it was read on
#   credit       the line the Sources panel prints while these tiles are on screen; CREDITS.md 4.16
#   source       the page, with the day it was read: "URL (read YYYY-MM-DD)"
#
#
# ADDED 2026-10-06 (spec 0065 tasks 3 and 4):
#   level0_span_deg  the side of a level-0 tile in degrees, for a pyramid that is not Trek's. NASA
#                GIBS cuts the Earth into 288-degree tiles at level 0 (2 x 1, hanging past 180 E and
#                90 S), 3 x 2 at level 1, 5 x 3, 10 x 5 ... (scene/tilemath.js, A SECOND GRID).
#                `matrix` stays the host's own level-0 count.
#   grade_sea    the Earth only: the gain for the tile's WATER texels; `grade` is then the land's.
#                Blue Marble's sea is a quarter as bright as our day map's and its land half, so
#                one gain cannot sit both at the map's tone (the numbers are in the row).
#   baked_relief true when the mosaic itself carries shaded relief under a fixed light, so the
#                card can say that its hills are shaded by the map's light and not by today's Sun.
#   relief       a second pyramid on the same grid: a SHADED-RELIEF mosaic made from a laser
#                altimeter. scene/tiles.js takes from it the slope along its light's direction and
#                re-lights that with the real Sun. Its own fields:
#       title, url, capabilities, levels, cors, licence, credit, source   as a row's
#       max_level           the finest level asked for; a finer colour tile uses its ancestor here
#       light_azimuth_deg   where the picture's light comes FROM, degrees east of north. MEASURED
#                           2026-10-06, not read: three level-5 tiles of the shaded relief were
#                           regressed on the east and north gradients of the same tiles of the
#                           host's elevation mosaic (LRO_LOLA_DEM_Global_128ppd_v04,
#                           Mars_MGS_MOLA_DEM_mosaic_global_463m_8); the numbers are in each row.
#       flat                the picture's value on level ground, 0 to 1: the regression's constant
#       gain                how many times steeper the slopes are drawn than the picture has them;
#                           the card prints it when it is not 1. 1.5 was tried on the Moon on
#                           2026-10-06 and read as harsh under a Sun 22 degrees up; 1 is the mosaic's own.
#
# NOT HERE, AND WHY. Relief from ELEVATION (true normals, both directions): Trek's elevation tiles
# are 8 bits and stop at level 5, 78 m a step on the Moon -- a mare is one flat value with contour
# steps across it (43 distinct values in a 170 km tile, measured 2026-10-06). A seamless COLOUR
# mosaic of Mars: Trek has Viking's alone (rejected, see Mars's row; internal #339).
tilesets:
  - id: moon-lro-wac
    world: moon
    title: "Lunar Reconnaissance Orbiter Wide Angle Camera global mosaic, 100 m per pixel"
    url: "https://trek.nasa.gov/tiles/Moon/EQ/LRO_WAC_Mosaic_Global_303ppd_v02/1.0.0/default/default028mm/{z}/{y}/{x}.jpg"
    capabilities: "https://trek.nasa.gov/tiles/Moon/EQ/LRO_WAC_Mosaic_Global_303ppd_v02/1.0.0/WMTSCapabilities.xml"
    projection: equirectangular
    matrix: [2, 1]
    tile_px: 256
    levels: [0, 8]
    min_level: 3
    start_level: 5
    max_level: 8
    resolution_m: 83
    grade: [3.67, 3.48, 3.45]
    cors: "Access-Control-Allow-Origin: * (measured 2026-10-03)"
    licence: 'NASA media guidelines: "generally are not subject to copyright in the United States"'
    credit: "The Moon close up: Lunar Reconnaissance Orbiter WAC mosaic, NASA/GSFC/Arizona State University, from NASA Solar System Treks"
    source: "https://trek.nasa.gov/tiles/apidoc/trekAPI.html?body=moon (read 2026-10-03)"
    # The light, measured 2026-10-06 on tiles 5/12/8, 5/20/50 and 5/10/30: from azimuth 270.6, 269.1
    # and 281.2 degrees (correlation 0.84, 0.83, 0.48), level ground at 153, 163 and 179 of 255.
    # PNG, grey with alpha, 43 to 65 KB a tile. Level 7 is a 404.
    relief:
      title: "Lunar Orbiter Laser Altimeter shaded relief, 118 m per pixel"
      url: "https://trek.nasa.gov/tiles/Moon/EQ/LRO_LOLA_Shade_Global_256ppd_v06/1.0.0/default/default028mm/{z}/{y}/{x}.png"
      capabilities: "https://trek.nasa.gov/tiles/Moon/EQ/LRO_LOLA_Shade_Global_256ppd_v06/1.0.0/WMTSCapabilities.xml"
      levels: [0, 6]
      max_level: 6
      light_azimuth_deg: 270
      flat: 0.65
      gain: 1
      cors: "Access-Control-Allow-Origin: * (measured 2026-10-06)"
      licence: 'USGS Astrogeology, Moon LRO LOLA DEM 118m: "Access Constraints public domain", "Use Constraints Please cite authors"'
      credit: "The Moon's relief: Lunar Orbiter Laser Altimeter shaded relief, LOLA Science Team, NASA/GSFC, from NASA Solar System Treks"
      source: "https://astrogeology.usgs.gov/search/map/moon_lro_lola_dem_118m (read 2026-10-06)"

  # Mars's tiles are DETAIL over our own colour map (mode: detail). Viking's MDIM 2.1 colour mosaic
  # (Mars_Viking_MDIM21_ClrMosaic_global_232m, CORS `*`, levels 0-7) was the first choice and was
  # rejected on its screenshots, 2026-10-03: the Viking frames meet in hard straight edges with a
  # tone step across them, and its colour is greyer than the map under it. THEMIS's global daytime
  # infrared mosaic is seamless and sharper (100 m), and grey: so the colour stays the map's.
  # `grade` is 1 / mean of the level-2 mosaic in linear light between 60 S and 60 N (0.2087); the
  # mosaic's 11-degree means stay within 1.7 % of that, so it carries detail and no tone.
  # Tiles are PNG with an alpha channel (no-data), 50 to 65 KB. Level 9 is a 404.
  - id: mars-themis-day-ir
    world: mars
    title: "Mars Odyssey THEMIS daytime infrared global mosaic, 100 m per pixel, as detail over the colour map"
    url: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_MO_THEMIS-IR-Day_mosaic_global_100m_v12_clon0_ly/1.0.0/default/default028mm/{z}/{y}/{x}.png"
    capabilities: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_MO_THEMIS-IR-Day_mosaic_global_100m_v12_clon0_ly/1.0.0/WMTSCapabilities.xml"
    projection: equirectangular
    mode: detail
    matrix: [2, 1]
    tile_px: 256
    levels: [0, 8]
    min_level: 3
    start_level: 5
    max_level: 8
    resolution_m: 162
    grade: [4.79, 4.79, 4.79]
    cors: "Access-Control-Allow-Origin: * (measured 2026-10-03)"
    licence: 'NASA media guidelines: "generally are not subject to copyright in the United States"'
    credit: "Mars close up: THEMIS daytime infrared mosaic, NASA/JPL-Caltech/Arizona State University, from NASA Solar System Treks, as detail over the colour map"
    source: "https://trek.nasa.gov/tiles/apidoc/trekAPI.html?body=mars (read 2026-10-03)"
    # The light, measured 2026-10-06 on tiles 5/12/8, 5/20/50 and 5/10/30: from azimuth 301.5, 315.6
    # and 312.5 degrees (correlation 0.89, 0.40, 0.60), level ground at 172, 175 and 176 of 255.
    # JPEG, grey, 24 to 49 KB a tile; the host answers to level 8 and level 7 (200 m) is the data's own.
    relief:
      title: "Mars Orbiter Laser Altimeter and HRSC blended shaded relief, 200 m per pixel"
      url: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_MOLA_blend200ppx_HRSC_Shade_clon0dd_200mpp_lzw/1.0.0/default/default028mm/{z}/{y}/{x}.jpg"
      capabilities: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_MOLA_blend200ppx_HRSC_Shade_clon0dd_200mpp_lzw/1.0.0/WMTSCapabilities.xml"
      levels: [0, 8]
      max_level: 7
      light_azimuth_deg: 315
      flat: 0.68
      gain: 1
      cors: "Access-Control-Allow-Origin: * (measured 2026-10-06)"
      licence: 'USGS Astrogeology, Mars MGS MOLA - MEX HRSC Blended DEM Global 200m: "Access Constraints MOLA (CC0) and HRSC (CC BY-SA 3.0 IGO)", "Use Constraints Please cite authors"'
      credit: "Mars's relief: MOLA and HRSC blended shaded relief, NASA/GSFC (MOLA, CC0) and ESA/DLR/FU Berlin (HRSC, CC BY-SA 3.0 IGO), USGS Astrogeology, from NASA Solar System Treks"
      source: "https://astrogeology.usgs.gov/search/map/mars_mgs_mola_mex_hrsc_blended_dem_global_200m (read 2026-10-06)"

  # The Earth (spec 0065 task 4). Blue Marble is cloud-free, so it goes under our own clouds, and it
  # is one picture for every month: the 4k day map under it changes with the month and this does
  # not, so in a northern winter the snow line steps back as the tiles fade in. The card says the
  # mosaic's name. Its relief is shaded into the picture under a fixed light (`baked_relief`).
  # MEASURED 2026-10-06 against gibs.earthdata.nasa.gov: 0/0/0 and 0/0/1 answer, 0/0/2 and 0/1/0
  # are 400; level 1 is three columns by two rows; 7/79/159 is the last tile, 7/80/0 and 8/0/0 are
  # 400. Tiles are JPEG, 512 pixels, 12 to 54 KB.
  # `grade`, land and sea, is mean(our 4k day map) / mean(level-1 mosaic) per channel in linear
  # light between 60 S and 60 N, both reduced to 512 x 256, the sea taken as our map's blue more
  # than 0.06 over its red: land 1.90, 2.20, 2.31 against August's map and 2.10, 2.39, 2.67 against
  # October's (January's, with its snow, 2.66, 3.18, 4.43, is not fitted); sea 8.3, 5.7, 4.7 against
  # all three. Start_level 5: the tiles begin when a level-4 texel (3.9 km) is wider than a screen
  # pixel, about 4 200 km up at 900 pixels -- far inside where a first visit starts.
  - id: earth-blue-marble
    world: earth
    title: "Blue Marble with shaded relief and the sea floor (MODIS), 500 m per pixel"
    url: "https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/BlueMarble_ShadedRelief_Bathymetry/default/500m/{z}/{y}/{x}.jpeg"
    capabilities: "https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/1.0.0/WMTSCapabilities.xml"
    projection: equirectangular
    matrix: [2, 1]
    level0_span_deg: 288
    tile_px: 512
    levels: [0, 7]
    min_level: 3
    start_level: 5
    max_level: 7
    resolution_m: 489
    grade: [2.0, 2.3, 2.5]
    grade_sea: [8.3, 5.7, 4.7]
    baked_relief: true
    cors: "Access-Control-Allow-Origin: * (measured 2026-10-06)"
    licence: 'GIBS API page: "NASA promotes full and open sharing of data"; an acknowledgement is asked for, and the credit carries it word for word'
    credit: "The Earth close up: Blue Marble with shaded relief and bathymetry, NASA Earth Observatory. We acknowledge the use of imagery provided by services from NASA's Global Imagery Browse Services (GIBS), part of NASA's Earth Science Data and Information System (ESDIS)."
    source: "https://nasa-gibs.github.io/gibs-api-docs/ (read 2026-10-06)"
