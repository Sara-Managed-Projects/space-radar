# The scale ladder's breadcrumb (spec 0028 requirement 11): a handful of places, each one further
# out, so a visitor can climb from the Moon to a black hole in eight taps and read how far each step
# is. Every row names a record or a world the app already has; scripts/gen_ladder_js.py mirrors this
# file into site/js/data/ladder.js and scripts/check_registry.py refuses a row that names nothing.
#
# target       {world: <worlds.yaml id>} or {record: <a record id the layer named in `layer:` produces>}
# distance     the number a visitor reads, as text, and the source it was read from
# why          one sentence, plain words
#
# The honesty line under the rungs -- how much of the known sky this map shows -- is `we_show`.
version: 1

rungs:
  - id: moon
    label: The Moon
    target: {world: moon}
    distance: "384 400 km"
    distance_source: "mean Earth-Moon distance, astronomy-engine"
    why: "The only other world people have stood on. Light takes 1.3 seconds."

  - id: sun
    label: The Sun
    target: {world: sun}
    distance: "150 million km"
    distance_source: "one astronomical unit, IAU 2012"
    why: "Eight light-minutes. Everything on the Earth stage is lit from here."

  - id: neptune
    label: Neptune
    target: {world: neptune}
    distance: "4.5 billion km"
    distance_source: "30 au, mean orbital radius"
    why: "Four light-hours. The last planet, and the edge of the map's true-scale Solar System."

  - id: proxima
    label: Proxima Centauri
    target: {record: hip-70890}
    layer: stars
    distance: "4.2 light-years"
    distance_source: "HYG v4.4 (Gaia parallax)"
    why: "The nearest star to the Sun. The fastest thing we have ever built would take seventy thousand years."

  - id: pleiades
    label: The Pleiades
    target: {record: dso-m45}
    layer: deep-sky
    distance: "about 440 light-years"
    distance_source: "Wikipedia, List of Messier objects (0.39-0.46 kly)"
    why: "A cluster you can see with your eyes in winter. Its light left in the sixteenth century."

  - id: galactic-centre
    label: Sagittarius A*
    target: {record: exotic-sgr-a-star}
    layer: exotics
    distance: "27 000 light-years"
    distance_source: "registry/exotics.yaml, Wikipedia infobox"
    why: "The black hole our whole galaxy turns around. Its light left when people were painting caves."

  - id: andromeda
    label: The Andromeda Galaxy
    target: {record: dso-m31}
    layer: deep-sky
    distance: "2.5 million light-years"
    distance_source: "Wikipedia, List of Messier objects (2 430-2 650 kly)"
    why: "The nearest big galaxy, and the farthest thing most people have seen with their own eyes."

  - id: m87
    label: M87's black hole
    target: {record: exotic-m87-star}
    layer: exotics
    distance: "53 million light-years"
    distance_source: "registry/exotics.yaml, Wikipedia infobox"
    why: "The first black hole ever photographed. This is the edge of what this map draws as a place."

we_show:
  # The numbers a visitor should have when they ask "is that all of it?" Each names its source.
  - what: "stars drawn"
    n: 109389
    of: "1.8 billion in Gaia's catalogue; a few hundred billion in the Milky Way"
    source: "HYG v4.4 with a measured distance; Gaia DR3 count; Wikipedia 'Milky Way' 100-400 billion"
  - what: "planets around other stars"
    n: 6332
    of: "every confirmed one, as of the catalogue copy's date"
    source: "NASA Exoplanet Archive pscomppars"
  - what: "nebulae, clusters and galaxies placed"
    n: 167
    of: "13 372 in OpenNGC that have no measured distance written down; the rest of the Local Group waits for sourced rows"
    source: "OpenNGC; Wikipedia Messier distances"
  - what: "black holes, pulsars, a magnetar and two doomed stars with a fact sheet"
    n: 20
    of: "dozens known; a hand-kept list"
    source: "registry/exotics.yaml"
