# Meteor showers. A hand-kept table, not an API, because the IMO calendar is a PDF and peak
# dates are calendar facts that move by hours between years. Reviewed each December against
# that calendar; the review is a PR a human reads.
#
# The useful sentence on the card is never the ZHR. It is "the radiant is highest after 02:00
# and the Moon sets at 23:40" -- both computed for the visitor by astronomy-engine.
#
# `v_kms` is the speed a shower's meteors enter the air at, in kilometres a second: how quick and
# how long a streak is in the sky view (site/js/sky/meteors.js). From the table in Wikipedia's
# "List of meteor showers" (column V entry), read 2026-10-06; the IMO's own table was unreachable
# that day (imo.net was being rebuilt), which is also why there is no population index here.
#
# `r`, `active_from`, `active_to` and `sol` are the IMO's: Table 5, "Working List of Visual Meteor
# Showers", of the 2027 Meteor Shower Calendar (IMO INFO(3-26), ed. J. Rendtel; www.imo.net/files/meteor-shower/cal2027.pdf,
# read 2026-10-07). `r` is the population index (how many times more meteors each magnitude
# fainter), the two dates are the activity period, `sol` the Sun's longitude at the maximum
# (equinox 2000.0), which fixes the hour of the peak in any year. site/js/sky/meteors.js draws a
# shower over its whole activity period with these (internal #416). `antihelion` is the same
# table's first row: the year-round low source 15 degrees east of the point opposite the Sun.
# `zhr` is the same table's too, since 2026-10-08 (the PDF read again that day). The table writes
# 80+ for the Quadrantids, 110+ for the Perseids and 15+ for the Leonids ("can vary"); the plus is
# dropped here. `peak` is still the maximum's date IN 2026: the 2027 table says its dates are
# "accurate only for 2027" (4 January, 23 April, 13 August, 22 October, 18 November, 23 December
# for the six that move), and the mailer (notify/, tests/test_notify.py) sends this date as
# written for the showers still to come this year. The site does not read it for the date:
# site/js/sky/radiants.js works each year's out from `sol` (the same solar longitude falls about
# six hours later each year and a day earlier after a leap day) and uses `peak` only to know
# roughly where in the year to look. Each year's own date is in `peaks` (below).
# ADDED 2026-11-14 (internal #297): the Alpha Capricornids, Southern Delta Aquariids, Draconids and
# the Southern and Northern Taurids, the main southern and autumn showers. Every number is from the
# same IMO calendars as above, read that day: cal2027.pdf, Table 5 (activity, maximum, sol, radiant,
# V, r, ZHR) and the shower's own paragraph (the radiant in degrees, which is `ra_h` times 15 and
# `dec` as printed, south negative); cal2026.pdf for each 2026 maximum, 2027 for 2027. The 2028
# date is computed from `sol` (see peaks_from). `zhr` is Table 5's: the Southern Taurids' text says
# 5 to 10 and the table 7; the Draconids' ZHR is printed "5 (?)", and their storms of 1933 and 1946
# are in the same paragraph. `parent` is from Wikipedia's "List of meteor showers" (parent column,
# read 2026-11-14), except that the Taurids' comet 2P/Encke is also named in the IMO's own text.
version: 1
antihelion: {display: "Antihelion source", zhr: 4, r: 3.0, v_kms: 30, active_from: "12-10", active_to: "09-20", ahead_deg: 195}
reviewed_against: "IMO Meteor Shower Calendar 2027 (zhr, r, activity, sol); 2026 (peak)"
# `peaks` (forge #90): the maximum's date in UT, year by year, and `peaks_from` says where each
# year's came from. The IMO's calendar for a year where there is one; for a year it has not
# published, the date the Sun reaches the row's `sol` (site/js/sky/radiants.js peakInstant, the
# same arithmetic the map uses), marked computed. tests/test_sky_events.mjs holds every computed
# year to that arithmetic exactly and every IMO year to within a day of it, and warns nine months
# before the last year here runs out. The mailer (notify/showers.py) sends the year's own date.
peaks_from:
  "2026": "IMO Meteor Shower Calendar 2026"
  "2027": "IMO Meteor Shower Calendar 2027 (cal2027.pdf, Table 5 and the shower notes, read 2026-11-04)"
  "2028": "computed from the IMO 2027 solar longitudes (sol); the IMO 2028 calendar was not published on 2026-11-08 (cal2028.pdf: 404)"
reviewed_on: 2026-10-08

showers:
  - {id: quadrantids,   display: Quadrantids,   peak: "01-03", peaks: {"2026": "01-03", "2027": "01-04", "2028": "01-04"}, zhr: 80,  ra_h: 15.33, dec: 49.5, v_kms: 41, r: 2.1, active_from: "12-28", active_to: "01-12", sol: 283.15, parent: "asteroid 2003 EH1", note: "A sharp peak only a few hours wide, so the date matters more than for any other shower."}
  - {id: lyrids,        display: Lyrids,        peak: "04-22", peaks: {"2026": "04-22", "2027": "04-23", "2028": "04-22"}, zhr: 18,  ra_h: 18.17, dec: 34.0, v_kms: 49, r: 2.1, active_from: "04-14", active_to: "04-30", sol: 32.32, parent: "comet Thatcher",     note: "Modest most years, with occasional outbursts nobody predicts."}
  - {id: eta-aquariids, display: Eta Aquariids, peak: "05-06", peaks: {"2026": "05-06", "2027": "05-06", "2028": "05-05"}, zhr: 50,  ra_h: 22.50, dec: -1.0, v_kms: 66, r: 2.4, active_from: "04-19", active_to: "05-28", sol: 45.5, parent: "comet Halley",       note: "Dust from Halley's comet. Much better from the southern hemisphere."}
  - {id: alpha-capricornids, display: Alpha Capricornids, peak: "07-31", peaks: {"2026": "07-31", "2027": "07-31", "2028": "07-31"}, zhr: 5, ra_h: 20.47, dec: -10.0, v_kms: 23, r: 2.5, active_from: "07-03", active_to: "08-15", sol: 128, parent: "comet 169P/NEAT", note: "Slow, often bright meteors, some of them fireballs."}
  - {id: southern-delta-aquariids, display: Southern Delta Aquariids, peak: "07-31", peaks: {"2026": "07-31", "2027": "07-31", "2028": "07-31"}, zhr: 25, ra_h: 22.67, dec: -16.0, v_kms: 41, r: 2.5, active_from: "07-12", active_to: "08-23", sol: 128, parent: "comet P/2008 Y12 (SOHO)", note: "One of the most active showers in the southern hemisphere; from mid-northern latitudes only a small part of it can be seen."}
  - {id: perseids,      display: Perseids,      peak: "08-12", peaks: {"2026": "08-12", "2027": "08-13", "2028": "08-12"}, zhr: 110, ra_h: 3.22,  dec: 58.0, v_kms: 59, r: 2.2, active_from: "07-17", active_to: "08-24", sol: 140.0, parent: "comet Swift-Tuttle", note: "The one most people have heard of, and warm enough in the north to sit outside for."}
  - {id: draconids, display: Draconids, peak: "10-09", peaks: {"2026": "10-09", "2027": "10-09", "2028": "10-08"}, zhr: 5, ra_h: 17.53, dec: 56.0, v_kms: 20, r: 2.6, active_from: "10-06", active_to: "10-10", sol: 195.4, parent: "comet 21P/Giacobini-Zinner", note: "Usually weak and very slow, but it has produced meteor storms (1933 and 1946) and outbursts nobody predicted."}
  - {id: orionids,      display: Orionids,      peak: "10-21", peaks: {"2026": "10-21", "2027": "10-22", "2028": "10-21"}, zhr: 20,  ra_h: 6.35,  dec: 16.0, v_kms: 66, r: 2.5, active_from: "10-02", active_to: "11-07", sol: 208.0, parent: "comet Halley",       note: "Halley's dust again, from the other side of its orbit."}
  - {id: southern-taurids, display: Southern Taurids, peak: "11-05", peaks: {"2026": "11-05", "2027": "11-06", "2028": "11-05"}, zhr: 7, ra_h: 3.47, dec: 15.0, v_kms: 27, r: 2.3, active_from: "09-20", active_to: "11-20", sol: 223, parent: "comet 2P/Encke", note: "Slow, bright meteors from near the ecliptic, so seen from every latitude; it comes with the Northern Taurids from the same comet."}
  - {id: northern-taurids, display: Northern Taurids, peak: "11-12", peaks: {"2026": "11-12", "2027": "11-13", "2028": "11-12"}, zhr: 5, ra_h: 3.87, dec: 22.0, v_kms: 29, r: 2.3, active_from: "10-20", active_to: "12-10", sol: 230, parent: "2004 TG10", note: "Its peak is broad rather than sharp: rates stay near the maximum for roughly ten days in early to mid November."}
  - {id: leonids,       display: Leonids,       peak: "11-17", peaks: {"2026": "11-17", "2027": "11-18", "2028": "11-17"}, zhr: 15,  ra_h: 10.28, dec: 21.0, v_kms: 71, r: 2.5, active_from: "11-06", active_to: "11-30", sol: 235.27, parent: "comet Tempel-Tuttle", note: "Quiet now, but it produces a storm roughly every 33 years."}
  - {id: geminids,      display: Geminids,      peak: "12-14", peaks: {"2026": "12-14", "2027": "12-14", "2028": "12-14"}, zhr: 150, ra_h: 7.47,  dec: 33.0, v_kms: 35, r: 2.6, active_from: "12-04", active_to: "12-20", sol: 262.2, parent: "asteroid 3200 Phaethon", note: "The best of the year, and one of two major showers whose parent is an asteroid rather than a comet; the Quadrantids are the other."}
  - {id: ursids,        display: Ursids,        peak: "12-22", peaks: {"2026": "12-22", "2027": "12-23", "2028": "12-22"}, zhr: 10,  ra_h: 14.60, dec: 76.0, v_kms: 33, r: 2.8, active_from: "12-17", active_to: "12-26", sol: 270.7, parent: "comet Tuttle",       note: "Small, and circumpolar from the north, so the radiant never sets."}
