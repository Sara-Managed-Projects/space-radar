# Galaxy clusters and quasars as the map draws them (internal spec 0076 W4-b, internal #784; scene/deep/galclusters.js).
#
# The hand-kept facts. The members themselves are not here: scripts/build_deep_galclusters.py asks VizieR and the Sloan Digital Sky
# Survey for them (their catalogue tables and columns are named in that script's head), keeps what is said below, and bakes
# site/data/deep/galclusters.{json,bin}. A row here without a `source:` is a rumour, and scripts/check_registry.py refuses it.
#
# clusters:
#   id           the layer's key (one draw call each)
#   name         what a visitor reads
#   aliases      other names a person might type
#   distance     method: `sbf` (surface brightness fluctuations, the cluster's published mean, in Mpc) or `redshift` (the
#                members' mean redshift, carried to a comoving distance by data/cosmology.js, Planck 2018)
#   depth        how deep the members are spread along our line of sight, for the members that have no distance of their own:
#                `measured` (the published rms scatter of the cluster's own SBF distances, Mpc) or `modelled` (the members'
#                spread on the sky, read as the same spread in depth, because a cluster is round: an assumption, said as one)
#   catalogue    where the members came from (a VizieR table, its paper)
#   source       the pages every number above was read from, and the day
# quasars:
#   id           a registry/exotics.yaml row (kind: quasar); its redshift and magnitude are read from there
#   host         the host galaxy the source gives, or `none`: a host is drawn only where a source states its size
version: 1

clusters:
  - id: virgo
    name: Virgo Cluster
    aliases: [Virgo, Virgo Galaxy Cluster]
    distance: {method: sbf, mpc: 16.5, random_mpc: 0.1, systematic_mpc: 1.1}
    depth: {kind: measured, rms_mpc: 0.6}
    catalogue: "The Extended Virgo Cluster Catalog (Kim and others 2014, ApJS 215, 22; VizieR J/ApJS/215/22), members by the infall model; distances of 84 of them from Mei and others 2007, ApJ 655, 144 (VizieR J/ApJ/655/144)"
    source: "Mei and others 2007, ApJ 655, 144 (arXiv astro-ph/0702510): 'The remaining 79 galaxies have a narrow distribution around our adopted mean distance of 16.5+/-0.1 (random mean error) +/-1.1 Mpc (systematic). The rms distance scatter of this sample is 0.6+/-0.1 Mpc' (abstract, read 2026-10-20). Kim and others 2014, ApJS 215, 22 (VizieR, read 2026-10-20)."

  - id: coma
    name: Coma Cluster
    aliases: [Abell 1656, Coma Galaxy Cluster]
    distance: {method: redshift}
    depth: {kind: modelled}
    catalogue: "Spectroscopic redshift survey of the Coma cluster (Kang and others 2025, ApJS 278, 51; VizieR J/ApJS/278/51), the members its own flag names; sizes and colours from the Sloan Digital Sky Survey (DR17)"
    source: "Kang and others 2025, ApJS 278, 51 (VizieR J/ApJS/278/51/table2, read 2026-10-20). SDSS DR17 photometry through SkyServer (https://skyserver.sdss.org/dr17, read 2026-10-20)."

  - id: fornax
    name: Fornax Cluster
    aliases: [Fornax, Fornax Galaxy Cluster]
    distance: {method: sbf, mpc: 20.0, random_mpc: 0.3, systematic_mpc: 1.4}
    depth: {kind: measured, rms_mpc: 0.49}
    catalogue: "Galaxies in the Fornax Cluster (Ferguson 1989, AJ 98, 367; VizieR VII/180), the likely members"
    source: "Blakeslee and others 2009, ApJ 694, 556 (arXiv 0901.1138): 'The resulting Fornax distance modulus is 31.51 +/-0.03 +/-0.15 mag, 20.0 +/-0.3 +/-1.4 Mpc ... The rms distance scatter for the early-type Fornax galaxies is 0.49 Mpc' (abstract, read 2026-10-20). Ferguson 1989 (VizieR VII/180, read 2026-10-20)."

  - id: perseus
    name: Perseus Cluster
    aliases: [Abell 426, Perseus Galaxy Cluster]
    distance: {method: redshift}
    depth: {kind: modelled}
    catalogue: "Galaxies with redshifts in the vicinity of A426 (Kang and others 2024, ApJS 272, 22; VizieR J/ApJS/272/22), the members its own flag names; sizes and colours from the Sloan Digital Sky Survey (DR17)"
    source: "Kang and others 2024, ApJS 272, 22 (VizieR J/ApJS/272/22/table2, read 2026-10-20). SDSS DR17 photometry through SkyServer (https://skyserver.sdss.org/dr17, read 2026-10-20)."

quasars:
  - id: 3c-273
    host:
      morphology: E4
      apparent_size_arcsec: 29
      apparent_mag: 16
      source: "https://en.wikipedia.org/wiki/3C_273 ('a giant elliptical galaxy with an apparent magnitude of 16 and an apparent size of 29 arcseconds', morphology E4 after Bahcall and others 1997, ApJ 479, 642; read 2026-10-20)"
  - id: 3c-279
    host: none
    note: "The source read (https://en.wikipedia.org/wiki/3C_279, 2026-10-20) gives no size for its host galaxy, so none is drawn."

# 0077 W3-f: begin
# A DEEP FIELD (internal #784's last class): the galaxies Webb's JADES survey catalogued in one small patch of sky, each at the
# distance its redshift gives (scripts/build_deep_field.py says what is measured and what is modelled; scene/deep/galclusters.js
# draws it, four slices by redshift, one draw call each).
#   box          the patch on the sky, J2000 degrees: the Hubble Ultra Deep Field's footprint as Rafelski and others 2015 cover it
#   mag_limit    JADES's F200W Kron magnitude, brighter than which a galaxy is drawn
fields:
  - id: hudf
    name: Hubble Ultra Deep Field
    box: {ra_min: 53.11707, ra_max: 53.20799, dec_min: -27.83116, dec_max: -27.75184}
    mag_limit: 28.0
    catalogue: "JADES, the JWST Advanced Deep Extragalactic Survey (Rieke and others 2023, ApJS 269, 16; VizieR V/159: gssample, gskron, gsprism), the GOODS-South galaxies inside the box; stars left out by the MUSE Hubble Ultra Deep Field survey (Bacon and others 2023, A&A 670, A4; VizieR J/A+A/670/A4/dr2-main)"
    source: "VizieR V/159 ReadMe ('These HLSP data products are licensed for use under CC BY 4.0', read 2026-10-20); Rafelski and others 2015, AJ 150, 31 (the footprint: RA 53.117 to 53.208, Dec -27.831 to -27.752, VizieR J/AJ/150/31, read 2026-10-20); Bacon and others 2023, A&A 670, A4 (VizieR, read 2026-10-20)"
# 0077 W3-f: end
