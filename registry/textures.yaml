        bytes: 111648
        format: rgb
        licence: 'Please give credit for this item to: NASA/Goddard Space Flight Center Scientific Visualization Studio. Gaia DR2: ESA/Gaia/DPAC.'
        credit: "Milky Way (4k): NASA/Goddard Space Flight Center Scientific Visualization Studio, Gaia DR2: ESA/Gaia/DPAC"
        source: "https://svs.gsfc.nasa.gov/4851/ (read 2026-09-28)"
        original: "https://svs.gsfc.nasa.gov/vis/a000000/a004800/a004851/milkyway_2020_4k_gal.exr"
        make: "scripts/build-textures.py milky-way: the background map (no Hipparcos or Tycho stars), flipped to the 2k map convention, levels matched to it, WebP 90"

