      - tier: 0
        file: site/textures/2k_earth_nightmap.webp
        px: [2048, 1024]
        bytes: 84590
        format: rgb
        licence: 'CC BY 4.0: "You may use, adapt, and share these textures for any purpose, even commercially."'
        credit: "Planet textures: Solar System Scope (solarsystemscope.com), CC BY 4.0"
        source: "https://www.solarsystemscope.com/textures/ (read 2026-09-28)"
      - tier: -1
        file: site/textures/embed/earth_night.webp
        px: [1024, 512]
        bytes: 10994
        format: rgb
        licence: 'CC BY 4.0: "You may use, adapt, and share these textures for any purpose, even commercially."'
        credit: "Planet textures: Solar System Scope (solarsystemscope.com), CC BY 4.0"
        source: "https://www.solarsystemscope.com/textures/ (read 2026-09-28)"
        make: "the tier-0 file resampled to 1024 x 512 (Lanczos), WebP, 2026-10-07: the light embed's map (js/embedlite.js)"
      - tier: 1
        file: site/textures/4k/earth_night.webp
        px: [4096, 2048]
        bytes: 232346
        format: mono
        licence: 'NASA media guidelines: "generally are not subject to copyright in the United States"'
        credit: "Earth at night (4k): Black Marble 2016, NASA Earth Observatory"
        source: "https://science.nasa.gov/earth/earth-observatory/earth-at-night/maps/ (read 2026-09-28)"
        original: "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144897/BlackMarble_2016_3km_gray.jpg"
        make: "scripts/build-textures.py earth-night: greyscale 13500 to 4096 wide, levels matched to the 2k map by quantile, WebP 80"

  # A real land/water mask for the ocean glint. No tier-0 file: a phone guesses the ocean from the day map's colour (earth.js OCEAN_MASK), as every device did before tiers.
  - id: earth-water
    world: earth
    slot: water
    when: idle
    boot: none
    files:
      - tier: 1
        file: site/textures/4k/earth_water.webp
        px: [4096, 2048]
        bytes: 253660
        format: mono
        licence: 'CC BY 4.0: "You may use, adapt, and share these textures for any purpose, even commercially."'
        credit: "Earth water mask (4k): Solar System Scope (solarsystemscope.com), CC BY 4.0"
        source: "https://www.solarsystemscope.com/textures/ (read 2026-09-28)"
        original: "https://www.solarsystemscope.com/textures/download/8k_earth_specular_map.tif"
        make: "scripts/build-textures.py earth-water: 8192 to 4096 wide by box filter (a coast pixel is the share of it that is water), lossless WebP"

  - id: earth-clouds
    world: earth
    slot: clouds
    when: boot
    files:
      - tier: 0
        file: site/textures/2k_earth_clouds.webp
        px: [2048, 1024]
        bytes: 282674
        format: mono
        make: "Solar System Scope's 2k cloud JPEG (943 kB, in git before #157) as one grey channel, WebP quality 50, PIL method 6, 2026-10-07: 31.9 dB against the JPEG. It was quality 90 and 575 kB, the largest request of a first visit, for a mask that drifts and that the day's live clouds replace seconds later (internal #415 item 2)"
        licence: 'CC BY 4.0: "You may use, adapt, and share these textures for any purpose, even commercially."'
        credit: "Planet textures: Solar System Scope (solarsystemscope.com), CC BY 4.0"
        source: "https://www.solarsystemscope.com/textures/ (read 2026-09-28)"

