  # THE MOONS AND SMALL WORLDS (2026-10-05, issues #387 to #415): one public-domain NASA / USGS map for
  # every world that was a flat colour, one size for every device. `when: boot` here means "nothing
  # sharper to fetch later", NOT "fetched at boot": scene/worlds.js fetches a world's map the first
  # time its disc is big enough to show a surface, or it is selected. registry/models.yaml carries
  # the same file, credit and source under the same id. `coverage` is the share of the sphere the
  # original has data for, measured by the build; the rest of the map is the world's flat colour.
  # Each file is at most 250 kB (tests/test_moon_shapes.mjs). Deimos has no row: no public-domain
  # mosaic of it was found.

  - id: io
    world: io
    slot: map
    when: boot
    coverage: 1.000
    files:
      - tier: 0
        file: site/textures/2k_io_usgs.webp
        px: [2048, 1024]
        bytes: 178088
        format: rgb
        licence: 'Public domain: "USGS-authored or produced data and information are considered to be in the U.S. Public Domain" (usgs.gov, Copyrights and Credits)'
        credit: "Io map: USGS Astrogeology Science Center (Galileo SSI and Voyager), public domain"
        source: "https://planetarymaps.usgs.gov/mosaic/Io_GalileoSSI-Voyager_Global_Mosaic_ClrMerge_1km.lbl (read 2026-10-05)"
        original: "https://planetarymaps.usgs.gov/mosaic/Io_GalileoSSI-Voyager_Global_Mosaic_ClrMerge_1km.tif"
        make: "scripts/build-textures.py moon-io: USGS colour merge, 1 km to 2048 wide, colour kept, mean taken to the flat colour's luminance by a gain 1.69, WebP 82"

