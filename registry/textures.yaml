version: 1
# Every map the scene can wear, with a file per device tier (2026-09-28). The browser reads the mirror,
# site/js/data/textures.js, written by scripts/gen_textures_js.py (`--check` in CI). The tier is
# chosen by site/js/scene/quality.js chooseTier(); site/js/scene/texturetiers.js fetches the file for
# it after the first frame, when the browser is idle, and swaps it in once it has decoded.
#
#   T0  phones, data-saver, small GPUs: the tier-0 file of every row, which is exactly the set every
#       visitor booted with before tiers existed. A first visit is gated at 2.5 MB with ~140 KB spare,
#       so tier 0 is never changed by a tier PR; a sharper file is a new row entry under a new name.
#   -1  the light embed (js/embedlite.js, internal #396): a 1024 x 512 copy of the tier-0 file for the
#       three maps a 600 x 400 frame of the Moon or a station shows. No device tier wears it
#       (texturetiers.js variantFor picks the highest tier at or below the device's, which is never
#       under 0); the embed asks for it by name.
#   T1  laptops and tablets: tier-1 files. T2 wears tier-1 files too until 8k ships as KTX2 (the
#       study's arithmetic: an 8k RGBA map with mipmaps is ~171 MB of GPU memory on its own).
#
# scripts/check_registry.py check_textures() refuses a row without licence, credit or source, a file
# that is not in the tree, bytes or pixels that are not the file's own, a tier-0 file that is not the
# one registry/models.yaml credits under the same id, a credit CREDITS.md section 2 does not carry
# word for word, a file under site/textures/ that no row names, and any map by an author whose terms
# forbid hosting copies (the list is in check_textures).
#
#   id        registry/models.yaml's texture id where there is one (worlds.yaml dresses worlds by it)
#   world     a worlds.yaml id, or `sky` for the Milky Way
#   slot      what it is on that world: day | night | water | clouds | map | ring | surface | relief
#   when      boot  -- nothing sharper; the tier-0 file is all there is
#             idle  -- on screen from the first frame: fetched after it, when the browser is idle
#             near  -- fetched when the world's disc is big enough for 4k to show, or it is selected
#             asked -- a second face of a world (slot `surface`), fetched when its card asks for it
#   boot      `none` when a phone does without the map altogether (the Earth's water mask)
#   files     one per tier:
#     tier      0 | 1 | 2
#     file      the repository path; `{mm}` and `monthly: true` for one file per month (01..12)
#     px        [width, height], read from the file's header by the check
#     bytes     measured; twelve integers, January first, for a monthly file
#     format    rgb | rgba | mono (one grey channel, uploaded as R8: a quarter of RGBA's GPU memory)
#     licence   quoted from the page it was read on
#     credit    the line printed in the Sources panel and carried by CREDITS.md section 2
#     source    the page, with the day it was read: "URL (read YYYY-MM-DD)"
#     original  tier 1+: the file downloaded (never committed); scripts/build-textures.py remakes
#               every tier-1 file from these with `--originals DIR`
#     make      tier 1+: what the build did to it
#
# THE GIANTS' SECOND FACE (2026-10-07): Jupiter, Saturn, Uranus and Neptune keep the Solar System Scope
# maps as the face they are met with, and each has a row `<id>-hubble` (slot `surface`, `when: asked`):
# Hubble's OPAL map of 2025, built from the calibrated FITS files (scripts/build-textures.py GIANTS
# says how), fetched when a visitor presses "As Hubble saw it" on the card (scene/worlds.js setFace)
# and never before. Hubble's maps are honest and plain -- Saturn's bands are faint, Uranus and Neptune
# nearly featureless -- which is why they are the second face and not the first. The share of the
# sphere Hubble saw is in each row's `make:` and in the card's note, not in `coverage:`.
#
# NOT HERE, AND WHY. Saturn, Uranus, Neptune, Venus and the Sun keep their 2k maps: the larger Solar
# System Scope maps of them carry no detail the 2k ones lack (Saturn's "8k" is 4096 wide and differs
# from its own 2k upsample by 0.57 grey levels RMS, measured 2026-09-28). The Moon's NASA SVS CGI Moon
# Kit map is a flat albedo map: it wants the LOLA normal map beside it, which belongs with the
# physical-lighting PR, and without it the Moon would lose the relief the 2k map carries. USGS's
# Viking Mars mosaic is 12 GB at its one published resolution. Bjorn Jonsson's and Steve Albers'
# maps are the best of several worlds and their terms forbid hosting them; they are refused by name.
textures:
  # The id is models.yaml's: registry/worlds.yaml dresses the Earth in `earth-realistic`.
  - id: earth-realistic
    world: earth
    slot: day
    when: idle
    files:
      - tier: 0
        file: site/textures/2k_earth_daymap.webp
        px: [2048, 1024]
        bytes: 148312
        format: rgb
        licence: 'CC BY 4.0: "You may use, adapt, and share these textures for any purpose, even commercially."'
        credit: "Planet textures: Solar System Scope (solarsystemscope.com), CC BY 4.0"
        source: "https://www.solarsystemscope.com/textures/ (read 2026-09-28)"
        make: "the publisher's 2k JPEG (463087 B) re-encoded as WebP, same 2048 x 1024 pixels, at quality 84: the lowest whose luma SSIM against the JPEG is at least 0.98 (0.9811); scripts/build-textures.py --webp-2k, 2026-10-08 (spec 0056 req 8). The licence line was read again on the publisher's page that day"
      - tier: -1
        file: site/textures/embed/earth_day.webp
        px: [1024, 512]
        bytes: 47682
        format: rgb
        licence: 'CC BY 4.0: "You may use, adapt, and share these textures for any purpose, even commercially."'
        credit: "Planet textures: Solar System Scope (solarsystemscope.com), CC BY 4.0"
        source: "https://www.solarsystemscope.com/textures/ (read 2026-09-28)"
        make: "the tier-0 file resampled to 1024 x 512 (Lanczos), WebP, 2026-10-07: the light embed's map (js/embedlite.js)"
      - tier: 1
        file: site/textures/4k/earth_day_{mm}.webp
        monthly: true
        px: [4096, 2048]
        bytes: [587366, 589298, 584612, 575956, 573982, 585684, 577510, 571606, 586856, 580030, 585554, 587964]
        format: rgb
        licence: 'Please credit "NASA Earth Observatory." (Blue Marble: Next Generation page)'
        credit: "Earth by day (4k): Blue Marble Next Generation, NASA Earth Observatory"
        source: "https://science.nasa.gov/earth/earth-observatory/blue-marble-next-generation/base-map/ (read 2026-09-28)"
        original: "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/{month}/world.2004{mm}.3x5400x2700.jpg"
        make: "scripts/build-textures.py earth-day: 5400 to 4096 wide, graded to the 2k map by a 32-cube table per surface, WebP 86"

  - id: earth-night
    world: earth
    slot: night
    when: idle
