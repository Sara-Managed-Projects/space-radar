        original: "https://planetarymaps.usgs.gov/mosaic/Mercury_MESSENGER_MDIS_Basemap_MD3Color_Mosaic_Global_665m.tif"
        make: "scripts/build-textures.py mercury: USGS's MESSENGER three-colour mosaic (1000, 750 and 430 nm as red, green and blue), 23040 px to 4096 wide in linear light, the 0.1 % with no data filled from its edges, 35 % of the saturation kept, mean taken to the luminance of the planet's plain colour by a gain 1.47, then to 2048 wide (Lanczos), WebP 78"
