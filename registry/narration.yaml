version: 1
# Spec 0069: the voice that reads a trip's stops. Ivan, 2026-10-02: "Speech for trips (like in
# planetarium we want to have a nice speech for tour where each step will be speeches, we will need
# the best free speech generator, we will regenerate all speeches and download them)."
#
# THE VOICE IS SYNTHETIC AND THE APP SAYS SO (the Voice control's tooltip, the Sources panel,
# CREDITS.md section 9b). It is made offline by scripts/narrate.py and shipped as files; nothing is
# synthesised on a visitor's device, and nothing under site/audio/ is fetched before they turn
# sound on (spec 0035 req 1, tests/test_first_visit_bytes.mjs).
#
# THE CHOICE (2026-10-03), BY LICENCE FIRST, as the spec orders:
#   Kokoro-82M   Apache-2.0 weights and voices (hexgrad/Kokoro-82M). Runs on a CPU: about real time
#                on this x86_64 Mac through ONNX Runtime. TAKEN.
#   Piper        MIT code, but each voice has its own licence and several English ones are trained
#                on data that forbids commercial use. The fallback had Kokoro not run; not needed.
#   Parler-TTS   Apache-2.0, describable voices; a 2 GB model that wants a GPU. Not tried.
#   XTTS-v2, F5-TTS   refused: Coqui Public Model Licence and CC BY-NC, both non-commercial.
#
# THE VOICE: `af_heart`, American English, since 2026-10-12. Ivan: "I want you to rewrite all
# audios smartly with kokoro voice af_heart. Smartly means it should NOT be just a monotonic voice,
# it should sound really good, as a person doing a trip." It is the voice the model's makers grade
# highest (A; VOICES.md in the model's repository, read 2026-10-12: no licence of its own, so the
# model's Apache-2.0). Until then it was `bf_emma`, British, at 0.8 of its speed. The cards are
# still spelt the British way ("kilometres", "the centre") and the captions show them so; the
# voice says the same words with its own accent, and the lexicon below is in American phonemes.
#
# WHY THE FIRST 205 CLIPS SOUNDED READ OUT, MEASURED (2026-10-12, all 205 clips, a pitch tracker by
# autocorrelation; the tools are kept outside the repository). Each long sentence was synthesised
# on its own, slowed to 0.8, and joined with fixed pauses. So every sentence began on the same
# note and fell to the same note: inside a clip the pitch a sentence STARTS at differed from
# sentence to sentence by 0.4 of a semitone (standard deviation, mean over the clips) and the
# pitch it ENDS at by 0.5; a clip's whole pitch range was 6.9 semitones; and every pause between
# two sentences was 0.45 s, to the sample. That is a list being read.
#
# THE DELIVERY NOW (`timing.join.sentences`, `timing.vary`, `voice.pace`, `phrasing`):
#   - a stop is said two or three sentences in one pass, so the voice carries its pitch and pace
#     across the full stops as it does in a paragraph; the pass is cut at the model's own pauses
#     (narrate.py find_cuts), so the caption times are still sample counts;
#   - at 0.91 to 0.95 of the voice's speed, not 0.8 (`voice.pace` below says which): 171 words
#     a minute with the pauses, where the old clips were 154;
#   - the pause after a sentence follows what was said (longer after a long sentence and before
#     the closing one, shorter after "Nobody rode it.") and is then moved by a seeded amount, so
#     no two are alike and a render is still reproducible;
#   - a comma or a dash for the voice only, in two places where a number or a turn should
#     land (`phrasing`); three more were tried and the voice ignored them.
# Measured the same way on the same 205 stops: sentence starts now differ by 1.2 semitones and
# ends by 1.2, a clip's pitch range went from 6.9 to 9.3 semitones, the pauses between sentences
# run from 0.28 to 0.74 s (they were all 0.45), 65.8 minutes became 59.4, and the recogniser's
# word error is 0.5 % (it was 0.4 %). Most of the wider range is the voice itself (it measured
# 9.5 even said a sentence at a time); what the paragraph adds is that sentences stop starting
# alike: 141 of the old clips had starts within half a semitone of each other, 36 of these do.
# NOT ACHIEVED: the one question in the trips, "Are we safe?", still does not rise. Its last
# third of a second falls by 2.6 semitones (4.7 in the old voice); the model does not lift it.
# A MACHINE CHOSE THIS: four settings were rendered beside the live clips on five stops
# (~/space-radar-handoff/narration-heart/audition/, README there) and the numbers picked.
# Numbers do not hear warmth. NO PERSON HAS HEARD IT YET; Ivan's ears have the last word.
# Nothing was added that is not the text: no music, no breaths, no hesitation, no second voice.
#
#   engine.id      part of every clip's hash. Change it when the model, the G2P or anything else
#                  that changes how a word is said changes, and every clip is stale until rendered.
#   packages       the versions the render ran with; narrate.py refuses to render with others.
#   voice.pace     close: a factor on `speed` for a stop's LAST pass, so the ending is not
#                  hurried. A stop of three sentences or fewer is one pass, which is then all at
#                  0.95 x 0.96 = 0.91; only the opening pass of a longer stop is at 0.95. The
#                  model takes one speed for a whole pass, so a title cannot be said slower than
#                  the sentence it shares its pass with: it is given a long pause after it
#                  instead (timing.title_gap_s).
#   timing         the pauses narrate.py puts between the sentences.
#     vary         how a pause follows what was just said; narrate.py gaps_for() explains each.
#                  `jitter` 0.12 moves every pause by up to 12 % either way, by a number drawn
#                  from the stop's name: the same stop always gets the same pauses.
#     join         internal #441: a short sentence said alone gains a vowel at each end ("Venus."
#                  was heard as "a Venusa"), so a title, and any sentence of `words` words or
#                  fewer, is said in ONE pass with its neighbour and the pass is cut at the model's
#                  own pause. `words` is 0, the titles only: "Nobody can.", "You cannot see it."
#                  and six more short sentences of the bodies were said alone and heard right. `joiners` are tried in order between the two sentences until the
#                  pause is at least `min_pause_s` (a dash lengthens it); the pause is looked for
#                  between `window` x the short sentence's length when said alone, as the longest
#                  run under `quiet` (of full scale). A pass over `max_chars` is not made.
#                  Since 2026-10-12: `sentences` 3 fills a pass with up to three sentences,
#                  short or not (1 was a long sentence alone, the read-out delivery above). The
#                  plain joiner is tried first, so the full stops are said as the voice says
#                  them; the dash only where a pause could not be found. The full stops inside
#                  a pass are found by find_cuts(): each quiet run scores its length less
#                  `drift` seconds for every second of speech between it and where the
#                  sentence was expected to end (by its share of the pass's phonemes), within
#                  `reach` of the sentence's length and at least `reach_s`.
#   encode         -16 LUFS is the level spoken word is mastered to for the web (the beds are at
#                  -23 and duck a further 10 dB under the voice, audio/narration.js); peak_dbfs is
#                  where narrate.py's limiter holds the few tall peaks a synthetic voice has. Opus
#                  32 kbps mono; the AAC twin at the model's own 24 kHz for a Safari without Opus.
#   checks         what --check and the render refuse: a clip outside these words a minute is
#                  silence or was cut short.
#                  The top was 200 until 2026-10-12: five clips made of short words ("And this
#                  is where all of it came from.") are now 200 to 211, said whole; a clip that
#                  lost a sentence would be far over 220.
#   lexicon        word -> phonemes, in the model's own alphabet (misaki's: A = "ay", I = "eye",
#                  W = "ow", Y = "oy", O = American "oh", T = the American flapped t, ʧ = "ch",
#                  ʤ = "j"). American since 2026-10-12, as the voice is. ONLY the names the G2P
#                  gets wrong; checked and left alone because it says them right: Io, Uranus,
#                  Europa, Ganymede, Charon, Sedna, Triton, Titan, Pleiades, Sirius, Andromeda,
#                  Cassini, TRAPPIST, Vikram, Gaia, JUICE, Cernan, Aldrin, NASA's.
#   phrasing       trip/stop -> [[the card's words, the same words punctuated for the voice]].
#                  A comma or a dash the voice is given and the caption is not: a pause before a
#                  number that should land. NEVER a different word: narrate.py refuses a pair
#                  whose letters differ, and one that moves a full stop. Two, on purpose: the
#                  cards are already punctuated for the ear, the voice obeys such a mark only
#                  sometimes (see at `phrasing:` below), and nobody has heard these yet.
#   skip_title     stops whose body repeats the title almost word for word: the voice starts at
#                  the body. Every other stop is read as its card is: title, then body.
#   say            trip/stop -> words for the ear, replacing the card's (title and body) for the
#                  voice only (spec 0069 task 2, internal #259). One so far, and not for style: that
#                  card prints the catalogue's own count ("{exoplanet_count}", filled by
#                  gen_tours_js.py), which changes whenever the catalogue is refreshed. A clip that
#                  said the number would go stale, and fail CI, on a data refresh nobody connected
#                  with the voice; so the voice rounds it. Every other card is read as written.
#   listen         internal #326: every clip is put through a speech recogniser by
#                  scripts/listen_check.py (faster-whisper, MIT, with Whisper's `small.en` weights,
#                  MIT), and each row below records what came back: `wer` the word error against
#                  the script, `heard` a hash of the transcript, `voice` the findings blamed on the
#                  voice and not the recogniser. A row without them is a clip nothing has listened
#                  to, and --check refuses it.
#                  required  when true, a clip with no record is refused; when false only a
#                            clip that WAS heard and is over the line is.
#                  max_wer   the line; over it a clip is fixed or accepted below.
#                  names     proper nouns the recogniser cannot be expected to spell, beyond the
#                            lexicon and the words the trips only ever write with a capital.
#                  accept    trip/stop -> why a clip over the line, or with a voice finding, ships.
#                  A machine heard them; a person has still not (internal #325).
engine:
  id: "kokoro-82m-v1.0/onnx-fp32/misaki-0.9.4/passes-2"
  name: "Kokoro-82M"
  licence: "Apache-2.0"
  source: "https://huggingface.co/hexgrad/Kokoro-82M (read 2026-10-03; VOICES.md read 2026-10-12)"
  model:
    file: kokoro-v1.0.onnx
    url: "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
    sha256: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
  voices:
    file: voices-v1.0.bin
    url: "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
    sha256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
  packages: {kokoro-onnx: "0.6.1", misaki: "0.9.4", onnxruntime: "1.23.2"}
voice:
  id: af_heart
  lang: en-us
  speed: 0.95
  pace: {close: 0.96}
  credit: "Narration: a synthetic voice, Kokoro-82M (af_heart), Apache-2.0"
timing:
  lead_s: 0.15
  title_gap_s: 0.72
  gap_s: 0.4
  tail_s: 0.3
  vary: {per_word_s: 0.006, max_extra_s: 0.14, short_words: 5, short: 0.8, before_last_s: 0.12, after_question_s: 0.2, jitter: 0.12}
  join: {words: 0, sentences: 3, joiners: [" ", " — "], quiet: 0.01, min_pause_s: 0.08, drift: 0.15, reach_s: 0.9, reach: 0.5, max_chars: 420}
encode: {lufs: -16, peak_dbfs: -1.5, opus_kbps: 32, aac_kbps: 40, aac_rate: 24000}
checks: {wpm: [110, 220], lufs_tolerance: 1.0, mean_db_floor: -40, max_db_floor: -12}
lexicon:
  Tiangong: "tjɛnɡˈʊŋ"
  Shenzhou: "ʃˌɛnʤˈO"
  Queqiao: "ʧwˈɛʧjˌW"
  Chandrayaan: "ʧˌʌndɹəjˈɑn"
  Lunokhod: "lˈunəkˌɑd"
  Beresheet: "bəɹˈɛʃit"
  Huygens: "hˈYɡənz"
  Eris: "ˈɪɹɪs"
  Enceladus: "ɛnsˈɛlədəs"
  # 2026-10-07, internal #441: found by the listening check ("Valles" heard as "Vols",
  # "marsquakes" as "maskwax") and by reading the G2P's phonemes for every name in the trips:
  # it said "vawlz", "MARR-in-er-iss", "mask-wocks", "OO-ut", "kock", "did-IM-oze", "en-VISS-at",
  # "in-SITE". Christina Koch says her name "cook".
  Valles: "vˈælɪs"
  Marineris: "mˌɛɹɪnˈɛɹɪs"
  marsquakes: "mˈɑɹzkwAks"
  Oort: "ˈɔɹt"
  Koch: "kˈʊk"
  Didymos: "dˈɪdɪmOs"
  Envisat: "ˈɛnvɪsæt"
  InSight: "ˈɪnsIt"
  # Heard as "or fucus", "Matt R icky"; and Theia is "THEE-a", which the G2P said "THAY-a".
  Ophiuchus: "ˌOfijˈukəs"
  Matariki: "mˈɑtəɹˌiki"
  Theia: "θˈiə"
  # 2026-10-12, the American G2P, read for every name in the trips: "a-POFF-iz" for Apophis,
  # a doubled r in Subaru, and Yutu with a flapped t ("YOO-doo").
  Apophis: "əpˈɑfɪs"
  Subaru: "sˈubəɹu"
  Yutu: "jˈutu"
  # Heard as "out shawn" (2026-10-12): the American G2P's fallback rhymes it with "on".
  outshone: "ˌWtʃˈOn"
listen:
  # ON since 2026-10-08: all 205 clips were rendered again with the title said in one pass
  # (internal #441) and every one was heard by small.en, the doubtful ones again by medium.en:
  # mean word error 0.4 % (it was 1.6 %), no finding blamed on the voice, nothing to accept.
  # 2026-10-12: all 205 rendered again in `af_heart`, a paragraph at a time, and heard again:
  # small.en over all of them, medium.en again over the ten it doubted. Mean word error 0.5 %
  # (it was 0.4 %), 167 clips with none. Three faults were the voice's and were fixed: a title
  # run into its sentence (join_own), "outshone" (lexicon), a long number broken after its first
  # "and" (narrate.py now groups it with a comma). One finding is accepted below.
  required: true
  model: small.en
  max_wer: 0.1
  # Betelgeuse: an American says "BEE-tl-jooss" and the recogniser writes the film's title.
  names: [Betelgeuse]
  accept:
    black-holes/sun: "small.en and medium.en both write 'if you swap the Sun' for 'if you swapped the Sun': the t of 'swapped' is not released before 'the', as in fluent speech. Every other word is heard. To be judged by a person."
# trip/stop -> a sentence of this many words or fewer is said in one pass with its neighbour, for
# this stop only (timing.join.words is 0: the titles). Found by the listening check: "It will
# miss." said alone was heard as "It will miss us" by both recognisers.
join_short:
  asteroids-that-come-close/apophis: 3
# trip/stop -> join rules of its own (timing.join's names). Found by the listening check on
# 2026-10-12: with a plain space the voice said "TRAPPIST-1 b the innermost," in one breath; with
# the dash it pauses after the title, but for less time than at the comma, and the cut went to
# the comma: the title's caption covered three words of the sentence. `drift` 0.4 looks nearer
# where the title should end.
join_own:
  travel-to-exoplanets/b: {joiners: [" — "], drift: 0.4}
  travel-to-exoplanets/c: {joiners: [" — "]}
# trip/stop -> [[the card's words, the same words with the voice's punctuation]]. The caption
# keeps the card's. Each is a pause before the number or the turn the sentence is there for.
# Measured in the waveform (2026-10-12): each added one pause the sentence did not have, of
# about 0.2 to 0.4 s (before "about 110 km") and 0.25 s (before "and coming our way"). Three
# more were tried and taken out again, because the voice ignored them, dash or comma: "three lunar days / and kept going",
# "on the Moon / for 37 years", "Earth came out / 0.12". Punctuation is a request, not a control.
phrasing:
  moon-landings/chandrayaan-3: [["September 2019 about 110 km", "September 2019, about 110 km"]]
  to-the-edge/andromeda: [["light-years away and coming our way", "light-years away — and coming our way"]]
skip_title:
  - strangest-things/golf-balls
say:
  travel-to-exoplanets/all: "Planets around other stars. More than six thousand planets around other stars, in the copy of NASA's catalogue this map carries, each drawn as a mark at its star. Most were found by the dip in a star's light as a planet crosses in front of it, the rest mostly by the wobble a planet gives its star."
  # Internal #330 and #441: the two clips over 30 s, cut for the ear. Nothing is added; each says
  # less than its card, and the card on screen is unchanged.
  to-the-edge/edge: "As far as this trip goes. Fifty-three million light-years, to the black hole in M87, the first one ever photographed. The map goes further, to a quasar's black hole nearly eleven billion light-years out. It shows more than a hundred thousand stars, and every confirmed planet around another star whose distance is known. The rest is out there. We have not drawn what we cannot place."
  the-constellations/southern-cross: "The Southern Cross. The smallest of the eighty-eight constellations, and the best known south of the equator. Five countries fly it on their flags, Australia and Brazil among them. The nearer of the two bright stars beside it is Alpha Centauri, the closest star system to the Sun. The dark patch at its foot is the head of the Emu that Aboriginal Australians see in the Milky Way."
