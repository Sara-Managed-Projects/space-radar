version: 1
# Spec 0069: the voice that reads a trip's stops. Ivan, 2026-10-02: "Speech for trips (like in
# planetarium we want to have a nice speech for tour where each step will be speeches, we will need
# the best free speech generator, we will regenerate all speeches and download them)."
#
# THE VOICE IS SYNTHETIC AND THE APP SAYS SO (the Voice control's tooltip, the Sources panel,
# CREDITS.md section 9b). It is made offline by scripts/narrate.py and shipped as files; nothing is
# synthesised on a visitor's device, and nothing under site/audio/ is fetched before they turn
# sound on (spec 0035 req 1, tests/test_first_visit_bytes.mjs).
#
# THE CHOICE (2026-10-03), BY LICENCE FIRST, as the spec orders:
#   Kokoro-82M   Apache-2.0 weights and voices (hexgrad/Kokoro-82M). Runs on a CPU: about real time
#                on this x86_64 Mac through ONNX Runtime. TAKEN.
#   Piper        MIT code, but each voice has its own licence and several English ones are trained
#                on data that forbids commercial use. The fallback had Kokoro not run; not needed.
#   Parler-TTS   Apache-2.0, describable voices; a 2 GB model that wants a GPU. Not tried.
#   XTTS-v2, F5-TTS   refused: Coqui Public Model Licence and CC BY-NC, both non-commercial.
#
# THE VOICE: `bf_emma`, British English. The cards are written in British English ("kilometres",
# "a football pitch", "the centre"), and of Kokoro's British voices this is the one its makers grade
# highest (B-, VOICES.md in the model's repository). At 0.8 of its natural speed, about 155 words a
# minute with the pauses: a planetarium is not in a hurry. NOBODY HAS HEARD IT YET. The agent that
# rendered these files cannot listen; it checked what can be measured (loudness, peak, words a minute, that no clip is silent, and the
# phonemes of every name in the lexicon below). The blind listening test of spec 0069 task 1 is
# still owed: `scripts/narrate.py --audition DIR` writes the same three stops in four voices.
#
#   engine.id      part of every clip's hash. Change it when the model, the G2P or anything else
#                  that changes how a word is said changes, and every clip is stale until rendered.
#   packages       the versions the render ran with; narrate.py refuses to render with others.
#   timing         the pauses narrate.py puts between the sentences it synthesises one by one.
#   encode         -16 LUFS is the level spoken word is mastered to for the web (the beds are at
#                  -23 and duck a further 10 dB under the voice, audio/narration.js); peak_dbfs is
#                  where narrate.py's limiter holds the few tall peaks a synthetic voice has. Opus
#                  32 kbps mono; the AAC twin at the model's own 24 kHz for a Safari without Opus.
#   checks         what --check and the render refuse: a clip outside these words a minute is
#                  silence or was cut short.
#   lexicon        word -> phonemes, in the model's own alphabet (misaki's: A = "ay", I = "eye",
#                  W = "ow", Y = "oy", Q = British "oh", ʧ = "ch", ʤ = "j"). ONLY the names the G2P
#                  gets wrong; checked and left alone because it says them right: Io, Uranus,
#                  Europa, Ganymede, Charon, Sedna, Triton, Titan, Pleiades, Sirius, Andromeda,
#                  Cassini, TRAPPIST, Vikram, Yutu, Gaia, JUICE, Cernan, Aldrin, NASA's.
#   skip_title     stops whose body repeats the title almost word for word: the voice starts at
#                  the body. Every other stop is read as its card is: title, then body.
#   say            trip/stop -> words for the ear, replacing the card's (title and body) for the
#                  voice only (spec 0069 task 2, internal #259). One so far, and not for style: that
#                  card prints the catalogue's own count ("{exoplanet_count}", filled by
#                  gen_tours_js.py), which changes whenever the catalogue is refreshed. A clip that
#                  said the number would go stale, and fail CI, on a data refresh nobody connected
#                  with the voice; so the voice rounds it. Every other card is read as written.
engine:
  id: "kokoro-82m-v1.0/onnx-fp32/misaki-0.9.4"
  name: "Kokoro-82M"
  licence: "Apache-2.0"
  source: "https://huggingface.co/hexgrad/Kokoro-82M (read 2026-10-03)"
  model:
    file: kokoro-v1.0.onnx
    url: "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
    sha256: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
  voices:
    file: voices-v1.0.bin
    url: "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
    sha256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
  packages: {kokoro-onnx: "0.6.1", misaki: "0.9.4", onnxruntime: "1.23.2"}
voice:
  id: bf_emma
  lang: en-gb
  speed: 0.8
  credit: "Narration: a synthetic voice, Kokoro-82M (bf_emma), Apache-2.0"
timing: {lead_s: 0.15, title_gap_s: 0.7, gap_s: 0.45, tail_s: 0.25}
encode: {lufs: -16, peak_dbfs: -1.5, opus_kbps: 32, aac_kbps: 40, aac_rate: 24000}
checks: {wpm: [110, 200], lufs_tolerance: 1.0, mean_db_floor: -40, max_db_floor: -12}
lexicon:
  Tiangong: "tjɛnɡˈʊŋ"
  Shenzhou: "ʃˌɛnʤˈQ"
  Queqiao: "ʧwˈɛʧjˌW"
  Chandrayaan: "ʧˌʌndɹəjˈɑːn"
  Lunokhod: "lˈuːnəkˌɒd"
  Beresheet: "bəɹˈɛʃiːt"
  Huygens: "hˈYɡənz"
  Eris: "ˈɪəɹɪs"
  Enceladus: "ɛnsˈɛlədəs"
skip_title:
  - strangest-things/golf-balls
say:
  travel-to-exoplanets/all: "Planets around other stars. More than six thousand planets around other stars, in the copy of NASA's catalogue this map carries, each drawn as a mark at its star. Most were found by the dip in a star's light as a planet crosses in front of it, the rest mostly by the wobble a planet gives its star."
