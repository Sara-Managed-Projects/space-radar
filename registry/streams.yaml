look:
  # display values, illustrative: nothing here is measured
  line_alpha: 0.9
  ribbon_points: 1400
  ribbon_width_kly: {sagittarius: 2.5, orphan-chenab: 1.2, gd-1: 0.25, palomar-5: 0.15}
  fade_from_kly: 15      # drawn with the camera farther than this from the Sun, whole by 40
  fade_to_kly: 40
drawn: [model]
review:
  data_vs_model: "Measured: where each stream lies on the sky, and its distance for Sagittarius, Orphan-Chenab and Palomar 5. Assumed by the library: GD-1's distance gradient. Illustrative: the line and ribbon, their widths and colours."
  by: Space Radar maintainers
  date: 2026-11-17
  astronomer: "not yet; the card says so"
