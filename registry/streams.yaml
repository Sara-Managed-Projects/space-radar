    colour: [1.0, 0.72, 0.3]
    source: "sky and proper-motion track: Antoja et al. 2020, A&A 635, L3 (arXiv:2001.10012); distance track: Ramos et al. 2020, A&A 640, C5 (corrigendum; RR Lyrae 'Strip' sample); both as the library's track note says, read 2026-11-17"
    dwarf: "the Sagittarius dwarf, the stream's source: Galactic l 5.6, b -14.2 deg, 26.0 kpc (McConnachie 2012, as the library's lib/mw_satellites_2018.csv lists it, read 2026-11-17)"
