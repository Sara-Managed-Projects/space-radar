# Stellar streams round the Milky Way (internal #420, the deep-space review of 2026-11-16, idea 2): four tracks of the
# galstreams library, drawn by site/js/scene/deep/streams.js (a deep layer, scene/deep/heroes.js DEEP_LAYERS) from the
# points scripts/build_deep_streams.py bakes into site/data/deep/streams.json. The track files are not in git.
#
# THE LIBRARY. galstreams (Mateu 2023, MNRAS 520, 5225, arXiv:2204.10326, doi 10.1093/mnras/stad321), https://github.com/cmateu/galstreams,
# BSD 3-Clause licence (LICENSE read 2026-11-17: "Copyright (c) 2017, Cecilia Mateu", redistribution with the notice allowed,
# the name of the holder not to endorse). Read at commit 6a304c05bea7f774390a11082ea127719e99b70a (committed 2026-06-03).
# Each file is a table of points along one stream: sky position (ICRS ra, dec) and distance from the Sun, with proper motions.
#
# WHAT IS MEASURED AND WHAT IS NOT. The tracks are fits through the stream's member stars, so WHERE each stream lies on the
# sky is measured. The distance along each is measured for Sagittarius (Gaia DR2 RR Lyrae: Ramos et al. 2020), Orphan-Chenab
# (knots of Table C2, Koposov et al. 2019) and Palomar 5 (RR Lyrae, a polynomial: Price-Whelan et al. 2019); for GD-1 it is
# NOT measured star by star: the library adopts the gradient d = 0.05 phi1 + 10 kpc that Price-Whelan & Bonaca 2018
# propose (the library's own track note, read 2026-11-17). Drawn here and illustrative: the line's width and brightness, the
# colours, the ribbon of points about each track (a few times the width the summary table gives where there is one).
# Not drawn: the stars themselves, the streams' ends beyond the tracks, the Sagittarius stream's second wrap (the library
# has one track; the N-body particles of Vasiliev, Belokurov & Erkal 2021 are not used).
id: streams
frame: "heliocentric: the track's (ra, dec, distance) as measured from the Sun, turned into the scene's axes (ecliptic J2000, sun-inertial) in kly; no Galactic model, no Sun position is assumed"
file: site/data/deep/streams.json
made_by: scripts/build_deep_streams.py
library:
  name: galstreams
  paper: "Mateu, C. 2023, galstreams: A library of Milky Way stellar stream footprints and tracks, MNRAS 520, 5225 (arXiv:2204.10326, doi:10.1093/mnras/stad321)"
  repository: https://github.com/cmateu/galstreams
  commit: 6a304c05bea7f774390a11082ea127719e99b70a
  licence: "BSD 3-Clause (https://github.com/cmateu/galstreams/blob/master/LICENSE, read 2026-11-17)"
  read: 2026-11-17
  kpc_ly: 3261.5637769   # light-years in a kiloparsec (IAU 2015 B2 parsec)
  step_note: "every step-th row of the file, the last row always, rounded to 0.001 kly"
streams:
