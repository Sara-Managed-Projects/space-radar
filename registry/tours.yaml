# A TRIP is a chain of shots the camera flies, one card per stop. Adding a trip is a ROW here
# plus a row per stop, and nothing under site/js/. The browser cannot parse YAML, so
# scripts/gen_tours_js.py mirrors this into site/js/data/tours.js and CI refuses a stale mirror --
# the same arrangement registry/rockets.yaml and registry/oddities.yaml have, for the same reason.
#
# A TRIP MAY NOT PROMISE A STOP IT WILL NOT DELIVER. That is the one rule, and every refusal in
# scripts/check_registry.py is it in different clothes. A stop that cannot resolve is dropped
# BEFORE the count is shown, so "5 stops, about two minutes" is a true sentence rather than a
# hope; and a stop that could never resolve -- a target nobody can place, or a thing that is not
# a record at all -- is refused here, at the point somebody writes it, rather than found as a
# stop that quietly is not there.
#
# ---------------------------------------------------------------------------------------------
# HOW A STOP NAMES ITS TARGET. Exactly one key, out of five:
#
#     target: {record: tesla-roadster}                 a record id, in any layer
#     target: {layer: stations, catalog: "25544"}      a NORAD number within a layer
#     target: {layer: stations, query: {name_contains: TIANGONG}, pick: first}
#     target: {world: earth}                           a registry/worlds.yaml row
#     target: {site: apollo-11}                        a registry/sites.yaml row
#     target: {observer: true}                         the visitor's own place (spec 0038)
#
# The visitor's place is the one they set under Where you are, or the guess from their clock the
# Now moment makes (sky/guessplace.js), read when the trip is planned and at the stop and never
# written anywhere. A trip with such a stop says `requires_observer: true`, so the picker can
# grey it with "Needs a place" when there is neither; it is refused without it. The camera may not
# come closer than scene/camera.js WORLD_CLEARANCE allows (127 km above the Earth, and more once
# the camera looks down at an angle), so `distance_km` under 160 is refused on such a stop; and
# the card may not name a city, because the place is generated and differs for every visitor.
#
# Zero keys or two keys is refused. Ambiguity is the failure mode: a row with both `record:` and
# `layer:` resolves to SOMETHING PLAUSIBLE, which is exactly what this file's validator exists to
# prevent.
#
# `group:` (frame several objects at once) and `view:` (a non-camera stop, such as "the next time
# it crosses your sky") are DESIGNED AND NOT SHIPPED. Between them they served two stops of the
# five in the design, and neither trip below needs one. They arrive with the trip that needs them.
#
# ---------------------------------------------------------------------------------------------
# THERE IS NO STOP-LEVEL `class:`, AND THAT IS ON PURPOSE. The design this file implements gave
# each stop `class: measured | inferred | illustrative | sample`, hand-authored. A hand-authored
# class can only ever do one of two things: repeat what the record already knows, or contradict
# it. A stop could be written `measured` about a record the registry classes `inferred` and the
# validator would have passed it -- a field whose only power is to state a falsehood the app
# already knows better than. The card prints the RECORD's own `cls`, as it already does for every
# other card in the app. `class:` anywhere in this file is refused, with that reason.
#
# ---------------------------------------------------------------------------------------------
# THE FIELDS
#
#   id            unique here, AND not equal to any registry/layers.yaml id. `oddities` is a
#                 layer; the trip that visits it is `strangest-things`. Two registries sharing a
#                 word is how a cross-reference by bare id ends up resolving to the wrong thing.
#   title         what a visitor reads on the row and on the intro card. <= 60 characters.
#   blurb         one sentence under the title. The LENGTH is not written here: the generator
#                 computes it from the flights and the dwells, so the number a visitor is
#                 promised and the number the browser runs are the same number.
#   pacing        `auto` plays; `reader` waits for Next. prefers-reduced-motion FORCES reader.
#   requires      layer ids that must be enabled AND loaded before the trip is offered.
#   min_stops     below this the trip is offered GREYED WITH ITS REASON, never hidden: a missing
#                 feature and a broken one look identical when you hide one. Floor of 3 -- below
#                 three stops it is a link, not a trip.
#   stage         the world, or the rung of the ladder, the map is centred on for the trip, and so
#                 what one scene unit is: `earth` by default, any registry/worlds.yaml or
#                 registry/stages.yaml id. This was `earth` only until spec 0028 step 8 taught the
#                 trip to save the stage on begin, switch with ctx.setStage, and put it back on
#                 leave (ui/trip.js), and the rig is re-taught its world at every stop. Leaving a
#                 trip on another stage is the one leave that moves the camera -- it goes back to
#                 the stage it came from -- so such a trip's blurb says so. Every stop is flown on
#                 this stage unless it names its own, below.
#   clock         as-found | live | freeze. `freeze` pauses time, which flips the clock from live
#                 to scrub, which drops glyph re-propagation from every 100 ms to EVERY FRAME
#                 (main.js) -- so a trip that freezes may not require the `active` layer, which
#                 is eleven thousand objects. The validator enforces exactly that.
#   group         which `groups:` row (below) the picker lists the trip under. REQUIRED, and it
#                 must name a row: a trip with no group has nowhere to be drawn, and the panel
#                 lists every trip (spec 0029). Written on the trip and not derived from its
#                 stage, because the Moon trip is "around the Solar System" and the stations trip
#                 is "around the Earth" for reasons a stage id does not carry.
#   requires_observer  true when a stop is `target: {observer: true}`: the trip starts from the
#                 visitor's own place and is greyed with "Needs a place" when there is none.
#   next          the trip the end card offers first, by id, still only if it can run that day
#                 (ui/tripframe.js asks plan() before it appends the button). Optional: without
#                 it the end card offers the next trip in this file's order, wrapping round. May
#                 not name a trip that is not here, nor the trip itself.
#   og_stop       which stop the trip's preview picture (site/og/<id>.png, spec 0033) is taken
#                 at, 1-based like the link's `stop=`. Optional: without it, the first. Added
#                 2026-09-23 because a first stop is chosen to START a trip, not to sell it: "To
#                 the edge" opens on the Sun from a light-year, which as a 1200 x 630 picture is a
#                 field of star-ladder dots. scripts/shots.mjs reads it; check_registry.py refuses
#                 a number that is not one of the trip's stops.
#   hides         layer ids switched OFF while the trip runs and back on when it is left, for a
#                 trip whose picture their marks would litter. Refused when the trip also needs
#                 the layer on.
#   orbits        planets (worlds.yaml rows that go round the Sun) whose paths, and a dot at each
#                 one's true place, are drawn while the trip runs on the Sun stage
#                 (scene/orbitrings.js). The dot is the one exaggeration, size only, and the frame
#                 prints that it is "drawn larger than it is" on every stop (ui/tripframe.js
#                 orbitsLine). Refused unless the trip's stage is `sun`, the one stage it draws on.
#
# PER STOP
#   id            unique within its trip.
#   target        above.
#   needs_layer   this stop's own layer requirement, when it differs from the trip's. The trip
#                 switches it on for the duration and switches it back on the way out.
#   stage         this stop's own centre for the map, when it differs from the trip's. IT IS A
#                 TRUTH SETTING, not a camera one. A world is drawn where it really is only from
#                 its own stage, from the stage of the planet it goes round, and from the stages
#                 that squeeze nothing (the Sun's, and the ladder's rungs). From everywhere else
#                 scene/worlds.js draws it nearer and larger, and its moons around the enlarged
#                 disc -- so a stop that flew to where Titan really is, from Earth's stage, would
#                 arrive 1.4 billion km from the Titan on the screen. check_registry.py refuses
#                 that pairing by name. Changing stage between two stops is a CUT: the stop being
#                 left is drawn squeezed from the new stage, so there is nothing to fly away from.
#                 Onto a stage that squeezes nothing the camera keeps its place in kilometres
#                 instead, which is why Pluto to Eris below is one move and not a jump to the Sun.
#   behind        a world (worlds.yaml) the shot keeps in the picture behind its subject. The
#                 camera's direction is otherwise chosen by the key light, which knows about the
#                 Sun and nothing else: measured in a browser, the first stop of the trip below
#                 came out with Io alone in the dark and Jupiter's disc 198 px above the top of the
#                 frame, under a card that opens "Io goes round Jupiter every 42 hours". The
#                 key-light search is narrowed to the directions that hold this world within 22
#                 degrees of the middle, and falls back to the best-lit direction when none does,
#                 so it narrows the choice and never empties it. The world named must be drawn true
#                 from the stop's stage, and check_registry.py refuses it when it is not.
#   distance_km   how far the camera sits from the subject. It does NOT change how big the
#                 subject looks: scene/heroes.js draws every model at a constant ANGULAR size, so
#                 this number decides how much WORLD is in frame behind it, and nothing else.
#   frame_radii   the same thing said in radii, for a `world:` target, which is the only target
#                 that has a radius. Celestia's `goto` default is 5.0 and it is a good one.
#                 Refused below 1.02, which is inside the camera's own world-clearance floor:
#                 the rig would push the camera back out and the framing would be silently
#                 ignored.
#   drift_deg     ONE arc, never a lap. A lap slow enough to read is sixty seconds, at which
#                 point the turn has stopped being a camera move and become a wait. Refused if it
#                 cannot finish inside its own dwell with the 0.4 s lead and the 1.5 s tail --
#                 which caps it by what the shot can hold rather than at an arbitrary number.
#   on_unresolved `drop` (default) removes the stop before the count is shown. `hold` keeps it,
#                 flies to the parent world instead, shows the honest failure, and NEVER
#                 auto-advances: a failure that scrolls past is a failure nobody can report.
#                 `fallback` is designed and not shipped -- the one stop that needed it was the
#                 `view:` stop, which is not shipped either.
#   time          the instant this stop is shown at (spec 0030): an ISO 8601 UTC instant, `now`, or
#                 `{event: <events.yaml id>.next, offset_s: <int>}`, the first such event after the
#                 visitor's clock. ui/trip.js moves the clock there BEFORE the shot is composed, so
#                 the key light and the arrival are this instant's, and the frame prints a "Shown
#                 at" line built from the clock -- which is why the card under a timed stop may not
#                 state a time itself. An event reference is resolved by spec 0031's
#                 data/events.js nextEvent(), 400 days ahead; one it cannot find follows
#                 `on_unresolved` like a lost target, and the count on the intro card is taken after.
#                 An eclipse may add `kind:` (spec 0037): `total | annular | partial | hybrid` for
#                 `solar-eclipse`, `total | partial | penumbral` for `lunar-eclipse`, looked for
#                 1 200 days ahead. Every reference counts from the clock the visitor had when the
#                 trip began, not from where an earlier stop has run it to.
#   rate          how fast the clock runs while the stop is up: 60 at most on an Earth-orbit
#                 target, 36 000 on anything else, and up to 1 000 000 only on the Sun's stage or
#                 a rung, where a world's own motion is the picture. Once a stop has touched the
#                 clock the trip owns it until leave: a later stop without `rate:` runs at 1, one
#                 without `time:` carries on from wherever the clock got to, and leaving puts the
#                 visitor's instant, rate and pause back. `rate: 0` is refused (a still frame
#                 under a card is a slide); a trip that must be still writes `clock: freeze`.
#   card.title    <= 60 characters.
#   card.body     the words. The first sentence is capped at 160 characters, which is the cap
#                 site/js/ui/cards.js already measures; capping it where it is WRITTEN is what
#                 stops a card saying half of something. The dwell is computed from the word
#                 count and never from the flight duration, so nothing about the camera can
#                 quietly shorten a reader's time.
version: 1

# THE GROUPS. A trip names one, and the picker in the panel (site/js/ui/trippicker.js) draws one
# heading per group that has a trip in it, in `order`. A group with no trips is allowed and is
# not drawn: `events` waits for the first trip about something that has not happened yet. The
# `display` string is printed as it is, which makes this the one place copy lives in a registry
# other than registry/layers.yaml's layer names, and for the same reason: the row IS the thing.
# A group id may not be a layer id, exactly as a trip id may not (below).
groups:
  - {id: earth-orbit,  display: "Around the Earth",        order: 1}
  - {id: solar-system, display: "Around the Solar System", order: 2}
  - {id: beyond,       display: "Beyond the Solar System", order: 3}
  - {id: events,       display: "Things about to happen",  order: 4}

defaults:
  pacing: auto
  stage: earth
  clock: as-found
  min_stops: 3
  frame_radii: 5.0
  drift_deg: 34
  drift_rate_deg_s: 6
  drift: toward-light       # toward-light | away | none
  key_light_deg: 125        # three-quarter back light; 0 would be flat, 180 a silhouette
  ease: auto                # auto = `inout` under 3 s, `cruise` over. Or name one.
  on_unresolved: drop

tours:

  # =============================================================================================
  # Everything this trip needs is loaded in the first seconds of a first visit, which is why it
  # is the one to offer a stranger. It ends on the Earth rather than on a station because the
  # thing worth remembering is not either station: it is that there are two of them and nothing
  # else, on a planet with eight billion people on it.
  # =============================================================================================
  # The trip id may not be a layer id -- `stations` is a row in registry/layers.yaml, and the
  # validator refuses the collision. It caught this one on the first run.
  - id: people-in-space
    title: "Where people are living in space right now"
    blurb: "The only two places above you tonight with people inside them."
    group: earth-orbit
    next: strangest-things
    requires: [stations]
    clock: as-found
    stops:
      - id: far
        target: {layer: stations, catalog: "25544"}
        # Far enough back that the planet reads as a planet: at 32 000 km the Earth is about
        # half the frame, which is the shot that makes "above your head" mean something.
        distance_km: 32000
        drift_deg: 20
        card:
          title: "Two places, and only two"
          body: >-
            Right now there are exactly two homes above your head with people inside them.
            Everything else up here is a machine.

      - id: iss
        target: {layer: stations, catalog: "25544"}
        distance_km: 3000
        card:
          title: "The International Space Station"
          body: >-
            About the size of a football pitch, and moving at nearly eight kilometres a second. It
            goes all the way round the Earth every ninety-three minutes, so the crew see fifteen or
            sixteen sunrises a day.

      - id: tiangong
        # MEASURED IN A BROWSER, 2026-09-07, and the design had it wrong: CelesTrak's stations
        # group has no object called TIANGONG. The core module is `CSS (TIANHE)`, and the three
        # CSS modules are three separate rows. Querying for TIANGONG resolved to nothing and the
        # stop was dropped -- correctly and silently, which is the point of checking.
        target: {layer: stations, query: {name_contains: TIANHE}, pick: first}
        # DELIBERATELY IDENTICAL to the stop above. The comparison is honest only if the framing
        # is, and a closer shot of the smaller station would be flattering it.
        distance_km: 3000
        card:
          title: "Tiangong"
          body: >-
            China's station, about a fifth the mass, and newer. Three people live here at a time,
            in a low orbit like the other one's, a few hundred kilometres up.

      - id: both
        target: {world: earth}
        frame_radii: 5.0
        drift_deg: 20
        # THIS CARD USED TO SAY "They are never near each other. Two specks on opposite sides of
        # one planet" -- written as a constant, about two things that move. Two circular orbits
        # with J2 precession (ISS 415 km at 51.64 deg, Tiangong 385 km at 41.47 deg), one year at
        # 20 s steps from twenty random starts, 2026-09-22: they average 9 000 km apart and are
        # farther apart than the Earth is wide only 12 % of the time; closer than 1 000 km about
        # nine minutes a day, closer than 2 000 km about forty; and every year they pass within
        # ~30 km, the difference in their heights, where the two orbits cross. "Most of the time
        # thousands of kilometres apart" is what survives that.
        card:
          title: "Two specks, one planet"
          body: >-
            Most of the time they are thousands of kilometres apart. Two specks going round one
            planet, and that is the whole of humanity that does not live on the ground.

  # =============================================================================================
  # FROM YOUR GROUND TO THE STATION (spec 0038, 2026-09-23). The kiosk's "Journey to Int'l Space
  # Station": start from the visitor, go straight up through the air, out to the station where it
  # is now, and on to the minute it next crosses their sky. The place is never written here: the
  # first card's line saying which place, and how it was got, is generated (ui/trip.js noteFor).
  #
  # EVERY FACT IS NASA's, read 2026-09-23: "five miles per second", "16 orbits of Earth" a day and
  # "109 meters" end to end, "one yard shy of" an American football field
  # (https://www.nasa.gov/international-space-station/space-station-facts-and-figures/); "an
  # altitude of between 370-460 km" (https://www.nasa.gov/reference/international-space-station/);
  # the troposphere "about 12 kilometers" deep and the Karman line at "100 kilometers", with
  # "99.99997 percent" of the air beneath it (https://science.nasa.gov/earth/earth-atmosphere/
  # earths-atmosphere-a-multi-layered-cake/); and the station looks like "a very bright star
  # moving across the night sky", with no "flashing lights" (https://www.nasa.gov/spot-the-station/).
  #
  # `time: now` on the first three stops, not only on the pass: once the pass stop has moved the
  # clock the trip owns it until leave, so Back from the pass would otherwise show "the station,
  # this minute" at the minute of the pass. Each stop says which instant it is.
  # =============================================================================================
  - id: journey-to-the-station
    title: "From your ground to the space station"
    blurb: "Straight up to the station and its next pass. The clock moves, then goes back."
    group: earth-orbit
    next: people-in-space
    requires: [stations]
    requires_observer: true
    clock: as-found
    stops:
      - id: ground
        target: {observer: true}
        # THE SPEC SAID 150 km, and the rig cannot honour it. scene/camera.js WORLD_CLEARANCE 1.02
        # puts the camera's floor 127 km above the Earth, and a ground stop is seen from 36 to 76
        # degrees off the local vertical (ui/trip.js GROUND_POLARS), so the camera's height is at
        # most the distance times cos 36 degrees: 150 km gives 122 km, under the floor at every
        # angle, and the rig would push it out. From 200 km the two steepest angles clear it (162
        # and 133 km up), which leaves the key light a choice. Measured in tests/test_station_trip.mjs.
        distance_km: 200
        time: now
        drift_deg: 20
        card:
          title: "Where you are standing"
          body: >-
            This is the ground you are standing on, seen from high above it. All the weather you
            have ever felt happens in the bottom twelve kilometres of air, a layer too thin to see
            from here.

      - id: air
        target: {observer: true}
        # THE CAMERA AT THE STATION'S HEIGHT, which is not the same as 420 km from the ground point.
        # NASA gives the station 370 to 460 km up, and the harvest fixture's elements
        # (tests/fixtures/harvest/celestrak_gp.json, epoch 2026-09-07) put it 416 to 423 km. The
        # spec wrote `distance_km: 420`, and measured 2026-09-23 that stood the camera 226 to 283 km
        # up, looking down at 31 to 41 degrees, and on a 390 x 844 phone the horizon, the air's edge
        # this stop is about, was out of the frame. From 650 km the camera is 360 to 530 km up at
        # the three steeper angles, 194 km at the shallowest (Miami, afternoon, headless Chrome), and
        # the limb is in the picture from all four. scene/earth.js draws the air as a shell 159 km
        # thick (ATMOSPHERE_SCALE 1.025), so from just above it the glow is a wide band, not the
        # thin line the station's crew see; the card says "glow" and makes no claim about its width.
        distance_km: 650
        time: now
        drift_deg: 15
        card:
          title: "The air, from the station's height"
          body: >-
            Space begins a hundred kilometres up, with nearly all of the air already below. From
            the station's height the air is the blue glow along the edge of the world.

      - id: now
        target: {layer: stations, catalog: "25544"}
        distance_km: 3000
        time: now
        card:
          title: "The station, where it is this minute"
          body: >-
            The International Space Station, a laboratory and a home, about as long as a football
            pitch. It goes round the Earth sixteen times a day, eight kilometres every second.

      - id: pass
        target: {layer: stations, catalog: "25544"}
        # Close enough that the station fills the frame and the ground is the backdrop. The model
        # is drawn at class size whatever the distance (scene/heroes.js SELECTED_PX), and the
        # card's generated line says so.
        distance_km: 20
        # THE GROUND BEHIND IT. Without this the key light chose a camera 7 km below the station,
        # looking up at it against black sky (headless Chrome, Miami, 2026-09-23), under a card
        # that says "with your ground below".
        behind: earth
        # The peak of the next pass over the visitor above 10 degrees within seven days,
        # preferring one they could see within two (data/events.js fromPasses). At rate 1: the
        # station at the minute it crosses, not a replay of it.
        time: {event: station-pass.next}
        rate: 1
        drift_deg: 30
        card:
          title: "The next time it crosses your sky"
          body: >-
            This is the station at the top of its next pass over you, with your ground below. From
            where you stand it looks like a bright star moving steadily across the sky, with no
            blinking lights.

  # =============================================================================================
  # THE ID IS `strangest-things` AND NOT `oddities`, because `oddities` is the layer. Every stop
  # below is bundled data checked into this repository, so this trip needs no network at all and
  # nothing in it can fail to resolve for a reason outside the tree -- which makes it the SAFEST
  # trip in the set rather than the riskiest.
  #
  # THE ORDER IS BACKWARDS FROM THE ENDING. The last thing anyone sees is what they remember, so
  # the ending is chosen first and the fragile stops sit at the tail: drop the last two and it
  # still ends on a lunar surface, which is also a good ending.
  #
  # THE GOLDEN RECORD STOP FLIES TO VOYAGER 1, not to the record. The record is drawn as a child
  # of Voyager's model and is not a record in the app's sense at all, so `recordById` would
  # return null for it and the best stop in the trip would be dropped without a word. Flying to
  # the carrier is also where the object physically is. check_registry.py refuses the mistake by
  # name.
  # =============================================================================================
  - id: strangest-things
    title: "The strangest things we have ever sent"
    blurb: "A family photograph, two golf balls, a library, a record and a car."
    group: solar-system
    next: moon-landings
    requires: [oddities]
    min_stops: 3
    clock: as-found
    stops:
      - id: duke-photo
        target: {record: duke-family-photo}
        # A surface stop: close enough that the Moon is the ground and not a ball.
        distance_km: 900
        time: daylight
        card:
          title: "A photograph lying in the dust"
          # THE TRIP CARD ADDS; IT DOES NOT REPEAT. The object's own card opens right under this one
          # with the record's `fact:`, and all four surface stops here used to say the same thing
          # twice in one panel (read 2026-09-22). So each trip card says what the fact does not,
          # from the row's own `note:` or the source it cites.
          # The inscription is Wikipedia's (Charles Duke, read 2026-09-22), which also says the
          # family signed the back and added thumbprints.
          body: >-
            His family signed the back and pressed their thumbprints into it.
            It also says: This is the family of Astronaut Duke from Planet Earth, who landed on the
            Moon on the twentieth of April 1972.

      - id: golf-balls
        target: {record: shepard-golf-balls}
        distance_km: 900
        time: daylight
        card:
          title: "Two golf balls, twenty-four and forty yards out"
          body: >-
            They went twenty-four and forty yards, not the miles everybody repeats. The brand is
            unknown: Shepard never said, so that nobody could make money from it.

      - id: beresheet
        target: {record: beresheet-lunar-library}
        distance_km: 900
        time: daylight
        card:
          title: "Thirty million pages, and some tardigrades"
          body: >-
            Nobody knows where in the wreck the discs ended up; the camera orbiting the Moon cannot
            pick them out. Nor can anyone say whether the tardigrades survived the crash.

      - id: golden-record
        target: {record: deep-voyager-1}
        needs_layer: deep-space
        # Back to the present: the three stops on the Moon are shown in their daylight.
        time: now
        drift_deg: 20
        card:
          title: "A gold record, further away than anything"
          body: >-
            Bolted to the side of this spacecraft is a gold-plated record. It carries whale song,
            greetings in fifty-five languages, and one woman's heartbeat, recorded two days after
            she decided to get married.

      - id: roadster
        target: {record: tesla-roadster}
        card:
          title: "A car, going round the Sun"
          body: >-
            In the glovebox, a towel and a copy of The Hitchhiker's Guide to the Galaxy; on a
            circuit board, the words Made on Earth by humans. Nobody has actually looked at it since
            2018.

      - id: pull-back
        target: {world: earth}
        # Two million kilometres. At this fov the Earth is about three pixels across, which is
        # the whole of the shot: the number was chosen for what it makes the planet LOOK like,
        # and it is the one place in this file where that is the honest reason.
        distance_km: 2000000
        drift_deg: 0
        card:
          title: "And this is where all of it came from"
          body: >-
            Every one of those things was made by people standing on that. From out here you
            cannot pick it out of the dark.

  # =============================================================================================
  # The scale ladder as a trip (spec 0028 step 8). It lives on the STELLAR rung -- one unit is a
  # light-year -- so every distance below is in kilometres of light-years, and leaving it brings
  # the visitor back to Earth, because a camera cannot stay put when the unit changes under it.
  # The last card is the honesty line: what this map draws of what is known.
  # =============================================================================================
  - id: to-the-edge
    title: "To the edge of what we know"
    blurb: "From the Sun to a photographed black hole. Leaving brings you back to Earth."
    group: beyond
    next: life-of-a-star
    requires: [stars, deep-sky, exotics, galaxy]
    stage: stellar
    clock: as-found
    # The preview picture (2026-09-23): the Milky Way from outside, its arms and its bar. The first
    # stop, the Sun from a light-year, rendered at 1200 x 630 as a field of dots; the Pleiades,
    # the centre and Andromeda were rendered too, and read as a smear, a white blot and a small
    # galaxy far off.
    og_stop: 6
    stops:
      - id: sun
        target: {world: sun}
        distance_km: 9460730472580.8
        drift_deg: 15
        card:
          title: "The Sun, from one light-year"
          body: >-
            From here the whole Solar System is smaller than a pixel. Light from the Sun takes a year
            to reach this spot; Voyager 1, the fastest thing we have sent out of the Solar System,
            would take about eighteen thousand.

      - id: proxima
        target: {record: hip-70890}
        needs_layer: stars
        distance_km: 4730365236290.4
        card:
          title: "Proxima Centauri"
          body: >-
            The nearest star to the Sun, a dim red one an eighth of the Sun's mass. It has at least
            one planet. Every star you can see with your eyes at night is farther away than this one.

      - id: sirius
        target: {record: hip-32349}
        needs_layer: stars
        distance_km: 9460730472580.8
        card:
          title: "Sirius"
          body: >-
            The brightest star in our sky, eight and a half light-years out and twenty-five times as
            bright as the Sun. The light reaching your eye tonight left it eight and a half years ago.

      - id: pleiades
        target: {record: dso-m45}
        needs_layer: deep-sky
        distance_km: 946073047258080
        card:
          title: "The Pleiades"
          body: >-
            Over a thousand young stars, a hundred million years old, about four hundred and
            twenty-five light-years away. Their light left when Shakespeare was alive.

      - id: centre
        target: {record: exotic-sgr-a-star}
        needs_layer: exotics
        distance_km: 47303652362904000
        card:
          title: "The centre of the galaxy"
          body: >-
            Twenty-seven thousand light-years from home, a black hole of four million Suns that the
            whole Milky Way turns around. The disc, bar and arms drawn around you are a model built
            from measurements; the stars are the measured part.

      - id: galaxy
        target: {record: dso-milky-way}
        needs_layer: galaxy
        distance_km: 567643828354848000
        card:
          title: "The Milky Way"
          body: >-
            Our galaxy, about ninety thousand light-years across, seen from sixty thousand light-years
            above its disc, a view nobody has had. The shape is an illustration of what has been
            measured.

      - id: andromeda
        target: {record: dso-m31}
        needs_layer: deep-sky
        distance_km: 2838219141774240000
        card:
          title: "Andromeda"
          body: >-
            The nearest big galaxy, two and a half million light-years away and coming our way. Its
            light left when the first humans were learning to use tools.

      - id: edge
        target: {record: exotic-m87-star}
        needs_layer: exotics
        distance_km: 47303652362904000000
        card:
          # "THIS IS AS FAR AS THIS MAP DRAWS PLACES" was never true: the exotics layer draws TON 618's
          # black hole 10.8 billion light-years out, and M109 (83.5 Mly) and, since public #201, NGC 1300
          # and the Antennae are farther than M87 too. The trip still ends here, on the first black hole
          # anyone photographed; the card now says the map goes further. test_dso reads the number.
          title: "As far as this trip goes"
          body: >-
            Fifty-three million light-years: the black hole in M87, the first one ever photographed.
            The map goes further, to a quasar's black hole 10.8 billion light-years out. It shows
            109 389 stars of the 1.8 billion Gaia has measured, 209 nebulae, clusters and galaxies (110 of them from OpenNGC's 13 372), and every
            confirmed planet around another star whose distance has been measured. The rest is out
            there; we have not drawn what we cannot place.

  # =============================================================================================
  # PLANETS AROUND OTHER STARS, THEN ONE SYSTEM OF THEM UP CLOSE (spec 0040, 2026-09-23): the
  # Miami kiosk's "5005 exoplanets" and "Take a tour of TRAPPIST-1", which Ivan asked for.
  #
  # TWO SCALES. The first two stops are on the stellar rung, one unit a light-year, where every
  # planet is a mark at its star (spec 0028 step 4). The rest are on TRAPPIST-1's own stage
  # (registry/stages.yaml `system-trappist-1`, one unit 100 000 km), where scene/systems.js draws the
  # star and its seven planets at their true sizes on their orbits. Changing between the two is a
  # cut (ui/trip.js enterStage), and leaving puts the visitor back on the stage they came from, which
  # the blurb says.
  #
  # THE COUNT IS NOT TYPED. `{exoplanet_count}` is the number of rows in site/data/exoplanets.csv,
  # counted by scripts/gen_tours_js.py when the mirror is written; check_registry.py refuses a planet
  # count written as digits.
  #
  # EVERY NUMBER IS A ROW'S. The planets' periods, radii and masses are the exoplanet table's
  # (NASA Exoplanet Archive pscomppars, the bundled copy of 2026-09-08) and registry/systems.yaml's,
  # read from https://exoplanetarchive.ipac.caltech.edu/overview/TRAPPIST-1 on 2026-09-23; the
  # distances from the star and "Earth-sized" are the same rows; NASA's planet pages
  # (https://science.nasa.gov/exoplanet-catalog/trappist-1-e/ and its six siblings, read 2026-09-23)
  # give the same numbers and say nothing about habitability, so no card here does either (spec
  # 0040 req 9). What is derived, and how:
  #   - "as wide in its sky as the Moon is in ours" (e): d and e at their closest, circular orbits,
  #     0.02925 - 0.02227 au = 1.04 million km apart; d is 0.788 x 6 371 km in radius, so it spans
  #     0.55 degrees, and the Moon 0.52;
  #   - "b goes round twelve times" (h): 18.772866 / 1.510826 = 12.4;
  #   - "six times wider" (the last stop): Mercury's 0.387 au over h's 0.06189 au = 6.25;
  #   - "a little bigger than Jupiter" (the star): 0.1192 x 695 700 km = 82 900 km against Jupiter's
  #     69 911 (NASA planetary fact sheet, read 2026-09-23);
  #   - Proxima b: the table's own row, 11.18 days, 1.30 pc, found 2016 by radial velocity.
  # =============================================================================================
  - id: travel-to-exoplanets
    title: "Travel to exoplanets"
    blurb: "Other stars' planets, then TRAPPIST-1's seven. Leaving brings you back to Earth."
    group: beyond
    next: to-the-edge
    requires: [stars, exoplanets, systems]
    stage: stellar
    clock: as-found
    # The preview picture: TRAPPIST-1 and its seven rings, not the field of marks the trip opens on.
    og_stop: 3
    # Two chapters, one per scale: the catalogue on the stellar rung, then the one system at its own.
    stops:
      - id: all
        chapter: "Chapter one: the catalogue"
        target: {world: sun}
        distance_km: 567643828354848       # sixty light-years
        drift_deg: 30
        card:
          title: "Planets around other stars"
          body: >-
            {exoplanet_count} planets around other stars, in the copy of NASA's catalogue this map
            carries, each drawn as a mark at its star. Most were found by the dip in a star's light
            as a planet crosses in front of it, the rest mostly by the wobble a planet gives its star.

      - id: proxima-b
        chapter: "Chapter one: the catalogue"
        target: {record: exo-proxima-cen-b}
        distance_km: 4730365236290.4       # half a light-year
        card:
          title: "The nearest one"
          body: >-
            Proxima b goes round the nearest star to the Sun, four light-years away, once every
            eleven days. Nobody has seen it: it was found by the wobble it gives its star.

      - id: trappist
        chapter: "Chapter two: the seven of TRAPPIST-1"
        target: {record: star-trappist-1}
        stage: system-trappist-1
        # 0.1 au, and never closer than the outermost orbit fits the screen (ui/trip.js
        # stopDistanceKm asks scene/systems.js): on a phone held upright that is about 0.4 au.
        distance_km: 14959787
        drift_deg: 20
        card:
          title: "Seven worlds round a small red star"
          body: >-
            TRAPPIST-1 is a cool red star forty light-years away, a little bigger than Jupiter.
            Seven planets about the size of the Earth go round it, and all seven were found as
            they crossed in front of it.

      - id: e
        chapter: "Chapter two: the seven of TRAPPIST-1"
        target: {record: exo-trappist-1-e}
        stage: system-trappist-1
        frame_radii: 8
        key_light_deg: 60
        card:
          title: "TRAPPIST-1 e"
          body: >-
            A year here lasts six days. It is nine tenths as wide as the Earth and seven tenths as
            heavy, and at its closest its neighbour d would look as wide in its sky as the Moon is
            in ours.

      - id: b
        chapter: "Chapter two: the seven of TRAPPIST-1"
        target: {record: exo-trappist-1-b}
        stage: system-trappist-1
        frame_radii: 8
        key_light_deg: 60
        card:
          title: "TRAPPIST-1 b"
          body: >-
            The innermost, 1.7 million kilometres from its star, over thirty times closer than
            Mercury is to the Sun. Its year is a day and a half, and it is a tenth wider than the
            Earth.

      - id: c
        chapter: "Chapter two: the seven of TRAPPIST-1"
        target: {record: exo-trappist-1-c}
        stage: system-trappist-1
        frame_radii: 8
        key_light_deg: 60
        card:
          title: "TRAPPIST-1 c"
          body: >-
            The second out, round its star in just under two and a half days. Like b it is a little
            wider than the Earth and about a third heavier.

      - id: d
        chapter: "Chapter two: the seven of TRAPPIST-1"
        target: {record: exo-trappist-1-d}
        stage: system-trappist-1
        frame_radii: 8
        key_light_deg: 60
        card:
          title: "TRAPPIST-1 d"
          body: >-
            Four days a year, and the smallest but one: four fifths of the Earth's width and less
            than two fifths of its mass.

      - id: f
        chapter: "Chapter two: the seven of TRAPPIST-1"
        target: {record: exo-trappist-1-f}
        stage: system-trappist-1
        frame_radii: 8
        key_light_deg: 60
        card:
          title: "TRAPPIST-1 f"
          body: >-
            Nine days a year, and the nearest of the seven to the Earth's own size and mass, a few
            per cent over on both.

      - id: g
        chapter: "Chapter two: the seven of TRAPPIST-1"
        target: {record: exo-trappist-1-g}
        stage: system-trappist-1
        frame_radii: 8
        key_light_deg: 60
        card:
          title: "TRAPPIST-1 g"
          body: >-
            The widest of the seven, thirteen per cent wider than the Earth. Its year lasts twelve
            and a third days.

      - id: h
        chapter: "Chapter two: the seven of TRAPPIST-1"
        target: {record: exo-trappist-1-h}
        stage: system-trappist-1
        frame_radii: 8
        key_light_deg: 60
        card:
          title: "TRAPPIST-1 h"
          body: >-
            The outermost and the smallest, three quarters of the Earth's width. A year here is
            nineteen days, and b goes round twelve times in one of them.

      - id: mercury
        chapter: "Chapter two: the seven of TRAPPIST-1"
        target: {record: star-trappist-1}
        stage: system-trappist-1
        # Half an au, raised to whatever holds the whole dashed ring on this screen.
        distance_km: 74798935
        drift_deg: 0
        mercury_ring: true
        card:
          title: "All of it inside Mercury's orbit"
          body: >-
            The dashed ring is the size of Mercury's orbit round our Sun, drawn here for scale. It
            is six times wider than the orbit of h: every one of these worlds is closer to its star
            than Mercury is to ours.

  # =============================================================================================
  # The Moon's landing sites as a trip: the first soft landing, the first people, a rover driven
  # from Earth, the last crew, the far side, the south pole and the first private landers, in the
  # order they happened. Every stop is a registry/sites.yaml row (PR #210) and every one ships in
  # this repository, so like `strangest-things` this trip needs no network at all.
  #
  # THE CARD UNDER EACH OF THESE IS THE SITE'S OWN. A site card opens with the row's `doing:`
  # sentence (ui/cards.js), right under the trip's words, so each body below says what that
  # sentence does not. tests/test_contract.mjs holds the two apart: six words in a row shared with
  # the row's sentence is a repeat.
  #
  # EVERY FACT HAS ITS PAGE, all read 2026-09-22. "NSSDCA table" is the site rows' own
  # `nssdc-lunar` reference (Table of Anthropogenic Impacts and Spacecraft on the Moon, last updated
  # 13 August 2025); "NSSDCA <id>" is https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=<id>.
  #
  # ON THE MOON'S STAGE. The trip recentres the map on the Moon for its length, as `to-the-edge`
  # does on the stellar rung, and leaving puts the visitor back on the stage they came from, which
  # the blurb says. Measured in headless Chrome on 2026-09-22, first on the Earth stage: every
  # lander there was stood up away from the EARTH, not the Moon (scene/heroes.js took the stage
  # origin for "down"), so Surveyor 1 was two footpads sticking out of the ground. heroes.js now
  # takes the site's own world, but on the Moon's stage the Moon IS the origin: "down", the rig's
  # clearance sphere and a visitor's own hand on the camera during a pause all agree with nothing
  # to re-teach. Staying on the Earth stage would have kept the camera where it is on leave, and
  # left the rig's clearance on the Earth with the camera beside the Moon.
  #
  # 900 km, as `strangest-things` uses for its lunar surface stops: close enough that the Moon is
  # the ground and not a ball, with its curve and the black sky still in frame. At a landing site
  # ui/trip.js turns the camera's up to the site's own vertical, so the ground is at the bottom of
  # the frame, the lander stands on it, and the drift circles it at the height it arrived.
  # =============================================================================================
  - id: moon-landings
    title: "Where we have landed on the Moon"
    blurb: "Landings from the first to the private ones. Leaving brings you back to Earth."
    group: solar-system
    next: outer-solar-system
    # The worlds switch too: with it off the Moon is not drawn and every lander would stand on
    # nothing. The trip turns both on for its length and puts them back on the way out.
    requires: [hand-kept-sites, worlds]
    stage: moon
    clock: as-found
    stops:
      - id: surveyor-1
        target: {site: surveyor-1}
        distance_km: 900
        # The next hour the Sun is up here (ui/trip.js daylightMs): a lander in its night is a model on a black disc.
        time: daylight
        # Spec 0034: the part of the story this stop is in, above the trip's title in the
        # letterbox. The stops of one chapter repeat it and the frame keeps it up across them;
        # a new one lands with the stop's title, which for a new stage is just after the black.
        chapter: "Chapter one: the race, 1966 to 1972"
        card:
          title: "The first soft landing anyone can find"
          # NSSDCA 1966-006A: Luna 9 made the first soft landing, "preceding the U.S. Surveyor 1
          # soft lander by about 4 months", on 3 February 1966. NSSDCA table note f (Wagner et al.
          # 2017): the published coordinates are from the first Pravda report, LROC finds no lander
          # there, and the site "is probably at least 10 km away, direction unknown" -- which is
          # why registry/sites.yaml has no Luna 9 row. NSSDCA 1966-045A: "Engines were turned off
          # at a height of 3.4 m above the lunar surface and the spacecraft fell freely".
          body: >-
            It was not the first. The Soviet Luna 9 landed softly four months earlier, on 3
            February 1966, but NASA's table says the place published for it is probably at least
            10 km out, direction unknown. Surveyor 1 shut off its engines 3.4 m up and dropped the
            rest of the way.

      - id: apollo-11
        target: {site: apollo-11}
        distance_km: 900
        time: daylight
        chapter: "Chapter one: the race, 1966 to 1972"
        card:
          title: "The first people"
          # NSSDCA 1969-059C (the Apollo 11 lunar module): the LM "lifted off from the Moon ...
          # after 21 hours, 36 minutes on the lunar surface"; "The astronauts traversed a total
          # distance of about 250 meters, both ranging up to about 100 meters from the LM"; and
          # the CSM was "piloted by Michael Collins".
          body: >-
            Neil Armstrong and Buzz Aldrin stayed 21 hours and 36 minutes. Their whole walk
            covered about 250 metres, and neither went more than about 100 m from the lander.
            Michael Collins waited for them in orbit.

      - id: apollo-12
        target: {site: apollo-12}
        distance_km: 900
        time: daylight
        chapter: "Chapter one: the race, 1966 to 1972"
        card:
          title: "A visit to an older robot"
          # NSSDCA 1969-099C: on the second moonwalk they "visited the Surveyor 3 spacecraft,
          # bringing back about 10 kg of parts for later examination on Earth". NSSDCA 1967-035A:
          # the parts included the TV camera, and "The Surveyor 3 camera is now on display in the
          # Smithsonian National Air and Space Museum in Washington, D.C." Surveyor 3 is its own
          # row, 157 m from this one at the two rows' coordinates (NSSDCA says "about 180 m"), so
          # at this distance the two are drawn one on top of the other.
          body: >-
            On their second walk they went over to Surveyor 3 and brought about 10 kg of it home to
            study, its TV camera included. That camera is on show at the Smithsonian's National Air
            and Space Museum in Washington.

      - id: lunokhod-1
        target: {site: lunokhod-1}
        distance_km: 900
        time: daylight
        chapter: "Chapter one: the race, 1966 to 1972"
        card:
          title: "A rover driven from Earth"
          # NSSDCA 1970-095D (Lunokhod 1): its TV images "were used by a five-man team of
          # controllers on Earth who sent driving commands to the rover in real time"; "two
          # speeds, ~1 km/hr and ~2 km/hr"; "intended to operate through three lunar days but
          # actually operated for eleven lunar days (322 Earth days)".
          body: >-
            Nobody rode it. A team of five controllers on Earth drove it by its television
            pictures, at one or two kilometres an hour. It was built to last three lunar days and
            kept going for eleven, 322 Earth days in all.

      - id: apollo-17
        target: {site: apollo-17}
        distance_km: 900
        time: daylight
        chapter: "Chapter one: the race, 1966 to 1972"
        card:
          title: "Seventy-five hours, then a long quiet"
          # NSSDCA 1972-096C: "Schmitt was the first scientist-astronaut to walk on the Moon"; the
          # LM lifted off "after 75 hours on the lunar surface"; on three moonwalks "they covered
          # 30 km", using the rover. The NSSDCA table's soft landings after 11 December 1972 are
          # Luna 21 (1973), Luna 23 (1974) and Luna 24 (18 August 1976), and the next is Chang'e 3
          # on 14 December 2013: thirty-seven years and four months. Impacts in between (Hiten,
          # Lunar Prospector, SMART-1) are not landings, hence "landed softly".
          body: >-
            Gene Cernan and Harrison Schmitt, the first scientist to walk on the Moon, stayed 75
            hours and covered 30 km with their rover. After them robots landed three more times,
            and then nothing landed softly on the Moon for 37 years.

      - id: change-4
        target: {site: change-4}
        distance_km: 900
        time: daylight
        chapter: "Chapter two: the long quiet ends"
        card:
          title: "The side that never faces us"
          # NSSDCA 2018-103A: "Since the lander is on the far side, the Moon is blocking direct
          # radio contact with the Earth, so a relay satellite is used"; Queqiao, "in a halo orbit
          # around the Earth-Moon L2 point", launched on 20 May 2018, seven months before the
          # landing. NSSDCA table note z: "Yutu 2 rover still mobile as of January 2023", four
          # years after the landing on 3 January 2019. At 177.6 E the Earth stays below the
          # horizon whatever the Moon's wobble, which reaches about eight degrees of longitude.
          body: >-
            From here the Earth is always below the horizon, so the Moon itself blocks any radio
            link home. China first put a relay satellite, Queqiao, out beyond the Moon, and the
            lander spoke to Earth through it. Its rover, Yutu 2, was still driving four years
            later.

      - id: chandrayaan-3
        target: {site: chandrayaan-3}
        distance_km: 900
        time: daylight
        chapter: "Chapter two: the long quiet ends"
        card:
          title: "Near the south pole"
          # NSSDCA 2019-042A (Chandrayaan-2): "The lander, named Vikram"; contact was lost during
          # the descent on 6 September 2019 UT and it "crashed on the surface at 70.881 S, 22.784
          # E". Great circle from there to this row's 69.3741 S, 32.32 E on a 1737.4 km sphere:
          # 108 km. NSSDCA 2023-098A: "designed to operate for one lunar daylight period (about 14
          # Earth days). On September 4 they entered sleep mode."
          body: >-
            India's first try, Chandrayaan-2, carried a lander also called Vikram, and it crashed in
            September 2019 about 110 km from here. This one was built to work for one lunar day,
            about 14 Earth days, and was put to sleep on 4 September 2023.

      - id: im-1
        target: {site: im-1}
        distance_km: 900
        time: daylight
        chapter: "Chapter three: the first companies"
        card:
          title: "The first private lander, leaning"
          # NSSDCA IM-1-NOVA: "It landed in a 1 km diameter crater on a slope of about 12 degrees
          # ... Some of the landing gear broke upon impact, and Odysseus tipped over and was
          # resting at a 30 degree angle to the horizontal, but was still operational." The NSSDCA
          # table: no landing before it was nearer a pole than 80.13 S (Chandrayaan-3's 69.37 S
          # was the nearest), and Intuitive Machines 2 landed at 84.7906 S on 6 March 2025.
          body: >-
            It came down on a slope of about 12 degrees, broke some of its landing gear, and came
            to rest leaning at 30 degrees, still working. Nothing had landed nearer a pole until
            the same company's next lander, IM-2, reached 84.8 degrees south in March 2025.

      - id: blue-ghost-1
        target: {site: blue-ghost-1}
        distance_km: 900
        time: daylight
        chapter: "Chapter three: the first companies"
        card:
          title: "An eclipse, seen from the Moon"
          # NASA, "NASA Science Continues After Firefly's First Moon Mission Concludes" (18 March
          # 2025): "10 NASA science and technology instruments"; it recorded "a total solar
          # eclipse". Firefly, "Firefly Aerospace Successfully Completes 14 Days of Surface
          # Operations on the Moon" (17 March 2025): imagery "of a total solar eclipse on March 14
          # ... where the Earth blocks the sun", and "of the lunar sunset on March 16", for "a
          # lunar horizon glow that was hypothesized and observed by Eugene Cernan on Apollo 17".
          # Not "the first eclipse seen from the Moon": Surveyor 3 recorded images of an eclipse
          # of the Sun by the Earth in 1967 (NSSDCA 1967-035A).
          body: >-
            It carried ten NASA instruments. On 14 March 2025 it watched the Earth pass in front of
            the Sun, a total eclipse seen from the Moon. Two days later it filmed the sunset,
            looking for a glow over the horizon that Gene Cernan saw on Apollo 17.

      - id: whole-moon
        target: {world: moon}
        # Six radii, not Celestia's five: the Moon is then 19 degrees across, inside the 22-degree
        # width of a 390 px phone held upright (measured at four radii, 2026-09-22, the disc ran
        # off both sides of the phone), and a third of a 1280 x 800 window.
        frame_radii: 6.0
        drift_deg: 20
        # Lit from the front, not three-quarter behind: the last shot is the Moon's face with its
        # sites on it, and the house back light would make it a crescent.
        key_light_deg: 45
        chapter: "Epilogue: the whole Moon"
        card:
          title: "Twenty-eight landings, nineteen on this map"
          # The NSSDCA table, "Last Updated: 13 August 2025", counted 2026-09-22: 28 rows typed
          # Soft Landing, Crewed Landing or Lander, leaving out the two Yutu rovers it also types
          # Soft Landing; 6 of them Crewed Landing. The 19 is registry/sites.yaml's lunar rows
          # that are records -- two of them the rovers Luna 17 and Luna 21 carried, where they
          # stopped -- and tests/test_moon_trip.mjs holds this card to that count.
          body: >-
            NASA's table of what lies on the Moon, last updated in August 2025, lists 28 landings,
            six of them with people aboard. This map marks 19 of them, two by where their rovers
            stopped. Luna 9, the first of all, is not one: nobody knows exactly where it is.

  # =============================================================================================
  # OUT PAST JUPITER. Ten stops, each on the stage where its subject is drawn where it really is:
  # Jupiter's for Io and Europa, Saturn's for Titan and Enceladus, Neptune's for Triton, Pluto's
  # for the pair, and the Sun's for the three that are further out than any planet. From Earth's
  # stage every one of the outer worlds is drawn nearer and larger, and its moons around the
  # enlarged disc (scene/worlds.js): the trip would have flown to a place on the screen where
  # nothing is drawn. The per-stop `stage:` field above arrived with this trip; the only other row
  # that names one is the fixture trip in tests/fixtures/phoebe.yaml, which visits a moon of
  # Saturn for the same reason.
  #
  # EVERY STOP IS A `record:` AND NOT A `world:`, so the world's or the probe's OWN card opens
  # under the stop's words: the moons' cards carry the page and the day each of their facts was
  # read (registry/worlds.yaml `facts:`), which is where the reader goes next. The stop's words
  # therefore ADD and never repeat -- the same rule the four surface stops above are written to.
  #
  # THE ORDER IS THE DISTANCE, and it is also the order the story happened in: every world here
  # was a dot until something we built went past it, and the last stop is the thing that went
  # furthest. The fragile end is the tail, as in the trip above: the three `far-bodies` and
  # `deep-space` stops are bundled data, so nothing here needs a network, but if the layers were
  # ever switched off the trip still ends on Pluto and Charon, which is also a good ending.
  # =============================================================================================
  - id: outer-solar-system
    title: "Out past Jupiter, to the farthest thing we sent"
    blurb: "Ten stops through the cold outer worlds. Leaving brings you back to Earth."
    group: solar-system
    next: to-the-edge
    requires: [worlds, deep-space, far-bodies]
    stage: jupiter
    clock: as-found
    stops:
      - id: io
        target: {record: io}
        behind: jupiter
        stage: jupiter
        # 12 Io radii: at 5 the moon fills the frame and Jupiter, 5.9 Jupiter radii away, is
        # whatever the key light leaves behind it. Checked in the browser, 2026-09-22.
        frame_radii: 12
        # Spec 0034: the part of the story this stop is in, above the trip's title in the
        # letterbox. The stops of one chapter repeat it and the frame keeps it up across them;
        # a new one lands with the stop's title, which for a new stage is just after the black.
        chapter: "Chapter one: Jupiter's moons"
        card:
          title: "Io, the moon Jupiter never lets rest"
          # Io's lap is 1.769 days (NASA's Jovian satellite fact sheet, the same table
          # registry/worlds.yaml takes its radius from, read 2026-09-22) = 42.5 hours. The tug of
          # war and the volcanoes are NASA Science, Io, read 2026-09-22: "caught in a tug-of-war
          # between Jupiter's massive gravity and the smaller but precisely timed pulls from two
          # neighboring moons that orbit farther from Jupiter -- Europa and Ganymede", and "the
          # most volcanically active world in the solar system, with hundreds of volcanoes".
          body: >-
            Io goes round Jupiter every 42 hours, pulled one way by the planet and the other by two
            moons further out, in time with it. All that kneading has to go somewhere, and it comes
            out of hundreds of volcanoes.

      - id: europa
        target: {record: europa}
        behind: jupiter
        stage: jupiter
        frame_radii: 12
        chapter: "Chapter one: Jupiter's moons"
        card:
          title: "Europa, and the two ships on their way"
          # Twice Earth's ocean: NASA Science, Europa, read 2026-09-22, "holding twice as much
          # water as Earth's global ocean". Europa Clipper: first closest approach to Europa
          # 2030-04-11 and 49 flybys (Wikipedia, Europa Clipper, and the Horizons -159 header
          # data/sample.js quotes), goal "to determine whether there are places below the surface
          # of Jupiter's icy moon, Europa, that could support life" (NASA Science). JUICE arrives
          # July 2031 (data/sample.js, from the Horizons -28 header) and is "the first intended to
          # orbit a moon other than Earth's Moon", Ganymede, from December 2034 (Wikipedia, Jupiter
          # Icy Moons Explorer). All read 2026-09-22.
          body: >-
            Under that ice is twice as much water as every ocean on Earth put together. Europa
            Clipper reaches Jupiter in April 2030 to fly past here 49 times and ask whether
            anything could live down there; Europe's JUICE arrives in 2031 and ends up circling
            Ganymede.

      - id: saturn
        target: {record: saturn}
        stage: saturn
        frame_radii: 4.5
        # Lit from the front (public #443): at the default 125 degrees a planet is a fifth lit, a dark disc.
        key_light_deg: 60
        chapter: "Chapter two: the ringed planet"
        card:
          title: "Saturn, and a ring ten metres thick"
          # Wikipedia, Rings of Saturn, read 2026-09-22: they "extend from 7,000 km (4,300 mi) to
          # 80,000 km (50,000 mi) away from Saturn's equator", are "made almost entirely of water
          # ice, with a trace component of rocky material", and have a "local thickness of as
          # little as 10 meters". The ring this map draws is 74 500 to 140 220 km from Saturn's
          # centre (registry/worlds.yaml), which is that same 16 000 to 82 000 km above the
          # equator. Cassini: orbit insertion 1 July 2004, "13 years, 76 days at Saturn", and on
          # 15 September 2017 its "trajectory took it into Saturn's upper atmosphere and it burned
          # up" (Wikipedia, Cassini-Huygens, read 2026-09-22).
          body: >-
            The rings reach eighty thousand kilometres out from the equator and in places are ten
            metres from top to bottom. They are almost all water ice. Cassini circled here for
            thirteen years and finished by flying into the planet in September 2017.

      - id: titan
        target: {record: titan}
        behind: saturn
        stage: saturn
        frame_radii: 6
        chapter: "Chapter two: the ringed planet"
        card:
          title: "Titan, and the farthest we have landed"
          # Wikipedia, Titan (moon), read 2026-09-22: surface pressure "146.7 kPa (1.45 atm)", "the
          # only moon in the Solar System with an atmosphere denser than Earth's", and "the only
          # known object in the Solar System besides Earth with clear evidence of stable bodies of
          # surface liquid". Huygens "landed on Titan on 14 January 2005", "continued to send data
          # for about 90 minutes after touchdown", and its landing was "the farthest landing from
          # Earth a spacecraft has ever made" and "so far the only one accomplished in the outer
          # Solar System" (Wikipedia, Huygens (spacecraft), read 2026-09-22).
          body: >-
            The air at the ground presses half again as hard as Earth's, and the lakes under the
            haze are methane. Huygens came down through it on 14 January 2005 and sent for ninety
            minutes from the surface. Nothing has landed further from home, before or since.

      - id: enceladus
        target: {record: enceladus}
        behind: saturn
        stage: saturn
        # Enceladus is 252 km in radius and 238 000 km from Saturn. MEASURED in the browser,
        # 2026-09-22: at 5 radii the moon came out 193 px across against a Saturn 235 px across,
        # which reads as two bodies of a size. At 12 it is 85 px against the same 250 px, and
        # perspective is doing less of the lying: Saturn really is 231 times the radius.
        frame_radii: 12
        chapter: "Chapter two: the ringed planet"
        card:
          title: "Enceladus, spraying its ocean into space"
          # NASA Science, Enceladus, read 2026-09-22: "In 2005, NASA's Cassini spacecraft
          # discovered that icy water particles and gas gush from the moon's surface at
          # approximately 800 miles per hour (400 meters per second)"; the plume carries "water
          # vapor, carbon dioxide, methane, perhaps a little ammonia and either carbon monoxide or
          # nitrogen gas ... along with salts and silica", and "the density of organic materials in
          # the plume was about 20 times denser than scientists expected"; "The eruptions appear to
          # be continuous ... which supplies material to Saturn's E-ring". The moon is "only about
          # 310 miles (500 kilometers) across".
          body: >-
            Cassini found the jets in 2005, coming off the south pole at four hundred metres a
            second, and flew straight through them. They carry water, salt, silica and more organic
            material than anyone expected, and they have not stopped: the dust keeps one of
            Saturn's outer rings supplied.

      - id: triton
        target: {record: triton}
        behind: neptune
        stage: neptune
        # Triton is 1 353 km in radius, Neptune 24 622 and 355 000 km away, so perspective at 8
        # radii drew the moon twice the width of the planet it goes round (browser, 2026-09-22).
        # At 14 they are 69 and 65 px, which is at least the right way round.
        frame_radii: 14
        key_light_deg: 60
        chapter: "Chapter three: the last planet"
        card:
          title: "Triton, going the wrong way round"
          # Wikipedia, Voyager 2, read 2026-09-22: "Voyager 2's closest approach to Neptune
          # occurred on August 25, 1989"; "Five hours after Voyager 2 made its closest approach to
          # Neptune, it performed a close fly-by of Triton ... passing within about 40,000 km"; it
          # is "The only spacecraft to have visited either of the ice giant planets". NASA Science,
          # Triton, read 2026-09-22: Voyager 2 "found surface temperatures of -391 degrees
          # Fahrenheit (-235 degrees Celsius)" and "found Triton has active geysers".
          body: >-
            One spacecraft has ever visited Neptune: Voyager 2, on 25 August 1989. Five hours
            after passing the planet it flew by Triton, forty thousand kilometres up, and found a
            surface at minus 235 degrees with geysers going off on it.

      - id: pluto
        target: {record: pluto}
        behind: charon
        stage: pluto
        # Charon is 19 600 km from Pluto and 606 km in radius. At 9 Pluto radii (10 700 km) the
        # pair is the shot; the moon's own card is one tap away.
        frame_radii: 9
        key_light_deg: 60
        chapter: "Chapter four: past Neptune"
        card:
          title: "Pluto and Charon, going round each other"
          # Wikipedia, New Horizons, read 2026-09-22: launch "January 19, 2006", closest approach
          # "July 14, 2015, at 11:49 UTC" at "12,500 km (7,800 mi)", and the last flyby data
          # reached Earth on "October 25, 2016". Wikipedia, Pluto, read 2026-09-22: "Sputnik
          # Planitia is covered with churning nitrogen ice 'cells' that are geologically young and
          # turning over due to convection"; "The mountains are made of water ice"; Pluto and
          # Charon's shared centre of mass "does not lie within either body, and they are tidally
          # locked".
          body: >-
            New Horizons crossed this pair on 14 July 2015, nine and a half years out from Earth.
            It found mountains of water ice, and beside them a plain of nitrogen ice that is still
            slowly turning over. Sending the pictures home took until October 2016.

      - id: sedna
        target: {record: dwarf-sedna}
        needs_layer: far-bodies
        stage: sun
        # NOT pulled back to hold the whole 1 087 au lap the card is about, though the line is
        # drawn (public #212). MEASURED 2026-09-22: from 2 400 au the picture was unchanged,
        # because scene/heroes.js draws the SELECTED model at a constant 260 px whatever the
        # distance. Sedna and Eris therefore look like the same rock at the same size; the words
        # and the orbit line are what tell them apart.
        chapter: "Chapter four: past Neptune"
        card:
          title: "Sedna, on its way in"
          # Wikipedia, 90377 Sedna, read 2026-09-22: found "on 14 November 2003"; perihelion
          # "76.19 AU (11.4 billion km)", reached about July 2076; aphelion "937 AU (140 billion
          # km)"; one lap "approximately 11,400 years"; its closest point is "far too distant for
          # it to have been scattered by any of the known planets". The record's own elements agree
          # (data/sample.js: JPL's perihelion date is 2075-11).
          body: >-
            It is falling towards its closest point, some time around 2076, and even that is
            seventy-six times the Earth's distance from the Sun. Then it climbs back out to nine
            hundred and thirty-seven times. No planet we know of could have put it on that path,
            and finding it in 2003 was part of what made astronomers ask what a planet is.

      - id: eris
        target: {record: dwarf-eris}
        needs_layer: far-bodies
        stage: sun
        chapter: "Chapter four: past Neptune"
        card:
          title: "Eris, which made planet a definition"
          # Wikipedia, IAU definition of planet, read 2026-09-22. The resolution of 24 August 2006
          # asks that a planet "is in orbit around the Sun", "has sufficient mass for its
          # self-gravity to overcome rigid body forces so that it assumes a hydrostatic equilibrium
          # (nearly round) shape" and "has cleared the neighbourhood around its orbit"; a dwarf
          # planet meets the first two and not the third. The card gives the year and not the
          # month, because the month pushes its first sentence past the 160 characters ui/cards.js
          # prints. Eris's lap is 560 years from JPL's own
          # elements (a = 67.93 au, data/sample.js) and it is 95.5 au from the Sun on 2026-09-22
          # against an aphelion of 97.7, so "near the far end" is good for decades.
          body: >-
            The definition astronomers agreed on in 2006 asks three things of a planet: it goes
            round the Sun, gravity has pulled it round, and it has cleared its own path. Eris and
            Pluto fail the third. Eris is near the far end of a 560-year lap, ninety five times as
            far from the Sun as we are.

      - id: voyager-1
        target: {record: deep-voyager-1}
        needs_layer: deep-space
        stage: sun
        # NO `behind: sun`, though the Sun is the thing this card points back at: tried in the
        # browser 2026-09-22, and at 172 au the Sun is 0.01 px across, so aiming the camera at it
        # only turned Voyager 1 side on and put nothing in the frame.
        chapter: "Epilogue: looking back"
        card:
          title: "Voyager 1, and everything behind it"
          # Wikipedia, Voyager 1, read 2026-09-22: launched "September 5, 1977", Jupiter on
          # "March 5, 1979", Saturn on "November 12, 1980", and it crossed into interstellar space
          # on "August 25, 2012". The photograph is 14 February 1990 from "40.47 astronomical
          # units", in which Earth "takes up less than one (0.12 of a pixel, according to NASA)"
          # (Wikipedia, Pale Blue Dot, read 2026-09-22). The distance is the record's own: JPL
          # Horizons put it at 171.7 au on 2026-09-07 (data/sample.js), and it adds 3.6 a year.
          body: >-
            It passed Jupiter in March 1979 and Saturn in November 1980, and it has been leaving
            ever since, more than 170 times the Earth's distance from the Sun. In 1990 it turned
            round and photographed the planets it had left. Earth came out 0.12 of a pixel wide.

  # =============================================================================================
  # A YEAR IN A MINUTE (spec 0030). The first trip that moves the clock, and the cheapest one in
  # the catalogue: four stops, every one a world, and nothing that needs a network. It runs on the
  # SUN'S STAGE because that is the one stage that squeezes nothing (scene/worlds.js
  # compressesFrom), so every orbit here is drawn at its true size and in its true place, and the
  # motion is the real motion at the real proportions.
  #
  # THE RATE. 525 600 is the minutes in a year, so one real minute is one year of the clock and one
  # real second is 525 600 s = 6.08 days: a day every 0.164 s, a sixth of a second. It is above the
  # clock's own top speed (36 000, site/js/clock.js) and above the 60 a trip otherwise keeps to, and
  # check_registry.py allows it on the Sun's stage only, where no SGP4 object is being followed.
  # The clock is HELD while the camera flies (ui/trip.js applyStopTime) and runs while a card is
  # up, so the four dwells are what the year is spent on: 13.8 + 15.2 + 14.5 + 14.8 = 58.3 s from
  # their word counts (scripts/gen_tours_js.py), which is 355 days. The panel says "about 2
  # minutes" because the four flights are on top and the length is rounded up (ui/tripframe.js).
  #
  # EVERY NUMBER IS NASA's PLANETARY FACT SHEET (https://nssdc.gsfc.nasa.gov/planetary/factsheet/,
  # read 2026-09-23): orbital period Mercury 88.0 d, Earth 365.2 d, Jupiter 4331 d; distance from
  # the Sun Mercury 57.9, Earth 149.6, Mars 228.0 (aphelion 249.3), Jupiter 778.5 million km;
  # orbital velocity Mercury 47.4, Earth 29.8 km/s; the Moon 0.384 million km from Earth, going
  # round in 27.3 d. At 6.08 days a second: Mercury laps in 14.5 s, the Moon in 4.5 s, the Earth in
  # 60 s, and Jupiter would need 712 s.
  # =============================================================================================
  - id: a-year-in-a-minute
    title: "A year in a minute"
    blurb: "A year of orbits in a minute. Leaving puts the clock back and you back to Earth."
    group: solar-system
    next: outer-solar-system
    requires: [worlds]
    stage: sun
    clock: as-found          # the STOPS move it; `clock:` stays the trip-level mode
    # 2026-09-23: at true size from 700 million km every planet is a fraction of a pixel (the Earth
    # 0.009 px in radius), so the trip showed a Sun and some names and not the one thing it is for.
    # The paths and a dot at each planet make the going-round visible; the dot is size only, and
    # every stop says it is drawn larger (scene/orbitrings.js, measured there).
    orbits: [mercury, venus, earth, mars, jupiter]
    # The first stop again, now that it draws the paths: the four inner planets round the Sun is
    # the trip in one picture. Before the paths it was a scatter of craft markers and no planets.
    og_stop: 1
    stops:
      - id: inner
        target: {world: sun}
        # Mars at aphelion is 249.3 million km out. The camera looks down from 50 degrees above the
        # planets' plane (ui/trip.js SUN_OVERVIEW_POLAR), so the near side of an orbit of radius r
        # is 0.64 r nearer the camera and 0.77 r off the middle, and it stays inside the frame's
        # 22.5-degree half-height while the distance is at least 2.49 r: 621 million km for Mars.
        # 700 million holds the whole of Mars's orbit on a 1280 x 800 screen, at any date
        # (tests/test_year_trip.mjs, four dates).
        distance_km: 700000000
        # From the visitor's present, at whatever instant that is, so nothing here names a date.
        time: now
        rate: 525600
        drift_deg: 0
        card:
          title: "Everything inside Mars, going round"
          body: >-
            Every second here is six days, so Mercury goes round the Sun in fifteen seconds and the
            Earth in a minute. Each planet is a dot drawn far larger than it is, on the path it
            really follows.

      - id: earth
        target: {world: earth}
        # The Moon's orbit is 384 400 km across the middle; from 2.5 million km the frame's
        # half-height is 1.04 million, so the orbit fills about a third of it.
        distance_km: 2500000
        rate: 525600
        drift_deg: 0
        card:
          title: "The Earth, and the Moon going round it"
          body: >-
            The Moon goes round the Earth every 27.3 days, which here is four and a half seconds.
            The camera is riding along with the Earth at thirty kilometres a second, so it is
            everything farther away that seems to drift.

      - id: mercury
        target: {world: mercury}
        # Mercury is 57.9 million km from the Sun; 60 million km sits the camera about as far
        # from Mercury as Mercury is from the Sun, with the Sun kept in the picture behind it.
        distance_km: 60000000
        behind: sun
        rate: 525600
        drift_deg: 0
        card:
          title: "Mercury, four laps to our one"
          body: >-
            Mercury goes round the Sun in 88 days, four times in each of our years, at 47
            kilometres a second. The camera is following it, so it is the Sun that seems to wheel
            round behind.

      - id: jupiter
        target: {world: sun}
        # Jupiter is 778.5 million km out, and by the rule on the first stop the frame holds its
        # orbit from 2.49 x 778.5 = 1.94 billion km. The design said 1.6 billion; measured in
        # tests/test_year_trip.mjs, from there Jupiter was off the top or bottom of a 1280 x 800
        # frame at three dates of four. 2.2 billion leaves a margin.
        distance_km: 2200000000
        rate: 525600
        drift_deg: 0
        card:
          title: "Jupiter, which takes twelve of our years"
          body: >-
            Jupiter is five times as far from the Sun as we are and needs almost twelve of our
            years to go round once. While the Earth goes round one time, Jupiter covers a twelfth
            of its path.

  # =============================================================================================
  # Spec 0037, 2026-09-23: the Moon's shadow on the Earth, from the true positions of the Sun and the
  # Moon (scene/eclipse.js), at the instants spec 0031 computes (data/events.js, checked against
  # NASA GSFC within 6 s). The kiosk's first flight-plan card was "Chasing the Solar Eclipse".
  #
  # EVERY INSTANT IS AN EVENT REFERENCE, counted from the visitor's clock, so the trip is never out
  # of date and no card may name a date or a place: the eclipse it shows moves on as the years do
  # (the total one is on 2 August 2027 across North Africa from today, 22 July 2028 across Australia
  # after that). The frame prints the instant ("Shown at") and the honesty line (COPY.trip.
  # eclipseLine); the cards say what the picture is.
  #
  # THREE DEPARTURES FROM THE SPEC, each measured:
  #   - Stops 1 and 2 say `kind: total`. From 2026-09-23 the next solar eclipse of any kind is the
  #     ANNULAR of 2027-02-06, so the spec's bare `solar-eclipse.next` showed the ring twice and the
  #     total never.
  #   - Stop 3 targets the Moon with the Earth behind it. `behind:` puts the camera opposite the
  #     backdrop, so the spec's `target: earth, behind: moon` stood on the Earth's night side, the
  #     one side the shadow is not on.
  #   - Stop 5 says `kind: total`. The next three lunar eclipses (2027-02-20, 2027-07-18,
  #     2027-08-17) are penumbral: the Moon dims by a third at most and never reaches the dark
  #     core the card is about. The next total one is 2028-12-31, found because a `kind:` looks
  #     1 200 days ahead (data/events.js ECLIPSE_KIND_HORIZON_MS).
  #
  # Facts: NASA GSFC, "Solar Eclipses: 2027-2028" (eclipse.gsfc.nasa.gov/SEdecade/SEdecade2021.html),
  # "Five Millennium Catalog of Solar Eclipses" (eclipse.gsfc.nasa.gov/SEcat5/SEcatalog.html: the
  # four kinds; the longest totality in the five thousand years, 7 min 29 s) and "Five Millennium
  # Catalog of Lunar Eclipses" (eclipse.gsfc.nasa.gov/LEcat5/LEcatalog.html: the three kinds), all
  # read 2026-09-23.
  # =============================================================================================
  - id: chasing-the-solar-eclipse
    title: "Chasing the solar eclipse"
    blurb: "The next total eclipse's shadow crossing the Earth. This trip moves the clock."
    group: events
    requires: [worlds]
    stage: earth
    clock: as-found
    stops:
      - id: arrives
        target: {world: earth}
        # Seven radii holds the whole disc with room for the shadow to come on at one edge.
        frame_radii: 7
        # Square on from the Sun's side: the shadow is only ever on the day side.
        key_light_deg: 0
        time: {event: solar-eclipse.next, kind: total, offset_s: -5400}
        rate: 600
        drift_deg: 0
        card:
          title: "The shadow arrives"
          body: >-
            This is the Moon's shadow crossing the Earth, drawn from where the Sun and the Moon
            really are. Under the pale outer part people see a bite taken out of the Sun; only
            under the small dark core is it covered completely.

      - id: peak
        target: {world: earth}
        frame_radii: 3
        key_light_deg: 0
        time: {event: solar-eclipse.next, kind: total}
        rate: 1
        drift_deg: 0
        card:
          title: "The minute it happens"
          body: >-
            This is greatest eclipse, the minute the dark core of the shadow passes nearest the
            middle of the Earth. Inside it the Sun is covered for a few minutes, and never for
            more than seven and a half.

      - id: from-the-moon
        target: {world: moon}
        # 12 000 km out from the Moon's day side, which at an eclipse faces the Sun and away from
        # us. The Moon is 16.5 degrees across from here; `behind: earth` keeps the Earth within 16
        # degrees of the middle and clear of the Moon's disc, a small blue disc with the shadow on
        # it, 380 000 km further on.
        distance_km: 12000
        behind: earth
        key_light_deg: 0
        rate: 60
        card:
          title: "The Moon, casting it"
          body: >-
            Behind the Moon, the Earth, and on it the dark spot where the Moon's shadow is touching
            the ground. The side of the Moon facing you is in full sunlight, which is why the side
            facing the Earth is dark.

      - id: ring
        target: {world: earth}
        frame_radii: 3
        key_light_deg: 0
        time: {event: solar-eclipse.next, kind: annular}
        rate: 1
        drift_deg: 0
        card:
          title: "A ring, not a night"
          body: >-
            When the Moon is near the far end of its orbit it looks a little smaller than the Sun,
            so it cannot cover all of it. A bright ring is left round the Moon, and the shadow on
            the ground never gets as dark as a total one.

      - id: lunar
        target: {world: moon}
        frame_radii: 4
        key_light_deg: 0
        # An hour before the middle of the eclipse at ten minutes a second: the Moon walks into
        # the Earth's dark shadow, through totality and out again under one card.
        time: {event: lunar-eclipse.next, kind: total, offset_s: -3600}
        rate: 600
        drift_deg: 0
        card:
          title: "The Earth's shadow on the Moon"
          body: >-
            Now it is the Earth that is in the way. The Moon moves into the Earth's shadow, and
            anyone on the night half of the planet can watch it happen, with nothing but their
            eyes.

  # =============================================================================================
  # THE CONSTELLATIONS (2026-10-05). Ivan: "a cool planetarium trip about all popular
  # constellations with cool animation, so it will be like a cool movie", and of Stellarium: "I
  # want to be better than they are when we are looking on the sky from earth".
  #
  # WHERE THE CAMERA IS. On the stellar rung, standing where the Sun is (`target: {sky: [ra,
  # dec]}`, ui/trip.js SKY_NEAR_KM), so the sky on screen is the one seen from Earth: the 5 044
  # naked-eye stars and the Milky Way of scene/starfield.js. Each stop turns the camera to a
  # figure and scene/figures3d.js draws it in one stroke, star to star, then names it and its
  # brightest stars. Stop 2 is the thing a dome cannot do: the same Orion, with the camera flown
  # hundreds of light-years to one side (`depth_ly`, `aside_deg`) and still turning, where the
  # lines join the same stars at their measured distances and the hunter comes apart.
  #
  # `exposure: deep` on the four stops the Milky Way runs through is the shutter of spec 0067,
  # held for the stop and never stored; the card says it is a long exposure.
  #
  # FACTS. Distances are the map's own (HYG v4.4, site/data/stars3d.names.json, read 2026-10-05):
  # Bellatrix 252 ly, Betelgeuse 498, Alnilam 1 977; Pollux 33.8, Castor 50.9. Castor's six stars:
  # the Washington Double Star Catalog's sextuple (IAU WGSN notes). Antares's size: about 680 solar
  # radii (Ohnaka et al. 2013, A&A 555, A24), 3.2 au against Mars's 1.5. The names other peoples
  # gave: Osiris (Sah) for Orion, the Pyramid Texts; Las Tres Marias, the belt in Spanish-speaking
  # America; Subaru and Matariki for the Pleiades (National Astronomical Observatory of Japan; Te
  # Ara, the Encyclopedia of New Zealand, "Matariki"); the Weaver Girl and the Cowherd (the Qixi
  # story, in the Shijing's "Da Dong" already); Maui's fish hook, Ka Makau Nui o Maui (Polynesian
  # Voyaging Society star lines); the Emu in the Sky (Norris and Hamacher 2009, "The astronomy of
  # Aboriginal Australia", IAU S260). The five flags: each country's own flag law. Thirteen
  # constellations on the ecliptic: the IAU's 1930 boundaries (Delporte).
  # =============================================================================================
  - id: the-constellations
    title: "The constellations"
    blurb: "Twelve figures of the night sky, drawn star by star. Leaving goes back to Earth."
    group: beyond
    next: to-the-edge
    requires: [stars]
    # The marks of other layers are litter across a figure: every planet of another star is a
    # green dot here, every nebula a lilac one (looked at 2026-10-05, the first render).
    hides: [exoplanets, systems, exotics, deep-sky, galaxy]
    stage: stellar
    clock: as-found
    og_stop: 1
    stops:
      - id: orion
        target: {sky: [83.8, 0.0]}
        zoom: 0.88
        figures: [Ori]
        figure_stars: 4
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The northern winter sky"
        card:
          title: "Orion, the hunter"
          body: >-
            Three stars in a row and four more around them: the easiest figure in the sky to find,
            and one that both halves of the world can see. The Greeks drew a hunter here. In Egypt
            it was the god Osiris, and across Latin America the three belt stars are the Three
            Marys.

      - id: orion-from-the-side
        target: {sky: [83.8, 0.0], depth_ly: 650}
        # Twenty degrees aside to arrive, where the hunter is bent but still a hunter, then the
        # drift carries on round to fifty and he is streaks. Arriving at fifty-five (rendered
        # 2026-10-05) showed only the streaks, with nothing to recognise them by.
        distance_km: 8514657425322720
        aside_deg: 20
        figures: [Ori]
        figure_stars: 4
        drift_deg: 30
        drift_rate_deg_s: 2
        chapter: "The northern winter sky"
        card:
          title: "Orion, seen from the side"
          body: >-
            Now leave home. Bellatrix, the hunter's shoulder, is two hundred and fifty light-years
            from us. Betelgeuse is five hundred, and the middle star of the belt nearly two
            thousand. The hunter is a line of sight, not a place: from here, hundreds of
            light-years to one side, nobody would draw him.

      - id: taurus
        target: {sky: [64.0, 20.0]}
        figures: [Tau]
        figure_stars: 2
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The northern winter sky"
        card:
          title: "The bull and the Seven Sisters"
          body: >-
            Follow Orion's belt up and to the right and you reach the orange eye of the bull,
            Aldebaran, and past it a small knot of blue stars. They are the Pleiades, a real
            family of stars that were born together. Japan calls them Subaru, and for Māori their
            return before dawn, as Matariki, begins the new year.

      - id: gemini
        target: {sky: [104.0, 23.0]}
        figures: [Gem]
        figure_stars: 2
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The northern winter sky"
        card:
          title: "The twins"
          body: >-
            Two bright stars side by side, Castor and Pollux, are the heads of twin brothers
            standing in the Milky Way. They only look like twins. Pollux is an orange giant
            thirty-four light-years away. Castor is fifty-one, and is really six stars circling
            one another.

      - id: leo
        target: {sky: [160.0, 17.0]}
        figures: [Leo]
        figure_stars: 2
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The sky of spring"
        card:
          title: "The lion"
          body: >-
            A backwards question mark for the mane and a triangle for the hindquarters: the lion is
            one of the few figures that looks like its name. The bright star at its chest is
            Regulus, the little king. The Sun passes right beside it every August.

      - id: plough
        target: {sky: [186.0, 69.0]}
        zoom: 0.78
        figures: [UMa, UMi]
        figure_stars: 2
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "Round the pole"
        card:
          title: "The Plough, and the way north"
          body: >-
            Seven stars that Britain calls the Plough, America the Big Dipper and much of Europe a
            wagon: they are the back and tail of the Great Bear. Take the two stars at the end of
            the bowl and follow them up, five times their own gap. That lone star is Polaris, and it
            sits almost exactly over the Earth's north pole.

      - id: cassiopeia
        target: {sky: [15.0, 62.0]}
        figures: [Cas]
        figure_stars: 3
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "Round the pole"
        card:
          title: "Cassiopeia, across the pole"
          body: >-
            Go straight on past Polaris, as far again, and you meet a letter W of five stars:
            Cassiopeia, a queen in the Greek story. She and the Plough sit on opposite sides of the
            pole and swing round it like the two ends of a seesaw, so when one is low the other is
            high.

      - id: summer-triangle
        target: {sky: [296.0, 27.0]}
        zoom: 0.85
        figures: [Lyr, Cyg, Aql]
        figure_stars: 1
        exposure: deep
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The northern summer sky"
        card:
          title: "The Summer Triangle"
          body: >-
            Three bright stars from three different figures: Vega in the Lyre, Deneb in the Swan,
            Altair in the Eagle. The pale band running between them is the Milky Way, shown as a
            long exposure would catch it. In China it is the Silver River, which parts the Weaver
            Girl, Vega, from the Cowherd, Altair.

      - id: scorpius
        target: {sky: [253.0, -32.0]}
        zoom: 0.9
        figures: [Sco]
        figure_stars: 2
        exposure: deep
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The southern sky"
        card:
          title: "The scorpion"
          body: >-
            A red heart, and a long curved tail with a sting at the end. The heart is Antares, a
            star so large that it would swallow the orbit of Mars. In the Greek story this is the
            scorpion that killed Orion, which is why the two are never in the sky together. In
            Hawaii the same stars are the fish hook of Maui.

      - id: sagittarius
        target: {sky: [279.0, -28.0]}
        figures: [Sgr]
        figure_stars: 2
        exposure: deep
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The southern sky"
        card:
          title: "The teapot, and the centre of the galaxy"
          body: >-
            The archer's brightest stars make a teapot, and the Milky Way rises from its spout like
            steam. Look just past the spout and you are looking at the centre of our galaxy, about
            twenty-seven thousand light-years away, hidden behind dust. Every star named on this
            trip is in our own small corner of it.

      - id: southern-cross
        target: {sky: [196.0, -52.0]}
        zoom: 0.82
        figures: [Cru, Cen]
        figure_stars: 2
        exposure: deep
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The southern sky"
        card:
          title: "The Southern Cross"
          body: >-
            The smallest of the eighty-eight constellations, and the best known south of the
            equator. Australia, New Zealand, Brazil, Papua New Guinea and Samoa all fly it on their
            flags. The two bright stars beside it are the Pointers, and the nearer is Alpha Centauri,
            the closest star system to the Sun. The dark patch at the foot of the Cross is the head
            of the Emu that Aboriginal Australians see in the Milky Way.

      - id: zodiac
        target: {sky: [256.0, -20.0]}
        zoom: 0.7
        figures: [Sco, Oph, Sgr, Lib]
        figure_stars: 0
        ecliptic: true
        drift_deg: 8
        drift_rate_deg_s: 0.5
        chapter: "The Sun's road"
        card:
          title: "The zodiac"
          body: >-
            The dashed line is the path the Sun takes across the stars in a year. The Moon and the
            planets never stray far from it, because the Solar System is nearly flat. The figures
            along it are the zodiac. Babylonian sky watchers counted twelve; the line really crosses
            thirteen, and the one left out is here: Ophiuchus, the serpent bearer.

  # =============================================================================================
  # THE LIVING EARTH (2026-10-05). Ivan: "a trip about earth and its weather ... how other planets
  # and space affect it, how water flows affect it, how nature affects it ... pollution, plankton,
  # cycles of the world ... real storms with lightning, real northern lights".
  #
  # WHAT IS REAL IN IT. Stops 4 and 10 are today's: the clouds (NASA GIBS, three weather
  # satellites), the named storms (GDACS), the lightning (NOAA) and the aurora forecast (NOAA
  # OVATION), each under the sentence its own module writes about its age (`live_note:`). Stops 5 to
  # 8 lay one measured map over the globe (`overlay:`, registry/overlays.yaml), with its legend,
  # the day it is of and whose data it is, generated under the card. Stops 1 and 2 are computed:
  # the Sun's true direction at the two solstices of 2027. The rest is the map as it always is.
  #
  # THE TWO SOLSTICES ARE WRITTEN DATES (2027-06-21 and 2027-12-22, USNO "Earth's Seasons"), because
  # registry/events.yaml has no solstice to refer to; the picture is the same at any year's, and
  # the frame prints the instant. `over: [lat, lon]` puts the camera above the place a stop is about,
  # and `over: [lat, midnight]` above the meridian that faces away from the Sun.
  #
  # FACTS. Tilt 23.44 degrees (IAU). Three quarters of the air's mass below about 11 km (US
  # Standard Atmosphere 1976); 11 km on a 220 mm football is 0.19 mm, two sheets of paper. GOES
  # and Himawari full discs every ten minutes (NOAA, JMA). About 86 % of evaporation is from the
  # sea (Trenberth et al. 2007, J. Hydrometeorology 8, 758). Phytoplankton make about half of the
  # planet's photosynthesis (Field et al. 1998, Science 281, 237). Arctic sea ice: about 15
  # million km2 at the March maximum, Europe 10.2; the September minimum has fallen by more than a
  # third since 1979 (NSIDC Sea Ice Index). Saharan dust and the Amazon: Yu et al. 2015, GRL 42,
  # 1984. Tides and the slowing day: Stephenson, Morrison and Hohenkerk 2016, Proc. R. Soc. A 472.
  # The Moon and the tilt: Laskar, Joutel and Robutel 1993, Nature 361, 615, which is why the card
  # says "is thought to". Jupiter, 318 Earth masses; shield or not: Horner and Jones 2008-2010,
  # Int. J. Astrobiology, who found it does both, which is what the card says. The farthest people
  # have been: Apollo 13, 400 171 km (NASA).
  # =============================================================================================
  - id: the-living-earth
    title: "The living Earth"
    blurb: "One planet's cycles with today's data: storms, sea, ice. It moves the clock."
    group: earth-orbit
    next: satellites-and-junk
    requires: [worlds, storms, lightning, aurora]
    stage: earth
    clock: as-found
    og_stop: 5
    stops:
      - id: tilt
        target: {world: earth}
        frame_radii: 3.4
        key_light_deg: 90
        time: 2027-06-21T12:00:00Z
        rate: 1800
        drift_deg: 0
        chapter: "The Sun and the seasons"
        card:
          title: "A tilted world"
          body: >-
            The Earth leans over by twenty-three degrees, and keeps leaning the same way all year.
            Here the north is tipped towards the Sun: the Arctic has daylight round the clock, and
            the line between day and night crosses the map at a slant. That lean, and nothing else,
            makes the seasons.

      - id: half-a-year-on
        target: {world: earth}
        frame_radii: 3.4
        key_light_deg: 90
        time: 2027-12-22T12:00:00Z
        rate: 1800
        drift_deg: 0
        chapter: "The Sun and the seasons"
        card:
          title: "Half a year on"
          body: >-
            Six months later the Earth is on the far side of the Sun, still leaning the same way,
            so now it is the south that faces the light. Antarctica has the midnight Sun and the
            Arctic is dark all day. The Sun sends the same energy as before; the tilt decides who
            gets it.

      - id: air
        target: {world: earth}
        # Side-lit, the whole disc in frame, so the lit limb and its blue line are in the picture.
        # Rendered 2026-10-05: at 1.45 radii and 150 degrees the camera sat over the night side and
        # the frame was black; at 2.1 and 115 the disc overflowed the frame and the limb was under
        # the card.
        frame_radii: 3.0
        key_light_deg: 95
        time: now
        chapter: "Air and water"
        card:
          title: "The thin blue line"
          body: >-
            Everything we call weather happens inside that blue line. Three quarters of the air is
            in the first eleven kilometres, a layer so thin that on a globe the size of a football
            it would be about as thick as two sheets of paper. It is the only air there is.

      - id: weather
        target: {world: earth}
        over: [16, -78]
        frame_radii: 2.6
        time: now
        live_note: clouds
        drift_deg: 20
        drift_rate_deg_s: 2
        chapter: "Air and water"
        card:
          title: "Today's weather"
          body: >-
            These are today's clouds, from weather satellites that take a picture every ten
            minutes. A tropical storm that has a name today is marked with it. Where thunderstorms
            are in view over the Americas, the flashes are lightning at the rate it was measured in
            the last quarter of an hour, drawn larger than life.

      - id: ocean
        target: {world: earth}
        over: [32, -48]
        frame_radii: 2.6
        overlay: sea-temperature
        drift_deg: 20
        drift_rate_deg_s: 2
        chapter: "Air and water"
        card:
          title: "The sea moves the heat"
          body: >-
            The colours are the temperature of the sea, measured from orbit. Water warmed in the
            tropics does not stay there: currents such as the Gulf Stream carry it towards the
            poles, and it gives up heat and water to the air on the way. Most of the water in the
            air was lifted off a warm sea.

      - id: plankton
        target: {world: earth}
        over: [5, -28]
        frame_radii: 2.8
        overlay: chlorophyll
        drift_deg: 20
        drift_rate_deg_s: 2
        chapter: "Life"
        card:
          title: "The sea in bloom"
          body: >-
            Green and yellow are water rich in plankton, plants too small to see that drift in the
            sunlit top of the sea. They bloom where currents bring food up from below. Between them
            they do about half of all the growing on the planet, and with the forests they breathe
            its carbon in and out every year.

      - id: ice
        target: {world: earth}
        over: [80, -20]
        frame_radii: 2.4
        overlay: sea-ice
        drift_deg: 20
        drift_rate_deg_s: 2
        chapter: "Life"
        card:
          title: "The ice breathes"
          body: >-
            The bright colours are sea frozen over. Each winter the ice around the north pole grows
            until it covers more than the whole of Europe, and each summer about two thirds of it
            melts again. The summer ice has shrunk by more than a third since satellites began to
            watch it.

      - id: haze
        target: {world: earth}
        over: [18, 15]
        frame_radii: 2.8
        overlay: aerosol
        drift_deg: 20
        drift_rate_deg_s: 2
        chapter: "Life"
        card:
          title: "Dust, smoke and us"
          body: >-
            This is everything fine enough to hang in the air: desert dust, smoke from fires, salt
            from the sea, and the haze of cities and industry. Dust from the Sahara crosses the
            Atlantic and feeds the Amazon. The gas that warms the planet most, carbon dioxide, does
            not show here at all. It is invisible, and it is everywhere.

      - id: moon
        target: {world: moon}
        distance_km: 12000
        behind: earth
        time: now
        rate: 60
        chapter: "From outside"
        card:
          title: "The Moon's pull"
          body: >-
            The Moon pulls on the sea, and the sea rises towards it and on the far side too, so
            most coasts have two high tides a day. Over billions of years the same pull has slowed
            the Earth's spin. And the Moon is thought to hold the Earth's tilt steady, which keeps
            the seasons mild.

      - id: aurora
        target: {world: earth}
        # Above the night side at seventy north, whichever longitude has the night when the
        # visitor arrives: the whole ring is in the picture. From the equator's side (rendered
        # 2026-10-05, key light 165) it was a sliver on the limb of a black disc.
        over: [70, midnight]
        frame_radii: 2.4
        time: now
        needs_layer: aurora
        live_note: aurora
        chapter: "From outside"
        card:
          title: "The Sun's wind"
          body: >-
            The Sun blows a thin wind of charged particles past us all the time. The Earth's
            magnetic field turns most of it aside and funnels some down around the poles, where it
            makes the upper air glow. The green rings are where the aurora is expected in the next
            hour, from today's forecast.

      - id: jupiter
        target: {world: jupiter}
        stage: jupiter
        frame_radii: 4
        key_light_deg: 60
        chapter: "From outside"
        card:
          title: "Jupiter, bodyguard or not"
          body: >-
            Jupiter has three hundred times the mass of the Earth, and its pull rules the traffic
            of comets and asteroids. It throws many of them out of the Solar System before they can
            reach us, and it also sends some our way. Bodyguard or troublemaker: the sums are still
            being done.

      - id: home
        target: {world: earth}
        frame_radii: 14
        behind: moon
        key_light_deg: 60
        time: now
        chapter: "From outside"
        card:
          title: "One small world"
          body: >-
            From here the storms, the currents, the ice and the forests are one thin skin on one
            small world. Nothing we know of anywhere else has all of them. The Moon, four hundred
            thousand kilometres off, is the farthest any person has ever been from it.

  # =============================================================================================
  # THE FIVE TRIPS A PLANETARIUM HAS AND WE DID NOT (2026-10-06; the review of 2026-10-05 ranked
  # them: tonight from your street, the Moon's phases, the Sun today, Mars, the planets tonight).
  # Written for the ear: the voice reads every card, so the sentences are short and a number is
  # said the way a person says it.
  #
  # THE STOP GRAMMAR THEY BROUGHT, all refused where the picture could not keep the promise
  # (scripts/check_registry.py):
  #   look:       on a stop at the visitor's place, what the sky view turns to FROM THEIR OWN
  #               GROUND: {world: moon}, {best: planet | star | figure}, {sky: [ra, dec]},
  #               {pass: true}. sky/lookfor.js finds it for that place and instant, and the line
  #               under the card says what was found and where, or that it is not up. The card
  #               may not name the answer: it is a different one for every visitor.
  #   time: tonight   the coming dark at the visitor's place, or now when it is dark already.
  #   seen_from:  the world the camera stands on the side of, kept there while the clock runs.
  #   over:       now on any world with a ground, not the Earth alone.
  #   live_note:  season (Mars, by the date on the clock), space-weather (NOAA's reading, with
  #               its age), tonight (one planet in the visitor's sky in the coming dark).
  #
  # EVERY FACT, read 2026-10-06 unless a line says otherwise:
  #   Mars  https://science.nasa.gov/mars/facts/ : "about half the size of Earth", "one rotation
  #         every 24.6 hours", "tilted 25 degrees", "687 Earth days", Olympus Mons "the base
  #         covering an area as large as Arizona", Valles Marineris "about 2,400 miles in length
  #         ... about 5.8 miles at its deepest" (3 900 km, 9 km), Phobos "will crash into the
  #         planet or break apart in about 50 million years". The landers' own dates and
  #         distances are registry/sites.yaml's, each with its source there.
  #   Sun   https://science.nasa.gov/sun/facts/ : "about 100 times wider than Earth", "1.3
  #         million Earths", "99.8% of our solar system's mass", "formed about 4.6 billion years
  #         ago", "another 5 billion years or so", "one rotation in 25 Earth days" at the equator.
  #   Moon  https://science.nasa.gov/moon/moon-phases/ : "The Sun always illuminates half of the
  #         Moon", "every 29.5 days", "it spins on its axis exactly once each time it orbits",
  #         "The 5 degree tilt of the Moon's orbit", "Every day, the Moon rises a little bit later".
  # THE SEVEN FIGURES THIS BLOCK ONCE LISTED AS NOT RE-READ were read on 2026-10-06, later the same
  # day, and two cards changed. The slow solar wind, "about 400 kilometers per second"
  # (https://www.spaceweather.gov/phenomena/solar-wind). A cloud from the Sun: "The fastest
  # Earth-directed CMEs can reach our planet in as little as 15-18 hours. Slower CMEs can take
  # several days" (https://www.spaceweather.gov/phenomena/coronal-mass-ejections), so the card's
  # "one to three days" became "from under a day to several days". InSight "detected 1,319
  # marsquakes" (https://www.jpl.nasa.gov/news/nasa-retires-insight-mars-lander-mission-after-years-of-science/).
  # Ingenuity, "72 historic flights" (https://science.nasa.gov/mission/mars-2020-perseverance/ingenuity-mars-helicopter/).
  # Luna 3, "the first mission to photograph the far side of the Moon", 7 October 1959 (Wikipedia,
  # Luna 3). Uranus: "the Sun shines directly over each pole, plunging the other half of the planet
  # into a 21-year-long, dark winter" (https://science.nasa.gov/uranus/facts/), which is what the
  # card now says in place of "forty-two years of daylight". The Sun's 8 minutes 20 seconds is the
  # one still not on a page read today: it is the astronomical unit over the speed of light, 499 s.
  # =============================================================================================

  # ---------------------------------------------------------------------------------------------
  # TONIGHT FROM YOUR STREET (public #445). Every stop after the first is seen from the ground, so
  # this trip is as good as sky/skyview.js is, and gets better when that does: nothing here says
  # where anything is. The first stop names the place and how it was got (ui/trip.js noteFor).
  # ---------------------------------------------------------------------------------------------
  - id: tonight-from-your-street
    title: "Tonight from your street"
    blurb: "Your own sky tonight: a star, a figure, the Moon, a planet, the station's pass."
    group: earth-orbit
    next: planets-tonight
    requires: [stations]
    requires_observer: true
    stage: earth
    clock: as-found
    og_stop: 2
    stops:
      - id: above
        target: {observer: true}
        # 6 000 km up, not 200: the night map is 10 km to a pixel at its best (20 on a small
        # GPU), and from 200 km the visitor's own town was sixteen blurred squares across the
        # whole screen (the regression walk of 2026-10-06: the first picture of a trip the home
        # view offers). From here it is their part of the world with the dark arriving across
        # it, which is what the card says it is.
        distance_km: 6000
        time: tonight
        drift_deg: 20
        chapter: "Before you go outside"
        card:
          title: "Your street, as tonight begins"
          body: >-
            This is your part of the world as tonight's dark arrives. In a moment we go down to the
            ground and look up. Everything you are about to see is worked out for this place and
            this night, so you can go outside and check it.

      - id: star
        target: {observer: true}
        distance_km: 200
        look: {best: star}
        # On every stop, not only the first: a link into stop 3 starts here, and the sky must still be tonight's.
        time: tonight
        chapter: "Looking up"
        card:
          title: "The first star you will notice"
          body: >-
            As the sky darkens, the brightest stars come out first. A star twinkles because its
            light is a single point, pushed about by moving air. Its colour is its temperature:
            the bluish ones are hotter than the Sun, the orange ones cooler.

      - id: figure
        target: {observer: true}
        distance_km: 200
        look: {best: figure}
        time: tonight
        chapter: "Looking up"
        card:
          title: "A figure to find"
          body: >-
            The lines join stars into the figures people have told stories about for thousands of
            years. Learn one and you can find the next from it, the way you learn a town from one
            street. The line below names the one that is best placed for you right now.

      - id: moon
        target: {observer: true}
        distance_km: 200
        look: {world: moon}
        time: tonight
        zoom: 4
        chapter: "Looking up"
        card:
          title: "The Moon"
          body: >-
            The Moon rises about fifty minutes later each night, so it is not always in the
            evening sky. When it is, point any binoculars at the line between its light and its
            dark. That is where the mountains and craters throw their longest shadows.

      - id: planet
        target: {observer: true}
        distance_km: 200
        look: {best: planet}
        time: tonight
        chapter: "Looking up"
        card:
          title: "A planet, if one is up"
          body: >-
            A planet looks like a bright star that does not twinkle. Planets drift against the
            stars from month to month, which is what the word first meant: a wanderer.

      - id: pass
        target: {observer: true}
        distance_km: 200
        look: {pass: true}
        time: {event: station-pass.next, offset_s: -15}
        needs_layer: stations
        chapter: "Something that moves"
        card:
          title: "The space station, crossing"
          body: >-
            This is the next time the space station comes over your place. When it can be seen, it
            is a bright, steady light gliding across the sky for a few minutes, with no flashing
            lights. That light is the Sun on its solar panels, and there are people inside.

      - id: out
        target: {observer: true}
        # As the first stop, and for the same reason: the end card stays on this view.
        distance_km: 6000
        time: now
        drift_deg: 15
        chapter: "Something that moves"
        card:
          title: "Now go and look"
          body: >-
            That is tonight, from where you are. The sky you saw is already turning: come back in
            an hour and every star has moved a hand's width to the west. None of it needs a
            telescope. It needs ten minutes for your eyes to get used to the dark.

  # ---------------------------------------------------------------------------------------------
  # WHY THE MOON CHANGES SHAPE (internal #363). The month is January 2027's, new Moon to new Moon
  # (astronomy-engine SearchMoonPhase: new 7 Jan 20:25, first quarter 15 Jan 20:35, full 22 Jan
  # 12:18, last quarter 29 Jan 10:56 UTC), run at ten hours a second, the fastest a world's stage
  # allows: a stop of twenty seconds is eight days, so three stops carry the Moon round. Each
  # names its own start, because the voice holds a stop for its clip and the clock would otherwise
  # arrive at the next one wherever the last one's length left it.
  #
  # THE FIRST PICTURE IS THE HONEST ONE AND IT IS SMALL: from far enough to hold the Moon's whole
  # path, the Earth is nine pixels and the Moon two. The card says so; that distance is the point.
  # ---------------------------------------------------------------------------------------------
  - id: moon-phases
    title: "Why the Moon changes shape"
    blurb: "The Moon's month from space, then from your street. This trip moves the clock."
    group: earth-orbit
    next: tonight-from-your-street
    requires: [worlds]
    requires_observer: true
    stage: earth
    clock: as-found
    og_stop: 3
    stops:
      - id: from-outside
        target: {world: earth}
        over: [90, 0]
        distance_km: 1000000
        time: 2027-01-08T12:00:00Z
        rate: 36000
        drift_deg: 0
        chapter: "From outside"
        card:
          title: "The Earth and the Moon, to scale"
          body: >-
            We are far above the north pole, with both worlds at their true sizes and their true
            distance. The Moon is the small dot, thirty Earths away, and it takes a month to go
            once round. The Sun lights half of each of them, all the time.

      - id: waxing
        target: {world: moon}
        seen_from: earth
        frame_radii: 5.2
        # Three days after new, 9 % lit: a day earlier the crescent is too thin to draw (the walk of
        # 2026-10-06 showed a black disc under "a sliver that grows").
        time: 2027-01-10T12:00:00Z
        rate: 36000
        drift_deg: 0
        chapter: "The month, as the Earth sees it"
        card:
          title: "A sliver that grows"
          body: >-
            Now the Moon as the Earth sees it, with ten hours passing every second. Just after new
            Moon it stands almost between us and the Sun, so its lit half faces away and we see
            only a thin edge. Each evening it has moved a little further round, and shows us more.

      - id: full
        target: {world: moon}
        seen_from: earth
        frame_radii: 5.2
        time: 2027-01-15T12:00:00Z
        rate: 36000
        drift_deg: 0
        chapter: "The month, as the Earth sees it"
        card:
          title: "Half, then full"
          body: >-
            A week after new we see half of the lit side. That is called the first quarter. A week
            later the Moon is on the far side of the Earth from the Sun, and the whole face we see
            is in daylight. That is full Moon, and it rises as the Sun sets.

      - id: waning
        target: {world: moon}
        seen_from: earth
        frame_radii: 5.2
        time: 2027-01-23T12:00:00Z
        rate: 36000
        drift_deg: 0
        chapter: "The month, as the Earth sees it"
        card:
          title: "And back again"
          body: >-
            After full, the dark comes in from the other edge. The Moon rises later every night,
            until it is a thin crescent in the dawn. Twenty-nine and a half days after it began,
            it is new again.

      - id: far-side
        target: {world: moon}
        distance_km: 12000
        behind: earth
        # The day before the next new Moon, when the far side is the lit one. Written, because the
        # stops before it run the clock for as long as their words take, which nobody can know here.
        time: 2027-02-05T12:00:00Z
        rate: 600
        chapter: "Two things people get wrong"
        card:
          title: "The side we never see"
          body: >-
            The Moon turns once for every trip round the Earth, so the same face always looks at
            us. This is the other one. It gets just as much sunlight as the side we know: there
            is no dark side of the Moon, only a far side.

      - id: shadow
        target: {world: moon}
        seen_from: earth
        frame_radii: 4
        key_light_deg: 0
        time: {event: lunar-eclipse.next, kind: total, offset_s: -3600}
        rate: 600
        drift_deg: 0
        chapter: "Two things people get wrong"
        card:
          title: "The phases are not the Earth's shadow"
          body: >-
            This is the Earth's shadow on the Moon, and it is rare. The Moon's path is tilted five
            degrees against ours, so at most full Moons it passes above or below the shadow. A
            few times a year they line up, and that is a lunar eclipse.

      - id: tonight
        target: {observer: true}
        distance_km: 200
        look: {world: moon}
        zoom: 5
        time: tonight
        chapter: "From your street"
        card:
          title: "The Moon over you tonight"
          body: >-
            This is the Moon from your own ground tonight. The lit side always points at the Sun,
            even when the Sun has set. Look again tomorrow at the same hour: it will be a little
            further east, and a little different in shape.

  # ---------------------------------------------------------------------------------------------
  # THE SUN TODAY (internal #364). What is TODAY's here is NOAA's reading of the Earth's magnetic
  # weather and its aurora forecast, both of which the app already fetches. The Sun's face is a
  # map (registry/textures.yaml), not today's picture, and the first card says so: a dated image
  # of the Sun and a sunspot count wait for internal #153 and #154.
  # ---------------------------------------------------------------------------------------------
  - id: the-sun-today
    title: "The Sun today"
    blurb: "Our star, its wind, and tonight's aurora forecast. Leaving goes back to Earth."
    group: solar-system
    next: planets-tonight
    requires: [worlds, aurora]
    stage: sun
    clock: as-found
    orbits: [mercury, venus, earth, mars]
    og_stop: 1
    stops:
      - id: star
        target: {world: sun}
        frame_radii: 3.2
        time: now
        rate: 36000
        chapter: "The star itself"
        card:
          title: "Our star"
          body: >-
            The Sun is a ball of glowing gas about a hundred Earths wide, and it holds nearly all
            the mass of the Solar System. It turns once in about twenty-five days. The face drawn
            here is a map of its surface, not a picture taken today.

      - id: spots
        target: {world: sun}
        frame_radii: 1.7
        rate: 36000
        drift_deg: 20
        chapter: "The star itself"
        card:
          title: "Spots, and an eleven-year beat"
          body: >-
            Dark spots come and go on this surface. Each is a place where the Sun's magnetism is
            strong enough to hold back the heat, and many are larger than the Earth. Their number
            rises and falls about every eleven years, and so do the Sun's outbursts.

      - id: eight-minutes
        target: {world: sun}
        distance_km: 430000000
        time: now
        rate: 36000
        drift_deg: 0
        chapter: "What reaches us"
        card:
          title: "Eight minutes away"
          body: >-
            These are the paths of the four inner planets, and the third dot is home. Sunlight
            takes eight minutes and twenty seconds to get there, so we always see the Sun as it
            was eight minutes ago. A cloud of gas thrown out by the Sun takes from under a day to
            several days.

      - id: wind
        target: {world: earth}
        stage: earth
        frame_radii: 5
        key_light_deg: 70
        time: now
        live_note: space-weather
        chapter: "What reaches us"
        card:
          title: "The wind that never stops"
          body: >-
            The Sun blows a thin wind of charged particles in every direction, at about four
            hundred kilometres a second. The Earth's magnetic field turns most of it aside. When
            a larger cloud arrives, the field shakes. That is a magnetic storm, and it is
            measured every three hours.

      - id: aurora
        target: {world: earth}
        stage: earth
        over: [70, midnight]
        frame_radii: 2.4
        time: now
        needs_layer: aurora
        live_note: aurora
        chapter: "What reaches us"
        card:
          title: "Where it comes down"
          body: >-
            Some of the wind is funnelled down around the magnetic poles, where it makes the upper
            air glow. The green rings are where the aurora is expected in the next hour, from
            today's forecast. In a strong storm they widen, and people far from the poles see
            the lights.

      - id: scale
        target: {world: sun}
        frame_radii: 6
        time: now
        chapter: "How big, how long"
        card:
          title: "A million Earths"
          body: >-
            Jupiter, the largest planet, is a tenth as wide as the Sun. More than a million Earths
            would fit inside it. No screen can show them side by side: with the Sun at this size,
            the Earth would be a speck.

      - id: home
        target: {world: earth}
        stage: earth
        frame_radii: 14
        key_light_deg: 60
        time: now
        chapter: "How big, how long"
        card:
          title: "Living with a star"
          body: >-
            Everything alive here runs on that light. The Sun is about halfway through its life:
            four and a half billion years old, with some five billion to go. Never look straight
            at it. The safe way to see the Sun is by its light on everything else.

  # ---------------------------------------------------------------------------------------------
  # THE PLANETS TONIGHT (internal #365). Each planet is visited where it is tonight, on its own
  # stage and at its true size, and the line under its card says when and where it is in the
  # visitor's own sky in the coming dark, or why it is not (`live_note: tonight`). The cards are
  # about how each one LOOKS from a street, which is true on any night; what is true only
  # tonight is in the generated line. The last stop is the visitor's ground, facing the brightest.
  # ---------------------------------------------------------------------------------------------
  - id: planets-tonight
    title: "The planets tonight"
    blurb: "Every planet in turn, then where to look tonight. Leaving goes back to Earth."
    group: solar-system
    next: mars-where-we-have-driven
    requires: [worlds]
    requires_observer: true
    stage: sun
    clock: as-found
    orbits: [mercury, venus, earth, mars, jupiter, saturn]
    og_stop: 6
    stops:
      - id: where
        target: {world: sun}
        distance_km: 3800000000
        time: tonight
        drift_deg: 0
        chapter: "From above"
        card:
          title: "Where they all are tonight"
          body: >-
            This is the Solar System from above, as it is tonight. Each dot is a planet at its
            true place on its path. Which ones you can see depends on where the Earth is among
            them: a planet on the far side of the Sun from us is lost in its glare.

      - id: mercury
        target: {world: mercury}
        stage: mercury
        frame_radii: 4
        key_light_deg: 55
        time: tonight
        live_note: tonight
        chapter: "The inner planets"
        card:
          title: "Mercury"
          body: >-
            The smallest planet and the closest to the Sun, so it never strays far from the Sun in
            our sky. It shows only low in the twilight, for a few weeks at a time. One day here,
            from sunrise to sunrise, lasts two of its years.

      - id: venus
        target: {world: venus}
        stage: venus
        frame_radii: 4
        key_light_deg: 55
        time: tonight
        live_note: tonight
        chapter: "The inner planets"
        card:
          title: "Venus"
          body: >-
            The brightest thing in the night sky after the Moon, and the one people call the
            evening star or the morning star. It is the size of the Earth, wrapped in cloud that
            throws most of its sunlight back. In a small telescope it shows phases, like the Moon.

      - id: mars
        target: {world: mars}
        stage: mars
        frame_radii: 4
        key_light_deg: 55
        time: tonight
        live_note: tonight
        chapter: "The inner planets"
        card:
          title: "Mars"
          body: >-
            A steady orange point. Mars is bright for a few months every two years, when the Earth
            catches it up and passes it on the inside, and much fainter the rest of the time.

      - id: jupiter
        target: {world: jupiter}
        stage: jupiter
        frame_radii: 4
        key_light_deg: 55
        time: tonight
        live_note: tonight
        chapter: "The giants"
        card:
          title: "Jupiter"
          body: >-
            Brighter than any star, and white. Hold binoculars still and you will see up to four
            small points in a line beside it. They are its largest moons, the ones Galileo found,
            and they change places from night to night.

      - id: saturn
        target: {world: saturn}
        stage: saturn
        frame_radii: 5
        key_light_deg: 55
        time: tonight
        live_note: tonight
        chapter: "The giants"
        card:
          title: "Saturn"
          body: >-
            A calm, yellowish point, about as bright as the brightest stars. The rings need a small
            telescope. About every fifteen years they turn edge-on to us and almost vanish,
            because they are thousands of times wider than they are thick.

      - id: uranus
        target: {world: uranus}
        stage: uranus
        frame_radii: 4
        key_light_deg: 55
        time: tonight
        live_note: tonight
        chapter: "The giants"
        card:
          title: "Uranus"
          body: >-
            Just too faint for most eyes, though binoculars will find it if you know where to
            look. It was the first planet discovered with a telescope. It lies on its side, so
            for a quarter of its long year the Sun shines down on one pole, while the other half
            of the planet has a dark winter twenty-one years long.

      - id: neptune
        target: {world: neptune}
        stage: neptune
        frame_radii: 4
        key_light_deg: 55
        time: tonight
        live_note: tonight
        chapter: "The giants"
        card:
          title: "Neptune"
          body: >-
            Never visible without a telescope. It was found with a pencil first: astronomers
            worked out where it must be from the way it pulled on Uranus, and there it was. Its
            light takes four hours to reach us.

      - id: your-sky
        target: {observer: true}
        distance_km: 200
        look: {best: planet}
        time: tonight
        chapter: "From your street"
        card:
          title: "Your own sky tonight"
          body: >-
            This is your sky tonight, facing the brightest planet that is up. The planets all
            keep close to one line across the sky, the same path the Sun took during the day. Find
            one, and the others will be somewhere along it.

  # ---------------------------------------------------------------------------------------------
  # MARS, WHERE WE HAVE DRIVEN (public #445). On Mars's own stage, so the close-up tiles of spec
  # 0065 (registry/tilesets.yaml mars-themis-day-ir) come in under the two stops that stand over a
  # landform, and the landers are registry/sites.yaml rows with the models of registry/models.yaml.
  # The order is the order we went: the first to stay, the rover that outlived its ninety days,
  # the two that are still driving, the one that listened.
  # ---------------------------------------------------------------------------------------------
  - id: mars-where-we-have-driven
    title: "Mars, where we have driven"
    blurb: "A volcano, a canyon, five landing sites and a moon. Leaving goes back to Earth."
    group: solar-system
    next: asteroids-that-come-close
    requires: [hand-kept-sites, worlds]
    stage: mars
    clock: as-found
    og_stop: 1
    stops:
      - id: planet
        target: {world: mars}
        frame_radii: 4
        key_light_deg: 55
        chapter: "The planet"
        card:
          title: "The red planet"
          body: >-
            Mars is half as wide as the Earth, and its day is forty minutes longer than ours. The
            red is rust: iron in the dust, which the wind spreads over the whole planet. Machines
            have been landing here for fifty years, and two rovers are still driving.

      - id: olympus
        target: {world: mars}
        over: [18.65, -133.8]
        frame_radii: 1.6
        time: daylight
        drift_deg: 10
        drift_rate_deg_s: 1
        chapter: "The planet"
        card:
          title: "Olympus Mons"
          body: >-
            The largest volcano we know of on any planet. It is more than twenty kilometres high,
            and its base would cover Arizona. Mars has no moving plates, so the lava kept piling up
            in one place for a very long time.

      - id: valles
        target: {world: mars}
        over: [-13.9, -59.2]
        frame_radii: 1.7
        time: daylight
        drift_deg: 10
        drift_rate_deg_s: 1
        chapter: "The planet"
        card:
          title: "Valles Marineris"
          body: >-
            A canyon nearly four thousand kilometres long, which on Earth would reach from one
            side of the United States to the other. In places it is nine kilometres deep. It began
            as a crack, when the volcanoes beside it swelled and the ground split.

      - id: viking-1
        target: {site: viking-1}
        distance_km: 900
        time: daylight
        chapter: "Where we landed"
        card:
          title: "The first to stay"
          body: >-
            Viking 1 landed here in the summer of 1976 and worked for six years. Its twin came
            down on the other side of the planet six weeks later. They tested the soil for life,
            and the answer was unclear. That is why we kept coming back.

      - id: opportunity
        target: {site: opportunity}
        distance_km: 900
        time: daylight
        chapter: "Where we landed"
        card:
          title: "Built for ninety days"
          body: >-
            Opportunity was built to last ninety Martian days. It drove forty-five kilometres in
            more than fourteen years, and found rocks that could only have formed in water. A dust
            storm that covered the whole planet ended it in 2018.

      - id: gale
        target: {site: gale}
        distance_km: 900
        time: daylight
        chapter: "Where we landed"
        card:
          title: "Curiosity, climbing a mountain"
          body: >-
            Curiosity is the size of a small car and runs on the heat of plutonium, so dust on
            solar panels cannot stop it. Since 2012 it has been climbing a mountain of layered
            rock in the middle of this crater, reading a wet Mars turning into a dry one.

      - id: elysium
        target: {site: elysium}
        distance_km: 900
        time: daylight
        chapter: "Where we landed"
        card:
          title: "InSight, listening"
          body: >-
            InSight never moved. It set a seismometer on the ground and listened, and heard more
            than thirteen hundred marsquakes. From the way they echoed, we know Mars has a core
            of liquid metal. Dust covered its solar panels, and it fell silent in 2022.

      - id: jezero
        target: {site: jezero}
        distance_km: 900
        time: daylight
        chapter: "Where we landed"
        card:
          title: "Perseverance, and a helicopter"
          body: >-
            Perseverance landed in this crater in 2021, where a river once ran into a lake. It is
            filling tubes with rock for a later mission to bring home. It carried a small
            helicopter, Ingenuity, which made seventy-two flights: the first powered flights on
            another world.

      - id: phobos
        target: {world: phobos}
        frame_radii: 5
        # Not `behind: mars`: with Mars held behind it the camera was on the night side of both,
        # two black discs (the walk of 2026-10-06). Lit from the front, Mars is in shot when it is.
        key_light_deg: 50
        chapter: "Around it"
        card:
          title: "Phobos, and Deimos"
          body: >-
            Mars has two small moons shaped like potatoes. This is Phobos, about twenty-two
            kilometres across, so close in that it goes round three times a day. Deimos is half
            the size and further out. Phobos is slowly falling: in some fifty million years it
            will break up, or hit Mars.

      - id: seasons
        target: {world: mars}
        over: [72, 0]
        frame_radii: 2.6
        time: daylight
        live_note: season
        chapter: "Around it"
        card:
          title: "Ice, and seasons"
          body: >-
            Mars is tilted about as much as the Earth, so it has seasons, each nearly twice as
            long as ours. Every winter part of its thin air freezes onto the pole as dry-ice
            frost, and every spring it blows away again. Under the frost is a cap of water ice.

  # =============================================================================================
  # THE SHOWS A PLANETARIUM RUNS AND WE STILL LACKED (2026-10-06). Ivan: "I want make sure we have
  # all required planetarium trips for today." Eight trips: the life of a star, black holes, the
  # sky as telescopes see it, a dark sky, asteroids, satellites and junk, comets and meteor
  # showers, the birth of the Solar System. Written for the ear, 20 to 62 words a stop.
  #
  # NO STOP IS WORDS OVER BLACK. Every stop is aimed at something the scene draws: a licensed
  # photograph standing where its nebula is (scene/nebulae.js), a figure drawn over the measured
  # stars, a world, a catalogue, the visitor's own sky. Where the thing itself cannot be seen (a
  # white dwarf beside Sirius, a black hole) the card says so and says what the picture is.
  #
  # THE STOP GRAMMAR THEY BROUGHT, each refused where the picture could not keep the promise
  # (scripts/check_registry.py):
  #   portrait: true   on a stop at a black hole whose registry/exotics.yaml row carries the Event
  #                    Horizon Telescope's picture: the picture is drawn at the hole's place, far
  #                    larger than it would look from the camera, and the line under the card
  #                    says exactly that and whose picture it is (scene/portraits.js).
  #   darkness:        on a `look:` stop, the kind of sky the ground view wears for the stop:
  #                    city | town | dark (sky/skymath.js DARKNESS). Held, never stored.
  #   time: night      the first full dark of the visitor's coming night (the Sun eighteen degrees
  #                    down), where `tonight` is its dusk: the Milky Way is not out at dusk anywhere.
  #   look: {best: milky-way}   the stretch of the Milky Way best placed for the visitor then.
  #   time: midnight   the middle of that night, when a shower's radiant is high.
  #   look: {shower: next}      the radiant of the next meteor shower in registry/showers.yaml,
  #                    marked on the sky view for the stop, with its peak date in the line below.
  #   live_note:       close-approach (the next pass in JPL's table, as the asteroids layer loaded
  #                    it), satellites (the count of the catalogue on screen, and how many of them
  #                    are Starlink), picture is not one: a stop at an object with a photograph
  #                    prints the photograph's credit by itself (ui/trip.js noteFor).
  #   names: true      keeps the other objects' names up in present mode, where a stop is
  #                    otherwise shown with its own subject's name only (internal #400).
  #
  # A PHOTOGRAPH IS SEEN FROM THE SIDE IT WAS TAKEN FROM. `key_light_deg: 0` on a stop at a nebula
  # puts the camera on the line from the Sun to it, which is the one direction scene/nebulae.js
  # draws the picture from (viewFade); from anywhere else it would be a lie about a volume.
  #
  # EVERY NUMBER, DATE AND NAMED CLAIM ON THESE CARDS WAS READ ON THE PAGE NAMED HERE ON
  # 2026-10-06, before the voice was rendered. Where a page did not give a figure the figure was
  # dropped and the idea kept (the first drafts had a count of Orion's young stars, the Sun's four
  # million tonnes a second, Apophis seen from Europe, the five-year deorbit rule: none could be
  # confirmed quickly, and none is on a card). A distance the map's own record states differently
  # from NASA's page (Orion 1 344 against "1,500", the Whirlpool 23 against "31 million") is said
  # in words both agree with. `hubble-messier-catalog/` is
  # https://science.nasa.gov/mission/hubble/science/explore-the-night-sky/hubble-messier-catalog/.
  #   Stars   Orion: "an enormous cloud of dust and gas where vast numbers of new stars are being
  #           forged", "1,500 light-years" (hubble-messier-catalog/messier-42/). Pleiades: "over a
  #           thousand stars that are loosely bound by gravity", the wisps are a cloud moving past
  #           (messier-45/); 75 to 150 million years, "simply passing through a particularly dusty
  #           region" (Wikipedia, Pleiades). Sun: "4.5 billion-year-old", "a little less than
  #           halfway through its lifetime", "hydrogen is fused to form helium"
  #           (https://science.nasa.gov/sun/facts/). "Main sequence stars make up around 90%",
  #           "The Sun will become a red giant in about 5 billion years", a white dwarf "is usually
  #           Earth-size", "Heavier stars produce stellar-mass black holes"
  #           (https://science.nasa.gov/universe/stars/types/). Arcturus: 1.08 solar masses, 25.4
  #           solar radii, "has used up its core hydrogen" (Wikipedia, Arcturus, citing Ramirez and
  #           Allende Prieto 2011). Betelgeuse: "around 15 times more massive", "Roughly 10 million
  #           years old", "it would stretch past Jupiter's orbit", "will, eventually, go supernova"
  #           (https://science.nasa.gov/universe/what-is-betelgeuse-inside-the-strange-volatile-star/).
  #           Helix: "650 light-years", "sculpted late in a Sun-like star's life", "a small,
  #           super-hot white dwarf" (https://science.nasa.gov/missions/hubble/iridescent-glory-of-nearby-helix-nebula/).
  #           Sirius B: "about 10,000 times fainter than Sirius A", "only 12,000 kilometres in
  #           diameter", "98 percent that of our Sun" (https://esahubble.org/images/heic0516a/).
  #           The Crab: "In 1054, Chinese astronomers took notice of a 'guest star' that was, for
  #           nearly a month, visible in the daytime sky", "pulse 30 times per second", the blue
  #           light is electrons round the star's magnetic field (messier-1/). A neutron star:
  #           "about 20 kilometers (12.5 miles) across", "the mass of a sun"
  #           (https://imagine.gsfc.nasa.gov/science/objects/neutron_stars1.html).
  #   Black holes   "nothing - not even light - can escape", "Black holes don't suck in other
  #           matter", "If you replaced the Sun with a black hole of the same mass ... the planets
  #           would stay in their orbits", "Gaia BH1, is about 1,500 light-years away"
  #           (https://science.nasa.gov/universe/black-holes/). Cygnus X-1: "discovered in 1964",
  #           "one of the strongest X-ray sources", "the first such source widely accepted to be a
  #           black hole", "about 21.2 times the mass of the Sun", "about 7,000 light-years"
  #           (Wikipedia, Cygnus X-1). S2 "orbits the black hole every 16 years", "in excess of 25
  #           million kilometres per hour" (https://www.eso.org/public/news/eso1825/). Sagittarius
  #           A*: "27 000 light-years", "four million times more massive than our Sun", "a dark
  #           central region (called a shadow) surrounded by a bright ring-like structure", "eight
  #           existing radio observatories" (https://www.eso.org/public/news/eso2208-eht-mw/). M87:
  #           "6.5 billion times that of the Sun", "eight ground-based radio telescopes", "an
  #           Earth-sized virtual telescope", the event horizon "just under 40 billion km across"
  #           and the shadow 2.5 times that (https://www.eso.org/public/news/eso1907/), against
  #           Neptune's orbit, 9 billion km across.
  #   Telescopes    the three exposures and each picture's filters: registry/nebulae.yaml's own
  #           rows. Carina: "sculpted by the action of outflowing winds and scorching ultraviolet
  #           radiation from the monster stars" (https://esahubble.org/images/heic0707a/). The
  #           Pillars: "Hubble ... made the Pillars of Creation famous with its first image in
  #           1995", Webb's near-infrared view shows "newly formed stars"
  #           (https://science.nasa.gov/missions/webb/nasas-webb-takes-star-filled-portrait-of-pillars-of-creation/).
  #           Rubin: "System first light images were released 23 June 2025", "a composite image of
  #           the Trifid and Lagoon nebulae", "the southern sky every few nights, creating a
  #           ten-year time-lapse record" (Wikipedia, Vera C. Rubin Observatory). The Whirlpool:
  #           "31 million light-years", the companion "tugging on the arm", "hydrogen within giant
  #           star-forming regions" (messier-51/). Andromeda: "2.5 million light-years", "the
  #           nearest major galaxy", "can be seen with the naked eye" (messier-31/).
  #   Dark sky      "83% of the world's people live under light-polluted skies", "one third of the
  #           world's population could no longer see the Milky Way", birds "attracted to tall
  #           towers", "Sea turtle hatchlings" (Wikipedia, Light pollution, citing Falchi et al.
  #           2016). "the average night sky got brighter by 9.6% per year from 2011 to 2022",
  #           "adverse health effects in humans" (https://www.nps.gov/subjects/nightskies/lightpollution.htm).
  #           "After about 30 minutes in the dark, your eyes will adapt"
  #           (https://science.nasa.gov/solar-system/meteors-meteorites/geminids/). The three
  #           skies on the ground are the app's own model (sky/skymath.js DARKNESS), so the cards
  #           count no stars.
  #   Asteroids     "rocky remnants left over from the formation of our solar system about 4.6
  #           billion years ago", "between 1.1 and 1.9 million asteroids larger than 1 kilometer",
  #           "less than that of Earth's Moon", Jupiter's gravity "brought an end to the formation
  #           of planetary bodies in this region" (https://science.nasa.gov/solar-system/asteroids/facts/).
  #           Ceres: "a radius of 296 miles (476 kilometers)", "25% of the asteroid belt's total
  #           mass", Dawn in 2015 "the first dwarf planet to receive a visit", "large salt
  #           deposits" (https://science.nasa.gov/dwarf-planets/ceres/facts/). "In November 2025,
  #           the total number of identified NEAs surpassed 40 000, with around 10 000 of these
  #           discovered in the last three years", the kilometre-sized ones "the vast majority have
  #           already been found", "only about 30%" of the mid-sized
  #           (https://www.esa.int/Space_Safety/Planetary_Defence/40_000_near-Earth_asteroids_discovered);
  #           "no known significant threat of impact for the next hundred years or more"
  #           (https://www.jpl.nasa.gov/asteroid-watch/). Apophis: "April 13, 2029", "about 20,000
  #           miles (32,000 kilometers) from our planet's surface", "no risk ... for at least 100
  #           years" (https://science.nasa.gov/solar-system/asteroids/apophis/); 0.34 km across (JPL
  #           SBDB, sstr=99942); geostationary height 35 786 km (ESA, below); 13 April 2029 is a
  #           Friday. DART: "22,530 kilometers per hour", "11 hours and 55" to "11 hours and 23
  #           minutes - a difference of 32 minutes", "humanity's first time purposely changing the
  #           motion of a celestial object" (https://science.nasa.gov/planetary-defense-dart/). Hera:
  #           launched "7 October 2024", arrival "November 2026", "a well-understood and repeatable
  #           planetary defence technique" (https://www.esa.int/Space_Safety/Hera). Bennu: "4.29
  #           ounces (121.6 grams)", "the largest asteroid sample ever collected in space", "Sept.
  #           24, 2023", Utah, "Sugars essential to life", "Molecules that, on our planet, are key
  #           to life" (https://science.nasa.gov/mission/osiris-rex/); 0.484 km (JPL SBDB).
  #   Satellites    the station: "five miles per second", "16 orbits of Earth" in 24 hours
  #           (https://www.nasa.gov/international-space-station/space-station-facts-and-figures/),
  #           "an altitude of between 370-460 km", "falls towards Earth continually due to
  #           atmospheric friction" (https://www.nasa.gov/reference/international-space-station/).
  #           Low orbit "under altitudes of 2000 km", "about 90 minutes"; geostationary "35 786
  #           km", "appear 'stationary' over one fixed spot", antennas "stay in a constant
  #           position", "valuable for weather satellites"
  #           (https://www.esa.int/Enabling_Support/Space_Transportation/Types_of_orbits). Junk "can
  #           reach speeds of 18,000 miles per hour, almost seven times faster than a bullet"
  #           (https://www.nasa.gov/headquarters/library/find/bibliographies/space-debris/). Hubble:
  #           "Launched on April 24, 1990", "roughly 300 miles (483 km)"
  #           (https://science.nasa.gov/mission/hubble/observatory/). Envisat: 8 211 kg, "the
  #           world's largest civilian Earth observation satellite", contact lost 8 April 2012,
  #           about 150 years in orbit (Wikipedia, Envisat). 2 086 rocket bodies, "About 47140"
  #           tracked objects, "1.5 million space debris objects from greater than 1 cm to 10 cm"
  #           (ESA DISCOS, https://sdup.esoc.esa.int/discosweb/statistics/, updated 31 July 2026).
  #           Point Nemo, "the location in the ocean that is farthest from land"
  #           (https://oceanservice.noaa.gov/facts/nemo.html); "The defunct space station Mir",
  #           "The International Space Station is slated to end up in the spacecraft cemetery"
  #           (Wikipedia, Spacecraft cemetery).
  #   Comets  Halley: "on average, 76 Earth years", "It will return in 2061", "an albedo of 0.03",
  #           aphelion "well beyond the distance of Neptune", "the Eta Aquarids in May and the
  #           Orionids in October" (https://science.nasa.gov/solar-system/comets/1p-halley/).
  #           "mostly of ice coated with dark organic material", "often a few miles across",
  #           sunlight and the solar wind "blow the coma dust and gas away from the Sun"
  #           (https://science.nasa.gov/solar-system/comets/facts/). Borisov: "Crimean amateur
  #           astronomer Gennady Borisov", "Aug. 30, 2019"
  #           (https://science.nasa.gov/solar-system/comets/2i-borisov/); 3I/ATLAS, "the third
  #           known interstellar object" (https://science.nasa.gov/solar-system/comets/3i-atlas/).
  #           Meteors: "the trail of dusty debris left by a comet", "between the size of a grain of
  #           sand and a pea", "tens of thousands of miles per hour", "named after a star or
  #           constellation", the Perseids "a tiny piece of the comet Swift-Tuttle", the Geminids
  #           and "(3200) Phaethon" (https://science.nasa.gov/solar-system/meteors-meteorites/facts/);
  #           the Perseids' radiant "is the constellation Perseus", "best viewed ... during the
  #           pre-dawn hours" (.../meteors-meteorites/perseids/); the Geminids "one of the best
  #           and most reliable", Phaethon a "dead comet" or a "rock comet", "recline on your back"
  #           (.../meteors-meteorites/geminids/). Phaethon's perihelion, 0.140 au, inside Mercury's
  #           0.31: JPL SBDB, sstr=3200.
  #   The birth     "formed about 4.6 billion years ago from a dense cloud of interstellar gas and
  #           dust", "a spinning, swirling disk of material", "only rocky material could withstand
  #           the heat", the asteroid belt "could never quite come together into a planet"
  #           (https://science.nasa.gov/solar-system/solar-system-facts/); the Sun "accounts for
  #           99.8% of our solar system's mass" (sun/facts/). Mercury "scarred by many impact
  #           craters" (https://science.nasa.gov/mercury/facts/). Jupiter "took most of the mass
  #           left over after the formation of the Sun, ending up with more than twice the combined
  #           material of the other bodies in the solar system" (https://science.nasa.gov/jupiter/jupiter-facts/).
  #           Vesta "the second most massive body in the main asteroid belt", "the source of the
  #           Howardite, Eucrite and Diogenite groups of meteorites"
  #           (https://science.nasa.gov/solar-system/asteroids/4-vesta/). The Moon: "a massive
  #           object - named Theia ... - smashed into Earth, flinging material into space that
  #           became the Moon", the rocks "matched those of Earth rocks too precisely for the
  #           similarities to be a coincidence" (https://science.nasa.gov/moon/formation/). The
  #           Kuiper belt: "icy bodies extending far beyond the orbit of Neptune", "Neptune's
  #           gravity stirred up this region", "a source of comets"
  #           (https://science.nasa.gov/solar-system/kuiper-belt/facts/).
  # =============================================================================================

  # ---------------------------------------------------------------------------------------------
  # THE LIFE OF A STAR (internal #366). One real object for each age. The two red stars are shown
  # in their figures, where their colour stands out against their neighbours'; Sirius B is told
  # and not drawn, and the card says why.
  # ---------------------------------------------------------------------------------------------
  - id: life-of-a-star
    title: "The life of a star"
    blurb: "From a cloud of gas to a pulsar: one real star at each age, then back to Earth."
    group: beyond
    next: black-holes
    requires: [stars, deep-sky]
    hides: [exoplanets, systems, galaxy, exotics]
    stage: stellar
    clock: as-found
    og_stop: 1
    stops:
      - id: nursery
        target: {record: dso-m42}
        needs_layer: deep-sky
        distance_km: 302743375122586
        key_light_deg: 0
        exposure: deep
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "Being born"
        card:
          title: "Where stars are born"
          body: >-
            This is the Orion Nebula, an enormous cloud of gas and dust more than a
            thousand light-years away. Gravity pulls its thickest knots together. Where
            a knot grows hot enough in the middle, a star switches on. Vast numbers of
            new stars are being made here right now.

      - id: young
        target: {record: dso-m45}
        needs_layer: deep-sky
        distance_km: 122989496143550
        key_light_deg: 0
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "Being born"
        card:
          title: "A family of young stars"
          body: >-
            The Pleiades are about a hundred million years old, which for a star is
            childhood. More than a thousand of them are held loosely together by
            gravity. The brightest are hot and blue, and the blue haze is a cloud of
            dust they happen to be passing through.

      - id: sun
        target: {world: sun}
        stage: sun
        frame_radii: 3.6
        drift_deg: 10
        chapter: "The long middle"
        card:
          title: "A star in the middle of its life"
          body: >-
            Our Sun is four and a half billion years old, and a little less than half
            way through its life. Deep inside, it turns hydrogen into helium, and that
            is what makes it shine. Nine stars in ten are in this steady middle age,
            which lasts for millions or billions of years.

      - id: giant
        target: {sky: [213.9, 22.0]}
        figures: [Boo]
        figure_stars: 1
        zoom: 0.9
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "Growing old"
        card:
          title: "What the Sun will become"
          body: >-
            The orange star is Arcturus. It weighs about the same as the Sun, but it is
            older, and the hydrogen in its core has run out. So it has swollen to
            twenty-five times the Sun's width. In about five billion years, the Sun will
            become a red giant too.

      - id: supergiant
        target: {sky: [84.5, 2.0]}
        figures: [Ori]
        figure_stars: 2
        zoom: 0.9
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "Growing old"
        card:
          title: "A heavy star, near its end"
          body: >-
            Betelgeuse, the red shoulder of Orion, has about fifteen times the Sun's
            mass. Heavy stars burn fast: it is only about ten million years old and
            already near its end. Put it where the Sun is and it would reach past
            Jupiter. One day it will explode.

      - id: letting-go
        target: {record: dso-helix-nebula}
        needs_layer: deep-sky
        distance_km: 85146574253227
        key_light_deg: 0
        exposure: deep
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "The end of a star like the Sun"
        card:
          title: "A star letting go"
          body: >-
            A star like the Sun does not explode. Late in its life it blows its outer
            layers away into space, and they glow like this. This is the Helix Nebula,
            six hundred and fifty light-years away. The small, very hot star at its
            centre is all that is left: a white dwarf.

      - id: white-dwarf
        target: {sky: [101.3, -18.0]}
        figures: [CMa]
        figure_stars: 1
        zoom: 0.9
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The end of a star like the Sun"
        card:
          title: "What is left: a white dwarf"
          body: >-
            Sirius, the brightest star in the night sky, has a companion we do not draw:
            it is ten thousand times fainter. It is a white dwarf, the core of a dead
            star. It holds nearly the mass of the Sun in a ball about the size of the
            Earth, slowly cooling.

      - id: explosion
        target: {record: dso-m1}
        needs_layer: deep-sky
        distance_km: 189214609451616
        key_light_deg: 0
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "The end of a heavy star"
        card:
          title: "A star that blew up"
          body: >-
            A heavy star ends differently. Its core collapses and the rest is blown into
            space. People saw this one happen: in the year 1054 Chinese astronomers
            recorded a new star that could be seen in daylight for nearly a month. This
            is the wreck today, the Crab Nebula.

      - id: pulsar
        target: {record: dso-m1}
        needs_layer: deep-sky
        distance_km: 113528765670970
        key_light_deg: 0
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "The end of a heavy star"
        card:
          title: "The heart of the wreck"
          body: >-
            At the centre is what remains of the star's core: a ball about twenty
            kilometres across with the mass of a sun, spinning thirty times a second. It
            is called a pulsar. It is far too small to see, but the blue glow in the
            middle is its doing. An even heavier star leaves a black hole.

  # ---------------------------------------------------------------------------------------------
  # BLACK HOLES (internal #366, public #426). Honest about what each thing on the screen is: a
  # mark at a measured place (every hole here), the Event Horizon Telescope's two pictures drawn
  # far larger than they would look (`portrait:`), and the measured stars. The galaxy's model is
  # switched off: its bulge is a white blot at the centre, over the very thing the stop shows. No bent
  # light is drawn: nothing in this app knows how to bend it truthfully.
  # ---------------------------------------------------------------------------------------------
  - id: black-holes
    title: "Black holes"
    blurb: "Three real black holes: where they are and how we know. Then back to Earth."
    group: beyond
    next: through-a-telescope
    requires: [stars, exotics, deep-sky]
    hides: [exoplanets, systems, galaxy]
    stage: stellar
    clock: as-found
    og_stop: 5
    stops:
      - id: swan
        target: {sky: [300.0, 37.0]}
        figures: [Cyg]
        figure_stars: 2
        zoom: 0.85
        exposure: deep
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "One you can point to"
        card:
          title: "A black hole you can point to"
          body: >-
            This is the Swan, flying along the Milky Way. In its neck is Cygnus X-1, the
            first thing in the sky that astronomers agreed was a black hole. You cannot
            see it. Nobody can. It was found in 1964, because it is one of the strongest
            sources of X-rays in the sky.

      - id: what
        target: {record: exotic-cygnus-x-1}
        needs_layer: exotics
        distance_km: 132450226616131216
        key_light_deg: 90
        drift_deg: 6
        drift_rate_deg_s: 0.5
        chapter: "One you can point to"
        card:
          title: "What a black hole is"
          body: >-
            Seven thousand light-years from home. A black hole is a place where gravity
            is so strong that nothing gets out, not even light. This one has about
            twenty times the mass of the Sun. The mark in the middle is ours. The scatter
            of dots to one side is home: the stars this map has measured.

      - id: from-home
        target: {sky: [266.4, -27.0]}
        figures: [Sgr, Sco]
        figure_stars: 1
        zoom: 0.85
        exposure: deep
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "The one at the centre"
        card:
          title: "The centre of the galaxy, from home"
          body: >-
            Look past the spout of the Teapot, where the Milky Way is brightest.
            Twenty-seven thousand light-years that way is the centre of our galaxy. In
            the middle of it sits a black hole four million times as massive as the Sun.

      - id: centre
        target: {record: exotic-sgr-a-star}
        needs_layer: exotics
        distance_km: 18921460945161600
        portrait: true
        drift_deg: 8
        drift_rate_deg_s: 0.6
        chapter: "The one at the centre"
        card:
          title: "Sagittarius A star"
          body: >-
            Nobody can see this black hole itself. Astronomers watched a star go round
            it, once every sixteen years, at millions of kilometres an hour, and worked
            out what it must be circling. Then eight radio observatories, working as one
            telescope the size of the Earth, made this picture: glowing gas, and a
            shadow in the middle.

      - id: m87
        target: {record: exotic-m87-star}
        needs_layer: exotics
        distance_km: 1892146094516160000
        portrait: true
        drift_deg: 8
        drift_rate_deg_s: 0.6
        chapter: "The first picture"
        card:
          title: "The first picture of a black hole"
          body: >-
            Far beyond our own galaxy, in a galaxy called M87, is a black hole with the
            mass of six and a half billion Suns. This is the first picture ever made of
            one, taken by eight radio telescopes working together. The dark middle is
            its shadow, and it is far wider than our whole Solar System.

      - id: sun
        target: {world: sun}
        stage: sun
        frame_radii: 3.6
        drift_deg: 10
        chapter: "What they are not"
        card:
          title: "Nothing to fear"
          body: >-
            The Sun will never be a black hole: only stars many times heavier end that
            way. And if you swapped the Sun for a black hole of the same mass, the
            planets would stay in their orbits. It would only get a lot colder. The
            nearest black hole we know is about fifteen hundred light-years away.

  # ---------------------------------------------------------------------------------------------
  # THE SKY AS TELESCOPES SEE IT (internal #366's "What Webb saw", with the pictures we may
  # ship: ESO's, ESA/Hubble's and NOIRLab's, all CC BY 4.0, registry/nebulae.yaml). The first
  # three stops are one nebula at the three exposures of spec 0067, which is the whole lesson:
  # the colours are real and the eye cannot collect them. The credit under each card is
  # generated from the picture's own row. We carry no Webb picture yet, and no card says we do.
  # ---------------------------------------------------------------------------------------------
  - id: through-a-telescope
    title: "The sky as telescopes see it"
    blurb: "Real photographs, each where it is in the sky. Leaving goes back to Earth."
    group: beyond
    next: a-dark-sky
    requires: [stars, deep-sky]
    hides: [exoplanets, systems, exotics, galaxy]
    stage: stellar
    clock: as-found
    og_stop: 5
    stops:
      - id: eye
        target: {record: dso-m42}
        needs_layer: deep-sky
        distance_km: 283821914177424
        key_light_deg: 0
        exposure: eye
        drift_deg: 0
        chapter: "One nebula, three ways"
        card:
          title: "With your own eyes"
          body: >-
            This is the Orion Nebula roughly as your eye would see it at a telescope: a
            faint grey glow. The gas is real, but it is faint, and in the dark the eye
            sees no colour. It cannot save up light the way a camera can.

      - id: camera
        target: {record: dso-m42}
        needs_layer: deep-sky
        distance_km: 283821914177424
        key_light_deg: 0
        exposure: camera
        drift_deg: 0
        chapter: "One nebula, three ways"
        card:
          title: "With a camera"
          body: >-
            A camera can keep its shutter open and let the light pile up. Now the colour
            is there. It was always there. The red is hydrogen gas. This picture was
            taken through colour filters with an extra one for glowing hydrogen, so the
            red is stronger than an eye would find it.

      - id: deep
        target: {record: dso-m42}
        needs_layer: deep-sky
        distance_km: 283821914177424
        key_light_deg: 0
        exposure: deep
        drift_deg: 3
        drift_rate_deg_s: 0.3
        chapter: "One nebula, three ways"
        card:
          title: "A long exposure"
          body: >-
            Stretch a long exposure further and the faintest outer parts appear. Every
            picture on this trip is a real photograph, placed where it is in the sky.
            The line below each one says who took it.

      - id: horsehead
        target: {record: dso-horsehead-nebula}
        needs_layer: deep-sky
        distance_km: 283821914177424
        key_light_deg: 0
        exposure: deep
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "Clouds where stars form"
        card:
          title: "The Horsehead"
          body: >-
            Just beside Orion's belt, a dark cloud of dust stands in front of glowing
            gas, in the shape of a horse's head. Here the colours are chosen. The camera
            took the light of single gases through narrow filters, and each gas was
            given a colour so the eye can tell them apart.

      - id: carina
        target: {record: dso-carina-nebula}
        needs_layer: deep-sky
        distance_km: 2365182618145200
        key_light_deg: 0
        exposure: camera
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "Clouds where stars form"
        card:
          title: "The Carina Nebula"
          body: >-
            A great cloud in the southern sky, in the constellation of the Keel. Monster
            stars live inside it. Their fierce winds and ultraviolet light are carving
            the gas into the shapes you see: walls, pillars and hollows, lit from
            within.

      - id: eagle
        target: {record: dso-m16}
        needs_layer: deep-sky
        distance_km: 946073047258080
        key_light_deg: 0
        exposure: camera
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "Clouds where stars form"
        card:
          title: "The Eagle, and its pillars"
          body: >-
            The dark fingers in the middle are the Pillars of Creation. The Hubble
            telescope made them famous in 1995, and the Webb telescope has since looked
            through their dust in infrared light and found newborn stars inside. This
            picture is from the ground, in visible light.

      - id: trifid
        target: {record: dso-m20}
        needs_layer: deep-sky
        distance_km: 548722367409686
        key_light_deg: 0
        exposure: camera
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "Clouds where stars form"
        card:
          title: "The Trifid, from the newest telescope"
          body: >-
            The Trifid Nebula, with the dark lanes that give it its name. This picture
            is among the very first from the Vera Rubin Observatory in Chile, released
            in June 2025. For ten years that telescope will photograph the southern sky
            every few nights.

      - id: whirlpool
        target: {record: dso-m51}
        needs_layer: deep-sky
        distance_km: 1324502266161312000
        key_light_deg: 0
        exposure: deep
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "Other galaxies"
        card:
          title: "Another galaxy"
          body: >-
            Now far beyond our own galaxy. The Whirlpool is a spiral galaxy tens of
            millions of light-years away, seen face on. A smaller galaxy is passing
            behind it and tugging on one arm. The pink knots along the arms are clouds
            of hydrogen where new stars are forming.

      - id: andromeda
        target: {record: dso-m31}
        needs_layer: deep-sky
        distance_km: 1419109570887120128
        key_light_deg: 0
        exposure: deep
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "Other galaxies"
        card:
          title: "A galaxy you can see for yourself"
          body: >-
            Andromeda, the nearest large galaxy to our own, two and a half million
            light-years off. You can see it without any telescope, as a faint smudge.
            How well you see it, like everything on this trip, depends on how dark your
            sky is.

  # ---------------------------------------------------------------------------------------------
  # A DARK SKY (internal #366; the sky view's "Your sky" setting, internal #357). One patch of the
  # visitor's own sky, three times: under a city, at a town's edge, in a dark place. The three
  # skies are sky/skymath.js DARKNESS, a model of an average clear night, and the ground view's
  # own note says so. Nothing here names a place: it is a different one for every visitor.
  # ---------------------------------------------------------------------------------------------
  - id: a-dark-sky
    title: "A dark sky"
    blurb: "Your sky from a city, a town and a dark place. It moves the clock to tonight."
    group: earth-orbit
    next: tonight-from-your-street
    requires: [worlds]
    # Spacecraft models and today's aurora are litter over a picture of the night's own lights.
    hides: [aurora, storms, lightning, visual, notable, just-launched, starlink-trains, launches]
    requires_observer: true
    stage: earth
    clock: as-found
    og_stop: 6
    stops:
      - id: lights
        target: {world: earth}
        frame_radii: 2.2
        over: [38, 20]
        # A written evening, so the side shown is land in the dark whatever hour the visitor comes:
        # Europe, Africa and the Middle East at 21:00 UTC in January.
        time: 2027-01-10T21:00:00Z
        drift_deg: 14
        chapter: "The light we make"
        card:
          title: "The Earth at night"
          body: >-
            This is the night side of the Earth, and every glow on it is a town. Some of
            that light never reaches a street. It goes up, or sideways, and lights the
            air. More than eight people in ten now live under a sky polluted by light.

      - id: above
        target: {observer: true}
        distance_km: 900
        time: tonight
        drift_deg: 16
        chapter: "The light we make"
        card:
          title: "Your own sky, tonight"
          body: >-
            Here is your part of the world as tonight's dark arrives. We are going down to the
            ground to look up at one patch of sky, three times. First as a city shows it, then
            from a town's edge, then from somewhere properly dark.

      - id: city
        target: {observer: true}
        distance_km: 400
        look: {best: milky-way}
        darkness: city
        time: night
        chapter: "One sky, three ways"
        card:
          title: "From a city"
          body: >-
            From the middle of a city, only the brightest stars get through, with the
            planets and the Moon. The sky itself glows. Whatever lies behind that glow
            is still there, every night. It is only outshone.

      - id: town
        target: {observer: true}
        distance_km: 400
        look: {best: milky-way}
        darkness: town
        time: night
        chapter: "One sky, three ways"
        card:
          title: "From the edge of a town"
          body: >-
            Away from the centre, the same patch of sky holds many more stars, and the
            figures of the constellations fill in. Low down there is still a dome of
            light over the place you left.

      - id: dark
        target: {observer: true}
        distance_km: 400
        look: {best: milky-way}
        darkness: dark
        time: night
        chapter: "One sky, three ways"
        card:
          title: "From a dark place"
          body: >-
            Far from any town, on a night with no Moon, there are more stars than you can count,
            and they lie thickest along one band of the sky. That band is the Milky Way: our own
            galaxy, seen from inside. One person in three alive today cannot see it from where
            they live.

      - id: cost
        target: {world: earth}
        frame_radii: 1.9
        over: [38, -95]
        # North America at its midnight, for the same reason as the first stop.
        time: 2027-01-11T06:00:00Z
        drift_deg: 12
        chapter: "What it costs, and what to do"
        card:
          title: "What the light costs"
          body: >-
            It is not only the stars. Birds that travel at night are drawn towards
            lights, young turtles crawl towards streets instead of the sea, and it is
            bad for our own health. The night sky has been getting nearly a tenth
            brighter every year. But this pollution is gone the moment a lamp is shaded
            or switched off.

      - id: find
        target: {observer: true}
        distance_km: 1500
        time: tonight
        drift_deg: 14
        chapter: "What it costs, and what to do"
        card:
          title: "How to find the dark"
          body: >-
            Look at the lights around your own place, and pick a gap between them. Go
            there in the week around new Moon, when the Moon is out of the evening sky.
            Give your eyes half an hour in the dark, without a screen, and look up.

  # ---------------------------------------------------------------------------------------------
  # ASTEROIDS, AND THE ONES THAT COME CLOSE (public #239). On the Sun's stage, where every rock is
  # drawn at its computed place. The asteroids themselves are models at class size, as every
  # small body in this app is, and their cards say so. APOPHIS IS SHOWN WHERE IT IS TODAY AND ITS
  # 2029 PASS IS TOLD: the map carries one set of orbit numbers for it and no pull from the Earth,
  # which is far too little to fly a pass that close truthfully, and the card says that.
  # ---------------------------------------------------------------------------------------------
  - id: asteroids-that-come-close
    title: "Asteroids, and the ones that come close"
    blurb: "The belt, the rocks that pass us, and how we moved one. Then back to Earth."
    group: solar-system
    next: comets-and-meteors
    requires: [worlds, asteroids, far-bodies, deep-space]
    stage: sun
    clock: as-found
    orbits: [earth, mars, jupiter]
    og_stop: 4
    stops:
      - id: belt
        target: {world: sun}
        distance_km: 1500000000
        drift_deg: 0
        names: true
        chapter: "The belt"
        card:
          title: "The asteroid belt"
          body: >-
            Between the paths of Mars and Jupiter there are more than a million rocks,
            left over from the making of the planets about four and a half billion years
            ago. It is mostly empty space: all of them together weigh less than our
            Moon. The map draws the few it carries, each where it is today.

      - id: ceres
        target: {record: dwarf-ceres}
        needs_layer: far-bodies
        distance_km: 600000
        chapter: "The belt"
        card:
          title: "Ceres, the largest"
          body: >-
            Ceres is about nine hundred and fifty kilometres across and holds a quarter
            of the belt's whole mass. It is round, so it counts as a dwarf planet. A
            spacecraft called Dawn reached it in 2015, the first visit to a dwarf
            planet, and found large deposits of salt in its crust.

      - id: near
        target: {world: earth}
        distance_km: 30000000
        time: now
        live_note: close-approach
        names: true
        drift_deg: 0
        chapter: "Near the Earth"
        card:
          title: "The ones that come close"
          body: >-
            Some asteroids have paths that bring them near the Earth's. More than forty
            thousand have been found, ten thousand of them in the last three years.
            Telescopes find them, and each one's path is worked out for a hundred years
            ahead. The line below names the next one to pass.

      - id: didymos
        target: {record: asteroid-65803}
        needs_layer: asteroids
        distance_km: 400000
        chapter: "Moving one"
        card:
          title: "The asteroid we moved"
          body: >-
            Didymos has a small moon. In 2022 a spacecraft called DART was flown
            straight into that moon at more than six kilometres a second, on purpose.
            Its orbit became thirty-two minutes shorter. It was the first time people
            changed the motion of anything in the sky.

      - id: hera
        target: {record: deep-hera}
        needs_layer: deep-space
        distance_km: 400000
        chapter: "Moving one"
        card:
          title: "Hera, going to check"
          body: >-
            This is Hera, a European spacecraft sent to the same pair of asteroids, due
            there in November 2026. It will survey the little moon after the crash and
            measure its mass, to turn that one experiment into a method that can be
            repeated if a dangerous rock is ever found.

      - id: bennu
        target: {record: asteroid-101955}
        needs_layer: asteroids
        distance_km: 400000
        chapter: "Moving one"
        card:
          title: "Bennu, and a handful brought home"
          body: >-
            Bennu is about half a kilometre wide. A spacecraft touched it, collected a
            hundred and twenty grams, and dropped them in the Utah desert in 2023: the
            largest asteroid sample ever brought home. In that dust were sugars and
            other molecules that, on Earth, are key to life.

      # THE PASS OF 13 APRIL 2029, FLOWN (public #239, internal #413). Until 2026-10-06 this stop
      # showed Apophis where it is today and said the map could not fly the pass: the row was
      # two-body motion, which knows nothing of the Earth's pull. The record now has a file of
      # its path from JPL Horizons (registry/ephemerides.yaml, solution JPL#220, kept relative to
      # the Earth for the three weeks round the pass, held to 10 km of Horizons by
      # tests/test_ephemerides.mjs). ui/trip.js fetches it before the trip is offered. The clock
      # goes to 21:45 UTC, the closest minute IN THAT FILE: 31 633 km over the ground (38 011 from
      # the Earth's centre), which is NASA's "about 20,000 miles (32,000 kilometers) from our
      # planet's surface", read on science.nasa.gov/solar-system/asteroids/apophis on 2026-10-06
      # with "closer than ... many satellites in geosynchronous orbit" and "no risk ... for at
      # least 100 years". The size is the JPL Small-Body Database's, as on the record's card.
      # It is a prediction and the card says so. It is the stop before the last because it moves
      # the clock to 2029: the last stop is `time: now` and brings it back, and no card after
      # this one is read in the wrong year. (It was the fourth stop until then.)
      - id: apophis
        target: {record: asteroid-99942}
        needs_layer: asteroids
        stage: earth
        time: 2029-04-13T21:45:00Z
        rate: 60
        # The Earth in the picture: without `behind` the first frame had the rock alone, the
        # Earth exactly behind its model (seen 2026-10-06). 30 000 km back, the Earth is about
        # twelve degrees across beside it.
        behind: earth
        distance_km: 30000
        chapter: "Keeping watch"
        card:
          title: "Apophis passes the Earth"
          body: >-
            One pass is already in the calendar. This rock, Apophis, is about three
            hundred and forty metres across, and this is the evening it comes closest:
            about thirty-two thousand kilometres above the ground, inside the ring of
            satellites that carry television. It will miss. The path drawn here is the
            one predicted at NASA's Jet Propulsion Laboratory.

      - id: home
        target: {world: earth}
        stage: earth
        frame_radii: 4
        key_light_deg: 60
        time: now
        chapter: "Keeping watch"
        card:
          title: "Are we safe?"
          body: >-
            For the large ones, yes. The vast majority of the asteroids bigger than a
            kilometre have been found, and none of the forty thousand known is a threat
            in the next hundred years. But only about a third of the middle-sized ones
            have been found. The search goes on.

  # ---------------------------------------------------------------------------------------------
  # SATELLITES AND SPACE JUNK (public #449). The count is never typed: the line under the two
  # catalogue stops is counted from the catalogue on screen (`live_note: satellites`). No stop
  # moves the clock, because the whole active catalogue is loaded (the validator refuses the
  # pair). No explosion is simulated; the numbers nobody can track are ESA's estimate, in words.
  # ---------------------------------------------------------------------------------------------
  - id: satellites-and-junk
    title: "Satellites and space junk"
    blurb: "Everything working in orbit today, the ring that stands still, and the junk."
    group: earth-orbit
    next: people-in-space
    requires: [stations, notable, visual, worlds]
    stage: earth
    clock: as-found
    og_stop: 2
    stops:
      - id: one
        target: {layer: stations, catalog: "25544"}
        distance_km: 2600
        chapter: "What is up there"
        card:
          title: "Start with one"
          body: >-
            This is the International Space Station, about four hundred kilometres up.
            It moves at eight kilometres every second and circles the Earth sixteen
            times a day. Hold on to that height and that speed. Nearly everything else
            on this trip shares them.

      - id: all
        target: {world: earth}
        needs_layer: active
        frame_radii: 3.4
        live_note: satellites
        drift_deg: 16
        chapter: "What is up there"
        card:
          title: "Everything that works"
          body: >-
            Every dot is a working satellite, at the place it is right now. The line
            below counts them from the catalogue this page loaded today, and counts how
            many of them belong to a single internet network, Starlink.

      - id: low
        target: {world: earth}
        needs_layer: active
        frame_radii: 1.7
        over: [48, 10]
        live_note: satellites
        drift_deg: 12
        chapter: "What is up there"
        card:
          title: "The crowded shell"
          body: >-
            Nearly all of them fly low, under two thousand kilometres. Down here a
            satellite circles the Earth in about ninety minutes, and junk can cross its
            path at almost seven times the speed of a bullet. That is why even small
            pieces matter.

      - id: ring
        target: {world: earth}
        needs_layer: geo-ring
        frame_radii: 9.5
        over: [78, 0]
        drift_deg: 10
        chapter: "What is up there"
        card:
          title: "The ring that stands still"
          body: >-
            Much higher, nearly thirty-six thousand kilometres up, a satellite takes one
            day to go round, so from the ground it hangs over one spot. That is why a
            television dish never has to move. Weather satellites sit here too, each
            watching one side of the Earth.

      - id: hubble
        target: {layer: notable, catalog: "20580"}
        distance_km: 2600
        chapter: "What is worth protecting"
        card:
          title: "Worth protecting"
          body: >-
            The Hubble Space Telescope has been up here since 1990, about five hundred
            kilometres above the ground. Like the weather satellites, and the station
            with its crew, it depends on the space around it staying clear.

      - id: dead
        target: {layer: debris-notable, catalog: "27386"}
        needs_layer: debris-notable
        distance_km: 2600
        chapter: "The junk"
        card:
          title: "A dead satellite"
          body: >-
            This is Envisat, once the world's largest civilian Earth-watching satellite.
            Contact was lost in 2012 and it has circled since, eight tonnes with nobody
            at the controls. It is expected to stay up for about a hundred and fifty
            years.

      - id: rocket
        target: {layer: visual, query: {name_contains: "R/B"}, pick: first}
        needs_layer: visual
        distance_km: 2600
        chapter: "The junk"
        card:
          title: "A spent rocket"
          body: >-
            The last stage of a rocket often stays in orbit after its job is done. About
            two thousand of them are up here now. In all, some forty-seven thousand
            objects are tracked, and by Europe's estimate more than a million pieces are
            too small to track.

      - id: down
        target: {world: earth}
        frame_radii: 2.4
        over: [-48.9, -123.4]
        drift_deg: 12
        chapter: "The junk"
        card:
          title: "Coming down"
          body: >-
            Thin air drags on everything in low orbit, and in the end it falls and
            burns. The largest spacecraft are steered down here, to the part of the
            Pacific farthest from any land. The Mir space station ended here. The
            International Space Station is due to follow.

  # ---------------------------------------------------------------------------------------------
  # COMETS AND METEOR SHOWERS (public #445's third trip). The comet is Halley, a row the comets
  # layer always has (site/js/data/sample.js NAMED_COMETS, JPL's orbit with its phase), because
  # JPL's table of comets near the Sun is a snapshot that is often empty. It is 35 au out, where a
  # comet has no tail; the model draws one on any selected comet, and the second card says so. The shower is the next one in
  # registry/showers.yaml, found for the visitor's date, and the line under the stop says when it
  # peaks and where its radiant is in their own sky tonight.
  # ---------------------------------------------------------------------------------------------
  - id: comets-and-meteors
    title: "Comets and meteor showers"
    blurb: "A comet, its dust and the next shower from your street. Then back to Earth."
    group: solar-system
    next: birth-of-the-solar-system
    requires: [worlds, comets, far-bodies, asteroids, stars]
    # Passing satellites are drawn as models beside the visitor's place; this trip is not about them.
    hides: [visual, notable, just-launched, starlink-trains, launches, stations]
    requires_observer: true
    stage: sun
    clock: as-found
    orbits: [earth, mars, jupiter]
    og_stop: 1
    stops:
      - id: halley
        target: {record: comet-1P}
        needs_layer: comets
        distance_km: 9000000000
        drift_deg: 0
        names: true
        chapter: "Comets"
        card:
          title: "Halley's comet, where it is today"
          body: >-
            The most famous comet is out past Neptune now, at the far end of the long, thin loop
            drawn here. It last passed the Sun in 1986, and it will be back in 2061. One thing in
            this picture is not real: the tail. Out there Halley is a dark, frozen lump with no
            tail at all.

      - id: comet
        target: {record: comet-1P}
        needs_layer: comets
        distance_km: 3000000
        chapter: "Comets"
        card:
          title: "What a comet is"
          body: >-
            A comet is mostly ice, coated with dark dust, a few kilometres across.
            Halley reflects only three parts in a hundred of the light that falls on it.
            As a comet nears the Sun its ice turns to gas, and sunlight and the solar
            wind blow gas and dust away from the Sun into a long, bright tail.

      - id: stranger
        target: {record: interstellar-2i}
        needs_layer: far-bodies
        distance_km: 3000000
        chapter: "Comets"
        card:
          title: "A comet from another star"
          body: >-
            This one does not belong to the Sun at all. It is called Borisov, after the
            amateur astronomer who found it in 2019. Its speed and its path show that it
            came from another star, and it is leaving for good. Three such visitors have
            been seen so far.

      - id: dust
        target: {world: earth}
        distance_km: 400000000
        drift_deg: 0
        chapter: "Meteor showers"
        card:
          title: "Where shooting stars come from"
          body: >-
            A comet leaves a trail of dusty debris along its path. Where the Earth
            passes through one, the dust hits our air at tens of thousands of kilometres
            an hour and burns up. Most of the pieces are between a grain of sand and a
            pea. That is a meteor shower, and it comes back every year.

      - id: phaethon
        target: {record: asteroid-3200}
        needs_layer: asteroids
        distance_km: 400000
        chapter: "Meteor showers"
        card:
          title: "A shower from a rock"
          body: >-
            One of the best showers of the year, the Geminids in December, does not come
            from a comet. It comes from this asteroid, Phaethon, whose path takes it
            closer to the Sun than Mercury. Nobody is sure whether it is a rock that
            behaves like a comet or a comet that has died.

      - id: radiant
        target: {sky: [44.0, 52.0]}
        stage: stellar
        figures: [Per, Cas]
        figure_stars: 1
        zoom: 0.9
        drift_deg: 3
        drift_rate_deg_s: 0.25
        chapter: "Meteor showers"
        card:
          title: "Why a shower has a name"
          body: >-
            The meteors of one shower all seem to come from one point in the sky, and a
            shower is named for the figure that point is in. The Perseids of August seem
            to come from here, in Perseus. The figure is only a signpost. The meteors
            themselves are dust from a comet called Swift-Tuttle.

      - id: tonight
        target: {observer: true}
        distance_km: 300
        look: {shower: next}
        darkness: dark
        time: midnight
        chapter: "From your street"
        card:
          title: "The next shower, from where you are"
          body: >-
            This is your own sky in the middle of tonight, and the ring marks where the next
            shower's meteors will seem to come from. You do not need to stare at that point. Meteors appear all over the
            sky. The line below says which shower it is and when it peaks.

      - id: watch
        target: {observer: true}
        distance_km: 1500
        time: tonight
        drift_deg: 14
        chapter: "From your street"
        card:
          title: "How to watch one"
          body: >-
            Go somewhere away from the lights and lie on your back. After about half an
            hour in the dark your eyes adapt, and you begin to see meteors. The hours
            before dawn are usually the best. Bring something warm.

  # ---------------------------------------------------------------------------------------------
  # THE BIRTH OF THE SOLAR SYSTEM. Nobody watched it, and the app has no pictures of it. So every
  # stop is a real thing that is evidence for the account, and the first card and the last say
  # that it is an account: the views are real, the story is the one the evidence supports.
  # ---------------------------------------------------------------------------------------------
  - id: birth-of-the-solar-system
    title: "The birth of the Solar System"
    blurb: "The story science tells, told over real places. Leaving goes back to Earth."
    group: solar-system
    next: outer-solar-system
    requires: [worlds, deep-sky, asteroids, far-bodies]
    stage: sun
    clock: as-found
    orbits: [mercury, venus, earth, mars, jupiter, saturn]
    og_stop: 4
    stops:
      - id: cloud
        target: {record: dso-m42}
        stage: stellar
        needs_layer: deep-sky
        distance_km: 302743375122586
        key_light_deg: 0
        exposure: deep
        drift_deg: 4
        drift_rate_deg_s: 0.3
        chapter: "A cloud falls in"
        card:
          title: "It began in a cloud like this"
          body: >-
            Nobody saw the Solar System form. This trip is the story the evidence tells,
            shown over real places. It starts about four and a half billion years ago,
            in a dense cloud of gas and dust like this one in Orion, when part of it
            collapsed.

      - id: flat
        target: {world: jupiter}
        distance_km: 1500000000
        behind: sun
        drift_deg: 0
        chapter: "A cloud falls in"
        card:
          title: "Why it is flat"
          body: >-
            The collapsing cloud became a spinning, swirling disc, and the planets grew
            inside that disc. That is why, seen from the side like this, their paths
            still lie almost in one sheet.

      - id: sun
        target: {world: sun}
        frame_radii: 3.6
        drift_deg: 10
        chapter: "A cloud falls in"
        card:
          title: "Nearly all of it became the Sun"
          body: >-
            At the centre, gravity pulled more and more material in, until it was hot
            and dense enough to shine. That is the Sun, and it took almost everything:
            out of every thousand parts of the Solar System, nine hundred and
            ninety-eight are in it.

      - id: rock
        target: {world: mercury}
        stage: mercury
        frame_radii: 4
        key_light_deg: 55
        chapter: "Building worlds"
        card:
          title: "Close in, only rock"
          body: >-
            Near the young Sun, only rocky material could stand the heat. That is why
            the four planets closest to the Sun are small and made of rock: Mercury,
            Venus, the Earth and Mars. Mercury's surface is still scarred with the
            craters of countless impacts.

      - id: giant
        target: {world: jupiter}
        stage: jupiter
        frame_radii: 4
        key_light_deg: 55
        chapter: "Building worlds"
        card:
          title: "Far out, giants"
          body: >-
            Further out, where it was cold, ice and gas could gather too, and that is
            where the giant planets formed. Jupiter took most of what was left over
            after the Sun: more than twice as much material as every other planet, moon
            and rock put together.

      - id: leftovers
        target: {record: asteroid-4}
        needs_layer: asteroids
        distance_km: 400000
        chapter: "What was left over"
        card:
          title: "The leftovers"
          body: >-
            Between Mars and Jupiter the building never finished. The pull of newly
            formed Jupiter stopped the pieces from coming together and made them collide
            instead. This is Vesta, the second most massive of them. Meteorites knocked
            off it still fall on the Earth.

      - id: moon
        target: {world: moon}
        stage: moon
        frame_radii: 3.4
        key_light_deg: 60
        chapter: "What was left over"
        card:
          title: "How the Earth got its Moon"
          body: >-
            The early Solar System was violent. The leading account of the Moon is that
            a large body, which scientists have named Theia, struck the young Earth, and
            the Moon formed from the material flung into space. Rocks brought back by
            the Apollo astronauts match the Earth's too closely for chance.

      - id: far
        target: {world: pluto}
        stage: pluto
        frame_radii: 4
        key_light_deg: 55
        chapter: "What was left over"
        card:
          title: "The frozen edge"
          body: >-
            Beyond Neptune lies a wide belt of icy bodies, Pluto among them, left over
            from the beginning. Neptune's pull stirred this region so much that they
            never came together into a planet. Some of our comets come from here.

      - id: home
        target: {world: earth}
        stage: earth
        frame_radii: 4
        key_light_deg: 60
        chapter: "What was left over"
        card:
          title: "And here we are"
          body: >-
            That is the story as the evidence tells it today: from meteorites, from the
            Moon's rocks, and from the paths of the planets themselves. Parts of it will
            change as we learn more. The places were all real.

  # ---------------------------------------------------------------------------------------------
  # BACK TO THE MOON (Artemis; the review of 2026-10-05 found no Artemis stop anywhere). A short
  # trip and not a stop on "The Moon landings": that trip is ten `site:` rows in landing order, and
  # Artemis II landed nowhere. registry/sites.yaml has no Artemis row to stand on, so the stops
  # are the real places the flight is about: the last footprints, the launch coast, the far side,
  # the Earth from out there, the south pole. No trajectory is drawn, and no card says one is.
  # FACTS, read 2026-10-06: https://en.wikipedia.org/wiki/Artemis_II (launched 1 April 2026,
  # splashdown 11 April UTC, "9 days, 1 hour, 32 minutes"; Wiseman, Glover, Koch, Hansen;
  # "252,756 miles (406,771 km)" from Earth, past Apollo 13's 400 171 km) and
  # https://en.wikipedia.org/wiki/Artemis_program ("Artemis IV (early 2028) is planned to be the
  # first American crewed lunar landing since Apollo 17"; Artemis III "a demonstration flight in
  # low Earth orbit"). NASA's own page gives the launch, "April 1, 2026", "MISSION DURATION 9 Days,
  # 1 Hour, 32 Minutes" and Kennedy Space Center (https://www.nasa.gov/mission/artemis-ii/).
  # Apollo 17: "the Taurus-Littrow highlands and valley area", Cernan "the last person to leave his
  # footprints on the surface of the Moon" (https://www.nasa.gov/mission/apollo-17/). The south
  # pole: permanently shadowed regions "never receive light from the Sun", LCROSS "showed grains of
  # water ice", "the intended region of study for NASA's Artemis missions"
  # (https://science.nasa.gov/moon/moon-water-and-ices/). The plan's dates move, so no card names
  # the flight that lands or its year.
  # ---------------------------------------------------------------------------------------------
  - id: back-to-the-moon
    title: "Back to the Moon"
    blurb: "Artemis: round the Moon again, and where they mean to land. Then back to Earth."
    group: solar-system
    next: moon-landings
    requires: [hand-kept-sites, worlds]
    stage: moon
    clock: as-found
    og_stop: 5
    stops:
      - id: last
        target: {site: apollo-17}
        distance_km: 900
        time: daylight
        chapter: "The long gap"
        card:
          title: "The last footprints"
          body: >-
            This valley is where people last stood on the Moon. In December 1972 two
            astronauts of Apollo 17, Gene Cernan and Harrison Schmitt, drove away from
            here, climbed into their lander, and left. For more than fifty years after
            that, nobody travelled further from the Earth than a space station.

      - id: launch
        target: {world: earth}
        stage: earth
        frame_radii: 2.4
        over: [28.6, -80.6]
        time: now
        drift_deg: 10
        chapter: "Artemis"
        card:
          title: "Four people leave again"
          body: >-
            Then four people left from this coast of Florida, on a flight called Artemis Two:
            Reid Wiseman, Victor Glover, Christina Koch and, from Canada, Jeremy Hansen. They
            were the first crew to leave the Earth's neighbourhood since Apollo.

      - id: far-side
        target: {world: moon}
        frame_radii: 3.4
        over: [0, 180]
        drift_deg: 12
        chapter: "Artemis"
        card:
          title: "Round the far side"
          body: >-
            They did not land. Their ship swung once round the far side of the Moon, the
            side we never see from home, and at its farthest it was more than four
            hundred and six thousand kilometres from the Earth, further than Apollo 13.
            No people had ever been so far away.

      - id: earth-from-there
        target: {world: earth}
        distance_km: 90000
        key_light_deg: 60
        drift_deg: 8
        chapter: "Artemis"
        card:
          title: "Home, from out there"
          body: >-
            From out here the whole Earth is a small, bright ball in the dark. The
            flight lasted nine days and ended with a splashdown in the sea. It was a
            test of the ship and of the people, for what comes next.

      - id: south-pole
        target: {world: moon}
        frame_radii: 2.2
        over: [-84, 0]
        drift_deg: 10
        chapter: "What comes next"
        card:
          title: "Where they mean to land"
          body: >-
            This is the Moon's south pole. Some crater floors here never receive light
            from the Sun, and they have kept water ice for billions of years. Ice is
            water to drink, air to breathe and fuel for the journey home. This is the
            region the Artemis flights are meant to explore.
