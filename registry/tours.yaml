# A TRIP is a chain of shots the camera flies, one card per stop. Adding a trip is a ROW here
# plus a row per stop, and nothing under site/js/. The browser cannot parse YAML, so
# scripts/gen_tours_js.py mirrors this into site/js/data/tours.js and CI refuses a stale mirror --
# the same arrangement registry/rockets.yaml and registry/oddities.yaml have, for the same reason.
#
# A TRIP MAY NOT PROMISE A STOP IT WILL NOT DELIVER. That is the one rule, and every refusal in
# scripts/check_registry.py is it in different clothes. A stop that cannot resolve is dropped
# BEFORE the count is shown, so "5 stops, about two minutes" is a true sentence rather than a
# hope; and a stop that could never resolve -- a target nobody can place, or a thing that is not
# a record at all -- is refused here, at the point somebody writes it, rather than found as a
# stop that quietly is not there.
#
# ---------------------------------------------------------------------------------------------
# HOW A STOP NAMES ITS TARGET. Exactly one key, out of four:
#
#     target: {record: tesla-roadster}                 a record id, in any layer
#     target: {layer: stations, catalog: "25544"}      a NORAD number within a layer
#     target: {layer: stations, query: {name_contains: TIANGONG}, pick: first}
#     target: {world: earth}                           a registry/worlds.yaml row
#     target: {site: apollo-11}                        a registry/sites.yaml row
#
# Zero keys or two keys is refused. Ambiguity is the failure mode: a row with both `record:` and
# `layer:` resolves to SOMETHING PLAUSIBLE, which is exactly what this file's validator exists to
# prevent.
#
# `group:` (frame several objects at once) and `view:` (a non-camera stop, such as "the next time
# it crosses your sky") are DESIGNED AND NOT SHIPPED. Between them they served two stops of the
# five in the design, and neither trip below needs one. They arrive with the trip that needs them.
#
# ---------------------------------------------------------------------------------------------
# THERE IS NO STOP-LEVEL `class:`, AND THAT IS ON PURPOSE. The design this file implements gave
# each stop `class: measured | inferred | illustrative | sample`, hand-authored. A hand-authored
# class can only ever do one of two things: repeat what the record already knows, or contradict
# it. A stop could be written `measured` about a record the registry classes `inferred` and the
# validator would have passed it -- a field whose only power is to state a falsehood the app
# already knows better than. The card prints the RECORD's own `cls`, as it already does for every
# other card in the app. `class:` anywhere in this file is refused, with that reason.
#
# ---------------------------------------------------------------------------------------------
# THE FIELDS
#
#   id            unique here, AND not equal to any registry/layers.yaml id. `oddities` is a
#                 layer; the trip that visits it is `strangest-things`. Two registries sharing a
#                 word is how a cross-reference by bare id ends up resolving to the wrong thing.
#   title         what a visitor reads on the row and on the intro card. <= 60 characters.
#   blurb         one sentence under the title. The LENGTH is not written here: the generator
#                 computes it from the flights and the dwells, so the number a visitor is
#                 promised and the number the browser runs are the same number.
#   pacing        `auto` plays; `reader` waits for Next. prefers-reduced-motion FORCES reader.
#   requires      layer ids that must be enabled AND loaded before the trip is offered.
#   min_stops     below this the trip is offered GREYED WITH ITS REASON, never hidden: a missing
#                 feature and a broken one look identical when you hide one. Floor of 3 -- below
#                 three stops it is a link, not a trip.
#   stage         the world, or the rung of the ladder, the map is centred on for the trip:
#                 `earth` by default, any registry/worlds.yaml or registry/stages.yaml id. This
#                 was `earth` only until spec 0028 step 8 taught the trip to save the stage on
#                 begin, switch with ctx.setStage, and put it back on leave (ui/trip.js), and the
#                 rig is re-taught its world at every stop. Leaving a trip on another stage is the
#                 one leave that moves the camera -- it goes back to the stage it came from -- so
#                 such a trip's blurb says so.
#   clock         as-found | live | freeze. `freeze` pauses time, which flips the clock from live
#                 to scrub, which drops glyph re-propagation from every 100 ms to EVERY FRAME
#                 (main.js) -- so a trip that freezes may not require the `active` layer, which
#                 is eleven thousand objects. The validator enforces exactly that.
#
# PER STOP
#   id            unique within its trip.
#   target        above.
#   needs_layer   this stop's own layer requirement, when it differs from the trip's. The trip
#                 switches it on for the duration and switches it back on the way out.
#   distance_km   how far the camera sits from the subject. It does NOT change how big the
#                 subject looks: scene/heroes.js draws every model at a constant ANGULAR size, so
#                 this number decides how much WORLD is in frame behind it, and nothing else.
#   frame_radii   the same thing said in radii, for a `world:` target, which is the only target
#                 that has a radius. Celestia's `goto` default is 5.0 and it is a good one.
#                 Refused below 1.02, which is inside the camera's own world-clearance floor:
#                 the rig would push the camera back out and the framing would be silently
#                 ignored.
#   drift_deg     ONE arc, never a lap. A lap slow enough to read is sixty seconds, at which
#                 point the turn has stopped being a camera move and become a wait. Refused if it
#                 cannot finish inside its own dwell with the 0.4 s lead and the 1.5 s tail --
#                 which caps it by what the shot can hold rather than at an arbitrary number.
#   on_unresolved `drop` (default) removes the stop before the count is shown. `hold` keeps it,
#                 flies to the parent world instead, shows the honest failure, and NEVER
#                 auto-advances: a failure that scrolls past is a failure nobody can report.
#                 `fallback` is designed and not shipped -- the one stop that needed it was the
#                 `view:` stop, which is not shipped either.
#   card.title    <= 60 characters.
#   card.body     the words. The first sentence is capped at 160 characters, which is the cap
#                 site/js/ui/cards.js already measures; capping it where it is WRITTEN is what
#                 stops a card saying half of something. The dwell is computed from the word
#                 count and never from the flight duration, so nothing about the camera can
#                 quietly shorten a reader's time.
version: 1

defaults:
  pacing: auto
  stage: earth
  clock: as-found
  min_stops: 3
  frame_radii: 5.0
  drift_deg: 34
  drift_rate_deg_s: 6
  drift: toward-light       # toward-light | away | none
  key_light_deg: 125        # three-quarter back light; 0 would be flat, 180 a silhouette
  ease: auto                # auto = `inout` under 3 s, `cruise` over. Or name one.
  on_unresolved: drop

tours:

  # =============================================================================================
  # Everything this trip needs is loaded in the first seconds of a first visit, which is why it
  # is the one to offer a stranger. It ends on the Earth rather than on a station because the
  # thing worth remembering is not either station: it is that there are two of them and nothing
  # else, on a planet with eight billion people on it.
  # =============================================================================================
  # The trip id may not be a layer id -- `stations` is a row in registry/layers.yaml, and the
  # validator refuses the collision. It caught this one on the first run.
  - id: people-in-space
    title: "Where people are living in space right now"
    blurb: "The only two places above you tonight with people inside them."
    requires: [stations]
    clock: as-found
    stops:
      - id: far
        target: {layer: stations, catalog: "25544"}
        # Far enough back that the planet reads as a planet: at 32 000 km the Earth is about
        # half the frame, which is the shot that makes "above your head" mean something.
        distance_km: 32000
        drift_deg: 20
        card:
          title: "Two places, and only two"
          body: >-
            Right now there are exactly two homes above your head with people inside them.
            Everything else up here is a machine.

      - id: iss
        target: {layer: stations, catalog: "25544"}
        distance_km: 3000
        card:
          title: "The International Space Station"
          body: >-
            About the size of a football pitch, and moving at nearly eight kilometres a second. It
            goes all the way round the Earth every ninety-three minutes, so the crew see fifteen or
            sixteen sunrises a day.

      - id: tiangong
        # MEASURED IN A BROWSER, 2026-09-07, and the design had it wrong: CelesTrak's stations
        # group has no object called TIANGONG. The core module is `CSS (TIANHE)`, and the three
        # CSS modules are three separate rows. Querying for TIANGONG resolved to nothing and the
        # stop was dropped -- correctly and silently, which is the point of checking.
        target: {layer: stations, query: {name_contains: TIANHE}, pick: first}
        # DELIBERATELY IDENTICAL to the stop above. The comparison is honest only if the framing
        # is, and a closer shot of the smaller station would be flattering it.
        distance_km: 3000
        card:
          title: "Tiangong"
          body: >-
            China's station, about a fifth the mass, and newer. Three people live here at a time,
            in a low orbit like the other one's, a few hundred kilometres up.

      - id: both
        target: {world: earth}
        frame_radii: 5.0
        drift_deg: 20
        # THIS CARD USED TO SAY "They are never near each other. Two specks on opposite sides of
        # one planet" -- written as a constant, about two things that move. Two circular orbits
        # with J2 precession (ISS 415 km at 51.64 deg, Tiangong 385 km at 41.47 deg), one year at
        # 20 s steps from twenty random starts, 2026-09-22: they average 9 000 km apart and are
        # farther apart than the Earth is wide only 12 % of the time; closer than 1 000 km about
        # nine minutes a day, closer than 2 000 km about forty; and every year they pass within
        # ~30 km, the difference in their heights, where the two orbits cross. "Most of the time
        # thousands of kilometres apart" is what survives that.
        card:
          title: "Two specks, one planet"
          body: >-
            Most of the time they are thousands of kilometres apart. Two specks going round one
            planet, and that is the whole of humanity that does not live on the ground.

  # =============================================================================================
  # THE ID IS `strangest-things` AND NOT `oddities`, because `oddities` is the layer. Every stop
  # below is bundled data checked into this repository, so this trip needs no network at all and
  # nothing in it can fail to resolve for a reason outside the tree -- which makes it the SAFEST
  # trip in the set rather than the riskiest.
  #
  # THE ORDER IS BACKWARDS FROM THE ENDING. The last thing anyone sees is what they remember, so
  # the ending is chosen first and the fragile stops sit at the tail: drop the last two and it
  # still ends on a lunar surface, which is also a good ending.
  #
  # THE GOLDEN RECORD STOP FLIES TO VOYAGER 1, not to the record. The record is drawn as a child
  # of Voyager's model and is not a record in the app's sense at all, so `recordById` would
  # return null for it and the best stop in the trip would be dropped without a word. Flying to
  # the carrier is also where the object physically is. check_registry.py refuses the mistake by
  # name.
  # =============================================================================================
  - id: strangest-things
    title: "The strangest things we have ever sent"
    blurb: "A family photograph, two golf balls, a library, a record and a car."
    requires: [oddities]
    min_stops: 3
    clock: as-found
    stops:
      - id: duke-photo
        target: {record: duke-family-photo}
        # A surface stop: close enough that the Moon is the ground and not a ball.
        distance_km: 900
        card:
          title: "A photograph lying in the dust"
          # THE TRIP CARD ADDS; IT DOES NOT REPEAT. The object's own card opens right under this one
          # with the record's `fact:`, and all four surface stops here used to say the same thing
          # twice in one panel (read 2026-09-22). So each trip card says what the fact does not,
          # from the row's own `note:` or the source it cites.
          # The inscription is Wikipedia's (Charles Duke, read 2026-09-22), which also says the
          # family signed the back and added thumbprints.
          body: >-
            His family signed the back and pressed their thumbprints into it.
            It also says: This is the family of Astronaut Duke from Planet Earth, who landed on the
            Moon on the twentieth of April 1972.

      - id: golf-balls
        target: {record: shepard-golf-balls}
        distance_km: 900
        card:
          title: "Two golf balls, twenty-four and forty yards out"
          body: >-
            They went twenty-four and forty yards, not the miles everybody repeats. The brand is
            unknown: Shepard never said, so that nobody could make money from it.

      - id: beresheet
        target: {record: beresheet-lunar-library}
        distance_km: 900
        card:
          title: "Thirty million pages, and some tardigrades"
          body: >-
            Nobody knows where in the wreck the discs ended up; the camera orbiting the Moon cannot
            pick them out. Nor can anyone say whether the tardigrades survived the crash.

      - id: golden-record
        target: {record: deep-voyager-1}
        needs_layer: deep-space
        drift_deg: 20
        card:
          title: "A gold record, further away than anything"
          body: >-
            Bolted to the side of this spacecraft is a gold-plated record. It carries whale song,
            greetings in fifty-five languages, and one woman's heartbeat, recorded two days after
            she decided to get married.

      - id: roadster
        target: {record: tesla-roadster}
        card:
          title: "A car, going round the Sun"
          body: >-
            In the glovebox, a towel and a copy of The Hitchhiker's Guide to the Galaxy; on a
            circuit board, the words Made on Earth by humans. Nobody has actually looked at it since
            2018.

      - id: pull-back
        target: {world: earth}
        # Two million kilometres. At this fov the Earth is about three pixels across, which is
        # the whole of the shot: the number was chosen for what it makes the planet LOOK like,
        # and it is the one place in this file where that is the honest reason.
        distance_km: 2000000
        drift_deg: 0
        card:
          title: "And this is where all of it came from"
          body: >-
            Every one of those things was made by people standing on that. From out here you
            cannot pick it out of the dark.

  # =============================================================================================
  # The scale ladder as a trip (spec 0028 step 8). It lives on the STELLAR rung -- one unit is a
  # light-year -- so every distance below is in kilometres of light-years, and leaving it brings
  # the visitor back to Earth, because a camera cannot stay put when the unit changes under it.
  # The last card is the honesty line: what this map draws of what is known.
  # =============================================================================================
  - id: to-the-edge
    title: "To the edge of what we know"
    blurb: "From the Sun to the first black hole anyone photographed, in eight steps. Leaving brings you back to Earth."
    requires: [stars, deep-sky, exotics, galaxy]
    stage: stellar
    clock: as-found
    stops:
      - id: sun
        target: {world: sun}
        distance_km: 9460730472580.8
        drift_deg: 15
        card:
          title: "The Sun, from one light-year"
          body: >-
            From here the whole Solar System is smaller than a pixel. Light from the Sun takes a year
            to reach this spot; Voyager 1, the fastest thing we have sent out of the Solar System,
            would take about eighteen thousand.

      - id: proxima
        target: {record: hip-70890}
        needs_layer: stars
        distance_km: 4730365236290.4
        card:
          title: "Proxima Centauri"
          body: >-
            The nearest star to the Sun, a dim red one an eighth of the Sun's mass. It has at least
            one planet. Every star you can see with your eyes at night is farther away than this one.

      - id: sirius
        target: {record: hip-32349}
        needs_layer: stars
        distance_km: 9460730472580.8
        card:
          title: "Sirius"
          body: >-
            The brightest star in our sky, eight and a half light-years out and twenty-five times as
            bright as the Sun. The light reaching your eye tonight left it eight and a half years ago.

      - id: pleiades
        target: {record: dso-m45}
        needs_layer: deep-sky
        distance_km: 946073047258080
        card:
          title: "The Pleiades"
          body: >-
            Over a thousand young stars, a hundred million years old, about four hundred and
            twenty-five light-years away. Their light left when Shakespeare was alive.

      - id: centre
        target: {record: exotic-sgr-a-star}
        needs_layer: exotics
        distance_km: 47303652362904000
        card:
          title: "The centre of the galaxy"
          body: >-
            Twenty-seven thousand light-years from home, a black hole of four million Suns that the
            whole Milky Way turns around. The disc, bar and arms drawn around you are a model built
            from measurements; the stars are the measured part.

      - id: galaxy
        target: {record: dso-milky-way}
        needs_layer: galaxy
        distance_km: 567643828354848000
        card:
          title: "The Milky Way"
          body: >-
            Our galaxy, about ninety thousand light-years across, seen from sixty thousand light-years
            above its disc, a view nobody has had. The shape is an illustration of what has been
            measured.

      - id: andromeda
        target: {record: dso-m31}
        needs_layer: deep-sky
        distance_km: 2838219141774240000
        card:
          title: "Andromeda"
          body: >-
            The nearest big galaxy, two and a half million light-years away and coming our way. Its
            light left when the first humans were learning to use tools.

      - id: edge
        target: {record: exotic-m87-star}
        needs_layer: exotics
        distance_km: 47303652362904000000
        card:
          # "THIS IS AS FAR AS THIS MAP DRAWS PLACES" was never true: the exotics layer draws TON 618's
          # black hole 10.8 billion light-years out, and M109 (83.5 Mly) and, since public #201, NGC 1300
          # and the Antennae are farther than M87 too. The trip still ends here, on the first black hole
          # anyone photographed; the card now says the map goes further. test_dso reads the number.
          title: "As far as this trip goes"
          body: >-
            Fifty-three million light-years: the black hole in M87, the first one ever photographed.
            The map goes further, to a quasar's black hole 10.8 billion light-years out. It shows
            109 389 stars of the 1.8 billion Gaia has measured, 209 nebulae, clusters and galaxies (110 of them from OpenNGC's 13 372), and every
            confirmed planet around another star whose distance has been measured. The rest is out
            there; we have not drawn what we cannot place.

  # =============================================================================================
  # The Moon's landing sites as a trip: the first soft landing, the first people, a rover driven
  # from Earth, the last crew, the far side, the south pole and the first private landers, in the
  # order they happened. Every stop is a registry/sites.yaml row (PR #210) and every one ships in
  # this repository, so like `strangest-things` this trip needs no network at all.
  #
  # THE CARD UNDER EACH OF THESE IS THE SITE'S OWN. A site card opens with the row's `doing:`
  # sentence (ui/cards.js), right under the trip's words, so each body below says what that
  # sentence does not. tests/test_contract.mjs holds the two apart: six words in a row shared with
  # the row's sentence is a repeat.
  #
  # EVERY FACT HAS ITS PAGE, all read 2026-09-22. "NSSDCA table" is the site rows' own
  # `nssdc-lunar` reference (Table of Anthropogenic Impacts and Spacecraft on the Moon, last updated
  # 13 August 2025); "NSSDCA <id>" is https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=<id>.
  #
  # ON THE MOON'S STAGE. The trip recentres the map on the Moon for its length, as `to-the-edge`
  # does on the stellar rung, and leaving puts the visitor back on the stage they came from, which
  # the blurb says. Measured in headless Chrome on 2026-09-22, first on the Earth stage: every
  # lander there was stood up away from the EARTH, not the Moon (scene/heroes.js took the stage
  # origin for "down"), so Surveyor 1 was two footpads sticking out of the ground. heroes.js now
  # takes the site's own world, but on the Moon's stage the Moon IS the origin: "down", the rig's
  # clearance sphere and a visitor's own hand on the camera during a pause all agree with nothing
  # to re-teach. Staying on the Earth stage would have kept the camera where it is on leave, and
  # left the rig's clearance on the Earth with the camera beside the Moon.
  #
  # 900 km, as `strangest-things` uses for its lunar surface stops: close enough that the Moon is
  # the ground and not a ball, with its curve and the black sky still in frame. At a landing site
  # ui/trip.js turns the camera's up to the site's own vertical, so the ground is at the bottom of
  # the frame, the lander stands on it, and the drift circles it at the height it arrived.
  # =============================================================================================
  - id: moon-landings
    title: "Where we have landed on the Moon"
    blurb: "The first soft landing, the first people, a rover driven from Earth, the far side, the south pole and the first private landers. Leaving brings you back to Earth."
    # The worlds switch too: with it off the Moon is not drawn and every lander would stand on
    # nothing. The trip turns both on for its length and puts them back on the way out.
    requires: [hand-kept-sites, worlds]
    stage: moon
    clock: as-found
    stops:
      - id: surveyor-1
        target: {site: surveyor-1}
        distance_km: 900
        card:
          title: "The first soft landing anyone can find"
          # NSSDCA 1966-006A: Luna 9 made the first soft landing, "preceding the U.S. Surveyor 1
          # soft lander by about 4 months", on 3 February 1966. NSSDCA table note f (Wagner et al.
          # 2017): the published coordinates are from the first Pravda report, LROC finds no lander
          # there, and the site "is probably at least 10 km away, direction unknown" -- which is
          # why registry/sites.yaml has no Luna 9 row. NSSDCA 1966-045A: "Engines were turned off
          # at a height of 3.4 m above the lunar surface and the spacecraft fell freely".
          body: >-
            It was not the first. The Soviet Luna 9 landed softly four months earlier, on 3
            February 1966, but NASA's table says the place published for it is probably at least
            10 km out, direction unknown. Surveyor 1 shut off its engines 3.4 m up and dropped the
            rest of the way.

      - id: apollo-11
        target: {site: apollo-11}
        distance_km: 900
        card:
          title: "The first people"
          # NSSDCA 1969-059C (the Apollo 11 lunar module): the LM "lifted off from the Moon ...
          # after 21 hours, 36 minutes on the lunar surface"; "The astronauts traversed a total
          # distance of about 250 meters, both ranging up to about 100 meters from the LM"; and
          # the CSM was "piloted by Michael Collins".
          body: >-
            Neil Armstrong and Buzz Aldrin stayed 21 hours and 36 minutes. Their whole walk
            covered about 250 metres, and neither went more than about 100 m from the lander.
            Michael Collins waited for them in orbit.

      - id: apollo-12
        target: {site: apollo-12}
        distance_km: 900
        card:
          title: "A visit to an older robot"
          # NSSDCA 1969-099C: on the second moonwalk they "visited the Surveyor 3 spacecraft,
          # bringing back about 10 kg of parts for later examination on Earth". NSSDCA 1967-035A:
          # the parts included the TV camera, and "The Surveyor 3 camera is now on display in the
          # Smithsonian National Air and Space Museum in Washington, D.C." Surveyor 3 is its own
          # row, 157 m from this one at the two rows' coordinates (NSSDCA says "about 180 m"), so
          # at this distance the two are drawn one on top of the other.
          body: >-
            On their second walk they went over to Surveyor 3 and brought about 10 kg of it home to
            study, its TV camera included. That camera is on show at the Smithsonian's National Air
            and Space Museum in Washington.

      - id: lunokhod-1
        target: {site: lunokhod-1}
        distance_km: 900
        card:
          title: "A rover driven from Earth"
          # NSSDCA 1970-095D (Lunokhod 1): its TV images "were used by a five-man team of
          # controllers on Earth who sent driving commands to the rover in real time"; "two
          # speeds, ~1 km/hr and ~2 km/hr"; "intended to operate through three lunar days but
          # actually operated for eleven lunar days (322 Earth days)".
          body: >-
            Nobody rode it. A team of five controllers on Earth drove it by its television
            pictures, at one or two kilometres an hour. It was built to last three lunar days and
            kept going for eleven, 322 Earth days in all.

      - id: apollo-17
        target: {site: apollo-17}
        distance_km: 900
        card:
          title: "Seventy-five hours, then a long quiet"
          # NSSDCA 1972-096C: "Schmitt was the first scientist-astronaut to walk on the Moon"; the
          # LM lifted off "after 75 hours on the lunar surface"; on three moonwalks "they covered
          # 30 km", using the rover. The NSSDCA table's soft landings after 11 December 1972 are
          # Luna 21 (1973), Luna 23 (1974) and Luna 24 (18 August 1976), and the next is Chang'e 3
          # on 14 December 2013: thirty-seven years and four months. Impacts in between (Hiten,
          # Lunar Prospector, SMART-1) are not landings, hence "landed softly".
          body: >-
            Gene Cernan and Harrison Schmitt, the first scientist to walk on the Moon, stayed 75
            hours and covered 30 km with their rover. After them robots landed three more times,
            and then nothing landed softly on the Moon for 37 years.

      - id: change-4
        target: {site: change-4}
        distance_km: 900
        card:
          title: "The side that never faces us"
          # NSSDCA 2018-103A: "Since the lander is on the far side, the Moon is blocking direct
          # radio contact with the Earth, so a relay satellite is used"; Queqiao, "in a halo orbit
          # around the Earth-Moon L2 point", launched on 20 May 2018, seven months before the
          # landing. NSSDCA table note z: "Yutu 2 rover still mobile as of January 2023", four
          # years after the landing on 3 January 2019. At 177.6 E the Earth stays below the
          # horizon whatever the Moon's wobble, which reaches about eight degrees of longitude.
          body: >-
            From here the Earth is always below the horizon, so the Moon itself blocks any radio
            link home. China first put a relay satellite, Queqiao, out beyond the Moon, and the
            lander spoke to Earth through it. Its rover, Yutu 2, was still driving four years
            later.

      - id: chandrayaan-3
        target: {site: chandrayaan-3}
        distance_km: 900
        card:
          title: "Near the south pole"
          # NSSDCA 2019-042A (Chandrayaan-2): "The lander, named Vikram"; contact was lost during
          # the descent on 6 September 2019 UT and it "crashed on the surface at 70.881 S, 22.784
          # E". Great circle from there to this row's 69.3741 S, 32.32 E on a 1737.4 km sphere:
          # 108 km. NSSDCA 2023-098A: "designed to operate for one lunar daylight period (about 14
          # Earth days). On September 4 they entered sleep mode."
          body: >-
            India's first try, Chandrayaan-2, carried a lander also called Vikram, and it crashed in
            September 2019 about 110 km from here. This one was built to work for one lunar day,
            about 14 Earth days, and was put to sleep on 4 September 2023.

      - id: im-1
        target: {site: im-1}
        distance_km: 900
        card:
          title: "The first private lander, leaning"
          # NSSDCA IM-1-NOVA: "It landed in a 1 km diameter crater on a slope of about 12 degrees
          # ... Some of the landing gear broke upon impact, and Odysseus tipped over and was
          # resting at a 30 degree angle to the horizontal, but was still operational." The NSSDCA
          # table: no landing before it was nearer a pole than 80.13 S (Chandrayaan-3's 69.37 S
          # was the nearest), and Intuitive Machines 2 landed at 84.7906 S on 6 March 2025.
          body: >-
            It came down on a slope of about 12 degrees, broke some of its landing gear, and came
            to rest leaning at 30 degrees, still working. Nothing had landed nearer a pole until
            the same company's next lander, IM-2, reached 84.8 degrees south in March 2025.

      - id: blue-ghost-1
        target: {site: blue-ghost-1}
        distance_km: 900
        card:
          title: "An eclipse, seen from the Moon"
          # NASA, "NASA Science Continues After Firefly's First Moon Mission Concludes" (18 March
          # 2025): "10 NASA science and technology instruments"; it recorded "a total solar
          # eclipse". Firefly, "Firefly Aerospace Successfully Completes 14 Days of Surface
          # Operations on the Moon" (17 March 2025): imagery "of a total solar eclipse on March 14
          # ... where the Earth blocks the sun", and "of the lunar sunset on March 16", for "a
          # lunar horizon glow that was hypothesized and observed by Eugene Cernan on Apollo 17".
          # Not "the first eclipse seen from the Moon": Surveyor 3 recorded images of an eclipse
          # of the Sun by the Earth in 1967 (NSSDCA 1967-035A).
          body: >-
            It carried ten NASA instruments. On 14 March 2025 it watched the Earth pass in front of
            the Sun, a total eclipse seen from the Moon. Two days later it filmed the sunset,
            looking for a glow over the horizon that Gene Cernan saw on Apollo 17.

      - id: whole-moon
        target: {world: moon}
        # Six radii, not Celestia's five: the Moon is then 19 degrees across, inside the 22-degree
        # width of a 390 px phone held upright (measured at four radii, 2026-09-22, the disc ran
        # off both sides of the phone), and a third of a 1280 x 800 window.
        frame_radii: 6.0
        drift_deg: 20
        # Lit from the front, not three-quarter behind: the last shot is the Moon's face with its
        # sites on it, and the house back light would make it a crescent.
        key_light_deg: 45
        card:
          title: "Twenty-eight landings, nineteen on this map"
          # The NSSDCA table, "Last Updated: 13 August 2025", counted 2026-09-22: 28 rows typed
          # Soft Landing, Crewed Landing or Lander, leaving out the two Yutu rovers it also types
          # Soft Landing; 6 of them Crewed Landing. The 19 is registry/sites.yaml's lunar rows
          # that are records -- two of them the rovers Luna 17 and Luna 21 carried, where they
          # stopped -- and tests/test_moon_trip.mjs holds this card to that count.
          body: >-
            NASA's table of what lies on the Moon, last updated in August 2025, lists 28 landings,
            six of them with people aboard. This map marks 19 of them, two by where their rovers
            stopped. Luna 9, the first of all, is not one: nobody knows exactly where it is.
