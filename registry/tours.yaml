# A TRIP is a chain of shots the camera flies, one card per stop. Adding a trip is a ROW here
# plus a row per stop, and nothing under site/js/. The browser cannot parse YAML, so
# scripts/gen_tours_js.py mirrors this into site/js/data/tours.js and CI refuses a stale mirror --
# the same arrangement registry/rockets.yaml and registry/oddities.yaml have, for the same reason.
#
# A TRIP MAY NOT PROMISE A STOP IT WILL NOT DELIVER. That is the one rule, and every refusal in
# scripts/check_registry.py is it in different clothes. A stop that cannot resolve is dropped
# BEFORE the count is shown, so "5 stops, about two minutes" is a true sentence rather than a
# hope; and a stop that could never resolve -- a target nobody can place, or a thing that is not
# a record at all -- is refused here, at the point somebody writes it, rather than found as a
# stop that quietly is not there.
#
# ---------------------------------------------------------------------------------------------
# HOW A STOP NAMES ITS TARGET. Exactly one key, out of four:
#
#     target: {record: tesla-roadster}                 a record id, in any layer
#     target: {layer: stations, catalog: "25544"}      a NORAD number within a layer
#     target: {layer: stations, query: {name_contains: TIANGONG}, pick: first}
#     target: {world: earth}                           a registry/worlds.yaml row
#     target: {site: apollo-11}                        a registry/sites.yaml row
#
# Zero keys or two keys is refused. Ambiguity is the failure mode: a row with both `record:` and
# `layer:` resolves to SOMETHING PLAUSIBLE, which is exactly what this file's validator exists to
# prevent.
#
# `group:` (frame several objects at once) and `view:` (a non-camera stop, such as "the next time
# it crosses your sky") are DESIGNED AND NOT SHIPPED. Between them they served two stops of the
# five in the design, and neither trip below needs one. They arrive with the trip that needs them.
#
# ---------------------------------------------------------------------------------------------
# THERE IS NO STOP-LEVEL `class:`, AND THAT IS ON PURPOSE. The design this file implements gave
# each stop `class: measured | inferred | illustrative | sample`, hand-authored. A hand-authored
# class can only ever do one of two things: repeat what the record already knows, or contradict
# it. A stop could be written `measured` about a record the registry classes `inferred` and the
# validator would have passed it -- a field whose only power is to state a falsehood the app
# already knows better than. The card prints the RECORD's own `cls`, as it already does for every
# other card in the app. `class:` anywhere in this file is refused, with that reason.
#
# ---------------------------------------------------------------------------------------------
# THE FIELDS
#
#   id            unique here, AND not equal to any registry/layers.yaml id. `oddities` is a
#                 layer; the trip that visits it is `strangest-things`. Two registries sharing a
#                 word is how a cross-reference by bare id ends up resolving to the wrong thing.
#   title         what a visitor reads on the row and on the intro card. <= 60 characters.
#   blurb         one sentence under the title. The LENGTH is not written here: the generator
#                 computes it from the flights and the dwells, so the number a visitor is
#                 promised and the number the browser runs are the same number.
#   pacing        `auto` plays; `reader` waits for Next. prefers-reduced-motion FORCES reader.
#   requires      layer ids that must be enabled AND loaded before the trip is offered.
#   min_stops     below this the trip is offered GREYED WITH ITS REASON, never hidden: a missing
#                 feature and a broken one look identical when you hide one. Floor of 3 -- below
#                 three stops it is a link, not a trip.
#   stage         the world, or the rung of the ladder, the map is centred on for the trip, and so
#                 what one scene unit is: `earth` by default, any registry/worlds.yaml or
#                 registry/stages.yaml id. This was `earth` only until spec 0028 step 8 taught the
#                 trip to save the stage on begin, switch with ctx.setStage, and put it back on
#                 leave (ui/trip.js), and the rig is re-taught its world at every stop. Leaving a
#                 trip on another stage is the one leave that moves the camera -- it goes back to
#                 the stage it came from -- so such a trip's blurb says so. Every stop is flown on
#                 this stage unless it names its own, below.
#   clock         as-found | live | freeze. `freeze` pauses time, which flips the clock from live
#                 to scrub, which drops glyph re-propagation from every 100 ms to EVERY FRAME
#                 (main.js) -- so a trip that freezes may not require the `active` layer, which
#                 is eleven thousand objects. The validator enforces exactly that.
#   group         which `groups:` row (below) the picker lists the trip under. REQUIRED, and it
#                 must name a row: a trip with no group has nowhere to be drawn, and the panel
#                 lists every trip (spec 0029). Written on the trip and not derived from its
#                 stage, because the Moon trip is "around the Solar System" and the stations trip
#                 is "around the Earth" for reasons a stage id does not carry.
#   next          the trip the end card offers first, by id, still only if it can run that day
#                 (ui/tripframe.js asks plan() before it appends the button). Optional: without
#                 it the end card offers the next trip in this file's order, wrapping round. May
#                 not name a trip that is not here, nor the trip itself.
#
# PER STOP
#   id            unique within its trip.
#   target        above.
#   needs_layer   this stop's own layer requirement, when it differs from the trip's. The trip
#                 switches it on for the duration and switches it back on the way out.
#   stage         this stop's own centre for the map, when it differs from the trip's. IT IS A
#                 TRUTH SETTING, not a camera one. A world is drawn where it really is only from
#                 its own stage, from the stage of the planet it goes round, and from the stages
#                 that squeeze nothing (the Sun's, and the ladder's rungs). From everywhere else
#                 scene/worlds.js draws it nearer and larger, and its moons around the enlarged
#                 disc -- so a stop that flew to where Titan really is, from Earth's stage, would
#                 arrive 1.4 billion km from the Titan on the screen. check_registry.py refuses
#                 that pairing by name. Changing stage between two stops is a CUT: the stop being
#                 left is drawn squeezed from the new stage, so there is nothing to fly away from.
#                 Onto a stage that squeezes nothing the camera keeps its place in kilometres
#                 instead, which is why Pluto to Eris below is one move and not a jump to the Sun.
#   behind        a world (worlds.yaml) the shot keeps in the picture behind its subject. The
#                 camera's direction is otherwise chosen by the key light, which knows about the
#                 Sun and nothing else: measured in a browser, the first stop of the trip below
#                 came out with Io alone in the dark and Jupiter's disc 198 px above the top of the
#                 frame, under a card that opens "Io goes round Jupiter every 42 hours". The
#                 key-light search is narrowed to the directions that hold this world within 22
#                 degrees of the middle, and falls back to the best-lit direction when none does,
#                 so it narrows the choice and never empties it. The world named must be drawn true
#                 from the stop's stage, and check_registry.py refuses it when it is not.
#   distance_km   how far the camera sits from the subject. It does NOT change how big the
#                 subject looks: scene/heroes.js draws every model at a constant ANGULAR size, so
#                 this number decides how much WORLD is in frame behind it, and nothing else.
#   frame_radii   the same thing said in radii, for a `world:` target, which is the only target
#                 that has a radius. Celestia's `goto` default is 5.0 and it is a good one.
#                 Refused below 1.02, which is inside the camera's own world-clearance floor:
#                 the rig would push the camera back out and the framing would be silently
#                 ignored.
#   drift_deg     ONE arc, never a lap. A lap slow enough to read is sixty seconds, at which
#                 point the turn has stopped being a camera move and become a wait. Refused if it
#                 cannot finish inside its own dwell with the 0.4 s lead and the 1.5 s tail --
#                 which caps it by what the shot can hold rather than at an arbitrary number.
#   on_unresolved `drop` (default) removes the stop before the count is shown. `hold` keeps it,
#                 flies to the parent world instead, shows the honest failure, and NEVER
#                 auto-advances: a failure that scrolls past is a failure nobody can report.
#                 `fallback` is designed and not shipped -- the one stop that needed it was the
#                 `view:` stop, which is not shipped either.
#   time          the instant this stop is shown at (spec 0030): an ISO 8601 UTC instant, `now`, or
#                 `{event: <events.yaml id>.next, offset_s: <int>}`, the first such event after the
#                 visitor's clock. ui/trip.js moves the clock there BEFORE the shot is composed, so
#                 the key light and the arrival are this instant's, and the frame prints a "Shown
#                 at" line built from the clock -- which is why the card under a timed stop may not
#                 state a time itself. An event reference is resolved by spec 0031's
#                 data/events.js nextEvent(), 400 days ahead; one it cannot find follows
#                 `on_unresolved` like a lost target, and the count on the intro card is taken after.
#                 An eclipse may add `kind:` (spec 0037): `total | annular | partial | hybrid` for
#                 `solar-eclipse`, `total | partial | penumbral` for `lunar-eclipse`, looked for
#                 1 200 days ahead. Every reference counts from the clock the visitor had when the
#                 trip began, not from where an earlier stop has run it to.
#   rate          how fast the clock runs while the stop is up: 60 at most on an Earth-orbit
#                 target, 36 000 on anything else, and up to 1 000 000 only on the Sun's stage or
#                 a rung, where a world's own motion is the picture. Once a stop has touched the
#                 clock the trip owns it until leave: a later stop without `rate:` runs at 1, one
#                 without `time:` carries on from wherever the clock got to, and leaving puts the
#                 visitor's instant, rate and pause back. `rate: 0` is refused (a still frame
#                 under a card is a slide); a trip that must be still writes `clock: freeze`.
#   card.title    <= 60 characters.
#   card.body     the words. The first sentence is capped at 160 characters, which is the cap
#                 site/js/ui/cards.js already measures; capping it where it is WRITTEN is what
#                 stops a card saying half of something. The dwell is computed from the word
#                 count and never from the flight duration, so nothing about the camera can
#                 quietly shorten a reader's time.
version: 1

# THE GROUPS. A trip names one, and the picker in the panel (site/js/ui/trippicker.js) draws one
# heading per group that has a trip in it, in `order`. A group with no trips is allowed and is
# not drawn: `events` waits for the first trip about something that has not happened yet. The
# `display` string is printed as it is, which makes this the one place copy lives in a registry
# other than registry/layers.yaml's layer names, and for the same reason: the row IS the thing.
# A group id may not be a layer id, exactly as a trip id may not (below).
groups:
  - {id: earth-orbit,  display: "Around the Earth",        order: 1}
  - {id: solar-system, display: "Around the Solar System", order: 2}
  - {id: beyond,       display: "Beyond the Solar System", order: 3}
  - {id: events,       display: "Things about to happen",  order: 4}

defaults:
  pacing: auto
  stage: earth
  clock: as-found
  min_stops: 3
  frame_radii: 5.0
  drift_deg: 34
  drift_rate_deg_s: 6
  drift: toward-light       # toward-light | away | none
  key_light_deg: 125        # three-quarter back light; 0 would be flat, 180 a silhouette
  ease: auto                # auto = `inout` under 3 s, `cruise` over. Or name one.
  on_unresolved: drop

tours:

  # =============================================================================================
  # Everything this trip needs is loaded in the first seconds of a first visit, which is why it
  # is the one to offer a stranger. It ends on the Earth rather than on a station because the
  # thing worth remembering is not either station: it is that there are two of them and nothing
  # else, on a planet with eight billion people on it.
  # =============================================================================================
  # The trip id may not be a layer id -- `stations` is a row in registry/layers.yaml, and the
  # validator refuses the collision. It caught this one on the first run.
  - id: people-in-space
    title: "Where people are living in space right now"
    blurb: "The only two places above you tonight with people inside them."
    group: earth-orbit
    next: strangest-things
    requires: [stations]
    clock: as-found
    stops:
      - id: far
        target: {layer: stations, catalog: "25544"}
        # Far enough back that the planet reads as a planet: at 32 000 km the Earth is about
        # half the frame, which is the shot that makes "above your head" mean something.
        distance_km: 32000
        drift_deg: 20
        card:
          title: "Two places, and only two"
          body: >-
            Right now there are exactly two homes above your head with people inside them.
            Everything else up here is a machine.

      - id: iss
        target: {layer: stations, catalog: "25544"}
        distance_km: 3000
        card:
          title: "The International Space Station"
          body: >-
            About the size of a football pitch, and moving at nearly eight kilometres a second. It
            goes all the way round the Earth every ninety-three minutes, so the crew see fifteen or
            sixteen sunrises a day.

      - id: tiangong
        # MEASURED IN A BROWSER, 2026-09-07, and the design had it wrong: CelesTrak's stations
        # group has no object called TIANGONG. The core module is `CSS (TIANHE)`, and the three
        # CSS modules are three separate rows. Querying for TIANGONG resolved to nothing and the
        # stop was dropped -- correctly and silently, which is the point of checking.
        target: {layer: stations, query: {name_contains: TIANHE}, pick: first}
        # DELIBERATELY IDENTICAL to the stop above. The comparison is honest only if the framing
        # is, and a closer shot of the smaller station would be flattering it.
        distance_km: 3000
        card:
          title: "Tiangong"
          body: >-
            China's station, about a fifth the mass, and newer. Three people live here at a time,
            in a low orbit like the other one's, a few hundred kilometres up.

      - id: both
        target: {world: earth}
        frame_radii: 5.0
        drift_deg: 20
        # THIS CARD USED TO SAY "They are never near each other. Two specks on opposite sides of
        # one planet" -- written as a constant, about two things that move. Two circular orbits
        # with J2 precession (ISS 415 km at 51.64 deg, Tiangong 385 km at 41.47 deg), one year at
        # 20 s steps from twenty random starts, 2026-09-22: they average 9 000 km apart and are
        # farther apart than the Earth is wide only 12 % of the time; closer than 1 000 km about
        # nine minutes a day, closer than 2 000 km about forty; and every year they pass within
        # ~30 km, the difference in their heights, where the two orbits cross. "Most of the time
        # thousands of kilometres apart" is what survives that.
        card:
          title: "Two specks, one planet"
          body: >-
            Most of the time they are thousands of kilometres apart. Two specks going round one
            planet, and that is the whole of humanity that does not live on the ground.

  # =============================================================================================
  # THE ID IS `strangest-things` AND NOT `oddities`, because `oddities` is the layer. Every stop
  # below is bundled data checked into this repository, so this trip needs no network at all and
  # nothing in it can fail to resolve for a reason outside the tree -- which makes it the SAFEST
  # trip in the set rather than the riskiest.
  #
  # THE ORDER IS BACKWARDS FROM THE ENDING. The last thing anyone sees is what they remember, so
  # the ending is chosen first and the fragile stops sit at the tail: drop the last two and it
  # still ends on a lunar surface, which is also a good ending.
  #
  # THE GOLDEN RECORD STOP FLIES TO VOYAGER 1, not to the record. The record is drawn as a child
  # of Voyager's model and is not a record in the app's sense at all, so `recordById` would
  # return null for it and the best stop in the trip would be dropped without a word. Flying to
  # the carrier is also where the object physically is. check_registry.py refuses the mistake by
  # name.
  # =============================================================================================
  - id: strangest-things
    title: "The strangest things we have ever sent"
    blurb: "A family photograph, two golf balls, a library, a record and a car."
    group: solar-system
    next: moon-landings
    requires: [oddities]
    min_stops: 3
    clock: as-found
    stops:
      - id: duke-photo
        target: {record: duke-family-photo}
        # A surface stop: close enough that the Moon is the ground and not a ball.
        distance_km: 900
        card:
          title: "A photograph lying in the dust"
          # THE TRIP CARD ADDS; IT DOES NOT REPEAT. The object's own card opens right under this one
          # with the record's `fact:`, and all four surface stops here used to say the same thing
          # twice in one panel (read 2026-09-22). So each trip card says what the fact does not,
          # from the row's own `note:` or the source it cites.
          # The inscription is Wikipedia's (Charles Duke, read 2026-09-22), which also says the
          # family signed the back and added thumbprints.
          body: >-
            His family signed the back and pressed their thumbprints into it.
            It also says: This is the family of Astronaut Duke from Planet Earth, who landed on the
            Moon on the twentieth of April 1972.

      - id: golf-balls
        target: {record: shepard-golf-balls}
        distance_km: 900
        card:
          title: "Two golf balls, twenty-four and forty yards out"
          body: >-
            They went twenty-four and forty yards, not the miles everybody repeats. The brand is
            unknown: Shepard never said, so that nobody could make money from it.

      - id: beresheet
        target: {record: beresheet-lunar-library}
        distance_km: 900
        card:
          title: "Thirty million pages, and some tardigrades"
          body: >-
            Nobody knows where in the wreck the discs ended up; the camera orbiting the Moon cannot
            pick them out. Nor can anyone say whether the tardigrades survived the crash.

      - id: golden-record
        target: {record: deep-voyager-1}
        needs_layer: deep-space
        drift_deg: 20
        card:
          title: "A gold record, further away than anything"
          body: >-
            Bolted to the side of this spacecraft is a gold-plated record. It carries whale song,
            greetings in fifty-five languages, and one woman's heartbeat, recorded two days after
            she decided to get married.

      - id: roadster
        target: {record: tesla-roadster}
        card:
          title: "A car, going round the Sun"
          body: >-
            In the glovebox, a towel and a copy of The Hitchhiker's Guide to the Galaxy; on a
            circuit board, the words Made on Earth by humans. Nobody has actually looked at it since
            2018.

      - id: pull-back
        target: {world: earth}
        # Two million kilometres. At this fov the Earth is about three pixels across, which is
        # the whole of the shot: the number was chosen for what it makes the planet LOOK like,
        # and it is the one place in this file where that is the honest reason.
        distance_km: 2000000
        drift_deg: 0
        card:
          title: "And this is where all of it came from"
          body: >-
            Every one of those things was made by people standing on that. From out here you
            cannot pick it out of the dark.

  # =============================================================================================
  # The scale ladder as a trip (spec 0028 step 8). It lives on the STELLAR rung -- one unit is a
  # light-year -- so every distance below is in kilometres of light-years, and leaving it brings
  # the visitor back to Earth, because a camera cannot stay put when the unit changes under it.
  # The last card is the honesty line: what this map draws of what is known.
  # =============================================================================================
  - id: to-the-edge
    title: "To the edge of what we know"
    blurb: "From the Sun to the first black hole anyone photographed, in eight steps. Leaving brings you back to Earth."
    group: beyond
    requires: [stars, deep-sky, exotics, galaxy]
    stage: stellar
    clock: as-found
    stops:
      - id: sun
        target: {world: sun}
        distance_km: 9460730472580.8
        drift_deg: 15
        card:
          title: "The Sun, from one light-year"
          body: >-
            From here the whole Solar System is smaller than a pixel. Light from the Sun takes a year
            to reach this spot; Voyager 1, the fastest thing we have sent out of the Solar System,
            would take about eighteen thousand.

      - id: proxima
        target: {record: hip-70890}
        needs_layer: stars
        distance_km: 4730365236290.4
        card:
          title: "Proxima Centauri"
          body: >-
            The nearest star to the Sun, a dim red one an eighth of the Sun's mass. It has at least
            one planet. Every star you can see with your eyes at night is farther away than this one.

      - id: sirius
        target: {record: hip-32349}
        needs_layer: stars
        distance_km: 9460730472580.8
        card:
          title: "Sirius"
          body: >-
            The brightest star in our sky, eight and a half light-years out and twenty-five times as
            bright as the Sun. The light reaching your eye tonight left it eight and a half years ago.

      - id: pleiades
        target: {record: dso-m45}
        needs_layer: deep-sky
        distance_km: 946073047258080
        card:
          title: "The Pleiades"
          body: >-
            Over a thousand young stars, a hundred million years old, about four hundred and
            twenty-five light-years away. Their light left when Shakespeare was alive.

      - id: centre
        target: {record: exotic-sgr-a-star}
        needs_layer: exotics
        distance_km: 47303652362904000
        card:
          title: "The centre of the galaxy"
          body: >-
            Twenty-seven thousand light-years from home, a black hole of four million Suns that the
            whole Milky Way turns around. The disc, bar and arms drawn around you are a model built
            from measurements; the stars are the measured part.

      - id: galaxy
        target: {record: dso-milky-way}
        needs_layer: galaxy
        distance_km: 567643828354848000
        card:
          title: "The Milky Way"
          body: >-
            Our galaxy, about ninety thousand light-years across, seen from sixty thousand light-years
            above its disc, a view nobody has had. The shape is an illustration of what has been
            measured.

      - id: andromeda
        target: {record: dso-m31}
        needs_layer: deep-sky
        distance_km: 2838219141774240000
        card:
          title: "Andromeda"
          body: >-
            The nearest big galaxy, two and a half million light-years away and coming our way. Its
            light left when the first humans were learning to use tools.

      - id: edge
        target: {record: exotic-m87-star}
        needs_layer: exotics
        distance_km: 47303652362904000000
        card:
          # "THIS IS AS FAR AS THIS MAP DRAWS PLACES" was never true: the exotics layer draws TON 618's
          # black hole 10.8 billion light-years out, and M109 (83.5 Mly) and, since public #201, NGC 1300
          # and the Antennae are farther than M87 too. The trip still ends here, on the first black hole
          # anyone photographed; the card now says the map goes further. test_dso reads the number.
          title: "As far as this trip goes"
          body: >-
            Fifty-three million light-years: the black hole in M87, the first one ever photographed.
            The map goes further, to a quasar's black hole 10.8 billion light-years out. It shows
            109 389 stars of the 1.8 billion Gaia has measured, 209 nebulae, clusters and galaxies (110 of them from OpenNGC's 13 372), and every
            confirmed planet around another star whose distance has been measured. The rest is out
            there; we have not drawn what we cannot place.

  # =============================================================================================
  # The Moon's landing sites as a trip: the first soft landing, the first people, a rover driven
  # from Earth, the last crew, the far side, the south pole and the first private landers, in the
  # order they happened. Every stop is a registry/sites.yaml row (PR #210) and every one ships in
  # this repository, so like `strangest-things` this trip needs no network at all.
  #
  # THE CARD UNDER EACH OF THESE IS THE SITE'S OWN. A site card opens with the row's `doing:`
  # sentence (ui/cards.js), right under the trip's words, so each body below says what that
  # sentence does not. tests/test_contract.mjs holds the two apart: six words in a row shared with
  # the row's sentence is a repeat.
  #
  # EVERY FACT HAS ITS PAGE, all read 2026-09-22. "NSSDCA table" is the site rows' own
  # `nssdc-lunar` reference (Table of Anthropogenic Impacts and Spacecraft on the Moon, last updated
  # 13 August 2025); "NSSDCA <id>" is https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=<id>.
  #
  # ON THE MOON'S STAGE. The trip recentres the map on the Moon for its length, as `to-the-edge`
  # does on the stellar rung, and leaving puts the visitor back on the stage they came from, which
  # the blurb says. Measured in headless Chrome on 2026-09-22, first on the Earth stage: every
  # lander there was stood up away from the EARTH, not the Moon (scene/heroes.js took the stage
  # origin for "down"), so Surveyor 1 was two footpads sticking out of the ground. heroes.js now
  # takes the site's own world, but on the Moon's stage the Moon IS the origin: "down", the rig's
  # clearance sphere and a visitor's own hand on the camera during a pause all agree with nothing
  # to re-teach. Staying on the Earth stage would have kept the camera where it is on leave, and
  # left the rig's clearance on the Earth with the camera beside the Moon.
  #
  # 900 km, as `strangest-things` uses for its lunar surface stops: close enough that the Moon is
  # the ground and not a ball, with its curve and the black sky still in frame. At a landing site
  # ui/trip.js turns the camera's up to the site's own vertical, so the ground is at the bottom of
  # the frame, the lander stands on it, and the drift circles it at the height it arrived.
  # =============================================================================================
  - id: moon-landings
    title: "Where we have landed on the Moon"
    blurb: "The first soft landing, the first people, a rover driven from Earth, the far side, the south pole and the first private landers. Leaving brings you back to Earth."
    group: solar-system
    next: outer-solar-system
    # The worlds switch too: with it off the Moon is not drawn and every lander would stand on
    # nothing. The trip turns both on for its length and puts them back on the way out.
    requires: [hand-kept-sites, worlds]
    stage: moon
    clock: as-found
    stops:
      - id: surveyor-1
        target: {site: surveyor-1}
        distance_km: 900
        card:
          title: "The first soft landing anyone can find"
          # NSSDCA 1966-006A: Luna 9 made the first soft landing, "preceding the U.S. Surveyor 1
          # soft lander by about 4 months", on 3 February 1966. NSSDCA table note f (Wagner et al.
          # 2017): the published coordinates are from the first Pravda report, LROC finds no lander
          # there, and the site "is probably at least 10 km away, direction unknown" -- which is
          # why registry/sites.yaml has no Luna 9 row. NSSDCA 1966-045A: "Engines were turned off
          # at a height of 3.4 m above the lunar surface and the spacecraft fell freely".
          body: >-
            It was not the first. The Soviet Luna 9 landed softly four months earlier, on 3
            February 1966, but NASA's table says the place published for it is probably at least
            10 km out, direction unknown. Surveyor 1 shut off its engines 3.4 m up and dropped the
            rest of the way.

      - id: apollo-11
        target: {site: apollo-11}
        distance_km: 900
        card:
          title: "The first people"
          # NSSDCA 1969-059C (the Apollo 11 lunar module): the LM "lifted off from the Moon ...
          # after 21 hours, 36 minutes on the lunar surface"; "The astronauts traversed a total
          # distance of about 250 meters, both ranging up to about 100 meters from the LM"; and
          # the CSM was "piloted by Michael Collins".
          body: >-
            Neil Armstrong and Buzz Aldrin stayed 21 hours and 36 minutes. Their whole walk
            covered about 250 metres, and neither went more than about 100 m from the lander.
            Michael Collins waited for them in orbit.

      - id: apollo-12
        target: {site: apollo-12}
        distance_km: 900
        card:
          title: "A visit to an older robot"
          # NSSDCA 1969-099C: on the second moonwalk they "visited the Surveyor 3 spacecraft,
          # bringing back about 10 kg of parts for later examination on Earth". NSSDCA 1967-035A:
          # the parts included the TV camera, and "The Surveyor 3 camera is now on display in the
          # Smithsonian National Air and Space Museum in Washington, D.C." Surveyor 3 is its own
          # row, 157 m from this one at the two rows' coordinates (NSSDCA says "about 180 m"), so
          # at this distance the two are drawn one on top of the other.
          body: >-
            On their second walk they went over to Surveyor 3 and brought about 10 kg of it home to
            study, its TV camera included. That camera is on show at the Smithsonian's National Air
            and Space Museum in Washington.

      - id: lunokhod-1
        target: {site: lunokhod-1}
        distance_km: 900
        card:
          title: "A rover driven from Earth"
          # NSSDCA 1970-095D (Lunokhod 1): its TV images "were used by a five-man team of
          # controllers on Earth who sent driving commands to the rover in real time"; "two
          # speeds, ~1 km/hr and ~2 km/hr"; "intended to operate through three lunar days but
          # actually operated for eleven lunar days (322 Earth days)".
          body: >-
            Nobody rode it. A team of five controllers on Earth drove it by its television
            pictures, at one or two kilometres an hour. It was built to last three lunar days and
            kept going for eleven, 322 Earth days in all.

      - id: apollo-17
        target: {site: apollo-17}
        distance_km: 900
        card:
          title: "Seventy-five hours, then a long quiet"
          # NSSDCA 1972-096C: "Schmitt was the first scientist-astronaut to walk on the Moon"; the
          # LM lifted off "after 75 hours on the lunar surface"; on three moonwalks "they covered
          # 30 km", using the rover. The NSSDCA table's soft landings after 11 December 1972 are
          # Luna 21 (1973), Luna 23 (1974) and Luna 24 (18 August 1976), and the next is Chang'e 3
          # on 14 December 2013: thirty-seven years and four months. Impacts in between (Hiten,
          # Lunar Prospector, SMART-1) are not landings, hence "landed softly".
          body: >-
            Gene Cernan and Harrison Schmitt, the first scientist to walk on the Moon, stayed 75
            hours and covered 30 km with their rover. After them robots landed three more times,
            and then nothing landed softly on the Moon for 37 years.

      - id: change-4
        target: {site: change-4}
        distance_km: 900
        card:
          title: "The side that never faces us"
          # NSSDCA 2018-103A: "Since the lander is on the far side, the Moon is blocking direct
          # radio contact with the Earth, so a relay satellite is used"; Queqiao, "in a halo orbit
          # around the Earth-Moon L2 point", launched on 20 May 2018, seven months before the
          # landing. NSSDCA table note z: "Yutu 2 rover still mobile as of January 2023", four
          # years after the landing on 3 January 2019. At 177.6 E the Earth stays below the
          # horizon whatever the Moon's wobble, which reaches about eight degrees of longitude.
          body: >-
            From here the Earth is always below the horizon, so the Moon itself blocks any radio
            link home. China first put a relay satellite, Queqiao, out beyond the Moon, and the
            lander spoke to Earth through it. Its rover, Yutu 2, was still driving four years
            later.

      - id: chandrayaan-3
        target: {site: chandrayaan-3}
        distance_km: 900
        card:
          title: "Near the south pole"
          # NSSDCA 2019-042A (Chandrayaan-2): "The lander, named Vikram"; contact was lost during
          # the descent on 6 September 2019 UT and it "crashed on the surface at 70.881 S, 22.784
          # E". Great circle from there to this row's 69.3741 S, 32.32 E on a 1737.4 km sphere:
          # 108 km. NSSDCA 2023-098A: "designed to operate for one lunar daylight period (about 14
          # Earth days). On September 4 they entered sleep mode."
          body: >-
            India's first try, Chandrayaan-2, carried a lander also called Vikram, and it crashed in
            September 2019 about 110 km from here. This one was built to work for one lunar day,
            about 14 Earth days, and was put to sleep on 4 September 2023.

      - id: im-1
        target: {site: im-1}
        distance_km: 900
        card:
          title: "The first private lander, leaning"
          # NSSDCA IM-1-NOVA: "It landed in a 1 km diameter crater on a slope of about 12 degrees
          # ... Some of the landing gear broke upon impact, and Odysseus tipped over and was
          # resting at a 30 degree angle to the horizontal, but was still operational." The NSSDCA
          # table: no landing before it was nearer a pole than 80.13 S (Chandrayaan-3's 69.37 S
          # was the nearest), and Intuitive Machines 2 landed at 84.7906 S on 6 March 2025.
          body: >-
            It came down on a slope of about 12 degrees, broke some of its landing gear, and came
            to rest leaning at 30 degrees, still working. Nothing had landed nearer a pole until
            the same company's next lander, IM-2, reached 84.8 degrees south in March 2025.

      - id: blue-ghost-1
        target: {site: blue-ghost-1}
        distance_km: 900
        card:
          title: "An eclipse, seen from the Moon"
          # NASA, "NASA Science Continues After Firefly's First Moon Mission Concludes" (18 March
          # 2025): "10 NASA science and technology instruments"; it recorded "a total solar
          # eclipse". Firefly, "Firefly Aerospace Successfully Completes 14 Days of Surface
          # Operations on the Moon" (17 March 2025): imagery "of a total solar eclipse on March 14
          # ... where the Earth blocks the sun", and "of the lunar sunset on March 16", for "a
          # lunar horizon glow that was hypothesized and observed by Eugene Cernan on Apollo 17".
          # Not "the first eclipse seen from the Moon": Surveyor 3 recorded images of an eclipse
          # of the Sun by the Earth in 1967 (NSSDCA 1967-035A).
          body: >-
            It carried ten NASA instruments. On 14 March 2025 it watched the Earth pass in front of
            the Sun, a total eclipse seen from the Moon. Two days later it filmed the sunset,
            looking for a glow over the horizon that Gene Cernan saw on Apollo 17.

      - id: whole-moon
        target: {world: moon}
        # Six radii, not Celestia's five: the Moon is then 19 degrees across, inside the 22-degree
        # width of a 390 px phone held upright (measured at four radii, 2026-09-22, the disc ran
        # off both sides of the phone), and a third of a 1280 x 800 window.
        frame_radii: 6.0
        drift_deg: 20
        # Lit from the front, not three-quarter behind: the last shot is the Moon's face with its
        # sites on it, and the house back light would make it a crescent.
        key_light_deg: 45
        card:
          title: "Twenty-eight landings, nineteen on this map"
          # The NSSDCA table, "Last Updated: 13 August 2025", counted 2026-09-22: 28 rows typed
          # Soft Landing, Crewed Landing or Lander, leaving out the two Yutu rovers it also types
          # Soft Landing; 6 of them Crewed Landing. The 19 is registry/sites.yaml's lunar rows
          # that are records -- two of them the rovers Luna 17 and Luna 21 carried, where they
          # stopped -- and tests/test_moon_trip.mjs holds this card to that count.
          body: >-
            NASA's table of what lies on the Moon, last updated in August 2025, lists 28 landings,
            six of them with people aboard. This map marks 19 of them, two by where their rovers
            stopped. Luna 9, the first of all, is not one: nobody knows exactly where it is.

  # =============================================================================================
  # OUT PAST JUPITER. Ten stops, each on the stage where its subject is drawn where it really is:
  # Jupiter's for Io and Europa, Saturn's for Titan and Enceladus, Neptune's for Triton, Pluto's
  # for the pair, and the Sun's for the three that are further out than any planet. From Earth's
  # stage every one of the outer worlds is drawn nearer and larger, and its moons around the
  # enlarged disc (scene/worlds.js): the trip would have flown to a place on the screen where
  # nothing is drawn. The per-stop `stage:` field above arrived with this trip; the only other row
  # that names one is the fixture trip in tests/fixtures/phoebe.yaml, which visits a moon of
  # Saturn for the same reason.
  #
  # EVERY STOP IS A `record:` AND NOT A `world:`, so the world's or the probe's OWN card opens
  # under the stop's words: the moons' cards carry the page and the day each of their facts was
  # read (registry/worlds.yaml `facts:`), which is where the reader goes next. The stop's words
  # therefore ADD and never repeat -- the same rule the four surface stops above are written to.
  #
  # THE ORDER IS THE DISTANCE, and it is also the order the story happened in: every world here
  # was a dot until something we built went past it, and the last stop is the thing that went
  # furthest. The fragile end is the tail, as in the trip above: the three `far-bodies` and
  # `deep-space` stops are bundled data, so nothing here needs a network, but if the layers were
  # ever switched off the trip still ends on Pluto and Charon, which is also a good ending.
  # =============================================================================================
  - id: outer-solar-system
    title: "Out past Jupiter, to the farthest thing we sent"
    blurb: "Ten stops through the cold half of the Solar System, each world at its true size. Leaving brings you back to Earth."
    group: solar-system
    next: to-the-edge
    requires: [worlds, deep-space, far-bodies]
    stage: jupiter
    clock: as-found
    stops:
      - id: io
        target: {record: io}
        behind: jupiter
        stage: jupiter
        # 12 Io radii: at 5 the moon fills the frame and Jupiter, 5.9 Jupiter radii away, is
        # whatever the key light leaves behind it. Checked in the browser, 2026-09-22.
        frame_radii: 12
        card:
          title: "Io, the moon Jupiter never lets rest"
          # Io's lap is 1.769 days (NASA's Jovian satellite fact sheet, the same table
          # registry/worlds.yaml takes its radius from, read 2026-09-22) = 42.5 hours. The tug of
          # war and the volcanoes are NASA Science, Io, read 2026-09-22: "caught in a tug-of-war
          # between Jupiter's massive gravity and the smaller but precisely timed pulls from two
          # neighboring moons that orbit farther from Jupiter -- Europa and Ganymede", and "the
          # most volcanically active world in the solar system, with hundreds of volcanoes".
          body: >-
            Io goes round Jupiter every 42 hours, pulled one way by the planet and the other by two
            moons further out, in time with it. All that kneading has to go somewhere, and it comes
            out of hundreds of volcanoes.

      - id: europa
        target: {record: europa}
        behind: jupiter
        stage: jupiter
        frame_radii: 12
        card:
          title: "Europa, and the two ships on their way"
          # Twice Earth's ocean: NASA Science, Europa, read 2026-09-22, "holding twice as much
          # water as Earth's global ocean". Europa Clipper: first closest approach to Europa
          # 2030-04-11 and 49 flybys (Wikipedia, Europa Clipper, and the Horizons -159 header
          # data/sample.js quotes), goal "to determine whether there are places below the surface
          # of Jupiter's icy moon, Europa, that could support life" (NASA Science). JUICE arrives
          # July 2031 (data/sample.js, from the Horizons -28 header) and is "the first intended to
          # orbit a moon other than Earth's Moon", Ganymede, from December 2034 (Wikipedia, Jupiter
          # Icy Moons Explorer). All read 2026-09-22.
          body: >-
            Under that ice is twice as much water as every ocean on Earth put together. Europa
            Clipper reaches Jupiter in April 2030 to fly past here 49 times and ask whether
            anything could live down there; Europe's JUICE arrives in 2031 and ends up circling
            Ganymede.

      - id: saturn
        target: {record: saturn}
        stage: saturn
        frame_radii: 4.5
        card:
          title: "Saturn, and a ring ten metres thick"
          # Wikipedia, Rings of Saturn, read 2026-09-22: they "extend from 7,000 km (4,300 mi) to
          # 80,000 km (50,000 mi) away from Saturn's equator", are "made almost entirely of water
          # ice, with a trace component of rocky material", and have a "local thickness of as
          # little as 10 meters". The ring this map draws is 74 500 to 140 220 km from Saturn's
          # centre (registry/worlds.yaml), which is that same 16 000 to 82 000 km above the
          # equator. Cassini: orbit insertion 1 July 2004, "13 years, 76 days at Saturn", and on
          # 15 September 2017 its "trajectory took it into Saturn's upper atmosphere and it burned
          # up" (Wikipedia, Cassini-Huygens, read 2026-09-22).
          body: >-
            The rings reach eighty thousand kilometres out from the equator and in places are ten
            metres from top to bottom. They are almost all water ice. Cassini circled here for
            thirteen years and finished by flying into the planet in September 2017.

      - id: titan
        target: {record: titan}
        behind: saturn
        stage: saturn
        frame_radii: 6
        card:
          title: "Titan, and the farthest we have landed"
          # Wikipedia, Titan (moon), read 2026-09-22: surface pressure "146.7 kPa (1.45 atm)", "the
          # only moon in the Solar System with an atmosphere denser than Earth's", and "the only
          # known object in the Solar System besides Earth with clear evidence of stable bodies of
          # surface liquid". Huygens "landed on Titan on 14 January 2005", "continued to send data
          # for about 90 minutes after touchdown", and its landing was "the farthest landing from
          # Earth a spacecraft has ever made" and "so far the only one accomplished in the outer
          # Solar System" (Wikipedia, Huygens (spacecraft), read 2026-09-22).
          body: >-
            The air at the ground presses half again as hard as Earth's, and the lakes under the
            haze are methane. Huygens came down through it on 14 January 2005 and sent for ninety
            minutes from the surface. Nothing has landed further from home, before or since.

      - id: enceladus
        target: {record: enceladus}
        behind: saturn
        stage: saturn
        # Enceladus is 252 km in radius and 238 000 km from Saturn. MEASURED in the browser,
        # 2026-09-22: at 5 radii the moon came out 193 px across against a Saturn 235 px across,
        # which reads as two bodies of a size. At 12 it is 85 px against the same 250 px, and
        # perspective is doing less of the lying: Saturn really is 231 times the radius.
        frame_radii: 12
        card:
          title: "Enceladus, spraying its ocean into space"
          # NASA Science, Enceladus, read 2026-09-22: "In 2005, NASA's Cassini spacecraft
          # discovered that icy water particles and gas gush from the moon's surface at
          # approximately 800 miles per hour (400 meters per second)"; the plume carries "water
          # vapor, carbon dioxide, methane, perhaps a little ammonia and either carbon monoxide or
          # nitrogen gas ... along with salts and silica", and "the density of organic materials in
          # the plume was about 20 times denser than scientists expected"; "The eruptions appear to
          # be continuous ... which supplies material to Saturn's E-ring". The moon is "only about
          # 310 miles (500 kilometers) across".
          body: >-
            Cassini found the jets in 2005, coming off the south pole at four hundred metres a
            second, and flew straight through them. They carry water, salt, silica and more organic
            material than anyone expected, and they have not stopped: the dust keeps one of
            Saturn's outer rings supplied.

      - id: triton
        target: {record: triton}
        behind: neptune
        stage: neptune
        # Triton is 1 353 km in radius, Neptune 24 622 and 355 000 km away, so perspective at 8
        # radii drew the moon twice the width of the planet it goes round (browser, 2026-09-22).
        # At 14 they are 69 and 65 px, which is at least the right way round.
        frame_radii: 14
        card:
          title: "Triton, going the wrong way round"
          # Wikipedia, Voyager 2, read 2026-09-22: "Voyager 2's closest approach to Neptune
          # occurred on August 25, 1989"; "Five hours after Voyager 2 made its closest approach to
          # Neptune, it performed a close fly-by of Triton ... passing within about 40,000 km"; it
          # is "The only spacecraft to have visited either of the ice giant planets". NASA Science,
          # Triton, read 2026-09-22: Voyager 2 "found surface temperatures of -391 degrees
          # Fahrenheit (-235 degrees Celsius)" and "found Triton has active geysers".
          body: >-
            One spacecraft has ever visited Neptune: Voyager 2, on 25 August 1989. Five hours
            after passing the planet it flew by Triton, forty thousand kilometres up, and found a
            surface at minus 235 degrees with geysers going off on it.

      - id: pluto
        target: {record: pluto}
        behind: charon
        stage: pluto
        # Charon is 19 600 km from Pluto and 606 km in radius. At 9 Pluto radii (10 700 km) the
        # pair is the shot; the moon's own card is one tap away.
        frame_radii: 9
        card:
          title: "Pluto and Charon, going round each other"
          # Wikipedia, New Horizons, read 2026-09-22: launch "January 19, 2006", closest approach
          # "July 14, 2015, at 11:49 UTC" at "12,500 km (7,800 mi)", and the last flyby data
          # reached Earth on "October 25, 2016". Wikipedia, Pluto, read 2026-09-22: "Sputnik
          # Planitia is covered with churning nitrogen ice 'cells' that are geologically young and
          # turning over due to convection"; "The mountains are made of water ice"; Pluto and
          # Charon's shared centre of mass "does not lie within either body, and they are tidally
          # locked".
          body: >-
            New Horizons crossed this pair on 14 July 2015, nine and a half years out from Earth.
            It found mountains of water ice, and beside them a plain of nitrogen ice that is still
            slowly turning over. Sending the pictures home took until October 2016.

      - id: sedna
        target: {record: dwarf-sedna}
        needs_layer: far-bodies
        stage: sun
        # NOT pulled back to hold the whole 1 087 au lap the card is about, though the line is
        # drawn (public #212). MEASURED 2026-09-22: from 2 400 au the picture was unchanged,
        # because scene/heroes.js draws the SELECTED model at a constant 260 px whatever the
        # distance. Sedna and Eris therefore look like the same rock at the same size; the words
        # and the orbit line are what tell them apart.
        card:
          title: "Sedna, on its way in"
          # Wikipedia, 90377 Sedna, read 2026-09-22: found "on 14 November 2003"; perihelion
          # "76.19 AU (11.4 billion km)", reached about July 2076; aphelion "937 AU (140 billion
          # km)"; one lap "approximately 11,400 years"; its closest point is "far too distant for
          # it to have been scattered by any of the known planets". The record's own elements agree
          # (data/sample.js: JPL's perihelion date is 2075-11).
          body: >-
            It is falling towards its closest point, some time around 2076, and even that is
            seventy-six times the Earth's distance from the Sun. Then it climbs back out to nine
            hundred and thirty-seven times. No planet we know of could have put it on that path,
            and finding it in 2003 was part of what made astronomers ask what a planet is.

      - id: eris
        target: {record: dwarf-eris}
        needs_layer: far-bodies
        stage: sun
        card:
          title: "Eris, which made planet a definition"
          # Wikipedia, IAU definition of planet, read 2026-09-22. The resolution of 24 August 2006
          # asks that a planet "is in orbit around the Sun", "has sufficient mass for its
          # self-gravity to overcome rigid body forces so that it assumes a hydrostatic equilibrium
          # (nearly round) shape" and "has cleared the neighbourhood around its orbit"; a dwarf
          # planet meets the first two and not the third. The card gives the year and not the
          # month, because the month pushes its first sentence past the 160 characters ui/cards.js
          # prints. Eris's lap is 560 years from JPL's own
          # elements (a = 67.93 au, data/sample.js) and it is 95.5 au from the Sun on 2026-09-22
          # against an aphelion of 97.7, so "near the far end" is good for decades.
          body: >-
            The definition astronomers agreed on in 2006 asks three things of a planet: it goes
            round the Sun, gravity has pulled it round, and it has cleared its own path. Eris and
            Pluto fail the third. Eris is near the far end of a 560-year lap, ninety five times as
            far from the Sun as we are.

      - id: voyager-1
        target: {record: deep-voyager-1}
        needs_layer: deep-space
        stage: sun
        # NO `behind: sun`, though the Sun is the thing this card points back at: tried in the
        # browser 2026-09-22, and at 172 au the Sun is 0.01 px across, so aiming the camera at it
        # only turned Voyager 1 side on and put nothing in the frame.
        card:
          title: "Voyager 1, and everything behind it"
          # Wikipedia, Voyager 1, read 2026-09-22: launched "September 5, 1977", Jupiter on
          # "March 5, 1979", Saturn on "November 12, 1980", and it crossed into interstellar space
          # on "August 25, 2012". The photograph is 14 February 1990 from "40.47 astronomical
          # units", in which Earth "takes up less than one (0.12 of a pixel, according to NASA)"
          # (Wikipedia, Pale Blue Dot, read 2026-09-22). The distance is the record's own: JPL
          # Horizons put it at 171.7 au on 2026-09-07 (data/sample.js), and it adds 3.6 a year.
          body: >-
            It passed Jupiter in March 1979 and Saturn in November 1980, and it has been leaving
            ever since, more than 170 times the Earth's distance from the Sun. In 1990 it turned
            round and photographed the planets it had left. Earth came out 0.12 of a pixel wide.

  # =============================================================================================
  # A YEAR IN A MINUTE (spec 0030). The first trip that moves the clock, and the cheapest one in
  # the catalogue: four stops, every one a world, and nothing that needs a network. It runs on the
  # SUN'S STAGE because that is the one stage that squeezes nothing (scene/worlds.js
  # compressesFrom), so every orbit here is drawn at its true size and in its true place, and the
  # motion is the real motion at the real proportions.
  #
  # THE RATE. 525 600 is the minutes in a year, so one real minute is one year of the clock and one
  # real second is 525 600 s = 6.08 days: a day every 0.164 s, a sixth of a second. It is above the
  # clock's own top speed (36 000, site/js/clock.js) and above the 60 a trip otherwise keeps to, and
  # check_registry.py allows it on the Sun's stage only, where no SGP4 object is being followed.
  # The clock is HELD while the camera flies (ui/trip.js applyStopTime) and runs while a card is
  # up, so the four dwells are what the year is spent on: 13.8 + 15.2 + 14.5 + 14.8 = 58.3 s from
  # their word counts (scripts/gen_tours_js.py), which is 355 days. The panel says "about 2
  # minutes" because the four flights are on top and the length is rounded up (ui/tripframe.js).
  #
  # EVERY NUMBER IS NASA's PLANETARY FACT SHEET (https://nssdc.gsfc.nasa.gov/planetary/factsheet/,
  # read 2026-09-23): orbital period Mercury 88.0 d, Earth 365.2 d, Jupiter 4331 d; distance from
  # the Sun Mercury 57.9, Earth 149.6, Mars 228.0 (aphelion 249.3), Jupiter 778.5 million km;
  # orbital velocity Mercury 47.4, Earth 29.8 km/s; the Moon 0.384 million km from Earth, going
  # round in 27.3 d. At 6.08 days a second: Mercury laps in 14.5 s, the Moon in 4.5 s, the Earth in
  # 60 s, and Jupiter would need 712 s.
  # =============================================================================================
  - id: a-year-in-a-minute
    title: "A year in a minute"
    blurb: "The planets going round the Sun, a day every sixth of a second. Leaving puts the clock back and brings you back to Earth."
    group: solar-system
    next: outer-solar-system
    requires: [worlds]
    stage: sun
    clock: as-found          # the STOPS move it; `clock:` stays the trip-level mode
    stops:
      - id: inner
        target: {world: sun}
        # Mars at aphelion is 249.3 million km out. The camera looks down from 50 degrees above the
        # planets' plane (ui/trip.js SUN_OVERVIEW_POLAR), so the near side of an orbit of radius r
        # is 0.64 r nearer the camera and 0.77 r off the middle, and it stays inside the frame's
        # 22.5-degree half-height while the distance is at least 2.49 r: 621 million km for Mars.
        # 700 million holds the whole of Mars's orbit on a 1280 x 800 screen, at any date
        # (tests/test_year_trip.mjs, four dates).
        distance_km: 700000000
        # From the visitor's present, at whatever instant that is, so nothing here names a date.
        time: now
        rate: 525600
        drift_deg: 0
        card:
          title: "Everything inside Mars, going round"
          body: >-
            Every second here is six days, so Mercury goes round the Sun in fifteen seconds and the
            Earth in a minute. Everything is at its true size, which is why the planets are specks.

      - id: earth
        target: {world: earth}
        # The Moon's orbit is 384 400 km across the middle; from 2.5 million km the frame's
        # half-height is 1.04 million, so the orbit fills about a third of it.
        distance_km: 2500000
        rate: 525600
        drift_deg: 0
        card:
          title: "The Earth, and the Moon going round it"
          body: >-
            The Moon goes round the Earth every 27.3 days, which here is four and a half seconds.
            The camera is riding along with the Earth at thirty kilometres a second, so it is
            everything farther away that seems to drift.

      - id: mercury
        target: {world: mercury}
        # Mercury is 57.9 million km from the Sun; 60 million km sits the camera about as far
        # from Mercury as Mercury is from the Sun, with the Sun kept in the picture behind it.
        distance_km: 60000000
        behind: sun
        rate: 525600
        drift_deg: 0
        card:
          title: "Mercury, four laps to our one"
          body: >-
            Mercury goes round the Sun in 88 days, four times in each of our years, at 47
            kilometres a second. The camera is following it, so it is the Sun that seems to wheel
            round behind.

      - id: jupiter
        target: {world: sun}
        # Jupiter is 778.5 million km out, and by the rule on the first stop the frame holds its
        # orbit from 2.49 x 778.5 = 1.94 billion km. The design said 1.6 billion; measured in
        # tests/test_year_trip.mjs, from there Jupiter was off the top or bottom of a 1280 x 800
        # frame at three dates of four. 2.2 billion leaves a margin.
        distance_km: 2200000000
        rate: 525600
        drift_deg: 0
        card:
          title: "Jupiter, which takes twelve of our years"
          body: >-
            Jupiter is five times as far from the Sun as we are and needs almost twelve of our
            years to go round once. While the Earth goes round one time, Jupiter covers a twelfth
            of its path.

  # =============================================================================================
  # Spec 0037, 2026-09-23: the Moon's shadow on the Earth, from the true positions of the Sun and the
  # Moon (scene/eclipse.js), at the instants spec 0031 computes (data/events.js, checked against
  # NASA GSFC within 6 s). The kiosk's first flight-plan card was "Chasing the Solar Eclipse".
  #
  # EVERY INSTANT IS AN EVENT REFERENCE, counted from the visitor's clock, so the trip is never out
  # of date and no card may name a date or a place: the eclipse it shows moves on as the years do
  # (the total one is on 2 August 2027 across North Africa from today, 22 July 2028 across Australia
  # after that). The frame prints the instant ("Shown at") and the honesty line (COPY.trip.
  # eclipseLine); the cards say what the picture is.
  #
  # THREE DEPARTURES FROM THE SPEC, each measured:
  #   - Stops 1 and 2 say `kind: total`. From 2026-09-23 the next solar eclipse of any kind is the
  #     ANNULAR of 2027-02-06, so the spec's bare `solar-eclipse.next` showed the ring twice and the
  #     total never.
  #   - Stop 3 targets the Moon with the Earth behind it. `behind:` puts the camera opposite the
  #     backdrop, so the spec's `target: earth, behind: moon` stood on the Earth's night side, the
  #     one side the shadow is not on.
  #   - Stop 5 says `kind: total`. The next three lunar eclipses (2027-02-20, 2027-07-18,
  #     2027-08-17) are penumbral: the Moon dims by a third at most and never reaches the dark
  #     core the card is about. The next total one is 2028-12-31, found because a `kind:` looks
  #     1 200 days ahead (data/events.js ECLIPSE_KIND_HORIZON_MS).
  #
  # Facts: NASA GSFC, "Solar Eclipses: 2027-2028" (eclipse.gsfc.nasa.gov/SEdecade/SEdecade2021.html),
  # "Five Millennium Catalog of Solar Eclipses" (eclipse.gsfc.nasa.gov/SEcat5/SEcatalog.html: the
  # four kinds; the longest totality in the five thousand years, 7 min 29 s) and "Five Millennium
  # Catalog of Lunar Eclipses" (eclipse.gsfc.nasa.gov/LEcat5/LEcatalog.html: the three kinds), all
  # read 2026-09-23.
  # =============================================================================================
  - id: chasing-the-solar-eclipse
    title: "Chasing the solar eclipse"
    blurb: "The Moon's shadow crossing the Earth at the next total eclipse, to the minute. This trip moves the clock."
    group: events
    requires: [worlds]
    stage: earth
    clock: as-found
    stops:
      - id: arrives
        target: {world: earth}
        # Seven radii holds the whole disc with room for the shadow to come on at one edge.
        frame_radii: 7
        # Square on from the Sun's side: the shadow is only ever on the day side.
        key_light_deg: 0
        time: {event: solar-eclipse.next, kind: total, offset_s: -5400}
        rate: 600
        drift_deg: 0
        card:
          title: "The shadow arrives"
          body: >-
            This is the Moon's shadow crossing the Earth, drawn from where the Sun and the Moon
            really are. Under the pale outer part people see a bite taken out of the Sun; only
            under the small dark core is it covered completely.

      - id: peak
        target: {world: earth}
        frame_radii: 3
        key_light_deg: 0
        time: {event: solar-eclipse.next, kind: total}
        rate: 1
        drift_deg: 0
        card:
          title: "The minute it happens"
          body: >-
            This is greatest eclipse, the minute the dark core of the shadow passes nearest the
            middle of the Earth. Inside it the Sun is covered for a few minutes, and never for
            more than seven and a half.

      - id: from-the-moon
        target: {world: moon}
        # 12 000 km out from the Moon's day side, which at an eclipse faces the Sun and away from
        # us. The Moon is 16.5 degrees across from here; `behind: earth` keeps the Earth within 16
        # degrees of the middle and clear of the Moon's disc, a small blue disc with the shadow on
        # it, 380 000 km further on.
        distance_km: 12000
        behind: earth
        key_light_deg: 0
        rate: 60
        card:
          title: "The Moon, casting it"
          body: >-
            Behind the Moon, the Earth, and on it the dark spot where the Moon's shadow is touching
            the ground. The side of the Moon facing you is in full sunlight, which is why the side
            facing the Earth is dark.

      - id: ring
        target: {world: earth}
        frame_radii: 3
        key_light_deg: 0
        time: {event: solar-eclipse.next, kind: annular}
        rate: 1
        drift_deg: 0
        card:
          title: "A ring, not a night"
          body: >-
            When the Moon is near the far end of its orbit it looks a little smaller than the Sun,
            so it cannot cover all of it. A bright ring is left round the Moon, and the shadow on
            the ground never gets as dark as a total one.

      - id: lunar
        target: {world: moon}
        frame_radii: 4
        key_light_deg: 0
        # An hour before the middle of the eclipse at ten minutes a second: the Moon walks into
        # the Earth's dark shadow, through totality and out again under one card.
        time: {event: lunar-eclipse.next, kind: total, offset_s: -3600}
        rate: 600
        drift_deg: 0
        card:
          title: "The Earth's shadow on the Moon"
          body: >-
            Now it is the Earth that is in the way. The Moon moves into the Earth's shadow, and
            anyone on the night half of the planet can watch it happen, with nothing but their
            eyes.
