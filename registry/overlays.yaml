version: 1
# EARTH DATA OVERLAYS (2026-10-05). Ivan: "a trip about earth and its weather ... how water flows
# affect it, how nature affects it ... pollution, plankton, cycles of the world". The pictures of
# those things exist and are measured daily: NASA GIBS serves them as maps. A row here is one such
# map that a trip stop (`overlay:` in registry/tours.yaml) or What to show can lay over the globe.
#
# NOTHING HERE IS FETCHED AT BOOT. scene/earthoverlay.js is a dynamic import the first time an
# overlay is asked for, and it asks GIBS for one picture, when it is shown.
#
# EVERY ROW WAS MEASURED ON 2026-10-05 with curl and `Origin: https://www.spaceradar.ai`: one WMS
# GetMap of the whole globe, 2048 x 1024 PNG, transparent where there is no data. Each answered
# `access-control-allow-origin: *` and `cache-control: max-age=0, no-store`, in 1.2 to 2.5 s; the
# sizes are in `bytes`. The pictures were looked at before a row was kept. Tried and NOT kept,
# because a day's picture is mostly gaps between the satellite's passes: OMI and TROPOMI nitrogen
# dioxide, AIRS carbon monoxide, MODIS chlorophyll; and MODIS monthly snow cover, whose palette
# paints the ice sheets red.
#
#   id        what a stop or the panel names.
#   title     the name in the panel and on the legend. Sentence case.
#   what      one line for the stop card's foot: what the colours are. No date: the code adds the
#             date the picture is of.
#   layer     the GIBS layer id, as its capabilities document spells it.
#   date      which picture is asked for. `daily` with `lag_days`: that many days before today
#             (UTC), because today's is not made yet. `monthly` with `lag_months`: the first of
#             the month that many months back. `tries` more steps back are tried when a picture
#             comes back empty (under `blank_bytes`).
#   class     measured (a satellite's retrieval, gaps and all), analysed (measurements with the
#             gaps filled by interpolation) or modelled (a reanalysis: a weather model fed with
#             measurements). The legend says which.
#   legend    the colour ramp from GIBS's own colormap (colormaps/v1.3, read 2026-10-05), seven
#             stops or fewer from its low end to its high, and the values at the two ends.
#   bytes     the size of the picture measured that day. An empty picture (a date GIBS has not
#             made yet) was 8 221 bytes at this size; the smallest real one 93 752.
#   credit    who made the data; CREDITS.md section 4.19 carries every one, and GIBS's own
#             acknowledgement.
service:
  wms: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi"
  source: "https://nasa-gibs.github.io/gibs-api-docs/ (read 2026-10-05)"
  cors: "access-control-allow-origin: *"
  width: 2048
  height: 1024
  blank_bytes: 12000

overlays:
  - id: sea-temperature
    world: earth
    title: "Sea surface temperature"
    what: "The temperature of the sea's top layer, from satellites and buoys, gaps filled."
    layer: GHRSST_L4_MUR25_Sea_Surface_Temperature
    date: {rule: daily, lag_days: 2, tries: 3}
    class: analysed
    bytes: 459241
    legend: {unit: "°C", low: "0", high: "32", stops: ["#2b001a", "#67086e", "#1f357f", "#2e9fec", "#d0ef00", "#f25f00", "#6b0200"]}
    credit: "GHRSST MUR sea surface temperature, NASA JPL PO.DAAC"
    colormap: "https://gibs.earthdata.nasa.gov/colormaps/v1.3/GHRSST_Sea_Surface_Temperature.xml"

  - id: sea-ice
    world: earth
    title: "Sea ice"
    what: "How much of the sea is covered by ice, from satellites, gaps filled."
    layer: GHRSST_L4_MUR25_Sea_Ice_Concentration
    date: {rule: daily, lag_days: 2, tries: 3}
    class: analysed
    bytes: 93752
    legend: {unit: "% ice", low: "15", high: "100", stops: ["#f800f8", "#0021ff", "#00de9c", "#87d700", "#ff4e00", "#ffffff"]}
    credit: "GHRSST MUR sea ice concentration, NASA JPL PO.DAAC"
    colormap: "https://gibs.earthdata.nasa.gov/colormaps/v1.3/GHRSST_Sea_Ice_Concentration.xml"

  - id: chlorophyll
    world: earth
    title: "Plankton (chlorophyll)"
    what: "Chlorophyll in the sea's surface water, the green of plankton, where the sky was clear."
    layer: OCI_PACE_Chlorophyll_a
    date: {rule: daily, lag_days: 2, tries: 3}
    class: measured
    bytes: 693678
    legend: {unit: "mg/m³", low: "0.01", high: "20", stops: ["#93006c", "#1800e7", "#00baff", "#00ff17", "#ffdb00", "#ff3300", "#690000"]}
    credit: "Chlorophyll a from the Ocean Color Instrument on PACE, NASA Ocean Biology Processing Group"
    colormap: "https://gibs.earthdata.nasa.gov/colormaps/v1.3/MODIS_Chlorophyll.xml"

  - id: vegetation
    world: earth
    title: "Green land (vegetation)"
    what: "How green the land is: a vegetation index from eight days of satellite passes."
    layer: MODIS_Terra_NDVI_8Day
    date: {rule: daily, lag_days: 2, tries: 3}
    class: measured
    bytes: 677833
    legend: {unit: "index", low: "0", high: "1", stops: ["#f1ecec", "#d7c4b3", "#b09279", "#a0c031", "#4e9400", "#126e01", "#001801"]}
    credit: "MODIS vegetation index (Terra), NASA LANCE and LP DAAC"
    colormap: "https://gibs.earthdata.nasa.gov/colormaps/v1.3/MODIS_NDVI.xml"

  - id: rain
    world: earth
    title: "Rain and snow"
    what: "Rain falling over one day, estimated from a fleet of satellites; snow is in blues."
    layer: IMERG_Precipitation_Rate
    date: {rule: daily, lag_days: 2, tries: 3}
    class: measured
    bytes: 499014
    legend: {unit: "mm/h", low: "0.1", high: "53", stops: ["#00764e", "#85d400", "#ff8814", "#ff2020", "#390000"]}
    credit: "IMERG precipitation, NASA Global Precipitation Measurement mission"
    colormap: "https://gibs.earthdata.nasa.gov/colormaps/v1.3/GPM_Precipitation_Rate.xml"

  - id: aerosol
    world: earth
    title: "Dust, smoke and haze"
    what: "How much the air dims sunlight with dust, smoke, sea salt and pollution: a month's mean."
    layer: MERRA2_Total_Aerosol_Optical_Thickness_550nm_Extinction_Monthly
    date: {rule: monthly, lag_months: 4, tries: 3}
    class: modelled
    bytes: 187307
    legend: {unit: "optical thickness", low: "0", high: "0.9", stops: ["#ffffe5", "#fedc82", "#feb441", "#f98d23", "#e66910", "#c74902", "#662506"]}
    credit: "MERRA-2 aerosol optical thickness, NASA Global Modeling and Assimilation Office"
    colormap: "https://gibs.earthdata.nasa.gov/colormaps/v1.3/MERRA2_Total_Aerosol_Optical_Thickness_550nm_Extinction_Monthly.xml"

  - id: water-vapour
    world: earth
    title: "Water in the air"
    what: "Water vapour in the whole depth of the air above each place: a month's mean."
    layer: MERRA2_Total_Precipitable_Water_Vapor_Monthly
    date: {rule: monthly, lag_months: 4, tries: 3}
    class: modelled
    bytes: 173214
    legend: {unit: "kg/m²", low: "0", high: "70", stops: ["#ffffe5", "#dbf1a4", "#aedd8e", "#78c679", "#43ac5e", "#238443", "#004529"]}
    credit: "MERRA-2 total precipitable water vapour, NASA Global Modeling and Assimilation Office"
    colormap: "https://gibs.earthdata.nasa.gov/colormaps/v1.3/MERRA2_Total_Precipitable_Water_Vapor_Monthly.xml"
