      albedo: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/joviansatfact.html", read: 2026-09-22, says: "visual geometric albedo 0.62"}
      what: {source: "https://science.nasa.gov/jupiter/jupiter-moons/io/", read: 2026-09-22, says: "the most volcanically active world in the solar system"}
      colour: {source: "https://en.wikipedia.org/wiki/Io_(moon)", read: 2026-09-22, says: "shades of yellow, red, white, black, and green, largely due to ... sulfur"}
      seen: {source: "https://en.wikipedia.org/wiki/Galilean_moons", read: 2026-09-22, says: "readily seen with common binoculars ... closeness to bright Jupiter makes naked-eye observation very difficult"}

