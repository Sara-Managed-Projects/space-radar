      colour: {source: "https://en.wikipedia.org/wiki/Triton_(moon)", read: 2026-09-22, says: "Triton's reddish color is thought to be the result of methane ice"}
      seen: {source: "https://en.wikipedia.org/wiki/Triton_(moon)", read: 2026-09-22, says: "apparent magnitude 13.47 (infobox)"}

  - id: charon
