  # SIX MORE MOONS (2026-09-22): Mars's two, Saturn's Enceladus and Titan, Neptune's Triton and
  # Pluto's Charon, flat and sourced like the five above. Astronomy Engine has nothing for them, so
  # where each one is comes from propagate/moons.js: a precessing ellipse FITTED TO JPL HORIZONS
  # (2000-2050), added to its planet's own position -- `ephemeris.moon` again. That file has the
  # method and the error measured against Horizons at instants the fit never saw: Phobos within
  # 5.9 km over 2000-2050, Deimos 120, Enceladus 1 480, Titan 836, Triton 9.8, Charon 0.7 (0.003
  # to 0.62 % of each orbit). Outside 2000-2050 nothing was measured and they are not drawn.
  #
  # Radii: JPL Solar System Dynamics, Planetary Satellite Physical Parameters, one table for all
  # six. Albedos: NASA's fact sheets, as for the five above, so the eleven flat colours share one
  # light-to-dark order. unit_km: 1 000 for the three Moon-sized ones, 100 for the three small
  # ones (scene/stage.js says why not 10).
  - id: phobos
    aliases: ["Mars I"]
    display: Phobos
    parent: mars
    radius_km: 11.08
    unit_km: 100
    ephemeris: {propagator: body, body: Mars, moon: phobos}
    frames: [inertial]
    look: {flat: "#4a4540"}
    facts:
      radius: {source: "https://ssd.jpl.nasa.gov/sats/phys_par/", read: 2026-09-22, says: "Phobos 401 ... Mean Radius (km) 11.08"}
      albedo: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html", read: 2026-09-22, says: "Satellites of Mars ... Geometric albedo 0.07 (Phobos)"}
      what: {source: "https://science.nasa.gov/mars/moons/phobos/", read: 2026-09-22, says: "Phobos is the larger of Mars' two moons ... It's nearing Mars at a rate of six feet (1.8 meters) every hundred years."}
      shape: {source: "https://science.nasa.gov/mars/moons/phobos/", read: 2026-09-22, says: "17 x 14 x 11 miles (27 by 22 by 18 kilometers) in diameter"}
      colour: {source: "https://science.nasa.gov/mars/moons/phobos/", read: 2026-09-22, says: "composed of C-type rock, similar to blackish carbonaceous chondrite asteroids"}
      seen: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html", read: 2026-09-22, says: "Apparent visual magnitude (V0) 11.3 (Phobos)"}
      glare: {source: "https://en.wikipedia.org/wiki/Moons_of_Mars", read: 2026-09-22, says: "scattered light from Mars prevented them from searching the inner few arcminutes where the satellites Phobos and Deimos reside"}
      found: {source: "https://en.wikipedia.org/wiki/Phobos_(moon)", read: 2026-09-22, says: "The two moons were discovered in 1877 by American astronomer Asaph Hall."}
      telescope: {source: "https://en.wikipedia.org/wiki/Moons_of_Mars", read: 2026-09-22, says: "The telescope used for the discovery was the 26-inch (66 cm) refractor"}

