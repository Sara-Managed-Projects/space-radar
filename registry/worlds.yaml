      what: {source: "https://science.nasa.gov/neptune/moons/triton/", read: 2026-09-22, says: "Triton is the largest of Neptune's 13 moons. It is unusual because it is the only large moon in our solar system that orbits in the opposite direction of its planet's rotation ... Scientists think Triton is a Kuiper Belt Object captured by Neptune's gravity"}
      colour: {source: "https://en.wikipedia.org/wiki/Triton_(moon)", read: 2026-09-22, says: "Triton's reddish color is thought to be the result of methane ice"}
      seen: {source: "https://en.wikipedia.org/wiki/Triton_(moon)", read: 2026-09-22, says: "apparent magnitude 13.47 (infobox)"}

  - id: charon
    aliases: ["Pluto I"]
    display: Charon
    parent: pluto
    radius_km: 606.0
    unit_km: 1000
    ephemeris: {propagator: body, body: Pluto, moon: charon}
    frames: [inertial]
    look: {flat: "#8e8a86"}
    facts:
      radius: {source: "https://ssd.jpl.nasa.gov/sats/phys_par/", read: 2026-09-22, says: "Charon 901 ... Mean Radius (km) 606.0"}
