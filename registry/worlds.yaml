      # Wikipedia's infobox gives 1.375 at 550 nm (Verbiscer et al. 2007); the fact sheet is the
      # source the other ten flat worlds' albedos come from, so the order uses its 1.0.
      albedo: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/saturniansatfact.html", read: 2026-09-22, says: "Enceladus (II) ... Visual geometric albedo 1.0"}
      what: {source: "https://science.nasa.gov/saturn/moons/enceladus/", read: 2026-09-22, says: "geyser-like jets spewing water vapor and ice particles into space ... Enceladus sprays its ocean out into space"}
      colour: {source: "https://science.nasa.gov/saturn/moons/enceladus/", read: 2026-09-22, says: "Enceladus is the most reflective body in the solar system ... bright white all over"}
      seen: {source: "https://en.wikipedia.org/wiki/Enceladus", read: 2026-09-22, says: "Its faint apparent magnitude (HV = +11.7) and its proximity to the much brighter Saturn and Saturn's rings make Enceladus difficult to observe from Earth with smaller telescopes."}

  - id: titan
    aliases: ["Saturn VI"]
    display: Titan
    parent: saturn
    radius_km: 2574.76
    unit_km: 1000
    ephemeris: {propagator: body, body: Saturn, moon: titan}
    frames: [inertial]
    look: {flat: "#a8702e"}
    facts:
      radius: {source: "https://ssd.jpl.nasa.gov/sats/phys_par/", read: 2026-09-22, says: "Titan 606 ... Mean Radius (km) 2574.76"}
      albedo: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/saturniansatfact.html", read: 2026-09-22, says: "Titan (VI) ... Visual geometric albedo 0.22"}
      what: {source: "https://science.nasa.gov/saturn/moons/titan/", read: 2026-09-22, says: "Titan is Saturn's largest moon, and the only moon in our solar system known to have a substantial atmosphere ... lakes and seas of liquid hydrocarbons like methane and ethane"}
      landing: {source: "https://en.wikipedia.org/wiki/Titan_(moon)", read: 2026-09-22, says: "The Huygens probe descends by parachute and lands on Titan on January 14, 2005."}
      colour: {source: "https://en.wikipedia.org/wiki/Titan_(moon)", read: 2026-09-22, says: "Titan's orange color comes from a thick atmospheric haze"}
      seen: {source: "https://en.wikipedia.org/wiki/Titan_(moon)", read: 2026-09-22, says: "Titan is never visible to the naked eye, but can be observed through small telescopes or strong binoculars. Amateur observation is difficult because of the proximity of Titan to Saturn's brilliant globe and ring system ... a maximum apparent magnitude of +8.2"}

  - id: triton
    aliases: ["Neptune I"]
