# Worlds. A body is a ROW: id, parent, radius, ephemeris, rotation model, textures.
#
# THE BROWSER'S COPY IS HAND-KEPT. There is no generator for this file: a world in the browser
# also carries its texture's measured mean colour and the rule it is drawn by, which live only in
# scene/worlds.js. So a new world is a row here, a row in scene/worlds.js WORLDS and one in
# scene/stage.js STAGES, and scripts/check_registry.py refuses any disagreement between the three
# on id, parent, radius, unit_km or flat colour (added 2026-09-22 with Pluto and the four moons).
#
# parent      the world this one orbits; `sun` is the root and has none.
# unit_km     scene units when this world is the active stage (spec 0005 floating origin).
# ephemeris   how its position is computed. `body` = astronomy-engine, no fetch, no network.
# rotation    how its fixed frame turns, for anything sitting on the surface.
# look        texture set and atmosphere treatment (spec 0006), or `flat: "#rrggbb"` for a world
#             with no texture, drawn in that one colour. A flat row must carry `facts:`.
# facts       for a world whose card and colour rest on read pages: each fact names its `source:`
#             URL, the day it was `read:` and what the page `says:`. check_registry.py refuses
#             a flat world without radius, albedo, what, colour and seen (how to see it).
# aliases     other names people type into search (spec 0028 step 0); the display name stays.
# enabled     absent means on. Switching a world off removes it from the map, the stage list and
#             the fly-to menu at once, because they all read this row.
version: 1

worlds:
  - id: sun
    aliases: ["Sol", "our star"]
    display: The Sun
    parent: ""
    radius_km: 696340.0
    unit_km: 1000000
    ephemeris: {propagator: body, body: Sun}
    frames: [inertial]
    look: {textures: sun, corona: true}

  - id: earth
    aliases: ["Terra", "home"]
    display: Earth
    parent: sun
    radius_km: 6371.0
    unit_km: 1000
    ephemeris: {propagator: body, body: Earth}
    rotation: {kind: earth-gmst}
    frames: [inertial, fixed]
    look: {textures: earth-realistic, atmosphere: true, clouds: true, night_lights: true}

  - id: moon
    aliases: ["Luna"]
    display: The Moon
    parent: earth
    radius_km: 1737.4
    unit_km: 1000
    ephemeris: {propagator: body, body: Moon}
    # Libration comes from astronomy-engine rather than a rotation model, because the Moon's
    # is the one case where the simple model is visibly wrong to anyone who looks.
    rotation: {kind: moon-libration}
    frames: [inertial, fixed]
    look: {textures: moon}

  # The planets are rows from day one so that growing outward is a camera flight rather than a
  # rewrite. They render as textured spheres at true direction and scaled distance until the
  # camera makes one of them the stage.
  - id: mercury
    display: Mercury
    parent: sun
    radius_km: 2439.7
    unit_km: 1000
    ephemeris: {propagator: body, body: Mercury}
    rotation: {kind: sidereal, period_h: 1407.6}
    frames: [inertial, fixed]
    look: {textures: mercury}

  - id: venus
    aliases: ["the Morning Star", "the Evening Star"]
    display: Venus
    parent: sun
    radius_km: 6051.8
    unit_km: 1000
    ephemeris: {propagator: body, body: Venus}
    rotation: {kind: sidereal, period_h: -5832.5}
    frames: [inertial, fixed]
    look: {textures: venus, atmosphere: thick}

  - id: mars
    aliases: ["the Red Planet"]
    display: Mars
    parent: sun
    radius_km: 3389.5
    unit_km: 1000
    ephemeris: {propagator: body, body: Mars}
    rotation: {kind: sidereal, period_h: 24.6229}
    frames: [inertial, fixed]
    look: {textures: mars, atmosphere: thin}

  - id: jupiter
    display: Jupiter
    parent: sun
    radius_km: 69911.0
    unit_km: 10000
