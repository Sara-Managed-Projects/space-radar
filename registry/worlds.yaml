    look: {flat: "#524d47"}
    facts:
      radius: {source: "https://ssd.jpl.nasa.gov/sats/phys_par/", read: 2026-09-22, says: "Deimos 402 ... Mean Radius (km) 6.2"}
      albedo: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html", read: 2026-09-22, says: "Satellites of Mars ... Geometric albedo 0.08 (Deimos)"}
      what: {source: "https://science.nasa.gov/mars/moons/deimos/", read: 2026-09-22, says: "Deimos is the smaller of the two Martian moons and is less irregular in shape."}
      shape: {source: "https://science.nasa.gov/mars/moons/deimos/", read: 2026-09-22, says: "Like Phobos, Deimos is a small and lumpy, heavily cratered object."}
      colour: {source: "https://science.nasa.gov/mars/moons/phobos/", read: 2026-09-22, says: "Phobos and Deimos appear to be composed of C-type rock, similar to blackish carbonaceous chondrite asteroids."}
      seen: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html", read: 2026-09-22, says: "Apparent visual magnitude (V0) 12.40 (Deimos)"}
      glare: {source: "https://en.wikipedia.org/wiki/Moons_of_Mars", read: 2026-09-22, says: "scattered light from Mars prevented them from searching the inner few arcminutes where the satellites Phobos and Deimos reside"}
      found: {source: "https://en.wikipedia.org/wiki/Phobos_(moon)", read: 2026-09-22, says: "The two moons were discovered in 1877 by American astronomer Asaph Hall."}
      telescope: {source: "https://en.wikipedia.org/wiki/Moons_of_Mars", read: 2026-09-22, says: "The telescope used for the discovery was the 26-inch (66 cm) refractor"}

  - id: enceladus
