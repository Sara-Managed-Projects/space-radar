  # TEN MORE MOONS (2026-09-22): Saturn's other five big round moons and all five of Uranus's,
  # placed the same way as the six above by propagate/moons.js, which has the method and the error
  # measured against JPL Horizons at instants the fit never saw. Worst over 2000-2050: Tethys 119
  # km, Rhea 199, Miranda 117, Ariel 114, Dione 235, Umbriel 410, Mimas 703, Titania 996, Oberon
  # 1 230, Iapetus 6 800 -- 0.04 % to 0.38 % of each orbit, against the 0.62 % this app already
  # draws Enceladus at, so none of the ten was left out. Outside 2000-2050 they are not drawn.
  #
  # Radii: the same JPL table as the six above. Albedos: NASA's Saturnian and Uranian satellite
  # fact sheets, so all twenty-one flat worlds share one light-to-dark order (scene/worlds.js
  # holds it, tests/test_worlds_layer.mjs checks it). unit_km 1 000 for the eight over 500 km,
  # 100 for Mimas and Miranda, the rule Charon and Enceladus already set.
  - id: mimas
    aliases: ["Saturn I"]
    display: Mimas
    parent: saturn
    radius_km: 198.2
    unit_km: 100
    ephemeris: {propagator: body, body: Saturn, moon: mimas}
    frames: [inertial]
    look: {flat: "#a7aaac"}
