    unit_km: 10000
    ephemeris: {propagator: body, body: Saturn}
    rotation: {kind: sidereal, period_h: 10.656}
    frames: [inertial, fixed]
    look: {textures: saturn, ring: {inner_km: 74500, outer_km: 140220, texture: saturn-ring}}

  - id: uranus
    display: Uranus
    parent: sun
    radius_km: 25362.0
    unit_km: 10000
    ephemeris: {propagator: body, body: Uranus}
    rotation: {kind: sidereal, period_h: -17.24}
    frames: [inertial, fixed]
    look: {textures: uranus}

  - id: neptune
    display: Neptune
    parent: sun
    radius_km: 24622.0
    unit_km: 10000
    ephemeris: {propagator: body, body: Neptune}
    rotation: {kind: sidereal, period_h: 16.11}
    frames: [inertial, fixed]
    look: {textures: neptune}
    # Its card said "You can see this one with your own eyes" until 2026-09-22, which at magnitude
    # 7.7 it cannot; copy/en.js worldSee.neptune now says what this page does.
    facts:
      seen: {source: "https://en.wikipedia.org/wiki/Neptune", read: 2026-09-22, says: "Neptune is too faint to be visible to the naked eye. The apparent magnitude currently ranges from 7.67 to 7.89 ... A telescope or strong binoculars will resolve Neptune as a small blue disk"}

  # PLUTO AND JUPITER'S FOUR BIG MOONS: worlds with SOURCED FACTS instead of a texture. No map ships
  # for them and none is fetched, so `look.flat` is the colour they are drawn in -- a hue from the
  # description quoted under `facts.colour`, lighter or darker in the order of `facts.albedo`. The
  # card says the colour was chosen, not measured. Every number and every sentence the card prints
  # about them names the page it was read from and the day (check_registry.py refuses a fact
  # without both).
  #
  # The moons' positions are astronomy-engine's JupiterMoons() (the L1.2 theory of Lainey, Duriez
  # and Vienne) added to Jupiter's own; there is no astronomy-engine Body for them, which is what
  # `ephemeris.moon` says. They have no rotation model there either, so only `inertial` frames:
  # a `europa-fixed` position is refused rather than turned by a guess.
  #
  # unit_km 1000, the Moon's: all five are Moon-sized, 1 188 to 2 631 km.
  - id: pluto
    aliases: ["134340 Pluto"]
    display: Pluto
    parent: sun
    radius_km: 1188.3
    unit_km: 1000
    ephemeris: {propagator: body, body: Pluto}
    # `fixed` because astronomy-engine's RotationAxis has Pluto's IAU pole and spin, which
    # propagate/frames.js already turns a body-fixed position by. The plain ball has nothing to turn.
    frames: [inertial, fixed]
    look: {flat: "#b4926f"}
    facts:
      radius: {source: "https://en.wikipedia.org/wiki/Pluto", read: 2026-09-22, says: "mean radius 1,188.3 km (infobox)"}
      albedo: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/plutofact.html", read: 2026-09-22, says: "geometric albedo 0.52"}
      what: {source: "https://science.nasa.gov/dwarf-planets/pluto/", read: 2026-09-22, says: "reclassified as a dwarf planet in 2006; beyond Neptune, in the Kuiper Belt"}
      colour: {source: "https://en.wikipedia.org/wiki/Pluto", read: 2026-09-22, says: "The color varies from charcoal black, to dark orange and white."}
      seen: {source: "https://en.wikipedia.org/wiki/Pluto", read: 2026-09-22, says: "apparent magnitude 13.65 to 16.3 (mean is 15.1) (infobox)"}

