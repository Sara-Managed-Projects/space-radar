    facts:
      radius: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/joviansatfact.html", read: 2026-09-22, says: "radius 1560.8 km"}
      albedo: {source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/joviansatfact.html", read: 2026-09-22, says: "visual geometric albedo 0.68"}
      what: {source: "https://science.nasa.gov/jupiter/jupiter-moons/europa/", read: 2026-09-22, says: "A saltwater ocean lies beneath its icy shell"}
      colour: {source: "https://en.wikipedia.org/wiki/Europa_(moon)", read: 2026-09-22, says: "a pale ... surface striated by light tan cracks and streaks"}
