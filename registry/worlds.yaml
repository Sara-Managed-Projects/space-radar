      what: {source: "https://science.nasa.gov/jupiter/jupiter-moons/ganymede/", read: 2026-09-22, says: "the largest moon in the solar system ... even bigger than the planet Mercury"}
      colour: {source: "https://en.wikipedia.org/wiki/Ganymede_(moon)", read: 2026-09-22, says: "very old, highly cratered, dark regions and somewhat younger ... lighter regions"}
      seen: {source: "https://en.wikipedia.org/wiki/Galilean_moons", read: 2026-09-22, says: "readily seen with common binoculars ... closeness to bright Jupiter makes naked-eye observation very difficult"}

  - id: callisto
