  - {"id": "geostar-2", "name": "a GEOStar-2 satellite", "file": "bus-geostar-2.glb"}
  - {"id": "dfh-4", "name": "a CAST DFH-4 satellite", "file": "bus-dfh-4.glb"}
  - {"id": "a2100", "name": "a Lockheed Martin A2100 satellite", "file": "bus-a2100.glb"}
  - {"id": "ds2000", "name": "a Mitsubishi DS2000 satellite", "file": "bus-ds2000.glb"}
  - {"id": "i-3k", "name": "an ISRO I-3K satellite", "file": "bus-i3k.glb"}
  - {"id": "i-2k", "name": "an ISRO I-2K satellite", "file": null, "note": "held: built and taken out again. The renders of the I-2K's satellites (INSAT-2A to 2E, 3A to 3E) show a long boom carrying a gold solar-sail trim tab on most of them and wings of three panels, and GCAT's shape for the bus is 'Box + 2 Pan' for some and 'Box + Pan + Ant' for five of 26; the file drew two-panel wings and no boom. A shape that leaves out the part the pictures show most plainly is a guess, so the eight satellites keep the stand-in. The draft is tools/bus-builder/i2k.py"}
  - {"id": "ekspress-1000", "name": "an ISS Reshetnev Ekspress-1000 satellite", "file": null, "note": "held: Gunter's Space Page lists eight sub-variants (1000, 1000A, 1000AM, 1000H, 1000K, 1000N, 1000NTA, 1000NTB) whose renders show different layouts (a cross of small panels, umbrella reflectors on masts, a gold ring body); one file would draw some of them wrong, and no page says which layout belongs to which satellite's variant"}
  - {"id": "ekspress-2000", "name": "an ISS Reshetnev Ekspress-2000 satellite", "file": null, "note": "held: only eight satellites in the catalogue and three different layouts in the renders; no sizes beyond GCAT's span"}
  - {"id": "spacebus-neo", "name": "a Thales Alenia Space Spacebus NEO satellite", "file": null, "note": "held: no clear picture of flight hardware or maker drawing with the all-electric layout and its sizes was found; GCAT gives only length, diameter and span"}
  - {"id": "eurostar-neo", "name": "an Airbus Eurostar Neo satellite", "file": null, "note": "held: the first six launched in 2023 and later; renders only, no size beyond GCAT's span"}
  - {"id": "boeing-601", "name": "a Boeing 601 satellite", "file": null, "note": "held: GCAT's 7 mapped satellites vary in size from 2.8 to 4.1 t and in layout (601 and 601HP); not built in this batch"}
  - {"id": "geostar-3", "name": "a GEOStar-3 satellite", "file": null, "note": "held: only six satellites; renders only; not built in this batch"}
  - {"id": "dfh-3", "name": "a CAST DFH-3 satellite", "file": null, "note": "held: only five satellites, a cylindrical-looking body in some renders and a box in others; not built in this batch"}
  - {"id": "smallgeo", "name": "an OHB SmallGEO (Luxor) satellite", "file": null, "note": "held: three satellites; not built in this batch"}
  - {"id": "amos", "name": "an IAI AMOS satellite", "file": null, "note": "held: three satellites; not built in this batch"}
  - {"id": "alphabus", "name": "a Thales Alenia Space and Airbus Alphabus satellite", "file": null, "note": "held: one satellite (Alphasat)"}
  - {"id": "geostar-1", "name": "a GEOStar-1 satellite", "file": null, "note": "held: four satellites, a small cube with GCAT span 5 to 10 m; no picture opened"}
  - {"id": "eurostar-other", "name": "an Airbus Eurostar-2000 or -3000 variant satellite", "file": null, "note": "held: three satellites, three different variants"}
  - {"id": "ekspress-other", "name": "an ISS Reshetnev satellite", "file": null, "note": "held: one satellite"}
  - {"id": "i-1k", "name": "an ISRO I-1K satellite", "file": null, "note": "held: one satellite"}
  - {"id": "i-4k", "name": "an ISRO I-4K satellite", "file": null, "note": "held: one satellite"}
  - {"id": "i-6k", "name": "an ISRO I-6K satellite", "file": null, "note": "held: one satellite (GSAT-11)"}
  - {"id": "dfh-5", "name": "a CAST DFH-5 satellite", "file": null, "note": "held: one satellite"}
