# GEOSTATIONARY BUS TABLE (release 2.0.0, batch m2-buses; forge #117).
#
# WHICH BUS EACH GEOSTATIONARY SATELLITE FLIES, SOURCED, NEVER GUESSED FROM THE NAME. site/js/scene/realmodels.js drew every
# geostationary satellite that has no model of its own as one SSL-1300 (bus-ssl1300.glb, NASA's model), 466 objects of the
# CelesTrak copy of 2026-11-05 (active, visual, stations). A name does not say a bus: INTELSAT is SSL-1300, Eurostar, Boeing 702 and
# Spacebus; ASTRA is Eurostar and A2100; JCSAT is SSL-1300 and A2100; GALAXY is SSL-1300, Boeing 601 and 702 and GEOStar. So a row is
# here only when at least one of four public sources names the bus of THAT satellite, found by its catalogue number or its launch
# designator and never by its name, and no source that names a bus names another family:
#   wikidata   the item's `spacecraft bus` statement (property P707), found by its `Satellite Catalog Number` (P377);
#              ref = the item. CC0.
#   wikipedia  the `bus` (or `satellite_bus`) line of the satellite's own infobox, the article being the one the Wikidata item
#              links; ref = the article. CC BY-SA 4.0: the field's words are quoted in `says`, nothing else is copied.
#   gunter     the `Configuration:` line of the satellite's page on Gunter's Space Page (space.skyrocket.de/doc_sdat/<ref>.htm),
#              taken only when that page's launch table names this satellite. A fact, cited; none of the site's text or pictures
#              is used.
#   gcat       the `Bus` column of McDowell's General Catalog of Artificial Space Objects (planet4589.org/space/gcat, satcat.tsv of
#              2026-11-06), by JCAT number; ref = the JCAT. CC BY 4.0. A value ending in `?` is McDowell's own doubt and is
#              not counted.
# Read on 2026-11-07. 466 satellites were looked up; 363 have a sourced bus family. 13 are DROPPED because two sources name different
# buses (BSAT-2A; YAMAL 202; EXPRESS-AM44; LUCH-5V; ARSAT 1; ARSAT 2; SES-12; EUTELSAT QUANTUM; GALAXY 33 (G-33); GALAXY 34 (G-34); LUCH-5X (OLYMP-K 2); OPTUS-X (ADS-01); GSAT-N2 (GSAT-20)), 42 have no source at all, and 48 name a bus that is not a family this table carries (Milstar, DSCS III, the
# Chinese TJS and Shijian craft, Fengyun-4, Inmarsat-3's AS-4000, the ARSAT bus, cubesats in GEO). Every one of those 103 keeps the
# SSL-1300 stand-in, and its card keeps saying that the shape is a stand-in.
# `variant` is the most specific word a source used (702SP, Eurostar-3000EOR, Spacebus-4000C3): a file stands for the family at
# its median size and does not draw the variant.
#
# `buses` says which families have a file: `file: null` is a family that is sourced here and not drawn yet, with the reason; its
# satellites keep the stand-in. scripts/gen_geo_buses_js.py mirrors the catalogue numbers of the drawn families into
# site/js/data/geobuses.js; tests/test_geo_buses.mjs checks every row.
version: 1
buses:
  - {"id": "ssl-1300", "name": "an SSL-1300 satellite", "file": "bus-ssl1300.glb", "note": "NASA 3D Resources' own SSL-1300 model (public domain), already shipped as the stand-in; for these satellites it is no longer a stand-in"}
  - {"id": "eurostar-e3000", "name": "an Airbus Eurostar E3000 satellite", "file": "bus-eurostar-e3000.glb"}
