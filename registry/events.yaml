# Event types. A row here feeds three things at once: the Next view, the .ics feeds and the
# subscription form. Adding a type is this row plus a copy template.
#
# lead_times          what a subscriber may choose. Existing apps offer a fixed set and are
#                     criticised for it in every app-store review of every competitor.
# location_dependent  true means the browser computes the local answer; the snapshot carries
#                     only the global event and no per-person data is ever stored.
# prominence          editorial priority, 1 = lead with it. A number a human edits, not a
#                     model's opinion. Rare and visual before routine. An integer 1..5.
# copy                the COPY.nextList template in site/js/copy/en.js that says it; check_copy.py
#                     refuses an enabled row whose template does not exist (spec 0031, 2026-09-23).
# enabled             optional, default true. false means the browser builds no record of this
#                     type: data/events.js reads the mirror (scripts/gen_events_js.py) and skips it.
# source: computed    astronomy-engine in the browser, no fetch. Only a type the browser really
#                     computes may say so (check_registry.py COMPUTED_EVENT_TYPES).
version: 1

events:
  - id: launch
    display: Rocket launch
    source: ll2-upcoming
    location_dependent: true      # visible from within ~800 km of the pad, after dark
    lead_times: [same-day, 1d, 1w, on-confirm]
    prominence: 3
    copy: launch
    ics: launches.ics

  - id: meteor-shower
    display: Meteor shower peak
    source: registry/showers.yaml
    location_dependent: true      # radiant altitude and moonlight decide whether it is worth it
    lead_times: [same-day, 1d, 1w]
    prominence: 2
    copy: shower
    ics: showers.ics

  - id: close-approach
    display: Asteroid passes Earth
    source: jpl-cad
    location_dependent: false
    lead_times: [same-day, 1d, 1w]
    prominence: 2
    copy: approach
    ics: close-approaches.ics

  - id: solar-eclipse
    display: Solar eclipse
    source: computed            # astronomy-engine, no fetch, as far ahead as anyone wants
    location_dependent: true
    lead_times: [same-day, 1d, 1w]
    prominence: 1
    copy: solarEclipse
    ics: eclipses.ics

  - id: lunar-eclipse
    display: Lunar eclipse
    source: computed
    location_dependent: true
    lead_times: [same-day, 1d, 1w]
    prominence: 1
    copy: lunarEclipse
    ics: eclipses.ics

  # The four turns of the year (internal #384). Worked out in the browser from the Sun's ecliptic
  # longitude (astronomy-engine Seasons): 0 and 180 degrees are the equinoxes, 90 and 270 the
  # solstices. The same instant for everybody, so not location dependent; what it means for the
  # length of a day depends on the hemisphere, and the row's sentence says both.
  - id: solstice
    display: Solstice
    source: computed
    location_dependent: false
    lead_times: [same-day, 1d, 1w]
    prominence: 3
    copy: solstice
    ics: sky.ics

  - id: equinox
    display: Equinox
    source: computed
    location_dependent: false
    lead_times: [same-day, 1d, 1w]
    prominence: 3
    copy: equinox
    ics: sky.ics

  - id: station-pass
    display: The station passes over you
    source: celestrak-stations
    location_dependent: true
    lead_times: [same-day, 1h]
    prominence: 2
    copy: pass
    ics: ""                     # per-person by nature; the calendar feed cannot express it
    default_on: false

  - id: starlink-train
    display: A fresh Starlink train
    source: celestrak-supplemental-starlink
    location_dependent: true
    lead_times: [same-day, 1d]
    prominence: 3
    copy: train
    ics: ""

  - id: reentry
    display: Something comes down
    source: space-track-tip
    location_dependent: true
    lead_times: [same-day, 1d]
    prominence: 2
    copy: reentry
    ics: reentries.ics
    enabled: false              # until the Space-Track secret exists

  - id: aurora
    display: Aurora likely
    source: swpc-kp
    location_dependent: true
    lead_times: [same-day]
    prominence: 2
    copy: aurora
    ics: ""

  - id: conjunction
    display: Two planets meet
    source: computed
    location_dependent: true
    lead_times: [same-day, 1d, 1w]
    prominence: 3
    copy: conjunction
    ics: sky.ics
    enabled: false              # no builder yet; it comes with the trip that needs one (spec 0031)

  - id: mission-milestone
    display: A spacecraft arrives somewhere
    source: ll2-events
    location_dependent: false
    lead_times: [same-day, 1d, 1w]
    prominence: 1
    copy: milestone
    ics: missions.ics
    enabled: false              # no builder yet; it comes with the trip that needs one (spec 0031)

  - id: decay
    display: Something came down
    source: celestrak-satcat
    location_dependent: false
    lead_times: []              # it already happened; it appears in Next as a note
    prominence: 4
    copy: decay
    ics: ""
    enabled: false              # no builder yet; it comes with the trip that needs one (spec 0031)

  # A dated day an agency gives for a big catalogue going public (forge #547, the awesome-space research of
  # 2026-11-23). Not computed and not fetched: each date is typed here from the agency's own page, which the
  # row names with the day it was read, and the browser builds one record per date (data/events.js). The
  # agency gives a DAY and no hour, so the record stands at noon UTC of that day (the `precision: day` rule
  # of registry/missions.yaml) and the row says the date, never a countdown in hours.
  #   dates[].object      the record whose card tells it (its "release" section, ui/releaseday.js)
  #   dates[].chip_from   from this day the top bar's chip counts to it (ui/launchchip.js, when no launch is
  #   dates[].chip_until  inside a day), through chip_until; outside them it is only a row of Coming up
  #   dates[].journal     the Journal post about it, linked from the card on and after `journal_from`
  # NOTHING ON THE MAP CHANGES ON THE DAY. A refresh of our stars from the new catalogue is a separate change,
  # made only once its data is usable and its terms have been read (the card says so).
  - id: data-release
    display: A big catalogue goes public
    source: registry/events.yaml
    location_dependent: false
    lead_times: [same-day, 1d, 1w]
    prominence: 2
    copy: dataRelease
    ics: ""
    dates:
      - id: gaia-dr4
        name: Gaia DR4
        date: 2026-12-02
        object: deep-gaia
        chip_from: 2026-11-24
        chip_until: 2026-12-04
        journal: "https://blog.spaceradar.ai/gaia-dr4-release-day/"
        journal_from: 2026-11-30
        sources:
          - {words: "ESA, Gaia data releases: 'Gaia DR4 (based on 66 months of data) 2 December 2026'", url: "https://www.cosmos.esa.int/web/gaia/release", read: 2026-11-24}
          - {words: "ESA, Gaia DR4 contents: about 2.8 billion sources, 66 months from 25 July 2014 to 20 January 2020, from the Gaia ESA Archive; no hour published", url: "https://www.cosmos.esa.int/web/gaia/dr4", read: 2026-11-24}
