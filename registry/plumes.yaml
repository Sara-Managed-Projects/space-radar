    place: {url: "https://arxiv.org/abs/2112.04627", read: 2026-10-16, says: "Mahilani and Hili at 2 E, 49 S and 28 E, 57 S; the plume columns streak westward at about 8 km (Hofgartner et al. 2022)"}
    particles: 2400
  - id: mahilani
    world: triton
    name: Mahilani
    kind: column
    lat: -49
    lon_e: 2
    height_km: 8
    tail_km: 110
    wind_m_s: 15
    tail_dir: west
    seen: {by: "Voyager 2", when: "1989-08", note: "a dark column rising to about 8 km, its cloud carried west for more than 100 km"}
    source: {url: "https://www.usgs.gov/publications/tritons-geyser-plumes-discovery-and-basic-characterization", read: 2026-10-16, says: "columns of dark material rising to an altitude of about 8 kilometers where dark clouds of material are left suspended to drift downwind over 100 kilometers (Soderblom et al. 1990, Science 250)"}
    place: {url: "https://arxiv.org/abs/2112.04627", read: 2026-10-16, says: "Mahilani and Hili at 2 E, 49 S and 28 E, 57 S; the plume columns streak westward at about 8 km (Hofgartner et al. 2022)"}
    particles: 2400

# Io's hot spots: where lava glows. Seen in Jupiter's shadow by Galileo's camera, and in the infrared
# since Voyager 1. Drawn only on the night side, as small points; their brightness is illustrative, ranked
# (Loki Patera first: about a tenth of Io's heat).
hotspots:
  - {id: loki, world: io, name: Loki Patera, lat: 13.0, lon_w: 308.8, rank: 1.0, seen: {by: "Voyager 1 (infrared)", when: "1979-03"}, source: {url: "https://en.wikipedia.org/wiki/Loki_Patera", read: 2026-10-16, says: "13 N 308.8 W; about 10% of Io's total thermal emission; IRIS on Voyager 1 measured its heat"}}
  - {id: pele, world: io, name: Pele, lat: -18.7, lon_w: 255.3, rank: 0.8, seen: {by: "Galileo (in Jupiter's shadow)", when: "1996..2000"}, source: {url: "https://en.wikipedia.org/wiki/Pele_(volcano)", read: 2026-10-16, says: "Galileo also recorded thermal emission from Pele on nearly every occasion its trailing hemisphere was imaged in Jupiter's shadow"}}
  - {id: pillan, world: io, name: Pillan Patera, lat: -12.34, lon_w: 243.25, rank: 0.7, seen: {by: "Galileo", when: "1997"}, source: {url: "https://ntrs.nasa.gov/citations/20030018895", read: 2026-10-16, says: "a high-temperature (greater than 1600 C) ... 140-km-high plume eruption during the summer 1997 event"}}
  - {id: tvashtar, world: io, name: Tvashtar, lat: 62.76, lon_w: 123.53, rank: 0.6, seen: {by: "New Horizons", when: "2007-03"}, source: {url: "https://pds-rings.seti.org/press_releases/pages/PIA09xxx/PIA09359.html", read: 2026-10-16, says: "a giant plume from the Tvashtar volcano (late February to early March 2007)"}}
  - {id: prometheus, world: io, name: Prometheus, lat: -1.52, lon_w: 153.94, rank: 0.45, seen: {by: "Galileo", when: "1997"}, source: {url: "https://www.jpl.nasa.gov/images/pia00703-active-volcanic-plumes-on-io/", read: 2026-10-16, says: "Prometheus ... near the day-night boundary (Galileo, 28 June 1997)"}}

look:
  # Io's small plumes look bluish-white in Voyager's and Galileo's violet and green (fine grains); Pele's
  # is mostly gas and faint. Not purple, not uniform: the colour is the same pale grey-blue for every vent.
  umbrella: {colour: [0.80, 0.84, 0.92], absorb: 0.04, g: 0.55, tau: 0.10}
  fountain: {colour: [0.84, 0.88, 0.96], absorb: 0.05, g: 0.55, tau: 0.16}
  # Water-ice grains a few microns across: strongly forward-scattering (Cassini saw the jets best from behind).
  jets: {colour: [0.92, 0.95, 1.00], absorb: 0.02, g: 0.75, tau: 0.06}
  # Triton's plumes are DARK: they take light from what is behind them more than they give.
  column: {colour: [0.30, 0.28, 0.26], absorb: 0.55, g: 0.35, tau: 0.35}
  hotspot: {colour: [1.00, 0.42, 0.12]}
