  # RELEASE 1.6.0, THE MOMENTS (internal spec 0079 C6): the one real voice. Its file is the AAC alone (no Opus encoder was to
  # hand), so `file` and `twin` are the same m4a and the row's kind is `clip`. The player asks for it only at its second.
  - id: a11-small-step
    kind: clip
    file: site/audio/a11-small-step.m4a
    twin: site/audio/a11-small-step.m4a
    seconds: 24
    kb: 97.1
    loop: false
    licence: "Public domain (NASA); Wikimedia Commons: \"Public domain\", credit \"Neil Armstrong/NASA\""
    source: "https://commons.wikimedia.org/wiki/File:Neil_Armstrong_small_step.wav (read 2026-11-02)"
    credit: "Neil Armstrong's first words on the Moon, NASA (1969), public domain"
    make: {original: "Neil_Armstrong_small_step.wav (8-bit mono 11 025 Hz, 265 886 bytes)", tool: "afconvert -f WAVE -d LEI16@22050, then afconvert -f m4af -d aac -b 32000"}

  # RELEASE 1.7.0, THE APOLLO 13 MOMENT (internal #1058): the two radio lines, cut from one 11.5-second recording (the gaps of the original are
  # edited out, so each line is cued on its own at the time the Flight Journal logs it). The player asks for them only at their seconds.
  - id: a13-problem-1
    kind: clip
    file: site/audio/a13-problem-1.m4a
    twin: site/audio/a13-problem-1.m4a
    seconds: 3.0
    kb: 13.1
    loop: false
    licence: "Public domain (NASA); Wikimedia Commons: \"Public domain\", artist \"National Aeronautics and Space Administration (NASA)\", the file page says it is in the public domain in the United States because it was solely created by NASA"
    source: "https://commons.wikimedia.org/wiki/File:Houston_problem.ogg (read 2026-11-03)"
    credit: "Apollo 13 air-to-ground recording, NASA (14 April 1970 GMT), public domain: John Swigert, 55:55:20"
    original: {url: "https://upload.wikimedia.org/wikipedia/commons/8/8d/Houston_problem.ogg", sha256: b2ee82189cae5ab110ddb2549c63f42b0b7c0eb0a9bc6b204a2292d2d54b479e, bytes: 54176}
    make: {original: "Houston_problem.ogg (Vorbis, mono, 11 025 Hz, 11.5 s)", from: 0, seconds: 3.0, tool: "ffmpeg -ss 0 -t 3.0, 0.2 s fade out, -ar 22050 -c:a aac -b:a 32k"}
  - id: a13-problem-2
    kind: clip
    file: site/audio/a13-problem-2.m4a
    twin: site/audio/a13-problem-2.m4a
    seconds: 1.6
    kb: 7.6
    loop: false
    licence: "Public domain (NASA); Wikimedia Commons: \"Public domain\", artist \"National Aeronautics and Space Administration (NASA)\", the file page says it is in the public domain in the United States because it was solely created by NASA"
    source: "https://commons.wikimedia.org/wiki/File:Houston_problem.ogg (read 2026-11-03)"
    credit: "Apollo 13 air-to-ground recording, NASA (14 April 1970 GMT), public domain: James Lovell, 55:55:42"
    original: {url: "https://upload.wikimedia.org/wikipedia/commons/8/8d/Houston_problem.ogg", sha256: b2ee82189cae5ab110ddb2549c63f42b0b7c0eb0a9bc6b204a2292d2d54b479e, bytes: 54176}
    make: {original: "Houston_problem.ogg (Vorbis, mono, 11 025 Hz, 11.5 s)", from: 9.9, seconds: 1.6, tool: "ffmpeg -ss 9.9 -t 1.6, 0.2 s fade out, -ar 22050 -c:a aac -b:a 32k"}
