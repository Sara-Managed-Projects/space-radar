  # b200-f9-reach: begin -- REAL RECORDINGS, HEARD WHERE THEY WERE MADE (forge #163). Six recordings NASA published, each
  # offered by the score (site/js/audio/score.js) at the stages in `heard:` while sound is on, and fetched only when the
  # visitor presses its button. `how:` is what the app tells them: `sonified` -- radio, plasma or seismic data turned
  # into sound, which no ear could hear there -- or `microphone`, sound itself. `clip` rows, one AAC file each, cut by
  # scripts/build-real-sounds.py from `make:` (afconvert: there is no Opus encoder on the machine, as for the Moments'
  # clips); the browser reads them through site/js/data/realsounds.js (scripts/gen_realsounds_js.py), never at boot.
  # InSight's Martian WIND is the audio track of NASA's 26 MB video of its air pressure sensor (no standalone audio file is
  # published on science.nasa.gov, jpl.nasa.gov or mars.nasa.gov, read 2026-11-07), read with afconvert. All six pages credit NASA with the universities and agencies that built the instrument; the files are
  # public domain as works of NASA (the three on Wikimedia Commons are tagged so, read 2026-11-07).
