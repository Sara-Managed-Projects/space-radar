version: 1
# Spec 0035: every sound the app can play. Every row is a file that ships and a credit that ships
# with it; scripts/check_registry.py check_audio() refuses a row missing a field, a `credit` that
# CREDITS.md section 9 does not carry word for word, a file or twin that is not in the tree, a
# `kb` more than 5 % off the file it describes, a bed over 600 kB, a total over 3 000 kB, a stage
# that is not one of the four, two beds for one stage, and a `source` with no read date.
#
# NOTHING HERE IS FETCHED BEFORE A GESTURE. site/js/audio/ asks for a bed the first time its rung
# is entered with sound on, and for a sting the first time it plays; a visitor who never turns
# sound on downloads none of it (spec 0035 req 1, asserted by scripts/check-drawn.mjs in CI).
#
#   kind     bed | sting
#   stage    beds only: earth (the Earth and the Moon) | world (any other world) | sun | ladder
#   file     the Opus file (64 kbps), the one budgeted
#   twin     the AAC file for a browser that cannot play Opus (Safari before 18.4)
#   seconds  length of the file
#   kb       the Opus file's size in kB (1 000 bytes), measured
#   loop     true for a bed (cut to loop seamlessly), false for a sting
#   licence  the licence, quoted from the page it was read on where it is short
#   source   the page the file came from, with the day it was read: "URL (read YYYY-MM-DD)"
#   credit   the line printed in the Sources panel and carried verbatim by CREDITS.md section 9
#   original the file that was downloaded (its URL; never committed) and its sha256
#   make     how scripts/build-audio.py cut it: `from` and `seconds` into the original, `xfade`
#            seconds of tail cross-faded into the head for a bed, `fade_out` for a sting, and the
#            loudness it is levelled to. Re-cut with:
#              python3 scripts/build-audio.py --originals DIR   (DIR holds the `make.original` files)
#
# THE CHOICE (2026-09-23). Public domain first, as spec 0035 req 9 orders. The four beds are one
# composer's CC0 drones, John Bartmann's "100 Ambient Atmospheric Soundtracks" on the Free Music
# Archive: one hand, so the four rooms sound like one building, and no beats, no melody that ends,
# nothing that tells the ear a track is looping. Each bed is the steadiest 76 s of its piece by
# momentary loudness (EBU R128, measured over every 2 s start; the start and end loudness of the
# window within 0.3 LU of each other), cut to 72 s with the last 4 s cross-faded into the first.
# The ladder bed starts 2 s after its steadiest window: cut there, its ENCODED Opus seam jumped
# 1.4 times the file's own largest step (build-audio.py --check-seams); 2 s later it is 0.15.
# NASA's own recordings were heard of and set aside for beds: the plasma-wave and sonification
# files are 5 to 22 kHz mono and would be the only lo-fi thing in the app. The three stings are
# CC0 on Freesound, taken from its HQ previews (the originals need an account to download).
audio:
  - id: bed-ladder
    kind: bed
    stage: ladder
    file: site/audio/bed-ladder.opus
    twin: site/audio/bed-ladder.m4a
    seconds: 72
    kb: 585.6
    loop: true
    licence: "CC0 1.0 Universal (public domain dedication)"
    source: "https://freemusicarchive.org/music/John_Bartmann/100-ambient-atmospheric-soundtracks-straylight-drones-collection/fake-vega-master/ (read 2026-09-23)"
    credit: "Fake Vega by John Bartmann, CC0"
