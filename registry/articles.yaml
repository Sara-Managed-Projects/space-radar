# registry/articles.yaml -- the long reads: what is new in each release (/read/index.html, /read/<slug>.html).
# Built by scripts/seo_read.py; each body is registry/articles/<slug>.md and its pictures are site/images/read/<slug>/.
# A row is data a human edits: adding an article is a row, a body and its pictures, and nothing in code.
#
# FIELDS
#   slug         the file name: /read/<slug>.html
#   title        the heading (one line)
#   short        the <title> of the page, 60 characters at most
#   description  70 to 160 characters, for a result and a link preview
#   lead         the sentence under the heading
#   release      the release it is about, "1.2.0"
#   published    the day it went up
#   hero         the picture (a file of site/images/read/<slug>/) the share card is made from
#   hero_alt     what the hero shows, for someone who cannot see it
#   open         the address in the map the article ends on, and open_label the words of its button
# THE RULES (tests/test_seo_read.py): 600 to 1 000 words; every picture has alt text and a caption and is under 300 kB;
# a heading that starts "Measured"; a link into the map. Pictures are screenshots of the live map from the `look`
# workflow (tools/README.md); the run each one came from is in the commit that added it.
version: 1

articles:
  - slug: moments-a-mission-on-one-clock
    title: "Moments: a mission replayed in 3D on one clock"
    short: "Moments: watch the Saturn V launch in 3D, on one clock"
    description: "Release 1.5.0 adds Moments, missions replayed in 3D on one clock. The first is Apollo 11's Saturn V from ignition to the escape tower."
    lead: "Release 1.5.0 adds a new kind of tour, a Moment, and its first demonstration: Apollo 11's Saturn V from ignition to the jettison of the escape tower."
    release: "1.5.0"
    published: 2026-10-30
    hero: centre-engine-out.webp
    hero_alt: "The Saturn V 45 km up, a long white plume behind it over a blue Earth."
    open: "https://www.spaceradar.ai/#moment=demo-saturn&t=-9.5"
    open_label: "Watch the Saturn V Moment"
  - slug: eleven-small-worlds-in-their-own-shapes
    title: "Arrokoth, Kleopatra and nine more small worlds in their own shapes"
    short: "Arrokoth, Kleopatra and nine small worlds in their shapes"
    description: "Release 1.5.0 draws eleven asteroids and a comet from the shape models of New Horizons, Lucy, Rosetta and radar, each on its own orbit."
    lead: "Release 1.5.0 replaces the generic rock with the shapes spacecraft and radar measured for eleven small bodies, and says on every card what was seen."
    release: "1.5.0"
    published: 2026-10-30
    hero: arrokoth.webp
    hero_alt: "Arrokoth, two reddish lobes joined at a neck, against the Milky Way."
    open: "https://www.spaceradar.ai/#go=asteroid-486958"
    open_label: "Fly to Arrokoth"
  - slug: stars-without-a-distance-and-the-farthest-light
    title: "Stars with no distance, 4 383 pulsars and the farthest galaxy"
    short: "Stars with no distance, pulsars and the farthest galaxy"
    description: "Release 1.5.0 adds 10 224 stars with no measured distance, 4 383 pulsars, the Local Group's dwarfs, quasars and MoM-z14 at redshift 14.44."
    lead: "Release 1.5.0 fills the sky with what the catalogues know, and says on every card how a distance was found, or that it never was."
    release: "1.5.0"
    published: 2026-10-30
    hero: psr-j0437.webp
    hero_alt: "The pulsar PSR J0437-4715 selected on the Milky Way's stage, with its card open."
    open: "https://www.spaceradar.ai/#go=exotic-psr-j0437-4715"
    open_label: "Fly to the nearest millisecond pulsar"
  - slug: nebulae-in-three-dimensions
    title: "Orion, the Ring and the nebulae you can fly into"
    short: "Orion, the Ring and the nebulae you can fly into"
    description: "Release 1.2.0 draws the Orion and Ring Nebulae, the Veil and three dust clouds as shapes in depth. What is measured, what is a model."
    lead: "Release 1.2.0 turned flat photographs of nebulae into shapes you can fly round, and says on every card what is measured and what is a drawing."
    release: "1.2.0"
    published: 2026-10-27
    hero: orion-turned-60.webp
    hero_alt: "The Orion Nebula turned 60 degrees from our line of sight, a bowl of lit gas."
    open: "https://www.spaceradar.ai/#go=dso-m42"
    open_label: "Fly into the Orion Nebula"
  - slug: clusters-and-the-edge
