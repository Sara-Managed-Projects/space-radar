    short: "Star clusters you can fly into, and the edge of the map"
    description: "Release 1.2.0: 33 globular and 36 open clusters as stars, four galaxy clusters, two new trips and the oldest light at the horizon."
    lead: "Clusters became stars you can fly among in release 1.2.0, and two new trips take the same idea out to the edge of the universe we can see."
